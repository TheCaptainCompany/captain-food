name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # NO job-level `if:` -- deliberately. A skipped job reports `skipped`, and branch protection
    # ACCEPTS `skipped` for a required check: the gate would be green having reviewed nothing.
    # That is the #677 defect class, and a job-level condition is one of the ways into it. The
    # draft condition that used to live here now guards the EXPENSIVE step instead (the action
    # call), so the cost saving it bought is kept while the job still reports a real conclusion.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # WRITE, not read: the review lands as a PR comment + inline comments. With `pull-requests:
      # read` the findings have nowhere to go, and the job still reports success.
      pull-requests: write
      issues: write
      # Read the `codegen` / `ci` job results instead of rebuilding them here (a `make validate`
      # inside the review would cost ~10 min of compile for a signal CI already publishes).
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # The code-review action bails out on DRAFT pull requests by design, and this repo opens a
        # draft PR at claim time (docs/BACKLOG.md) and pushes to it for the whole life of the work.
        # Every one of those pushes was paying for a review that could not produce anything.
        if: github.event.pull_request.draft == false
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          display_report: true


          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The `code-review` PLUGIN was tried first and removed. Even with `--comment`, correct
          # write permissions and zero permission denials, it posted nothing on three consecutive
          # probes: it front-loads an eligibility check (closed / draft / "trivial" / already
          # reviewed) and a confidence filter, both of which are invisible from the run. On a
          # 5-line diff carrying a deliberate oversell hole it spent 11 turns and $1.01 and left
          # the PR untouched — and it never posted the "no issues found" summary its own docs
          # promise. A direct prompt has no such gate: the instructions below ARE the contract.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out here.

            Read CLAUDE.md first: it carries the domain lens this repo is judged by. Weigh findings
            by it rather than by generic style — oversell and un-accepted orders, a paid order
            nobody is told about, the ETA, availability vs stock vs orderability, spec↔code drift
            (specs/** is the source of truth, specs/generated/** is never hand-edited), and the
            layering rule that outer crates may not be imported by inner ones.

            POST YOUR REVIEW ON GITHUB. That is the only output that exists — anything you return
            as a message is discarded unread by design (the action hides stdout).
            - `gh pr comment` for the summary. Post one EVERY time, including when you find
              nothing: "reviewed, no findings" is the signal that the reviewer ran.
              The LAST non-empty line of that comment must be exactly:
                  Reviewed-Commit: ${{ github.event.pull_request.head.sha }}
              COPY THAT SHA FROM THIS PROMPT. Do not derive it from the working tree: on a
              pull_request event the checkout is the MERGE commit, so `git rev-parse HEAD` reports
              a different sha than the one named above. (The assertion accepts either, but the
              prompt is the reliable source.)
              A later step ASSERTS that marker and fails the job without it. It is what
              distinguishes "this commit was reviewed" from "some earlier commit was reviewed":
              comments survive pushes, so a bare "a review comment exists" is satisfied by a
              verdict on a diff that no longer exists. It must be LAST so that a marker quoted
              inside a code fence, in a comment that is not a review, cannot satisfy the gate.
            - `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for each
              specific issue, anchored to the line it concerns.
            Be concrete about consequence: name what breaks, for whom, and under what input.
          # Tool permissions MUST live here, not in .claude/settings.json: the action restores
          # .claude/** from origin/main because the PR head is untrusted, and the interactive
          # allowlist does not cover what a reviewer needs (`gh pr comment`, the inline-comment
          # MCP tool) — the first runs of this workflow logged 41 permission denials each.
          # `permission_denials_count` in the run's result JSON is the health metric: it must be 0.
          # MODEL PINNED TO OPUS 5 (founder directive 2026-08-24) — as a YAML comment, NOT
          # inside the block scalar below: `claude_args: |` is a literal block, so a `#` line
          # there would be passed to the CLI as an argument, not stripped as a comment.
          # The reviewer is a quality gate on a spec-driven repo and runs on the top model by
          # DECISION, not by default: this pin is what makes that explicit and survives the
          # action changing its own default. `model:` as an action INPUT is DEPRECATED in v1;
          # `--model` inside claude_args is the RECOMMENDED form — the migration path the
          # action's own usage docs give (the input still functions; deprecated != unsupported).
          # NOTE (2026-08-24): runs from 16:39Z failed with `api_error_status: 429` /
          # "You're out of usage credits. Switch to another model to continue." — an
          # account-level billing condition, NOT a code one. The answer is to restore the
          # allowance, not to downgrade the reviewer; a red claude-review with that result
          # string means credits, and no workflow edit can fix it.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh api repos/TheCaptainCompany/captain-food:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Task"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # ── #677: a required check that can pass without doing its job ──────────────────────────
      # The claude-code-action performs its own workflow validation and, when a PR modifies this
      # very workflow file, REFUSES TO RUN AND EXITS 0. `claude-review` is a REQUIRED status check
      # in the `main` ruleset, so such a PR reports a green review gate with no review performed --
      # the check clears itself. The same green appears whenever the action cannot produce a
      # verdict at all: credit exhaustion (`api_error_status: 429`, see the note above), a model
      # outage, permission denials.
      #
      # WHAT THIS STEP ACTUALLY PROVES, stated exactly, because the name is shorter than the truth:
      # that a comment authored by a GitHub App bot, whose LAST non-empty line is a Reviewed-Commit
      # marker naming this PR's head or merge commit, exists on this PR. It does NOT and CANNOT
      # prove WHICH bot produced it -- this repo's own mob-lens sessions post under the identical
      # `claude[bot]` identity, indistinguishable by any field available here. So the gate is a
      # tripwire against the silent no-verdict paths above, not an authentication of the reviewer.
      # Anyone quoting a marker line into a comment can satisfy it; do not do that (see below).
      #
      # WHAT IT DOES NOT FIX, so nobody reads it as more than it is: a workflow file cannot make
      # itself required or un-required, and cannot stop the ruleset accepting `skipped`. This is a
      # VERDICT-HONESTY fix. Requiredness lives in the `main` ruleset -- DECISIONS §45 REV-1
      # and #593, still open.
      #
      # `!cancelled()` rather than `always()`: a cancelled run (superseded push, manual cancel) is
      # not a missing review, and labelling it one trains readers to discount this red.
      - name: Assert a bot verdict naming this commit exists
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `actions/checkout` on a pull_request event checks out the MERGE ref, so a reviewer that
          # resolves "this commit" with `git rev-parse HEAD` reports THIS sha, not head.sha. Both
          # are accepted; anything else is stale.
          MERGE_SHA: ${{ github.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$IS_DRAFT" = "true" ]; then
            echo "draft PR - the review step is skipped by design, nothing to assert."
            exit 0
          fi
          # An empty or malformed sha would build a marker that a STALE comment satisfies, and
          # `set -u` does not catch it: GitHub sets the variable to empty, it does not unset it.
          for v in HEAD_SHA MERGE_SHA; do
            eval "val=\${$v}"
            case "$val" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *) echo "::error::$v is empty or not a hex sha - refusing to assert against a marker that anything could satisfy."; exit 1 ;;
            esac
            [ "${#val}" -eq 40 ] || { echo "::error::$v is ${#val} chars, expected 40."; exit 1; }
          done
          # The whole match runs inside jq, reading the shas from the environment:
          #   * only GitHub App bot comments (`user.type == "Bot"`);
          #   * the marker must be the comment's LAST non-empty line, so a marker QUOTED inside a
          #     code fence or mid-body does not satisfy the gate;
          #   * the printed hex must be a PREFIX (>=7 chars) of head or merge sha -- the reviewer
          #     writes abbreviated and decorated shas in practice, and requiring a bare 40-char
          #     string would red every real review. A stale sha still fails: it differs early.
          # NO PIPE into grep: `printf | grep -q` makes grep exit at the first match, printf die of
          # SIGPIPE, and `pipefail` report 141 -- a FALSE RED once the matching comment is followed
          # by more than a pipe buffer (64 KiB) of other comments. Measured; PR #674 is already at
          # ~35 KB. A false red here is a repo-wide merge stop, which is #593 exactly.
          hits="$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '
            [ .[]
              | select(.user.type == "Bot")
              | .body
              | split("\n")
              | map(select(test("\\S")))
              | (last // "")
              | (capture("^[*_ ]*Reviewed-Commit:?[*_ ]*[ \t]*`?(?<h>[0-9a-f]{7,40})`?[.*_ ]*$") // empty)
              | .h
              | . as $h
              | select((env.HEAD_SHA | startswith($h)) or (env.MERGE_SHA | startswith($h)))
            ] | length')"
          # A gh/API failure aborts under `set -e` above: an API error must never read as "no
          # review", and must never read as a pass either.
          case "$hits" in
            ''|*[!0-9]*) echo "::error::could not read the comment list (got: '$hits')."; exit 1 ;;
          esac
          if [ "$hits" -gt 0 ]; then
            echo "OK - $hits bot verdict(s) name this commit (head $HEAD_SHA / merge $MERGE_SHA)."
            exit 0
          fi
          echo "::error::No review was performed on this commit. No bot comment ends with a Reviewed-Commit marker naming $HEAD_SHA (or merge $MERGE_SHA)."
          {
            echo "claude-review is a REQUIRED check, so a green here without a review is the #677 defect."
            echo "A red here means NO VERDICT WAS PRODUCED. It does NOT mean the reviewer found a problem."
            echo "Known causes, in the order worth checking:"
            echo "  1. This PR modifies .github/workflows/claude-code-review.yml. The action performs"
            echo "     workflow validation, refuses to run, and EXITS 0. Look for"
            echo "     'Exiting due to workflow validation skip' in the review step log. This is the"
            echo "     self-clearing case #677 exists for: it needs a human decision, never a carve-out"
            echo "     in this file -- the carve-out IS the hole."
            echo "  2. Credits exhausted: api_error_status 429 / out of usage credits. An account-level"
            echo "     billing condition; no workflow edit fixes it. Restore the allowance."
            echo "  3. Permission denials (permission_denials_count must be 0) -- the reviewer ran"
            echo "     blindfolded and had nowhere to put its findings."
            echo "  4. The reviewer ran but did not END its summary with the Reviewed-Commit line."
            echo "     The marker must be the LAST non-empty line of the comment."
            echo "DO NOT satisfy this gate by pasting a marker line into a comment. It is a tripwire"
            echo "for the no-verdict paths above, and quoting one destroys the only signal it carries."
          } >&2
          exit 1
