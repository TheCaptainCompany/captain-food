# Apply database migrations with sqlx-cli (ADR-0043) — AFTER a deploy, never before one
# (ADR-20260730-051500; previously this ran straight off a green `ci` on main).
#
# WHY after the deploy: migrating first proved dangerous the day Render was paused (outbound
# bandwidth exhausted) — the schema would have converted underneath an OLD binary that a replacement
# could never reach, breaking production with no rollout to fix it. So this now follows the manual
# `deploy` workflow: the schema only ever moves once a new binary has actually been sent to Render.
# The app's /health schema-version gate holds the new instance (503) until this lands, so the rollout
# converges whichever of the two finishes first.
#
# WHY it also WAITS for the new build to be serving: the `deploy` job only POSTs the Render deploy
# hook and exits (fire-and-forget, #281) -- it returns in ~20s while the rollout takes minutes. So
# "deploy succeeded" meant "the hook was accepted", not "the new binary is live", and this job would
# convert the schema UNDER THE OLD BINARY. Observed 2026-08-03: the width-100 -> width-5 mailbox
# re-stamp (20260802220000) ran while the previous binary was still serving, and any row that binary
# enqueued in the window was stamped for the retired keyspace -- lanes the new one never claims.
# So: poll /health (which carries `version` = the build's git SHA, ADR-20260721-175411) with
# exponential backoff until it reports the SHA this deploy shipped, and only then migrate. A new
# instance answers 503 `schema_behind` until this job lands, so the wait deliberately accepts ANY
# status code and reads the body -- 503 with the right version is exactly the state to migrate in.
#
# If the expected build never appears, the job FAILS without migrating: a schema that moved for a
# binary that never arrived is the one failure this ordering exists to prevent (ADR-20260730-051500).
# A rollback deploy (`tag` input pointing at an older image) therefore times out here by design.
#
# `sqlx migrate run` is idempotent (applies only pending migrations), so running it after every deploy
# is safe. The manual dispatch stays for exceptional runs (e.g. re-running after a space failure);
# use `skip_deploy_check` when running it deliberately against an already-settled deployment.
# Requires repo secret DATABASE_URL = the Supabase Session-pooler string (5432, ?sslmode=require).
name: db-migrate

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      skip_deploy_check:
        description: "Skip the wait-for-deployed-build check (exceptional manual runs only)"
        type: boolean
        default: false
      # The PREPARED CNPG retarget (#360, ADR-20260807-002705 D6: migrations applied FRESH at
      # cutover), gated behind this input: the default stays supabase, the workflow_run path
      # never selects cnpg, and flipping the DEFAULT is a separate one-line ADR at cutover --
      # gate-then-stabilize. The cnpg path reaches the in-cluster database through a kubectl
      # port-forward using the MKS_KUBECONFIG repo secret (#358's deliverable) and the
      # operator-generated captain-db-app credentials -- no separate DATABASE_URL secret to
      # drift. It deliberately skips the /health build-version wait: pre-cutover there is no
      # serving app on CNPG, and the schema-version /health gate (ADR-20260730-051500) holds
      # the app side instead.
      target:
        description: "Migration target: supabase (default, today's production) or cnpg-port-forward (prepared cutover path)"
        type: choice
        options:
          - supabase
          - cnpg-port-forward
        default: supabase

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # Only proceed when the gating deploy succeeded (or a human dispatched this directly).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The deploy's exact commit; on manual dispatch, the ref the run was dispatched on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait for the deployed build to be serving
        # Render path only: the CNPG target has no serving app pre-cutover (see the input's note).
        if: ${{ !inputs.skip_deploy_check && inputs.target != 'cnpg-port-forward' }}
        env:
          # The commit this run is migrating for: the deploy's own head_sha, or the dispatched ref.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The MARKETPLACE host, not `api.` (#358): the generated Ingress routes no `api.` host at
          # all — role = path per audience host there (ADR-0006) — so a check hard-wired to `api.`
          # would start failing the moment the cutover lands, on a job that gates every schema
          # change. `live.` is served identically by the monolith today and by fo-marketplace after.
          HEALTH_URL: https://live.captain.food/health
          # Render rollouts take minutes (image pull + boot + health gate); 15 min is generous but
          # finite -- an unbounded wait would hold the schema hostage to a stuck rollout.
          DEADLINE_SECONDS: "900"
        run: |
          set -uo pipefail
          expected="${EXPECTED_SHA:0:7}"   # /health reports the SHORT sha (build_version(), ADR-20260721-175411)
          echo "waiting for ${HEALTH_URL} to report version=${expected} (deadline ${DEADLINE_SECONDS}s)"
          deadline=$(( $(date +%s) + DEADLINE_SECONDS ))
          delay=10
          last="<no response yet>"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # ANY status is fine: a new instance answers 503 schema_behind until this job migrates,
            # and that body still carries the version we are waiting for. `|| true` keeps a transient
            # 502 during the container swap from killing the job.
            body=$(curl -sS -m 15 "$HEALTH_URL" 2>/dev/null || true)
            live=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
            if [ -n "$live" ]; then
              last="$live"
              if [ "$live" = "$expected" ]; then
                echo "live: version=${live} -- the deployed build is serving, migrating now"
                printf '%s\n' "$body"
                exit 0
              fi
            fi
            echo "still ${last:-unknown} (want ${expected}) -- retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 )); [ "$delay" -gt 60 ] && delay=60
          done
          echo "::error::${HEALTH_URL} never reported version=${expected} within ${DEADLINE_SECONDS}s (last seen: ${last}). NOT migrating -- moving the schema under a binary that never arrived is the exact hazard this ordering prevents (ADR-20260730-051500). If this was a rollback deploy, that timeout is by design."
          exit 1
      - uses: taiki-e/install-action@v2 # Node 24; installs a prebuilt sqlx-cli in seconds (no toolchain/cargo-install)
        with:
          tool: sqlx-cli
      - name: Apply migrations
        if: ${{ inputs.target != 'cnpg-port-forward' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: sqlx migrate run --source migrations
      - name: Apply migrations via CNPG port-forward (gated cutover path, #360)
        if: ${{ inputs.target == 'cnpg-port-forward' }}
        env:
          MKS_KUBECONFIG: ${{ secrets.MKS_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${MKS_KUBECONFIG}" ]; then
            echo "::error::MKS_KUBECONFIG repo secret is not provisioned (#358 deliverable) -- the CNPG path is gated on it and fails loudly rather than guessing"
            exit 1
          fi
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "${MKS_KUBECONFIG}" > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"
          # App credentials come from the operator-generated captain-db-app secret -- reading
          # them at run time means there is no second copy of the password to rotate or drift.
          PGPASS=$(kubectl -n captain-prod get secret captain-db-app -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::${PGPASS}"
          kubectl -n captain-prod port-forward svc/captain-db-rw 15432:5432 &
          PF_PID=$!
          trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null && { exec 3>&- 3<&-; break; }
            [ "$i" = "30" ] && { echo "::error::port-forward to captain-db-rw never became ready"; exit 1; }
            sleep 2
          done
          DATABASE_URL="postgresql://app:${PGPASS}@127.0.0.1:15432/app" sqlx migrate run --source migrations
