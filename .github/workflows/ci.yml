name: ci

# Enforces the operating-model rule "specs/*.yaml are the source of truth; everything else is
# generated". On every push/PR we validate the DSL, regenerate every artifact, and fail if the result
# differs from what was committed — i.e. someone changed the specs (or an emitter) without regenerating.
# This guarantees the committed generated artifacts never drift from the specs.
#
# The gate is the Rust codegen (tools/codegen-rs, ADR-0034). The earlier TypeScript codegen reached full
# parity (byte-identical artifacts + identical validation issue set) and has been retired.
# The gate runs on EVERY branch push (not just main) so a feature branch is validated even before a
# PR exists; `pull_request` stays for forked PRs. Duplicate push+PR runs on an open PR are accepted.
#
# DOCS-ONLY CHANGES SKIP THE GATE (product-owner directive, 2026-07-28): a push touching only
# docs/** (+ root README.md / CLAUDE.md / LICENSE) has nothing to validate or regenerate — proposals
# and ADRs go straight to `main` and must not cost a full Rust build. Implemented as a job-level
# `if:` on a cheap `changes` detector job, NOT as workflow-level `paths-ignore`: `codegen` is a
# REQUIRED status check on `main`, and a required check whose workflow never triggers leaves a PR
# stuck on "Expected - waiting for status" forever, while a job skipped by `if:` reports `skipped`,
# which branch protection accepts. specs/** (including its .md files: database.md, the generated
# docs) is deliberately NOT in the docs-only list - spec markdown participates in drift checking.
# Anything ambiguous (new branch's first push, unreachable force-push base, empty diff) fails open:
# the full gate runs.
on:
  push:
    # every branch EXCEPT `badges` (workflow-written badge JSON only — nothing to gate)
    branches: ['**', '!badges']
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Cheap detector (~10s): is this change confined to documentation? Outputs docs_only=true only
    # when the diff is non-empty, the base commit is resolvable, and EVERY changed file is
    # documentation - any doubt means false, so the full gate runs (fail-open).
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need the base commit to diff against
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: diff the PR head against its base branch (merge-base via three-dot below).
          # Push: diff the pushed range; `before` is all-zeros on a branch's first push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$ZERO" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            # Three-dot: changes introduced since the merge-base - right for PRs, and identical to
            # two-dot for a linear push; a force-push with an orphaned base was caught by cat-file.
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  docs/*|README.md|CLAUDE.md|LICENSE) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only (base=$BASE_SHA head=$HEAD_SHA event=$EVENT_NAME)"

  codegen:
    needs: changes
    # Skipped (not failed) on docs-only changes - branch protection accepts a skipped required check.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Cache ~/.cargo + target/ keyed on Cargo.lock + toolchain, so repeat runs only recompile the crates
      # that actually changed (not the ~200 dependencies) — the main CI-duration win. (db-migrate needs no
      # build cache: it runs a prebuilt sqlx-cli, so there is no artifact worth sharing between the two.)
      - uses: Swatinem/rust-cache@v2

      - name: Build the workspace (codegen + all layer crates — enforces the ADR-0035 dependency graph)
        run: cargo build --workspace --verbose

      - name: Compile-check the wasm32 hydrate build (split 4/4 of #21 — the bundle itself is built in build-image.yml's Docker step)
        run: |
          rustup target add wasm32-unknown-unknown
          make wasm

      - name: Unit tests (whole workspace)
        run: cargo test --workspace --verbose

      - name: Validate the specs (full validator §1–§11 — the blocking gate)
        run: cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --check --specs specs

      - name: Regenerate every artifact + fail on spec↔generation drift
        run: |
          # Regenerate, then fail if the result differs from what's committed. EOL-tolerant: the repo is
          # authored on Windows (CRLF) while CI runs on Linux (LF), and the generator's output inherits its
          # line endings from the source — only genuine content drift should fail, never CRLF-vs-LF.
          cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --specs specs
          if ! git diff --quiet --ignore-cr-at-eol; then
            echo "::error::Generated artifacts are stale — run 'make generate' and commit the result so the repo matches specs/."
            git --no-pager diff --ignore-cr-at-eol --stat
            git --no-pager diff --ignore-cr-at-eol
            exit 1
          fi
          # Catch brand-new generated files that were never committed.
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated files are not committed — run 'make generate' and commit:"
            echo "$untracked"
            exit 1
          fi
          echo "✓ generated artifacts match the specs"
