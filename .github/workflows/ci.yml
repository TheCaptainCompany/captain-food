name: ci

# Enforces the operating-model rule "specs/*.yaml are the source of truth; everything else is
# generated". On every push/PR we validate the DSL, regenerate every artifact, and fail if the result
# differs from what was committed — i.e. someone changed the specs (or an emitter) without regenerating.
# This guarantees the committed generated artifacts never drift from the specs.
#
# The gate is the Rust codegen (tools/codegen-rs, ADR-0034). The earlier TypeScript codegen reached full
# parity (byte-identical artifacts + identical validation issue set) and has been retired.
# The gate runs on EVERY branch push (not just main) so a feature branch is validated even before a
# PR exists; `pull_request` stays for forked PRs. Duplicate push+PR runs on an open PR are accepted.
#
# DOCS-ONLY CHANGES SKIP THE GATE (product-owner directive, 2026-07-28): a push touching only
# docs/** (+ root README.md / CLAUDE.md / LICENSE) has nothing to validate or regenerate — proposals
# and ADRs go straight to `main` and must not cost a full Rust build. Implemented as a job-level
# `if:` on a cheap `changes` detector job, NOT as workflow-level `paths-ignore`: `codegen` is a
# REQUIRED status check on `main`, and a required check whose workflow never triggers leaves a PR
# stuck on "Expected - waiting for status" forever, while a job skipped by `if:` reports `skipped`,
# which branch protection accepts. specs/** (including its .md files: database.md, the generated
# docs) is deliberately NOT in the docs-only list - spec markdown participates in drift checking.
# Anything ambiguous (new branch's first push, unreachable force-push base, empty diff) fails open:
# the full gate runs.
#
# PARALLEL JOBS (#356). The gate used to be ONE sequential job: machete -> build -> wasm -> unit
# tests -> migrations -> DB suites -> validator -> drift. The validator runs in SECONDS but sat
# behind the entire Rust build and both test suites, so the cheapest and most frequently failing
# gate gave the slowest feedback. The work is now four independent jobs that start together; wall
# clock becomes the slowest one instead of the sum. This costs nothing: GitHub Actions is free and
# unlimited on this PUBLIC repo, which is exactly why ADR-20260721-175411 put the build here rather
# than on the hosting platform. No hosting choice - PaaS, Kubernetes or an instance - changes this
# workflow's duration by one second.
#
# `codegen` SURVIVES AS THE REQUIRED CHECK, and is now an aggregator. Read the comment on that job
# before touching it: a `needs:` job that FAILS makes its dependents `skipped`, and (per the
# docs-only note above) branch protection ACCEPTS `skipped`. An aggregator that relied on `needs:`
# alone would therefore turn every red build green. It asserts the upstream results explicitly.
on:
  push:
    # every branch EXCEPT `badges` (workflow-written badge JSON only — nothing to gate)
    branches: ['**', '!badges']
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Cheap detector (~10s): is this change confined to documentation? Outputs docs_only=true only
    # when the diff is non-empty, the base commit is resolvable, and EVERY changed file is
    # documentation - any doubt means false, so the full gate runs (fail-open).
    runs-on: ubuntu-latest
    # EVERY OTHER JOB `needs:` THIS ONE, AND `codegen` -- the REQUIRED check on `main` -- reds on
    # `needs.changes.result == failure`. So a hang here does not merely lose signal: nothing in the
    # repository can merge until it clears, on any branch, for any diff. With no `timeout-minutes`
    # that window is GitHub's 360-minute default, and this job now runs a suite that drives python3
    # at ~14 sites and builds non-UTF-8 paths, symlink PATH fixtures, an ASCII-locale probe and a
    # poisoned sqlite file -- whose own step comment enumerates three host-drift classes as EXPECTED
    # failure modes. Compose that with peak (CLAUDE.md: Friday/Saturday 19:00-21:30) and a runner
    # image bump has a path to "no checkout, dispatch or payments fix merges for six hours", at the
    # hours where a paid order nobody is told about is the failure that costs most.
    # 10 minutes is orders of magnitude above anything this job legitimately does -- seconds of
    # shell, plus the checkout. That checkout is `fetch-depth: 0`, i.e. a FULL-HISTORY clone, and
    # this line said "a shallow diff" for a round: it is the one cost in this job that grows with
    # the REPOSITORY rather than with the diff, which is worth naming inside the justification for
    # a cap whose failure blocks every merge. It holds comfortably at today's size (~15s observed
    # for the whole job); if the clone ever dominates, that is a capacity signal, not a hang.
    # So the cap bounds a HANG AND NOTHING ELSE -- the multiplier this line
    # used to state was a bare derived number, and review #45 measured it as ~43x where the line
    # said ~30x. Right in the conservative direction and still the shape ADR-20260817-105845
    # governs, so the figure is gone rather than corrected. And what the cap DOES cover is worth
    # saying out loud, because the far likelier event is a RED, and a red has the SAME blast
    # radius: `changes` fails, all five downstream jobs are skipped, `codegen` reds on
    # `needs.*.result`, nothing merges. The timeout turns a six-hour worst case into ten minutes and
    # does nothing at all for the case where the suite runs to completion and fails. That case is
    # DESIGNED IN: T3/T3b/T3c ("controlled PATH not constructible", "stub bun + symlinks
    # unavailable") and T15g's ASCII control are deliberately hard `verdict bad` rather than skips,
    # on the stated reasoning that a harness which cannot build its own setup must not be laundered
    # into a green. That is right for the CASE and it is what makes a runner-image bump a
    # repository-wide merge block. Only `GATE-STEP-LOCUS` option (a) -- a sibling always-run job the
    # aggregator treats equally -- closes it, and moving the step is `RETRIEVAL-QMD-CI`'s to
    # authorize, not this change's.
    #
    # AND A CAP HERE CLOSES ONE DOOR OF SIX. `codegen` is `if: always()`, and `always()` still
    # WAITS for a `needs:` job to finish -- so a job that HANGS (rather than fails) keeps the
    # required check queued indefinitely, auto-merge never fires, and nothing merges. `cargo build`
    # stalling on a registry hiccup in `build-test`, or the `postgres` service never becoming
    # healthy in `db-test`, does exactly that at GitHub's 360-minute default. Every job the
    # aggregator consumes therefore carries a cap, and `assert_pinned_in_changes_job` requires one
    # on each -- derived from `codegen`'s own `needs:`, like the `continue-on-error` sweep beside
    # it, so a job added to the aggregator is covered when it is added. The heavy jobs get 60
    # minutes -- and THAT FIGURE WAS A BARE DERIVED NUMBER with no antecedent, in the branch about
    # bare derived numbers (review #57). What is measured: `build-test` ~4m17s and `db-test` ~3m54s
    # WARM, read off real runs on this branch. What is NOT measured, and could not be here, is the
    # COLD-cache duration -- `cargo build --workspace` over ~200 deps, then a SECOND full target
    # (`rustup target add wasm32-unknown-unknown` + `make wasm`), then `cargo test --workspace`
    # recompiling with cfg(test) and linking a binary per crate, on a 4-core hosted runner.
    #
    # THE FAILURE DIRECTIONS ARE NOT SYMMETRIC, which is what decides the value. Too HIGH costs a
    # hang some extra minutes. Too LOW cancels the job, `codegen` fails on `cancelled` BY DESIGN,
    # the required check reds and nothing in the repository merges -- and `Swatinem/rust-cache`
    # does not save on a cancelled job, so every re-run is cold again and hits the same wall. Cold
    # cache is routine, not exotic: the key is `Cargo.lock` + toolchain, so an ordinary dependency
    # bump or a `dtolnay/rust-toolchain@stable` roll invalidates it. The escape is a two-file
    # cross-language edit authored while the repo cannot merge.
    #
    # So the heavy jobs are bounded at 120 -- deliberately well above any cold build this workspace
    # plausibly produces, and still 3x better than GitHub's 360-minute default. It bounds a HANG.
    # It is NOT a duration budget, and it is not claimed to be sized against a measurement that was
    # never taken. If a cold run ever approaches it, that is a CAPACITY signal: read the duration
    # off that run, state it here, and raise both this value and the bound in `tests.rs` in the
    # same commit. (Review #44 set 60; review #57 named it unantecedented and it was raised.)
    # It does NOT settle `GATE-STEP-LOCUS` (in-job vs sibling job); that row stays open, and this is
    # the interim mitigation it names. Pinned by `assert_pinned_in_changes_job`, which requires the
    # key and caps it -- removing it or setting it to hours reds, by name.
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need the base commit to diff against
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: diff the PR head against its base branch (merge-base via three-dot below).
          # Push: diff the pushed range; `before` is all-zeros on a branch's first push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$ZERO" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            # Three-dot: changes introduced since the merge-base - right for PRs, and identical to
            # two-dot for a linear push; a force-push with an orphaned base was caught by cat-file.
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  docs/*|README.md|CLAUDE.md|LICENSE) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only (base=$BASE_SHA head=$HEAD_SHA event=$EVENT_NAME)"
      # The ask-gate's own guard, on EVERY change — docs-only included. This job is the one
      # always-run job with a checkout (no `if:`), so a broken register-check hook cannot ship
      # silently on the paths that skip the Rust suites; pure shell, ~200ms. Pinned by the
      # `the_hook_selftest_runs_in_the_always_run_changes_job` codegen test (2026-08-21 hardening).
      - name: Register-check hook selftest (the ask-gate must never be disarmed silently)
        run: bash .claude/hooks/register-check-selftest.sh
      # The decision-lookup wrapper carries a supply-chain gate (pinned + scriptless install,
      # structural bun.lock version-integrity binding, delete-wholesale corrupt-index handling) and
      # SKILL.md declares this suite its authority - so it must run somewhere that is not the
      # author's machine. It is hermetic: stubs only, no network, no install, and it never touches a
      # real .qmd/ cache. Pure bash + python3, seconds, no Rust, so it belongs in this always-run
      # job rather than behind the docs-only skip. Authorized by decision row RETRIEVAL-QMD-CI
      # (ADR-20260824-205911) - that row authorizes THIS STEP AND ITS PIN AND NOTHING ELSE in CI.
      # Pinned by the `the_stub_suite_runs_in_the_always_run_changes_job` codegen test, which
      # asserts over PARSED YAML: this step is located by its `run` VALUE and its key set must be
      # exactly {name, run}, so `|| true`, a trailing `; exit 0`, a step-level `if:` in ANY
      # spelling, `shell:`, `env:` or `continue-on-error` all red it - as do a job-level `if:` /
      # `continue-on-error` / `strategy`, and, at BOTH workflow and job scope (the job half was
      # deleted once by a refactor and measured green again by review #8), a `defaults.run.shell`
      # that is not a bare shell name, or an `env` key that changes how scripts EXECUTE (PATH,
      # BASH_ENV, LD_PRELOAD, ...) or names a gate script's self-verification opt-out. No non-gate
      # step may mention `.claude`, `GITHUB_ENV` or `GITHUB_PATH` anywhere in its definition, only
      # `actions/checkout` may be `uses:`d here. On the TRIGGERS the pin checks CONTAINMENT, not
      # absence: no `paths`/`paths-ignore`/`branches-ignore`; `push.branches` must still contain
      # `**` (so `!badges` and future exclusions are fine); `pull_request.types`, if set, must still
      # cover opened/synchronize/reopened (widening is fine); `pull_request.branches` must still
      # admit `main`. A fork PR produces no push, so that trigger is its only coverage. (An earlier
      # version of this line said "no path, branch or type filter", which would have had a reader
      # delete `!badges` from line 40 to satisfy a rule the pin does not have -- key-presence vs
      # dangerous content, the instrument this file has retracted three times.)
      # What that does NOT reach is written in the test's own comment; it is not restated here,
      # because three copies of a residual statement is how the last one came to be wrong.
      # READ THE MESSAGE, read this before "fixing" a red: the suite asserts COMPLETENESS -- every
      # declared case must reach a verdict (pass + fail + skip == EXPECTED_CASES). A legitimate
      # host-capability SKIP is loud but GREEN; what reds is a case that stops running at all.
      #
      # A `precondition` in a red message names the disjuncts that could have produced it, for THAT
      # case. Classify by which one actually fired, not by a rule stated here:
      #   * a seeded build, a seeded cache, or the wrapper's own format ("PIN/INTEGRITY not
      #     extractable from wrapper") => a WRAPPER DEFECT. The thing this step exists to protect
      #     is broken. Investigate; never adapt around it.
      #   * a host capability (locale, filesystem, python3, a controlled PATH) => usually drift,
      #     fixed by ADAPTING THE CASE to the host -- EXCEPT where the message says the failure is
      #     loud by design (T15g's ASCII-control mkdir exists to stop ENOSPC/EROFS/EACCES being
      #     swallowed, so it is investigated, not adapted).
      #   * a HARNESS-CONSTRUCTION disjunct -- "sqlite3 poisoning failed", "exit-7 poisoning
      #     failed", "TypeError / attribute-less / non-class Error shim failed", "sitecustomize
      #     noise failed" -- is a THIRD case, and six of the seventeen sites carry one. The fixture
      #     the case needs could not be built: the harness is broken. Investigate it; adapting the
      #     case would delete the coverage rather than restore it. (An earlier version of this
      #     comment claimed two classes sufficed and that the exceptions announced themselves --
      #     true of T15g only, which is why the third class is named here instead.)
      #
      # Never delete a case and never weaken an assertion to recover green: this step is the only
      # thing standing behind the wrapper's supply-chain gate.
      - name: decision-lookup hermetic stub suite (the wrapper's supply-chain gate must stay proven)
        run: bash .claude/skills/decision-lookup/scripts/stub-tests.sh

  lint:
    # D6 lint floor (PROP-20260802-130500, #302): an unused dependency is an unheld capability
    # someone can silently start using. cargo-machete is static analysis over manifests + source
    # (NO compilation), so it is its own job now rather than a fail-fast step in front of the build —
    # it reports in well under a minute instead of gating anything. False positives are excused per
    # crate via `[package.metadata.cargo-machete] ignored = [...]` — a visible, reviewable manifest
    # diff, in the same spirit as the D3 capability allowlist.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # 60, NOT 20, AND THE JOB'S OWN COMMENTS SAY WHY: cargo-machete is static analysis, but this
    # job also runs `cargo clippy --workspace --all-targets`, which the rust-cache step below calls
    # "a full check-build of the workspace" -- and `--all-targets` compiles the test targets too. It
    # was bucketed with `specs`/`docs-validate`, which genuinely build only `tools/codegen-rs`. The
    # cap fires only on a cold cache, and cold is routine: `dtolnay/rust-toolchain@stable` rolls
    # every ~6 weeks and rekeys every job at once, a `Cargo.lock` bump does the same, and GitHub
    # evicts at 7 days / 10 GB. Before this change a slow cold `lint` was slow; now it FAILS,
    # `codegen` reds on `needs.lint.result`, and nothing in the repository merges. That is the
    # "a cap that reds honest work" instrument landing on the one job in the cheap bucket that is
    # not seconds of work. (Review #58.)
    #
    # 120, NOT 60, AND THE FIRST VALUE REPEATED ROUND 57'S DEFECT ONE JOB OVER (review #61). Round
    # 58 argued at length why `lint` must not be 20 and then picked 60 with no antecedent -- while
    # `build-test`, whose work this job's own justification calls the same class, got 120 on the
    # stated reasoning that its cold duration was never measured. No cold `lint` duration is cited
    # anywhere on this branch either. The asymmetry above applies unchanged: too high costs a hang
    # a few minutes; too low CANCELS, `codegen` fails on `cancelled` by design, the required check
    # reds, and rust-cache saves nothing on a cancel so the re-run is cold and hits the same wall --
    # reached by a `Cargo.lock` bump or a toolchain roll, which rekey EVERY job at once, so the run
    # where `lint` is cold is the run where the runner is most contended.
    timeout-minutes: 120    # bounds a HANG; `codegen` waits on `needs:` even under `if: always()`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2   # clippy is a full check-build of the workspace; the cache is what keeps this job fast
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies (cargo-machete — the D6 lint floor, #302)
        run: cargo machete

      # The #388 env-mutation ban: std::env::set_var/remove_var are disallowed methods (clippy.toml)
      # — concurrent setenv/unsetenv vs getenv is glibc UB, the intermittent test-binary SIGSEGV
      # class. `-D clippy::disallowed-methods` is passed ON THE COMMAND LINE deliberately: Cargo
      # lint inheritance is all-or-nothing, so the crates that restate their own `[lints]` tables
      # (infrastructure, the adapters, clients/*, telemetry, actor_client) would NOT inherit the
      # `[workspace.lints.clippy]` deny — the CLI flag reaches every workspace member regardless of
      # manifest. `--all-targets` is load-bearing too: both #388 violations lived in #[cfg(test)]
      # code, which a plain `cargo clippy` never compiles.
      - name: Env-mutation ban (clippy disallowed-methods, #388)
        run: cargo clippy --workspace --all-targets -- -D clippy::disallowed-methods

  specs:
    # THE POINT OF THE SPLIT. The validator is the blocking gate and the one most likely to fail on
    # a spec change, yet it only needs `tools/codegen-rs` — a separate manifest, not the workspace.
    # On its own job it reports in seconds; it used to wait for the workspace build, the wasm check
    # and both test suites first.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # 120 -- and the route to this number matters more than the number, because round 65 put 20 here
    # with a measurement that was WRONG ABOUT WHAT IT MEASURED.
    #
    # Review #65 was right that these two caps had no antecedent: they shipped in the "seconds of
    # work" bucket with `changes` and `codegen`, while both `specs` and `docs-validate` build
    # `tools/codegen-rs` and its tree (guppy, determinator, petgraph, cargo_metadata, target-spec,
    # semver, regex, serde_yaml, sha2) from scratch on a cold cache -- which `docs-validate`'s own
    # header already admitted.
    #
    # THE RETRACTED MEASUREMENT: "empty CARGO_TARGET_DIR, 36s, so 20 minutes is ~30x". The target
    # dir was empty; `CARGO_HOME` WAS NOT. That measured compile-from-a-warm-registry, which is half
    # the cold path -- a cold CI runner also fetches every crate in the tree. The number was true and
    # the sentence built on it was not, and the omission was in the permissive direction. The
    # re-measurement with an isolated CARGO_HOME could not be completed here (the session's disk
    # allowance ran out mid-build), so THE COLD PATH REMAINS UNMEASURED and this comment says so
    # rather than quoting the half of it that happened to be cheap. Review #64's lesson pointing at
    # its author: a measurement is defined by what it excludes.
    #
    # SO THE VALUE IS DECIDED ON THE ASYMMETRY, NOT ON A NUMBER -- and for `docs-validate` the
    # asymmetry is the most lopsided in this file. Too HIGH costs idle runner minutes on a hang, and
    # on the docs-only lane it blocks no merge at all, because CLAUDE.md routes that work straight to
    # `main` as a push with no PR -- the change has already landed. Too LOW cancels the job, `codegen`
    # fails on `cancelled` by design, and the change sits on `main` WITH NO VALIDATOR HAVING RUN,
    # because this is the only gate that lane has. It does not self-heal either: `Swatinem/rust-cache`
    # saves nothing on a cancellation, so every re-run is cold and hits the same wall. Reached by an
    # ordinary `Cargo.lock` or toolchain bump, which rekeys every cache at once.
    #
    # `specs` carries the same value for the same unmeasured reason rather than a second guess: one
    # number across the unmeasured jobs is one fewer figure to drift, which is the defect rounds 57,
    # 61 and 62 spent three rounds on. Bounds a HANG; `codegen` waits on `needs:` even under
    # `if: always()`. WHEN A COLD RUN IS ACTUALLY OBSERVED: read its duration off that run, state it
    # here as the antecedent, and move this value deliberately -- do not lower it to fit a warm one.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Default config on purpose. `tools/codegen-rs` is a MEMBER of the root workspace (see the root
      # Cargo.toml), so the workspace root is `.` and the target dir is the root `target/` — pointing
      # rust-cache's `workspaces:` at the member directory would key a cache against a path that is
      # not a workspace root. The cache still stays small because rust-cache keys per JOB, and this
      # job only ever compiles the codegen package and its own dependency tree ("tooling, not part of
      # the app graph"), never the layer crates.
      - uses: Swatinem/rust-cache@v2

      - name: Validate the specs (full validator §1–§11 — the blocking gate)
        run: cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --check --specs specs

      - name: Regenerate every artifact + fail on spec↔generation drift
        run: |
          # Regenerate, then fail if the result differs from what's committed. EOL-tolerant: the repo is
          # authored on Windows (CRLF) while CI runs on Linux (LF), and the generator's output inherits its
          # line endings from the source — only genuine content drift should fail, never CRLF-vs-LF.
          cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --specs specs
          if ! git diff --quiet --ignore-cr-at-eol; then
            echo "::error::Generated artifacts are stale — run 'make generate' and commit the result so the repo matches specs/."
            git --no-pager diff --ignore-cr-at-eol --stat
            git --no-pager diff --ignore-cr-at-eol
            exit 1
          fi
          # Catch brand-new generated files that were never committed.
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated files are not committed — run 'make generate' and commit:"
            echo "$untracked"
            exit 1
          fi
          echo "✓ generated artifacts match the specs"

  build-test:
    # Workspace build + wasm compile-check + the offline test pass. Runs concurrently with `db-test`,
    # which needs the same crates compiled; on a cold cache both pay the build, but IN PARALLEL, so
    # wall clock is one build rather than two. `Swatinem/rust-cache` keys per job, so each keeps its
    # own warm cache and neither races the other's save.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 120  # see the `changes` job comment: bounds a HANG, set ABOVE an unmeasured cold build on purpose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Cache ~/.cargo + target/ keyed on Cargo.lock + toolchain, so repeat runs only recompile the crates
      # that actually changed (not the ~200 dependencies) — the main CI-duration win. (db-migrate needs no
      # build cache: it runs a prebuilt sqlx-cli, so there is no artifact worth sharing between the two.)
      - uses: Swatinem/rust-cache@v2

      - name: Build the workspace (codegen + all layer crates — enforces the ADR-0035 dependency graph)
        run: cargo build --workspace --verbose

      - name: Compile-check the wasm32 hydrate build (split 4/4 of #21 — the bundle itself is built in build-image.yml's Docker step)
        run: |
          rustup target add wasm32-unknown-unknown
          make wasm

      # #388 evidence: "non-reproducible" was partly "uninstrumented" — no disk/memory picture, no
      # cores, no failure artifacts. These steps are ZERO-RISK to green runs: `|| true` guards every
      # evidence line so they can never fail the job themselves.
      - name: "Evidence: disk + memory before tests (#388)"
        run: |
          df -h || true
          free -m || true

      # Kept WITHOUT a DATABASE_URL on purpose: this run proves the offline path (every DB-gated test
      # must skip cleanly on a contributor machine with no Postgres). The DB suites run for real in `db-test`.
      # Since #474 the skip polarity is INVERTED — a missing database FAILS by default — so this job
      # must now say so out loud: `DB_TESTS_REQUIRED: '0'` is the explicit opt-out, and it is exactly
      # the declaration this step's comment used to make in prose only. It also proves the opt-out path
      # keeps working, which is the half `db-test` cannot cover.
      # The two evidence lines before cargo test enable core dumps in THIS shell (ulimit is per-shell):
      # ubuntu runners pipe cores to apport by default, which drops them — a plain writable pattern
      # keeps the corpse for the failure-artifact upload. Guarded so they never fail a green run.
      - name: Unit tests (whole workspace, no database — the offline path)
        env:
          DB_TESTS_REQUIRED: '0'
        run: |
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p" || true
          ulimit -c unlimited || true
          cargo test --workspace --verbose

      - name: "Evidence: disk + memory after tests (#388)"
        if: always()
        run: |
          df -h || true
          free -m || true

      - name: "Evidence: collect cores + test-binary listing (#388)"
        if: failure()
        run: |
          # Cores only — the deps test binaries run to hundreds of MB each; a text listing names
          # which binaries were present so the crashing one can be rebuilt bit-identically.
          mkdir -p crash-evidence || true
          cp core.* crash-evidence/ 2>/dev/null || true
          ls -lh target/debug/deps/ > crash-evidence/target-debug-deps-listing.txt 2>/dev/null || true

      - name: "Evidence: upload crash artifacts (#388)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-evidence-build-test
          path: crash-evidence/
          if-no-files-found: ignore

  db-test:
    # A real Postgres for the DATABASE_URL-gated integration suites (#230). Without one they take
    # their early-return branch and report ok — a green that covers nothing, which is how the #236
    # drift (and the undeliverable staged-fact bug it hid) went unnoticed.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 120  # see the `changes` job comment: bounds a HANG, set ABOVE an unmeasured cold build on purpose
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2 # prebuilt sqlx-cli in seconds, same as db-migrate.yml
        with:
          tool: sqlx-cli
      - name: Apply migrations to the CI Postgres (#230 — the DB suites assume the schema exists)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: sqlx migrate run --source migrations

      # #388 evidence (same shape as build-test): zero-risk to green runs, `|| true` on every line.
      - name: "Evidence: disk + memory before tests (#388)"
        run: |
          df -h || true
          free -m || true

      # --test-threads=1 because the suites share one database and reset the same tables; the
      # infrastructure binary's TestDb witness serializes its own bodies, but spawned-worker tails
      # outlive the gate, and server/actor_runtime suites have no witness. DB_TESTS_REQUIRED makes a
      # skip LOUD: if this step
      # ever loses its DATABASE_URL, the gated tests panic instead of silently reporting ok (#230).
      # actor_runtime carries the Proto.Actor port suites (ADR-20260730-234918: fencing, ordering,
      # rebalance, discipline) — it was missing here until #275, so those suites only ever ran on
      # developer machines.
      # The two evidence lines before cargo test enable core dumps in THIS shell (#388, see build-test).
      - name: DB integration tests (previously these always skipped — no Postgres in CI)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DB_TESTS_REQUIRED: '1'
        run: |
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p" || true
          ulimit -c unlimited || true
          cargo test -p infrastructure -p sirene_ingest -p server -p hubrise-adapter \
            -p actor_runtime --tests --verbose -- --test-threads=1

      - name: "Evidence: disk + memory after tests (#388)"
        if: always()
        run: |
          df -h || true
          free -m || true

      - name: "Evidence: collect cores + test-binary listing (#388)"
        if: failure()
        run: |
          # Cores only — the deps test binaries run to hundreds of MB each; a text listing names
          # which binaries were present so the crashing one can be rebuilt bit-identically.
          mkdir -p crash-evidence || true
          cp core.* crash-evidence/ 2>/dev/null || true
          ls -lh target/debug/deps/ > crash-evidence/target-debug-deps-listing.txt 2>/dev/null || true

      - name: "Evidence: upload crash artifacts (#388)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-evidence-db-test
          path: crash-evidence/
          if-no-files-found: ignore

  docs-validate:
    # THE DOCS-ONLY PATH IS VALIDATED SURFACE SINCE 2026-08-21 (ADR-20260821-103403 §23: every
    # full-form ADR/PROP citation across docs/** + CLAUDE.md must resolve; §22: the decision
    # register + its generated index region live under docs/). The 2026-07-28 header directive
    # ("docs have nothing to validate or regenerate") was TRUE when written and is not any more —
    # before this job, a docs-only push reached `main` with a GREEN required check and zero
    # validation, the exact silent-fallback class ADR-20260810-231300 names. This job runs on
    # exactly the docs-only complement and executes the CANONICAL validator commands VERBATIM from
    # the `specs` job — never a parallel implementation of the rules — building tools/codegen-rs
    # only (cached), which preserves the 2026-07-28 cost bound: no workspace build, no test
    # suites. Accepted latency: ~10s before, ~1–3 min warm cache now (cold first run pays the
    # codegen build). Verified locally red/green with a planted dangling citation (the 2026-08-21
    # verification slice); the codegen aggregator asserts this job's result BY NAME, because the
    # generic skipped-acceptance below would let a mis-gated skip slide.
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    # 120 -- and the route to this number matters more than the number, because round 65 put 20 here
    # with a measurement that was WRONG ABOUT WHAT IT MEASURED.
    #
    # Review #65 was right that these two caps had no antecedent: they shipped in the "seconds of
    # work" bucket with `changes` and `codegen`, while both `specs` and `docs-validate` build
    # `tools/codegen-rs` and its tree (guppy, determinator, petgraph, cargo_metadata, target-spec,
    # semver, regex, serde_yaml, sha2) from scratch on a cold cache -- which `docs-validate`'s own
    # header already admitted.
    #
    # THE RETRACTED MEASUREMENT: "empty CARGO_TARGET_DIR, 36s, so 20 minutes is ~30x". The target
    # dir was empty; `CARGO_HOME` WAS NOT. That measured compile-from-a-warm-registry, which is half
    # the cold path -- a cold CI runner also fetches every crate in the tree. The number was true and
    # the sentence built on it was not, and the omission was in the permissive direction. The
    # re-measurement with an isolated CARGO_HOME could not be completed here (the session's disk
    # allowance ran out mid-build), so THE COLD PATH REMAINS UNMEASURED and this comment says so
    # rather than quoting the half of it that happened to be cheap. Review #64's lesson pointing at
    # its author: a measurement is defined by what it excludes.
    #
    # SO THE VALUE IS DECIDED ON THE ASYMMETRY, NOT ON A NUMBER -- and for `docs-validate` the
    # asymmetry is the most lopsided in this file. Too HIGH costs idle runner minutes on a hang, and
    # on the docs-only lane it blocks no merge at all, because CLAUDE.md routes that work straight to
    # `main` as a push with no PR -- the change has already landed. Too LOW cancels the job, `codegen`
    # fails on `cancelled` by design, and the change sits on `main` WITH NO VALIDATOR HAVING RUN,
    # because this is the only gate that lane has. It does not self-heal either: `Swatinem/rust-cache`
    # saves nothing on a cancellation, so every re-run is cold and hits the same wall. Reached by an
    # ordinary `Cargo.lock` or toolchain bump, which rekeys every cache at once.
    #
    # `specs` carries the same value for the same unmeasured reason rather than a second guess: one
    # number across the unmeasured jobs is one fewer figure to drift, which is the defect rounds 57,
    # 61 and 62 spent three rounds on. Bounds a HANG; `codegen` waits on `needs:` even under
    # `if: always()`. WHEN A COLD RUN IS ACTUALLY OBSERVED: read its duration off that run, state it
    # here as the antecedent, and move this value deliberately -- do not lower it to fit a warm one.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate (canonical validator — §22 decision register + index-sync, §23 citation ratchet, and everything else)
        run: cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --check --specs specs

      - name: Regenerate + fail on drift (a docs/decisions edit regenerates the DECISIONS.md index region)
        run: |
          cargo run --manifest-path tools/codegen-rs/Cargo.toml -- --specs specs
          if ! git diff --quiet --ignore-cr-at-eol; then
            echo "::error::Generated artifacts are stale — run 'make generate' and commit the result."
            git --no-pager diff --ignore-cr-at-eol --stat
            exit 1
          fi
          echo "✓ generated artifacts match"

  codegen:
    # THE REQUIRED STATUS CHECK ON `main`. Keep this job id: branch protection matches on it, and a
    # required check whose job never appears leaves every PR stuck on "Expected - waiting for status"
    # (the same trap the docs-only note in the header describes).
    #
    # Since #356 this is an aggregator, and the assertion below is load-bearing. GitHub SKIPS a job
    # whose `needs:` dependency failed — and branch protection ACCEPTS `skipped`, which is precisely
    # why the docs-only design works. Relying on `needs:` alone would therefore report every red
    # build as an acceptable skip and silently disable the entire gate. `if: always()` makes this job
    # run whatever happened upstream, and the step fails unless every upstream result is `success`
    # (normal run) or `skipped` (docs-only change). `cancelled` and `failure` both fail here.
    needs: [changes, lint, specs, build-test, db-test, docs-validate]
    if: always()
    timeout-minutes: 10   # bounds a HANG; `codegen` waits on `needs:` even under `if: always()`
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job must have succeeded (or been skipped as docs-only)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_VALIDATE: ${{ needs.docs-validate.result }}
        run: |
          set -euo pipefail
          echo "upstream gate results: $RESULTS (docs_only=$DOCS_ONLY docs-validate=$DOCS_VALIDATE)"
          status=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required gate job reported '$r'"; status=1 ;;
            esac
          done
          # The docs-only lane is asserted BY NAME (2026-08-21 verification slice): the generic
          # skipped-acceptance above is exactly how a docs-only push used to get a green required
          # check with ZERO validation, so a skipped docs-validate on a docs-only change fails here.
          if [ "$DOCS_ONLY" = "true" ] && [ "$DOCS_VALIDATE" != "success" ]; then
            echo "::error::docs-validate reported '$DOCS_VALIDATE' on a docs-only change — the docs path is validated surface (§22/§23) and may not skip the canonical validator."
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::ci gate FAILED — see the failing job above."
            exit 1
          fi
          echo "✓ every gate job passed"
