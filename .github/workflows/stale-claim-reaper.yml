# Stale-claim reaper (issue #39, ADR-20260720-233000; liveness fixed by issue #642, then a
# recency bound added by #642's follow-up on the re-review of #697, then a `mergedAt` signal added
# by issue #703): a `status/in-progress` claim with >24h of no RECENT activity (no issue comment,
# no commit on its own `NN-slug` branch, and no merge of a PR whose head was that branch, all
# WITHIN the trailing 24h -- an artifact at any single instant after the claim is not enough, since
# the claim protocol itself manufactures one within a minute of every claim) is released back to
# the queue, so a crashed session never holds an issue hostage. `cross-referenced` / `referenced` /
# `connected` timeline events (an unrelated PR merely mentioning the issue number) are DELIBERATELY
# not consulted -- see `.github/scripts/stale-claim-reaper-decide.js` for why and
# `.github/scripts/stale-claim-reaper-decide.test.js` for the hermetic proof.
#
# A second, independent job surfaces `status/blocked` issues that have sat silent for over 72h
# (a dead-man's-switch for parked items, ADR-20260810-231300's monitoring carve-out), mirroring the
# same marker-based idempotence so it notifies once per silence window rather than every hour. The
# two jobs' bot comments never count as liveness for EACH OTHER's decider -- `isReaperComment` in
# the decision module recognizes both markers, on both sides.
#
# Both jobs FAIL LOUD AND COMPLETE, never fail-stop: a per-issue try/catch COLLECTS each error and
# keeps processing every OTHER issue, then the run throws (failing loud) if any were collected --
# one issue's API hiccup no longer stops the whole run from reaping/notifying everything else it
# can see. `removeLabel` returning 404 is TARGETED, not a silent swallow: it means the
# `status/in-progress` label is ALREADY gone -- the exact end state that branch exists to reach,
# most likely a concurrent re-claim or a second run racing this one. Any other status is a real
# failure and rethrows. No other API call is ever adapted around, per the founder's "fix the
# generator/runtime, never the check" doctrine applied to CI scripts.
#
# CANDIDATE DERIVATION (issue #703, corrected by the #705 review): `repos.listBranches` alone
# cannot see a branch deleted at merge time, hours or days before a run -- the ROUTINE case, since
# GitHub deletes a merged PR's head branch -- so a multi-PR issue whose work had already landed and
# merged could be reaped anyway. Candidates are now the UNION of still-live branches AND a
# run-level CLOSED-PR listing's head refs (`candidateNames`), with that same listing's `merged_at`
# PRE-RESOLVED into a map (`mergedAtByBranch`) and threaded into `resolveBranches` -- so a candidate
# sourced from the closed-PR listing costs no further API call. `getBranch` 404ing on a candidate
# is still expected and handled INSIDE `resolveBranches` (a narrow fallback for the seconds-wide
# race the run-level listing did not already cover) -- see the module for the full contract.
name: stale-claim-reaper
on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 rush
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read        # listBranches/getBranch, for the branch-commit liveness proof
  pull-requests: read   # pulls.list, for the mergedAt liveness proof (issue #703)
jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const {
              CLAIM_MARKER,
              branchPrefix,
              candidateNames,
              mergedAtByBranch,
              resolveBranches,
              decideClaimLiveness,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/stale-claim-reaper-decide.js`);
            const now = Date.now();
            const { owner, repo } = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'status/in-progress', per_page: 100,
            });

            // Hoisted OUT of the per-issue loop (issue #642 follow-up, finding 4): the whole
            // branch list is fetched ONCE per run, not once per open claim -- a busy backlog with
            // N claims used to re-page the same repo-wide list N times for data that cannot change
            // mid-run.
            const allBranches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            // ONE run-level fetch (issue #703, corrected by the #705 review) of recently-closed
            // PRs -- NOT paginated further, `per_page: 100` caps this at a SINGLE call, sorted so
            // the most recently closed/merged come first. This is what lets a branch deleted HOURS
            // OR DAYS ago at merge time still resolve to a candidate at all: `listBranches` alone
            // cannot see it any more, but a closed PR keeps its `head.ref` string regardless. Not
            // wrapped in a try/catch: a failure here fails the WHOLE job immediately, louder than
            // the per-issue collection below, and correctly so -- without this listing every
            // deleted-branch candidate would silently look like "no proof of work" was ever
            // findable (observability's rule: an API error is never absence-of-proof).
            const { data: closedPrs } = await github.rest.pulls.list({
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
            });
            const mergedAtByName = mergedAtByBranch(closedPrs);
            const closedPrHeadRefs = Object.keys(mergedAtByName);

            // The workflow-side fetcher (issue #703) -- the ONLY place `github.rest` is called per
            // candidate; injected into `resolveBranches`, the module's sole I/O-touching function.
            // `mergedAt` below is now a NARROW FALLBACK (see `resolveBranches`'s own contract):
            // most candidates resolve their `mergedAt` from `mergedAtByName` above, for free.
            const fetcher = {
              async branchCommitAt(name) {
                const { data } = await github.rest.repos.getBranch({ owner, repo, branch: name });
                const commit = data.commit && data.commit.commit;
                return (commit && (commit.committer?.date || commit.author?.date)) || null;
              },
              async mergedAt(name) {
                // API CHOICE (farley): `pulls.list({ state: 'closed', head })` over
                // `listPullRequestsAssociatedWithCommit`. The latter needs a commit SHA, which is
                // exactly what we may NOT have for a branch that just 404'd on `getBranch`. Only
                // reached for the seconds-wide race `mergedAtByName` did not already cover -- see
                // `resolveBranches`'s contract for exactly when.
                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, state: 'closed', head: `${owner}:${name}`, per_page: 10,
                });
                const mergedDates = prs.map(pr => pr.merged_at).filter(Boolean);
                if (!mergedDates.length) return null; // an orphaned branch is simply never-merged
                mergedDates.sort();
                return mergedDates[mergedDates.length - 1];
              },
            };

            // FAIL LOUD STAYS, FAIL STOP GOES (finding 4): one issue's API hiccup must not stop
            // the run from reaping every OTHER stale claim it can see. Errors are COLLECTED, never
            // swallowed -- the run still fails, loud and complete, if anything errored.
            const errors = [];
            for (const issue of issues) {
              if (issue.pull_request) continue; // claims live on issues, not PRs

              try {
                const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner, repo, issue_number: issue.number, per_page: 100,
                });

                // Candidates for `<issue-number>-*` (`NN-slug`, BACKLOG.md): the UNION of
                // still-live branches and closed-PR head refs (issue #705 review -- see the module
                // header), then resolved (branch-tip commit date + PR merge state) by
                // `resolveBranches` -- the only per-candidate I/O this workflow step does.
                const prefix = branchPrefix(issue.number);
                const candidates = candidateNames(prefix, {
                  branchNames: allBranches.map(b => b.name),
                  closedPrHeadRefs,
                });
                const branches = await resolveBranches(candidates, fetcher, mergedAtByName);

                const decision = decideClaimLiveness(issue, timeline, branches, now);
                if (decision.alive) continue;

                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'status/in-progress' });
                } catch (err) {
                  // TARGETED idempotence, not a silent swallow: a 404 on THIS ONE call means the
                  // label is ALREADY gone -- exactly the end state this branch exists to reach,
                  // most likely a concurrent re-claim or a second run racing this one. Any other
                  // status is a real failure and is rethrown, caught by the per-issue try/catch
                  // below, and fails the run.
                  if (err.status !== 404) throw err;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `${CLAIM_MARKER}\n⏰ **Claim expired** — \`status/in-progress\` was set over 24h ago with no comment on this issue, no commit on its \`${prefix}*\` branch, and no merged PR whose head was that branch, since. The issue is back in the queue (BACKLOG.md claim protocol, ADR-20260720-233000). Re-claim by re-adding the label with a fresh claim comment.`,
                });
              } catch (err) {
                core.error(`issue #${issue.number}: ${err.message}`);
                errors.push(`#${issue.number} (${err.message})`);
              }
            }

            if (errors.length) {
              throw new Error(`${errors.length} issue(s) failed while reaping stale claims: ${errors.join('; ')}`);
            }
  parked-dead-mans-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const {
              BLOCKED_MARKER,
              decideBlockedNotice,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/stale-claim-reaper-decide.js`);
            const now = Date.now();
            const { owner, repo } = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'status/blocked', per_page: 100,
            });

            // FAIL LOUD STAYS, FAIL STOP GOES (finding 4, same discipline as the `reap` job): one
            // issue's API hiccup must not stop the run from notifying every OTHER parked issue.
            const errors = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;

              try {
                const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner, repo, issue_number: issue.number, per_page: 100,
                });

                const decision = decideBlockedNotice(issue, timeline, now);
                if (!decision.notify) continue;

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `${BLOCKED_MARKER}\n🚧 **Still blocked** — no activity on this \`status/blocked\` issue for over 72h. Surfacing it so it does not sit parked unnoticed; this fires once per silence window, not on every run.`,
                });
              } catch (err) {
                core.error(`issue #${issue.number}: ${err.message}`);
                errors.push(`#${issue.number} (${err.message})`);
              }
            }

            if (errors.length) {
              throw new Error(`${errors.length} issue(s) failed while checking parked issues: ${errors.join('; ')}`);
            }
