# Build the server image in CI and push it to GHCR (ADR-20260721-175411) — BUILD ONLY.
#
# WHY built here: Render meters "build-pipeline minutes". Compiling the Rust workspace on Render
# repeatedly blew the account's build-pipeline spend cap ($0.00) and failed deploys — every merge to
# `main` triggered a full cargo build. GitHub Actions is free and unlimited on standard runners for
# this PUBLIC repo, so we build the Docker image HERE (the same cargo-chef Dockerfile, with a buildx
# layer cache) and push it to GHCR. Render never compiles Rust — it only pulls an image.
#
# WHY build only (ADR-20260730-051500): this workflow used to also trigger the Render deploy, and
# db-migrate ran in parallel straight off a green `ci` — so a paused/broken Render (e.g. outbound
# bandwidth exhausted) could leave the DATABASE migrated ahead of a binary that could never arrive.
# Publishing an image is always safe; RUNNING it and MIGRATING the database are not, so they moved to
# the manual `deploy` workflow (deploy.yml), which db-migrate.yml then follows. Sequence:
#   ci (green) → build-image (GHCR push, here) → deploy (manual dispatch) → db-migrate (auto, after)
# The app's /health schema-version gate holds the new instance (503) until the migration lands, so
# "deploy then migrate" never serves a new binary against an old schema.
#
# Gated exactly like before (ADR-0043): runs ONLY after the `ci` workflow succeeds on `main`, so we
# never publish an image for a commit that fails build / tests / spec-validation.
#
# Docs-only skip: a merge that touches only specs/docs/ADRs/tooling does not change the deployed binary,
# so the "Decide whether the deployable image changed" step below diffs the merge and SKIPS the build
# for those (fail-safe: builds if the diff can't be computed). `workflow_run` can't use `paths:`, hence
# the in-job diff. Consequence: the live `X-VERSION` reflects the last CODE commit, not every docs merge
# — which is correct, since the running binary genuinely didn't change.
name: build-image

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

# Least privilege: read the repo, write packages (push to GHCR). Nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thecaptaincompany/captain-food

jobs:
  build:
    # Only proceed when the gating CI run actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the exact commit that passed CI
          fetch-depth: 2 # need HEAD^ to diff the merge and decide if the image actually changed

      # Skip the rebuild when a merge only touched specs/docs/ADRs/tooling — none of that changes the
      # deployed `server` binary, so rebuilding would just churn an identical image. `workflow_run`
      # triggers can't use `paths:`, so we diff in-job. Fail-safe: if the diff can't be computed, we
      # BUILD (never skip a build we're unsure about). Deploy-relevant paths = the `server` binary's
      # inputs + the image build.
      - name: Decide whether the deployable image changed
        id: filter
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git rev-parse "${SHA}^" >/dev/null 2>&1; then
            echo "parent commit unavailable — building to be safe"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "${SHA}^" "${SHA}")"
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$|Dockerfile$|\.dockerignore$|rust-toolchain\.toml$)'; then
            echo "→ deploy-relevant change: BUILD"; echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ docs/spec/tooling-only change: SKIP build"; echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.filter.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped by the workflow's `packages: write`

      - name: Compute the short commit SHA (7 chars, as GitHub displays it)
        if: steps.filter.outputs.build == 'true'
        id: vars
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT" # e.g. 829f4ad — human-readable version label

      - name: Build and push (cargo-chef Dockerfile + buildx GHA layer cache)
        if: steps.filter.outputs.build == 'true'
        id: build # exposes steps.build.outputs.digest — the content-addressed image reference
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `sha-<short>` = a human/git-readable tag (correlates the image to a commit, matches the SHA
          # GitHub shows); `latest` is ONLY the blueprint bootstrap seed — deploys never resolve either
          # (the `deploy` workflow pins the digest it resolves from the sha tag). The digest remains the
          # reference each deploy actually runs.
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short }}
            ${{ env.IMAGE }}:latest
          # Bake the build identity into the image (env + OCI labels) so the running app reports it at
          # /health — the short git SHA is the readable version; the digest remains the exact identity.
          build-args: |
            CAPTAIN_BUILD_VERSION=${{ steps.vars.outputs.short }}
          # Persist the cargo-chef dependency layer across runs — only changed app crates recompile,
          # so warm builds are minutes, not the full cold compile.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published — deployment is a separate, deliberate step
        if: steps.filter.outputs.build == 'true'
        run: |
          echo "✓ pushed ${IMAGE}:sha-${{ steps.vars.outputs.short }} (${{ steps.build.outputs.digest }})"
          echo "To put it in production: run the 'deploy' workflow (Actions → deploy → Run workflow)."
          echo "db-migrate follows the deploy automatically (ADR-20260730-051500)."
