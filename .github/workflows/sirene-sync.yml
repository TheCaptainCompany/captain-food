# SIRENE raw ingestion (ADR-0045, refines ADR-0019/0020/0027) — the THIN half of the split sync.
#
# This job only fetches active food-service établissements (NAF 56.10A/B/C + 56.30Z, all of France,
# partitioned by department) from the INSEE Sirene API and UPSERTs the RAW records into the
# `external_sirene_restaurants` staging table. Departments are swept STALEST-FIRST within a self-imposed
# time budget (#218): INSEE's quota makes a full sweep ~4h, so coverage completes across successive runs
# instead of restarting at department 01 every time and never getting past 37. It runs NO ACL, NO aggregate, NO domain crates: only the
# `sirene_ingest` crate is built (a small dependency graph — reqwest + sqlx + serde), so the
# version-sensitive translation happens exclusively in the deployed server's `sync_sirene_worker`
# (woken by the ping below, plus its own safety-net poll loop). Idempotent: one row per SIRET,
# re-runs refresh `last_seen_at`/`payload` and re-pend the rows.
#
# Requires repo secrets:
# - DATABASE_URL           — Postgres; only the staging table is written (a limited-privilege role
#                            scoped to `external_sirene_restaurants` is recommended, ADR-0045).
# - INSEE_API_TOKEN        — API key from the INSEE portal (portail-api.insee.fr), sent as the
#                            X-INSEE-Api-Key-Integration header by the client.
# Optional (to wake the worker immediately instead of waiting for its poll):
# - INTERNAL_TRIGGER_URL   — the deployed server's drain endpoint,
#                            e.g. https://<app>/internal/sirene/drain
# - INTERNAL_TRIGGER_TOKEN — shared secret; must equal the server's INTERNAL_TRIGGER_TOKEN env var
#                            (sent as the x-internal-token header).
name: sirene-sync

# PAUSED 2026-07-28 (product-owner directive) — the weekly schedule is commented out until the write-path
# defects in issue #220 "Slug lifecycle + SIRENE as inbound event" are resolved. Reason: every sweep bumps
# `last_seen_at` on every row, which re-pends ~200k staging rows, and the drain path then (a) issues one
# `RegisterRestaurant` per SIRET whose idempotency is a DELIBERATE `UNIQUE (stream_name, version)`
# violation — Postgres writes the heap tuple before the constraint fires, so the sweep leaves ~200k dead
# tuples in `domain_events` and its indexes — and (b) resolves identity via an UNINDEXED
# `external_identifiers @> $1` scan of the whole `Restaurant` projection, once per SIRET. That combination
# is what drained the Supabase Disk IO budget. Worse, the sweep cannot even apply what it reads: there is
# no `UpdateRestaurant` in the SIRENE worker, so INSEE changes are swallowed by the same conflict.
#
# `workflow_dispatch` is deliberately KEPT so a scoped debug run stays possible (e.g. one department via
# SIRENE_DEPARTMENTS below) — pausing the schedule is not the same as removing the capability.
#
# It also carries the `mode: compact` run (issue #238, ADR-20260728-143000). Compaction reads payloads
# already in the staging table and makes NO INSEE calls, so it is unaffected by the pause above — the
# pause is about the sweep's write-path cost, and compaction is what makes national coverage affordable
# in the first place. It needs only DATABASE_URL, never pings the worker, and is safe to re-run: it is
# resumable by construction (`payload IS NOT NULL` is its own progress marker), so run it until it
# reports nothing left to do.
#
# The on-app drain half is paused separately: `RUN_SIRENE_WORKER` now defaults to OFF
# (crates/server/src/lib.rs). Both halves must be re-enabled together.
#
# TO RESUME: uncomment the cron below AND set `RUN_SIRENE_WORKER=true` in the Render dashboard (or revert
# the default). Do not resume one half alone — CI-only leaves staging rows piling up unprocessed, and
# worker-only re-drains whatever is already pending.
on:
  # schedule:
  #   - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC — the ADR-0020 Sirene-sync cadence (PAUSED, see above)
  workflow_dispatch: # manual runs for the first import / debugging / compaction
    inputs:
      mode:
        description: "sweep = fetch from INSEE into staging. compact = drop translated payloads already in staging (#238), no INSEE calls."
        type: choice
        required: true
        default: sweep
        options: [sweep, compact]
      budget_minutes:
        description: "Wall-clock the run may spend before stopping cleanly. Blank = the binary default (75 sweep / 60 compact). Both modes stop at a safe boundary and resume next run."
        type: string
        required: false
        default: ""
      departments:
        description: "sweep only — comma-separated departments (e.g. 37 or 37,41). Honoured verbatim and IN ORDER, never reordered by staleness. Blank = stalest-first across all of France."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sirene-sync
  cancel-in-progress: false # never interrupt a half-finished sweep; runs are idempotent anyway

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A full France sweep is ~minutes; this bounds any unforeseen hang to well under the 6-hour
    # GitHub job ceiling (which silently burned two runs on 2026-07-20) while never tripping a
    # healthy run. The real fix is the per-request timeout in the client; this is the safety net.
    # The run now budgets ITSELF (SIRENE_BUDGET_MINUTES, default 75) and stops cleanly between
    # departments, so this ceiling is a genuine hang-catcher again rather than the thing that kills a
    # healthy sweep (#218). Keep it comfortably above the budget: a run that trips THIS is a bug.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Same cache strategy as the ci workflow: repeat runs only rebuild what changed.
      - uses: Swatinem/rust-cache@v2

      - name: Build the ingestion binary (no domain crates — ADR-0045)
        run: cargo build --release -p sirene_ingest

      - name: Run the SIRENE ingestion (--once)
        if: inputs.mode != 'compact'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSEE_API_TOKEN: ${{ secrets.INSEE_API_TOKEN }}
          INTERNAL_TRIGGER_URL: ${{ secrets.INTERNAL_TRIGGER_URL }}
          INTERNAL_TRIGGER_TOKEN: ${{ secrets.INTERNAL_TRIGGER_TOKEN }}
          # Both come from the workflow_dispatch inputs above, and BLANK is the normal case: the binary
          # parses an unparsable/empty value as "not set" and falls back to its own default, so an
          # untouched dispatch form behaves exactly like the schedule does.
          #
          # An explicit department list is honoured verbatim and IN ORDER — it is NOT reordered by
          # staleness, so debugging and a deliberate single-market scope stay predictable. Left blank,
          # the sweep goes stalest-first so successive runs converge on full coverage (#218); INSEE's
          # ~30 req/min quota makes a full France sweep ~4h, so it is completed ACROSS runs, never in one.
          SIRENE_DEPARTMENTS: ${{ inputs.departments }}
          SIRENE_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
        run: ./target/release/sirene_ingest --once

      # Compaction (#231/#238): recompute each real payload_hash, then DROP the payload of every row the
      # worker has already translated. No INSEE calls, so no token and no rate limit — the only input is
      # what is already in the staging table.
      #
      # The hash is recomputed BEFORE the payload is dropped, and that order is the whole correctness
      # argument: every pre-#231 row carries the `unhashed-pre-20260728` sentinel, so dropping payloads
      # under it would make the next sweep mismatch on all 339k rows, re-pend every one and re-write all
      # 655 MB — the exact opposite of the intent.
      #
      # Expect to run this SEVERAL times. It is budgeted and resumable; re-run until `compacted` is 0.
      # Note the table will NOT shrink on disk from this alone: a plain VACUUM makes the space reusable
      # (so full France now fits in what departments 1-37 already cost) but only a VACUUM FULL returns it
      # to the OS — and that becomes affordable only AFTER this pass. See #238 for the full runbook.
      - name: Compact the SIRENE mirror (--compact)
        if: inputs.mode == 'compact'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIRENE_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
        run: ./target/release/sirene_ingest --compact
