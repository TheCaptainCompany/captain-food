# SIRENE raw ingestion (ADR-0045, refines ADR-0019/0020/0027) — the THIN half of the split sync.
#
# This job only fetches active food-service établissements (NAF 56.10A/B/C + 56.30Z, all of France,
# partitioned by department) from the INSEE Sirene API and UPSERTs the RAW records into the
# `external_sirene_restaurants` staging table. It runs NO ACL, NO aggregate, NO domain crates: only the
# `sirene_ingest` crate is built (a small dependency graph — reqwest + sqlx + serde), so the
# version-sensitive translation happens exclusively in the deployed server's `sync_sirene_worker`
# (woken by the ping below, plus its own safety-net poll loop). Idempotent: one row per SIRET,
# re-runs refresh `last_seen_at`/`payload` and re-pend the rows.
#
# Requires repo secrets:
# - DATABASE_URL           — Postgres; only the staging table is written (a limited-privilege role
#                            scoped to `external_sirene_restaurants` is recommended, ADR-0045).
# - INSEE_API_TOKEN        — API key from the INSEE portal (portail-api.insee.fr), sent as the
#                            X-INSEE-Api-Key-Integration header by the client.
# Optional (to wake the worker immediately instead of waiting for its poll):
# - INTERNAL_TRIGGER_URL   — the deployed server's drain endpoint,
#                            e.g. https://<app>/internal/sirene/drain
# - INTERNAL_TRIGGER_TOKEN — shared secret; must equal the server's INTERNAL_TRIGGER_TOKEN env var
#                            (sent as the x-internal-token header).
name: sirene-sync

# PAUSED 2026-07-28 (product-owner directive) — the weekly schedule is commented out until the write-path
# defects in issue #220 "Slug lifecycle + SIRENE as inbound event" are resolved. Reason: every sweep bumps
# `last_seen_at` on every row, which re-pends ~200k staging rows, and the drain path then (a) issues one
# `RegisterRestaurant` per SIRET whose idempotency is a DELIBERATE `UNIQUE (stream_name, version)`
# violation — Postgres writes the heap tuple before the constraint fires, so the sweep leaves ~200k dead
# tuples in `domain_events` and its indexes — and (b) resolves identity via an UNINDEXED
# `external_identifiers @> $1` scan of the whole `Restaurant` projection, once per SIRET. That combination
# is what drained the Supabase Disk IO budget. Worse, the sweep cannot even apply what it reads: there is
# no `UpdateRestaurant` in the SIRENE worker, so INSEE changes are swallowed by the same conflict.
#
# `workflow_dispatch` is deliberately KEPT so a scoped debug run stays possible (e.g. one department via
# SIRENE_DEPARTMENTS below) — pausing the schedule is not the same as removing the capability.
#
# The on-app drain half is paused separately: `RUN_SIRENE_WORKER` now defaults to OFF
# (crates/server/src/lib.rs). Both halves must be re-enabled together.
#
# TO RESUME: uncomment the cron below AND set `RUN_SIRENE_WORKER=true` in the Render dashboard (or revert
# the default). Do not resume one half alone — CI-only leaves staging rows piling up unprocessed, and
# worker-only re-drains whatever is already pending.
on:
  # schedule:
  #   - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC — the ADR-0020 Sirene-sync cadence (PAUSED, see above)
  workflow_dispatch: {} # manual runs for the first import / debugging

permissions:
  contents: read

concurrency:
  group: sirene-sync
  cancel-in-progress: false # never interrupt a half-finished sweep; runs are idempotent anyway

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A full France sweep is ~minutes; this bounds any unforeseen hang to well under the 6-hour
    # GitHub job ceiling (which silently burned two runs on 2026-07-20) while never tripping a
    # healthy run. The real fix is the per-request timeout in the client; this is the safety net.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Same cache strategy as the ci workflow: repeat runs only rebuild what changed.
      - uses: Swatinem/rust-cache@v2

      - name: Build the ingestion binary (no domain crates — ADR-0045)
        run: cargo build --release -p sirene_ingest

      - name: Run the SIRENE ingestion (--once)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSEE_API_TOKEN: ${{ secrets.INSEE_API_TOKEN }}
          INTERNAL_TRIGGER_URL: ${{ secrets.INTERNAL_TRIGGER_URL }}
          INTERNAL_TRIGGER_TOKEN: ${{ secrets.INTERNAL_TRIGGER_TOKEN }}
          # Uncomment to narrow a debug run to specific departments (comma-separated).
          # SIRENE_DEPARTMENTS: "37"
        run: ./target/release/sirene_ingest --once
