# PostgreSQL 16 tuning for the OVH VPS-2 box: 4 vCore, 8 GB RAM, NVMe.
# Installed to /etc/postgresql/16/main/conf.d/captain-food.conf by provision.sh.
#
# This file is a conf.d DROP-IN and never edits the distro's postgresql.conf, so a package upgrade
# cannot silently revert the tuning and `apt` never prompts about a modified conffile.
#
# ADR-20260804-171030: this database is the system of record. `domain_events` IS the business, so
# nothing here trades durability for speed.

# --- Connections -------------------------------------------------------------------
# The app is ONE container with a bounded sqlx pool, plus migrations, backups and psql sessions.
# 100 is generous. Raising it is not free: work_mem is per-sort, per-connection.
max_connections = 100
listen_addresses = 'localhost'          # loopback only -- the app container uses host networking

# --- Memory ------------------------------------------------------------------------
shared_buffers = 2GB                    # 25% of 8 GB, the standard starting point
effective_cache_size = 5GB              # planner HINT about total OS+PG cache, not an allocation
maintenance_work_mem = 512MB            # index builds and VACUUM -- migrations get noticeably faster
work_mem = 16MB                         # per sort/hash node. 100 conns x several nodes must fit in RAM

# --- Disk: this is NVMe, and the defaults assume spinning rust -----------------------
random_page_cost = 1.1                  # default 4.0 pushes the planner away from index scans
effective_io_concurrency = 200          # NVMe handles deep queues

# --- WAL and checkpoints -------------------------------------------------------------
# synchronous_commit stays ON. This is a payments-adjacent event log: a transaction that returned
# success must be on disk. Do not "optimise" this.
synchronous_commit = on
wal_level = replica                     # set NOW so enabling archive_mode later needs no restart
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9      # spread checkpoint IO instead of stalling at the end

# --- WAL archiving: PHASE 2, deliberately off ----------------------------------------
# Enabling archive_mode without a WORKING, PRUNED shipper fills the disk and takes the database
# down -- the failure mode is worse than having no PITR. Turn these on only with
# backup/wal-ship.sh proven and its pruning tied to a verified base backup.
#archive_mode = on
#archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'

# --- Observability -------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 500ms      # anything slower than half a second is worth seeing
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                      # any spill to disk means work_mem is too small for that query
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- Autovacuum ----------------------------------------------------------------------
# domain_events is append-only, but the View_* read models and the mailbox tables churn hard.
# The defaults are too lazy for a queue table.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# --- Locale / timezone ----------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
