# Captain.Food — Cargo workspace root (ADR-0035, Clean Architecture crate layout).
#
# Virtual manifest (no [package] here): each layer is a member crate. The dependency DIRECTION is
# enforced structurally by which crates each member lists — outer depends on inner, never the reverse;
# `domain` lists no workspace crate at all. A forbidden edge (e.g. domain → application) would create a
# cycle and fail to compile. See docs/adr/0035-project-structure-clean-architecture.md.
[workspace]
resolver = "2"
members = [
    "tools/codegen-rs",        # spec validator + generator (ADR-0034) — tooling, not part of the app graph
    "tools/secret-gate",       # pre-deploy secret-PRESENCE gate (#444, epic #429) — tooling, not part
                               # of the app graph. Its OWN lean crate (#453): serde/serde_json + std
                               # ONLY, so its cold compile on deploy.yml is seconds, not minutes — it
                               # never drags codegen-rs's guppy/determinator tree (the incident-rollback
                               # timeout tail risk). The one unit-tested `compare_secrets` lives here.
    "crates/domains/*",        # PER-SCOPE GENERATED domain crates + the `domain-common` kernel (#373,
                               # ADR-20260807-183024 step 2): one crate per specs/{scope}/, manifest
                               # included, [dependencies] DERIVED from the spec's cross-scope $ref
                               # edges (validator-proved DAG). A GLOB on purpose: a new scope's crate
                               # joins the workspace by being generated, so the members list cannot
                               # drift from the spec.
    "crates/bins/*",           # PER-DEPLOYABLE BIN CRATES (#382, ADR-20260807-183024 step 3): one
                               # GENERATED binary crate per c4-l2 deployable (actor-*/pm-*/
                               # projector-*/graphql-*/gateway-*/fo-*/bo-*/adapters/bam), each
                               # manifest linking ONLY the domain-scope crates its crate-graph
                               # entry declares — the manifest is the scope assertion. Skeletons
                               # until #349/#358 flip deployment (gate-then-stabilize); the
                               # monolith `server` remains the deployed runtime. A GLOB on
                               # purpose: a new deployable joins the workspace by being generated.
    "crates/domain",           # ★ pure DDD facade — re-exports the scope crates' generated types
                               # (same type identity) + hand-written aggregates, DomainEvent union,
                               # states/lifecycles folds; depends only on crates/domains/*
    "crates/application",      # use cases + ports (traits) — depends on domain
    "crates/sirene_ingest",    # SIRENE raw-ingestion client + CI bin (ADR-0045) — NO domain crates (thin CI build)
    "crates/actor_runtime",    # durable-mailbox actor machinery (ADR-20260730-234918) — EXTRACTION-READY:
                               # zero Captain.Food crates (enforced by its dependency_rule test); generic
                               # over a MessageHandler, so another product can lift it wholesale
    "crates/actor_client",     # the actor-mailbox BOUNDARY crate (PROP-20260802-130500 D1/D4, #290):
                               # the Mailbox port, the private MailboxEntry, the generated typed
                               # generic ActorClient (read door) and the opaque ActorDoor the
                               # per-actor client crates enqueue through. The ONLY crate that can
                               # construct a mailbox row — the compiler enforces what the door-guard
                               # test used to scan for. No sqlx, no reqwest.
    "crates/clients/*",        # ONE CRATE PER MAILBOX ACTOR (PROP-20260802-130500 phase 2, #306):
                               # `client-restaurant`, `client-cart`, …, one per aggregate AND per
                               # process manager. GENERATED (manifest included) from actors.yaml —
                               # never hand-edited. A GLOB on purpose: a new actor's crate joins the
                               # workspace by being generated, so the members list cannot drift from
                               # the spec. Depending on one is the permission to address that actor.
    "crates/infrastructure",   # adapters implementing ports — depends on application, domain, sirene_ingest (wire types)
    "crates/bin_probes",       # the probe/telemetry FLOOR of every bin (#385 API-tier wiring):
                               # build identity, telemetry init, /health + /ping serving and
                               # graceful drain — NO database, NO domain, so the pure gateway/
                               # surface families can stand on it without infrastructure
    "crates/gateway_runtime",  # the gateway-{role} runtime (#385, D8): parse a GraphQL document's
                               # top-level fields, route to the owning subgraph from the
                               # codegen-emitted composition table, proxy the request — NO
                               # database, NO domain crates, NO state (a domain dep here is a
                               # boundary violation to review)
    "crates/surface_runtime",  # the fo-*/bo-* surface runtime (#385, D8): audience host serving,
                               # SSR of the generated screens through the role gateway (HTTP
                               # transport — no direct views access), the wasm /assets dir —
                               # depends on web + bin_probes, never on server or infrastructure
    "crates/bin_runtime",      # the per-bin COMPOSITION KIT (#385, ADR-20260807-183024): telemetry
                               # init, declared-size pg pool, probe server, and the fleet/runner/
                               # projector spawn helpers the GENERATED bin mains call — hand-written
                               # composition-root machinery shared by the 49 deployables, so a wired
                               # main stays a parameter list instead of a copied monolith
    "crates/adapters/stripe",  # Stripe partner adapter (ADR-20260718-213352) — ACL + webhook shell + standalone bin
    "crates/adapters/hubrise", # HubRise partner adapter (ADR-20260718-213352) — ACL + webhook shell + standalone bin
    "crates/adapters/avelo37",  # Avelo37 delivery-partner adapter (ADR-20260718-213352, issue #28) — ACL + webhook shell + outbound + standalone bin
    "crates/adapters/coopcycle", # CoopCycle delivery-partner adapter (ADR-20260721-122910, issue #58) — federated per-instance ACL + webhook shell + outbound + standalone bin
    "crates/adapters/uber_direct", # Uber Direct delivery-partner adapter (ADR-20260721-172500, issue #57) — OAuth2 outbound + X-Uber-Signature ACL + webhook shell + standalone bin
    "crates/telemetry",        # OTel emission + structured logging (issue #191) — a FRAMEWORK-boundary
                               # crate. Sits OUTSIDE the domain graph on purpose: `domain` and
                               # `application` must not depend on it (enforced by a test), because
                               # instrumentation belongs at boundaries, never in an aggregate.
    "crates/db_test_gate",     # the DB-TEST GATE (#474) -- the ONE place that decides whether a
                               # database-gated suite may skip. DEV-DEPENDENCY ONLY: nothing in the
                               # app graph links it and it links nothing (std only). It replaced 17
                               # hand-copied env dances across 5 crates, each of which was a chance
                               # for the polarity to drift; since #474 the polarity is REQUIRED by
                               # default and an opt-out leaves a receipt.
    "crates/shared_types",     # serde DTOs (+ UniFFI later)
    "crates/core",             # Crux core over domain — depends on domain, shared_types
    "crates/server",           # Axum BFF — depends on application, infrastructure, shared_types
    "crates/web",              # Leptos/WASM — depends on shared_types, core
    "crates/desktop",          # Tauri shell — depends on server, web
]

[workspace.package]
edition = "2021"
license-file = "LICENSE.md"

# The D6 LINT FLOOR (PROP-20260802-130500, #302): the workspace-wide lint baseline every member
# inherits via `[lints] workspace = true`. `unsafe_code = forbid`: no crate in this workspace
# writes unsafe today, and an AI session must not be able to introduce an unsafe block silently —
# the day a real FFI crate needs one (shared_types/UniFFI, desktop/Tauri), it replaces
# `workspace = true` with its own `[lints]` table, a visible one-crate manifest diff to review,
# never a workspace-wide relaxation. Boundary crates additionally deny `unreachable_pub` in their
# own `[lints]` tables (Cargo inheritance is all-or-nothing, so they restate the floor there).
# The floor is guarded by the codegen test `lint_floor_covers_every_member` — a new member crate
# cannot silently skip it.
[workspace.lints.rust]
unsafe_code = "forbid"

# The #388 env-mutation ban: std::env::set_var/remove_var are disallowed (see clippy.toml for the
# method list and rationale — concurrent setenv/unsetenv vs getenv is glibc UB, the intermittent
# test-binary SIGSEGV class). DENY here covers every `[lints] workspace = true` member; crates that
# restate their own `[lints]` tables are covered by CI's `-D clippy::disallowed-methods` flag
# (Cargo lint inheritance is all-or-nothing, and the restating crates only restate the rust floor).
[workspace.lints.clippy]
disallowed_methods = "deny"

# Optimized release profile for the deployed `server` binary. This tunes the RUNTIME performance of the
# generated code and is independent of the build method (Docker vs native cargo) — the binary runs the same
# either way; these flags are what actually make it faster. `panic = "abort"` is deliberately NOT set: the
# server relies on per-request panic isolation (a panicking handler must not take down the whole process),
# which needs unwinding. `target-cpu` is left generic — Render's build and run hosts are not guaranteed to
# share a CPU, so a `native`-tuned binary could target the wrong chip. The extra compile cost of `lto` +
# `codegen-units = 1` is absorbed by the cargo-chef dependency-layer cache (ADR-0042).
[profile.release]
lto = "thin"          # cross-crate inlining — the main throughput/latency win
codegen-units = 1     # maximize optimization within each crate (slower build, faster binary)
strip = true          # drop symbols — smaller binary, faster load, no runtime-speed change

# Debug info is the single largest consumer of disk in this workspace, and almost none of it is read.
# Measured on the default (`debug = true`) profile: `target/debug` reached 17G, of which `deps/` was
# 13G, and 85% of the largest artifact (`server`, 506M) was `.debug_*` DWARF sections. Sessions run in
# a container with a fixed disk allowance, and exhausting it fails builds in ways that look like
# toolchain corruption rather than a full disk (see docs/claude/sessions/environment.md §2 and
# docs/claude/sessions/gates.md §11).
#
# `line-tables-only` keeps exactly the debug info anyone here actually consumes — file:line in panic
# messages and test backtraces — and drops the variable/type DWARF that nothing but an interactive
# debugger reads. A step debugger still attaches; it just cannot resolve local variables. If you need
# full DWARF for a debugging session, override locally rather than committing it back:
#   CARGO_PROFILE_DEV_DEBUG=true cargo build
[profile.dev]
debug = "line-tables-only"

# Centralized versions for the light, host-buildable deps used by the skeleton. Heavier framework deps
# (axum/tokio/async-graphql, sqlx, leptos, tauri, crux, uniffi, reqwest) are added per crate when that
# layer's real code lands — kept out of the scaffold so `cargo build` stays fast and green everywhere.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database for the service-window evaluation (RSO-1, DECISIONS §43): converting the
# UTC request instant into the restaurant's LOCAL wall clock must be total and DST-safe, which a
# fixed offset cannot be (the fold-back night makes any FixedOffset lie for one hour a year).
chrono-tz = "0.10"
thiserror = "2"
async-trait = "0.1"

# HTTP/DB runtime — landed with the `server` crate's real surface (ADR-0035). native-tls is used for
# sqlx TLS deliberately: it maps to SChannel on Windows dev boxes (no C compiler needed) and OpenSSL on
# Render's Linux build image, whereas rustls would require building `ring` (needs a C toolchain).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# Migrations are applied by sqlx-cli in CI (ADR-0043), not embedded in the app — so no `migrate`/`macros`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres"] }
# GraphQL BFF (ADR-0006 role-as-path). async-graphql 7.x targets axum 0.8. The `chrono` feature backs
# the `DateTime` scalar in the generated type layer.
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
