evidence: "Founder decision 2026-08-22 (reversing the same-day deferral before it landed): Captain.Food adopts the INTEGRATION DESIGN, not a proven working repository installation. The first controlled decision-lookup.sh --install is a REQUIRED ACTIVATION TEST; if install, scriptless BM25 indexing, or the required fallback behavior fails, the integration is not silently repaired or widened — the failure is recorded and a new/reversal decision opens before any change to package, version, permissions, or dependency shape. The successful sandbox spike (scriptless pinned @tobilu/qmd 2.8.3; useful ranked Markdown candidates; Markdown mask blind to docs/decisions/*.yaml; one both-tools miss; QMD-proposal contamination in the corpus) is evidence, not proof the repository wrapper works. Authorizes ONLY the decision-lookup skill + wrapper + gitignored/claudeignored .qmd/ cache. Does NOT authorize GraphRAG, vector search, embeddings, model downloads, reranking, query expansion, MCP, hosted services, credentials, hooks, CI/validator/agent-contract changes, or YAML decision-row indexing. QMD is not memory and not decision authority: a result or the absence of a result never decides anything. Boundary, activation and rollback detail: PROP-20260822-171212. ACTIVATION COMPLETED 2026-08-23 (durable record: docs/status/journal-2026-W34.md, 2026-08-23 entry): first --install failed correctly on a whitespace-sensitive trustedDependencies verification grep against Bun-reformatted JSON (a false negative — the enforcement held, Bun blocked 6 postinstalls); separately authorized reversal 588cbd8 replaced it with structural stdlib-JSON parsing (key present and EXACTLY an empty list); the separately authorized retry passed: scriptless pinned @tobilu/qmd 2.8.3, lockfile integrity verified against the recorded sha512, observed JSON schema top-level-array (a pinned shape, parser unchanged), corpus from git archive HEAD, index at .qmd/corpus/.qmd/index.sqlite. QMD remains advisory only. AMENDMENT 2026-08-24 (separately authorized, directed after the PR #674/#675 reviews): the non-authorization of CI/validator changes is NARROWED — the hermetic stub suite (bash + python3, fake bun/qmd under a temporary DECISION_LOOKUP_HOME, no install, no network, repo .qmd/ fingerprint asserted untouched) is wired into the always-run `changes` job and pinned by a codegen test, because SKILL.md declares that suite the executable authority for a wrapper carrying a supply-chain gate and an unrun authority is prose. This authorizes EXACTLY that step plus its pin; every other clause of the non-authorization stands unchanged — no hooks, no agent-contract change, no validator rule over specs, and no widening of package, version, permissions or dependency shape."
