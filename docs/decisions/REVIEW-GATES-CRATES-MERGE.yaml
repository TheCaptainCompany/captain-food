key: "REVIEW-GATES-CRATES-MERGE"
status: "decided"
question: "Should the independent review pass gate auto-merge on PRs touching crates/**, or keep merging on green CI with review findings landing as follow-up PRs?"
owner: "founder"
opened: "2026-08-28"
decided: "2026-08-28"
decided_by: "ADR-20260828-023258"
register: "docs/proposals/DECISIONS.md (raised by the JWKS review chain, 2026-08-28)"
evidence: "MEASURED ON THE JWKS CHAIN (#684 -> #692 -> #693 -> #694, night of 2026-08-27/28). The merge posture is ready-for-review + auto-merge as one step (ADR-20260815-115220), and the review pass fires on presentation (ADR-20260826-084500). On a small PR the required checks go green in ~5 minutes while the review pass posts in ~10, so auto-merge fired BEFORE the review landed on every PR in the chain -- #684's review arrived after merge, #692's three comments arrived 30 seconds before its merge, #693's and #694's after theirs. Every finding was real and every fix was small, so under the standing 'if the fix is small always do it now' (ADR-20260827-081500) each round became a follow-up PR: four merged PRs where one or two might have carried the whole chain, and the review-round ceiling (three rounds on one subject) was reached on work that never once shipped a defect to main -- each merged state was correct; the rounds hardened guarantees. COSTS OF THE STATUS QUO: more PRs and more CI runs per subject; review findings can sit on main (briefly) before their fix; the ceiling fires on churn rather than on disagreement. BENEFITS: main advances immediately on green; a slow or stuck reviewer can never block shipping (the failure mode REV-1 removed deliberately when claude-review left the required checks); the review still always lands and is always triaged. OPTIONS: (a) keep as is -- fast, review lands post-merge on small PRs, follow-ups absorb findings; (b) make the review pass a required check for PRs touching crates/** only -- review gates merge where behaviour lives, docs/spec lanes unaffected; reintroduces 'reviewer down = merges blocked' for that class, which REV-1 removed on purpose; (c) a timing compromise -- delay enabling auto-merge until the review pass has posted once (procedural, not enforced by branch protection, so it costs discipline rather than a ruleset change); (d) decide later -- the cost is churn, not defects. NOT the team's to close: it reverses part of the posture the founder set via REV-1 and ADR-20260815-115220. DECIDED (a) BY THE FOUNDER 2026-08-28, via the call-sheet form (round 3), verbatim: 'Keep as is (merge on green, review lands after)' (ADR-20260828-023258). The posture of ADR-20260815-115220 stands unchanged; the review pass keeps firing on presentation and its findings keep landing as follow-up PRs when the merge outruns them; options (b) and (c) rejected in the same act."
