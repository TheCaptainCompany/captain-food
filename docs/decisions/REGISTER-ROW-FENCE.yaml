key: "REGISTER-ROW-FENCE"
status: "open"
question: "Should a decision row's authorized/not-authorized fence be a STRUCTURED, machine-checkable field pair (`authorizes:` / `not_authorized:`) instead of prose inside `evidence:`?"
owner: "team"
opened: "2026-09-01"
register: "docs/proposals/DECISIONS.md (generated index row)"
evidence: "Residue split off from RETRIEVAL-QMD-ROWS at close time, per docs/decisions/README.md ('partial closure = split at close time'). ROOT CAUSE, not a style complaint: the row schema has NO FIELD for a fence, so every row that fences a surface has to say what it authorizes, what it does not, which additions rode along, and what the failure protocol is — all as free prose inside the single `evidence:` scalar. On the QMD chain that field reached 2412 words (its predecessor RETRIEVAL-QMD: 248), and the consequence is measured rather than predicted: carrying that prose forward by hand has now drifted FOUR times on the SAME row. Occurrences one to three are enumerated in RETRIEVAL-QMD-CI's own clause history (a rider count of two while three had landed; three while four had landed; a fifth rider named in no record at all). Occurrence four was found while writing its successor: after GATE-STEP-LOCUS moved the CI step from the `changes` job to `gate-scripts`, the chain head still named the `changes` job, still named a pin test `the_stub_suite_runs_in_the_always_run_changes_job` that does not exist, and still attributed rider (f)'s timeout cap to `changes` — three false statements in the one record a session resolves as authority, inside the row that documents this exact drift. A fifth is SCHEDULED, not risked, as long as the fence is prose: prose cannot be walked, diffed or asserted, so nothing can tell a successor that a clause was dropped or that a named job or test no longer exists. WHAT A STRUCTURED FENCE WOULD BUY: `authorizes:` and `not_authorized:` as lists make carry-forward a SET operation a validator can check (every predecessor entry either appears in the successor or is explicitly retracted), and list entries that name a repository artifact — a test function, a CI job, a path — become resolvable, so `the_stub_suite_runs_in_the_always_run_changes_job` would have redded the moment it stopped existing rather than being copied forward twice. Compiler-first note (ADR-20260803-234035): a list field is not a gate, it is a SHAPE — the checkability follows from the shape, which is the cheaper level. OPEN QUESTIONS this row must answer, not assume: whether the fence fields are optional (most rows fence nothing and must not be forced to carry empty lists), whether entries are free strings or `$ref`-like resolvable handles, whether a successor's carry-forward is validator-ENFORCED or merely reported, and what happens to the 80+ existing rows (a migration of prose fences into lists is the expensive half, and rows are cited by key from instruction surfaces, so it is not a free rewrite). Not urgent, not blocking: RETRIEVAL-QMD-ROWS landed with its fence in prose like every row before it, and stated the four corrections explicitly rather than copying them."
