key: "QUOTE-STALENESS"
status: "decided"
question: "What is the staleness policy for a priced quote token -- accept within N minutes, within M catalog versions, or both?"
owner: "team"
capacity: "founder"
opened: "2026-08-31"
decided: "2026-08-31"
decided_by: "ADR-20260831-165146"
register: "docs/proposals/DECISIONS.md §42"
note: >
  DECIDED: N = 30 MINUTES, AS A BACKSTOP ONLY. M (a catalog version count) is DROPPED. Sub-decision
  of QUOTE-TOKEN (decided 2026-08-31). The founder took the team's priced recommendation
  (PROP-20260831-134539 section 7) unchanged, choosing the option labelled "30 minutes
  (recommended)".

  WHAT 30 IS DERIVED FROM, because the number is meaningless without it: the p99 of the cart-to-pay
  leg WITH THE MANDATORY SCA/3DS BANK-APP DETOUR IN IT -- the tail is a customer bounced into a
  banking app, not a customer deliberating. It is NOT a risk setting. The 99th-percentile customer
  never meets it, so on a live session it essentially never fires. Sizing it from risk appetite
  would have produced a much smaller number and paid a conversion cost on the ETA path for a
  correctness benefit the delta-total gate already provides.

  WHY N EXISTS AT ALL: carts never expire (specs/ordering/actors.yaml:15, re-verified 2026-08-31 at
  9cd15c75 -- the comment reads "carts never expire, so there is no abandonment state"), so the
  token's N is THE ONLY CLOCK ON THE WHOLE CART. That is a bigger job than the name "staleness
  policy" suggests, and it was put to the founder as such.

  WHY M IS DROPPED: the catalog stream also carries OfferStockUpdated from POS callbacks
  (specs/catalog/events.yaml:198), so at a busy service the stream advances constantly for reasons
  that have nothing to do with price -- any small M is a 100%-fire timer wearing a correctness
  costume. The version stays as the as-of anchor and for audit; the gate is on delta-total.

  ALTERNATIVES REJECTED, WITH THEIR COSTS. (a) SHORTER (about 5 minutes or less): fires on ordinary
  Friday-night sessions, and every firing is a reprice interstitial shown to a customer who did
  nothing wrong -- conversion paid on CORRECT sessions. (b) LONGER: a quote outlives the service
  state it was priced in, which is the guarantee the token exists to protect. (c) DIVERGENCE-GATED
  WITH NO BACKSTOP AT ALL: honest about the missing instrument, but with carts that never expire it
  leaves an unbounded-age quote honourable.

  THE STANDING CAVEAT, AND WHAT WOULD CHANGE THE NUMBER. 30 is a DERIVED JUDGEMENT, not a
  measurement: the instrument that would let N be re-derived from evidence does not exist
  (PROP-20260831-134539 section 9 C1 -- `quote_age_seconds` at PlaceOrder; `grep -rn "quote|reprice"
  specs/observability.yaml` returned 0 hits, 2026-08-31). Under ADR-20260808-144738 this is an
  EVIDENCE-DEFERRED decision. WHAT WOULD CHANGE IT: contract C1 shipping with the mechanism and one
  observed peak -- then N is re-derived from the observed cart-to-pay p99 rather than defended as a
  guess. It is a backstop to be re-derived, never a permanent constant, and re-deriving it needs no
  new founder question unless the direction of the answer changes.

  NOT A RISK CONTROL, AND THE RECORD SHOULD NOT BE READ AS ONE: what protects the price is
  divergence (PROP-20260831-134539 F4/F6 -- charge the quoted amount or refuse, never more; fire on
  a non-zero delta, never on expiry). N only bounds how old a quote may be before the write side
  insists on re-pricing.
evidence: >
  Founder decision 2026-08-31, put through AskUserQuestion with a register-check trail, options,
  trade-offs and a recommendation; his answer is the option label, verbatim: "30 minutes
  (recommended)". Recorded by ADR-20260831-165146. The recommendation he took is
  PROP-20260831-134539 section 7 verbatim: "N = 30 minutes, as a backstop only. M (a version count)
  is dropped."
