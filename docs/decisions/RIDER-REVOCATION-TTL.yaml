key: "RIDER-REVOCATION-TTL"
status: "decided"
question: "A JWT claim is a cached fold we cannot invalidate, so an outstanding token keeps working after a suspension fact is appended. How long may a suspended rider's app keep working?"
owner: "founder"
opened: "2026-08-30"
decided: "2026-08-30"
decided_by: "ADR-20260830-234532"
capacity: "founder"
register: "docs/adr/ADR-20260830-234532-the-second-sitting-publish-france-wide-revocation-is-immediate-and-the-objection-chain-was-decided-22-days-ago.md"
evidence: "Immediately, on the next request -- no TTL window. The write path re-derives the binding from our Postgres per request, so the token's remaining life stops mattering."
note: "Closes residue 4 of ADR-20260830-213135. THREE things the phrase does not cover, and the slice owes all three: (1) the socket does not re-resolve -- authorize_and_resolve_scope resolves ReadScope ONCE and the WS leg calls it from connection_init (routes.rs:210-211, its own doc says ONCE), so a rider suspended mid-shift keeps ReadScope::Rider until they disconnect; (2) per-request IDENTITY resolution is not per-request AUTHORIZATION -- the revocation fact must be a term in the derivation or the cache is rebuilt one layer down; (3) a rider standing still makes no request, so arrival must be a PUSH (ADR-20260810-231300), not a TTL. legal-specialist: this is the rare answer that REMOVES an obligation -- a non-zero window would make every misconduct revocation an Art. 33 breach analysis. ux-designer: the slice's real deliverable is the HANDBACK, not the lock screen -- DeclineDelivery/ReportDeliveryIssue/ResolveDeliveryIssue have zero api operations, so a revoked rider holding paid food cannot give it back."
