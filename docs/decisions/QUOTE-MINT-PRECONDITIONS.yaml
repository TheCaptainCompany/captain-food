register: docs/adr/ADR-20260906-154419-the-priced-read-is-served-from-the-fold-and-carries-its-coordinate-behind-a-door.md
evidence: 'The write path already reads the Catalog projection at every add-to-cart/checkout (STO-7,
  open); slice 3a introduces a SECOND read path -- the event-stream range read to head -- behind
  this door, so a rolling deploy in which half the fleet folds and half projects is a fleet-parity
  hazard the door''s own `declare_flag` at both composition roots (ADR-20260905-223957 §5,
  ADR-20260906-113444) makes observable rather than invisible. Production is suspended
  (ADR-20260817-105844) and the rider/customer population is zero; nothing in this row is urgent by
  a calendar clock, but the door stays pinned `false` until the items above are discharged in a
  recorded decision (gate-then-stabilize, ADR-20260808-144738).'
note: 'The door opens ONCE, after §11 item 5 lands (items (9) and (11) are item-5 content); 3a and
  item 4 both ship dark. The key is consumed at the READ door only, never a write: `cart.current`/`cart`/`carts`
  (`crates/server/src/graphql/cart_read.rs::priced`) resolve OFF as the closed arm (today''s
  projection-priced read, unchanged) and ON as the fold-priced open arm
  (`AsOfPriceAuthority::at_head` + `application::pricing::price_cart_at`). Nothing else reads this
  key. `RUN_FOLD_PRICED_CART_READ` is declared at BOTH composition roots
  (`crates/server/src/lib.rs`, `crates/infrastructure/src/mailbox/standalone.rs`) per the recorded
  fifth carve-out of ADR-20260904-081527 §8''s standing clause -- the standalone declaration is
  fleet-parity EVIDENCE only; the standalone fleet never serves GraphQL and never opens this door in
  practice. Closing this row: (1)-(2) land WITH the code in this same PR (slice 3a, PR #922); (3)
  is a one-time drill run before any production flip; (4) is slice 3b, the very next card in the
  same lane (holub''s WIP-one condition, journal 2026-09-06) -- 3b and the command-change slice ship
  as ONE deliverable: the customer is charged the price they were shown, or told why it changed, in
  words; (5) is #921 item 2, a named
  precondition of the flip, not of this door existing dark. Consulted at the 2026-09-06 briefing:
  business (the budget as headroom, the cheapest-lever order), young (the rebuild-window rejection
  of option (a)), vernon (one read, no mixed authority, nothing durable in 3a), holub (the
  WIP-one-lane condition and "a quote nobody is held to is inventory"), dba (the (a)/(b) split, the
  bytes-not-length cost, the buffer-cache instrument, the wall-crossing name), observability (the
  contract rows, the dead-man counter), farley (the walk drill, the gate form, the rollback shape),
  legal (3a discharges nothing, B1 stays open, the telemetry hygiene fence), evans (the envelope
  placement, `processmanager.yaml:68`''s rewrite), graphql (the response-only/nullable shape), ux
  (the premise correction: `cart.current` is exactly two screens'' data_requirement, never the ETA
  or menu surface), beck (the red-first suite and the ceiling-as-multiple-of-target discipline).'
