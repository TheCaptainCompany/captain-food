key: ADMIN-DOOR-PRECONDITIONS
status: open
question: 'What must exist before `RUN_PLATFORM_ACCESS_GRANT` (step 6-v, the platform grant + the ADMIN seam
  binding) is flipped and, after it, before the System host is routed behind auth (step 6-iii), per
  ADR-20260905-223957? Named at the 2026-09-05 briefing (thirteen lenses): (1) the first admin is a RECORDED
  ACT -- the one-shot bootstrap dispatches `GrantPlatformAccess` (basis CAPTAIN_ONBOARDING) through the mailbox,
  subject from a secret never the repo, idempotent (running twice appends one fact), inside an OTLP-wired process,
  leaving the Art. 5(2) artifact (who, when, basis, authority) -- never a projection row, SQL or a data migration
  (vernon, young, farley, beck, legal, observability); (2) the seam refuses an unbound ADMIN token -- `Identity::Admin`
  is unspellable without a live `PlatformMembership` grant -- proven red-first (beck); (3) Art. 13 information at
  collection for Captain''s own admin (NOT the restaurant colleague''s Art. 14), and a SECOND Art. 30 entry with
  Captain as sole controller over its own worker, incl. admin action logs and their retention (grade (b), counsel
  verifies the CNIL access-log doctrine) -- the founder''s, external: no entity capacity is recorded and no Art. 30
  register artifact exists in the repo (legal); (4) the labour posture of the first admin (employee / associe /
  mandataire under the SAS -- the SCIC conversion is deferred to M18) -- counsel + founder, upstream of the lawful
  basis (legal, business); (5) the `admin-sign-in` observability contract and the two dead-man gauges at BOTH
  composition roots, plus farley''s codegen test that every `RUN_*` key is declared unconditionally at both roots
  with the same default; flip evidence (metrics that actually ship with 6-v — the ADMIN path has no
  claim stamp, so no such metric is named here): `admin_identity_resolve_total{result}` shows at
  least one `resolved`; `read_authorization_bridge_unresolved_total{role="ADMIN"}` flat; the second
  dead-man gauge arrives with 6-iii, so only `platform_access_grant_enforcing` is asserted 1 here
  (observability);
  (6) for 6-iii: the System sign-in and both refusal screens exist as their OWN screens, the anonymous browser
  receives the sign-in shell and never the board (ux); (7) the `?next=` return-to-screen + silent refresh retry
  (#904) so the 19:40 lockout does not strand the only person who can make a customer whole (ux, business);
  (8) revocation of platform access is a follow-up once a second admin exists (holub) -- until then the row says so.'
owner: team
opened: '2026-09-05'
capacity: team
register: docs/adr/ADR-20260905-223957-the-admin-door-in-two-slices-a-platform-membership-binds-the-admin-seam-then-the-system-host-is-routed.md
evidence: 'Today `crates/server/src/auth.rs:~308` mints `Identity::Admin { sub }` from the token role alone and
  `ReadScope::Admin` is `ScopePredicate::All` over 77 ADMIN operations (graphql-architect, verified 2026-09-05) --
  a role claim is the only thing between an anonymous token and a cross-tenant read. Nothing flips while production
  is suspended (ADR-20260817-105844).'
note: 'External items are the founder''s (controller entity, the Art. 30 register, the labour posture, the first
  admin''s identifier held as a secret); no lens output is legal advice or clearance. Items (1)-(2) and (5) LANDED
  with 6-v (PR #907, DRAFT, ADR-20260905-223957): (1) the one-shot `bootstrap-platform-admin` dispatches
  `GrantPlatformAccess` through the ordinary mailbox, subject from the declared secret
  `PLATFORM_BOOTSTRAP_ADMIN_SUBJECT` (never the repo), deterministic id (idempotent), inside the OTLP-wired
  server process, logging the Art. 5(2) artifact; (2) `crates/server/src/auth.rs`''s ADMIN seam
  (`resolve_platform_scope`) makes `Identity::Admin` unspellable without a live `PlatformMembership` grant,
  proven red-first (`an_admin_token_with_no_platform_grant_is_unbound.rs`); (5) the `admin-sign-in` contract and
  `platform_access_grant_enforcing` at both composition roots, plus the new `RUN_*` fleet-parity codegen test
  (`tools/codegen-rs/src/tests.rs::run_flag_parity`), landed.
  Item (6) LANDS with 6-iii (PR #909, DRAFT, ADR-20260906-023825): the `sign_in`/`sign_in_return`/`no_access`
  screens on `system.yaml` (their OWN copy, never `restaurant_backoffice.yaml`''s reused), `requires_auth` +
  `unauthenticated:` on every existing System screen (`mailbox_lanes`/`riders`/`rider_detail`), `Surface::System`/
  `HostRoute::System` routing the SDUI shell, and the `admin_sign_in_door_enforcing` gauge declared beside
  `platform_access_grant_enforcing` at BOTH composition roots (`crates/server/src/lib.rs`,
  `crates/infrastructure/src/mailbox/standalone.rs`). The address a stranger types into
  `requestAdminSignInLink` lands durably in the mailbox payload row (Postgres, `inbound_messages`)
  BEFORE any grant check -- a SECOND store beside the identity provider; its retention and the #194
  erasure reach must be named before `RUN_ADMIN_SIGN_IN_DOOR` flips (round 2 R2-2, legal). Flip evidence for the door key (`RUN_ADMIN_SIGN_IN_DOOR`):
  the gauge reads 1 at both roots across the drill window; `admin_sign_in_confirmed_total{result=granted}` >= 1
  (round 2 R2-4, evans: the success token is "granted", nothing links here) with
  `admin_claim_stamp_failed_total` at 0; a not-granted confirm is an OUTCOME, not a refusal, so it
  is accounted at `admin_sign_in_confirmed_total{result=not_granted}` (round 2 R2-6, reviewer),
  never at `admin_sign_in_refused_total{reason}` -- the latter accounts refusals BEFORE the IdP
  confirms anything (door-closed, rate-limited, token invalid/expired); no `claims.stamp` without a
  preceding `admin_identity_resolve_total{result=resolved}` per correlation id -- named here per obs
  SS4, not yet run (no live environment). (7) `?next=`/silent-refresh (#904) LANDED (PR #915): the
  `RefreshingTransport` decorator in `crates/web/src/graphql.rs` gives every page load one silent
  401-refresh-and-reissue before any `unauthenticated:` bounce (a 403 never arms it), and the
  `safe_next` allowlist in `crates/web/src/router.rs` plus the `bounce_target` composition in
  `crates/web/src/bounce.rs` carry a router-validated `?next=` back to the screen the ADMIN bounced
  from -- entirely client-side, no server/spec change beyond a `gaps:` line naming the still-missing
  session-ended copy (`specs/screens/system.yaml`), no observability (no WASM OTel;
  `auth_refresh_total{outcome}` named as a server-side follow-up, not built here).
  STOP raised on 6-iii (PR #909, farley''s own Q2 CATCH): `make generate` produced a `deploy/generated/**` diff
  -- the new `AdminSignIn` actor''s OWN manifest/image/kustomization entries (mechanically identical to every
  prior 6-* slice''s own new actor, e.g. 6-v''s `actor-platform-membership`), AND a genuinely new
  `/public/graphql` path added to the `system.captain.food` ingress host block (`deploy/generated/manifests/
  ingress.yaml`) -- because the `sign_in`/`no_access`/`sign_in_return` screens carry `graphql_role: PUBLIC`,
  exactly the SAME mechanical rule that already put `/public/graphql` on `restos.captain.food` (6-ii) and
  `riders.captain.food` (2c-i)''s ingress blocks. Farley''s Q2 ("6-iii needs NO manifest/DNS/cert change") did
  not anticipate this consequence of the door''s own PUBLIC screens. Not resolved by this executor per the
  card''s unconditional STOP wording; the architect/coordinator decides whether this is the SAME accepted class
  as 6-ii/2c-i''s identical diff or needs a different shape.
  Ordering, stated plainly: flip `RUN_PLATFORM_ACCESS_GRANT` and run `bootstrap-platform-admin`
  BEFORE any environment relies on ADMIN — the seam ships fail-closed precisely so this ordering
  cannot be skipped by accident, not because any environment today depends on it being followed. Founder confirmed 2026-09-06 (status form, all seven external items): "Not yet -- keep carrying it" -- relayed to the whole roster (thirteen lenses, journal 2026-09-06), nothing decided or reversed; re-ask only when production un-suspends (ADR-20260817-105844) or a Tours restaurateur is scheduled (architect). Consequence (farley): PLATFORM_BOOTSTRAP_ADMIN_SUBJECT unprovisioned = an environment boots green with ZERO admins and the admin sign-in happy path is unsmokeable; EMAIL_QUOTA_KEY_HMAC_SECRET unprovisioned = staging/production refuse to boot (exit 78, `crates/server/src/generated/config.rs:~543`) -- provable, not silent. The bootstrap subject IS the stream identity (young): item 3 is reversible only until the first bootstrap run. Items (3)/(4) carry no calendar clock while no real personal data exists, but fire instantly at the first real sign-in, and the labour posture accrues backwards from the first day worked (legal, never clearance). The four door gauges read 0 by design while this row is open; nothing alerts on them until the flip-time 0->1 (observability). Item (6) LANDED with 6-iii (PR #909, squash 7fc8e60a, 2026-09-06): the System sign-in, `admin_sign_in_return` and `no_access` screens exist as their own screens; the anonymous browser receives the sign-in shell and never the board; the `admin_sign_in_door_enforcing` gauge ships at both roots. Still open: (3), (4), (8) and the founder''s external items -- the flip of RUN_ADMIN_SIGN_IN_DOOR waits on them.'
