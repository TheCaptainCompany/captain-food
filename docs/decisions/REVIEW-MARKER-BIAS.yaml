key: "REVIEW-MARKER-BIAS"
status: "open"
question: "Does the `claude-review` marker matcher keep its FAIL-OPEN bias (count an ambiguous marker) — and does its differential harness stay out of CI?"
owner: "team"
opened: "2026-08-25"
register: "docs/proposals/DECISIONS.md"
evidence: "OPENED LATE AND RECORDED AS SUCH. Both halves were settled inside PR #680 by a code comment, with no declared row — the same defect REVIEW-GATE-BYPASS was created to retire, one round later, and #680's ninth independent review caught it. The code ships the current behaviour; this row exists so the direction is visible and reversible rather than buried in a docstring. WHAT IS IN FORCE TODAY (implemented on #680, ADR-20260825-005323's PR): `.github/scripts/assert_review_marker.py` keeps exactly ONE block rule — a fence delimiter at column 0 — and treats indented lines, blockquotes, lists and HTML as LIVE, so an ambiguous marker COUNTS. THE ARGUMENT THAT SURVIVES MEASUREMENT: every no-verdict path this gate exists to catch (the action's self-skip, 429, model outage, permission denials) ends with NO marker anywhere, so biasing toward counting cannot weaken the property being bought. THE ARGUMENT THAT DOES NOT, and was written into three files before review #9 checked it: 'a false red is a repo-wide merge stop whose revert needs the same check green' — a MATCHER false red blocks the one PR whose comment tripped it and clears by re-posting; the repo-wide stop is the credit/outage case, which is a TRUE red; and an admin bypass exists (REVIEW-GATE-BYPASS). The direction survived the correction; the reason had to be repaired. THE COST, measured: a quoted marker inside a blockquote, a list, an indented block, an HTML block, `<pre>`, `<code>` or an HTML comment now satisfies the gate, where the previous design rejected the first three. Guarded only by prose ('do not paste a marker line into a comment'), which inverts this repo's prefer-executable-over-prose rule. A GENERATED CORPUS FLATTERS WHATEVER IT OVER-SAMPLES, and this one did: review #10 found its fence alphabet contained only genuine fence openers, so no body it could emit would ever expose a disagreement about whether a column-0 delimiter OPENS a fence — and a live false red had been hiding in that blind spot for two rounds (```make validate``` at the start of a line is a paragraph, not a fence, because a backtick info string may not contain a backtick). Fixed and measurable: the alphabet now carries non-openers and indented delimiters. NO CORPUS COUNT IS STATED HERE. An earlier version of this row claimed '1 of 29 real claude[bot] comments contains a fence character', a figure imported from a review report and never measured — the exact defect ADR-20260817-105845 names, relocated out of a code comment into a register row that binds future work. OPTIONS IF REOPENED: (a) keep the bias, keep the differential harness as a developer tool — the status quo; (b) keep the bias but make the residual executable — an assertion that a counting body is not a QUOTE of an earlier comment, which is the only thing prose currently holds; (c) restore block-level rules — MEASURABLE IN ONE COMMAND, and expensive: `python3 .github/scripts/assert_review_marker_differential.py --variant indent` runs the column-0 design PLUS a column-counting indented-code rule over the same corpus. The variant is committed precisely so this option is not dismissed on a number nobody can reproduce, which is what the first version of this row did. Lazy paragraph continuation is the mechanism: an indented line inside a paragraph renders live, and deciding that needs paragraph context a line-at-a-time rule does not have; (d) replace the matcher with a real CommonMark parser in CI, which subsumes (c) and settles the second half of this question too. SECOND HALF — THE HARNESS IN CI: `assert_review_marker_differential.py` is not run in CI, on the stated ground that adding a pip dependency to a security-adjacent gate is a decision nobody has taken. That ground is itself such a decision. It leaves a ratchet that only fires when someone remembers to run it. A non-required job with markdown-it-py pinned by hash touches nothing the assertion step executes, so the security-surface argument does not reach it. NOT DELEGABLE TO A COMMENT: whichever way this goes, it binds every future edit to `live_lines`."
