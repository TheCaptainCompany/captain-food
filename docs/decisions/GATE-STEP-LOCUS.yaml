key: "GATE-STEP-LOCUS"
status: "open"
question: "Do executable gate steps live INSIDE the always-run `changes` job, or in a sibling always-run job that `codegen` aggregates equally?"
owner: "team"
opened: "2026-08-25"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED. `lint`, `specs`, `build-test`, `db-test` AND `docs-validate` all carry `needs: changes`, so a red in `changes` does not merely fail that gate -- it SKIPS every other job, and `codegen` sees `failure` in `needs.*.result` and reds. The validator, the workspace build, the wasm check and both test suites are lost for a reason that has nothing to do with the diff. THE `docs-validate` EDGE IS THE SHARPEST AND WAS MISSING FROM THIS ENUMERATION (review #25): GitHub skips a job whose dependency FAILED without ever evaluating its `if:`, and `docs-validate` is the ONLY validator that runs on a docs-only push -- the lane CLAUDE.md routes spec- and docs-only changes down with no branch and no PR. So on that lane a host-drift red in the stub suite costs the one gate the change has, and `codegen` reds twice (once on `changes: failure`, once on its by-name `DOCS_ONLY=true && DOCS_VALIDATE != success` assertion). Option (b) is therefore NOT free on the lane this team ships down most often, which is the sizing that decides this row. That coupling pre-dates PR #679 (the register-check hook selftest already sat there), but the second step is not like the first: the hook selftest is ~200ms of dependency-free shell, while the stub suite drives python3 at ~14 sites and constructs non-UTF-8 paths, symlink PATH fixtures, an ASCII-locale probe and a poisoned sqlite file -- and its own step comment enumerates three host-drift classes AS EXPECTED FAILURE MODES. Those reds fire on a runner-image bump, i.e. on a change that touches none of this, and take all build and test signal with them. ADR-20260824-205911 banks the question honestly (nobody was asked whether the step should be blocking FROM INSIDE `changes`) and names the alternative: a sibling always-run job, also aggregated by `codegen`, is EQUALLY BLOCKING without collapsing the rest of the signal. OPTIONS: (a) sibling always-run job, aggregated by `codegen`, gate steps move out of `changes` -- keeps the blocking property, removes the skip cascade, costs one more runner start per run; (b) keep gate steps in `changes` and accept the cascade -- free, and the shape hardens into precedent the moment a third gate step lands there; (c) keep them in `changes` but drop `changes` from the other jobs' `needs:` -- rejected on sight, since `docs_only` is exactly what those `needs:` consume. WHY IT IS A ROW AND NOT A BANKED PARAGRAPH: RETRIEVAL-QMD-CI authorizes ONE step IN THAT JOB, so PR #679 could not move it; a banked paragraph in an ADR is invisible to the next author, and the precedent sets itself by default. CHEAP INTERIM MITIGATION, raised by review and NOT applied in PR #679 because RETRIEVAL-QMD-CI authorizes one step and its pin, not other changes to the job: the `changes` job carries no `timeout-minutes`, so a hung python3 probe holds the whole pipeline for GitHub's 360-minute default. Whoever closes this row should price that in -- under option (b) it is the difference between a bad hour and a bad day, and under option (a) it belongs on the sibling job. Not urgent, not blocking #679."
