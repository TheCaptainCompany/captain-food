key: "GATE-STEP-LOCUS"
status: "open"
question: "Do executable gate steps live INSIDE the always-run `changes` job, or in a sibling always-run job that `codegen` aggregates equally?"
owner: "team"
opened: "2026-08-25"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED. `lint`, `specs`, `build-test`, `db-test` AND `docs-validate` all carry `needs: changes`, so a red in `changes` does not merely fail that gate -- it SKIPS every other job, and `codegen` sees `failure` in `needs.*.result` and reds. The validator, the workspace build, the wasm check and both test suites are lost for a reason that has nothing to do with the diff. THE `docs-validate` EDGE IS THE SHARPEST AND WAS MISSING FROM THIS ENUMERATION (review #25): GitHub skips a job whose dependency FAILED without ever evaluating its `if:`, and `docs-validate` is the ONLY validator that runs on a docs-only push -- the lane CLAUDE.md routes spec- and docs-only changes down with no branch and no PR. So on that lane a host-drift red in the stub suite costs the one gate the change has, and `codegen` reds twice (once on `changes: failure`, once on its by-name `DOCS_ONLY=true && DOCS_VALIDATE != success` assertion). Option (b) is therefore NOT free on the lane this team ships down most often, which is the sizing that decides this row. That coupling pre-dates PR #679 (the register-check hook selftest already sat there), but the second step is not like the first: the hook selftest is ~200ms of dependency-free shell, while the stub suite drives python3 at ~14 sites and constructs non-UTF-8 paths, symlink PATH fixtures, an ASCII-locale probe and a poisoned sqlite file -- and its own step comment enumerates three host-drift classes AS EXPECTED FAILURE MODES. Those reds fire on a runner-image bump, i.e. on a change that touches none of this, and take all build and test signal with them. ADR-20260824-205911 banks the question honestly (nobody was asked whether the step should be blocking FROM INSIDE `changes`) and names the alternative: a sibling always-run job, also aggregated by `codegen`, is EQUALLY BLOCKING without collapsing the rest of the signal. OPTIONS: (a) sibling always-run job, aggregated by `codegen`, gate steps move out of `changes` -- keeps the blocking property, removes the skip cascade, costs one more runner start per run; (b) keep gate steps in `changes` and accept the cascade -- free, and the shape hardens into precedent the moment a third gate step lands there; (c) keep them in `changes` but drop `changes` from the other jobs' `needs:` -- rejected on sight, since `docs_only` is exactly what those `needs:` consume. WHY IT IS A ROW AND NOT A BANKED PARAGRAPH: RETRIEVAL-QMD-CI authorizes ONE step IN THAT JOB, so PR #679 could not move it; a banked paragraph in an ADR is invisible to the next author, and the precedent sets itself by default. THE CONSEQUENCE THAT ACTUALLY DECIDES THIS ROW IS NOT LOST SIGNAL, IT IS A MERGE BLOCK (review #37, weighed on the domain lens rather than on CI hygiene). Everything above prices what a `changes` red DESTROYS. What it omitted is what a `changes` red PREVENTS: `codegen` is the REQUIRED status check on `main`, it reds on `needs.changes.result == failure`, and the merge posture is auto-merge-on-green -- so nothing in the repository merges at all until it clears, on any branch, for any diff, without an admin override. Compose that with the two facts already in this row -- the step's own ci.yml comment enumerates THREE host-drift classes AS EXPECTED FAILURE MODES, and `changes` had no `timeout-minutes` -- and a runner-image bump that touches none of this repo had a live path to: no checkout, dispatch or payments fix can be merged for up to six hours. CLAUDE.md puts peak at Friday/Saturday 19:00-21:30, which is where that costs most. Option (b) does not read as free once this is stated: whoever closes this row is choosing between ONE EXTRA RUNNER START PER RUN and A HOST-DRIFT RED CAN STOP SHIPPING DURING AN INCIDENT. CHEAP INTERIM MITIGATION, APPLIED IN PR #679 after review raised it twice -- `timeout-minutes: 10` on the `changes` job, ~30x its observed duration, so it bounds a HANG and nothing else, pinned by `assert_pinned_in_changes_job` which requires the key AND caps it at 30 (a large value is the 360-minute default with extra steps). IT BOUNDS A HANG AND NOTHING ELSE, AND THE RESIDUAL IS THE LIKELIER EVENT (review #40): a RED has the identical blast radius -- `changes` fails, all five downstream jobs skip, `codegen` reds, nothing merges -- and the timeout does nothing for it. That case is DESIGNED IN rather than accidental: rounds 36/37 moved ONE precondition (T16's ASCII locale) to `skipped`, while T3/T3b/T3c ('controlled PATH not constructible', 'stub bun + symlinks unavailable') and T15g's ASCII control stay hard `verdict bad`, on the stated reasoning that a harness which cannot build its own setup must not be laundered into a green. That reasoning is right for the CASE and it is exactly what makes a runner-image bump a repository-wide merge block at 19:00 on a Friday, for a payments or dispatch fix that touches none of this. So do not price the timeout as covering both: only option (a) closes the red case. AND THE FIRST VERSION OF THE MITIGATION CLOSED ONE DOOR OF SIX (review #44): `codegen` is `if: always()`, and `always()` still WAITS for a `needs:` job to finish -- so a job that HANGS keeps the required check queued indefinitely, auto-merge never fires and nothing merges, which is the identical end-state. Capping `changes` alone left `build-test` and `db-test` -- far longer-running, with a workspace build and a service container -- sitting at the 360-minute default, where a registry stall or a postgres container that never becomes healthy produces exactly the six-hour repository-wide block this row prices. Every job the aggregator consumes now carries a cap (`lint`/`specs`/`docs-validate` 20, `build-test`/`db-test` 60, `codegen` 10), asserted over the list derived from `codegen`'s own `needs:`. THE HANG CLASS IS NOW BOUNDED WORKFLOW-WIDE; the RED class is not, and only option (a) closes it. IT DOES NOT SETTLE THIS ROW: the in-job-vs-sibling-job question is untouched, and under option (a) the timeout belongs on the sibling job instead. WHY IT LANDED IN #679 AFTER ALL, since an earlier version of this clause said it would not: the hazard is one THIS PR CREATES (it is the change that puts a python3-heavy suite in the job everything `needs:`), the fix is one line, and leaving a known six-hour repository-wide merge block in place is not the conservative choice merely because it keeps a diff smaller. What that earlier version got WRONG was the reason, not the conclusion: it said RETRIEVAL-QMD-CI 'authorizes one step and its pin, not other changes to the job' (review #35), reading that row as an allowlist for the whole workflow file; the row itself disclaims exactly that reading, scoping its non-authorization to CI changes 'THAT REFERENCES OR SERVES THIS INTEGRATION' and adding that it 'says nothing about unrelated CI work, which is governed by its own records'. A job-level `timeout-minutes:` references nothing about QMD and serves the register-check selftest and the `docs_only` detector equally. THE SECOND REASON GIVEN WAS SCOPE DISCIPLINE -- PR #679's reviewed claim was that it adds exactly ONE non-comment line pair to `ci.yml` -- and that is now stated accurately instead: the PR adds the gate step AND this job-level timeout, and its body says so. The pin permits the key (the job-level ban list is `if` / `continue-on-error` / `strategy` / `needs`) and, since the gate steps' key set is locked to {name, run}, a job-level timeout is the ONLY mitigation available at all. The hazard it bounds: the `changes` job carries no `timeout-minutes`, so a hung python3 probe holds the whole pipeline for GitHub's 360-minute default. Whoever closes this row should price that in -- under option (b) it is the difference between a bad hour and a bad day, and under option (a) it belongs on the sibling job. Not urgent, not blocking #679."
