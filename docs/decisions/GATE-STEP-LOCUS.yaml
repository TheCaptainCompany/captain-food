key: "GATE-STEP-LOCUS"
status: "open"
question: "Do executable gate steps live INSIDE the always-run `changes` job, or in a sibling always-run job that `codegen` aggregates equally?"
owner: "team"
opened: "2026-08-25"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED. `lint`, `specs`, `build-test`, `db-test` AND `docs-validate` all carry `needs: changes`, so a red in `changes` does not merely fail that gate -- it SKIPS every other job, and `codegen` sees `failure` in `needs.*.result` and reds. The validator, the workspace build, the wasm check and both test suites are lost for a reason that has nothing to do with the diff. THE `docs-validate` EDGE IS THE SHARPEST AND WAS MISSING FROM THIS ENUMERATION (review #25): GitHub skips a job whose dependency FAILED without ever evaluating its `if:`, and `docs-validate` is the ONLY validator that runs on a docs-only push -- the lane CLAUDE.md routes spec- and docs-only changes down with no branch and no PR. So on that lane a host-drift red in the stub suite costs the one gate the change has, and `codegen` reds twice (once on `changes: failure`, once on its by-name `DOCS_ONLY=true && DOCS_VALIDATE != success` assertion). Option (b) is therefore NOT free on the lane this team ships down most often, which is the sizing that decides this row. That coupling pre-dates PR #679 (the register-check hook selftest already sat there), but the second step is not like the first: the hook selftest is ~200ms of dependency-free shell, while the stub suite drives python3 at ~14 sites and constructs non-UTF-8 paths, symlink PATH fixtures, an ASCII-locale probe and a poisoned sqlite file -- and its own step comment enumerates three host-drift classes AS EXPECTED FAILURE MODES. Those reds fire on a runner-image bump, i.e. on a change that touches none of this, and take all build and test signal with them. ADR-20260824-205911 banks the question honestly (nobody was asked whether the step should be blocking FROM INSIDE `changes`) and names the alternative: a sibling always-run job, also aggregated by `codegen`, is EQUALLY BLOCKING without collapsing the rest of the signal. OPTIONS: (a) sibling always-run job, aggregated by `codegen`, gate steps move out of `changes` -- keeps the blocking property, removes the skip cascade, costs one more runner start per run; (b) keep gate steps in `changes` and accept the cascade -- free, and the shape hardens into precedent the moment a third gate step lands there. SIZING INPUT ADDED BY REVIEW #69, because the row priced the consequence without stating how close it is: PR #679 IS THE SECOND STEP. The register-check selftest was the first, this is the second, so option (b) is ONE step from the precedent it names -- and whoever adds the third will find two already there and no row closed, which is exactly how a default sets itself. The same review notes the cost side of (a) is one extra runner start on a repo whose own ci.yml header records Actions as free and unlimited here. Neither observation decides the row; both were missing from it; (c) keep them in `changes` but drop `changes` from the other jobs' `needs:` -- rejected on sight, since `docs_only` is exactly what those `needs:` consume. WHY IT IS A ROW AND NOT A BANKED PARAGRAPH: RETRIEVAL-QMD-CI authorizes ONE step IN THAT JOB, so PR #679 could not move it; a banked paragraph in an ADR is invisible to the next author, and the precedent sets itself by default. THE CONSEQUENCE THAT ACTUALLY DECIDES THIS ROW IS NOT LOST SIGNAL, IT IS A MERGE BLOCK (review #37, weighed on the domain lens rather than on CI hygiene). Everything above prices what a `changes` red DESTROYS. What it omitted is what a `changes` red PREVENTS: `codegen` is the REQUIRED status check on `main`, it reds on `needs.changes.result == failure`, and the merge posture is auto-merge-on-green -- so nothing in the repository merges at all until it clears, on any branch, for any diff, without an admin override. Compose that with the two facts already in this row -- the step's own ci.yml comment enumerates THREE host-drift classes AS EXPECTED FAILURE MODES, and `changes` had no `timeout-minutes` -- and a runner-image bump that touches none of this repo had a live path to: no checkout, dispatch or payments fix can be merged for up to six hours. CLAUDE.md puts peak at Friday/Saturday 19:00-21:30, which is where that costs most. Option (b) does not read as free once this is stated: whoever closes this row is choosing between ONE EXTRA RUNNER START PER RUN and A HOST-DRIFT RED CAN STOP SHIPPING DURING AN INCIDENT. CHEAP INTERIM MITIGATION, APPLIED IN PR #679 after review raised it twice -- `timeout-minutes: 10` on the `changes` job, orders of magnitude above what that job legitimately does, so it bounds a HANG and nothing else, pinned by `assert_pinned_in_changes_job` which requires the key AND caps it at 30 (a large value is the 360-minute default with extra steps). THIS CLAUSE STATED `~30x its observed duration` and the multiplier was a bare derived number measured WRONG (the job runs ~14s, so it is nearer 43x); it was retracted from ci.yml in one commit and survived here, in the ADR and in the journal -- the half-applied sweep this branch catalogues at rounds 33, 36 and 42, landing on the retraction itself. Gone rather than corrected: the argument was never the multiplier (review #48). IT BOUNDS A HANG AND NOTHING ELSE, AND THE RESIDUAL IS THE LIKELIER EVENT (review #40): a RED has the identical blast radius -- `changes` fails, all five downstream jobs skip, `codegen` reds, nothing merges -- and the timeout does nothing for it. That case is DESIGNED IN rather than accidental: rounds 36/37 moved ONE precondition (T16's ASCII locale) to `skipped`, while T3/T3b/T3c ('controlled PATH not constructible', 'stub bun + symlinks unavailable') and T15g's ASCII control stay hard `verdict bad`, on the stated reasoning that a harness which cannot build its own setup must not be laundered into a green. That reasoning is right for the CASE and it is exactly what makes a runner-image bump a repository-wide merge block at 19:00 on a Friday, for a payments or dispatch fix that touches none of this. So do not price the timeout as covering both -- and do not price option (a) as closing the red case either, which the sentence that stood here did (retracted by review #91; the correction and what DOES close it are below). AND ON THE DOCS-ONLY LANE THE COST IS DIFFERENT IN KIND, NOT DEGREE (review #53): CLAUDE.md routes spec- and docs-only work straight to `main` as a PUSH with no branch and no PR, so there is no merge for a red to block. What happens instead is that the change LANDS -- on `main`, with `codegen` red and NO VALIDATOR HAVING RUN AT ALL, because `docs-validate` was skipped by the `needs: changes` cascade and is the only gate that lane has. Everything above prices a merge block; on the lane this team ships down most often the failure is the opposite one, and it is worse: not 'nothing gets in' but 'this got in unchecked'. AND THE FIRST VERSION OF THE MITIGATION CLOSED ONE DOOR OF SIX (review #44): `codegen` is `if: always()`, and `always()` still WAITS for a `needs:` job to finish -- so a job that HANGS keeps the required check queued indefinitely, auto-merge never fires and nothing merges, which is the identical end-state. Capping `changes` alone left `build-test` and `db-test` -- far longer-running, with a workspace build and a service container -- sitting at the 360-minute default, where a registry stall or a postgres container that never becomes healthy produces exactly the six-hour repository-wide block this row prices. Every job the aggregator consumes now carries a cap; THE VALUES ARE NOT RESTATED HERE and live in `.github/workflows/ci.yml` beside the reasoning for each, because this enumeration drifted twice in three rounds (review #62) and nothing derives it -- the pin asserts a RANGE, not the per-job values. What matters for pricing this row is the property, not the numbers: every aggregated job is bounded, `lint` among them (it runs `cargo clippy --workspace --all-targets`, a full check-build of the workspace, and was bucketed with the cheap jobs for one round on the belief it was static analysis), asserted over the list derived from `codegen`'s own `needs:`. THE HEAVY-JOB FIGURE WAS ITSELF A BARE DERIVED NUMBER for two rounds (review #57): it shipped at 60 with the justification 'generous enough for a cold-cache workspace build', and no cold-cache duration had been measured -- warm is ~4m, read off real runs; cold is `cargo build --workspace` over ~200 deps plus a SECOND full target (wasm) plus `cargo test --workspace`, and was never taken. It is the one cap where being wrong LOW causes what the cap exists to prevent: a cancelled job makes `codegen` fail on `cancelled` by design, the required check reds, and `Swatinem/rust-cache` does not save on cancellation so re-runs stay cold and hit the same wall -- reached by an ordinary dependency bump rather than a runner-image bump. Raised to 120, deliberately above any cold build this workspace plausibly produces and still 3x better than the 360 default, with the asymmetry and the missing measurement stated in ci.yml beside the values rather than implied. AND TWO MORE CAPS WERE BARE FOR THE SAME REASON THE HEAVY ONES WERE (review #65): `specs` and `docs-validate` shipped in the seconds-of-work bucket with `changes` and `codegen`, carrying only a note that a cap bounds a hang and nothing about why TWENTY -- while both build `tools/codegen-rs` and its tree from scratch on a cold cache, which `docs-validate`'s own header admits. The first remedy was WRONG ABOUT ITS OWN INSTRUMENT and is retracted here rather than quietly amended: round 65 kept 20 and justified it as `~30x the cold compute`, from an empty CARGO_TARGET_DIR that took 36s -- but CARGO_HOME was NOT empty, so that measured compile-from-a-warm-registry, half the cold path, on a job whose cold runner also fetches the whole tree. The number was true and the sentence built on it was not, in the permissive direction. Re-measuring with an isolated CARGO_HOME could not be completed (the session's disk allowance ran out mid-build), so THE COLD PATH IS UNMEASURED and ci.yml now says so instead of quoting the cheap half. Both raised to 120 (review #66), decided on the ASYMMETRY rather than on a number: for `docs-validate` too-high costs idle minutes and blocks NO merge -- the docs-only lane is a push with no PR, so the change has already landed -- while too-low cancels the job and leaves that change on `main` with no validator having run, non-self-healing because rust-cache saves nothing on a cancel. `specs` takes the same value for the same unmeasured reason rather than a second guess, because one number across the unmeasured jobs is one fewer figure to drift. This is the third round on this branch where a stated multiplier had to be withdrawn (`~30x` here, `~30x` on `changes` at round 45, the per-job enumeration at round 62) -- and the first where the author, not a reviewer, supplied the wrong antecedent AFTER the rule against it was written. AND THE BOUND HAS NO EARLY WARNING IN THE DIRECTION THAT MATTERS (review #85, offered as sizing rather than as a defect): `assert_pinned_in_changes_job` bounds every aggregated job at 5..=120, and FIVE OF THE SEVEN sit exactly at 120 -- so the ceiling can only ever fire on a value ABOVE the documented maximum, never on a raise within it. If a cold run ever approaches 120 there is no signal until the cancellation itself, which is the direction this row and ci.yml both say does not self-heal (a cancelled job makes codegen fail on `cancelled`, and rust-cache saves nothing on a cancel, so the re-run is cold and hits the same wall). Whoever closes this row, or opens a successor about the caps, should price that: the guard asserts the values are SANE, not that they are ADEQUATE, and nothing measures the second. THE HANG CLASS IS NOW BOUNDED WORKFLOW-WIDE; the RED class is not -- AND OPTION (a) DOES NOT CLOSE IT EITHER, which this field asserted twice while stating the counter-argument itself two paragraphs up (review #91). A sibling always-run job is EQUALLY BLOCKING by this row's own words: it sits in `codegen`'s `needs:`, a host-drift red puts `failure` into `join(needs.*.result)`, the aggregator's case arm sets status=1, the required check reds and nothing merges. Identical blast radius. WHAT OPTION (a) CLOSES IS THE SKIP CASCADE -- the other five jobs keep running so their signal survives, and `docs-validate` still runs on the docs-only lane, which is the direction where the failure INVERTS and is the worse of the two (a docs-only push is a push to `main` with no PR, so a red blocks nothing and the change lands with the only validator that lane has skipped). That is a real closure and it is a DIFFERENT property from the one the sentence claimed. It matters for how this row is decided, because the row prices its deciding consequence as 'a host-drift red can stop shipping during an incident' at Friday/Saturday peak: whoever closes it on (a) on the strength of that sentence would believe they had bought that back and would not have. WHAT DOES CLOSE THE RED CLASS, named here so the option space is honest: making the suite's host-CAPABILITY preconditions `skipped` rather than hard `verdict bad` -- the treatment T16's ASCII-locale branch already got, while T3/T3b/T3c and T15g's ASCII control deliberately did not -- or keeping the suite out of the aggregator's assertion entirely. Neither is on the table under this row as filed; both belong to `RETRIEVAL-QMD-CI`, and either could be combined with (a) or with (b). So the choice this row actually presents is about the SKIP CASCADE and the docs-only inversion, not about whether shipping can be stopped by host drift. IT DOES NOT SETTLE THIS ROW: the in-job-vs-sibling-job question is untouched, and under option (a) the timeout belongs on the sibling job instead. WHY IT LANDED IN #679 AFTER ALL, since an earlier version of this clause said it would not: the hazard is one THIS PR CREATES (it is the change that puts a python3-heavy suite in the job everything `needs:`), the fix is one line, and leaving a known six-hour repository-wide merge block in place is not the conservative choice merely because it keeps a diff smaller. What that earlier version got WRONG was the reason, not the conclusion: it said RETRIEVAL-QMD-CI 'authorizes one step and its pin, not other changes to the job' (review #35), reading that row as an allowlist for the whole workflow file; the row itself disclaims exactly that reading, scoping its non-authorization to CI changes 'THAT REFERENCES OR SERVES THIS INTEGRATION' and adding that it 'says nothing about unrelated CI work, which is governed by its own records'. THE REASON FIRST GIVEN WAS THE FALSIFIABLE HALF: `a job-level timeout-minutes: references nothing about QMD and serves the register-check selftest and the docs_only detector equally`. That is true of SIX of the seven caps -- `lint`, `specs`, `build-test`, `db-test`, `docs-validate`, `codegen` bound cargo and a postgres service container and would be correct on a branch that never heard of QMD. It is NOT true of the cap on `changes`, and this very field supplies the counter-argument two sentences earlier (`the hazard is one THIS PR CREATES`), as does `ci.yml`, where the comment justifying that value names the stub suite's behaviour specifically. A record whose claim its own diff falsifies is the shape this branch catalogues, landing here on the clause that authorizes a ride-along. The honest form, and the stronger one: the six sibling caps are unrelated CI work; the `changes` cap is a MITIGATION OF A HAZARD THIS PR'S OWN STEP INTRODUCES, taken because leaving a known repository-wide merge block in place is not the conservative choice merely because it keeps a diff smaller. It is named as clause (f) of RETRIEVAL-QMD-CI's ride-along enumeration, where `the_ride_along_count_matches_the_clauses_named` can see it, so the placement is DECIDED rather than inherited from a sentence (review #64). THE SECOND REASON GIVEN WAS SCOPE DISCIPLINE -- PR #679's reviewed claim was that it adds exactly ONE non-comment line pair to `ci.yml` -- and that is now stated accurately instead: the PR adds the gate step AND a job-level timeout on every job the aggregator consumes (seven in all), plus a standing assertion that each declares one -- and its body says so. The pin permits the key (the job-level ban list is `if` / `continue-on-error` / `strategy` / `needs`) and, since the gate steps' key set is locked to {name, run}, a job-level timeout is the ONLY mitigation available at all. The hazard it bounds, as it stood before this change: the `changes` job carried no `timeout-minutes`, so a hung python3 probe held the whole pipeline for GitHub's 360-minute default. Whoever closes this row should price that in -- under option (b) it is the difference between a bad hour and a bad day, and under option (a) it belongs on the sibling job. AND ONE ARGUMENT FOR CLOSING IT BEFORE #679 MERGES RATHER THAN AFTER (review #71), which is the only thing in this row that bears on TIMING rather than on the choice: CLAUDE.md's FINAL VISION FIRST (founder directive 2026-08-08, ADR-20260808-235113) says *always put in place the final step*, and that gating decides WHEN a finished thing takes over but never licenses a shim. Option (b) is a shim with a known repository-wide blast radius, and merging it IS the choice -- the row's own precedent clause fires at the third gate step and this PR lands the second. Against that: `RETRIEVAL-QMD-CI` authorizes the step IN THIS JOB, so moving it is not the executor's to take, and holding a green PR for a decision nobody has been asked yet has its own cost. The honest statement is that the cost of option (b) is paid continuously between now and whenever this row closes, so the question is not whether to decide it but whether that interval is long. Not blocking #679 as a defect; it IS the decision #679 is held for."
