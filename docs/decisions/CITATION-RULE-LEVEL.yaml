key: "CITATION-RULE-LEVEL"
status: "decided"
question: "Should `decision-superseded-authority` ship as a hard `make validate` ERROR, or as a ratcheted WARNING first -- and should its exemption stay an implicit magic word (`superseded` in the clause) or become an explicit marker on the citing line?"
owner: "founder"
opened: "2026-08-26"
decided: "2026-08-27"
decided_by: "ADR-20260827-081500"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED, and filed BEFORE #679 merges rather than after, because both halves are choices the first implementation settled by default. THE RULE'S TRIGGER IS A HAND-ROLLED ENGLISH-CLAUSE PARSER over prose -- an abbreviation list, a `PARENTHETICAL_CITES` word list, markdown-table detection, a dash-boundary asymmetry -- and its LEVEL, WHEN THIS ROW WAS FILED, was `err(...)`, i.e. a hard failure. THE BRANCH NOW SHIPS `warn(...)` -- option (a) was taken mid-branch and the correction sits two-thirds down this field, so everything between here and it describes the state THAT PROMPTED the row, not the state of the diff. Read the paragraph beginning OPTION (a) IS NOW THE STATE OF THE BRANCH before acting on any level claim above it (review #91). THE INTERNAL ASYMMETRY IS THE SHARPEST FORM OF THE ARGUMENT: the SAME PR classifies `decision-citation-file-not-utf8` and `decision-citation-file-out-of-corpus` as RATCHETED WARNINGS, and those conditions are perfectly deterministic (a byte is or is not UTF-8; an extension is or is not on a list), while the condition decided by heuristics over prose is an ERROR. BLAST RADIUS OF A FALSE POSITIVE WOULD BE THE REQUIRED CHECK, at the `err` level this row was filed against: a hard error reds `specs` AND `docs-validate`, and `codegen` with them. On the docs-only lane `docs-validate` is the only gate that lane has and CLAUDE.md routes that work to `main` as a PUSH WITH NO PR -- so a prose edit to `CLAUDE.md` that trips the heuristic lands on `main` red, with rewording as the author's only escape. `validate/decisions.rs` argues in five separate places that a red whose escape is silence is the worse instrument and that on a gate guarding the required check a false red costs more than a latent miss; that argument was applied to individual ARMS (`the`, `[KEY](link)`, bare containment, `first()` vs `last()`, the em-dash, the same-class line join) and never to the rule's LEVEL, which is where it bites hardest. AND CLAUDE.MD'S GATE-THEN-STABILIZE POINTS THE SAME WAY (founder-approved 2026-07-31): behaviour changing a critical path ships BEHIND a gate and flipping the default is a SEPARATE recorded decision after the gated form has been smoked. The §17 warning ratchet is precisely this repo's mechanism for `you may not land this silently, but it does not block` -- a new warning kind reds until `make warning-baseline` is committed in the same change -- so the non-blocking form keeps essentially all of the detection value. Shipping the rule at ERROR in the same PR that wires the CI step skips the gated step; whether a validator rule counts as `behaviour on a critical path` is exactly what this row asks. THE COUNTER, STATED SO THE ROW IS NOT ONE-SIDED: the motivating incident is EIGHT sites citing a dead row with `make validate` green, and an ERROR is what makes `both halves of a supersession in ONE commit` (docs/decisions/README.md) actually enforceable -- a baselined warning lets the split state land. The ratchet is per-KIND and exact in both directions, so a SECOND stale citation still reds after the first is baselined; the gap is narrower than `warning` suggests. SECOND HALF -- THE EXEMPTION IS AN IMPLICIT MAGIC WORD. The escape from this rule is `get the token superseded into the same clause`, and the acknowledged residual is not incidental to that heuristic, it IS the heuristic: two adjacent lines of the same marker class join, so a `superseded` in a preceding comment line exempts a live citation on the next -- in the `#`-comment layout BOTH GATE SCRIPTS ARE WRITTEN IN, i.e. the corpus the rule exists for. An EXPLICIT MARKER on the citing line (`# decision-citation: historical`, or an HTML comment in markdown) has no leak by construction, is greppable, cannot be tripped by prose that happens to contain the word, and cannot be MISSED because of a hard wrap -- which is review #13's motivating case in the other direction. It would also retire most of the clause machinery: the abbreviation list, the `i.e.`/`lookup.sh` distinction, the dash-backward-only asymmetry and the `PARENTHETICAL_CITES` blanking exist ONLY to bound the implicit window. `validate/decisions.rs` says three screens up that `a whole-line test is a one-word opt-out of a gate whose entire argument is that opt-outs must be explicit`; clause-scoping narrowed that window, it did not make the opt-out explicit. OPTIONS AS FILED, kept verbatim because they are what the row was raised on -- but READ THEM AGAINST THE CURRENT STATE, not as live choices: (a) ship the rule as a RATCHETED WARNING now and flip to ERROR as a separate recorded decision once it has run over real edits -- the gate-then-stabilize shape, costs the enforcement of the one-commit coupling in the interim; (b) keep ERROR, on the grounds that the coupling is the point and the corpus is verified green with every residual pinned -- free, and it settles the level by shipping rather than by decision; (c) keep ERROR but move the exemption to an explicit marker, which removes the false-positive surface that makes (a) attractive and retires the clause machinery, at the cost of a migration of the existing exempted sites; (d) (a) and (c) together. OPTIONS AS THEY NOW STAND (review #91): (a) IS TAKEN and is the state of the branch, so (b) and (c) no longer read as 'keep ERROR' -- they are 'FLIP TO error', a change from the shipped default that CLAUDE.md's gate-then-stabilize makes a separate recorded decision in its own right. The two questions actually left open are (1) whether to flip to `err` now that the parser has run, and (2) whether the exemption becomes an explicit marker -- which is independent of the level and is the more interesting half. Stated because this row is FOUNDER-OWNED and a reader who stops at the options list would otherwise decide against a premise the diff falsified. NOTHING IN THE CODE IS BROKEN: the mechanics are green, the corpus is verified, and every residual is stated and pinned. This is a LEVEL and MECHANISM question that carries the required check, which is why it belongs in the record rather than settled by the first implementation. OPTION (a) IS NOW THE STATE OF THE BRANCH, and taking it needed no approval while NOT taking it did -- which is the correction two independent reviews (#81, #82) reached separately and this row had backwards. CLAUDE.md's GATE-THEN-STABILIZE is founder-approved standing policy: behaviour changing a critical path ships BEHIND a gate and flipping the default is a separate recorded decision. A new BLOCKING validator rule on the job feeding the required check is that, so shipping at `err` in the same commit that wires the step was the deviation needing sign-off, not shipping at `warn`. The row as first filed would have been decided by merging -- the gated form and the default landing together, with the row that should have gated it filed INSIDE the change it would gate. `decision-superseded-authority` now emits at WARNING and is pinned there by `a_superseded_row_may_not_be_cited_as_live_authority`, which asserts the LEVEL because nothing did: every assertion in that test passed identically at `err` and at `warn`, so both the flip and the flip back were invisible to the suite. DETECTION IS UNCHANGED, verified rather than argued: a planted stale citation in `.claudeignore` produces `decision-superseded-authority: 0 -> 1 (NEW warning kind)` and `make validate` still fails on the section 17 ratchet. What changed is the ESCAPE from a false positive -- rewording prose becomes accepting the finding with `make warning-baseline` in the same commit, which is visible, reviewable and recorded. WHAT REMAINS OPEN, and it is the whole row now: (1) whether to flip to `err` once the parser has run over real edits, which is the separate recorded decision the directive prescribes; (2) whether the exemption should stay an implicit magic word or become an explicit marker -- unchanged and still the more interesting half, since an explicit marker has no leak by construction and would retire most of the clause machinery. THE COST OF (a), stated rather than glossed: the one-commit supersession coupling `docs/decisions/README.md` requires is no longer enforced absolutely, because a baselined stale citation can land. That is the argument for (1). DECIDED BY THE FOUNDER 2026-08-27, via the call-sheet form, verbatim: 'Make it a hard error' (ADR-20260827-081500) -- question (1) closes as ERR, after the gated form ran over the real corpus and the review rounds' live edits with zero false positives. The one-commit supersession coupling is enforced absolutely again; verified by plant (a stale citation in .claudeignore reds make validate at [error], exit 2). The rule left CORPUS_DERIVED_KINDS and the partial-read floor in the same change (an error never enters the warning profile), with all three pins asserting the reverse direction. Question (2) -- implicit word vs explicit marker -- was NOT decided and remains open ground; reopening it is a new row, not an edit here."
