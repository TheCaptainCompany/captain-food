key: "DISPATCH-CARD-CITATION"
status: "open"
question: "Is a dispatch card an INSTRUCTION surface for `decision-superseded-authority` — i.e. should `docs/dispatch/**` leave the `docs/**` exclusion and join `.claude/**` in the citation corpus, or does `validate_dispatch_card_rows` remain the whole of a card's row-checking?"
owner: "team"
opened: "2026-08-26"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED. `decision-superseded-authority` (added by PR #679) excludes `docs/**` wholesale, and its stated argument for the exclusion is that 'a record ABOUT a supersession must name the superseded row' -- which is an argument about ADRs and proposals, whose whole job is to narrate history. `docs/dispatch/**` sits inside that exclusion and is NOT that kind of document: a dispatch card is an INSTRUCTION SURFACE A SESSION EXECUTES, which is precisely the property that puts `.claude/**` in the corpus, and the same reason the rule deliberately does not exempt fenced code. So a card may today point a session at a dead row with `make validate` GREEN. `validate_dispatch_card_rows` is not the answer to this: it checks that a card's `Decision row:` reference RESOLVES to a declared non-legacy key and says in as many words that status is 'deliberately not checked, an ask-time concern'. LATENT, NOT LIVE: no card under `docs/dispatch/` carries a `Decision row:` line today, and the ask-gate reads the row FILE at the point of need, so the failure needs a card AND a supersession AND a session that trusts the card over the row. OPTIONS: (a) move `docs/dispatch/**` into the citation corpus (one pathspec; the corpus is `git ls-files` over a fixed list, and `the_records_state_the_same_citation_corpus_as_the_code` would require the records to name it too) -- closes it, and makes a card that narrates a supersession need the clause-scoped `superseded` exemption like any other instruction surface; (b) extend `validate_dispatch_card_rows` to check STATUS as well as resolution -- narrower, card-specific, and does not reach a card that names a row in prose rather than in the envelope; (c) leave it, on the grounds that the ask-gate resolves the row file anyway. WHY IT IS A ROW: the exclusion's argument is recorded and this is a genuine exception to it, so narrowing the exclusion is a decision about the rule's scope rather than a bug fix -- and PR #679 is authorized for the QMD surface, not for widening a validator's corpus on its own initiative. Not urgent, not blocking #679."
