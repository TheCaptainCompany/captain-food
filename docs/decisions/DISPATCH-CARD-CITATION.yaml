key: "DISPATCH-CARD-CITATION"
status: "decided"
question: "WHICH `docs/**` SUBTREES ARE INSTRUCTION SURFACES for `decision-superseded-authority` — i.e. which of them should leave the `docs/**` exclusion and join `.claude/**` in the citation corpus? Opened for `docs/dispatch/**`; widened to the class after review #59 named `docs/claude/**` and `docs/PLAYBOOK.md` as the same exception with more weight."
owner: "team"
opened: "2026-08-26"
decided: "2026-08-28"
decided_by: "ADR-20260828-213000"
capacity: "team"
register: "docs/proposals/DECISIONS.md (raised by the independent review of PR #679)"
evidence: "RAISED BY REVIEW, NOT DECIDED. `decision-superseded-authority` (added by PR #679) excludes `docs/**` wholesale, and its stated argument for the exclusion is that 'a record ABOUT a supersession must name the superseded row' -- which is an argument about ADRs and proposals, whose whole job is to narrate history. `docs/dispatch/**` sits inside that exclusion and is NOT that kind of document: a dispatch card is an INSTRUCTION SURFACE A SESSION EXECUTES, which is precisely the property that puts `.claude/**` in the corpus, and the same reason the rule deliberately does not exempt fenced code. So a card may today point a session at a dead row with `make validate` GREEN. `validate_dispatch_card_rows` is not the answer to this: it checks that a card's `Decision row:` reference RESOLVES to a declared non-legacy key and says in as many words that status is 'deliberately not checked, an ask-time concern'. LATENT, NOT LIVE: no card under `docs/dispatch/` carries a `Decision row:` line today, and the ask-gate reads the row FILE at the point of need, so the failure needs a card AND a supersession AND a session that trusts the card over the row. WIDENED FROM ONE SUBTREE TO THE CLASS (review #59), because enumerating exceptions one at a time is how the next one goes unnamed. `docs/claude/**` is the SAME exception and the stronger case: CLAUDE.md itself says 'Topic authorities -- read the relevant one before working: dsl.md, codegen.md, observability.md, c4.md, adr.md, loops.md, mermaid.md, sessions.md', and marks `sessions.md` OPERATIONAL. Those files are not narration; they are what the resident index routes every session to BEFORE it works, which is exactly the property that puts `.claude/**` in the corpus. `docs/PLAYBOOK.md` sits in the same position. Grepped at the time of writing: no file under `docs/claude/**` carries a row citation today, so this is latent in the same way the dispatch case is -- but the exclusion's own bullet is the ONE statement of scope the rest of the file defers to, and a reader who finds `docs/**` excluded with a single named exception beside it will reasonably conclude the exception space was enumerated. OPTIONS: (a) move `docs/dispatch/**` into the citation corpus (one pathspec; the corpus is `git ls-files` over a fixed list, and `the_records_state_the_same_citation_corpus_as_the_code` would require the records to name it too) -- closes it, and makes a card that narrates a supersession need the clause-scoped `superseded` exemption like any other instruction surface; (b) extend `validate_dispatch_card_rows` to check STATUS as well as resolution -- narrower, card-specific, and does not reach a card that names a row in prose rather than in the envelope; (c) leave it, on the grounds that the ask-gate resolves the row file anyway. WHY IT IS A ROW: the exclusion's argument is recorded and this is a genuine exception to it, so narrowing the exclusion is a decision about the rule's scope rather than a bug fix -- and PR #679 is authorized for the QMD surface, not for widening a validator's corpus on its own initiative. Not urgent, not blocking #679. DECIDED 2026-08-28 (ADR-20260828-213000): option (a) WIDENED TO THE CLASS -- `docs/dispatch`, `docs/claude` and `docs/PLAYBOOK.md` join the citation corpus, accelerated by the founder directive 2026-08-28 ('work #477... ASAP, it influences agent behaviour') landing on top of the case this row had already made. Verified against the real tree: `make validate` stays at 0 errors, the 92-warning baseline is unmoved, and no live citation of a superseded row existed in any of the three subtrees before or after. Red-first confirmed the mechanism's actual scope in the same change: it catches decision-register ROW KEY citations (docs/decisions/*.yaml, status superseded), not ADR ids -- planting 'Per row `ADR-20260731-061609`' (the issue's own motivating example) inside a tracked docs/claude/** file does NOT red, while the same form citing the one live-superseded row key (RETRIEVAL-QMD) reds immediately as a hard error. Issue #477's original ADR-id ask is therefore still open as separate, correctly-scoped follow-up work -- this decision widened WHERE the shipped rule looks, not WHAT it looks for."
