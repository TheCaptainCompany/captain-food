key: "PUBLISH-SCOPE"
status: "decided"
question: "The INSEE crawl is scoped to Touraine and the founder asked for all of France. Crawling wide is nearly free; publishing wide is not. Do we crawl France-wide and publish France-wide, or crawl wide and publish Tours only?"
owner: "founder"
opened: "2026-08-30"
decided: "2026-08-30"
decided_by: "ADR-20260830-234532"
capacity: "founder"
register: "docs/adr/ADR-20260830-234532-the-second-sitting-publish-france-wide-revocation-is-immediate-and-the-objection-chain-was-decided-22-days-ago.md"
evidence: "Crawl AND publish France-wide -- chosen over the crawl-wide/publish-Tours recommendation that business-specialist and legal-specialist reached independently, with that recommendation and its cost stated in the question."
note: "DIRECTION only: the publish SWITCH stays gated by PUBLISH-PRECONDITIONS (counsel) and by the objection chain approved 2026-08-08 and unbuilt at HEAD. Not executable as stated today -- ADR-20260728-011344 D5 nulled slugs on NON_PARTNER rows and the `restaurant` query resolves BY SLUG, so no per-listing page exists for the Art. 14 notice, the objection route or the claim door to live on. Two facts the founder did not have when answering, recorded in the ADR: sirene.rs:111-113 composes a sole trader's displayName as 'Prenom Nom' against an adresseEtablissement that is frequently the domicile, so this publishes natural persons' home addresses; and INSEE diffusion status is never read (zero hits repo-wide), so non-diffusible units are ingested. POPULATION CORRECTED: the question carried '~200k rows' as UNVERIFIED input and it is neither population -- dba re-derived from ADR-20260728-143000's measured 339,077 rows / 655 MB over 37 of 101 departments that the PUBLISH surface is ~250-300k registered listings while the MIRROR is ~1.0M rows, and that the 200k figure was a partial-coverage re-translation batch from integration_staging.yaml carried into the residue as if it were the publish population. The 3.5x gap is itself a defect: restauration_query wraps its predicates in INSEE periode(...), which matches ANY period, so without dateFin:null the sweep returns every etablissement ever active under a restauration NAF and the mirror declares NO ROW RETENTION. One API call against department 37 settles it, and it must happen BEFORE the national crawl -- deleting 700k rows later is a migration, not fetching them is a string. Recommended mechanism carried into part C's proposal: business-specialist's Option A -- a per-city coverage verdict derived from DeliveryPartnerRegistration APPROVED, three card states, and the marketplace default filter changed (orderableOnly is opt-in today and restaurants.all binds no args)."
