key: RESTAURANT-INVITATION-PRECONDITIONS
status: open
question: 'What must exist before the invitation door (`inviteRestaurantMember`) is opened in
  production, now that step 6-iv lands the `RestaurantInvitation` aggregate and the two-lane accept
  behind `RUN_RESTAURANT_INVITATION`? Preconditions (ADR-20260905-101349 §11/§12, 6-iv dispatch
  card, round 2 additions marked): the invitation email deliverability drill (SPF/DKIM/DMARC, the
  same class of hand-dispatched proof `MEMBER-SIGN-IN-DOOR-PRECONDITIONS` required for the sign-in
  link); the member sign-in door (`RUN_MEMBER_SIGN_IN_DOOR`) flipped FIRST -- an invitation nobody
  can sign in with afterwards is a dead letter, mirroring `MEMBER-ACCESS-GRANT-PRECONDITIONS`''s own
  dependency on 6-ii; **Art. 14** (corrected from Art. 13 this round) notice at the INVITED address
  -- Art. 14(3)(b) timing: the invitation email is the FIRST communication with a data subject the
  restaurant did not collect the address from directly, and Art. 14(1)(d)/(2)(f) name the inviting
  restaurant as the source that must be disclosed; Art. 13 still governs what `/invitation` itself
  collects from the invitee once they land on it (their own direct-collection notice, unchanged);
  the TTL value `RESTAURANT_INVITATION_TTL_SECONDS` confirmed rather than defaulted (currently
  `UNVERIFIED input`, proposed 604800s/7 days); **round 2**: [#902](https://github.com/TheCaptainCompany/captain-food/issues/902)''s
  expiry-DELIVERY concern -- an invitation that never expires would be a live door forever, and an
  undelivered TTL row would be a POISON row for `inbound_messages` on the PITR path once the door
  flips (the MEMBER-SIGN-IN-DOOR-PRECONDITIONS retention-ceiling class of problem) -- is RESOLVED
  this round: `RecordLeg::RestaurantInvitation` now wires the delivery
  (`crates/infrastructure/src/mailbox/handler.rs`), so an unaccepted invitation genuinely moves to
  EXPIRED rather than sitting undelivered; a retention ceiling for the never-accepted invitee''s
  email inside `domain_events` itself
  (`UNVERIFIED input`, counsel -- no controlling record names one, and GDPR erasure/minimisation for
  an event-sourced immutable log is the open architectural question the sign-in-door row already
  flagged, not solved here); an Art. 30 (records of processing) entry for the new
  `RestaurantMembership` category, since 6-iv is the first door that can create one from third-party
  (non-self-registered) data; and a written confirmation that no seat-count or billing semantics
  attach to an accepted invitation anywhere in the product (business, so a later pricing feature
  does not retroactively find this door doing something it was never scoped for). The MANAGER
  authority guard on `inviteRestaurantMember`/`revokeRestaurantInvitation` (round 2 of the 6-iv
  card; corrected from `revokeRestaurantAccess` round 3 -- the guarded mutation is the INVITATION
  one) is now BUILT and enforced -- it narrows who inside a restaurant can open this door but does
  not by itself close any precondition above. Round 3: **neither notice surface is built** -- the
  invitation email''s content (the Art. 14 carrier) exists nowhere in `specs/**` and the acceptance
  page (`/invitation`) carries no notice; both are flip preconditions. **Round 3, four more**: (1)
  the `invitationPreview` consent surface (naming the restaurant/authority to the invitee before
  they accept) is a flip precondition -- final vision is a PREVIEW READ MODEL keyed by a HASH of
  the token, never a live `IdentityService` call inside a PUBLIC query (round 2''s own STOP finding:
  no precedent in this codebase mixes a live auth-provider round trip into a query resolver); (2)
  nothing SENDS the invitation email yet -- the handler emits the fact and stops; the send leg
  (naming the restaurant + the invited authority, the Art. 14 first communication itself) is a flip
  precondition; (3) query spans for `restaurantRoster`/`restaurantInvitations` are a flip
  precondition ([#903](https://github.com/TheCaptainCompany/captain-food/issues/903)) -- the
  `*_lag_positions` gauge HALF of this item is now BUILT this round
  (`restaurant_roster_lag_positions`/`restaurant_invitation_list_lag_positions`), the span half is
  not; (4) `PgMemberAuthorityRepository`, the `inviteRestaurantMember`/`revokeRestaurantInvitation`
  guard''s own read path, is tested against Postgres nowhere in this codebase
  ([#903](https://github.com/TheCaptainCompany/captain-food/issues/903)) -- its fail-open `NOT
  EXISTS` revocation clause is untested against a real database. Flipping
  `RUN_RESTAURANT_INVITATION` to true in production is the decision that closes this row.'
owner: team
opened: '2026-09-05'
capacity: team
register: docs/adr/ADR-20260905-101349-step-6-lands-in-four-slices-the-bridge-and-the-grant-first-the-door-second-and-the-accept-is-two-commands-in-two-lanes.md
evidence: 'The `MEMBER-ACCESS-GRANT-PRECONDITIONS`/`MEMBER-SIGN-IN-DOOR-PRECONDITIONS` precedent
  shows the shape: a key alone is not enough, prose and the deploy value can disagree unreconciled
  (the RUN_SIRENE_WORKER lesson) -- so this row names the key AND the preconditions, and the
  codegen rule `decision-row-open-key-must-be-off` refuses any production value other than "false"
  while the row is open. `GrantRestaurantAccess`''s `MEMBER_INVITATION` leg is deliberately NOT
  gated by a second key: it stays behind the EXISTING `RUN_MEMBER_ACCESS_GRANT`
  (`MEMBER-ACCESS-GRANT-PRECONDITIONS`, already open), because a member-invitation grant is exactly
  as irreversible a fact about a real Tours human as a hand-provisioned one -- the same legal
  clocks start either way, so it is the same door.'
note: 'This row cannot close before `MEMBER-ACCESS-GRANT-PRECONDITIONS` AND
  `MEMBER-SIGN-IN-DOOR-PRECONDITIONS` both close, since the invite-then-accept-then-grant chain is
  only as safe as its weakest already-open link. 6-iv ships dark (no reachable UI without the door
  open, per RUN_SIRENE_WORKER discipline: intent, not accident) -- resuming is a preconditions
  review plus one flag flip, never a code change. Round 2: the accept leg was split into a
  PUBLIC `GrantRestaurantAccessByInvitation {invitationId, token}` whose act itself records the
  fact -- the caller is proven the accepting subject by presenting the token, the same proof
  `acceptRestaurantInvitation` already required, so no new legal actor is introduced -- and its
  `membershipId`/`memberId` are DERIVED (UUIDv5 from `invitationId`), enforcing one membership per
  invitation structurally rather than by a runtime check.'
