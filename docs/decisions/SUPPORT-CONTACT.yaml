evidence: "support@captain.food, read by the founder. No voice leg -- the rider path gets something else."
note: "SHAPE settled 2026-08-30 (a functional role address on a domain we control, channel named, no delay promised); STRING answered 2026-08-31. Two build consequences. (1) The key does NOT exist yet: grep -rn SUPPORT_CONTACT over specs/ and crates/ returns nothing, so 'required key with no default' is a recorded DESIGN, not a live constraint -- it is declared when #792's screen is built, and the string above is what it carries. (2) NO VOICE LEG means the rider handback screen carries an in-app report rather than a call button: ux-designer's rule that a control which renders but does nothing is worse than no control makes a phone CTA unspellable here, so the suspended rider's only live control is the one that returns the food to the restaurant. Still owed and NOT answered by this row: whether GDPR requests arriving at this address have the Art. 12(3) one-month clock actually tracked, and whether the published business address is one the founder wants public. The mediateur de la consommation is sequenced AFTER counsel (founder, 2026-08-31) and is NOT this route."
