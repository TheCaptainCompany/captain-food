evidence: "Decided as a separate store: a `behaviour_events` table in its own database, RANGE-partitioned by day, retention implemented as a partition DROP -- never `domain_events` (a behaviour event is not a decided fact, so the left-fold invariant would stop holding) and never the order path's instance. CONFIRMED AND EXTENDED by later authority, twice: ADR-20260811-120828 Decision 1, sourced from the product owner's own verbatim directive ('the behaviour event tracking will be stored in another database ... completely isolated and projected by another projector worker'), which 'goes further than PROP-20260811-000946 D5, which asked only for a separate store' by adding a dedicated projector worker; and DECISIONS.md §27bis MET-Q7, which records the store-isolation directive as independently 'confirming PROP-20260811-000946 D5'. The DECISIONS.md §28 table's D5 cell matches this current text -- no divergence found."
