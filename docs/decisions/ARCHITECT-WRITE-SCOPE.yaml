key: "ARCHITECT-WRITE-SCOPE"
status: "open"
question: "Now that `architect-consult` proves a what-next consult needs no write tool at all, should `architect` itself lose `Write`/`Edit` -- its issue filing routed through `Bash` (`gh`), and its proposals executor-written under dispatch -- and if so, in one PR or in a staged handoff?"
owner: "team"
opened: "2026-09-06"
register: "docs/proposals/DECISIONS.md (raised by #926 item 6 / #914 item 10, consent option (b))"
evidence: "QUEUED, NOT DECIDED (option (c) of the consult-vs-Rule-1 option space; option (b) -- the read-only twin `architect-consult` -- is what landed in PR #945). Antecedents: PROP-20260726-193000 (\"Two agents\") originally landed `architect` as a READ-ONLY dispatcher (\"Never claims, never implements, never re-prioritises\") before Write/Edit were later granted for issue filing and proposal writing; ADR-20260810-011500 §1 assigns EVERY phase of the diff -- code, specs under recorded approval, records -- to the executor, never the coordinator or the architect, which is the same shape option (c) would extend to filing/proposal-writing; ADR-20260831-141500 :200-205 states, as an open unknown rather than a decided fact, whether Lane D of register-check.sh even fires on `architect`'s OWN nested `Agent` calls (it declares `Agent` in its `tools:`), which bears on whether stripping Write/Edit also closes that unknown or leaves it moot. Open questions if picked up: does `architect` file issues/proposals via a NEW write-capable delegate (symmetric to how `architect-consult` now takes the read-only half), or does the executor absorb issue filing under an architect-authored dispatch (closer to ADR-20260810-011500 §1's letter); does the Agent-nesting unknown get resolved in the same change or stay open. Consulted: reviewer, beck, farley, holub -- all four consented (unanimous) to option (b) as coded for #926 item 6 / #914 item 10 in the checkpoint round; option (c) itself was named and queued, not put to consent, in that same round."
