note: "Founder answer sheet 2026-08-29, verbatim; his note, verbatim: '15'. The unit derivation '15 EUR' is DERIVED, not asked (Tours/France; Money = {amountCents,currency} kills unit ambiguity) — 1500 cents EUR as the platform default in ordering configuration; a per-restaurant override is later work, not a reversal. Promo codes are recorded post-V0, which retires #468's cart.discount gap permanently. The round-2 answers (quoted in evidence) CLOSE the sub-questions this note had named open: the delivery-only-vs-collection flag is decided delivery-only — the minimum gates PlaceOrder only for serviceType DELIVERY, COLLECTION is never blocked by it — and MIN-ORDER-PER-RESTAURANT confirms the config shape as a platform key in specs/ordering/configuration.yaml (1500 cents EUR default) with the per-restaurant override as planned later work, not ruled out. Both round-2 answers match the presented team recommendations (business lens: delivery-only; architect: platform default with later override). Pre-order disclosure placement stands as recorded legal guidance: storefront/menu surface BEFORE checkout, Code de la consommation L112-1/L221-5 lineage. Consulted block (13 lenses) lives in the deciding ADR."
