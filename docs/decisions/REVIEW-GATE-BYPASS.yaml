key: "REVIEW-GATE-BYPASS"
status: "decided"
question: "Does the #677 hardening of `claude-review` land BEFORE REV-1 is executed — merged by a one-time admin bypass, leaving the check required and newly able to fail — or does REV-1 execute first so the hardened check reds on a non-required gate?"
owner: "founder"
