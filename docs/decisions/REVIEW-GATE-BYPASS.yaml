capacity: "founder"
register: "docs/proposals/DECISIONS.md (generated index row)"
evidence: "DECIDED: the BYPASS. Founder ruling 2026-08-24, taken against the team's own recommendation and reaffirmed after the cost was stated a second time. Registered late and recorded as such: the question was put and answered before this row existed, which is the defect ADR-20260821-103403's ask-gate grammar exists to prevent — a decision that binds future work owed a declared open row BEFORE the ask, and #680's independent review caught its absence. THE OPTION SPACE: (a) execute REV-1 first — already decided since 2026-08-17, so executing it needs no new decision, only an admin-capable actor; the hardened check then reds loudly on a NON-required gate and a credit-exhaustion day stops nothing. This was the TEAM'S RECOMMENDATION and it was DECLINED. (b) One-time admin bypass, leaving `claude-review` required — CHOSEN. (c) Hold #680 unmerged, leaving #677's hole open so any PR editing the reviewer workflow keeps clearing its own required review gate unreviewed — declined. (d) A bootstrap carve-out in the workflow (skip the assertion when this file is edited) — rejected on beck's reading: it re-creates the exact hole #677 names, under a friendlier name. THE EXPOSURE, KNOWINGLY CARRIED: `claude-review` is decided-out (REV-1), still required, and now able to fail, so any run where the reviewer cannot post — 429, model outage, permission denials, the action's own self-skip — blocks every PR in the repository, and a revert of #680 would itself need the check green. Both were true of the pre-REV-1 state that #593 documented. Scope limit, stated because #677 invites the opposite reading: a workflow file CANNOT make itself required or un-required and cannot stop the ruleset accepting `skipped`; #680 is a VERDICT-HONESTY fix only. Requiredness lives in ruleset 19179892. Executing REV-1 removes the exposure without touching any workflow file and remains the recommended next step."
