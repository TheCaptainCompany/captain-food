key: "PROP-20260810-234225--D6"
status: "decided"
question: "What may a business-metric grouping key be?"
owner: "founder"
opened: "2026-08-10"
decided: "2026-08-11"
decided_by: "ADR-20260811-014129"
register: "docs/proposals/DECISIONS.md §27bis"
evidence: "RELAXED from the proposal's original strict rule, as part of the same product-owner-confirmed reversal as D4. Current decided position: a grouping key must have a DECLARED BOUNDED population -- a `scalars.yaml` enum `$ref`, an enumerated list, a time bucket, or a bounded-and-named entity id (`RestaurantId` -- yes; `OrderId` -- no); the `alertable:` OTLP subset keeps the strict enum-only rule, because that half really is a time series. Recorded in ADR-20260811-014129 and DECISIONS.md §27bis ('Decision 4 -- attributes are bounded sets, never entity ids -> CONTRADICTED. D6 relaxes it to bounded, declared population, which permits `restaurantId`'). STALE TABLE: the DECISIONS.md §27 summary table's own D6 cell still reads 'Bounded sets only -- a `scalars.yaml` enum $ref or an enumerated list. Never an entity id' -- the pre-reversal strict rule -- because that cell predates the reversal and was never updated."
capacity: "founder"
