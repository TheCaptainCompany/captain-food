evidence: "DECIDED YES, founder 2026-09-01, verbatim: 'integrate yaml decision row indexing in retrieval qmd ci' (ADR-20260901-025538). Closing this challenge IS the supersession move, so RETRIEVAL-QMD-CI flips to superseded in the same commit and THIS ROW BECOMES THE CHAIN HEAD. It carries the predecessor's controlling content forward with ONE CLAUSE NARROWED (`YAML decision-row indexing` leaves the not-authorized list) and FOUR STATEMENTS CORRECTED rather than copied. WHAT IS LEFT BEHIND DELIBERATELY, and where to find it: the predecessor's CLAUSE HISTORY, its review-number archaeology, its self-retractions, and the per-clause narration of the six ride-alongs are NARRATION, not controlling content — they stay in RETRIEVAL-QMD-CI, which remains readable at its own path, and the executable pin `the_ride_along_count_matches_the_clauses_named` stays pointed at THAT file because the riders it counts are that row's, not this one's. Carried forward here IN FULL: the authorized surface, the not-authorized list, the FAILURE PROTOCOL and the activation state. WHAT IS AUTHORIZED (all of it, nothing more): the decision-lookup skill + wrapper + gitignored/claudeignored project-local .qmd/ cache (SKILL.md, scripts/decision-lookup.sh, scripts/stub-tests.sh, the .gitignore/.claudeignore entries) — local, scriptless, exact-pinned QMD BM25 over the approved committed corpus, advisory and non-blocking; the ONE `.github/workflows/ci.yml` step (`bash .claude/skills/decision-lookup/scripts/stub-tests.sh`, pure bash + python3, seconds, no Rust) in the always-run gate-scripts job, and the ONE codegen test pinning it there; PLUS, new in this decision, the corpus COMPOSITION change: `docs/decisions/*.yaml` is exported and indexed, the qmd collection glob is widened from the tool's `**/*.md` default to `**/*.{md,yaml}`, row candidates render as a resolve-instruction, and a rebuild-time row-ingestion canary gates the corpus stamp. THE RETRIEVAL SURFACE REMAINS A LOCAL CLI OVER A GITIGNORED, DISPOSABLE CACHE — no server, no daemon, no network path on the lookup path, and nothing about this decision creates one. WHAT IS STILL NOT AUTHORIZED (carried forward verbatim, each needs a new decision row): GraphRAG (the #643 deferral stands untouched), vector search, embeddings, model downloads, reranking, query expansion, hybrid modes, MCP or any server, hosted services, credentials, incremental index maintenance, hooks, ANY OTHER CI or workflow change THAT REFERENCES OR SERVES THIS INTEGRATION (this row governs the QMD surface; it says nothing about unrelated CI work, which is governed by its own records), validator changes, agent-contract or .claude/agents/** edits, settings.json changes, decision-register SEMANTIC changes (this decision indexes the rows; it changes nothing about what a row MEANS, who may write one, or how supersession resolves), generated-spec changes, production code, any mandatory-workflow rule, and any widening of package, version, permissions or dependency shape. CORRECTIONS TO THE PREDECESSOR'S TEXT, made here rather than copied — three of them are the SAME drift the predecessor documents, so copying them forward would have been occurrence four. THE LOCUS IS NAMED BY ITS PIN TEST NAME, NEVER BY A JOB NAME: a job name drifts every time the locus moves (it already did, GATE-STEP-LOCUS 2026-08-27, and the row was never tracked to it), a test name is the stable handle. (i) the predecessor says the step lives in the always-run `changes` job; it is the `gate-scripts:` job in ci.yml — the stable handle is the pin `the_stub_suite_runs_in_the_always_run_gate_job`. (ii) the predecessor names that pin `the_stub_suite_runs_in_the_always_run_changes_job`; no such test exists. (iii) the predecessor's rider (f) attributes the job-level `timeout-minutes` cap to the `changes` job; the cap that mitigates the hazard THIS integration's step introduces is on `gate-scripts`. (iv) the predecessor's clause (d) describes `decision-superseded-authority` as WARNS; it is an ERROR — `issues.push(err(...))` in tools/codegen-rs/src/validate/decisions.rs, closed as ERR by CITATION-RULE-LEVEL on the founder's verbatim 'Make it a hard error'. THE PREDECESSOR'S SPIKE CAVEAT IS RETRACTED, NOT CARRIED: it said 'the default Markdown mask is blind to docs/decisions/*.yaml so QMD cannot discover or resolve authoritative rows'. That is false as of this change — rows are indexed, and a row key retrieves its own row. The two caveats that DO survive are carried: on the docs-only-CI citation case BOTH QMD and rg missed the controlling record, and the spike corpus was contaminated by the proposal's own example transcripts, so no performance claim transfers without a clean benchmark. MEASURED, WITH ANTECEDENTS (established this session on an activated checkout at base 7d47355, pinned @tobilu/qmd@2.8.3): qmd 2.8.3 DOES ingest .yaml, but only via the COLLECTION GLOB — `qmd init` + `qmd collection add` write `pattern: \"**/*.md\"` into the corpus-local .qmd/index.yml, and `qmd collection add . '<glob>'` accepts a positional pattern argument and SILENTLY IGNORES it (`collection show` still reported `**/*.md`). So the mask exists THREE times, not two: the git-archive pathspec, the find extension sweep, and the tool's own glob. THE ROW COUNT IS NOT STATED, ON PURPOSE, AND ITS ANTECEDENT IS NAMED INSTEAD (corrected in PR #841 review round 1; ADR-20260817-105845). The figure this row first carried -- '81 rows indexed' -- was derived from `find`/`ls` over docs/decisions/ on DISK and then presented as an INDEX count, which is the exact conflation this decision's own thesis names: corpus PRESENCE is not INGESTION. It was also a snapshot that goes stale the next time anyone opens a row. What is asserted instead is a PROPERTY, checked at every rebuild: the index holds AT LEAST as many `docs/decisions/*.yaml` documents as that build exported, or the build fails closed and no corpus is stamped. Both sides are derived at build time -- indexed by `select count(*) from documents where active = 1 and path like 'docs/decisions/%.yaml'` against the built index, exported by `find $CORPUS/docs/decisions -type f -name '*.yaml'` over the same build's corpus. Anyone wanting today's number runs the first of those against a stamped index; no record restates it. `qmd update` over that corpus: 0.46 s (previously UNMEASURED); a cold wipe-to-answer lookup: 2.8 s. Row-key retrieval, three probes: CREDIT-DRAIN-ORDER returned its own row as the sole result (score 0.92), QUOTE-TOKEN rank 1 of 7 (0.88), KEY-NAMESPACE rank 1 of 7 (0.89). EXCLUSIONS DECIDED HERE, each named so no rider is unnamed: (1) `_legacy.yaml` and `_exempt.yaml` are EXCLUDED — they are CONTROL FILES, not rows; they carry no status/owner/capacity to disambiguate a hit, `_legacy.yaml` is a single document naming 100 prose-only keys and therefore ranks for any register query while answering none, and the tiebreak is that a hit on it points at a key with NO row file to resolve, the one case the mandatory-resolution contract cannot discharge. The opposite argument (it names all 100 legacy keys and is high-value) was heard and rejected on that tiebreak. (2) `docs/decisions/README.md` is EXCLUDED — not by a second mask but BY CONSTRUCTION, because the pathspec is `docs/decisions/*.yaml` and the README is not a .yaml; it is named here anyway, because an unnamed rider is exactly the pattern this chain has drifted on three times. (3) SUPERSEDED AND WITHDRAWN ROWS ARE ALL INDEXED, deliberately: `superseded_by:` is what makes a hit on a retired row resolvable to its chain head, so truncating the corpus to live rows would destroy the DAG that makes the register answerable at all. The reduction rule is stated on the surface: a hit on ANY row resolves to its head by following `superseded_by`. (4) `docs/decisions/**` is NOT added to `claude_citation_corpus`, and must not be: rows cite superseded rows BY CONSTRUCTION (`reconsiders:`, `superseded_by:`), so wiring them into that corpus would make `decision-superseded-authority` — an ERROR — fire across the register itself. 'Decision rows are in the retrieval corpus now' is not 'decision rows are in the citation corpus'; the two corpora are unrelated and stay unrelated. RENDERING: THE PATH IS THE PAYLOAD, THE EXCERPT IS DECORATIVE. A row candidate prints as `resolve docs/decisions/<KEY>.yaml at HEAD` and is never excerpted. The counter-example that decided it is live in the tree: PMW-1 is `status: \"decided\"` with an evidence field reading as firm founder approval, while its own `note` records that the premise is gone, the founder struck it 2026-08-31, and the live challenge is the open row PMW-4 — rendering `status: decided` beside that row would manufacture a MORE convincing false answer than rendering nothing. No field subset of a row is safe to excerpt: resolving PMW-1 needs status AND reconsiders/superseded_by AND the note, together. Five lenses asked for key+status rendered from the file at HEAD and were overruled on that evidence. Every lookup also prints `corpus: <sha> (working tree not indexed)`, so staleness is stated for every candidate rather than reasoned about per candidate. CONTRACT CLAUSE 2 SURVIVES ITS PREMISE. Mandatory row resolution was justified by 'the index cannot see row files'; that premise dies here and the RULE must not. Restated capability-independently: the index is a disposable fold of ONE HEAD SHA, and a projection is never authority — resolution is mandatory because the retrieved copy is STALE, not because it is blind, and `status` is precisely the field that changes after a row is written. That form survives every future corpus widening; 'it cannot see rows' survives none. NEW FALSE-NEGATIVE CLASS, stated because it is created by this change: rows are written in the same sessions that run register checks, and the WORKING TREE IS NEVER INDEXED — so a lookup miss on a row is NOT a negative trail, and `rg` over the working tree stays mandatory. COVERAGE BOUND: every exported row file is indexed (the completeness property above, enforced at rebuild time -- not a count quoted here) and ZERO of the 100 `_legacy.yaml` keys are, because their prose home DECISIONS.md is an excluded corpus file — a null result over the register is a null result over roughly half of it. ACCEPTED BEHAVIOUR, MEASURED, NOT FIXED: BM25 length normalization favours short documents, and the median row is 961 bytes against a corpus of a few hundred Markdown documents. ANTECEDENT, because these ARE disk measurements and are labelled as such rather than as index counts: `find docs/decisions -name '*.yaml' -printf '%s\\n'` over the row FILES as they stood on 2026-09-01 (min 326 B, median 961 B, mean 2168 B, max 19674 B). A file-size distribution is a property of the register on disk and needs no index; the counts that describe INGESTION do, which is the distinction this row got wrong once. The boost is inversely correlated with content — the ~900 B stubs win slots and the two largest rows, GATE-STEP-LOCUS (19674 B) and RETRIEVAL-QMD-CI (16720 B), lose them — and with K=3 that is SLOT OCCUPANCY: three thin rows can evict a deciding ADR, and dedup is path-only, so all three slots can be one decision family. Accepted, recorded, not mitigated; NO RANKING CLAIM IS MADE ANYWHERE — rows are now discoverable, and that is the only property asserted. KNOWN LIMIT, not to be 'fixed': as of 2026-09-01, 36 row KEYS carry zero topical words (antecedent: the key strings in docs/decisions/*.yaml on disk -- a property of the register's naming, not of the index) (27 of the form PROP-20260809-003000--D1, plus CONFLICTS-20260819, LOSS-1, PMW-1, PMW-4, REG-1, REG-2, REG-3, REG-4, REV-1), so they get no key signal from BM25. Renaming keys is NOT the remedy: a key rename breaks every chain edge and every citation. THE INGESTION CANARY, and why it is a nonce rather than a row: corpus PRESENCE is not INGESTION — all three masks can be correct on disk while a future qmd, a changed config shape or a re-narrowed glob drops every .yaml, and the index would still build, still stamp and still answer, never returning a row again, silently. So the .yaml arm is proven end to end at rebuild time and the failure is fail-CLOSED (caches wiped, corpus NEVER stamped, its own named fallback). The sentinel is a planted nonce in a docs/decisions/*.yaml file, not a real row's content: a guard coupled to register CONTENT would go red on ordinary register growth, turning someone opening a decision row into a repository-wide merge block — worse than the failure it guards — and on the docs-straight-to-main lane it would invert into 'landed with codegen red'. Its non-vacuity is asserted, not assumed: if the nonce occurs in any indexed Markdown the build fails. HONEST BOUND ON THE STUB SUITE: it fakes qmd, so it can prove the WRAPPER's control flow around the canary (present -> proceed, absent -> fail closed, unstamped) and structurally cannot prove that a real qmd ingested a real row; that half is the empirical Phase-0 verification recorded above and the canary running in real use. FAILURE PROTOCOL (carried forward, still binding, and EXTENDED): if install, scriptless BM25 indexing, or the required fallback behavior fails, the integration is NOT silently repaired or widened — the failure is recorded and a new/reversal decision opens on the chain head before any change to package, version, permissions or dependency shape. EXTENDED HERE ON TWO AXES, because this change created the gap: CORPUS COMPOSITION is a FIFTH protected dimension (what is exported, what is masked, and the collection glob) — a future session could otherwise silently drop these rows without tripping the protocol, having touched no package, version, permission or dependency; and SILENT PARTIAL INGESTION is a FOURTH trigger (the corpus builds and answers while an arm of it is empty, or while only part of it arrived). CORRECTED IN PR #841 REVIEW ROUND 1: this row first said that trigger 'is what the canary detects'. It is not. The canary is ONE nonce checked with `grep -qF`, so it detects an EMPTY arm and is structurally blind to a PARTIAL one -- a single ingested row satisfies it while every other row is missing. A separate rebuild-time INGESTION-COMPLETENESS check now covers the partial case (indexed `docs/decisions/*.yaml` documents >= the count this build exported, both sides derived at build time, fail-closed and unstamped like the canary, stub cases T10g/T10h). The two are complementary and neither subsumes the other: the canary proves the arm is alive end to end THROUGH THE SEARCH PATH, the completeness check proves no document was dropped. That correction was not academic -- the guard went red against the real pinned tool on the first run, which is how RETRIEVAL-QMD-INGEST-LOSS was opened. LEGAL POSTURE, unchanged and restated because discoverability changes who sees these rows: a hit on a counsel-owned row licenses only the EXTERNAL ACTION, never the answer — three rows carry `owner: counsel` (MONEY-LINE-LEGAL, PUBLISH-PRECONDITIONS, REVOKED-COLLEAGUE-NOTICE) and a `decided` status on any row is a recorded decision, never legal clearance. Making a row easier to FIND is neither discharge of a counsel-gated question nor counsel re-entry. `docs/legal/**` stays OUT of the corpus, deliberately. The 'may not leave the repo' constraint continues to hold because the cache is local and gitignored and no network path exists on the lookup path — a CONDITION, not a property, and every fenced item this corpus might later gain would re-open it. .claudeignore and .gitignore were CHECKED and need no change: `.qmd/` is already ignored by both, and the corpus lives only inside it. THE CI DIFF IS ZERO EXECUTABLE LINES -- the only change to `.github/workflows/ci.yml` is the authorizing-row COMMENT, moved off the superseded chain head onto this row (stated precisely because the first wording, 'the CI diff is zero lines', was false as written and appeared on a changed line of that very file). The one authorized step already runs the stub suite, the suite gained cases rather than a step, and nothing about this change needs a new job, step or permission. QMD IS NOT MEMORY AND NOT DECISION AUTHORITY: a result or the absence of a result never decides anything; rg + aliases, direct source reading, exact docs/decisions/<KEY>.yaml resolution at HEAD and the AskUserQuestion gate remain the authority path. ACTIVATION COMPLETED 2026-08-23 (durable record: docs/status/journal-2026-W34.md), re-verified 2026-09-01 on a fresh checkout: scriptless pinned @tobilu/qmd@2.8.3, lockfile integrity verified against the recorded sha512, observed JSON schema top-level-array, corpus from git archive HEAD, index at .qmd/corpus/.qmd/index.sqlite. Boundary, activation and rollback detail: PROP-20260822-171212 (rewritten in the same change). Residue: the row schema has no field for a fence, which is the root cause of a ~10 KB prose monolith carrying authorized/not-authorized/riders — tracked as the team-owned row REGISTER-ROW-FENCE."
