evidence: "Founder directive 2026-08-29, verbatim: 'We need to resolve this isolation subject first to avoid any new bad development.' -- given after his direct question on process managers appending in place of the responsible actor. The property is the spec's own declared sentence (specs/common/processmanager.yaml:7-9, 'AGGREGATES OWN THE FACTS'; ADR-20260816-040239, 'birth AUTHORITY licenses the DECISION, never the APPEND'). Plan: C1 flip-run of the built Order-birth route (C1a produces pre-flip evidence; the DEFAULT FLIP itself goes to the founder with the evidence -- dispatch card 598 SS7/SS9 already records that obligation) -> C2 #595 (the reclamation birth moves onto the mailbox) -> C3 the twelve remaining deliver: steps in target-actor groups (Payment x7, DeliveryJob x4, Cart x1), one PR each, per-route gates GENERATED from the spec enumeration (farley -- refines ADR-20260816-040239's 'same flag' wording), each route gate ON -> smoke -> legacy arm deleted in a SEPARATE change with golden payload-equality as the deletion precondition (beck) -> C4 final vision: the EventStore save capability leaves PM signatures (vernon: a PM spells load, never save; PM state is table-based), foreign-stream append unspellable, subsumed gates deleted. Sequencing: the erasure PROPOSAL approval proceeds (paper produces no development); the erasure BUILD starts after C1 proves the pattern + founder approval (holub); business timebox note -- if counsel returns fast, isolation must not silently become the binding constraint. Legal guard-rail: PROP-20260808-142532 tombstone/Art. 21 semantics untouched. Vocabulary (evans): 'foreign-stream append' is THE term; 'legacy' only as the gated OFF path's temporal qualifier; 'direct append' retired at its two living sites when next touched. Consulted: 13 lenses, one line each in the ADR."
