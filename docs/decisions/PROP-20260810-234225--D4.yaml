key: "PROP-20260810-234225--D4"
status: "decided"
question: "What IS a business metric: a projection folded from the log, or a counter emitted at a boundary?"
owner: "founder"
opened: "2026-08-10"
decided: "2026-08-11"
decided_by: "ADR-20260811-014129"
register: "docs/proposals/DECISIONS.md §27bis"
evidence: "REVERSED from the proposal's original instrument-based recommendation. Current decided position: the metric IS a projection -- a declared `fold:` over `domain_events` maintained by the `bam` projector into the `bam` schema, read through a tenant-scoped GraphQL query; a named `alertable:` subset also taps an OTLP counter as it folds at head, for alerting only. Product owner, verbatim: 'Confirm the reversal, go with the projections.' Recorded in ADR-20260811-014129 and DECISIONS.md §27bis (MET-R); ADR-20260810-234225 is superseded in part, never rewritten. STALE TABLE: the DECISIONS.md §27 summary table's own D4 cell still reads 'Generate the instruments (compiler catches renames, attribute names, types, arity at every call site) + a behaviour test ... Not an extended source-text scanner' -- the REJECTED instrument option -- because that cell predates the reversal and was never updated; promoting it as-is would assert a superseded position as current truth, which is exactly what ADR-20260828-153000 flagged this family for."
capacity: "founder"
