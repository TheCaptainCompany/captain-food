key: "REV-1"
status: "decided"
question: "Does the `claude-review` bot check stay a REQUIRED status check on `main`?"
owner: "founder"
opened: "2026-08-17"
decided: "2026-08-17"
decided_by: "ADR-20260807-235930"
capacity: "founder"
register: "docs/proposals/DECISIONS.md §45 (prose row, migrated 2026-08-25)"
evidence: "DECIDED (c): REMOVE `claude-review` from the required checks — taken AGAINST the team's own recommendation and recorded as a deliberate acknowledgement, not an erosion. The mechanical guarantee of ADR-20260807-235930 (nothing merges without a review having RUN, whatever any agent does) is GIVEN UP KNOWINGLY, and the compensating control is that the independent reviewer pass stays MANDATORY before ready-for-review (founder directive 2026-08-01) — a process obligation where there was a mechanism, which is exactly the trade. `codegen`, `build-test` and `db-test` stay required and untouched. Occasioned by #593: on PR #586 the check concluded red twice inside 25 s with ANTHROPIC_API_KEY empty and NO DIFF EVALUATED — an authentication failure wearing a finding's clothes — and while it persists every PR in the repo is unmergeable regardless of code quality. Options weighed: (a) keep it required and fix the credential (preserves the mechanism, but the credential is admin-gated and the failure mode is a repo-wide merge stop with no review performed); (b) make it non-blocking/report-only (a check nobody must satisfy is a check nobody reads); (c) remove it — chosen, because the team's own reviewer IS the real gate and has been doing the work, having FAILED PR #610's first head on three blockers including a money-path one, a class the bot check has never produced. ⚠️ NOT EXECUTED. The `PATCH /repos/TheCaptainCompany/captain-food/rulesets/19179892` was attempted on 2026-08-17 and returned 403 FROM THE SESSION'S AGENT PROXY (\"Write access to this GitHub API path is not permitted through this proxy\") — an egress-policy block, NOT a GitHub permission denial; the proxy's own README forbids routing around it, and the token additionally reports admin:false so admin sufficiency is untested either way. Re-checked 2026-08-25: the session attempting it had no `gh` CLI and its GitHub MCP server exposed no ruleset tool, so neither route available to THAT session could make the call; the 403 above is what establishes the proxy block itself. THE RULESET STILL REQUIRES `claude-review` TODAY; the change is an open action on #593 needing a founder or an admin-capable session. ⚠️ RE-AFFIRMED UNEXECUTED 2026-08-24 (ADR-20260825-005323): asked to execute this row BEFORE hardening the check under #677/#680, the founder chose a one-time admin bypass instead, against the team's recommendation and with the cost stated twice. So `claude-review` is now decided-out, STILL REQUIRED, and newly ABLE TO FAIL: any run where the reviewer cannot post (429, model outage, permission denials, the action's own self-skip on a PR editing its workflow) is a repo-wide merge stop, and a revert would itself need the check green. That exposure is knowingly carried. Executing this row removes it without touching any workflow file, and remains the recommended next step. Migrated out of _legacy.yaml 2026-08-25 under the ADR-20260821-103403 burn-down triggers: this key was both (a) named in a founder-facing decision question and (b) amended, in the same change. ✅ EXECUTED 2026-08-26 BY THE FOUNDER, in the GitHub UI, nine days after the decision. Ruleset 19179892 now requires `codegen`, `build-test` and `db-test`; `claude-review` is off the list, verified by reading the ruleset back. EVERY CLAUSE ABOVE MARKED ⚠️ NOT EXECUTED / RE-AFFIRMED UNEXECUTED IS NOW HISTORY, and the exposure they describe -- a 429, a model outage, a permission denial or the action's self-skip becoming a repo-wide merge stop -- IS CLOSED. It is left standing rather than deleted because it is the record of what was carried, and for how long. WHAT FINALLY FORCED IT was not the original argument but a NEW consequence: removing `synchronize` from the review trigger (#687, ADR-20260826-084500) meant a push to an open PR left the required `claude-review` with NO CHECK RUN ON THE HEAD AT ALL, so branch protection held it at `Expected` and every PR landed in `mergeable_state: blocked` after its last push. Observed on #680, not predicted -- the session reasoned it out, then watched it happen. That made a nine-day-old recommended action into a blocker on the next ordinary PR. THREE INDEPENDENT WALLS stopped the team executing it, which is why it waited for a human: the agent proxy's 403 on the ruleset PATCH (2026-08-17), no ruleset tool in the session's GitHub MCP server (2026-08-25), and the Claude Code permission classifier declining to build the patch body (2026-08-26). None is a GitHub permission denial; all three are sandbox boundaries, and they are correct ones -- a repo's required-check ruleset is not an agent's to edit unprompted."
