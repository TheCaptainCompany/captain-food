evidence: "DECIDED YES, founder 2026-08-24 (ADR-20260824-205911). Closing this challenge IS the supersession move, so RETRIEVAL-QMD flips to superseded in the same commit and THIS ROW BECOMES THE CHAIN HEAD — it therefore carries the predecessor's controlling content forward IN FULL, with one clause narrowed. WHAT IS AUTHORIZED (all of it, nothing more): the decision-lookup skill + wrapper + gitignored/claudeignored project-local .qmd/ cache (SKILL.md, scripts/decision-lookup.sh, scripts/stub-tests.sh, the .gitignore/.claudeignore entries) — local, scriptless, exact-pinned QMD BM25 over the approved committed-Markdown corpus, advisory and non-blocking; PLUS, new in this decision, exactly ONE `.github/workflows/ci.yml` step (`bash .claude/skills/decision-lookup/scripts/stub-tests.sh`, pure bash + python3, seconds, no Rust) in the always-run `changes` job, and exactly ONE codegen test pinning it there (`the_stub_suite_runs_in_the_always_run_changes_job`, mirroring `the_hook_selftest_runs_in_the_always_run_changes_job`). WHAT IS STILL NOT AUTHORIZED (carried forward verbatim, each needs a new decision row): GraphRAG (the #643 deferral stands untouched), vector search, embeddings, model downloads, reranking, query expansion, hybrid modes, MCP or any server, hosted services, credentials, incremental index maintenance, hooks, ANY OTHER CI or workflow change THAT REFERENCES OR SERVES THIS INTEGRATION (this row governs the QMD surface; it says nothing about unrelated CI work, which is governed by its own records), validator changes, agent-contract or .claude/agents/** edits, settings.json changes, decision-register semantic changes, generated-spec changes, production code, YAML decision-row indexing, any mandatory-workflow rule, and any widening of package, version, permissions or dependency shape. SIX ADDITIONS RIDE ALONG, NOT UNDER THIS ROW -- (a)-(e) under docs/decisions/README.md AND ADR-20260821-010543, (f) under the open team row GATE-STEP-LOCUS -- and are named here so the carve-out is not visible only in the ADR: (a) a decision-register validator rule closing the supersession coupling WHERE A CHALLENGE EDGE EXISTS -- i.e. the direction the ADR wrongly claimed was already total, in the `reconsiders:` spelling of it. It does NOT put the invariant on the `superseded_by` edge, so `X superseded_by Y` with `Y` open and no `reconsiders` stays legal: that is what a MIGRATION produces (a row replaced by a successor that never formally challenged it), it is what `supersession_is_a_dag_walked_by_identity` calls 'a chain terminating in a live row', and redding it breaks two pre-existing behaviour tests -- which CLAUDE.md says means fix the generator, never the test. Review #29 read the arm and concluded the open-successor state was an oversight; it is a decision, now pinned by a green control beside the rule rather than only in the DAG test, and this clause no longer claims more than the arm does; (b) the gate-script self-verification block and its pins, which guard the CI step this row DOES authorize — including the block added to .claude/hooks/register-check-selftest.sh and the REGISTER_CHECK_ALLOW_DIRTY opt-out threaded through stop-gate.sh and `make hooks-test`, AND the symmetric `make stub-tests` target carrying DECISION_LOOKUP_ALLOW_DIRTY for the other guard -- named here because PROP-20260822-171212 listed 'a Makefile target' as an unqualified non-goal while that target landed in the same PR (review #15), and because a default-on self-verification block with no interactive entrypoint gets DELETED rather than opted out of; neither target carries any QMD behaviour, both merely pass the opt-out to a script already on the decided surface. This is the guard-script rider because a guard script cannot detect its own wholesale replacement and only the OTHER guard can; and (c) a rewrite of the pre-existing the_hook_selftest_runs_in_the_always_run_changes_job onto the shared helper, which had every hole the new pin was built to close. (d) a SECOND decision-register validator rule, `decision-superseded-authority`, which WARNS -- not errors, see `CITATION-RULE-LEVEL`; the section 17 ratchet still exits 1 on the first occurrence, so `make validate` does fail, but the escape is `make warning-baseline` rather than rewording (review #91: this chain head was the one record that did not move when the level did) -- when any TRACKED file in its corpus (git ls-files over .claude/, .claudeignore, .gitignore, CLAUDE.md, the Makefile, .github/workflows/, docs/dispatch, docs/claude and docs/PLAYBOOK.md, MINUS the pathspec exclusion :(exclude).claude/loop-budget, THEN filtered to the .md/.sh/.json/.yaml/.yml extensions plus those four root files by name) cites a row whose status is superseded as live authority. THE THREE `docs/**` PATHSPECS (docs/dispatch, docs/claude, docs/PLAYBOOK.md) WERE ADDED 2026-08-28, decided by the team-owned register row docs/decisions/DISPATCH-CARD-CITATION.yaml (issue #477, founder directive 2026-08-28: 'work #477... ASAP, it influences agent behaviour') — updating THIS clause is the same factual-correction pattern review #26/#63/#67 already used on this row to keep it tracking `claude_citation_corpus`, not a re-decision. Those three subtrees are INSTRUCTION SURFACES a session reads and executes before it works — a dispatch card is not narration about a decision, and CLAUDE.md itself routes every session to docs/claude/** ('Topic authorities -- read the relevant one before working') and docs/PLAYBOOK.md before working — which is exactly the property that puts .claude/** in this corpus. The general docs/** exclusion stands for everything else: ADRs, proposals, the register and the journal still narrate history, including citing superseded rows to explain what changed, and a citing site inside the three new subtrees that is itself narrating a supersession (not instructing a live action) uses the SAME clause-scoped `superseded` exemption every other instruction surface already relies on. THE LOOP-BUDGET EXCLUSION IS THE `docs/**` RULE APPLIED INSIDE .claude/ (review #67): telemetry is a record of what happened, not an instruction the next session reads, and `.claude/loop-budget/**` is 89 of the corpus' 139 tracked files, growing ONE PER LOOP RUN, with long free-text `note` fields written in the records' own house style -- they already name ADP-1, RSO-1, MOB-COST-1a, HIGH-CONSEQUENCE and full ADR ids. None is in a citing form today (every declared key checked against every citing spelling, zero hits), so nothing open is closed by this. What it closes is the FALSE RED on the one surface with no honest escape: a future note writing `per row X` is plausible given who writes them, and if X is later superseded the gate becomes a hard make validate error inside a committed append-only telemetry file, fixable only by editing a historical record to appease a gate. A telemetry note cannot carry a live instruction by construction, so there is not even a latent miss traded away. THAT FILTER WENT UNSTATED FOR THREE ROUNDS, in both records, so both described the corpus WIDER than the code applies it -- and `the_records_state_the_same_citation_corpus_as_the_code` structurally cannot catch it, because it compares PATHSPECS: a guard checking one half of a description is blind to the other half overstating. What the filter drops is now counted and warned as `decision-citation-file-out-of-corpus`, tree-caused and therefore INSIDE the §17 ratchet, so adding an out-of-corpus .claude/** file (an extensionless hook, a .txt note, a .toml) becomes a deliberate baseline-moving act rather than a silent one; zero such files are tracked today, so it starts silent (review #63). WORKFLOWS ARE IN, added by review #21 because the argument for excluding them was falsified by the diff that shipped it: ci.yml's own gate-step comment says `Authorized by decision row RETRIEVAL-QMD-CI ... that row authorizes THIS STEP AND ITS PIN AND NOTHING ELSE in CI`, which is a live instruction to the next author, not provenance -- so when THIS row is superseded that comment must red rather than send a session down a dead chain. This clause and the ADR both omitted workflows for one round after the code gained them (review #26), which is the two-lists-of-one-scope divergence the rule's own file retracts three times; `claude_citation_corpus`'s SCOPE section is the one list, and these are restatements that must track it. The corpus is git's, not the disk's: an earlier version walked the filesystem, so an untracked worktree under .claude/ redded make validate locally while CI stayed green, and the first remedy was a four-name denylist that treats the symptom. It is the executable form of CLAUDE.md's grep-the-old-term rule, added because this very change flipped RETRIEVAL-QMD to superseded and left EIGHT sites citing it — including decision-lookup.sh's runtime failure message, on the rollback path this row's FAILURE PROTOCOL governs. (e) the `.gitignore` entry for `__pycache__/` and `*.pyc`. Generic repo hygiene rather than QMD surface, but it earns a clause because the event was OBSERVED ON THIS BRANCH -- a .pyc with no source in the tree was committed once by an over-broad `git add` (review #8) -- and because an unnamed rider is precisely what this history tracks. Nothing in-tree runs a .py FILE today, so it guards the `git add`, not the suite. THE REASON FIRST GIVEN FOR THAT WAS FALSE and is retracted here rather than left standing: this clause said `both Python call sites use python3 -c, which writes no bytecode`. There are ~20 python3 call sites across the gate scripts, TWO of them stdin heredocs (the `python3 - <arg> <<PYEOF` form in register-check-selftest.sh), and the SIX `PYTHONPATH=` probes in stub-tests.sh DO write `__pycache__/sitecustomize.*.pyc` -- into a `mktemp -d` fixture the EXIT trap removes, which is WHY nothing reaches the tree and is the reason this clause should have been stating. The conclusion held and every stated reason for it was wrong. Corrected in `.gitignore` and the journal by review #83 and NOT here for two rounds (review #85) -- the half-applied sweep landing on the DECISION ROW, i.e. the one surface a future session resolves as authority, inside the record that documents the pattern. (f) the job-level `timeout-minutes` on the `changes` job. THE OTHER SIX CAPS ARE NOT RIDERS AND ARE NOT LISTED HERE: `lint`, `specs`, `build-test`, `db-test`, `docs-validate` and `codegen` bound cargo and a postgres service container, would be correct on a branch that never heard of QMD, and fall squarely under this row's own carve-out for CI work that does not reference or serve this integration. THE `changes` CAP IS THE ONE THAT DOES NOT, and GATE-STEP-LOCUS justified all seven with one sentence -- `a job-level timeout-minutes: references nothing about QMD and serves the register-check selftest and the docs_only detector equally` -- which its OWN evidence field falsifies two sentences earlier (`the hazard is one THIS PR CREATES ... the change that puts a python3-heavy suite in the job everything needs:`) and which ci.yml falsifies beside the value itself, where the comment justifying 10 names that suite's behaviour specifically. A cap whose stated antecedent IS the QMD step is arguable as CI work that REFERENCES OR SERVES THIS INTEGRATION, i.e. the exact clause this row reserves for a new decision. The honest form, and the stronger one: it is a MITIGATION OF A HAZARD THIS ROW'S OWN STEP INTRODUCES, taken because leaving a known repository-wide merge block in place is not the conservative choice merely because it keeps a diff smaller. Named here so the ride-along assertion can see it and so the founder decides the placement rather than inheriting it from a sentence; the record-side correction is in GATE-STEP-LOCUS (review #64). CLAUSE HISTORY, kept because the miss repeated: an earlier version said TWO and omitted (c), which PR #679's body then described as 'all named in the row' — review #9 caught it; the next version said THREE while FOUR had landed — review #11 caught that; and review #30 found a FIFTH rider, the .gitignore entry, named in no record at all — occurrence THREE of this same drift, inside the row that documents the pattern. The count is stated here rather than in the ADR alone precisely because it keeps drifting — and since saying so three times did not stop it, `the_ride_along_count_matches_the_clauses_named` now asserts the stated number equals the number of enumerated clauses, so a sixth rider reds until it is named. Both are remediation of claims made while landing this row; neither widens the QMD surface. QMD IS NOT MEMORY AND NOT DECISION AUTHORITY: a result or the absence of a result never decides anything; rg + aliases, direct source reading, exact docs/decisions/<KEY>.yaml resolution and the AskUserQuestion gate remain the authority path. The CI step tests the WRAPPER: it runs no QMD, installs nothing, and never touches a live .qmd/ cache. WHY THE CHANGE: SKILL.md declares the stub suite the executable authority for a wrapper carrying a supply-chain gate (pinned+scriptless install, structural bun.lock version-integrity binding, delete-wholesale corrupt-index handling), yet nothing executable ran it — so its green reported the author's machine, which this repo's preference for executable over prose does not accept. Not theoretical: when the step was briefly wired during PR #676 its FIRST CI run went red at 26/52 and exposed a hidden host dependency the suite had carried unnoticed (the wrapper preflights `command -v bun`, so on a bun-less runner every cache-building case failed its precondition); the suite claimed hermeticity while requiring a real bun. Fixed in the very next commit on that same branch -- NOT independently, as an earlier draft said (an exit-0 stub bun for the whole run) — but found ONLY by running the suite off the author's machine. INSTRUMENT NOTE: PR #676's first attempt used the WRONG one — it appended an AMENDMENT paragraph to the decided RETRIEVAL-QMD row's evidence, which docs/decisions/README.md forbids (a decided row is challenged by a new open row carrying reconsiders:, and superseded_by is the ONE legal edit to it); the independent review caught it, the edit was reverted and the CI wiring dropped from that PR, which is why this row exists. ALTERNATIVE REJECTED: leave the suite unrun and downgrade SKILL.md's wording to executor-side-only — honest and free, but it answers a supply-chain gate's verification question with a promise, against which the 26/52 first run is the standing counter-example. FAILURE PROTOCOL (carried forward, still binding): if install, scriptless BM25 indexing, or the required fallback behavior fails, the integration is NOT silently repaired or widened — the failure is recorded and a new/reversal decision opens on the chain head before any change to package, version, permissions or dependency shape. The sandbox spike remains EVIDENCE, NOT PROOF that the repository wrapper works, and its caveats stand: the default Markdown mask is blind to docs/decisions/*.yaml so QMD cannot discover or resolve authoritative rows; on the docs-only-CI citation case BOTH QMD and rg missed the controlling record; and the spike corpus was contaminated by the proposal's own example transcripts, so no performance claim transfers without a clean benchmark. ACTIVATION COMPLETED 2026-08-23 (durable record: docs/status/journal-2026-W34.md, 2026-08-23 entry). ACTIVATION HISTORY (carried forward): first --install failed correctly on a whitespace-sensitive trustedDependencies verification grep against Bun-reformatted JSON (a false negative — the enforcement held, Bun blocked 6 postinstalls); separately authorized reversal 588cbd8 replaced it with structural stdlib-JSON parsing; the separately authorized retry passed — scriptless pinned @tobilu/qmd 2.8.3, lockfile integrity verified against the recorded sha512, observed JSON schema top-level-array (a pinned shape, parser unchanged), corpus from git archive HEAD, index at .qmd/corpus/.qmd/index.sqlite. Boundary, activation and rollback detail: PROP-20260822-171212 (rewritten in the same change)."
