evidence: "DECIDED YES, founder 2026-08-24 (ADR-20260824-205911). Closing this challenge IS the supersession move, so RETRIEVAL-QMD flips to superseded in the same commit and THIS ROW BECOMES THE CHAIN HEAD — it therefore carries the predecessor's controlling content forward IN FULL, with one clause narrowed. WHAT IS AUTHORIZED (all of it, nothing more): the decision-lookup skill + wrapper + gitignored/claudeignored project-local .qmd/ cache (SKILL.md, scripts/decision-lookup.sh, scripts/stub-tests.sh, the .gitignore/.claudeignore entries) — local, scriptless, exact-pinned QMD BM25 over the approved committed-Markdown corpus, advisory and non-blocking; PLUS, new in this decision, exactly ONE `.github/workflows/ci.yml` step (`bash .claude/skills/decision-lookup/scripts/stub-tests.sh`, pure bash + python3, seconds, no Rust) in the always-run `changes` job, and exactly ONE codegen test pinning it there (`the_stub_suite_runs_in_the_always_run_changes_job`, mirroring `the_hook_selftest_runs_in_the_always_run_changes_job`). WHAT IS STILL NOT AUTHORIZED (carried forward verbatim, each needs a new decision row): GraphRAG (the #643 deferral stands untouched), vector search, embeddings, model downloads, reranking, query expansion, hybrid modes, MCP or any server, hosted services, credentials, incremental index maintenance, hooks, ANY OTHER CI or workflow change THAT REFERENCES OR SERVES THIS INTEGRATION (this row governs the QMD surface; it says nothing about unrelated CI work, which is governed by its own records), validator changes, agent-contract or .claude/agents/** edits, settings.json changes, decision-register semantic changes, generated-spec changes, production code, YAML decision-row indexing, any mandatory-workflow rule, and any widening of package, version, permissions or dependency shape. FOUR ADDITIONS RIDE ALONG UNDER docs/decisions/README.md AND ADR-20260821-010543, NOT UNDER THIS ROW, and are named here so the carve-out is not visible only in the ADR: (a) a decision-register validator rule closing the supersession coupling in the direction the ADR wrongly claimed was already total; (b) the gate-script self-verification block and its pins, which guard the CI step this row DOES authorize — including the block added to .claude/hooks/register-check-selftest.sh and the REGISTER_CHECK_ALLOW_DIRTY opt-out threaded through stop-gate.sh and `make hooks-test`, because a guard script cannot detect its own wholesale replacement and only the OTHER guard can; and (c) a rewrite of the pre-existing the_hook_selftest_runs_in_the_always_run_changes_job onto the shared helper, which had every hole the new pin was built to close. (d) a SECOND decision-register validator rule, `decision-superseded-authority`, which fails when any TRACKED file in its corpus (git ls-files over .claude/, .claudeignore, .gitignore, CLAUDE.md and the Makefile) cites a row whose status is superseded as live authority. The corpus is git's, not the disk's: an earlier version walked the filesystem, so an untracked worktree under .claude/ redded make validate locally while CI stayed green, and the first remedy was a four-name denylist that treats the symptom. It is the executable form of CLAUDE.md's grep-the-old-term rule, added because this very change flipped RETRIEVAL-QMD to superseded and left EIGHT sites citing it — including decision-lookup.sh's runtime failure message, on the rollback path this row's FAILURE PROTOCOL governs. CLAUSE HISTORY, kept because the miss repeated: an earlier version said TWO and omitted (c), which PR #679's body then described as 'all named in the row' — review #9 caught it; the next version said THREE while FOUR had landed — review #11 caught that. The count is stated here rather than in the ADR alone precisely because it keeps drifting. Both are remediation of claims made while landing this row; neither widens the QMD surface. QMD IS NOT MEMORY AND NOT DECISION AUTHORITY: a result or the absence of a result never decides anything; rg + aliases, direct source reading, exact docs/decisions/<KEY>.yaml resolution and the AskUserQuestion gate remain the authority path. The CI step tests the WRAPPER: it runs no QMD, installs nothing, and never touches a live .qmd/ cache. WHY THE CHANGE: SKILL.md declares the stub suite the executable authority for a wrapper carrying a supply-chain gate (pinned+scriptless install, structural bun.lock version-integrity binding, delete-wholesale corrupt-index handling), yet nothing executable ran it — so its green reported the author's machine, which this repo's preference for executable over prose does not accept. Not theoretical: when the step was briefly wired during PR #676 its FIRST CI run went red at 26/52 and exposed a hidden host dependency the suite had carried unnoticed (the wrapper preflights `command -v bun`, so on a bun-less runner every cache-building case failed its precondition); the suite claimed hermeticity while requiring a real bun. Fixed in the very next commit on that same branch -- NOT independently, as an earlier draft said (an exit-0 stub bun for the whole run) — but found ONLY by running the suite off the author's machine. INSTRUMENT NOTE: PR #676's first attempt used the WRONG one — it appended an AMENDMENT paragraph to the decided RETRIEVAL-QMD row's evidence, which docs/decisions/README.md forbids (a decided row is challenged by a new open row carrying reconsiders:, and superseded_by is the ONE legal edit to it); the independent review caught it, the edit was reverted and the CI wiring dropped from that PR, which is why this row exists. ALTERNATIVE REJECTED: leave the suite unrun and downgrade SKILL.md's wording to executor-side-only — honest and free, but it answers a supply-chain gate's verification question with a promise, against which the 26/52 first run is the standing counter-example. FAILURE PROTOCOL (carried forward, still binding): if install, scriptless BM25 indexing, or the required fallback behavior fails, the integration is NOT silently repaired or widened — the failure is recorded and a new/reversal decision opens on the chain head before any change to package, version, permissions or dependency shape. The sandbox spike remains EVIDENCE, NOT PROOF that the repository wrapper works, and its caveats stand: the default Markdown mask is blind to docs/decisions/*.yaml so QMD cannot discover or resolve authoritative rows; on the docs-only-CI citation case BOTH QMD and rg missed the controlling record; and the spike corpus was contaminated by the proposal's own example transcripts, so no performance claim transfers without a clean benchmark. ACTIVATION COMPLETED 2026-08-23 (durable record: docs/status/journal-2026-W34.md, 2026-08-23 entry). ACTIVATION HISTORY (carried forward): first --install failed correctly on a whitespace-sensitive trustedDependencies verification grep against Bun-reformatted JSON (a false negative — the enforcement held, Bun blocked 6 postinstalls); separately authorized reversal 588cbd8 replaced it with structural stdlib-JSON parsing; the separately authorized retry passed — scriptless pinned @tobilu/qmd 2.8.3, lockfile integrity verified against the recorded sha512, observed JSON schema top-level-array (a pinned shape, parser unchanged), corpus from git archive HEAD, index at .qmd/corpus/.qmd/index.sqlite. Boundary, activation and rollback detail: PROP-20260822-171212 (rewritten in the same change)."
