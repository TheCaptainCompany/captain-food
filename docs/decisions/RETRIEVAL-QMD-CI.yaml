key: "RETRIEVAL-QMD-CI"
status: "open"
question: "Should the decision-lookup hermetic stub suite be wired into CI (the always-run `changes` job, pinned by a codegen test), narrowing RETRIEVAL-QMD's non-authorization of CI changes to exactly that one step plus its pin — or does the suite stay an executor-side authority?"
owner: "founder"
opened: "2026-08-24"
reconsiders: "RETRIEVAL-QMD"
register: "docs/proposals/DECISIONS.md (generated index row)"
evidence: "Raised by the PR #674/#675 reviews and filed after PR #676's first attempt used the WRONG INSTRUMENT: it appended an AMENDMENT paragraph to the decided RETRIEVAL-QMD row's evidence, which docs/decisions/README.md forbids (a decided row is challenged by a new open row carrying reconsiders:, and superseded_by is the ONE legal edit to it); the independent review caught it, the edit was reverted and the CI wiring dropped from that PR. THE CHANGED PREMISE: SKILL.md declares the stub suite the executable authority for a wrapper carrying a supply-chain gate (pinned+scriptless install, lockfile version-integrity binding), yet nothing executable runs it — so its green reports the author's machine, which the repo's 'a gate cannot be ignored' rule does not accept for prose. Evidence that this is not theoretical: when the step was briefly wired, its FIRST CI run went red at 26/52 and exposed a hidden host dependency the suite had carried unnoticed (the wrapper preflights `command -v bun`, so on a runner without bun every cache-building case failed its precondition); the suite claimed hermeticity while requiring a real bun to be installed. That defect is now fixed independently (an exit-0 stub bun for the whole run), but it was found ONLY by running the suite off the author's machine. SCOPE IF DECIDED YES: exactly one `changes`-job step (`bash .claude/skills/decision-lookup/scripts/stub-tests.sh`, pure bash + python3, seconds, no Rust) plus one codegen test pinning it there, mirroring the existing register-check-selftest precedent; every other clause of RETRIEVAL-QMD's non-authorization stands — no hooks, no agent-contract change, no validator rule over specs/**, no widening of package, version, permissions or dependency shape. ALTERNATIVE: leave it unrun and accept that the declared authority is executor-side only, downgrading SKILL.md's wording to match. Note for whoever decides: PROP-20260822-171212 §'Non-goals' and its decided-tracked-surface enumeration would be rewritten in the same change (that enumeration also predates and still omits scripts/stub-tests.sh)."
