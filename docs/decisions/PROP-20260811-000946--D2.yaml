register: "docs/proposals/DECISIONS.md §28"
evidence: "Decided as authored per event, with the BINDING (not the event) proven complete both ways: every declared event is bound by at least one screen node, every `tracking:` binding must resolve, but a node with no binding is simply untracked -- the correct default for personal data. Derivation was rejected on the measured numbers (61 of 121 api operations are screen-bound; 6 of 25 persona activities have none at all; four discovery screens share `roles: [PUBLIC, CUSTOMER]`). Team-owned per the same delegation. The DECISIONS.md §28 table's D2 cell matches this current text -- no divergence found."
