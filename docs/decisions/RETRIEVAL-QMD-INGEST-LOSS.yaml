key: "RETRIEVAL-QMD-INGEST-LOSS"
status: "open"
question: "The pinned qmd 2.8.3 silently drops a varying subset of documents on every clean rebuild while reporting success, so the retrieval index is now fail-closed and the tool returns only the baseline fallback. Do we stay on the baseline, change the pin, add a bounded rebuild-and-verify loop, or narrow the corpus?"
owner: "founder"
opened: "2026-09-01"
register: "docs/proposals/DECISIONS.md (generated index row)"
evidence: "FAILURE PROTOCOL FIRED (row RETRIEVAL-QMD-ROWS, clause 'SILENT PARTIAL INGESTION is a FOURTH trigger'). Opened by the executor during PR #841 review round 1, at base 06a762de, against the pinned @tobilu/qmd@2.8.3 -- the protocol requires the failure to be RECORDED and a decision opened on the chain head BEFORE any change to package, version, permissions, dependency shape or corpus composition, so this row exists before any of those is touched. WHAT WAS MEASURED, WITH ITS ANTECEDENT (every number below is read from the INDEX -- `select count(*) from documents where active = 1 and path like 'docs/decisions/%.yaml'` -- never from `find`/`ls` on disk and never from `qmd collection list`): 15 clean rebuilds at HEAD 06a762de, each `rm -rf .qmd/corpus .qmd/index` followed by one wrapper lookup. The export is correct and constant every time: 84 `.yaml` on disk under the corpus' docs/decisions/ (83 row files + the canary). The INDEX held 64, 67, 70, 70, 67, 70, 70, 67, 67, 72, 70, 67, 67, 70, 64 -- short on 15 of 15, and short by a DIFFERENT amount across runs on an identical corpus and an identical SHA. `.md` was complete on all 15 (356 of 356), so the loss is not uniform: it lands on whatever ingests LAST, which under the widened `**/*.{md,yaml}` glob is the rows. THE FOUR PROPERTIES THAT MAKE IT DANGEROUS RATHER THAN MERELY WRONG: (1) `qmd update` exits 0 and prints 'All collections updated' on every short run; (2) it also prints '440 unique hashes need vectors' -- the tool's own SCAN count is 440 while its `documents` table holds 420, so qmd is internally inconsistent about what it ingested, and any check reading the scan count would compare a number to itself; (3) re-running `qmd update` NEVER recovers a dropped document -- four consecutive updates left the count at exactly 420, so this is not a slow or asynchronous index that finishes later (measured directly: the count was still 420 at +3s, +5s, +10s, +30s and +60s after the wrapper returned, with no qmd process alive); and (4) the corpus was STAMPED on every one of the 15 runs, so every subsequent lookup at that SHA served the partial index as a hit. WHAT THE DROPPED ROWS ARE, on one sampled run: 20 rows including DISPATCH-CARD-CITATION, ERASURE-LAUNCH-GATE, GATE-STEP-LOCUS, LOSS-1, MONEY-LINE-LEGAL, PATH-ADDRESSED-STOREFRONT, QUOTE-TOKEN, REG-3, RETRIEVAL-QMD, REVIEW-GATE-BYPASS and RIDER-REVOCATION-TTL. That set includes an OPEN founder-owed money row (LOSS-1), a counsel-owned row (MONEY-LINE-LEGAL) and an open legal-gate row (ERASURE-LAUNCH-GATE) -- exactly the rows a register check most needs to find, and a miss on them reads as a clean negative trail. The FTS side lags further still: on runs where `documents` held 426, `documents_fts_docsize` held 425, so a document row is not even a guarantee of a searchable document. WHY THE EXISTING GUARD DID NOT CATCH IT, stated plainly because this row is the correction of a claim: the rebuild-time canary is ONE nonce checked with `grep -qF`. It proves the `.yaml` ARM is alive end to end -- pathspec, extension sweep, collection glob, search path -- and it is structurally blind to a PARTIAL arm, because one ingested row satisfies it while every other row is missing. RETRIEVAL-QMD-ROWS said silent partial ingestion 'is what the canary detects'; that sentence was wrong and is corrected in the same commit as this row. WHAT LANDED IMMEDIATELY, and why it needs no decision: a rebuild-time INGESTION-COMPLETENESS check, fail-CLOSED like the canary (caches wiped, corpus NEVER stamped, its own named fallback), comparing the index-derived row count against the count this build exported -- both sides derived at build time from the corpus itself, never a literal and never a number copied from a record, so ordinary register growth can never fire it. That is a STRENGTHENED guard on an existing surface, not a change to package, version, permissions, dependency shape or corpus composition, so the protocol permits it; it is what makes the failure LOUD instead of silent, and it is why this row can be opened calmly rather than as an incident. ITS CONSEQUENCE, stated because it is severe and must not be discovered by surprise: with the defect live, the check is red on every real rebuild, so `decision-lookup.sh` currently returns the rg + aliases fallback for EVERY lookup. The tool is de facto inert. That is the correct safe state -- the baseline is the system, and a partial index is worse than no index -- but it is a capability regression against what ADR-20260901-025538 recorded as working, and it is the reason this question is open rather than closed. WHAT THIS ROW MUST DECIDE, options not ranked here: (a) STAY on the baseline -- accept that the retrieval tool is fallback-only until qmd is fixed upstream, change nothing else, and let the fail-closed guard hold; (b) CHANGE THE PIN -- evaluate a newer @tobilu/qmd, which is a version change and therefore precisely what the failure protocol reserves to a decision; (c) REBUILD-AND-VERIFY LOOP -- keep 2.8.3 and have the wrapper retry `update` until the completeness check passes or a bounded attempt budget is exhausted, which is 'incremental index maintenance'-adjacent and touches a surface RETRIEVAL-QMD-ROWS lists as NOT authorized; (d) NARROW THE CORPUS so the row count falls under whatever threshold the loss appears above -- rejected on its face here and named only so it is on the record, because it would trade completeness of the register for completeness of the index, and the register is the point. NOT YET ESTABLISHED, and deliberately not guessed at: the mechanism inside qmd. The evidence is consistent with a dropped final write batch under concurrent ingestion (the surviving documents are not in path order, and the loss size varies run to run), but nothing here has been read out of qmd's source, and the option (b)/(c) choice should not be made on a guess. REVIEW-MEASUREMENT NOTE, recorded because it cost a full investigation and would cost the next one the same: the PR #841 reviewer measured 72 indexed rows against 82 exported and named 10 specific rows; the executor then measured 82 of 82 on the same cache file and read the two as contradictory. Neither was wrong. The property is NON-DETERMINISM, so a single complete observation refutes nothing, and one of the 15 rebuilds reproduced the reviewer's 72 exactly. A count taken once against a non-deterministic build is not evidence either way -- for this tool, take it across clean rebuilds or not at all."
