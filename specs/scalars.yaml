# --- Identity & Slugs ---

RestaurantAccountId:
  type: string
  format: uuid
  description: "Restaurant account (HubRise: restaurant) — groups one or more Restaurant locations."

RestaurantId:
  type: string
  format: uuid
  description: "A single restaurant location (HubRise: location), belonging to a RestaurantAccount."

CatalogId:
  type: string
  format: uuid
  description: "Catalog id (HubRise: catalog)."

ProductCategoryId:
  type: string
  format: uuid

ProductId:
  type: string
  format: uuid
  description: "A product groups one or more offers (HubRise: product)."

SessionId:
  type: string
  format: uuid
  description: "A session is a temporary auth token (ADR-0041) for a visitor or customer, used to bind carts and track the user across devices."

OfferId:
  type: string
  format: uuid
  description: "A purchasable offer with its own price (HubRise: SKU)."

OptionListId:
  type: string
  format: uuid

OptionId:
  type: string
  format: uuid

OrderId:
  type: string
  format: uuid

CustomerId:
  type: string
  format: uuid

CartId:
  type: string
  format: uuid

CartLineId:
  type: string
  format: uuid
  description: "Identifies a line within a cart, used to edit its quantity or remove it."

CorrelationId:
  type: string
  format: uuid
  description: >
    Correlates a command with the events/state it produces. Returned by every mutation payload so the
    client can track the outcome via the read side (matches domain_events.correlation_id).

CauseId:
  type: string
  format: uuid
  description: >
    Causation id: the id of the message/event that directly caused this one (matches
    domain_events.cause_id). Threads a cause→effect chain through the log; null for a root command.

MessageId:
  type: string
  format: uuid
  description: >
    Unique id of one command submission — the idempotency key of the write path (command_journal pk,
    ADR-20260720-015300). Client-suppliable via MetadataInput; server-generated (UUIDv7) when absent.
    A replayed messageId with an identical payload acknowledges against the original; the same id
    with a different payload is rejected (Conflict). Events emitted by the command carry it as
    domain_events.cause_id.

TraceId:
  type: string
  pattern: '^[0-9a-f]{32}$'
  description: >
    W3C trace-id (from the inbound `traceparent` header, or server-started). Response-only technical
    tracing identifier — never client-suppliable, never a substitute for correlationId (P-02).

DeliveryJobId:
  type: string
  format: uuid
  description: "Identifies one DeliveryJob (a single delivery of an order from restaurant to customer)."

RiderId:
  type: string
  format: uuid
  description: "An independent Captain rider (courier). Null on a partner-fulfilled job (the partner's courier is name/phone only)."

PaymentIntentId:
  type: string
  maxLength: 255
  description: "Stripe PaymentIntent id (provider reference). Example: 'pi_3Nabc...'."

RefundId:
  type: string
  maxLength: 255
  description: "Stripe Refund id (provider reference). Example: 're_3Nabc...'."

UserId:
  type: string
  format: uuid

AddressId:
  type: string
  format: uuid
  description: "Identifies a saved address in a customer's address book."

PaymentMethodId:
  type: string
  maxLength: 255
  description: "Stripe PaymentMethod id (provider reference). Example: 'pm_1Nabc...'."

ImageId:
  type: string
  format: uuid

ExternalReference:
  type: string
  maxLength: 128
  description: >
    External reference code (HubRise `ref`), unique within its scope.
    Used for idempotent import/sync and as a stable reference inside orders.
    Example: 'MARGHERITA', 'CAT-PIZZAS'.

ExternalIdentifierKey:
  type: string
  maxLength: 64
  description: >
    Key of a generic external identifier kept on a Restaurant listing (see entities.yaml#/ExternalIdentifier).
    Open vocabulary preserving the ORIGINAL source key; well-known values: 'siret', 'naf', 'google_place_id',
    'hubrise_ref'. NOTE: external ids are NOT assumed unique — one SIRET can host several dark-kitchen brands;
    cross-reference sources (a google_place_id usually distinguishes them).

GooglePlaceId:
  type: string
  maxLength: 255
  description: "Google Maps Place id identifying the establishment (enrichment / Business Profile)."

Latitude:
  type: number
  minimum: -90
  maximum: 90
  description: "WGS84 latitude in decimal degrees."

Longitude:
  type: number
  minimum: -180
  maximum: 180
  description: "WGS84 longitude in decimal degrees."

GoogleRating:
  type: number
  minimum: 0
  maximum: 5
  description: "Google Maps / Business Profile average rating (0–5), enrichment only."

WebUrl:
  type: string
  pattern: "^https?://"
  maxLength: 2048
  description: "An http(s) URL — restaurant website or the Google Business Profile 'Order online' link."

Slug:
  type: string
  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  maxLength: 80
  description: >
    URL-safe identifier for restaurants. Lowercase, dash-separated.
    Example: 'chez-marco', 'tokyo-sushi'.

# --- Names (strongly typed, no reuse) ---

RestaurantDisplayName:
  type: string
  maxLength: 140
  description: >
    Public label shown to customers. Can be short and brand-oriented.
    Example: 'Chez Marco', 'Tokyo Sushi'.

RestaurantLegalName:
  type: string
  maxLength: 255
  description: >
    Legal entity name used for invoices and contracts.
    Example: 'SARL CHEZ MARCO', 'TOKYO SUSHI RESTAURATION SAS'.

CatalogName:
  type: string
  maxLength: 140

CatalogCategoryName:
  type: string
  maxLength: 80

ProductName:
  type: string
  maxLength: 140

ProductDescription:
  type: string
  maxLength: 2000

OfferName:
  type: string
  maxLength: 140
  description: >
    Offer label, unique within a product (HubRise SKU name).
    Example: 'Small', 'Large', 'Default'.

OptionListName:
  type: string
  maxLength: 140

OptionName:
  type: string
  maxLength: 140

# --- Tags ---

Tag:
  type: string
  maxLength: 80
  description: "Free-form label (HubRise: tags). Example: 'vegan', 'spicy', 'eco'."

# --- Contact & Address ---

EmailAddress:
  type: string
  format: email
  maxLength: 255

PhoneNumber:
  type: string
  maxLength: 32
  description: >
    Canonical E.164 phone (e.g. '+33612345678'). Composed server-side from DialingCode + NationalPhoneNumber
    and stored on events/views. Validation enforced at application level.

DialingCode:
  type: string
  pattern: "^\\+[0-9]{1,4}$"
  description: >
    Country dialing/calling code in '+NN' form (e.g. '+33', '+1'). This is what the phone-country picker
    emits and what the auth commands receive — NOT the ISO country code.

NationalPhoneNumber:
  type: string
  maxLength: 24
  description: "National (subscriber) part of a phone number, without the dialing code. E.g. '0612345678' or '612345678'."

OtpCode:
  type: string
  pattern: "^[0-9]{4,8}$"
  description: "One-time SMS code from Supabase Auth (sent via the OVHcloud SMS hook; a mock provider in dev)."

EmailVerificationToken:
  type: string
  maxLength: 512
  description: "Opaque Supabase token from an email magic link; verified server-side (never trusted as a bare client claim)."

AddressLine:
  type: string
  maxLength: 255

CityName:
  type: string
  maxLength: 120

CityId:
  type: string
  format: uuid
  description: "A city Captain operates in — the scope that anchors delivery routing config (CityDeliveryRanking) and, later, partner availability. First-class id (delivery dispatch strategy foundation, #60)."

PostalCode:
  type: string
  maxLength: 20

CountryCode:
  type: string
  pattern: "^[A-Z]{2}$"
  description: "ISO 3166-1 alpha-2 country code. Example: 'FR'."

TimeZone:
  type: string
  maxLength: 64
  description: "IANA timezone. Example: 'Europe/Paris'."

Locale:
  type: string
  pattern: "^[a-z]{2}-[A-Z]{2}$"
  maxLength: 5
  description: >
    i18n culture code, language-REGION (BCP 47 / .NET CultureInfo). Example: 'fr-FR', 'en-US'. Drives
    the UI language AND the display of dates, times and numbers (paired with TimeZone for the zone).

# --- Money & Currencies ---
# We keep a stronger model than HubRise (which serialises "9.80 EUR" as a string):
# amount is an integer in minor units + an explicit currency, wrapped in the
# Money value object (see entities.yaml#/Money).

CurrencyCode:
  type: string
  pattern: "^[A-Z]{3}$"
  description: "ISO 4217 currency code. Example: 'EUR'."

MoneyCents:
  type: integer
  minimum: 0
  description: "Monetary amount in minor units (e.g. cents)."

PageLimit:
  type: integer
  minimum: 1
  description: >
    Requested page size for a paginated list query (#113). The server CLAMPS it to a per-query
    maximum (restaurants: 200) — asking for more returns the maximum, never an error. Absent = the
    query's default page size.

PageOffset:
  type: integer
  minimum: 0
  description: "Rows to skip before the page for a paginated list query (#113). Absent = 0."

TaxRatePercent:
  type: number
  minimum: 0
  maximum: 100
  description: "Percentage tax rate. Example: 10.0 for 10%."

MarginPercent:
  type: number
  minimum: 0
  maximum: 100
  description: >
    A restaurant's food margin (%), input to the proportional Captain service fee (ADR-0016/0017):
    the restaurant's variable contribution scales with clamp((margin−55)/(70−55),0,1). Example: 62.0.

# --- Stock ---

Quantity:
  type: number
  minimum: 0
  description: >
    Stock quantity in units. Decimals allowed to match HubRise inventory.
    0 means out of stock.

# --- Customer / Order ---

CustomerDisplayName:
  type: string
  maxLength: 140

OrderNote:
  type: string
  maxLength: 1000

# --- Ratings ---

StarRating:
  type: integer
  minimum: 0
  maximum: 5
  description: "Restaurant rating in stars (0–5), given by the customer on a delivered order."

ThumbRating:
  type: string
  enum: [UP, DOWN]
  description: "Rider rating: thumbs up or down."

RatingComment:
  type: string
  maxLength: 1000
  description: "Free-text comment accompanying a restaurant rating."

DeliveryTimeliness:
  type: string
  enum:
    - ON_TIME          # arrived within the promised window
    - ACCEPTABLE_DELAY # late, but the customer was fine with it
    - TOO_LATE         # unacceptably late
  description: >
    The customer's post-delivery verdict on the delivery delay (#62), asked once a DELIVERY order is
    delivered. The subjective counterpart of the objective delivered/late facts (ADR-0031/#60); feeds the
    restaurant's self-dispatch-vs-Captain decision.

DeliveryDissatisfactionReason:
  type: string
  maxLength: 300
  description: "Optional free-text reason a customer gives for a TOO_LATE delivery-timeliness verdict (#62)."

# --- Time ---

Weekday:
  type: string
  enum:
    - MONDAY
    - TUESDAY
    - WEDNESDAY
    - THURSDAY
    - FRIDAY
    - SATURDAY
    - SUNDAY

TimeOfDay:
  type: string
  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  description: "Local time of day, HH:mm (HubRise opening_hours format)."

# --- Enums (logical, not tied to specific language) ---

ServiceType:
  type: string
  enum: [DELIVERY, COLLECTION] 
  description: >
    Aligned with HubRise service types. COLLECTION == customer pickup.
    (EAT_IN is not offered by Captain.Food but is kept in TaxRate for catalog fidelity.)

OrderStatus:
  type: string
  enum:
    - PLACED
    - ACCEPTED
    - REJECTED
    - PREPARING
    - READY
    - OUT_FOR_DELIVERY
    - DELIVERED
    - CANCELLED_BY_CUSTOMER
    - CANCELLED_BY_RESTAURANT

# Lifecycle of a DeliveryJob, orthogonal to OrderStatus (a delivery is a separate aggregate).
DeliveryStatus:
  type: string
  enum:
    - PENDING           # job requested, awaiting a courier (partner or independent rider)
    - ASSIGNED          # a courier/rider has accepted it
    - PICKED_UP         # collected from the restaurant
    - OUT_FOR_DELIVERY  # en route to the customer
    - DELIVERED         # handed over — terminal (success)
    - FAILED            # could not be delivered — terminal
    - CANCELLED         # cancelled before delivery — terminal
  description: "Status of one delivery, reported by the partner (inbound) or driven by an independent rider's commands."

RiderStatus:
  type: string
  enum:
    - OFFLINE        # not accepting jobs
    - AVAILABLE      # online, can be offered jobs
    - ON_DELIVERY    # currently fulfilling a delivery
    - SUSPENDED      # blocked by admin — terminal until reinstated
  description: "Availability/lifecycle status of an independent Captain rider."

# Who fulfils a delivery: an external delivery PARTNER (e.g. Avelo37, with its own couriers) or an
# INDEPENDENT Captain rider (RIDER role) accepting the job directly. Both converge on one DeliveryJob.
DeliveryProvider:
  type: string
  enum: [PARTNER, INDEPENDENT]
  description: "Fulfilment channel of a delivery: PARTNER (e.g. Avelo37) or INDEPENDENT (a Captain rider)."

RestaurantStatus:
  type: string
  enum:
    - DRAFT
    - ACTIVE
    - INACTIVE

RestaurantListingStatus:
  type: string
  enum:
    - NON_PARTNER       # public listing seeded from open data (Sirene/Google); not orderable, no agreement
    - PASSIVE_PARTNER   # menu synced (e.g. HubRise) but no signed contract; not orderable
    - ACTIVE_PARTNER    # signed partner; orderable when also RestaurantStatus ACTIVE and not PAUSED
  description: >
    Partnership funnel of a restaurant LISTING, orthogonal to RestaurantStatus (the operational
    DRAFT/ACTIVE/INACTIVE state). Orderable ⇔ ACTIVE_PARTNER + RestaurantStatus ACTIVE + acceptance ≠ PAUSED.

GbpLinkStatus:
  type: string
  enum: [UNSET, CONFIGURED, VERIFIED, BROKEN]
  description: "State of the restaurant's Google Business Profile 'Order online' link to {slug}.captain.food (ADR-0021; V1)."

ProspectionScore:
  type: integer
  minimum: 0
  maximum: 10
  description: "B2B prospection priority (0–10), COMPUTED by the ProspectionPipeline projection from listing facts (ADR-0020) — never stored in an event."

ProspectPipelineStatus:
  type: string
  enum: [NEW, CONTACTED, COLD, REPLIED, CONVERTED]
  description: "Prospect funnel stage, DERIVED in the pipeline projection: NEW (no contact) → CONTACTED → COLD (J+21) / REPLIED, and CONVERTED when the restaurant reaches ACTIVE_PARTNER."

OutreachChannel:
  type: string
  enum: [EMAIL, SLACK, PHONE]
  description: "Channel of a prospection contact (email via Resend, Slack alert, or phone)."

TipRecipient:
  type: string
  enum: [RIDER, RESTAURANT, CAPTAIN]
  description: >
    Who a tip goes to (ADR-012). Tips are separate from the core 3-way split and Captain skims 0% (100%
    passes through); a tip to CAPTAIN is the tipper's explicit choice, not a cut of others' tips.

Tipper:
  type: string
  enum: [CUSTOMER, RESTAURANT]
  description: >
    Who gives a tip: the CUSTOMER (may tip rider/restaurant/Captain) or the RESTAURANT (may tip rider/
    Captain — e.g. thanking the courier). Derived server-side from the caller's role, not client-supplied.

CartStatus:
  type: string
  enum:
    - OPEN          # being built (possibly by a guest); persists indefinitely (Uber Eats style)
    - CHECKED_OUT   # converted to an Order at checkout
  description: >
    Lifecycle of a cart. Only an OPEN cart accepts line edits or checkout. Carts are never
    abandoned/expired — they persist until checked out, so there is no abandonment state.

OrderAcceptanceMode:
  type: string
  enum: [NORMAL, BUSY, PAUSED]
  description: "Current order acceptance mode of a restaurant (HubRise: order_acceptance)."

PaymentStatus:
  type: string
  enum: [PENDING, CAPTURED, FAILED, REFUNDED]
  description: "Order payment state, folded from Stripe facts (PaymentIntentCreated/Captured/Failed/Refunded)."

RefundStatus:
  type: string
  enum: [REQUESTED, APPROVED, DENIED, REFUNDED]
  description: >
    Lifecycle of a refund request as read models fold it from the domain facts (View_PendingRefunds):
    REQUESTED on RefundOpened (awaiting a restaurant/admin decision), APPROVED on RefundApproved
    (Stripe refund requested), DENIED on RefundDenied, REFUNDED once Stripe settles (PaymentRefunded).
    Distinct from RefundProcessStatus, the RefundProcess state-table run status.

OperationStatus:
  type: string
  enum: [PENDING, SUCCEEDED, REJECTED, FAILED]
  description: >
    Live status of a command/operation streamed by the operationStatusChanged subscription:
    PENDING (accepted, in flight), SUCCEEDED, REJECTED (business invariant), FAILED (technical error)."

# --- Write-path journal lifecycles (database/tables/journals.yaml, ADR-20260720-015300/-015400) ---
# Enum $ref columns store the enum's TEXT value verbatim (ADR-20260728, superseding the ADR-0037
# ordinal + ref_<enum> scheme), so rows are self-describing; renaming a value is the migration event.

CommandJournalStatus:
  type: string
  enum: [RECEIVED, SUCCEEDED, REJECTED, FAILED]
  description: >
    Lifecycle of a journaled command: RECEIVED (durably accepted, handler spawned), then SUCCEEDED,
    REJECTED (business invariant) or FAILED (technical). Maps onto the API OperationStatus
    (RECEIVED → PENDING). A duplicate submission is an acceptance-response attribute, not a status —
    the journal row keeps the original's real state.

CommandChannel:
  type: string
  enum: [GRAPHQL, WORKER, INTERNAL]
  description: >
    Surface a journaled command arrived through: the GraphQL BFF dispatch, an on-app drain/enrichment
    worker (e.g. the HubRise enricher), or an internal trigger endpoint.

InboundEventStatus:
  type: string
  # Values persist as TEXT verbatim (ADR-20260728), so declaration order is no longer a storage
  # contract; IGNORED/DUPLICATE were appended while ordinals were the format (ADR-20260728-011344 D6)
  # and simply stay where they are. Read the semantics below, not the order.
  enum: [RECEIVED, DELIVERED, FAILED, IGNORED, DUPLICATE]
  description: >
    Lifecycle of an adapted inbound business event (inbound_events row). The three terminal
    success states are NOT interchangeable — they are the answer to "what did this delivery actually
    do?", and collapsing them is what made a SIRENE sweep unable to distinguish "registered 200,000
    restaurants" from "did nothing 200,000 times" (ADR-20260728-011344 D6):
      * RECEIVED  — staged by the adapter ACL, not yet delivered.
      * DELIVERED — the aggregate decided a fact and it was appended (a creation OR an update; which
                    one landed is answerable from domain_events via `cause_id = inbound_event_id`,
                    a better source than a status column).
      * IGNORED   — the aggregate decided NOTHING changed, so no fact exists to append. A legitimate
                    event-sourcing outcome, not a failure: the external system reported a record we
                    already hold, identically.
      * DUPLICATE — the exact fact was ALREADY in the aggregate's stream (a redelivery tail). Distinct
                    from IGNORED: here we have seen this very fact before, there the fact is new but
                    semantically inert. Different causes, different fixes.
      * FAILED    — delivery error, left for retry/inspection.

# --- Process-manager state statuses (processmanager.yaml state tables) ---

PaymentProcessStatus:
  type: string
  enum:
    - AWAITING_PAYMENT_RESULT  # PaymentIntent created, cart locked; waiting for the Stripe outcome
    - ORDER_PLACED             # payment captured; Order materialized and cart closed — terminal (success)
    - FAILED                   # payment failed; cart stays OPEN — terminal (failure)
  description: "State of one PlaceOrderProcess checkout run (payment_process_manager row, keyed by cart)."

RefundProcessStatus:
  type: string
  enum:
    - PENDING_APPROVAL          # a refundable fact opened the request; waiting for a restaurant/admin decision
    - APPROVED_AWAITING_SETTLEMENT  # approved (restaurant or admin); Stripe refund requested, waiting for PaymentRefunded
    - DENIED                    # admin denied — terminal
    - REFUNDED                  # Stripe reported the settled refund — terminal (success)
  description: "State of one RefundProcess run (refund_process_manager row, keyed by order). Refunds are approved by the restaurant (own orders) or an admin."

DeliveryDispatchProcessStatus:
  type: string
  enum:
    - OFFERED           # DeliveryRequested delivered to the DeliveryJob; job offered to the current ranked channel (advancing the walk returns here)
    - ACCEPTED          # a partner/rider accepted the job
    - FAILED            # the ranked channel walk is exhausted: DeliveryDispatchFailed recorded — terminal (manual handling)
    - COMPLETED         # delivery done and order closed — terminal
    - SELF_DISPATCHED   # the restaurant self-dispatches (RestaurantDispatchMode RESTAURANT): no channel offered, Captain only tracks (#60)
  description: >
    State of one DeliveryDispatchProcess run (delivery_dispatch_process_manager row, keyed by order).
    FAILED now marks the ranked channel walk exhausted (fail closed, rules.yaml#/DispatchExhaustionFailsClosed —
    #60 supersedes the ADR-20260720-004556 numeric cap-3 framing). SELF_DISPATCHED was appended LAST to
    preserve the then-stored ordinals of the pre-#60 values (moot since ADR-20260728: enums persist as TEXT)."

RestaurantDispatchMode:
  type: string
  enum:
    - CAPTAIN           # Captain routes the delivery through the city's ranked channel list (default)
    - RESTAURANT        # the restaurant delivers itself (own couriers or its own partner deal); Captain tracks only, never offers a job
  description: "Who is responsible for fulfilling a restaurant's deliveries (restaurant-scoped config, resolved at runtime; #60). Default CAPTAIN keeps today's behaviour."

DeliveryChannelKey:
  type: string
  pattern: "^[a-z0-9]+(?:_[a-z0-9]+)*$"
  maxLength: 40
  description: "Slug key of a delivery channel in the DeliveryChannelCatalog (e.g. 'independent', 'avelo37', 'uber_direct', 'coopcycle'). Data-driven (a new partner = a catalog row + an adapter), so channels are NOT a fixed enum (#60)."

DeliveryChannelKind:
  type: string
  enum:
    - POOL              # the independent-rider pool (riders claim; no outbound adapter call)
    - PARTNER           # an outbound delivery partner reached through a DeliveryService adapter
  description: "Kind of a DeliveryChannelCatalog entry — POOL (independent riders) vs PARTNER (adapter-backed). Every PARTNER channel must have a wired services.yaml delivery implementation (#60)."

# --- Delivery partner self-registration (#61) ---
# A delivery partner declares its availability to serve a city on a known catalog channel through the
# EXTERNAL GraphQL API; an admin reviews it. The approved set is the substrate the city dispatch
# ranking (#60) consumes (dispatch wiring is a follow-up). Runtime write-path over domain_events.
DeliveryPartnerRegistrationId:
  type: string
  format: uuid
  description: "A delivery partner's self-registration of availability to serve one city on one catalog channel (#61). Client-generated; the aggregate id of the DeliveryPartnerRegistration."

DeliveryPartnerName:
  type: string
  maxLength: 200
  description: "The delivery partner's display/legal name as stated on self-registration (#61)."

CityAvailabilityStatus:
  type: string
  enum:
    - PENDING           # self-registered, awaiting admin review
    - APPROVED          # an admin approved it; eligible for the city's dispatch ranking (#60 consumption is a follow-up)
    - REVOKED           # withdrawn by the partner or disabled by an admin; not eligible
  description: "Review state of a delivery partner's declared availability to serve a city (#61): PENDING until an admin approves, APPROVED = live for dispatch consideration, REVOKED = withdrawn/disabled."

# Manual listing flag, set by the restaurant/admin. Useful for UI.
# Orthogonal to StockStatus: an item is orderable when AVAILABLE *and* stock > 0.
CatalogItemAvailability:
  type: string
  enum:
    - AVAILABLE
    - UNAVAILABLE

# Derived from Stock.quantity vs Stock.lowStockThreshold.
StockStatus:
  type: string
  enum:
    - IN_STOCK
    - LOW_STOCK      # quantity <= lowStockThreshold (risky level)
    - OUT_OF_STOCK   # quantity == 0

# --- Discovery / filtering ---

PriceRange:
  type: string
  enum: [BUDGET, MODERATE, PREMIUM]
  description: "Coarse price tier of a restaurant, used as a discovery filter (UI: $ / $$ / $$$)."

CuisineCategory:
  type: string
  enum: [FAST_FOOD, PIZZA, TRADITIONAL, BISTRONOMIC, FOOD_TRUCK]
  description: >
    A restaurant's SINGLE primary/representative cuisine bucket, used only to select ONE Uber Eats mark-up
    coefficient in View_UberEstimationPolicy (ADR-0024): FAST_FOOD 1.30, PIZZA 1.35, TRADITIONAL 1.40,
    BISTRONOMIC 1.45, FOOD_TRUCK 1.35. NOT for discovery — a restaurant may belong to several cuisines for
    browsing/filtering; that is the multi-valued `Restaurant.tags`. This is deliberately one value because
    the estimate needs a single coefficient.

# Whether an Uber Eats comparison figure is the restaurant's real HubRise price (ADR-0023, opt-in)
# or a labelled estimate derived from mark-up coefficients (ADR-0024). V0 shows ESTIMATED.
ComparisonBasis:
  type: string
  enum: [ESTIMATED, REAL]
  description: >
    Provenance of an Uber Eats comparison amount: REAL (the restaurant's own Uber prices, shared via
    HubRise after explicit opt-in — ADR-0023) or ESTIMATED (coefficient-based, always labelled — ADR-0024).

RestaurantListKey:
  type: string
  enum:
    - ORDER_AGAIN      # restaurants the customer has ordered from before
    - RECOMMENDED      # "Places you might like" / "Tailored to your taste"
    - TOP_DEALS        # "Most loved deals on Captain.Food"
    - GREEN_PACKAGING  # "Spots using Green Packaging"
  description: >
    Named, read-side-curated/personalized discovery shelf for the restaurants query. The read model
    resolves the actual member restaurants (editorial rules / customer history); the client just
    asks for a list by key.

# --- Test mode (ADR-0038) ---

Mode:
  type: string
  enum: [LIVE, TEST]
  description: >
    Whether an aggregate is production (LIVE) or a non-production TEST fixture coexisting in prod
    (ADR-0038, Stripe-`livemode`-style). Set at creation, immutable; absent = LIVE. TEST data is isolated
    from payouts, analytics and real notifications; a TEST order may target a LIVE restaurant to validate
    the real receipt path.

# --- Caller persona / user type ---

# Caller user type (a.k.a. persona / role). Established by the GraphQL path: the master
# api.yaml is filtered per user type via @auth / @public, and `domain_events.user_type`
# records which one authored an event. EXTERNAL = third-party ACL callers (Stripe, HubRise, Avelo37).
UserType:
  type: string
  enum:
    - PUBLIC             # anonymous visitor                       -> /public/graphql
    - CUSTOMER           # authenticated end user                  -> /customer/graphql
    - RESTAURANT_ACCOUNT # account: locations + catalog          -> /restaurant-account/graphql
    - RESTAURANT         # single location: order ops            -> /restaurant/graphql
    - RIDER              # delivery partner / courier              -> /rider/graphql   (mostly post-V0)
    - ADMIN              # platform operator                       -> /admin/graphql
    - EXTERNAL           # third-party ACL (Stripe/HubRise/Avelo37) -> /external/graphql

# --- Order conversations / messaging (#129) ---
# In-app per-order message thread (aggregate `Conversation`, id = orderId; ADR-20260725-015921).

ConversationMessageId:
  type: string
  format: uuid
  description: >
    Client-generated id of one posted conversation message — the idempotency key for PostMessage
    (a re-post with the same id is rejected). Distinct from the write-path envelope `MessageId`
    (the command_journal submission id); this identifies the business message itself (#129).

MessageVisibility:
  type: string
  enum: [PUBLIC, INTERNAL]
  description: >
    Audience of a conversation message: PUBLIC = visible to the customer in the order thread;
    INTERNAL = staff-only note (restaurant/rider/admin), never shown to the customer (#129).

ConversationAuthorRole:
  type: string
  enum: [CUSTOMER, RESTAURANT, RIDER, ADMIN]
  description: >
    Business role that authored a conversation message. A semantic role that changes the meaning of the
    thread (a customer message vs a staff note), so it is business payload — NOT envelope metadata (the
    acting user stays on domain_events.user_id) (#129).

MessageBody:
  type: string
  maxLength: 2000
  description: "Free-text body of a conversation message (#129)."

AttachmentRef:
  type: string
  maxLength: 500
  description: >
    Opaque reference to a framework-managed attachment on a conversation message. Storage, moderation
    and GDPR retention are handled generically by the framework, not by this aggregate (#129).

MuteReason:
  type: string
  maxLength: 500
  description: >
    The REQUIRED justification recorded when a participant is muted in an order conversation; a mute
    without one is rejected (rules.yaml#/MuteRequiresAReason) (#129).

EscalationReason:
  type: string
  maxLength: 500
  description: >
    Why an admin was pulled into an order conversation — the reason recorded when the restaurant or
    rider escalates the thread (rules.yaml#/AdminJoinsByReasonedEscalation) (#129).

TranslatedText:
  type: string
  maxLength: 2000
  description: >
    A conversation message body translated into one target locale — the cached (persisted) translation
    reused across readers (translate once, reuse; #129).

# --- Reclamations / customer claims (#151) ---
# Customer claim/dispute over a delivered order (aggregate `Reclamation`, id = reclamationId; #153).

ReclamationId:
  type: string
  format: uuid
  description: >
    Client-generated id of a customer reclamation (claim/dispute) — the idempotency key for
    OpenReclamation (a re-open with the same id is rejected). Multiple reclamations may exist per
    order, so the reclamation has its own identity, distinct from the orderId it is about (#151).

ReclamationCategory:
  type: string
  enum: [MISSING_ITEM, WRONG_ITEM, QUALITY, LATE_DELIVERY, DAMAGED, NOT_DELIVERED, OTHER]
  description: >
    What the customer is claiming about the order: an item was missing, the wrong item was delivered,
    a quality problem, a late delivery, damaged goods, nothing delivered at all, or another reason (#151).

ReclamationResolution:
  type: string
  enum: [FULL_REFUND, PARTIAL_REFUND, REPLACEMENT, GOODWILL_CREDIT, REJECTED]
  description: >
    The decision recorded when a reclamation is closed: a full or partial refund, a replacement order,
    a goodwill credit, or a rejection of the claim. The aggregate records the DECISION only; the refund
    money-move, credit ledger and replacement orders are downstream slices (#151).

ReclamationDescription:
  type: string
  maxLength: 1000
  description: "Free-text description of the problem the customer is claiming about the order (#151)."

ReclamationReason:
  type: string
  maxLength: 500
  description: >
    Free-text reason recorded when a reclamation is rejected or reopened — why the claim was declined,
    or why it is being reopened after a decision (#151).

ReclamationStatus:
  type: string
  enum: [OPEN, RESOLVED, REJECTED]
  description: >
    Lifecycle of a reclamation as the read model folds it from the domain facts (View_Reclamation):
    OPEN on ReclamationOpened (awaiting a decision), RESOLVED on ReclamationResolved, REJECTED on
    ReclamationRejected, and back to OPEN on ReclamationReopened. Mirrors the pure domain enum in
    `crates/domain/src/reclamation.rs`; this DSL scalar backs the view/api derived status (#154).

ClaimTimelineEventKind:
  type: string
  enum: [OPENED, RESOLVED, REJECTED, REOPENED, EVIDENCE_ATTACHED]
  description: >
    Which reclamation lifecycle fact a ClaimTimelineEntry records as it is woven into the per-order
    conversation thread: OPENED (ReclamationOpened), RESOLVED (ReclamationResolved), REJECTED
    (ReclamationRejected), REOPENED (ReclamationReopened) or EVIDENCE_ATTACHED (ReclamationEvidenceAttached
    — the customer attached an evidence photo to the claim, #156). Lets the order thread show a claim's
    status and evidence inline without copying the reclamation's own read model (§2.5, #155).

# =====================================================================
# CONFIGURATION scalars (PROP-20260729-004500, issue #246)
#
# Every configuration key is typed by one of these, and the generated reader VALIDATES the supplied
# value against the scalar's `pattern` at startup. A key that is present but malformed is reported
# exactly like a missing one — in production the app logs it and stops.
#
# Why this and not just `type: string`: "present" is not "usable". A live Stripe key pasted into the
# test slot, a webhook secret with a trailing newline from a dashboard copy-paste, an AUTH_SESSION_KEY
# that is 31 bytes — each boots happily today and fails later, at the worst moment, in a way that looks
# like a code bug. The pattern moves that discovery to startup, where it is unmissable and free.
#
# A secret's VALUE is never printed when it fails: the report names the key and the EXPECTED shape only.
# =====================================================================

ConfigBoolean:
  type: string
  pattern: "^(?i)(true|yes|1|on|false|no|0|off)$"
  description: >
    A boolean configuration value. Accepts true/yes/1/on and false/no/0/off, CASE-INSENSITIVE, with
    surrounding whitespace and wrapping quotes trimmed before matching (ADR-20260728-224500).
    Deliberately generous, because the failure it prevents was real: `RUN_SIRENE_WORKER=TRUE` silently
    meant PAUSED under an exact `== "true"` gate, and 6,649 rows sat unprocessed for four hours.
    Anything NOT in this set is a misconfiguration, not a false — it is reported, never guessed.

StripeSecretKey:
  type: string
  pattern: "^sk_(test|live)_[A-Za-z0-9]+$"
  description: >
    A Stripe secret API key, either mode. The app is mode-agnostic by design: the deployed value decides,
    and its `sk_test_` / `sk_live_` prefix is what the boot report renders as the MODE (never the key).
    Accepting both is deliberate for now — V0 runs TEST keys on production pre-launch. At go-live,
    swapping this key's scalar to StripeSecretKeyLive makes "production must be live mode" a startup
    guarantee instead of a thing someone remembers to check.

StripeSecretKeyTest:
  type: string
  pattern: "^sk_test_[A-Za-z0-9]+$"
  description: >
    A Stripe TEST-mode secret key. Typing the test slot separately is what stops a LIVE key being pasted
    into it — which would move real money from a job whose entire premise is that it cannot
    (`prod-smoke.sh` already refuses to confirm a payment unless the key is `sk_test_`; this makes the
    same rule declarative and checked at startup rather than only in one script).

StripeSecretKeyLive:
  type: string
  pattern: "^sk_live_[A-Za-z0-9]+$"
  description: >
    A Stripe LIVE-mode secret key. The counterpart slot: it rejects a test key, so a go-live that
    silently kept test credentials cannot boot as if it were taking real payments.

StripeWebhookSecret:
  type: string
  pattern: "^whsec_[A-Za-z0-9_-]+$"
  description: >
    A Stripe webhook signing secret. Stripe issues a DIFFERENT one per mode, so it must be switched
    together with the secret key; a mismatched pair verifies nothing and the endpoint fails closed —
    the customer is charged and the restaurant is never told.

AuthSessionKey:
  type: string
  pattern: "^([0-9a-fA-F]{64}|[A-Za-z0-9+/]{43}=)$"
  description: >
    The AES-256-GCM key encrypting parked auth sessions: exactly 32 bytes, as 64 hex chars or standard
    base64. A key of the wrong length currently makes the store fall back to the no-op, so login
    SILENTLY degrades to anonymous-only — the pattern turns that into a startup failure.

PostgresUrl:
  type: string
  pattern: "^postgres(ql)?://"
  description: >
    A PostgreSQL connection string. On Supabase this must be the SESSION POOLER host (IPv4); the direct
    `db.<ref>.supabase.co` host is IPv6-only and unreachable from Render — a distinction the URL shape
    cannot express, so it stays documented in the key's `gates`.

HttpsUrl:
  type: string
  pattern: "^https?://"
  description: >
    An absolute HTTP(S) endpoint. Catches the common paste error of a bare host, which fails later as an
    opaque request error rather than at startup.

DepartmentList:
  type: string
  pattern: "^([0-9]{2,3}|2[AB])(,([0-9]{2,3}|2[AB]))*$"
  description: >
    A comma-separated INSEE department list for a scoped SIRENE sweep (e.g. `37`, `37,41`). Allows the
    Corsican `2A`/`2B` codes, which a naive numeric check would reject.

HoneycombIngestKey:
  type: string
  pattern: "^[A-Za-z0-9_]{20,120}$"
  description: >
    A Honeycomb INGEST key — the credential the OTLP exporter sends as `x-honeycomb-team` (ADR-20260729
    telemetry backend, issue #191).

    Deliberately PERMISSIVE on charset and length, and that is a considered choice rather than laziness.
    Honeycomb has shipped several ingest-key formats (32-char hex "classic" keys, and the newer
    `hc?ik_`-prefixed keys), and this value gates STARTUP: on production a pattern that is stricter than
    reality turns a perfectly good key into `exit 78` and a failed deploy. An over-tight regex here would
    manufacture exactly the outage this file exists to prevent, so the rule encodes only what is
    genuinely invariant across formats.

    What it does still catch is the mistake people actually make: a **management** key
    (`<Key ID>:<Secret Key>`, used by the Honeycomb MCP server and the Query API) pasted into the ingest
    slot. Management keys contain a colon, ingest keys never do — so the colon exclusion is the load-
    bearing part of this pattern, in the same spirit as rejecting a `pk_` publishable key in a
    `StripeSecretKey` slot. It also rejects the empty, whitespace-padded and obviously-truncated value.

TraceSampleRatio:
  type: string
  pattern: "^(0(\\.[0-9]+)?|1(\\.0+)?)$"
  description: >
    The head-sampling probability for traces, as a decimal in [0, 1] — `1.0` keeps every trace, `0.1`
    keeps a tenth. Rejects the two plausible mistakes that would otherwise be discovered as missing data
    weeks later: a percentage (`50`, `50%`) silently read as "way out of range", and a ratio above 1.

LogLevel:
  type: string
  pattern: "^(?i)(trace|debug|info|warn|error)$"
  description: >
    The minimum severity emitted by the structured-logging layer, case-insensitive. A closed set rather
    than a free-form `RUST_LOG` filter, because the failure mode of a typo'd directive is silence — the
    logs simply stop, which reads as a healthy quiet system.
