version: 1
description: >
  payments scope — processmanager fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `processmanager.yaml` catalog; $refs stay kind-logical
  (`processmanager.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


PaymentSettlementProcess:
  type: process-manager
  description: >
    Drives an AUTHORIZED payment to its settlement (ADR-20260808-195315 §1.2/§1.3, the
    authorize-then-capture posture): CAPTURE on fulfilment — OrderDelivered is the handover fact for
    BOTH service types (DELIVERY hands over at the door, COLLECTION at the counter; the Order
    lifecycle has one READY→DELIVERED transition) — and RELEASE (Stripe void of the uncaptured
    intent) on rejection/cancellation: "no need to refund because no capture". The recorded third
    arm — at-table service captures IN ADVANCE at checkout — is not built (no such service type
    yet); when the acceptance-timeout auto-cancel lands (§1.3) its cancellation fact rides the same
    release arms. Stateless (no state table): idempotency is the OrderTracking payment_status guard
    plus the adapter's deterministic Stripe idempotency keys (capture:{intentId} / release:{intentId},
    ADR-20260801-023000) — a redelivered trigger lands on the SAME gateway object. Settlement always
    arrives asynchronously as the inbound facts the Payment aggregate records (PaymentCaptured /
    PaymentReleased), never as these calls' return values. The capture-failure branch — a
    deterministic decline or an unreachable gateway maps the call's outcome to a recorded
    PaymentCaptureFailed with a typed reason + the paging counter — is carried in the hand-written
    wrapper seam (crate::process_managers::payment_settlement), the same seam pattern as
    ReclamationProcess: "on call error, deliver X" is not expressible in the step DSL. The release
    arms need no failure fact: a failed void self-heals — the hold expires on its own within ~7 days
    — so the outcome is a counter (payment_release_failed_total), not a page. Post-capture
    rejection/cancellation stays RefundProcess's job (its payment_status = CAPTURED guards): the two
    sagas partition the same triggers by payment state, capture-side here, refund-side there.
  ports:
    payment: { $ref: 'services.yaml#/payment' }
  receives:
    - message: { $ref: 'events.yaml#/OrderDelivered' }
      description: >
        The order was handed to the customer (delivered / picked up) — capture the authorized
        payment. The capture keys on the PRESENCE OF A CAPTAIN AUTHORIZATION, never on the
        delivery fact alone (rules.yaml#/PaymentCapturedOnFulfilment): the read skips orders with
        no payment_intent_id and the guard skips payments not AUTHORIZED — so a $0 replacement
        today, and a post-V0 EXTERNAL order (Uber Eats ingest: already paid on the partner's
        rails, no Captain PaymentIntent — ADR-20260813-233418 AR-2), can never trip a phantom
        capture; the concrete ExternalOrderReceived regression test lands with that slice. The
        wrapper seam records PaymentCaptureFailed (+ pages) when the capture call fails; the
        settled fact arrives as inbound PaymentCaptured.
      emits:
        # Wrapper-seam failure branch: the capture call's deterministic decline / transport failure
        # is recorded on the Payment with a typed reason (not step-derived — declared here so
        # behaviour-test coverage sees it).
        - { $ref: 'events.yaml#/PaymentCaptureFailed' }
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderDelivered/properties/orderId' } } }
            note: "The fulfilled order, with its folded payment state. SELECTed from the `ordertracking` projection (payment_settlement.rs load_order -> OrderReadRepository::by_id), like all four legs of this saga -- the projected row is where `payment_status` and `payment_intent_id` are folded together, which is the pair the capture/release decision needs."
        - guard:
            that: { order: { payment_status: { const: AUTHORIZED } } }
            skip: true
            note: "Nothing authorized → nothing to capture: $0 replacements never charge; released/refunded runs have nothing held; an already-captured payment is a benign redelivery."
        - call:
            port: payment
            operation: capture
            note: "Capture the FULL authorized amount (partial capture / tips-at-delivery is the recorded open tips discussion, ADR-20260808-195315 §1.4); PaymentCaptured settles asynchronously."
    - message: { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      description: "The restaurant rejected the order before capture — release the hold (Stripe void); the settled fact arrives as inbound PaymentReleased. The acceptance-timeout auto-cancel (§1.3, unbuilt) rides this same arm."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: AUTHORIZED } } }
            skip: true
            note: "Nothing held → nothing to release (post-capture rejection is RefundProcess's CAPTURED arm)."
        - call:
            port: payment
            operation: release
            note: "Void the uncaptured intent — no refund machinery, the customer was never charged."
    - message: { $ref: 'events.yaml#/OrderCancelledByCustomer' }
      description: "The customer cancelled before capture — release the hold."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: AUTHORIZED } } }
            skip: true
            note: "Nothing held → nothing to release (post-capture cancellation is RefundProcess's CAPTURED arm)."
        - call:
            port: payment
            operation: release
    - message: { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      description: "The restaurant cancelled after acceptance but before capture — release the hold."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: AUTHORIZED } } }
            skip: true
            note: "Nothing held → nothing to release (post-capture cancellation is RefundProcess's CAPTURED arm)."
        - call:
            port: payment
            operation: release


RefundProcess:
  type: process-manager
  description: >
    Approved refunds. A refundable fact (rejection, cancellation, customer request) OPENS a
    pending refund: RefundOpened is delivered to the Payment aggregate (so the refund queue,
    View_PendingRefunds, folds from the log) and the state row goes PENDING_APPROVAL; the RESTAURANT
    (its own orders) or an ADMIN decides with ApproveRefund / DenyRefund (authz = api.yaml roles); on
    approval the outbound Stripe refund is requested and the run settles when Stripe reports
    PaymentRefunded (the fact itself is recorded by the Payment aggregate). The refund-eligibility
    window is a config value enforced at approval, not a domain rule.
  state_table: { $ref: 'database/tables/process_managers.yaml#/refund_process_manager' }
  ports:
    payment: { $ref: 'services.yaml#/payment' }
  receives:
    - message: { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      description: "The restaurant rejected a paid order — open a pending refund for a restaurant/admin decision."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/orderId' } } }
            note: "SELECTed from the `ordertracking` projection (refund.rs load_order -> OrderReadRepository::by_id), like all four opening legs of this saga -- the captured total and the payment intent the RefundOpened fact carries come from the projected row."
        - guard:
            that: { order: { payment_status: { const: CAPTURED } } }
            skip: true
            note: "Nothing captured → nothing to refund."
        - deliver:
            event: { $ref: 'events.yaml#/RefundOpened' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_read: order.payment_intent_id }
              orderId: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/orderId' } }
              restaurantId: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/restaurantId' } }
              amount: { from_read: order.total_amount_cents }
              reason: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/reason' } }
            note: "The refund queue fact (View_PendingRefunds); the Payment records it idempotently."
        - state:
            set:
              order_id: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/orderId' } }
              payment_intent_id: { from_read: order.payment_intent_id }
              process_status: { const: PENDING_APPROVAL }
              reason: { from: { $ref: 'events.yaml#/OrderRejectedByRestaurant/properties/reason' } }
    - message: { $ref: 'events.yaml#/OrderCancelledByCustomer' }
      description: "The customer cancelled a paid order — open a pending refund for a restaurant/admin decision."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: CAPTURED } } }
            skip: true
            note: "Nothing captured → nothing to refund."
        - deliver:
            event: { $ref: 'events.yaml#/RefundOpened' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_read: order.payment_intent_id }
              orderId: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/orderId' } }
              restaurantId: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/restaurantId' } }
              amount: { from_read: order.total_amount_cents }
              reason: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/reason' } }
            note: "The refund queue fact (View_PendingRefunds); the Payment records it idempotently."
        - state:
            set:
              order_id: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/orderId' } }
              payment_intent_id: { from_read: order.payment_intent_id }
              process_status: { const: PENDING_APPROVAL }
              reason: { from: { $ref: 'events.yaml#/OrderCancelledByCustomer/properties/reason' } }
    - message: { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      description: "The restaurant cancelled a paid order — open a pending refund for a restaurant/admin decision."
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: CAPTURED } } }
            skip: true
            note: "Nothing captured → nothing to refund."
        - deliver:
            event: { $ref: 'events.yaml#/RefundOpened' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_read: order.payment_intent_id }
              orderId: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/orderId' } }
              restaurantId: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/restaurantId' } }
              amount: { from_read: order.total_amount_cents }
              reason: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/reason' } }
            note: "The refund queue fact (View_PendingRefunds); the Payment records it idempotently."
        - state:
            set:
              order_id: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/orderId' } }
              payment_intent_id: { from_read: order.payment_intent_id }
              process_status: { const: PENDING_APPROVAL }
              reason: { from: { $ref: 'events.yaml#/OrderCancelledByRestaurant/properties/reason' } }
    - message: { $ref: 'events.yaml#/RefundRequested' }
      description: >
        The customer asked for a refund (the Order aggregate already validated RequestRefund) — open a
        pending refund for a restaurant/admin decision.
      steps:
        - read:
            model: { $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }
            source: PROJECTION
            as: order
            where: { order_id: { from: { $ref: 'events.yaml#/RefundRequested/properties/orderId' } } }
        - guard:
            that: { order: { payment_status: { const: CAPTURED } } }
            skip: true
            note: "Nothing captured → nothing to refund."
        - deliver:
            event: { $ref: 'events.yaml#/RefundOpened' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_read: order.payment_intent_id }
              orderId: { from: { $ref: 'events.yaml#/RefundRequested/properties/orderId' } }
              restaurantId: { from: { $ref: 'events.yaml#/RefundRequested/properties/restaurantId' } }
              amount: { from_read: order.total_amount_cents }
              reason: { from: { $ref: 'events.yaml#/RefundRequested/properties/reason' } }
            note: "The refund queue fact (View_PendingRefunds); the Payment records it idempotently."
        - state:
            set:
              order_id: { from: { $ref: 'events.yaml#/RefundRequested/properties/orderId' } }
              payment_intent_id: { from_read: order.payment_intent_id }
              process_status: { const: PENDING_APPROVAL }
              reason: { from: { $ref: 'events.yaml#/RefundRequested/properties/reason' } }

    - message: { $ref: 'commands.yaml#/ApproveRefund' }
      description: >
        The restaurant or an admin approves the pending refund (possibly partial): request the Stripe
        refund and record the decision on the Payment.
      steps:
        - state:
            by: { order_id: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/orderId' } } }
        - guard:
            that: { state: { process_status: { const: PENDING_APPROVAL } } }
            throws: { $ref: 'errors.yaml#/RefundNotPending' }
            note: "Also thrown when no run exists for the order."
        - call:
            port: payment
            operation: refund
            note: "Outbound Stripe refund for the approved amount; PaymentRefunded will settle the run."
        - deliver:
            event: { $ref: 'events.yaml#/RefundApproved' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_state: payment_intent_id }
              orderId: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/orderId' } }
              amount: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/amount' } }
              reason: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/reason' } }
        - state:
            set:
              process_status: { const: APPROVED_AWAITING_SETTLEMENT }
              approved_amount_cents: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/amount' } }
              reason: { from: { $ref: 'commands.yaml#/ApproveRefund/properties/reason' } }

    - message: { $ref: 'commands.yaml#/DenyRefund' }
      description: "The restaurant or an admin denies the pending refund: record the decision on the Payment and close the run."
      steps:
        - state:
            by: { order_id: { from: { $ref: 'commands.yaml#/DenyRefund/properties/orderId' } } }
        - guard:
            that: { state: { process_status: { const: PENDING_APPROVAL } } }
            throws: { $ref: 'errors.yaml#/RefundNotPending' }
        - deliver:
            event: { $ref: 'events.yaml#/RefundDenied' }
            to: { $ref: 'actors.yaml#/Payment' }
            with:
              paymentIntentId: { from_state: payment_intent_id }
              orderId: { from: { $ref: 'commands.yaml#/DenyRefund/properties/orderId' } }
              reason: { from: { $ref: 'commands.yaml#/DenyRefund/properties/reason' } }
        - state:
            set:
              process_status: { const: DENIED }
              reason: { from: { $ref: 'commands.yaml#/DenyRefund/properties/reason' } }

    - message: { $ref: 'events.yaml#/PaymentRefunded' }
      description: >
        Stripe reported the settled refund (recorded by the Payment aggregate) — close the run. The
        fact is already in the log; nothing to emit.
      steps:
        - state:
            by: { order_id: { from: { $ref: 'events.yaml#/PaymentRefunded/properties/orderId' } } }
            expect: { process_status: { const: APPROVED_AWAITING_SETTLEMENT } }
            note: "Unknown or already-settled run → skip (idempotent under Stripe re-delivery)."
        - state:
            set:
              refund_id: { from: { $ref: 'events.yaml#/PaymentRefunded/properties/refundId' } }
              process_status: { const: REFUNDED }
