version: 1
description: >
  payments scope — actors fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `actors.yaml` catalog; $refs stay kind-logical
  (`actors.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


Payment:
  type: aggregate
  identity: { $ref: '#/Payment/state/paymentIntentId' }   # the stream is Payment-{paymentIntentId} (crates/domain/src/payment.rs)
  mailbox:
    partitions: 5            # keyspace WIDTH (workers lease ranges of it) — PROP-20260728-152752 §2
  # Declared write-side state (PROP-20260728-135632 §2.1 grammar; #582 PROP-20260815-142349 §19) —
  # transcribed from the hand-written fold `crates/domain/src/payment.rs::PaymentState`. `status`
  # is deliberately ABSENT (the `lifecycle:` block owns it; `#/Payment/state/status` resolves
  # implicitly). `orderId`'s lineage is NESTED — the true source is the frozen checkout snapshot
  # (`checkout.orderId`), resolved through the entity ref end-to-end. Three hand-fold fields are
  # NOT yet declarable and wait on the states slice 2 grammar (#242): `amount` (entity-typed
  # Money), `refundDecision` (no domain scalar yet), `refundId` (nullable non-birth assignment).
  # DECLARATION-ONLY this slice: lifecycle actor ⇒ states.rs generation deferred; YAML↔fold
  # parity is enforced by the reply-construction tests in payment.rs, compiler-checked.
  state:
    paymentIntentId:
      type: { $ref: 'scalars.yaml#/PaymentIntentId' }
      from: [{ $ref: 'events.yaml#/PaymentIntentCreated/properties/paymentIntentId' }]
      note: "The Stripe PaymentIntent id — the stream key."
    orderId:
      type: { $ref: 'scalars.yaml#/OrderId' }
      from: [{ $ref: 'events.yaml#/PaymentIntentCreated/properties/checkout/orderId' }]
      note: "The order this payment settles, frozen in the checkout snapshot at intent creation (nested lineage through entities.yaml#/CheckoutSnapshot)."
    restaurantId:
      type: { $ref: 'scalars.yaml#/RestaurantId' }
      from: [{ $ref: 'events.yaml#/PaymentIntentCreated/properties/restaurantId' }]
    captureFailed:
      type: boolean
      mode: flag
      from: [{ $ref: 'events.yaml#/PaymentCaptureFailed' }]
      note: "A capture failure was recorded WITHOUT moving the status (funds still held — retry or expiry decides)."
    refundOpened:
      type: boolean
      mode: flag
      from: [{ $ref: 'events.yaml#/RefundOpened' }]
      note: "RefundProcess opened a refund for decision (View_PendingRefunds folds the queue)."
  # The queries this actor answers on Ask (PROP-20260815-142349 §2, Approved; doctrine header:
  # specs/common/actors.yaml). No `params:` — the ask is addressed BY IDENTITY: the
  # Payment-{intentId} stream key IS the argument, and repeating it in the payload would be the
  # redundant info the founder forbade (§3). No transport key (absence means local, D6); the
  # deadline is the CALLER's (D5).
  answers:
    settlementView:
      description: "The settlement guard's facts: is this payment capturable/refundable right now — lifecycle status, the order it settles, and whether a capture already failed."
      reply:
        orderId: { $ref: '#/Payment/state/orderId' }
        status: { $ref: '#/Payment/state/status' }            # the implicit lifecycle-status field (PaymentStatus)
        captureFailed: { $ref: '#/Payment/state/captureFailed' }
  description: "A payment for an order, driven to a terminal state. Born from PaymentIntentCreated (emitted by PlaceOrderProcess), authorized at checkout confirmation, captured on fulfilment (ADR-20260808-195315 §1.2) or released on abort."
  # The refund decision facts (RefundOpened/Approved/Denied) do not move the payment status —
  # only the settled Stripe fact (PaymentRefunded) does. PaymentCaptureFailed does not move it
  # either: the money is still only HELD, so the payment stays AUTHORIZED until a retried capture
  # settles (PaymentCaptured) or the hold dies (PaymentReleased).
  lifecycle:
    status: { $ref: 'scalars.yaml#/PaymentStatus' }
    initial:
      - event: { $ref: 'events.yaml#/PaymentIntentCreated' }
        to: PENDING
    transitions:
      - { from: [PENDING], event: { $ref: 'events.yaml#/PaymentAuthorized' }, to: AUTHORIZED }
      # PENDING → CAPTURED stays legal: the recorded third arm (at-table service pays in advance,
      # ADR-20260808-195315 §1.2 — not built yet) captures at checkout, and a webhook race that
      # delivers the capture before the authorization must still record the fact that happened.
      - { from: [PENDING, AUTHORIZED], event: { $ref: 'events.yaml#/PaymentCaptured' }, to: CAPTURED }
      - { from: [PENDING], event: { $ref: 'events.yaml#/PaymentFailed' }, to: FAILED }
      - { from: [AUTHORIZED], event: { $ref: 'events.yaml#/PaymentReleased' }, to: RELEASED }
      - { from: [CAPTURED], event: { $ref: 'events.yaml#/PaymentRefunded' }, to: REFUNDED }
    terminal: [FAILED, REFUNDED, RELEASED]
  receives:
    - message:
        $ref: 'events.yaml#/PaymentIntentCreated'
      emits: [{ $ref: 'events.yaml#/PaymentIntentCreated' }]
    - message: { $ref: 'events.yaml#/PaymentAuthorized' }
      emits: [{ $ref: 'events.yaml#/PaymentAuthorized' }]
      effect: "Inbound Stripe fact (payment_intent.amount_capturable_updated): the hold is confirmed; PlaceOrderProcess materializes the Order on the chained copy."
    - message: { $ref: 'events.yaml#/PaymentCaptured' }
      emits: [{ $ref: 'events.yaml#/PaymentCaptured' }]
      effect: "Inbound Stripe fact (payment_intent.succeeded): the money moved — the settlement of the capture PaymentSettlementProcess requested on fulfilment."
    - message: { $ref: 'events.yaml#/PaymentCaptureFailed' }
      emits: [{ $ref: 'events.yaml#/PaymentCaptureFailed' }]
      effect: "PaymentSettlementProcess delivers the capture failure (typed reason); the Payment records it WITHOUT moving the status (still AUTHORIZED — retry or expiry decides). Alertable: an operator must act."
    - message: { $ref: 'events.yaml#/PaymentReleased' }
      emits: [{ $ref: 'events.yaml#/PaymentReleased' }]
      effect: "Inbound Stripe fact (payment_intent.canceled): the uncaptured hold is gone — the settlement of the void requested on rejection/cancellation (or the hold's own expiry)."
    - message: { $ref: 'events.yaml#/PaymentFailed' }
      emits: [{ $ref: 'events.yaml#/PaymentFailed' }]
    - message:
        $ref: 'events.yaml#/PaymentRefunded'
      emits: [{ $ref: 'events.yaml#/PaymentRefunded' }]
    - message: { $ref: 'events.yaml#/RefundOpened' }
      emits: [{ $ref: 'events.yaml#/RefundOpened' }]
      effect: "RefundProcess opened a refund on this captured payment for a restaurant/admin decision; the Payment records it (idempotent) so View_PendingRefunds folds the queue from the log."
    - message: { $ref: 'events.yaml#/RefundApproved' }
      emits: [{ $ref: 'events.yaml#/RefundApproved' }]
      effect: "RefundProcess delivers the approval decision (restaurant or admin); the Payment records it (idempotent)."
    - message: { $ref: 'events.yaml#/RefundDenied' }
      emits: [{ $ref: 'events.yaml#/RefundDenied' }]
      effect: "RefundProcess delivers the denial decision (restaurant or admin); the Payment records it (idempotent)."


CustomerCredit:
  type: aggregate
  identity: { $ref: '#/CustomerCredit/state/customerId' }   # one credit ledger per customer (stream CustomerCredit-{customerId})
  mailbox:
    partitions: 5            # keyspace WIDTH (workers lease ranges of it) — PROP-20260728-152752 §2
  description: >
    A per-customer store-credit ledger; id = customerId (the aggregate identity IS the customer, like a
    Prospect is keyed by its RestaurantId). Credits (goodwill, from a resolved claim) and debits (spent at
    checkout) are recorded as facts on the customer's ledger stream; the AVAILABLE BALANCE is a fold over
    them (granted − consumed, never negative). No status lifecycle — a ledger has a balance, not a state.
    GrantCustomerCredit is idempotent per reclamationId (at most one grant per resolved claim), so a
    re-delivered ReclamationResolved from the ReclamationProcess saga never double-grants
    (ADR-20260726-163737, #158). Both commands are saga-/checkout-driven (no public GraphQL mutation).
  receives:
    - message: { $ref: 'commands.yaml#/GrantCustomerCredit' }
      emits: [{ $ref: 'events.yaml#/CustomerCreditGranted' }]
    - message: { $ref: 'commands.yaml#/ConsumeCustomerCredit' }
      emits: [{ $ref: 'events.yaml#/CustomerCreditConsumed' }]
      throws:
        - { $ref: 'errors.yaml#/InsufficientCustomerCredit' }


RefundProcess:
  type: process-manager
  identity: { $ref: '#/RefundProcess/state/orderId' }
  mailbox:
    partitions: 5            # keyspace WIDTH (workers lease ranges of it) -- PROP-20260728-152752 s2
  description: >
    The refund saga: records the staff decision on an OPEN refund (RefundOpened is emitted by the
    order-lifecycle commands -- RejectOrder, CancelOrder -- not by this saga's receives), drives
    the Stripe refund on approval, and closes idempotently when Stripe reports the PaymentRefunded
    fact. Approval and denial are restaurant/admin decisions on a pending refund; anything else is
    RefundNotPending.
  receives:
    - message: { $ref: 'commands.yaml#/ApproveRefund' }
      emits: [{ $ref: 'events.yaml#/RefundApproved' }]
      throws:
        - { $ref: 'errors.yaml#/RefundNotPending' }
    - message: { $ref: 'commands.yaml#/DenyRefund' }
      emits: [{ $ref: 'events.yaml#/RefundDenied' }]
      throws:
        - { $ref: 'errors.yaml#/RefundNotPending' }
    - message: { $ref: 'events.yaml#/PaymentRefunded' }
      emits: []
      effect: "Inbound Stripe fact: close the refund saga idempotently."
