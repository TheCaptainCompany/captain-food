  # ----------------------- RefundProcess (restaurant/admin decision) -
  TestRefundApprovedByAdmin:
    name: "The restaurant or an admin approves the pending refund: Stripe refund requested, decision recorded on the Payment"
    rules: [{ $ref: 'rules.yaml#/RefundRequiresApproval' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
