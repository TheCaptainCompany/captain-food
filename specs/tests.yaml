  # ----------------------- DeliveryJob (aggregate) -------------------
  TestDeliveryJobBornOnDeliveryRequested:
    name: "The DeliveryJob is born by recording the DeliveryRequested fact delivered by DeliveryDispatchProcess (idempotent)"
    rules: [{ $ref: 'rules.yaml#/ReadyDeliveryOrderTriggersDispatch' }]
    actor: { $ref: 'actors.yaml#/DeliveryJob' }
    given: []
    when:
      type: { $ref: 'events.yaml#/DeliveryRequested' }
      data:
        deliveryJobId: "deliv-1"
        orderId: "order-1"
        restaurantId: "resto-1"
        pickup: { line1: "1 Rue Nationale", postalCode: "37000", city: "Tours", country: "FR" }
