      data: { cartId: "cart-1", orderId: "order-1" }
    then:
      - { $ref: '#/fixtures/cartCheckedOut' }

  # ----------------------- Order (birth) -----------------------------
  TestOrderPlacedBirthRecorded:
    name: "The Order is born by recording the OrderPlaced fact delivered by PlaceOrderProcess (idempotent)"
    rules: [{ $ref: 'rules.yaml#/OrderMaterializedOnPaymentAuthorization' }]
    actor: { $ref: 'actors.yaml#/Order' }
    given: []
    when:
      type: { $ref: 'events.yaml#/OrderPlaced' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "DELIVERY"
        deliveryAddress: { line1: "9 Rue Colbert", postalCode: "37000", city: "Tours", country: "FR" }
        items:
          - { offerId: "off-1", productId: "prod-1", name: "Margherita", offerName: "Default", quantity: 2, unitPrice: { amountCents: 980, currency: "EUR" }, lineTotal: { amountCents: 1960, currency: "EUR" } }
        totalAmount: { amountCents: 1960, currency: "EUR" }
        breakdown:
          articles: { amountCents: 1960, currency: "EUR" }
          delivery: { amountCents: 0, currency: "EUR" }
          serviceFee: { amountCents: 0, currency: "EUR" }
          total: { amountCents: 1960, currency: "EUR" }
          restaurantContribution: { amountCents: 0, currency: "EUR" }
          restaurantPayout: { amountCents: 1960, currency: "EUR" }
          riderPayout: { amountCents: 0, currency: "EUR" }
          captainNet: { amountCents: 0, currency: "EUR" }
        paymentIntentId: "pi_123"
    then:
      - { $ref: '#/fixtures/orderPlaced' }

  # ----------------------- Payment (aggregate — records the payment facts) ---
  TestPaymentIntentCreatedRecorded:
    name: "The Payment is born by recording PaymentIntentCreated with the frozen checkout snapshot"
    rules: [{ $ref: 'rules.yaml#/CheckoutSnapshotFrozenAtIntent' }]
    actor: { $ref: 'actors.yaml#/Payment' }
    given: []
    when:
      type: { $ref: 'events.yaml#/PaymentIntentCreated' }
      data:
        paymentIntentId: "pi_123"
        restaurantId: "resto-1"
        customerId: "cust-1"
        amount: { amountCents: 1960, currency: "EUR" }
        checkout:
          orderId: "order-1"
          cartId: "cart-1"
          restaurantId: "resto-1"
          customerId: "cust-1"
          customerContact: { displayName: "Johnny", phone: "+33612345678" }
          serviceType: "DELIVERY"
          deliveryAddress: { line1: "9 Rue Colbert", postalCode: "37000", city: "Tours", country: "FR" }
          items:
            - { offerId: "off-1", productId: "prod-1", name: "Margherita", offerName: "Default", quantity: 2, unitPrice: { amountCents: 980, currency: "EUR" }, lineTotal: { amountCents: 1960, currency: "EUR" } }
          totalAmount: { amountCents: 1960, currency: "EUR" }
          breakdown:
            articles: { amountCents: 1960, currency: "EUR" }
            delivery: { amountCents: 0, currency: "EUR" }
            serviceFee: { amountCents: 0, currency: "EUR" }
            total: { amountCents: 1960, currency: "EUR" }
            restaurantContribution: { amountCents: 0, currency: "EUR" }
            restaurantPayout: { amountCents: 1960, currency: "EUR" }
            riderPayout: { amountCents: 0, currency: "EUR" }
            captainNet: { amountCents: 0, currency: "EUR" }
          # RSO-1 evidence, matching the shared `paymentIntentCreated` fixture the `then` asserts:
          # the Payment records this fact VERBATIM, so a `when` payload missing the evidence keys
          # asserts a snapshot the fixture no longer describes (the RSO-1 Phase 3 red).
          verdict: "HOURS_UNDECLARED"
          timezone: "Europe/Paris"
          evaluatedAt: "2026-01-06T12:00:00Z"
    then:
      - { $ref: '#/fixtures/paymentIntentCreated' }

  TestPaymentAuthorizedRecorded:
    name: "The Payment records the inbound Stripe authorization fact (funds held; delivered via the ACL, idempotent)"
