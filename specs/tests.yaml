        expectedTotal: { amountCents: 1960, currency: "EUR" }
        paymentMethodId: "pm_123"
    then:
      - { $ref: '#/fixtures/paymentIntentCreatedCollection' }

  TestPlaceOrderRejectsPriceMismatch:
    name: "A client confirmation total that diverges from the server-recomputed total rejects the checkout (server is the price authority; the displayed total the consumer agreed to is the only total that can be charged — L112-1/L221-5 posture)"
    rules: [{ $ref: 'rules.yaml#/ServerPriceAuthority' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        expectedTotal: { amountCents: 100, currency: "EUR" }
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/PriceMismatch' }

  TestPlaceOrderRejectsUnresolvablePrice:
    name: "A cart line whose price cannot be resolved from the live catalog rejects the checkout fail-closed (never the client's number)"
    rules: [{ $ref: 'rules.yaml#/ServerPriceAuthority' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      # No catalog facts: the cart's offer resolves to no live price.
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAddedUnknownOffer' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/PriceUnresolvable' }

  # --- Checkout orderability re-check (oversell at peak) --------------------------------------
  # The three cases below are one property in three directions: orderability is DERIVED AT
  # CHECKOUT from the live catalog, never inherited from the moment the line was added. The two
  # rejections are the oversell hole; the acceptance is the false-positive floor that keeps the
  # guard from breaking every restaurant that does not track stock.
  TestPlaceOrderRejectsOfferUnavailableSinceTheLineWasAdded:
    name: "An offer 86'd AFTER the cart line was added rejects the checkout: it still prices (it never left the catalog), so only a re-derived availability check can catch it"
    rules: [{ $ref: 'rules.yaml#/CheckoutPricesCartCreatesPaymentIntent' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      # AVAILABLE when the line was added...
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
      # ...UNAVAILABLE by the time the customer pays.
      - { $ref: '#/fixtures/productUpdatedOfferUnavailable' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/OfferUnavailable' }

  TestPlaceOrderRejectsStockFallenBelowTheCartLineQuantity:
    name: "A stock-TRACKED offer whose stock fell below the cart line's quantity after the line was added rejects the checkout — the oversell case, caught at checkout and not only at cart-edit time"
    rules: [{ $ref: 'rules.yaml#/CheckoutPricesCartCreatesPaymentIntent' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      # Two in the cart...
      - { $ref: '#/fixtures/cartLineAdded' }
      # ...one left on the pass.
      - { $ref: '#/fixtures/offerStockDroppedBelowCartLine' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/InsufficientStock' }

  TestPlaceOrderAcceptsAnOfferThatTracksNoStock:
    name: "An offer that tracks no stock never blocks the checkout: untracked is not zero — the false-positive floor of the orderability re-check, for every restaurant that does not count portions"
    rules: [{ $ref: 'rules.yaml#/CheckoutPricesCartCreatesPaymentIntent' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      # No OfferStockUpdated anywhere: stock_quantity stays null = UNTRACKED, never a zero.
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    then:
      - { $ref: '#/fixtures/paymentIntentCreatedCollection' }

  TestPlaceOrderIsRejected:
    name: "Rejects checkout when the restaurant is paused, the cart is empty, the delivery address is missing or out of area, or the payment is declined"
    rules: [{ $ref: 'rules.yaml#/CheckoutPricesCartCreatesPaymentIntent' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/cartStarted' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "DELIVERY"
        paymentMethodId: "pm_declined"
    thrown:
      - { $ref: 'errors.yaml#/RestaurantPaused' }
      - { $ref: 'errors.yaml#/CartEmpty' }
      - { $ref: 'errors.yaml#/DeliveryAddressRequired' }
      - { $ref: 'errors.yaml#/OutsideDeliveryArea' }
      - { $ref: 'errors.yaml#/PaymentDeclined' }

  TestPlaceOrderRejectsTestRestaurantForLiveOrder:
    name: "A production (LIVE) order against a TEST restaurant is rejected (test-mode isolation)"
    rules: [{ $ref: 'rules.yaml#/OrderTestModeIsolation' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegisteredTest' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        mode: "LIVE"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "DELIVERY"
        deliveryAddress: { line1: "1 Rue Nationale", postalCode: "37000", city: "Tours", country: "FR" }
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/CannotOrderTestRestaurant' }

  TestPlaceOrderPaymentAuthorizedPlacesOrder:
    name: "On payment authorization (funds held, not captured) the saga materializes the order and closes the cart"
    rules: [{ $ref: 'rules.yaml#/OrderMaterializedOnPaymentAuthorization' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/cartStarted' }
