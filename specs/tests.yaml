  TestDispatchSelfDispatched:
    name: "A RESTAURANT-dispatch order is not offered to a channel: the run self-dispatches (Captain tracks only)"
    rules: [{ $ref: 'rules.yaml#/RestaurantDispatchBypassesRouting' }]
