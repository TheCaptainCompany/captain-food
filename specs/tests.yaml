      - { $ref: 'rules.yaml#/PartnerAcceptanceRecordsCourier' }
    actor: { $ref: 'processmanager.yaml#/DeliveryDispatchProcess' }
    given:
      - { $ref: '#/fixtures/deliveryRequested' }
      - { $ref: '#/fixtures/deliveryRejectedByPartner' }
    when:
      type: { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
      data: { deliveryJobId: "deliv-1", partnerRef: "avelo-77", courier: { displayName: "Léa", phone: "+33611223344" } }
    then: []

  TestDispatchFailsAfterOfferCap:
    name: "Exhausting the ranked channel walk fails the dispatch closed (DeliveryDispatchFailed, run FAILED)"
    rules: [{ $ref: 'rules.yaml#/DispatchExhaustionFailsClosed' }]
    actor: { $ref: 'processmanager.yaml#/DeliveryDispatchProcess' }
    given:
      - { $ref: '#/fixtures/deliveryRequested' }
      - { $ref: '#/fixtures/deliveryRejectedByPartner' }
      - { $ref: '#/fixtures/deliveryRejectedByPartner' }
    when:
      type: { $ref: 'events.yaml#/DeliveryRejectedByPartner' }
      data: { deliveryJobId: "deliv-1", reason: "No courier available" }
    then:
