    then:
      - { $ref: '#/fixtures/refundOpened' }

  TestPaymentRefundApprovedRecorded:
    name: "The Payment records the refund approval (restaurant or admin) delivered by RefundProcess"
    rules: [{ $ref: 'rules.yaml#/RefundRequiresApproval' }]
    actor: { $ref: 'actors.yaml#/Payment' }
    given:
