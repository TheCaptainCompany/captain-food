  TestRiderConfirmSignInWrongCodeIsRejected:
    name: "Rejects rider sign-in when the OTP is wrong or expired"
    rules: [{ $ref: 'rules.yaml#/RiderSignInIdentifiesOnly' }]
    actor: { $ref: 'actors.yaml#/Rider' }
