      - { $ref: '#/fixtures/paymentAuthorized' }

  TestPaymentCapturedRecorded:
    name: "The Payment records the inbound Stripe capture fact — the money moved on fulfilment (idempotent)"
    rules: [{ $ref: 'rules.yaml#/PaymentCapturedOnFulfilment' }]
    actor: { $ref: 'actors.yaml#/Payment' }
    given:
      - { $ref: '#/fixtures/paymentIntentCreated' }
      - { $ref: '#/fixtures/paymentAuthorized' }
    when:
      type: { $ref: 'events.yaml#/PaymentCaptured' }
      data: { paymentIntentId: "pi_123", orderId: "order-1", restaurantId: "resto-1", amount: { amountCents: 1960, currency: "EUR" } }
    then:
      - { $ref: '#/fixtures/paymentCaptured' }

  TestPaymentCaptureFailedRecorded:
    name: "The Payment records the capture failure delivered by PaymentSettlementProcess (typed reason; status stays AUTHORIZED)"
    rules: [{ $ref: 'rules.yaml#/CaptureFailureIsRecordedAndPaged' }]
    actor: { $ref: 'actors.yaml#/Payment' }
    given:
      - { $ref: '#/fixtures/paymentIntentCreated' }
      - { $ref: '#/fixtures/paymentAuthorized' }
    when:
      type: { $ref: 'events.yaml#/PaymentCaptureFailed' }
      data: { paymentIntentId: "pi_123", orderId: "order-1", restaurantId: "resto-1", reason: "CARD_DECLINED", detail: "Your card was declined." }
    then:
      - { $ref: '#/fixtures/paymentCaptureFailed' }

  TestPaymentReleasedRecorded:
    name: "The Payment records the inbound Stripe release fact — the uncaptured hold is gone, no money moved (idempotent)"
    rules: [{ $ref: 'rules.yaml#/AuthorizationReleasedWithoutCapture' }]
    actor: { $ref: 'actors.yaml#/Payment' }
    given:
