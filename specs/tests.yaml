      - { $ref: '#/fixtures/paymentIntentCreated' }
    when:
      type: { $ref: 'events.yaml#/PaymentAuthorized' }
      data: { paymentIntentId: "pi_123", restaurantId: "resto-1", amount: { amountCents: 1960, currency: "EUR" } }
    then:
      - { $ref: '#/fixtures/orderPlaced' }
      - { $ref: '#/fixtures/cartCheckedOut' }

  # ------------------------ Service-hours guard (RSO-1, DECISIONS §43) ---------------------
  TestPlaceOrderRejectsOutsideServiceHours:
    name: "A checkout at 04:00 against a restaurant with declared hours (Friday 19:00–23:00 Paris) is refused with the next opening slot — the restaurant is ACTIVE and not PAUSED, so the refusal can only come from the service-hours guard"
    rules:
      - { $ref: 'rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours' }
      - { $ref: 'rules.yaml#/ServiceWindowVerdictDerivedAtAnInstant' }
      - { $ref: 'rules.yaml#/OrderableExcludesServiceHours' }
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/restaurantHoursDeclared' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      # 02:00Z = 04:00 Europe/Paris (summer, UTC+2) on Friday 2026-08-14 — hours are declared and
      # the instant is outside them: verdict OUTSIDE_HOURS, the only refusing value.
      at: "2026-08-14T02:00:00Z"
      # Phase 4: the enforcement gate ON — the refusing edge. The OFF edge (shadow mode) is
      # TestPlaceOrderShadowModeAcceptsOutsideHoursAndRecordsTheVerdict below, on the SAME fixture.
      gates:
        - { $ref: 'configuration.yaml#/keys/ENFORCE_SERVICE_HOURS_GUARD' }
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    thrown:
      - { $ref: 'errors.yaml#/OutsideServiceHours' }

  TestPlaceOrderShadowModeAcceptsOutsideHoursAndRecordsTheVerdict:
    name: "The SAME 04:00 checkout with the enforcement gate OFF (the production default) is ACCEPTED — shadow mode — and the frozen snapshot records verdict OUTSIDE_HOURS, so the log can prove what the guard would have refused before the default flips"
    rules:
      - { $ref: 'rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours' }
      - { $ref: 'rules.yaml#/ServiceWindowVerdictDerivedAtAnInstant' }
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/restaurantHoursDeclared' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      # The refusal test's exact instant and fixtures; the ONLY difference is the gate (absent =
      # spec default OFF), so this pair mutation-tests both edges of the guard.
      at: "2026-08-14T02:00:00Z"
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    then:
      - { $ref: '#/fixtures/paymentIntentCreatedOutsideHoursShadow' }

  TestPlaceOrderAcceptsWhenHoursUndeclared:
    name: "A checkout against an ACTIVE restaurant with a timezone but NO declared hours (the prod-smoke L4 shape) is accepted, and the frozen snapshot records verdict HOURS_UNDECLARED with a null window — not OPEN, and not a refusal"
    rules:
      - { $ref: 'rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours' }
      - { $ref: 'rules.yaml#/ServiceWindowVerdictDerivedAtAnInstant' }
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      # Explicitly the emitter's default instant (tests.yaml header): with no hours declared the
      # verdict is HOURS_UNDECLARED at ANY instant — the assertion is the snapshot evidence.
      at: "2026-01-06T12:00:00Z"
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    then:
      - { $ref: '#/fixtures/paymentIntentCreatedCollection' }

  TestPlaceOrderAcceptsInsideServiceWindowFreezesEvidence:
    name: "A checkout inside the declared window (Friday 20:00 Paris, window 19:00–23:00) is accepted and the frozen snapshot carries verdict OPEN with the window's own instants and timezone — evidence a disputed acceptance can be proved from, not just an enum"
    rules:
      - { $ref: 'rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours' }
      - { $ref: 'rules.yaml#/ServiceWindowVerdictDerivedAtAnInstant' }
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/restaurantRegistered' }
      - { $ref: '#/fixtures/restaurantActivated' }
      - { $ref: '#/fixtures/restaurantHoursDeclared' }
      - { $ref: '#/fixtures/catalogCreated' }
      - { $ref: '#/fixtures/productAdded' }
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
    when:
      type: { $ref: 'commands.yaml#/PlaceOrder' }
      # 18:00Z = 20:00 Europe/Paris (summer, UTC+2) on Friday 2026-08-14 — inside 19:00–23:00.
      at: "2026-08-14T18:00:00Z"
      data:
        orderId: "order-1"
        restaurantId: "resto-1"
        cartId: "cart-1"
        customerId: "cust-1"
        customerContact: { displayName: "Johnny", phone: "+33612345678" }
        serviceType: "COLLECTION"
        paymentMethodId: "pm_123"
    then:
      - { $ref: '#/fixtures/paymentIntentCreatedOpenWindow' }

  TestPlaceOrderPaymentAuthorizedToleratesLegacySnapshotShape:
    name: "A payment authorization for a snapshot frozen BEFORE the verdict evidence existed (no verdict/window keys at all) still materializes the order — the evidence fields are optional in fact, so old paid checkouts can never be orphaned by the new shape"
    rules: [{ $ref: 'rules.yaml#/OrderMaterializedOnPaymentAuthorization' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/cartStarted' }
      - { $ref: '#/fixtures/cartLineAdded' }
      - { $ref: '#/fixtures/paymentIntentCreatedLegacyShape' }
    when:
      type: { $ref: 'events.yaml#/PaymentAuthorized' }
      data: { paymentIntentId: "pi_123", restaurantId: "resto-1", amount: { amountCents: 1960, currency: "EUR" } }
    then:
      - { $ref: '#/fixtures/orderPlaced' }
      - { $ref: '#/fixtures/cartCheckedOut' }

  TestPlaceOrderPaymentFailedPlacesNothing:
    name: "On payment failure the saga aborts and places no order (cart stays open)"
    rules: [{ $ref: 'rules.yaml#/CheckoutAbortsOnPaymentFailure' }]
    actor: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    given:
      - { $ref: '#/fixtures/paymentIntentCreated' }
    when:
      type: { $ref: 'events.yaml#/PaymentFailed' }
      data: { paymentIntentId: "pi_123", restaurantId: "resto-1", reason: "card_declined" }
    then: []

  # ------------------------ RefundProcess (saga) ---------------------
  TestRefundOnOrderRejected:
    name: "Requests a Stripe refund when an order is rejected by the restaurant AFTER capture"
    rules: [{ $ref: 'rules.yaml#/RefundOnRejectionOrCancellation' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
    given:
      # Under authorize-then-capture (ADR-20260808-195315 §1.2) a placed order is only AUTHORIZED;
      # the refund path exists for POST-capture aborts, so the capture fact is part of the given.
      - { $ref: '#/fixtures/paymentCaptured' }
    when:
      type: { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      data: { orderId: "order-1", restaurantId: "resto-1", reason: "Out of ingredients" }
    then:
      - { $ref: '#/fixtures/refundOpened' }   # the refund-queue fact, delivered to the Payment (View_PendingRefunds)

  TestRefundOnOrderCancelledByCustomer:
    name: "Requests a Stripe refund when the customer cancels the order"
    rules: [{ $ref: 'rules.yaml#/RefundOnRejectionOrCancellation' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
    given:
      - { $ref: '#/fixtures/paymentCaptured' }   # post-capture abort (ADR-20260808-195315 §1.2) — the refund path needs a captured payment
    when:
      type: { $ref: 'events.yaml#/OrderCancelledByCustomer' }
      data: { orderId: "order-1", restaurantId: "resto-1", reason: "Changed my mind" }
    then:
      - { $ref: '#/fixtures/refundOpenedOnCustomerCancel' }

  TestRefundOnOrderCancelledByRestaurant:
    name: "Requests a Stripe refund when the restaurant cancels the order"
    rules: [{ $ref: 'rules.yaml#/RefundOnRejectionOrCancellation' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
    given:
      - { $ref: '#/fixtures/paymentCaptured' }   # post-capture abort (ADR-20260808-195315 §1.2) — the refund path needs a captured payment
    when:
      type: { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      data: { orderId: "order-1", restaurantId: "resto-1", reason: "Kitchen closed" }
    then:
      - { $ref: '#/fixtures/refundOpenedOnRestaurantCancel' }

  TestRefundOnRefundRequested:
    name: "Validates eligibility and requests a Stripe refund on a customer refund request"
    rules: [{ $ref: 'rules.yaml#/RefundOnRejectionOrCancellation' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
    given:
      - { $ref: '#/fixtures/paymentCaptured' }   # post-capture abort (ADR-20260808-195315 §1.2) — the refund path needs a captured payment
    when:
      type: { $ref: 'events.yaml#/RefundRequested' }
      data: { orderId: "order-1", restaurantId: "resto-1", reason: "Late delivery" }
    then:
      - { $ref: '#/fixtures/refundOpenedOnRequest' }

  TestRefundSettledFactRecorded:
    name: "Records the settled refund fact reported back by Stripe"
    rules: [{ $ref: 'rules.yaml#/RefundSettledFactRecorded' }]
    actor: { $ref: 'processmanager.yaml#/RefundProcess' }
    given: []
    when:
      type: { $ref: 'events.yaml#/PaymentRefunded' }
      data: { refundId: "re_1", paymentIntentId: "pi_123", orderId: "order-1", restaurantId: "resto-1", amount: { amountCents: 1960, currency: "EUR" } }
    then: []

  # ------------------ PaymentSettlementProcess (saga) ----------------
  # Capture-on-fulfilment / release-on-abort (ADR-20260808-195315 §1.2/§1.3). The port calls'
  # OUTCOMES (the recording gateway saw capture/release; the failure branch appends
  # PaymentCaptureFailed) are asserted by the hand-written unit tests in
  # crates/application/src/process_managers/payment_settlement.rs — the generated bed asserts the
  # append surface (none on the happy path: settlement arrives as the inbound Stripe facts).
  TestCaptureRequestedOnOrderDelivered:
    name: "Requests the Stripe capture when an AUTHORIZED order is delivered / picked up"
    rules: [{ $ref: 'rules.yaml#/PaymentCapturedOnFulfilment' }]
    actor: { $ref: 'processmanager.yaml#/PaymentSettlementProcess' }
    given: []
    when:
      type: { $ref: 'events.yaml#/OrderDelivered' }
      data: { orderId: "order-1", restaurantId: "resto-1" }
    then: []

  TestNoCaptureWithoutCaptainAuthorization:
    name: "Delivery alone never captures: an order with no Captain authorization (no payment intent) is structurally skipped"
    # The closable half of the external-orders guard (ADR-20260813-233418 AR-2): the $0 replacement
    # is today's expressible "no Captain PaymentIntent" order. The concrete external-order case (an
    # ExternalOrderReceived order marked delivered triggers no capture) lands with the post-V0
    # external-orders slice — that event does not exist yet.
    rules: [{ $ref: 'rules.yaml#/PaymentCapturedOnFulfilment' }]
    actor: { $ref: 'processmanager.yaml#/PaymentSettlementProcess' }
    given:
      - { $ref: '#/fixtures/orderPlacedReplacement' }
    when:
      type: { $ref: 'events.yaml#/OrderDelivered' }
      data: { orderId: "replacement-order-1", restaurantId: "resto-1" }
    then: []

  TestReleaseRequestedOnOrderRejected:
    name: "Releases the uncaptured hold when the restaurant rejects an AUTHORIZED order (no refund — no capture)"
    rules: [{ $ref: 'rules.yaml#/AuthorizationReleasedWithoutCapture' }]
    actor: { $ref: 'processmanager.yaml#/PaymentSettlementProcess' }
    given: []
    when:
      type: { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      data: { orderId: "order-1", restaurantId: "resto-1", reason: "Out of ingredients" }
    then: []

  TestReleaseRequestedOnOrderCancelledByCustomer:
    name: "Releases the uncaptured hold when the customer cancels an AUTHORIZED order"
    rules: [{ $ref: 'rules.yaml#/AuthorizationReleasedWithoutCapture' }]
