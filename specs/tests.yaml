  TestCartCheckedOutRecorded:
    name: "The Cart records the checkout fact delivered by PlaceOrderProcess and closes (idempotent)"
    rules: [{ $ref: 'rules.yaml#/OrderMaterializedOnPaymentAuthorization' }]
    actor: { $ref: 'actors.yaml#/Cart' }
    given:
      - { $ref: '#/fixtures/cartStarted' }
