    then:
      - { $ref: '#/fixtures/paymentRefunded' }

  TestPendingRefundVisibleUntilDecided:
    name: "The Payment records the opened refund (RefundOpened, idempotent) so the refund queue folds it as REQUESTED until decided"
    rules: [{ $ref: 'rules.yaml#/PendingRefundVisibleUntilDecided' }]
