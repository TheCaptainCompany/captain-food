version: 2
description: >
  Captain.Food STORY MAP — personas → activities → steps. Each step `$ref`s the api.yaml query/mutation
  that realizes it (codegen validates the ref resolves). `personaRole` maps the persona to its
  scalars.yaml#/UserType; the codegen checks every step's operation is callable by that role
  (the op is @public, or the role is in the op's `roles`). This file is product knowledge — it does not
  define new operations, only wires personas to the existing api surface.

# Two restaurant-side roles (see UserType): the OWNER manages the account — locations + catalog
# (HubRise restaurant); the MANAGER runs a single location — order operations (HubRise location).

public_user:
  description: A visitor browsing Captain.Food without being logged in.
  personaRole: PUBLIC
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Explore available restaurants and dishes.
    - Build a cart before deciding to sign up.
  frustrations:
    - Limited features without an account.
    - Cannot save favorites without registering.
  activities:
    BrowseForFood:
      description: As a visitor, I browse restaurants and build a cart without logging in.
      steps:
        SearchRestaurants: { $ref: 'api.yaml#/queries/restaurants' }
        SelectRestaurant: { $ref: 'api.yaml#/queries/restaurant' }
        BrowseCatalog: { $ref: 'api.yaml#/queries/catalog' }
        AddToCartLine: { $ref: 'api.yaml#/mutations/addCartLine' }
        RemoveFromCart: { $ref: 'api.yaml#/mutations/removeCartLine' }
        ChangeCartLineQuantity: { $ref: 'api.yaml#/mutations/changeCartLineQuantity' }
        RequestPhoneOtp: { $ref: 'api.yaml#/mutations/requestPhoneVerification' }
        VerifyPhone: { $ref: 'api.yaml#/mutations/verifyPhone' }
    SignInAsRider:
      description: As a visitor on the rider surface, I sign in with my phone -- the platform identifies me as a rider (it never registers me here) and issues the RIDER credential; every rider activity starts here (#639 part C step 2c). Held by the anonymous persona because the door is walked WITHOUT a credential (op roles [PUBLIC]) -- a RIDER persona cannot call a PUBLIC-only operation. Walked from the rider app's `sign_in` screen (`specs/screens/rider.yaml`, route `/sign-in`, transport role PUBLIC via `graphql_role` -- R1, 2c-ii) -- phone, then the six-digit code in the `rider_code_sheet`, then `claim_session` and the job list.
      steps:
        RequestRiderSignInCode: { $ref: 'api.yaml#/mutations/requestRiderSignInCode' }   # identical outcome whether or not the phone is a rider's
        ConfirmRiderSignIn: { $ref: 'api.yaml#/mutations/confirmRiderSignIn' }   # identify-only; the session then arrives via POST /auth/session, never in the response
    SignInAsRestaurantManager:
      description: As a visitor on the restaurant back-office surface, I sign in with my email -- the platform identifies me as a MEMBER (it never registers me here) and issues the MEMBER credential (#639 part C step 6-ii, ADR-20260905-101349 §7-§10). Held by the anonymous persona (the `SignInAsRider` shape) because the door is walked WITHOUT a credential (op roles [PUBLIC]) -- a RESTAURANT persona cannot call a PUBLIC-only operation. Walked from `restos.captain.food/sign-in` (`specs/screens/restaurant_backoffice.yaml`, transport role PUBLIC via `graphql_role` -- R1), then the not-yet-linked refusal screen when the address is verified but no `Member` row exists.
      steps:
        RequestMemberSignInLink: { $ref: 'api.yaml#/mutations/requestMemberSignInLink' }   # identical outcome whether or not the address is on the roster
        ConfirmMemberSignIn: { $ref: 'api.yaml#/mutations/confirmMemberSignIn' }   # identify-only; the session then arrives via POST /auth/session, never in the response
    AcceptRestaurantInvitation:
      description: >
        As a visitor who received an invitation email, I accept it and become a restaurant member --
        the two-lane accept, client-sequenced, never a process manager (#639 part C step 6-iv,
        ADR-20260905-101349 §2, PROP-20260831-180622 §8.3). Walked from
        `restos.captain.food/invitation` (`specs/screens/restaurant_backoffice.yaml`, transport role
        PUBLIC): `acceptRestaurantInvitation` first, then the client itself dispatches the SECOND,
        PUBLIC-only command `grantRestaurantAccessByInvitation` (round 2, ADR-20260905-101349 §2
        amendment -- its own door, never a `basis` argument on the ADMIN grant) and signs in via
        `POST /auth/session`. Renamed from `AcceptRestaurantMembershipInvitation` (evans B3): the
        first command alone creates no membership.
      steps:
        AcceptInvitation: { $ref: 'api.yaml#/mutations/acceptRestaurantInvitation' }
        GrantAccessFromInvitation: { $ref: 'api.yaml#/mutations/grantRestaurantAccessByInvitation' }
    SignInAsAdmin:
      description: As a visitor on the system surface, I sign in with my email -- the platform identifies me against a LIVE platform grant (it never registers me here) and issues the ADMIN credential (#639 part C step 6-iii, ADR-20260906-023825). Held by the anonymous persona (the `SignInAsRestaurantManager` shape) because the door is walked WITHOUT a credential (op roles [PUBLIC]) -- an ADMIN persona cannot call a PUBLIC-only operation. Walked from `system.captain.food/sign-in` (`specs/screens/system.yaml`, transport role PUBLIC via `graphql_role`), then the `no_access` refusal screen when the address is verified but no live `PlatformMembership` grant exists.
      steps:
        RequestAdminSignInLink: { $ref: 'api.yaml#/mutations/requestAdminSignInLink' }   # identical outcome whether or not the address holds a platform grant
        ConfirmAdminSignIn: { $ref: 'api.yaml#/mutations/confirmAdminSignIn' }   # identify-only; the session then arrives via POST /auth/session, never in the response

customer:
  description: An authenticated person who orders food via Captain.Food.
  personaRole: CUSTOMER
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Order food from favorite restaurants.
    - Track order status and delivery.
  frustrations:
    - Long delivery times.
    - Difficulty finding specific dishes.
  activities:
    OrderFood:
      description: As a customer, I order food and follow it through to rating.
      steps:
        SearchRestaurants: { $ref: 'api.yaml#/queries/restaurants' }
        SelectRestaurant: { $ref: 'api.yaml#/queries/restaurant' }
        BrowseCatalog: { $ref: 'api.yaml#/queries/catalog' }
        AddToCartLine: { $ref: 'api.yaml#/mutations/addCartLine' }
        RemoveFromCart: { $ref: 'api.yaml#/mutations/removeCartLine' }
        ChangeCartLineQuantity: { $ref: 'api.yaml#/mutations/changeCartLineQuantity' }
        SeeCheckoutBreakdown: { $ref: 'api.yaml#/queries/cart' }   # transparent fee breakdown before paying (ADR-0018)
        CompareWithUberEats: { $ref: 'api.yaml#/queries/cart' }   # labelled Uber Eats price + who-gets-what comparison (ADR-0022/0025); also on catalog offers + the order receipt
        ViewMyCarts: { $ref: 'api.yaml#/queries/carts' }   # one OPEN cart per restaurant
        ViewCurrentCart: { $ref: 'api.yaml#/queries/current' }   # my most-recent OPEN cart, claim-resolved (no args), priced LIVE at read — what /checkout and the mini-cart render (#451)
        BrowseCategories: { $ref: 'api.yaml#/queries/categories' }   # category tree for filtering/discovery
        PlaceOrder: { $ref: 'api.yaml#/mutations/placeOrder' }
        PollOperationStatus: { $ref: 'api.yaml#/queries/operationStatus' }   # by messageId — pull counterpart of the operationStatusChanged subscription
        TrackPaymentStatus: { $ref: 'api.yaml#/queries/paymentStatus' }   # clientSecret + payment state after the placeOrder acceptance (ADR-20260720-015500)
        TrackOrderStatus: { $ref: 'api.yaml#/queries/order' }
        TrackDelivery: { $ref: 'api.yaml#/queries/delivery' }   # live courier/delivery progress (ADR-0031)
        CancelOrder: { $ref: 'api.yaml#/mutations/cancelOrderByCustomer' }
        RateOrder: { $ref: 'api.yaml#/mutations/rateOrder' }
        RateRestaurant: { $ref: 'api.yaml#/mutations/rateRestaurant' }
        RateDeliveryTimeliness: { $ref: 'api.yaml#/mutations/recordDeliverySatisfaction' }   # #62 was the delivery on time? (asked with the tip prompt, à la Uber Eats/Deliveroo)
        TipRiderRestaurantOrCaptain: { $ref: 'api.yaml#/mutations/tipOrder' }
        RequestRefund: { $ref: 'api.yaml#/mutations/requestRefund' }
    FavoriteRestaurant:
      description: As a customer, I keep a list of favorite restaurants.
      steps:
        MarkAsFavorite: { $ref: 'api.yaml#/mutations/markRestaurantAsFavorite' }
        UnmarkAsFavorite: { $ref: 'api.yaml#/mutations/unmarkRestaurantAsFavorite' }
        ViewFavorites: { $ref: 'api.yaml#/queries/favoriteRestaurants' }
    ConfigureProfile:
      description: As a customer, I manage my profile, preferences, addresses and payment method.
      steps:
        ViewProfile: { $ref: 'api.yaml#/queries/me' }
        UpdatePersonalInfo: { $ref: 'api.yaml#/mutations/updateCustomerInfo' }
        ChangeLanguage: { $ref: 'api.yaml#/mutations/changeLanguage' }
        VerifyEmail: { $ref: 'api.yaml#/mutations/requestEmailVerification' }
        ConfirmEmail: { $ref: 'api.yaml#/mutations/confirmEmailVerification' }
        ChangePhone: { $ref: 'api.yaml#/mutations/requestPhoneChange' }
        ConfirmPhoneChange: { $ref: 'api.yaml#/mutations/confirmPhoneChange' }
        SetPreferences: { $ref: 'api.yaml#/mutations/setCustomerPreferences' }
        SetAddress: { $ref: 'api.yaml#/mutations/setCustomerAddress' }
        RemoveAddress: { $ref: 'api.yaml#/mutations/removeCustomerAddress' }
        SetPaymentMethod: { $ref: 'api.yaml#/mutations/setCustomerPaymentMethod' }
        ViewMyCredit: { $ref: 'api.yaml#/queries/customerCredit' }   # my spendable store-credit balance (#158, Part B of #207)
    MessageAboutMyOrder:
      description: As a customer, I message the restaurant about my order and read the thread (#129).
      steps:
        OpenThread: { $ref: 'api.yaml#/mutations/openConversation' }
        SendMessage: { $ref: 'api.yaml#/mutations/postMessage' }
        TranslateMessage: { $ref: 'api.yaml#/mutations/recordMessageTranslation' }
        ReadThread: { $ref: 'api.yaml#/queries/orderConversation' }
    EraseMyAccount:
      description: >
        As a customer, I ask to be forgotten, confirm it, can change my mind inside the window, and
        can see what was erased and what the law made us keep (GDPR Art. 17; PROP-20260829-150752).
        This activity is the LAUNCH GATE, not a feature: the founder decided ERASURE-LAUNCH-GATE "A —
        Erasure ships first", so the first real order in Tours waits on it.
      steps:
        RequestErasure: { $ref: 'api.yaml#/mutations/requestErasure' }   # ask to be forgotten; refused with a typed reason while an order is in flight
        ConfirmErasure: { $ref: 'api.yaml#/mutations/confirmErasure' }   # the second round-trip an irreversible act needs
        KeepMyAccount: { $ref: 'api.yaml#/mutations/cancelErasure' }     # re-login-cancels -- the subject's own way back, never an admin resurrection
        TrackErasure: { $ref: 'api.yaml#/queries/erasureStatus' }        # what is happening, and afterwards what was retained and under which instrument
    RaiseAClaim:
      description: As a customer, I raise a claim/dispute about a delivered order and can reopen a decided one (#151).
      steps:
        OpenClaim: { $ref: 'api.yaml#/mutations/openReclamation' }
        AttachEvidence: { $ref: 'api.yaml#/mutations/attachReclamationEvidence' }   # attach an evidence photo to my claim (#156)
        ReopenClaim: { $ref: 'api.yaml#/mutations/reopenReclamation' }
        ReviewMyClaims: { $ref: 'api.yaml#/queries/myReclamations' }   # my own claims list (#154)
        ViewClaim: { $ref: 'api.yaml#/queries/reclamation' }   # claim detail (#154)

restaurant_owner:
  description: >
    Owns a restaurant ACCOUNT (HubRise restaurant). Manages the account, its locations, and the catalog.
    May also act as a manager, but that is a separate role.
  personaRole: RESTAURANT_ACCOUNT
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Run multiple locations under one account.
    - Keep the catalog accurate across locations.
  frustrations:
    - Commission fees across locations.
    - Maintaining consistency between locations.
  activities:
    ManageAccount:
      description: As an owner, I manage my restaurant account.
      steps:
        RegisterAccount: { $ref: 'api.yaml#/mutations/registerRestaurantAccount' }
        UpdateAccount: { $ref: 'api.yaml#/mutations/updateRestaurantAccount' }
        DeleteAccount: { $ref: 'api.yaml#/mutations/deleteRestaurantAccount' }
    ManageLocations:
      description: As an owner, I add and maintain the locations under my account.
      steps:
        AddLocation: { $ref: 'api.yaml#/mutations/registerRestaurant' }
        # Between adding and going live (ADR-20260728-011344 D2): a location cannot be activated
        # without a storefront address, and the address is the owner's to choose -- not something the
        # registration invents on their behalf. Renaming later reuses the same step.
        ChooseStorefrontAddress: { $ref: 'api.yaml#/mutations/configureRestaurantSlug' }
        ActivateLocation: { $ref: 'api.yaml#/mutations/activateRestaurant' }
        DeactivateLocation: { $ref: 'api.yaml#/mutations/deactivateRestaurant' }
        UpdateLocationProfile: { $ref: 'api.yaml#/mutations/updateRestaurant' }
        RemoveLocation: { $ref: 'api.yaml#/mutations/removeRestaurant' }
        ViewAllLocations: { $ref: 'api.yaml#/queries/restaurantLocationsByAccount' }
    ClaimListing:
      description: As an owner, I claim my pre-listed restaurant (proven via Google Business Profile) and point Google's "Order online" button at my page.
      steps:
        FindMyListing: { $ref: 'api.yaml#/queries/restaurant' }
        ClaimIt: { $ref: 'api.yaml#/mutations/claimRestaurantListing' }
        OptOut: { $ref: 'api.yaml#/mutations/optOutRestaurantListing' }
        ConfigureGoogleOrderButton: { $ref: 'api.yaml#/mutations/configureGbpOrderLink' }
        VerifyGoogleOrderButton: { $ref: 'api.yaml#/mutations/verifyGbpOrderLink' }
    ManageCatalog:
      description: As an owner, I build and maintain the catalog.
      steps:
        ViewCatalog: { $ref: 'api.yaml#/queries/catalog' }
        CreateCatalog: { $ref: 'api.yaml#/mutations/createCatalog' }
        ChooseCatalogRoute: { $ref: 'api.yaml#/mutations/configureCatalogSlug' }
        AddProduct: { $ref: 'api.yaml#/mutations/addProduct' }
        UpdateProduct: { $ref: 'api.yaml#/mutations/updateProduct' }
        RemoveProduct: { $ref: 'api.yaml#/mutations/removeProduct' }
        AddCategory: { $ref: 'api.yaml#/mutations/addCatalogCategory' }
        UpdateCategory: { $ref: 'api.yaml#/mutations/updateCatalogCategory' }
        RemoveCategory: { $ref: 'api.yaml#/mutations/removeCatalogCategory' }
        AddOptionList: { $ref: 'api.yaml#/mutations/addOptionList' }
        UpdateOptionList: { $ref: 'api.yaml#/mutations/updateOptionList' }
        RemoveOptionList: { $ref: 'api.yaml#/mutations/removeOptionList' }
        UpdateStock: { $ref: 'api.yaml#/mutations/updateOfferStock' }
        ImportCatalog: { $ref: 'api.yaml#/mutations/importCatalog' }

restaurant_manager:
  description: >
    Runs a SINGLE location (HubRise location): handles the live order queue. Assigned by the owner; can
    only manage the location they are assigned to.
  personaRole: RESTAURANT
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Process incoming orders quickly and accurately.
    - Keep the kitchen's acceptance mode in sync with capacity.
  frustrations:
    - Inaccurate order details.
    - Managing peak order times.
  activities:
    ManageOrders:
      description: As a manager, I work the incoming order queue for my location.
      steps:
        ViewIncomingOrders: { $ref: 'api.yaml#/queries/orders' }
        AcceptOrder: { $ref: 'api.yaml#/mutations/acceptOrder' }
        RejectOrder: { $ref: 'api.yaml#/mutations/rejectOrder' }
        StartPreparation: { $ref: 'api.yaml#/mutations/startPreparation' }
        MarkOrderReady: { $ref: 'api.yaml#/mutations/markOrderReady' }
        MarkCollected: { $ref: 'api.yaml#/mutations/markOrderDelivered' }   # COLLECTION hand-over at pickup
        SetAcceptanceMode: { $ref: 'api.yaml#/mutations/changeOrderAcceptanceMode' }
        CancelOrder: { $ref: 'api.yaml#/mutations/cancelOrderByRestaurant' }
        ThankRiderOrCaptain: { $ref: 'api.yaml#/mutations/tipOrder' }   # restaurant tips the courier / Captain (ADR-012)
        ReviewPendingRefunds: { $ref: 'api.yaml#/queries/pendingRefunds' }   # my orders' refund queue (status REQUESTED = awaiting my decision)
        ApproveRefund: { $ref: 'api.yaml#/mutations/approveRefund' }   # decide a pending refund on my own orders (RefundProcess)
        DenyRefund: { $ref: 'api.yaml#/mutations/denyRefund' }
    TrackDeliveries:
      description: As a manager, I track the couriers delivering my ready orders (ADR-0031).
      steps:
        ViewDeliveries: { $ref: 'api.yaml#/queries/restaurantDeliveries' }
        CancelDelivery: { $ref: 'api.yaml#/mutations/cancelDelivery' }
        EscalateDelivery: { $ref: 'api.yaml#/mutations/escalateDelivery' }   # skip the current channel, advance the ranked dispatch walk (#60)
        ResolveDeliveryIssue: { $ref: 'api.yaml#/mutations/resolveDeliveryIssue' }   # acknowledge a rider's reported issue from the board's pinned card (#639 part C step 3-i)
        ReviewDeliverySatisfaction: { $ref: 'api.yaml#/queries/restaurantDeliverySatisfaction' }   # #62 customers' delay verdicts → self-dispatch-vs-Captain decision
    HandleOrderConversation:
      description: As a manager, I reply on my orders' conversations, keep internal staff notes, and moderate the thread (#129).
      steps:
        ReplyToCustomer: { $ref: 'api.yaml#/mutations/postMessage' }
        ReadInternalNotes: { $ref: 'api.yaml#/queries/orderConversationInternalNotes' }
        EscalateToAdmin: { $ref: 'api.yaml#/mutations/escalateToAdmin' }   # pull an admin in with a reason (#129)
        MuteParticipant: { $ref: 'api.yaml#/mutations/muteParticipant' }   # mute a disruptive role, reason required (#129)
        UnmuteParticipant: { $ref: 'api.yaml#/mutations/unmuteParticipant' }   # lift a mute (#129)
    ManageTeam:
      description: As a MANAGER, I see my restaurant's roster and invitation list, invite a colleague by email, and withdraw an unaccepted invitation -- self-service staff onboarding, ships dark behind RUN_RESTAURANT_INVITATION (#639 part C step 6-iv, ADR-20260905-101349 §2/§3, PROP-20260831-180622 §8.2/§8.4). The OPERATOR authority sees the roster but never this activity's Invite/Revoke controls (§8.2, resolver-data condition on viewerAuthority, not a persona split).
      steps:
        ViewRoster: { $ref: 'api.yaml#/queries/restaurantRoster' }
        ViewInvitations: { $ref: 'api.yaml#/queries/restaurantInvitations' }
        InviteMember: { $ref: 'api.yaml#/mutations/inviteRestaurantMember' }
        RevokeInvitation: { $ref: 'api.yaml#/mutations/revokeRestaurantInvitation' }
    HandleClaims:
      description: As a manager, I decide customers' claims on my orders — resolving or rejecting each (#151).
      steps:
        WorkClaimsQueue: { $ref: 'api.yaml#/queries/restaurantReclamations' }   # my orders' claims queue (status OPEN = outstanding) (#154)
        ResolveClaim: { $ref: 'api.yaml#/mutations/resolveReclamation' }
        RejectClaim: { $ref: 'api.yaml#/mutations/rejectReclamation' }

rider:
  description: A courier who delivers orders from restaurants to customers.
  personaRole: RIDER
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Deliver orders promptly.
    - Maintain a good rating.
  frustrations:
    - Traffic and navigation.
    - Unclear delivery addresses.
  activities:
    Deliver:
      description: As an independent rider, I pick up assigned deliveries and record hand-over (ADR-0031).
      steps:
        SetAvailability: { $ref: 'api.yaml#/mutations/changeRiderStatus' }   # go online/offline (#95)
        ViewMyDeliveries: { $ref: 'api.yaml#/queries/myDeliveries' }
        AcceptDelivery: { $ref: 'api.yaml#/mutations/acceptDelivery' }
        ConfirmPickup: { $ref: 'api.yaml#/mutations/confirmPickup' }
        CompleteDelivery: { $ref: 'api.yaml#/mutations/completeDelivery' }
        TrackDelivery: { $ref: 'api.yaml#/queries/delivery' }
        DeclineDelivery: { $ref: 'api.yaml#/mutations/declineDelivery' }   # refuse a PENDING offer (#639 part C step 3-i)
        ReportDeliveryIssue: { $ref: 'api.yaml#/mutations/reportDeliveryIssue' }   # "Un problème" — report by kind, the restaurant is told (#639 part C step 3-i)
        HandBackDelivery: { $ref: 'api.yaml#/mutations/handBackDelivery' }   # "Je ne peux pas continuer" — hand a held job back with the food's whereabouts (#639 part C step 3-ii)
        ViewMyStanding: { $ref: 'api.yaml#/queries/myStanding' }   # #639 part C step 4-i: is my access restricted, and why — the outcome is still the food's custody (ADR-20260904-081527 §10)

admin:
  description: A platform operator who onboards accounts and oversees the platform.
  personaRole: ADMIN
  locale: fr-FR   # expected language (V0 launches in Tours, France)
  goals:
    - Onboard restaurant accounts.
    - Keep the platform healthy.
  frustrations:
    - Handling outages and support escalations.
  activities:
    OnboardRestaurants:
      description: As an admin, I onboard accounts and activate restaurants.
      steps:
        RegisterAccount: { $ref: 'api.yaml#/mutations/registerRestaurantAccount' }
        AddLocation: { $ref: 'api.yaml#/mutations/registerRestaurant' }
        ChooseStorefrontAddress: { $ref: 'api.yaml#/mutations/configureRestaurantSlug' }
        ActivateRestaurant: { $ref: 'api.yaml#/mutations/activateRestaurant' }
        ImportCatalog: { $ref: 'api.yaml#/mutations/importCatalog' }
    SuperviseActorMailbox:
      description: As an admin, I watch the write-path mailbox lanes (pending depth, checkpoints, leases, fencing counters) to catch a stuck or starved lane before customers feel it (#242) — and when a row poisons at the delivery-attempts cap, I inspect it and requeue it after fixing the cause (#315).
      steps:
        ViewMailboxLanes: { $ref: 'api.yaml#/queries/mailboxLanes' }
        ReviewPoisonedMessages: { $ref: 'api.yaml#/queries/poisonedMailboxMessages' }
        RequeuePoisonedMessage: { $ref: 'api.yaml#/mutations/requeueMailboxMessage' }
    ManageListings:
      description: As an admin, I curate the restaurant listings and partnership funnel.
      steps:
        BrowseListings: { $ref: 'api.yaml#/queries/restaurants' }
        ChangeListingStatus: { $ref: 'api.yaml#/mutations/changeRestaurantListingStatus' }
        MarkClosed: { $ref: 'api.yaml#/mutations/markRestaurantClosed' }
    Prospection:
      description: As an admin, I work the B2B prospection pipeline (scored leads, log replies).
      steps:
        ReviewPipeline: { $ref: 'api.yaml#/queries/prospectionPipeline' }
        LogReply: { $ref: 'api.yaml#/mutations/recordProspectReply' }
    ManageRiderStanding:
      description: As an admin, I restrict a rider's access on a closed ground when a legal/eligibility fact requires it, and reinstate one once it is resolved — a human decision, never automated (#639 part C step 4-i, ADR-20260904-014136, ADR-20260904-081527; the roster/detail reads, #639 part C step 4-iii-A, ADR-20260904-152807).
      steps:
        ViewRiders: { $ref: 'api.yaml#/queries/riders' }   # the triage roster (/system/riders)
        ViewRider: { $ref: 'api.yaml#/queries/rider' }     # one rider's detail (/system/riders/:riderId)
        RestrictRider: { $ref: 'api.yaml#/mutations/restrictRider' }
        ReinstateRider: { $ref: 'api.yaml#/mutations/reinstateRider' }
    ManageRestaurantMembership:
      description: As an admin, I provision a restaurant member's access by hand and revoke it on a closed ground when their tenure ends — the first slice of staff authentication, ships dark behind RUN_MEMBER_ACCESS_GRANT (#639 part C step 6-i, ADR-20260905-101349 §1/§6). The roster read (ViewMembers) and self-service invitation are 6-iv's.
      steps:
        GrantAccess: { $ref: 'api.yaml#/mutations/grantRestaurantAccess' }
        RevokeAccess: { $ref: 'api.yaml#/mutations/revokeRestaurantAccess' }
    ManagePlatformMembership:
      description: As an admin, I hand-issue platform access to a NEW admin — the platform grant and the ADMIN seam binding, ships dark behind RUN_PLATFORM_ACCESS_GRANT (#639 part C step 6-v, ADR-20260905-223957 §1-§3). The FIRST admin never walks this step — a one-shot bootstrap dispatches the same command through the mailbox directly; every SUBSEQUENT admin is hand-issued through it. No revoke step exists yet (deferred until a second admin exists).
      steps:
        GrantAccess: { $ref: 'api.yaml#/mutations/grantPlatformAccess' }
    ArbitrateRefunds:
      description: As an admin, I arbitrate pending refund requests when the restaurant does not decide (RefundProcess).
      steps:
        ReviewPendingRefunds: { $ref: 'api.yaml#/queries/pendingRefunds' }   # the cross-restaurant refund queue
        ApproveRefund: { $ref: 'api.yaml#/mutations/approveRefund' }
        DenyRefund: { $ref: 'api.yaml#/mutations/denyRefund' }
    Pricing:
      description: As an admin, I review the service-fee policy and set each restaurant's margin (ADR-0016/0017).
      steps:
        ReviewPolicy: { $ref: 'api.yaml#/queries/pricingPolicy' }
        SetRestaurantMargin: { $ref: 'api.yaml#/mutations/updateRestaurant' }
        ReviewUberEstimationPolicy: { $ref: 'api.yaml#/queries/uberEstimationPolicy' }   # Uber comparison calibration (ADR-0024/0030)
        ReviewUberSplitPolicy: { $ref: 'api.yaml#/queries/uberSplitPolicy' }
    ReviewDeliveryPartners:
      description: As an admin, I work the delivery-partner self-registration review queue (#61).
      steps:
        ReviewQueue: { $ref: 'api.yaml#/queries/deliveryPartnerAvailabilities' }   # status = PENDING is the review queue
        ApproveAvailability: { $ref: 'api.yaml#/mutations/approveDeliveryPartnerAvailability' }
        RevokeAvailability: { $ref: 'api.yaml#/mutations/revokeDeliveryPartnerAvailability' }

restaurant_sync:
  description: >
    The Sirene/Google sync ACL (a scheduled worker) acting as an EXTERNAL caller. It seeds and refreshes
    public listings on the restaurants' behalf — no human; it issues the same commands an owner would.
  personaRole: EXTERNAL
  locale: fr-FR
  goals:
    - Seed Touraine restaurant listings from open data before any agreement.
    - Keep listings fresh (enrichment + closures).
  frustrations:
    - Source data gaps (SIRET shared by dark kitchens; Sirene closure lag).
  activities:
    SyncListings:
      description: As the sync ACL, I register, enrich and close listings via the API.
      steps:
        SeedListing: { $ref: 'api.yaml#/mutations/registerRestaurant' }
        EnrichGoogleProfile: { $ref: 'api.yaml#/mutations/updateRestaurantGoogleBusinessProfile' }
        MarkClosed: { $ref: 'api.yaml#/mutations/markRestaurantClosed' }
    Prospection:
      description: As the prospection worker, I contact scored prospects and mark them cold per the schedule.
      steps:
        ContactProspect: { $ref: 'api.yaml#/mutations/recordProspectContact' }
        MarkCold: { $ref: 'api.yaml#/mutations/markProspectCold' }

delivery_partner:
  description: >
    A delivery partner (already integrated: a known catalog channel) acting as an EXTERNAL caller through
    the partner portal / API (#61). It self-registers its availability to serve a city, tracks the review
    status, and withdraws when it pauses service — no engineer in the loop for the common case.
  personaRole: EXTERNAL
  locale: fr-FR
  goals:
    - Serve new cities by registering availability without a code change per partner/city.
    - Keep its city coverage current (withdraw where it pauses service).
  frustrations:
    - Manual, engineer-gated onboarding for every partnership.
  activities:
    RegisterCityAvailability:
      description: As a delivery partner, I register my availability to serve a city and track its review status.
      steps:
        SubmitAvailability: { $ref: 'api.yaml#/mutations/registerDeliveryPartnerAvailability' }
        TrackStatus: { $ref: 'api.yaml#/queries/deliveryPartnerAvailabilities' }
        WithdrawAvailability: { $ref: 'api.yaml#/mutations/revokeDeliveryPartnerAvailability' }
