version: 1
description: >
  BUSINESS METRICS — the persona-outcome catalog (ADR-20260810-234225 clauses 1-3 +
  ADR-20260811-014129: a business metric IS A PROJECTION). Two layers, per
  PROP-20260810-234225 D8: `projections:` declare FOLDS over `domain_events` — maintained by the
  `bam` projector into the `bam` schema the C4 already declares — and `metrics:` declare the
  READS over them (question + persona activity + grouping + value), served through tenant-scoped
  GraphQL queries. A fold REPLAYS (adding a metric later reproduces full history from the first
  event ever appended), which is the property the whole reversal chose projections for; ratios
  and percentiles are ordinary reads here and inexpressible as counters. Operational telemetry
  (latency, error budgets, dead-man's switches) does NOT live here — it stays on OTLP/Honeycomb
  (specs/observability.yaml), because it must work when Postgres is down.

  Typing rule (ADR-20260811-014129 Decision 2), binding on every row: a DECLARATION introduces a
  name (a projection key, a `measures:` map key); every REFERENCE is a `$ref` the loader resolves
  — including same-file (`#/projections/<P>/measures/<m>`); a VALUE from a closed set stays a
  bare token (grain ENTITY|AGGREGATE; measure type counter|sum|gauge|set; bucket
  HOUR|DAY|WEEK|MONTH|DAYPART; value ops sum|countRows|ratio|percentiles), closed in the
  validator so a typo is red, never a silently wrong metric. NOTE one deliberate refinement of
  the PROP's sketch: `measures:` is a MAP keyed by measure name, not a list — the resolver walks
  mapping keys, so `#/projections/P/measures/m` is resolvable exactly because the declaration IS
  the key (a list index would be the #413 invisible-reference class wearing a different coat).

  GENERATION STATUS: this catalog is validated (refs, fold-key totality, closed sets —
  tools/codegen-rs validate/business_metrics.rs) but the `bam` projector + tenant-scoped query
  EMITTERS are [#484]'s tracked machinery and do not exist yet; `exposedAs:` therefore stays
  ABSENT until the query it would name can be generated. The first row below is a RECORD with a
  deadline attached: the ENFORCE_ACCEPTANCE_TIMEOUT flip (specs/ordering/configuration.yaml)
  names this fold's percentiles as its fourth precondition, so the machinery must exist before
  the flip ADR can be written.

projections:
  # #167: one row per order, keyed at the ENTITY grain (D8a — every Order* event carries
  # orderId, so the fold is total over the lifecycle with no event change). placedAt/acceptedAt
  # come from the ENVELOPE (`occurredAt` is infrastructure metadata, exactly why the TTL value is
  # not payload), so the latency needs no new event fields and replays over the whole log.
  OrderAcceptanceLatency:
    description: >
      One row per order: when it was born, when (and whether) its restaurant accepted it, and
      the bounded grouping keys the time-to-accept read needs. An order with placedAt and no
      acceptedAt IS the platform's worst failure mode in progress — the read side of the #167
      acceptance clock.
    grain: ENTITY
    key:
      - from: { $ref: 'events.yaml#/OrderPlaced/properties/orderId' }
    measures:
      restaurantId: { type: set, of: { $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' } }
      placedAt:     { type: set, of: { envelope: occurredAt } }
      acceptedAt:   { type: set, of: { envelope: occurredAt } }
      # Bounded population (ADR-20260811-014129 D6, relaxed form): DAYPART buckets the
      # envelope hour, Europe/Paris, into the service's five dayparts — BREAKFAST (06-11),
      # LUNCH (11-14), AFTERNOON (14-18), DINNER (18-22, the Friday/Saturday 19:00-21:30 peak
      # lives here), LATE_NIGHT (22-06). A closed loader token, not a domain scalar: it is
      # read-side bucketing vocabulary, and putting it in the kernel would push codegen
      # vocabulary into the domain (the D8 "closed sets stay bare tokens" clause).
      daypart:      { type: set, of: { envelope: occurredAt, bucket: DAYPART } }
    fold:
      - on: { $ref: 'events.yaml#/OrderPlaced' }
        set: { $ref: '#/projections/OrderAcceptanceLatency/measures/restaurantId' }
        from: { $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' }
      - on: { $ref: 'events.yaml#/OrderPlaced' }
        set: { $ref: '#/projections/OrderAcceptanceLatency/measures/placedAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/OrderPlaced' }
        set: { $ref: '#/projections/OrderAcceptanceLatency/measures/daypart' }
        from: { envelope: occurredAt, bucket: DAYPART }
      - on: { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        set: { $ref: '#/projections/OrderAcceptanceLatency/measures/acceptedAt' }
        from: { envelope: occurredAt }

  # #639 part C step 3-i (ADR-20260904-015903 §8): one row per DELIVERY JOB (the stream's birth
  # fact DeliveryRequested seeds it, so the denominator is every job, not only the ones that hit
  # an issue), keyed at the ENTITY grain — every folded event carries deliveryJobId. reportedAt /
  # resolvedAt come from the ENVELOPE (the handler stamps no time in the payload, ADR-0041);
  # `kind` is the closed DeliveryIssueKind of the latest report; daypart buckets the report.
  DeliveryIssue:
    description: >
      One row per delivery job: which restaurant, whether (and when) a rider reported an issue
      on it and of which kind, and when the restaurant acknowledged it. A row with reportedAt
      and no resolvedAt is a rider standing somewhere with a problem nobody has answered — the
      read side of the issue door.
    grain: ENTITY
    key:
      - from: { $ref: 'events.yaml#/DeliveryRequested/properties/deliveryJobId' }
    measures:
      restaurantId: { type: set, of: { $ref: 'events.yaml#/DeliveryRequested/properties/restaurantId' } }
      kind:         { type: set, of: { $ref: 'events.yaml#/DeliveryIssueReported/properties/kind' } }
      reportedAt:   { type: set, of: { envelope: occurredAt } }
      resolvedAt:   { type: set, of: { envelope: occurredAt } }
      daypart:      { type: set, of: { envelope: occurredAt, bucket: DAYPART } }
    fold:
      - on: { $ref: 'events.yaml#/DeliveryRequested' }
        set: { $ref: '#/projections/DeliveryIssue/measures/restaurantId' }
        from: { $ref: 'events.yaml#/DeliveryRequested/properties/restaurantId' }
      - on: { $ref: 'events.yaml#/DeliveryIssueReported' }
        set: { $ref: '#/projections/DeliveryIssue/measures/kind' }
        from: { $ref: 'events.yaml#/DeliveryIssueReported/properties/kind' }
      - on: { $ref: 'events.yaml#/DeliveryIssueReported' }
        set: { $ref: '#/projections/DeliveryIssue/measures/reportedAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryIssueReported' }
        set: { $ref: '#/projections/DeliveryIssue/measures/daypart' }
        from: { envelope: occurredAt, bucket: DAYPART }
      - on: { $ref: 'events.yaml#/DeliveryIssueResolved' }
        set: { $ref: '#/projections/DeliveryIssue/measures/resolvedAt' }
        from: { envelope: occurredAt }

  # #639 part C step 3-ii (ADR-20260904-015903 §8): one row per DELIVERY JOB, keyed like DeliveryIssue
  # (birth-seeded, so the denominator for the rate below is every RIDER-ACCEPTED job, read off
  # `assignedAt` being set — not every job, since a partner-fulfilled or never-accepted job can never
  # be handed back). `assignedAt`/`reassignedAt` share one fold source (DeliveryAcceptedByRider,
  # "latest wins"): before any handback they are identical (the one acceptance); once a handback has
  # landed, the NEXT acceptance event is strictly later in the stream and overwrites both, so
  # `reassignedAt` always reads as "the acceptance that followed the last handback" while
  # `handedBackAt` stays put until then — exactly the pair `time_to_reassign_ms` needs. `outcomeAt` is
  # ANY terminal fact (delivered, cancelled, or dispatch-failed) — "does the customer still get that
  # food" reads outcomeAt against foodLocation/handedBackAt.
  DeliveryHandback:
    description: >
      One row per delivery job: when a rider accepted it, picked it up, handed it back and where the
      food was, when it was reassigned, and its eventual outcome. When a rider hands a job back, does
      the customer still get that food, and how often at the dinner peak? `riderId` is job
      ATTRIBUTION only (which rider held the job) — no `metrics:` over this projection may `groupBy`
      `riderId`: a per-rider handback rate is the performance-and-behaviour ground counsel's own gate
      refused before counsel (rules.yaml#/HandBackIsNeverALever, ADR-20260904-014136 §3).
    grain: ENTITY
    key:
      - from: { $ref: 'events.yaml#/DeliveryRequested/properties/deliveryJobId' }
    measures:
      restaurantId: { type: set, of: { $ref: 'events.yaml#/DeliveryRequested/properties/restaurantId' } }
      riderId:      { type: set, of: { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/riderId' } }
      foodLocation: { type: set, of: { $ref: 'events.yaml#/DeliveryHandedBackByRider/properties/foodLocation' } }
      assignedAt:   { type: set, of: { envelope: occurredAt } }
      pickedUpAt:   { type: set, of: { envelope: occurredAt } }
      handedBackAt: { type: set, of: { envelope: occurredAt } }
      reassignedAt: { type: set, of: { envelope: occurredAt } }
      outcomeAt:    { type: set, of: { envelope: occurredAt } }
      daypart:      { type: set, of: { envelope: occurredAt, bucket: DAYPART } }
    fold:
      - on: { $ref: 'events.yaml#/DeliveryRequested' }
        set: { $ref: '#/projections/DeliveryHandback/measures/restaurantId' }
        from: { $ref: 'events.yaml#/DeliveryRequested/properties/restaurantId' }
      - on: { $ref: 'events.yaml#/DeliveryRequested' }
        set: { $ref: '#/projections/DeliveryHandback/measures/daypart' }
        from: { envelope: occurredAt, bucket: DAYPART }
      - on: { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        set: { $ref: '#/projections/DeliveryHandback/measures/riderId' }
        from: { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/riderId' }
      - on: { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        set: { $ref: '#/projections/DeliveryHandback/measures/assignedAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        set: { $ref: '#/projections/DeliveryHandback/measures/reassignedAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryPickedUp' }
        set: { $ref: '#/projections/DeliveryHandback/measures/pickedUpAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
        set: { $ref: '#/projections/DeliveryHandback/measures/foodLocation' }
        from: { $ref: 'events.yaml#/DeliveryHandedBackByRider/properties/foodLocation' }
      - on: { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
        set: { $ref: '#/projections/DeliveryHandback/measures/handedBackAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryCompleted' }
        set: { $ref: '#/projections/DeliveryHandback/measures/outcomeAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryCancelled' }
        set: { $ref: '#/projections/DeliveryHandback/measures/outcomeAt' }
        from: { envelope: occurredAt }
      - on: { $ref: 'events.yaml#/DeliveryDispatchFailed' }
        set: { $ref: '#/projections/DeliveryHandback/measures/outcomeAt' }
        from: { envelope: occurredAt }

  # #639 part C step 4-i (ADR-20260904-081527 §10): how many riders are restricted right now, on
  # which fact, for how long, and how many came back? Keyed on `riderId` alone — a rider CAN be
  # restricted twice, so this is a keying LIMIT the grammar cannot express today (no repeatable-fact
  # grain for a fold key): a second restriction OVERWRITES this row's attribution rather than adding
  # a second one; the immutable Art. 11 LOG (every RiderRestricted/RiderReinstated fact, in order)
  # lives in `domain_events`, never here. `riderId` is deliberately NOT a measure (only the fold
  # KEY) — `groupBy riderId` is therefore UNSPELLABLE (`bam-measure-foreign` rejects a groupBy
  # naming an undeclared measure), never merely a documented refusal: a per-rider restriction rate
  # is the performance-and-behaviour ground counsel's own gate refused before counsel
  # (ADR-20260904-014136 §3), the `HandBackIsNeverALever` shape (rules.yaml).
  RiderRestriction:
    description: >
      How many riders are restricted right now, on which fact, for how long, and how many came
      back? One row per rider (the keying limit above); ground/decidedAt/effectiveAt hold the
      CURRENT restriction's attribution, reinstatedAt the latest reinstatement.
    grain: ENTITY
    key:
      - from: { $ref: 'events.yaml#/RiderRegistered/properties/riderId' }
    measures:
      ground:       { type: set, of: { $ref: 'events.yaml#/RiderRestricted/properties/ground' } }
      decidedAt:    { type: set, of: { $ref: 'events.yaml#/RiderRestricted/properties/decidedAt' } }
      effectiveAt:  { type: set, of: { $ref: 'events.yaml#/RiderRestricted/properties/effectiveAt' } }
      reinstatedAt: { type: set, of: { envelope: occurredAt } }
    fold:
      - on: { $ref: 'events.yaml#/RiderRestricted' }
        set: { $ref: '#/projections/RiderRestriction/measures/ground' }
        from: { $ref: 'events.yaml#/RiderRestricted/properties/ground' }
      - on: { $ref: 'events.yaml#/RiderRestricted' }
        set: { $ref: '#/projections/RiderRestriction/measures/decidedAt' }
        from: { $ref: 'events.yaml#/RiderRestricted/properties/decidedAt' }
      - on: { $ref: 'events.yaml#/RiderRestricted' }
        set: { $ref: '#/projections/RiderRestriction/measures/effectiveAt' }
        from: { $ref: 'events.yaml#/RiderRestricted/properties/effectiveAt' }
      - on: { $ref: 'events.yaml#/RiderReinstated' }
        set: { $ref: '#/projections/RiderRestriction/measures/reinstatedAt' }
        from: { envelope: occurredAt }

  # #639 part C step 6-i (ADR-20260905-101349 §12): one row per RESTAURANT that has ever had at
  # least one RestaurantAccessGranted fact -- unlike RiderRestriction above (a row for EVERY
  # rider, via RiderRegistered as the key event), the key here IS the granting event: a restaurant
  # with no grant never gets a row, which is what makes `countRows` below a DISTINCT-IDENTITY
  # denominator (the count of restaurants, not the count of grants -- a restaurant with three
  # members is ONE row) rather than a counter, inexpressible as one because the population is a
  # SET of identities, not an event tally. Never removed on revoke (the row answers "has this
  # restaurant EVER onboarded staff", the same monotonic-population choice as the `Member` bridge
  # table outliving any one grant, ADR-20260905-101349 §5) -- a restaurant whose only member is
  # later revoked still counts here, which is a DELIBERATE simplification for 6-i's spec-only
  # metric (the roster, 6-iv, is what answers "how many CURRENTLY").
  RestaurantStaffAccess:
    description: >
      Has this restaurant ever had a member's access granted, and when was the most recent one?
      One row per restaurant with at least one RestaurantAccessGranted fact (a restaurant with
      zero grants never appears — the population itself is the answer to "how many restaurants
      have a bound member", never a per-grant tally).
    grain: ENTITY
    key:
      - from: { $ref: 'events.yaml#/RestaurantAccessGranted/properties/scopeId' }
    measures:
      lastGrantedAt: { type: set, of: { envelope: occurredAt } }
    fold:
      - on: { $ref: 'events.yaml#/RestaurantAccessGranted' }
        set: { $ref: '#/projections/RestaurantStaffAccess/measures/lastGrantedAt' }
        from: { envelope: occurredAt }

metrics:
  # THE FLIP'S DATA SET (#167, PR #586 checkpoint — business lens, binding): the
  # ENFORCE_ACCEPTANCE_TIMEOUT TTL must be chosen FROM this distribution, per restaurant and per
  # daypart, not guessed — a 300 s deadline that cancels a quarter of Friday-dinner orders at a
  # slow-but-honest kitchen is a product decision made blind. Declared NOW, independent of the
  # gate: it needs no new events, and history replays from the first OrderPlaced ever appended.
  time_to_accept_ms:
    question: >
      How long does a restaurant take to accept a paid order — p50/p90/p99, by restaurant and by
      daypart? (The number the acceptance-timeout TTL is chosen from, and the ManageOrders
      outcome a restaurant is judged on.)
    activity: { $ref: 'stories.yaml#/restaurant_manager/activities/ManageOrders' }
    over: { $ref: '#/projections/OrderAcceptanceLatency' }
    groupBy:
      - { $ref: '#/projections/OrderAcceptanceLatency/measures/daypart' }
      - { $ref: '#/projections/OrderAcceptanceLatency/measures/restaurantId' }
    value:
      percentiles:
        levels: [50, 90, 99]
        # Rows with no acceptedAt are EXCLUDED from the duration (never accepted ≠ accepted
        # slowly) — they are the numerator of a separate unaccepted-rate read, not noise here.
        ofDurationMs:
          start: { $ref: '#/projections/OrderAcceptanceLatency/measures/placedAt' }
          end:   { $ref: '#/projections/OrderAcceptanceLatency/measures/acceptedAt' }

  # #639 part C step 3-i: the rider's `Deliver` activity carried no metric; this is its first.
  # A ratio over the DeliveryIssue fold: jobs with a reported kind over every job, by daypart,
  # kind and restaurant — the number that says whether the issue door is a rare exit or the
  # Friday-dinner norm at one kitchen. `exposedAs:` stays ABSENT (#484's emitters do not exist).
  delivery_issue_rate:
    question: >
      How often does a rider delivery hit an issue at the dinner peak, by kind — and at which
      restaurants? (The share of jobs on which the rider opened the issue door.)
    activity: { $ref: 'stories.yaml#/rider/activities/Deliver' }
    over: { $ref: '#/projections/DeliveryIssue' }
    groupBy:
      - { $ref: '#/projections/DeliveryIssue/measures/daypart' }
      - { $ref: '#/projections/DeliveryIssue/measures/kind' }
      - { $ref: '#/projections/DeliveryIssue/measures/restaurantId' }
    value:
      ratio:
        # Numerator: rows whose `kind` is set (an issue was reported); denominator: every job row
        # of the group. A job reported twice counts once — the fold keeps the latest kind.
        numerator:   { rowsWhereSet: { $ref: '#/projections/DeliveryIssue/measures/kind' } }
        denominator: { countRows: {} }

  # #639 part C step 3-ii: the same activity's second metric — the paid-order-nobody-is-told-about
  # failure mode, read from the fold. `exposedAs:` stays ABSENT (#484's emitters do not exist).
  handback_rate:
    question: >
      When a rider hands a job back, does the customer still get that food, and how often at the
      dinner peak?
    activity: { $ref: 'stories.yaml#/rider/activities/Deliver' }
    over: { $ref: '#/projections/DeliveryHandback' }
    groupBy:
      - { $ref: '#/projections/DeliveryHandback/measures/daypart' }
      - { $ref: '#/projections/DeliveryHandback/measures/restaurantId' }
    value:
      ratio:
        # Numerator: rows with a handback; denominator: rider-ACCEPTED jobs (assignedAt set) — a
        # never-accepted or partner-fulfilled job can never be handed back, so it is not the base.
        numerator:   { rowsWhereSet: { $ref: '#/projections/DeliveryHandback/measures/handedBackAt' } }
        denominator: { rowsWhereSet: { $ref: '#/projections/DeliveryHandback/measures/assignedAt' } }

  time_to_reassign_ms:
    question: >
      Once a rider hands a job back, how long until the customer's order is reassigned — p50/p90/p99,
      by daypart? (Rows never reassigned are excluded — the numerator of `handback_rate` minus this
      one's population is the still-stranded count the dead-man gauge watches operationally.)
    activity: { $ref: 'stories.yaml#/rider/activities/Deliver' }
    over: { $ref: '#/projections/DeliveryHandback' }
    groupBy:
      - { $ref: '#/projections/DeliveryHandback/measures/daypart' }
    value:
      percentiles:
        levels: [50, 90, 99]
        ofDurationMs:
          start: { $ref: '#/projections/DeliveryHandback/measures/handedBackAt' }
          end:   { $ref: '#/projections/DeliveryHandback/measures/reassignedAt' }

  # #639 part C step 4-i (ADR-20260904-081527 §10): how many restrictions land on each ground —
  # the closed scalar `$ref` (`groupBy` a declared bounded population); the catch-all is its own
  # bucket, same as any other value. `riderId` is unspellable here (see the projection note).
  restrictions_by_ground:
    question: "How many restrictions land on each closed ground (the catch-all its own bucket)?"
    activity: { $ref: 'stories.yaml#/admin/activities/ManageRiderStanding' }
    over: { $ref: '#/projections/RiderRestriction' }
    groupBy:
      - { $ref: '#/projections/RiderRestriction/measures/ground' }
    value:
      countRows: {}

  # "Still restricted" is this gauge's job (rows with no reinstatedAt are excluded from the
  # percentile population, the same shape as time_to_reassign_ms above).
  restricted_to_reinstated_duration_ms:
    question: "Once restricted, how long until a rider is reinstated — p50/p90/p99? (Never-reinstated rows are excluded; 'still restricted' is the gauge's job.)"
    activity: { $ref: 'stories.yaml#/admin/activities/ManageRiderStanding' }
    over: { $ref: '#/projections/RiderRestriction' }
    value:
      percentiles:
        levels: [50, 90, 99]
        ofDurationMs:
          start: { $ref: '#/projections/RiderRestriction/measures/decidedAt' }
          end:   { $ref: '#/projections/RiderRestriction/measures/reinstatedAt' }

  # #639 part C step 6-i (ADR-20260905-101349 §12): the first metric on ManageRestaurantMembership
  # (a NEW activity this step adds to stories.yaml). A distinct-identity denominator, inexpressible
  # as a counter (the projection note): `countRows` here counts ROWS of RestaurantStaffAccess,
  # whose population IS distinct restaurants by construction. No groupBy — the raw population size
  # is the question, the same shape as `restricted_to_reinstated_duration_ms` above. Spec-only
  # until the `bam` runtime exists (#484): `exposedAs:` stays ABSENT, same as every 6-i-adjacent
  # metric on this page.
  restaurants_with_a_bound_member:
    question: "How many restaurants have ever had at least one member's access granted (the reach of staff authentication, 6-i onward)?"
    activity: { $ref: 'stories.yaml#/admin/activities/ManageRestaurantMembership' }
    over: { $ref: '#/projections/RestaurantStaffAccess' }
    value:
      countRows: {}
