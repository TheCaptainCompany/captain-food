version: 3
description: >
  Captain.Food domain model and business events spec.
  Technical envelope fields (eventId, aggregateType, aggregateId, occurredAt, the ACTING USER
  (user_id/user_type), metadata...) are added by infrastructure and MUST NOT be mixed with these payloads.
  NOTE:
  - These are BUSINESS event payloads only.
  - No aggregateType, eventId, occurredAt or metadata here — and NO actor/user id (createdBy/updatedBy/
    changedBy/…): WHO performed the event is envelope metadata, recorded on domain_events.user_id (ADR-0041),
    never duplicated into every payload. (A business ROLE that changes semantics — e.g. Tipper — stays.)
  - Each event MUST be strictly typed and reference scalars/entities above.
  - Catalog is aligned with HubRise (Product/Offer/OptionList). "Updated" events
    carry the FULL updated entity (replace semantics), not a partial diff.

# =====================================================================
# Restaurant
# =====================================================================

RestaurantAccountRegistered:
  description: "A restaurant account (HubRise: restaurant) was created; it owns one or more locations."
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    legalName:
      $ref: 'scalars.yaml#/RestaurantLegalName'
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    defaultCurrency:
      $ref: 'scalars.yaml#/CurrencyCode'
    defaultTaxRate:
      $ref: 'entities.yaml#/TaxRate'
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
  required:
    - restaurantAccountId
    - legalName
    - defaultCurrency
    - defaultTaxRate

RestaurantAccountUpdated:
  description: "One or more account-level fields changed (legal name, contact, default tax, timezone)."
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    legalName:
      $ref: 'scalars.yaml#/RestaurantLegalName'
      nullable: true
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    defaultTaxRate:
      $ref: 'entities.yaml#/TaxRate'
      nullable: true
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
  required:
    - restaurantAccountId

RestaurantAccountDeleted:
  description: "A restaurant account was closed/deleted."
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantAccountId

RestaurantRegistered:
  description: >
    A restaurant location has been registered. Covers every path: an owner/admin onboarding a partner
    location (with accountId), or the Sirene/Google sync ACL seeding a public NON_PARTNER listing
    (no accountId). The listingStatus and externalIdentifiers distinguish them.
  type: object
  properties:
    mode: { $ref: 'scalars.yaml#/Mode' }   # test mode (ADR-0038); optional, absent = LIVE
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
      nullable: true
    listingStatus:
      $ref: 'scalars.yaml#/RestaurantListingStatus'
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    externalIdentifiers:
      type: array
      items:
        $ref: 'entities.yaml#/ExternalIdentifier'
    # NOTE: no `slug` (ADR-20260728-011344). The slug is the STOREFRONT HOST
    # ({slug}.captain.food) — an identity the OWNER chooses during onboarding, not an attribute
    # derivable from a registration. It arrives later via RestaurantSlugConfigured. Deriving it here
    # reserved ~200k hostnames for open-data listings that never opted in, made identity a function
    # of INSEE's mutable denominationUsuelle, and collided systematically (the NIC only
    # disambiguates within a company).
    displayName:
      $ref: 'scalars.yaml#/RestaurantDisplayName'
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    website:
      $ref: 'scalars.yaml#/WebUrl'
      nullable: true
    tags:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
    marginRate:
      $ref: 'scalars.yaml#/MarginPercent'
      nullable: true
    cuisineCategory:
      $ref: 'scalars.yaml#/CuisineCategory'
      nullable: true
    uberPricesOptIn:
      type: boolean
      nullable: true
    address:
      $ref: 'entities.yaml#/Address'
    location:
      $ref: 'entities.yaml#/GeoPoint'
      nullable: true
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
    preparationTimeMinutes:
      type: integer
      minimum: 0
      nullable: true
    openingHours:
      type: array
      items:
        $ref: 'entities.yaml#/OpeningHoursSlot'
  required:
    - restaurantId
    - listingStatus
    - displayName
    - address

RestaurantSlugConfigured:
  description: >
    The restaurant's STOREFRONT ADDRESS has been chosen for the first time — {slug}.captain.food now
    resolves to it (ADR-20260728-011344). Emitted from ConfigureRestaurantSlug during onboarding,
    after ownership is verified and before activation: a restaurant cannot be activated without one.
    The acting user and the moment are envelope metadata (domain_events.user_id / occurred_at,
    ADR-0041), never payload.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    slug:
      $ref: 'scalars.yaml#/Slug'
      description: "The chosen storefront host label. Unique across all CONFIGURED restaurants."
  required:
    - restaurantId
    - slug

RestaurantSlugReconfigured:
  description: >
    The restaurant's storefront address has been CHANGED (ADR-20260728-011344). Distinct from
    RestaurantSlugConfigured because a rename carries an obligation the first configuration does not:
    the previous host is already on printed menus, QR codes, Google listings and inbound links, so it
    must keep resolving. `previousSlug` is business data — it feeds the slug-alias read model that
    serves the 301, and it keeps the old label RESERVED so a competitor cannot claim it and inherit
    the redirect.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    slug:
      $ref: 'scalars.yaml#/Slug'
      description: "The new storefront host label."
    previousSlug:
      $ref: 'scalars.yaml#/Slug'
      description: "The label being superseded — kept reserved, and 301-redirected to `slug`."
  required:
    - restaurantId
    - slug
    - previousSlug

RestaurantUpdated:
  description: "One or more editable LOCATION fields of a restaurant have changed."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    displayName:
      $ref: 'scalars.yaml#/RestaurantDisplayName'
      nullable: true
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    website:
      $ref: 'scalars.yaml#/WebUrl'
      nullable: true
    tags:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
      nullable: true
    marginRate:
      $ref: 'scalars.yaml#/MarginPercent'
      nullable: true
    cuisineCategory:
      $ref: 'scalars.yaml#/CuisineCategory'
      nullable: true
    uberPricesOptIn:
      type: boolean
      nullable: true
    address:
      $ref: 'entities.yaml#/Address'
      nullable: true
    location:
      $ref: 'entities.yaml#/GeoPoint'
      nullable: true
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
    preparationTimeMinutes:
      type: integer
      minimum: 0
      nullable: true
    openingHours:
      type: array
      items:
        $ref: 'entities.yaml#/OpeningHoursSlot'
      nullable: true
  required:
    - restaurantId

RestaurantActivated:
  description: "Restaurant is now visible and orderable by customers."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

RestaurantDeactivated:
  description: "Restaurant can no longer receive orders."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

RestaurantAcceptanceModeChanged:
  description: "Restaurant toggled its order acceptance mode (e.g. busy, paused)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    mode:
      $ref: 'scalars.yaml#/OrderAcceptanceMode'
  required:
    - restaurantId
    - mode

RestaurantRemoved:
  description: "A location was removed (delisted) from its account."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId
    - accountId

RestaurantGoogleBusinessProfileUpdated:
  description: >
    GBP-SPECIFIC metrics for the restaurant's Google Business Profile (place id + Google's rating/reviews)
    were observed/refreshed. Carries ONLY data intrinsic to the Google listing — never general restaurant
    info (name/address/hours/phone/website/tags), which flows through Register/UpdateRestaurant. This keeps
    Sirene and Google feeding the same restaurant side-by-side with no cross-source dependency.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    googlePlaceId:
      $ref: 'scalars.yaml#/GooglePlaceId'
      nullable: true
    rating:
      $ref: 'scalars.yaml#/GoogleRating'
      nullable: true
    reviewsCount:
      type: integer
      minimum: 0
      nullable: true
  required:
    - restaurantId

RestaurantListingClaimed:
  description: "An owner proved ownership of the listing (Google Business Profile verification) and claimed it."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
      nullable: true
    proof:
      type: string
      maxLength: 255
      description: "Reference to the accepted Google ownership proof (audit; the token itself is not stored)."
  required:
    - restaurantId

RestaurantListingOptedOut:
  description: "An owner asked to edit/remove their public listing (opt-out), proven via GBP ownership."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

RestaurantMarkedClosed:
  description: "The establishment was reported closed (e.g. Sirene closure); recorded via the sync ACL."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

RestaurantListingStatusChanged:
  description: "The partnership funnel status changed (NON_PARTNER → PASSIVE_PARTNER → ACTIVE_PARTNER)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    listingStatus:
      $ref: 'scalars.yaml#/RestaurantListingStatus'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId
    - listingStatus

RestaurantGoogleBusinessProfileOrderLinkConfigured:
  description: "The restaurant's GBP 'Order online' link was set to its {slug}.captain.food page (ADR-0021; V1)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    gbpOrderUrl:
      $ref: 'scalars.yaml#/WebUrl'
  required:
    - restaurantId
    - gbpOrderUrl

RestaurantGoogleBusinessProfileOrderLinkVerified:
  description: "The configured GBP 'Order online' link was pinged and its live status recorded (ADR-0021; V1)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    status:
      $ref: 'scalars.yaml#/GbpLinkStatus'
  required:
    - restaurantId
    - status

# --- Prospection (ADR-0020). Facts only — the score is a read-model projection, never an event. ---

ProspectContacted:
  description: "A B2B outreach contact was made to a prospect (NON_PARTNER listing) in the sequence."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    channel:
      $ref: 'scalars.yaml#/OutreachChannel'
    sequenceStep:
      type: integer
      minimum: 0
      description: "Day-offset step in the sequence (e.g. 0 = J+0, 7 = J+7 relance, 21 = J+21)."
  required:
    - restaurantId
    - channel
    - sequenceStep

ProspectMarkedCold:
  description: "A prospect was marked cold (e.g. no reply by J+21); the outreach sequence stops."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

ProspectReplied:
  description: "A prospect replied to outreach; the sequence stops pending human follow-up."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    note:
      type: string
      maxLength: 500
      nullable: true
  required:
    - restaurantId

# =====================================================================
# Catalog (Catalog / CatalogCategory / Product / Offer / OptionList)
# =====================================================================

CatalogCreated:
  description: "A new catalog has been created for a restaurant."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    name:
      $ref: 'scalars.yaml#/CatalogName'
  required:
    - catalogId
    - restaurantId
    - name

CatalogCategoryAdded:
  description: "A category has been added to a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    category:
      $ref: 'entities.yaml#/CatalogCategory'
  required:
    - catalogId
    - restaurantId
    - category

CatalogCategoryUpdated:
  description: "An existing category has been updated (full replace)."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    category:
      $ref: 'entities.yaml#/CatalogCategory'
  required:
    - catalogId
    - restaurantId
    - category

CatalogCategoryRemoved:
  description: "A category has been removed from a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    productCategoryId:
      $ref: 'scalars.yaml#/ProductCategoryId'
  required:
    - catalogId
    - restaurantId
    - productCategoryId

ProductAdded:
  description: "A new product (with its offers) has been added to a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    product:
      $ref: 'entities.yaml#/Product'
  required:
    - catalogId
    - restaurantId
    - product

ProductUpdated:
  description: "An existing product has been updated (full replace, including offers)."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    product:
      $ref: 'entities.yaml#/Product'
  required:
    - catalogId
    - restaurantId
    - product

ProductRemoved:
  description: "A product has been removed from a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    productId:
      $ref: 'scalars.yaml#/ProductId'
  required:
    - catalogId
    - restaurantId
    - productId

OptionListAdded:
  description: "An option list (modifier group) has been added to a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    optionList:
      $ref: 'entities.yaml#/OptionList'
  required:
    - catalogId
    - restaurantId
    - optionList

OptionListUpdated:
  description: "An existing option list has been updated (full replace)."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    optionList:
      $ref: 'entities.yaml#/OptionList'
  required:
    - catalogId
    - restaurantId
    - optionList

OptionListRemoved:
  description: "An option list has been removed from a catalog."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    optionListId:
      $ref: 'scalars.yaml#/OptionListId'
  required:
    - catalogId
    - restaurantId
    - optionListId

OfferStockUpdated:
  description: "Inventory level of a offer changed (e.g. HubRise inventory sync)."
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    offerId:
      $ref: 'scalars.yaml#/OfferId'
    stock:
      $ref: 'entities.yaml#/Stock'
  required:
    - catalogId
    - restaurantId
    - offerId
    - stock

CatalogImported:
  description: >
    A full catalog was imported/synced from an external source (e.g. HubRise),
    replacing the current catalog content for the restaurant.
  type: object
  properties:
    catalogId:
      $ref: 'scalars.yaml#/CatalogId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    source:
      type: string
      enum: [HUBRISE, MANUAL]
    categories:
      type: array
      items:
        $ref: 'entities.yaml#/CatalogCategory'
    products:
      type: array
      items:
        $ref: 'entities.yaml#/Product'
    optionLists:
      type: array
      items:
        $ref: 'entities.yaml#/OptionList'
  required:
    - catalogId
    - restaurantId
    - source
    - categories
    - products
    - optionLists

# =====================================================================
# Customer
# =====================================================================
# Identity/credentials are managed by the auth provider (Supabase Auth).
# Only the creation of the domain Customer is an event. Sign-in, password
# reset, token refresh and sessions are NOT domain events.

CustomerRegistered:
  description: >
    A customer account was created on first phone verification (passwordless OTP,
    identity managed by the auth provider). Phone number is the primary identifier.
  type: object
  properties:
    mode: { $ref: 'scalars.yaml#/Mode' }   # test mode (ADR-0038); optional, absent = LIVE
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    authRef:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
      description: "Auth provider user id (e.g. Supabase Auth), linking identity to this Customer."
    phone:
      $ref: 'scalars.yaml#/PhoneNumber'
    displayName:
      $ref: 'scalars.yaml#/CustomerDisplayName'
      nullable: true
    email:
      $ref: 'scalars.yaml#/EmailAddress'
      nullable: true
      description: "Optional, e.g. captured later for receipts."
    locale:
      $ref: 'scalars.yaml#/Locale'
      nullable: true
      description: "Preferred culture (language + date/time/number display)."
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
  required:
    - customerId
    - phone

CustomerIdentified:
  description: >
    A returning visitor signed in and was resolved to an existing Customer (authRef → customerId).
    NOT an auth event (OTP/session live in the auth provider): this records the DOMAIN fact so the
    visitor's OPEN guest carts can be bound to the customerId — letting carts started on different
    devices converge under one customer and be merged at checkout.
    Thanks to the sessionId, the existing open cart(s) can be bound to the customerId and merged at checkout. This is a domain event, not an auth event.
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    authRef:
      $ref: 'scalars.yaml#/ExternalReference'
      description: "Auth provider user id that was matched to this Customer (via Customer.auth_ref)."
    sessionId:
      $ref: 'scalars.yaml#/SessionId'
      description: "Session id (ADR-0041) for the sign-in event; not required for cart binding."
  required:
    - customerId
    - authRef
    - sessionId

CartBoundToCustomer:
  description: >
    A cart that was started by a guest visitor (no customerId) was bound to a Customer after sign-in.
    This is a domain event, not an auth event. The cartId is the same as the original guest cart; the
    cart's customerId is now set to the signed-in customer.
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
  required:
    - cartId
    - customerId

RestaurantFavorited:
  description: "Customer marked a restaurant as a favorite."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required: [customerId, restaurantId]

RestaurantUnfavorited:
  description: "Customer removed a restaurant from their favorites."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required: [customerId, restaurantId]

CustomerInfoUpdated:
  description: "Customer updated their display name. (Email is verified-only — see CustomerEmailVerified.)"
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    displayName:
      $ref: 'scalars.yaml#/CustomerDisplayName'
      nullable: true
  required: [customerId]

CustomerEmailVerified:
  description: "An email was verified (Supabase magic link) and linked to the Customer — initial set OR a later change."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    email:
      $ref: 'scalars.yaml#/EmailAddress'
  required: [customerId, email]

CustomerPhoneChanged:
  description: "The Customer's phone was changed after re-verification (canonical E.164)."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    phone:
      $ref: 'scalars.yaml#/PhoneNumber'
  required: [customerId, phone]

CustomerLanguageChanged:
  description: "The Customer's preferred language (locale) was set/changed; localizes later SMS/email sends."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    locale:
      $ref: 'scalars.yaml#/Locale'
  required: [customerId, locale]

CustomerPreferencesSet:
  description: "Customer set their discovery + i18n preferences (timezone, dietary restrictions, favorite cuisines). Language is CustomerLanguageChanged."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
    dietaryTags:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
    favoriteCuisines:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
  required: [customerId]

CustomerAddressSet:
  description: "Customer added or updated a saved delivery address."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    addressId:
      $ref: 'scalars.yaml#/AddressId'
    label:
      type: string
      maxLength: 80
      nullable: true
    address:
      $ref: 'entities.yaml#/Address'
  required: [customerId, addressId, address]

CustomerAddressRemoved:
  description: "Customer removed a saved address."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    addressId:
      $ref: 'scalars.yaml#/AddressId'
  required: [customerId, addressId]

CustomerPaymentMethodSet:
  description: "Customer set or updated their preferred Stripe payment method."
  type: object
  properties:
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
    paymentMethodId:
      $ref: 'scalars.yaml#/PaymentMethodId'
  required: [customerId, paymentMethodId]



# =====================================================================
# Cart
# =====================================================================
# Pre-checkout selection. High-churn and often abandoned, so payloads stay minimal (ids +
# quantity); display prices are derived by the read projection, not carried here.

CartStarted:
  description: "A new cart was created for a restaurant (emitted with the first line added)."
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    sessionId:
      $ref: 'scalars.yaml#/SessionId'
      description: "The visitor session that started the cart — the key CartBindingProcess uses to bind guest carts on CustomerIdentified."
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
      description: "Null while the visitor is a guest; bound at checkout."
  required:
    - cartId
    - restaurantId
    - sessionId

CartLineAdded:
  description: "A line was added to a cart."
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    line:
      $ref: 'entities.yaml#/CartLineItem'
  required:
    - cartId
    - line

CartLineQuantityChanged:
  description: "The quantity of an existing cart line changed."
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    cartLineId:
      $ref: 'scalars.yaml#/CartLineId'
    quantity:
      type: integer
      minimum: 1
  required:
    - cartId
    - cartLineId
    - quantity

CartLineRemoved:
  description: "A line was removed from a cart."
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    cartLineId:
      $ref: 'scalars.yaml#/CartLineId'
  required:
    - cartId
    - cartLineId

CartCheckedOut:
  description: "The cart was converted to an order at checkout and is now closed."
  type: object
  properties:
    cartId:
      $ref: 'scalars.yaml#/CartId'
    orderId:
      $ref: 'scalars.yaml#/OrderId'
  required:
    - cartId
    - orderId

# =====================================================================
# Orders
# =====================================================================

OrderPlaced:
  description: "A customer has placed an order and payment was successfully authorized/captured."
  type: object
  properties:
    mode: { $ref: 'scalars.yaml#/Mode' }   # test mode (ADR-0038); optional, absent = LIVE
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    customerContact:
      $ref: 'entities.yaml#/CustomerContact'
    serviceType:
      $ref: 'scalars.yaml#/ServiceType'
    deliveryAddress:
      $ref: 'entities.yaml#/Address'
      nullable: true
    items:
      type: array
      items:
        $ref: 'entities.yaml#/OrderLineItem'
      minItems: 1
    totalAmount:
      $ref: 'entities.yaml#/Money'
    breakdown:
      $ref: 'entities.yaml#/PaymentBreakdown'
      description: "Server-computed fee/split breakdown (ADR-0016/0017); breakdown.total == totalAmount."
    note:
      $ref: 'scalars.yaml#/OrderNote'
      nullable: true
    replacementOf:
      $ref: 'scalars.yaml#/OrderId'
      nullable: true
      description: >
        Set when this order is a NO-CHARGE replacement remade for a resolved reclamation
        (ReclamationResolved REPLACEMENT, ADR-20260726-171736 / #159): the id of the ORIGINAL order it
        replaces. A replacement is a normal Order that flows through the usual fulfilment/dispatch, but
        carries a $0 buyer total and NO paymentIntentId (no Stripe). Absent for an ordinary paid order.
    paymentIntentId:
      $ref: 'scalars.yaml#/PaymentIntentId'
      nullable: true
      description: >
        The captured Stripe PaymentIntent for a paid order. ABSENT for a no-charge replacement order
        (replacementOf set) — no money moved, so there is no PaymentIntent (ADR-20260726-171736).
  required:
    - orderId
    - restaurantId
    - customerContact
    - serviceType
    - items
    - totalAmount
    - breakdown

OrderAcceptedByRestaurant:
  description: "Restaurant has accepted to prepare the order."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    estimatedReadyAt:
      type: string
      format: date-time
      nullable: true
  required:
    - orderId
    - restaurantId

OrderPreparationStarted:
  description: "Restaurant has started preparing an accepted order (status PREPARING)."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required:
    - orderId
    - restaurantId

OrderRejectedByRestaurant:
  description: "Restaurant has rejected the order."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
  required:
    - orderId
    - restaurantId
    - reason

OrderMarkedReady:
  description: "Restaurant has marked the order as ready for pickup/delivery."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required:
    - orderId
    - restaurantId

OrderDelivered:
  description: "The order has been delivered to the customer."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required:
    - orderId
    - restaurantId

OrderCancelledByCustomer:
  description: "The customer cancelled the order."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - orderId
    - restaurantId

OrderCancelledByRestaurant:
  description: "The restaurant cancelled the order after initial acceptance."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
  required:
    - orderId
    - restaurantId
    - reason

OrderRated:
  description: "The customer rated the delivery of a completed order (rider thumbs up/down)."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    riderThumb:
      $ref: 'scalars.yaml#/ThumbRating'
  required:
    - orderId
    - restaurantId
    - riderThumb

RestaurantRated:
  description: "The customer rated the restaurant of a completed order (0–5 stars + optional comment)."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    stars:
      $ref: 'scalars.yaml#/StarRating'
    comment:
      $ref: 'scalars.yaml#/RatingComment'
      nullable: true
  required:
    - orderId
    - restaurantId
    - stars

DeliverySatisfactionRecorded:
  description: >
    The customer answered the delivery-delay satisfaction survey for a delivered order (#62): the
    timeliness verdict (+ an optional reason when TOO_LATE). Recorded once per order.
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    timeliness:
      $ref: 'scalars.yaml#/DeliveryTimeliness'
    reason:
      $ref: 'scalars.yaml#/DeliveryDissatisfactionReason'
      nullable: true
  required:
    - orderId
    - restaurantId
    - timeliness

OrderTipped:
  description: >
    A tipper (customer or restaurant) added one or more tips (rider / restaurant / Captain) on an order
    (ADR-012). Separate from the price; Captain keeps 0%. Additive — multiple OrderTipped accumulate.
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    tippedBy:
      $ref: 'scalars.yaml#/Tipper'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    tips:
      type: array
      minItems: 1
      items:
        $ref: 'entities.yaml#/Tip'
  required:
    - orderId
    - restaurantId
    - tippedBy
    - tips

RefundRequested:
  description: "The customer requested a refund for an order; the RefundProcess will drive Stripe."
  type: object
  properties:
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - orderId
    - restaurantId

# =====================================================================
# Payments (Stripe)
# =====================================================================
# Money stays strongly typed internally (Money value object). The Stripe-side
# ids (paymentIntentId, refundId) are provider references kept as scalars.
# These are the payment branch of the PlaceOrder saga and the refund path of
# RejectOrder / CancelOrder* (see commands.yaml).
# NOTE: PaymentCaptured / PaymentFailed / PaymentRefunded are INBOUND integration
# events — reported by Stripe (webhooks) and recorded as facts, NOT emitted by a
# command. Only PaymentIntentCreated is command-initiated. See CLAUDE.md "Commands
# vs inbound (integration) events".

PaymentIntentCreated:
  description: >
    A payment intent was created at checkout for a pending order. Carries the full priced checkout frozen
    at intent creation (`checkout`), so PlaceOrderProcess can rebuild OrderPlaced + CartCheckedOut from the
    event log alone when PaymentCaptured arrives (no out-of-log store). `checkout.restaurantId`/`customerId`
    duplicate the top-level fields and `checkout.totalAmount == amount == checkout.breakdown.total`.
  type: object
  properties:
    paymentIntentId:
      $ref: 'scalars.yaml#/PaymentIntentId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
    amount:
      $ref: 'entities.yaml#/Money'
    checkout:
      $ref: 'entities.yaml#/CheckoutSnapshot'
      description: "The full priced checkout frozen at intent creation (rebuilds OrderPlaced/CartCheckedOut on capture)."
  required:
    - paymentIntentId
    - restaurantId
    - amount
    - checkout

PaymentCaptured:
  description: "Payment was successfully authorized/captured for an order."
  type: object
  properties:
    paymentIntentId:
      $ref: 'scalars.yaml#/PaymentIntentId'
    orderId:
      $ref: 'scalars.yaml#/OrderId'
      nullable: true
      description: "Null when captured before the Order aggregate is created in the saga."
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    amount:
      $ref: 'entities.yaml#/Money'
  required:
    - paymentIntentId
    - restaurantId
    - amount

PaymentFailed:
  description: "Payment authorization/capture failed; no order is placed."
  type: object
  properties:
    paymentIntentId:
      $ref: 'scalars.yaml#/PaymentIntentId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
  required:
    - paymentIntentId
    - restaurantId
    - reason

PaymentRefunded:
  description: "A captured payment was refunded (e.g. after rejection or cancellation)."
  type: object
  properties:
    refundId:
      $ref: 'scalars.yaml#/RefundId'
    paymentIntentId:
      $ref: 'scalars.yaml#/PaymentIntentId'
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    amount:
      $ref: 'entities.yaml#/Money'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required:
    - refundId
    - paymentIntentId
    - orderId
    - restaurantId
    - amount

# ============================================================================
# Delivery (bounded context: delivery) — ADR-0031
# Command-driven facts (DeliveryRequested is emitted by DeliveryDispatchProcess,
# mirroring PlaceOrderProcess→OrderPlaced; the rest come from independent-rider commands).
# ============================================================================

DeliveryRequested:
  description: >
    A delivery job has been created for a ready DELIVERY order and offered for fulfilment (dispatched to a
    partner and/or made available to independent riders). Emitted by DeliveryDispatchProcess.
  type: object
  properties:
    mode: { $ref: 'scalars.yaml#/Mode' }   # test mode (ADR-0038); optional, absent = LIVE
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    pickup:
      $ref: 'entities.yaml#/Address'
      description: "Restaurant pickup address."
    dropoff:
      $ref: 'entities.yaml#/Address'
      description: "Customer delivery address."
    provider:
      $ref: 'scalars.yaml#/DeliveryProvider'
      nullable: true
      description: "Intended channel when known at request time; resolved for certain on acceptance."
  required: [deliveryJobId, orderId, restaurantId, pickup, dropoff]

DeliveryAcceptedByRider:
  description: "An independent Captain rider accepted the delivery job."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    riderId:
      $ref: 'scalars.yaml#/RiderId'
  required: [deliveryJobId, riderId]

DeliveryPickedUp:
  description: "The rider collected the order from the restaurant."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    riderId:
      $ref: 'scalars.yaml#/RiderId'
    at:
      type: string
      format: date-time
  required: [deliveryJobId, riderId]

DeliveryCompleted:
  description: "The rider handed the order over to the customer (independent-rider delivery success)."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    at:
      type: string
      format: date-time
  required: [deliveryJobId]

DeliveryCancelled:
  description: "A delivery job was cancelled before delivery (e.g. by the restaurant or admin)."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]

DeliveryDispatchFailed:
  description: >
    Dispatch failed terminally: the delivery partner declined the job at every offer attempt (cap of 3
    total offers, ADR-20260720-004556). Emitted by DeliveryDispatchProcess (like DeliveryRequested) so
    read models surface the failed job to the restaurant for manual handling; no automatic retry follows.
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    orderId:
      $ref: 'scalars.yaml#/OrderId'
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    attempts:
      type: integer
      description: "Total offer attempts made before giving up (the cap; the birth offer counts as 1)."
    lastReason:
      type: string
      maxLength: 500
      nullable: true
      description: "Reason carried by the final partner decline, when the partner gave one."
  required: [deliveryJobId, orderId, restaurantId, attempts]

DeliveryEscalationRequested:
  description: >
    An operator (restaurant/admin) asked to skip the delivery channel currently offered and advance the
    ranked walk now (#60). Emitted by the DeliveryJob aggregate handling the EscalateDelivery command;
    consumed by DeliveryDispatchProcess, which offers the next ranked channel (or fails closed when the
    walk is exhausted). Internal dispatch mechanics — feeds no View_*.
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    reason:
      type: string
      maxLength: 500
      nullable: true
      description: "Why the operator escalated (optional free text)."
  required: [deliveryJobId]

DeliveryOfferTimedOut:
  description: >
    An outstanding delivery offer expired before the channel answered (#60): the DeliveryOfferTimeoutWorker
    found an OFFERED run older than the resolved TTL and records this fact (authored like
    DeliveryDispatchFailed). Recorded by the DeliveryJob aggregate and consumed by DeliveryDispatchProcess,
    which advances the ranked walk to the next channel (or fails closed when exhausted). Internal dispatch
    mechanics — feeds no View_*.
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    channel:
      $ref: 'scalars.yaml#/DeliveryChannelKey'
      description: "The channel whose offer timed out."
    rank:
      type: integer
      description: "1-based rank of the timed-out channel in the city's ranked walk."
    reason:
      type: string
      maxLength: 500
      nullable: true
      description: "Optional detail (e.g. the resolved TTL that elapsed)."
  required: [deliveryJobId, channel, rank]

# NOTE: DeliveryAcceptedByPartner / DeliveryRejectedByPartner / DeliveryStatusUpdated are INBOUND
# integration events — reported by the delivery partner (e.g. Avelo37) through the avelo37-acl and
# recorded as facts, NOT emitted by a command (nothing to validate/reject). Idempotent on partnerRef.
# See CLAUDE.md "Commands vs inbound (integration) events".

DeliveryAcceptedByPartner:
  description: "The delivery partner (e.g. Avelo37) accepted the job and assigned one of its couriers (inbound)."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    partnerRef:
      $ref: 'scalars.yaml#/ExternalReference'
      description: "Partner-side delivery id; idempotent key for inbound updates."
    courier:
      $ref: 'entities.yaml#/Courier'
    estimatedPickupAt:
      type: string
      format: date-time
      nullable: true
    estimatedDropoffAt:
      type: string
      format: date-time
      nullable: true
  required: [deliveryJobId, partnerRef, courier]

DeliveryRejectedByPartner:
  description: "The delivery partner declined the job (inbound); the dispatcher must re-offer or fall back to manual."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    partnerRef:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]

DeliveryStatusUpdated:
  description: "The delivery partner reported a status change for the job (inbound): PICKED_UP, OUT_FOR_DELIVERY, DELIVERED, FAILED…"
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    partnerRef:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    status:
      $ref: 'scalars.yaml#/DeliveryStatus'
    occurredAt:
      type: string
      format: date-time
    note:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId, status]

# =====================================================================
# Delivery — operational facts (DeliveryJob aggregate)
# =====================================================================

DeliveryAssignedToPartner:
  description: "A delivery job was assigned to a delivery partner (e.g. Avelo37) for fulfilment."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    partnerRef:
      $ref: 'scalars.yaml#/ExternalReference'
      description: "Partner-side delivery id; idempotent key for inbound updates."
  required: [deliveryJobId, partnerRef]

DeliveryUnassignedFromPartner:
  description: "A delivery job was unassigned from its partner (e.g. to re-offer it elsewhere)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]

DeliveryPartnerStatusUpdated:
  description: "A partner-driven status change applied to the job by the DeliveryJob aggregate (from the inbound partner report)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    partnerRef:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
    status: { $ref: 'scalars.yaml#/DeliveryStatus' }
    occurredAt:
      type: string
      format: date-time
  required: [deliveryJobId, status]

DeliveryDeclinedByRider:
  description: "An independent rider declined a pending delivery job (stays PENDING, re-offerable)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId, riderId]

DeliveryIssueReported:
  description: "An issue was reported on a delivery job (by the rider, partner, or support)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    riderId:
      $ref: 'scalars.yaml#/RiderId'
      nullable: true
    issue:
      type: string
      maxLength: 1000
    reportedAt:
      type: string
      format: date-time
  required: [deliveryJobId, issue]

DeliveryIssueResolved:
  description: "A previously reported delivery issue was resolved."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    resolution:
      type: string
      maxLength: 1000
    resolvedAt:
      type: string
      format: date-time
  required: [deliveryJobId, resolution]

# =====================================================================
# Delivery partner self-registration (#61)
# =====================================================================
# A delivery partner declares availability to serve a city on a known catalog channel via the EXTERNAL
# API; an admin approves or the partner/admin revokes. Facts on the DeliveryPartnerRegistration stream.

DeliveryPartnerAvailabilityRequested:
  description: >
    A delivery partner self-registered its availability to serve a city on a catalog channel (#61). The
    registration's birth fact; lands PENDING until an admin approves it.
  type: object
  properties:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
    channel: { $ref: 'scalars.yaml#/DeliveryChannelKey' }
    cityId: { $ref: 'scalars.yaml#/CityId' }
    partnerName: { $ref: 'scalars.yaml#/DeliveryPartnerName' }
    contactEmail: { $ref: 'scalars.yaml#/EmailAddress' }
  required: [registrationId, channel, cityId, partnerName, contactEmail]

DeliveryPartnerAvailabilityApproved:
  description: "An admin approved a delivery partner's city availability (#61); it becomes eligible for the city's dispatch ranking."
  type: object
  properties:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
  required: [registrationId]

DeliveryPartnerAvailabilityRevoked:
  description: "A delivery partner's city availability was revoked — withdrawn by the partner or disabled by an admin (#61); no longer eligible."
  type: object
  properties:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [registrationId]

# =====================================================================
# Rider (independent Captain courier)
# =====================================================================

RiderRegistered:
  description: "An independent Captain rider registered (linked to the auth provider user)."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    authRef:
      $ref: 'scalars.yaml#/ExternalReference'
      description: "Auth-provider user reference (Supabase), like the Customer's authRef."
    displayName:
      type: string
      maxLength: 200
    phone: { $ref: 'scalars.yaml#/PhoneNumber' }
    status: { $ref: 'scalars.yaml#/RiderStatus' }
  required: [riderId, authRef, displayName, phone, status]

RiderInfoUpdated:
  description: "One or more editable rider profile fields changed."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    displayName:
      type: string
      maxLength: 200
      nullable: true
    phone:
      $ref: 'scalars.yaml#/PhoneNumber'
      nullable: true
  required: [riderId]

RiderStatusChanged:
  description: "A rider's availability/lifecycle status changed."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    status: { $ref: 'scalars.yaml#/RiderStatus' }
  required: [riderId, status]

# =====================================================================
# Refund (restaurant- or admin-approved; RefundProcess state PM)
# =====================================================================

RefundOpened:
  description: >
    A refundable fact on a paid order (rejection, cancellation, customer request) opened a refund for a
    restaurant/admin decision. Delivered by RefundProcess to the Payment aggregate ONLY when the payment
    is CAPTURED, so the refund queue (View_PendingRefunds) folds from the log, not from PM state.
    `amount` is the captured order total eligible for refund (an approval may still be partial).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    amount:
      $ref: 'entities.yaml#/Money'
      description: "The captured order total eligible for refund (the decision may approve less)."
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [orderId, restaurantId, amount]

RefundApproved:
  description: "The restaurant or an admin approved a refund; the RefundProcess will drive the Stripe refund for this amount."
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    amount:
      $ref: 'entities.yaml#/Money'
      description: "Approved refund amount (may be partial)."
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [orderId, amount]

RefundDenied:
  description: "The restaurant or an admin denied a pending refund request."
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    reason:
      type: string
      maxLength: 500
  required: [orderId, reason]

# --- Order conversations (#129) ---

ConversationOpened:
  description: >
    Birth of the per-order in-app conversation (id = orderId; ADR-20260725-015921). Snapshots whether
    customer<->restaurant direct chat is enabled for this order (default true).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true   # guest orders have no customer participant (#235 consequence A: the aggregate folds the participants it authorizes against)
    customerChatEnabled: { type: boolean }
  required: [orderId, restaurantId, customerChatEnabled]

MessagePosted:
  description: >
    A message was appended to an order's conversation. `visibility` splits customer-visible (PUBLIC)
    from staff-only (INTERNAL); `authorRole` is the business role that posted it; idempotent by messageId.
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    messageId: { $ref: 'scalars.yaml#/ConversationMessageId' }
    authorRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
    visibility: { $ref: 'scalars.yaml#/MessageVisibility' }
    body: { $ref: 'scalars.yaml#/MessageBody' }
    originalLocale: { $ref: 'scalars.yaml#/Locale' }
    attachmentRefs:
      type: array
      items: { $ref: 'scalars.yaml#/AttachmentRef' }
      nullable: true
  required: [orderId, messageId, authorRole, visibility, body, originalLocale]

MessageTranslationAdded:
  description: >
    A posted conversation message was translated into a target locale and the result cached (persisted)
    for reuse (translate once, reuse; #129). Idempotent per (message, locale).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    messageId: { $ref: 'scalars.yaml#/ConversationMessageId' }
    locale: { $ref: 'scalars.yaml#/Locale' }
    text: { $ref: 'scalars.yaml#/TranslatedText' }
  required: [orderId, messageId, locale, text]

AdminInvitedToConversation:
  description: >
    An admin was pulled into an order's conversation through a reasoned escalation by the restaurant or
    rider (rules.yaml#/AdminJoinsByReasonedEscalation) (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    reason: { $ref: 'scalars.yaml#/EscalationReason' }
  required: [orderId, reason]

ParticipantMuted:
  description: >
    A participant role was muted in an order's conversation, with a recorded justification
    (rules.yaml#/MuteRequiresAReason). `until` bounds the mute in time; absent = indefinite (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    mutedRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
    reason: { $ref: 'scalars.yaml#/MuteReason' }
    until:
      type: string
      format: date-time
      nullable: true
  required: [orderId, mutedRole, reason]

ParticipantUnmuted:
  description: >
    A previously muted participant role was unmuted in an order's conversation
    (rules.yaml#/OnlyMutedParticipantsCanBeUnmuted) (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    mutedRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
  required: [orderId, mutedRole]

# --- Reclamations / customer claims (#151) ---

ReclamationOpened:
  description: >
    Birth of a customer reclamation over a delivered order (id = reclamationId; #153). Records the
    category, the customer's description and — optionally — the resolution the customer requested.
    Carries `customerId` (whose claim) and `restaurantId` (on whose restaurant's order) — business data
    the client supplies, mirroring how OrderPlaced carries them — so the read model can scope "my
    claims" and the restaurant's claims queue (#154). The 14-day window and order-eligibility (order
    exists/delivered) are enforced in the application layer when opening, not by the aggregate (#151).
  type: object
  properties:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    customerId: { $ref: 'scalars.yaml#/CustomerId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    category: { $ref: 'scalars.yaml#/ReclamationCategory' }
    description: { $ref: 'scalars.yaml#/ReclamationDescription' }
    requestedResolution:
      $ref: 'scalars.yaml#/ReclamationResolution'
      nullable: true
  required: [reclamationId, orderId, customerId, restaurantId, category, description]

ReclamationResolved:
  description: >
    A reclamation was decided (resolved). Carries the chosen `resolution` and, for a PARTIAL_REFUND or a
    GOODWILL_CREDIT, the `refundAmount` — so the downstream refund/credit/replacement slices can react to
    the recorded decision. The aggregate records the DECISION only; it performs no money-move (#151).
    `orderId` AND `customerId` ride along (sourced from the aggregate's own fold state, established at
    ReclamationOpened) so the claim lifecycle can be woven into the per-order conversation thread, keyed by
    order (§2.5, #155), and so the ReclamationProcess saga can grant goodwill credit to the claimant
    without a read step (ADR-20260726-163737, #158).
  type: object
  properties:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    customerId: { $ref: 'scalars.yaml#/CustomerId' }
    resolution: { $ref: 'scalars.yaml#/ReclamationResolution' }
    note:
      $ref: 'scalars.yaml#/ReclamationReason'
      nullable: true
    refundAmount:
      $ref: 'entities.yaml#/Money'
      nullable: true
  required: [reclamationId, orderId, customerId, resolution]

ReclamationRejected:
  description: >
    A reclamation was rejected (the claim was declined) with a recorded reason
    (rules.yaml#/ReclamationRejectionCarriesAReason) (#151). `orderId` rides along (from the aggregate's
    fold state) so the claim lifecycle weaves into the per-order conversation thread, keyed by order (#155).
  type: object
  properties:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    reason: { $ref: 'scalars.yaml#/ReclamationReason' }
  required: [reclamationId, orderId, reason]

ReclamationReopened:
  description: >
    A previously decided (resolved or rejected) reclamation was reopened for another look
    (rules.yaml#/OnlyDecidedReclamationsCanBeReopened). `reason` is optional — a reopen need not state why
    — mirroring the optional command input (there is no reason-required guard on reopen, unlike reject)
    (#151). `orderId` rides along (from the aggregate's fold state) so the claim lifecycle weaves into the
    per-order conversation thread, keyed by order (#155).
  type: object
  properties:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    reason:
      $ref: 'scalars.yaml#/ReclamationReason'
      nullable: true
  required: [reclamationId, orderId]

ReclamationEvidenceAttached:
  description: >
    The customer attached an evidence photo to their claim — an opaque, framework-managed attachment ref
    (storage/moderation/GDPR retention handled generically by the framework, not this aggregate; #156).
    Evidence may be attached in any lifecycle state — the only guard is that the claim exists. `orderId`
    rides along (from the aggregate's fold state, established at ReclamationOpened) so the evidence weaves
    into the per-order conversation thread, keyed by order (§2.5, #155).
  type: object
  properties:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    attachmentRef: { $ref: 'scalars.yaml#/AttachmentRef' }
  required: [reclamationId, orderId, attachmentRef]

# --- Customer store-credit ledger (CustomerCredit aggregate, ADR-20260726-163737, #158) ---

CustomerCreditGranted:
  description: >
    Goodwill store credit was granted to a customer (id = customerId). Emitted by the CustomerCredit
    aggregate when the ReclamationProcess saga resolves a claim as GOODWILL_CREDIT. `reclamationId` is the
    idempotent grant key: at most one grant per resolved claim, so a re-delivered ReclamationResolved never
    double-grants. `amount` (Money) increases the customer's available balance.
  type: object
  properties:
    customerId: { $ref: 'scalars.yaml#/CustomerId' }
    amount: { $ref: 'entities.yaml#/Money' }
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  required: [customerId, amount, reclamationId]

CustomerCreditConsumed:
  description: >
    Store credit was spent by a customer at checkout (id = customerId). `amount` (Money) decreases the
    available balance; `orderId` is the order the credit was applied to. Consuming more than the available
    balance is rejected (errors.yaml#/InsufficientCustomerCredit) — the balance never goes negative. Driven
    by the checkout flow (a flagged follow-up, ADR-20260726-163737 §checkout-consume); recorded as a fact.
  type: object
  properties:
    customerId: { $ref: 'scalars.yaml#/CustomerId' }
    amount: { $ref: 'entities.yaml#/Money' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  required: [customerId, amount, orderId]

# --- Order retention & deletion (GDPR pilot: ADR-20260731-153000 / -160000 / -214500, #272) ---

OrderExpired:
  description: >
    The order's retention window elapsed — at this moment the order IS expired: no discussion, no
    rejection possible (ADR-20260731-153000 §1a: a FACT, never a command). Scheduled by the Order
    actor's OrderExpired reminder when a terminal lifecycle fact is recorded (`schedules:` on the
    terminal receives, ADR-20260731-214500 §2), delivered by the promotion pass when due, and
    recorded with record semantics (Recorded, or Ignored/Duplicate — never Rejected). Recording it
    starts the order's exit from the system (ADR-20260731-160000): projections fold it to tombstone
    their rows, and the generic deletion engine reacts to the recorded fact with the journey that
    ends in the OrderDeleted receipt. The erasure ACTION on this recording is a STUB until the
    engine's journey lands (#194 "GDPR erasure").
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  required: [orderId]

OrderDeleted:
  description: >
    The deletion receipt (ADR-20260731-160000 §6): recorded on the DELETION LEDGER stream — never on
    the (about-to-be / already deleted) order streams — when the generic deletion engine's journey
    completes (projection checkpoints verified → technical tombstone appended → streams deleted from
    domain_events + domain_stream). Carries PSEUDONYMOUS domain references only: whose order was
    erased must remain answerable (GDPR accountability), but never the erased personal payloads
    (address, phone, conversation content — those are gone).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true
      description: "Null for a guest order — the accountability reference, not personal data."
    policy:
      type: string
      maxLength: 100
      description: "The configuration key naming the retention window under which erasure ran (ORDER_RETENTION_WINDOW_DAYS)."
    tombstoneEventId:
      type: string
      maxLength: 36
      nullable: true
      description: "The technical tombstone event (envelope-level, ADR-20260731-160000 §5) that instructed the stream deletion — the receipt's 'deleted, thanks to tombstone <id>' stamp."
  required: [orderId, restaurantId, policy]
