version: 1
description: >
  customer scope — api fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `api.yaml` catalog; $refs stay kind-logical
  (`api.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

types:


  # Boundary / projection types with no dedicated entity OR view (shape is fully inline).
  CustomerProfile:
    description: >
      A customer's own profile (display name + contact). Backed by the identity read model; surfaced
      to the customer only (profile management is V1 — no V0 query yet).
    reads: [{ $ref: 'database/tables/projection_tables.yaml#/Customer' }]
    properties:
      customerId: { $ref: 'scalars.yaml#/CustomerId' }
      displayName: { $ref: 'scalars.yaml#/CustomerDisplayName', nullable: true }
      email: { $ref: 'scalars.yaml#/EmailAddress', nullable: true }
      emailVerified: { type: boolean }
      phone: { $ref: 'scalars.yaml#/PhoneNumber' }
      locale: { $ref: 'scalars.yaml#/Locale', nullable: true }
      timezone: { $ref: 'scalars.yaml#/TimeZone', nullable: true }

  # --- GDPR erasure (PROP-20260829-150752 §3.1/§3.6; #708) ---
  CustomerErasure:
    description: >
      The state of ONE erasure request, as the data subject is entitled to see it (Art. 12/15), plus
      the disclosure limb of §3.6 once the receipt exists: what was retained and under which
      instrument. Every field is PSEUDONYMOUS — this type must keep answering after the customer's
      stream is gone, so a name or an address here would either have to die with the stream (leaving
      the subject unable to check the erasure they asked for) or survive it (making the erasure a
      lie).
    reads: [{ $ref: 'database/projection_views.yaml#/View_CustomerErasure' }]
    properties:
      erasureRequestId: { $ref: 'scalars.yaml#/ErasureRequestId' }
      status: { $ref: 'scalars.yaml#/ErasureStatus' }
      cancelledAt: { type: string, format: date-time, nullable: true }
      policy: { type: string, nullable: true }
      retainedUnder:
        type: array
        items: { type: string }
        description: "Approved retention-window catalog names — the source the 'what was retained and why' copy interpolates its instrument and horizon from, so the screen and the enforcement cannot drift apart."

queries:


  me:
    description: "The signed-in customer's own profile (resolves the session authRef → Customer via Customer)."
    returns: { $ref: '#/types/CustomerProfile', nullable: true }
    roles: [CUSTOMER]
    slice: V1

  erasureStatus:
    description: >
      The authenticated customer's own erasure request, or null when none exists. NO ARGS BY DESIGN:
      the subject is derived from AUTH CONTEXT server-side, never supplied by the client. A required
      `customerId!` here would be exactly the #745 unfulfillable class — an identity fact the account
      route has no source for, so the read would fail structurally on every paint — AND it would let
      any authenticated caller ask about somebody else's deletion, which is a disclosure of the most
      sensitive thing this product knows about a person.
      Answers before AND after the erasure completes: pre-receipt from the folded request row,
      post-receipt from the same row now carrying the receipt's policy and retained-under limbs.
      CONFIRM-WHILE-LOGGED-OUT is deliberately NOT served here (see the mutation roles): this query
      is CUSTOMER-only, so a subject who has signed out follows their emailed link, confirms, and
      then sees the status by signing in — the status surface never becomes an unauthenticated
      lookup of "what is happening to this account".
    returns: { $ref: '#/types/CustomerErasure', nullable: true }
    roles: [CUSTOMER]
    slice: V1

mutations:


  # Identity — Supabase Auth wrapped behind GraphQL (ADR-0015). The client never calls Supabase directly.
  requestPhoneVerification:
    command: { $ref: 'commands.yaml#/RequestPhoneVerification' }
    roles: [PUBLIC, CUSTOMER]   # anonymous visitor starts phone sign-in
    slice: V0

  verifyPhone:
    command: { $ref: 'commands.yaml#/VerifyPhone' }
    roles: [PUBLIC, CUSTOMER]   # verify OTP → register (new) or identify (returning)
    slice: V0
    # Returning phone => the SAME customerId is re-resolved (idempotent identify); the client reads
    # its identity via `me` once the operation SUCCEEDs (acceptance-first, ADR-20260720-015500).

  requestEmailVerification:
    command: { $ref: 'commands.yaml#/RequestEmailVerification' }
    roles: [CUSTOMER]
    slice: V1

  confirmEmailVerification:
    command: { $ref: 'commands.yaml#/ConfirmEmailVerification' }
    roles: [CUSTOMER]
    slice: V1

  requestPhoneChange:
    command: { $ref: 'commands.yaml#/RequestPhoneChange' }
    roles: [CUSTOMER]
    slice: V1

  confirmPhoneChange:
    command: { $ref: 'commands.yaml#/ConfirmPhoneChange' }
    roles: [CUSTOMER]
    slice: V1

  changeLanguage:
    command: { $ref: 'commands.yaml#/ChangeLanguage' }
    roles: [CUSTOMER]
    slice: V1

  markRestaurantAsFavorite:
    command: { $ref: 'commands.yaml#/MarkRestaurantAsFavorite' }
    roles: [CUSTOMER]
    slice: V1

  unmarkRestaurantAsFavorite:
    command: { $ref: 'commands.yaml#/UnmarkRestaurantAsFavorite' }
    roles: [CUSTOMER]
    slice: V1

  updateCustomerInfo:
    command: { $ref: 'commands.yaml#/UpdateCustomerInfo' }
    roles: [CUSTOMER]
    slice: V1

  setCustomerPreferences:
    command: { $ref: 'commands.yaml#/SetCustomerPreferences' }
    roles: [CUSTOMER]
    slice: V1

  setCustomerAddress:
    command: { $ref: 'commands.yaml#/SetCustomerAddress' }
    roles: [CUSTOMER]
    slice: V1

  removeCustomerAddress:
    command: { $ref: 'commands.yaml#/RemoveCustomerAddress' }
    roles: [CUSTOMER]
    slice: V1

  setCustomerPaymentMethod:
    command: { $ref: 'commands.yaml#/SetCustomerPaymentMethod' }
    roles: [CUSTOMER]
    slice: V1

  # --- GDPR erasure (PROP-20260829-150752 §3.1; #708). Role = path: these live only on the
  # /customer/graphql schema. All three SHIP DARK behind `RUN_DELETION_ENGINE` and refuse with
  # `ErasureEngineUnavailable` while it is off — a typed rejection, never a silent accept.
  requestErasure:
    command: { $ref: 'commands.yaml#/RequestCustomerErasure' }
    roles: [CUSTOMER]
    slice: V1
    # Acceptance-first (ADR-20260720-015500): the mutation returns the operation handle and the
    # client reads `erasureStatus` once it SUCCEEDs. Idempotent while one request is pending.

  confirmErasure:
    command: { $ref: 'commands.yaml#/ConfirmCustomerErasure' }
    roles: [CUSTOMER]
    slice: V1
    # CONFIRM-WHILE-LOGGED-OUT, stated explicitly because it is a real product decision and not an
    # oversight: this is CUSTOMER-only, so the token alone does NOT authorize the confirm from an
    # anonymous session. A subject who followed the link after signing out signs in first. The
    # alternative — PUBLIC plus a bearer token — turns a link forwarded, logged by a mail provider or
    # sitting in a shared inbox into a complete account-destruction capability held by whoever has
    # the URL. Requiring both the session and the token keeps an irreversible act behind two facts.

  cancelErasure:
    command: { $ref: 'commands.yaml#/CancelCustomerErasure' }
    roles: [CUSTOMER]
    slice: V1
    # Re-login-cancels is the user's act. Deliberately does NOT refuse when the engine is gated off:
    # a customer must always be able to stop a deletion, whatever state our machinery is in.
