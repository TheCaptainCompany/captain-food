version: 1
description: >
  customer scope — rules fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `rules.yaml` catalog; $refs stay kind-logical
  (`rules.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# --- Customer ---
PhoneVerificationRegistersOrIdentifies:
  description: "Phone-OTP verification registers a new customer or identifies a returning one; an invalid code is rejected."

OtpSendIsGuardedByCountryAndBudget:
  description: >
    An SMS OTP is sent ONLY to a dialing code on the served allowlist, ONLY within this number's
    per-hour and per-day allowance, and ONLY while the platform's global daily SMS ceiling has room;
    otherwise the request is refused with a typed reason and NOTHING is handed to the sender. The
    global ceiling is the ECONOMIC control and the only one that bounds the TOTAL spend — an
    attacker rotates numbers so per-number caps multiply, and a ceiling-capped day grosses an
    attacker a few euros, which destroys the pumping economics for every range; the allowlist's job
    is cost containment (never paying a premium destination rate for a message we never wanted)
    plus refusing what we cannot serve; and the guard is fail-closed — a number that cannot be
    parsed is refused, never sent.

    One phone number has ONE budget, whichever door asks and however the number is written:
    '0612345678', '00612345678' and '612345678' under '+33' share a single counter, and requesting a
    phone CHANGE draws on the same budget as requesting verification — a budget keyed on the request
    rather than on the number is doubled by asking twice, differently.

EmailVerificationUniqueTokenValid:
  description: "Email verification requires a unique email and a valid token; duplicates/invalid tokens are rejected."

PhoneChangeVerifiedAndUnique:
  description: "A phone change is verified and must be unique; a duplicate is rejected."

CustomerProfileUpdate:
  description: "A customer can change language and profile info; an update with no field is rejected."

CustomerPreferences:
  description: "A customer's preferences can be set."

FavoritesManagement:
  description: "A customer can favorite/unfavorite restaurants; favoriting an unknown one is rejected and unfavoriting a non-favorite is a no-op."

AddressBookManagement:
  description: "A customer can add/update and remove saved delivery addresses."

PaymentMethodStorage:
  description: "A customer's payment method can be stored."

# --- GDPR erasure (PROP-20260829-150752; #708) ---
ErasureIsRequestedConfirmedThenExecuted:
  description: >
    Erasure takes TWO round-trips before anything is destroyed: a request that can be REFUSED (an
    open order or funds in flight), then a confirmation proved by a one-shot token. Only the
    confirmation arms the deletion; a request alone never destroys anything, and a token that does
    not verify is rejected with its own typed error — never the email magic link's, which means a
    different secret entirely.

ErasureIsCancellableByTheSubjectWithinTheWindow:
  description: >
    Inside the grace window the subject, and ONLY the subject, can withdraw the erasure
    (re-login-cancels). There is no admin resurrection: an erasure an operator can undo is not an
    erasure. Cancelling stays available whatever state the deletion engine is in — a customer must
    always be able to stop a deletion in progress, which is why the cancel path alone does not
    refuse when the engine is gated off.

ErasureIsRefusedWhileTheEngineIsGatedOff:
  description: >
    While the deletion engine is gated OFF, the erasure mutations REFUSE with a typed error instead
    of accepting. Accepting a request nothing can execute would start the Art. 12(3) thirty-day
    clock on a journey that will never run and show the subject "scheduled" forever — the erasure
    analogue of a paid order nobody is told about, and worse, because the subject stops chasing a
    right they believe is being honoured.

ErasureUnlinkingIsRecordedAsAnInboundFact:
  description: >
    The auth provider's confirmation that the identity was deleted at its end is recorded as an
    INBOUND fact with no command: an external event that already happened cannot be rejected.
    Unlinking is a distinct act from erasure and a mandatory leg — erasing our stream without
    provider-side revocation leaves the foreign model holding exactly what we deleted.
