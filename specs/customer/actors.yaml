version: 1
description: >
  customer scope — actors fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `actors.yaml` catalog; $refs stay kind-logical
  (`actors.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


Customer:
  type: aggregate
  identity: { $ref: '#/Customer/state/customerId' }
  mailbox:
    partitions: 5            # keyspace WIDTH (workers lease ranges of it) — PROP-20260728-152752 §2
  description: "A customer identity, keyed by phone number and linked to the auth provider user (authRef)."
  receives:
    # Identity via phone OTP / email magic link — WRAPPED Supabase Auth (ADR-0015). The handler calls
    # Supabase SYNCHRONOUSLY through the supabase-acl adapter; request/* emit nothing, verify/confirm
    # emit the verified FACT. The aggregate stays free of the Supabase SDK (the ACL boundary does the call).
    # The SEND GUARDS (#516) are part of this message's contract, not an infrastructure detail: the
    # send spends money on our own OVHcloud account from an anonymous endpoint, so a refusal must be a
    # TYPED fact the screen can render honestly. Four distinguishable outcomes, in enforcement order:
    # country not served -> too soon (RateLimited, with the server's countdown) -> this number's daily
    # allowance -> the GLOBAL daily ceiling. Fail-closed: an unparseable number is PhoneCountryNotServed.
    - message: { $ref: 'commands.yaml#/RequestPhoneVerification' }
      emits: []
      throws:
        - { $ref: 'errors.yaml#/PhoneCountryNotServed' }
        - { $ref: 'errors.yaml#/RateLimited' }
        - { $ref: 'errors.yaml#/VerificationSendLimitReached' }
        - { $ref: 'errors.yaml#/VerificationSendCapacityExhausted' }
      effect: "Delegate to Supabase Auth: send an SMS OTP (OVHcloud SMS hook; mock in dev), REFUSING when the guards say so. No event."
    - message: { $ref: 'commands.yaml#/VerifyPhone' }
      emits:
        - { $ref: 'events.yaml#/CustomerRegistered' }
        - { $ref: 'events.yaml#/CustomerIdentified' }
      throws:
        - { $ref: 'errors.yaml#/InvalidVerificationCode' }
        - { $ref: 'errors.yaml#/VerificationCodeExpired' }
      effect: "Verify the OTP with Supabase, then register (first phone → CustomerRegistered) or identify (returning → CustomerIdentified); CartBindingProcess then binds the visitor's open carts."
    - message: { $ref: 'commands.yaml#/RequestEmailVerification' }
      emits: []
      throws:
        - { $ref: 'errors.yaml#/EmailAlreadyInUse' }
      effect: "Delegate to Supabase Auth: send an email magic link (localized via the stored locale). No event."
    - message: { $ref: 'commands.yaml#/ConfirmEmailVerification' }
      emits: [{ $ref: 'events.yaml#/CustomerEmailVerified' }]
      throws:
        - { $ref: 'errors.yaml#/InvalidVerificationToken' }
        - { $ref: 'errors.yaml#/VerificationCodeExpired' }
      effect: "Verify the magic-link token server-side with Supabase, then link the email."
    # Shares ONE send budget with RequestPhoneVerification (#516): the counter is keyed on the
    # canonical phone number, never on the command, or the cap would be per-command and doubled by
    # asking through the other door. So it carries the same four send-guard refusals.
    - message: { $ref: 'commands.yaml#/RequestPhoneChange' }
      emits: []
      throws:
        - { $ref: 'errors.yaml#/PhoneAlreadyInUse' }
        - { $ref: 'errors.yaml#/PhoneCountryNotServed' }
        - { $ref: 'errors.yaml#/RateLimited' }
        - { $ref: 'errors.yaml#/VerificationSendLimitReached' }
        - { $ref: 'errors.yaml#/VerificationSendCapacityExhausted' }
      effect: "Delegate to Supabase Auth: send an SMS OTP to the new phone, REFUSING when the send guards say so. No event."
    - message: { $ref: 'commands.yaml#/ConfirmPhoneChange' }
      emits: [{ $ref: 'events.yaml#/CustomerPhoneChanged' }]
      throws:
        - { $ref: 'errors.yaml#/InvalidVerificationCode' }
        - { $ref: 'errors.yaml#/VerificationCodeExpired' }
        - { $ref: 'errors.yaml#/PhoneAlreadyInUse' }
      effect: "Verify the OTP on the new phone, then change the phone (canonical E.164)."
    - message: { $ref: 'commands.yaml#/ChangeLanguage' }
      emits: [{ $ref: 'events.yaml#/CustomerLanguageChanged' }]
      throws: []
      effect: "Persist the preferred locale; later authenticated SMS/email sends use it."
    - message: { $ref: 'commands.yaml#/MarkRestaurantAsFavorite' }
      emits: [{ $ref: 'events.yaml#/RestaurantFavorited' }]
      throws:
        - { $ref: 'errors.yaml#/RestaurantNotFound' }
    - message: { $ref: 'commands.yaml#/UnmarkRestaurantAsFavorite' }
      emits: [{ $ref: 'events.yaml#/RestaurantUnfavorited' }]
      throws: []
      effect: "Idempotent: unfavoriting a non-favorite is a no-op."
    - message: { $ref: 'commands.yaml#/UpdateCustomerInfo' }
      emits: [{ $ref: 'events.yaml#/CustomerInfoUpdated' }]
      throws:
        - { $ref: 'errors.yaml#/NoEditableFieldProvided' }
    - message: { $ref: 'commands.yaml#/SetCustomerPreferences' }
      emits: [{ $ref: 'events.yaml#/CustomerPreferencesSet' }]
      throws: []
    - message: { $ref: 'commands.yaml#/SetCustomerAddress' }
      emits: [{ $ref: 'events.yaml#/CustomerAddressSet' }]
      throws: []
    - message: { $ref: 'commands.yaml#/RemoveCustomerAddress' }
      emits: [{ $ref: 'events.yaml#/CustomerAddressRemoved' }]
      throws: []
      effect: "Idempotent: removing an unknown address is a no-op."
    - message: { $ref: 'commands.yaml#/SetCustomerPaymentMethod' }
      emits: [{ $ref: 'events.yaml#/CustomerPaymentMethodSet' }]
      throws: []
    # --- GDPR erasure (PROP-20260829-150752 §3.1/§3.2; #708) -----------------------------------
    # Erasure is a rejectable COMMAND pair, not an event: an open order or funds in flight is a
    # set-based precondition the write side checks, and an event cannot be refused (young, vernon).
    # Every leg also throws `ErasureEngineUnavailable`, and in THIS chunk it throws it
    # UNCONDITIONALLY: the handlers refuse every erasure command and record nothing, because the
    # journey that would execute one is the next chunk. That is a typed refusal, never a silent
    # accept (farley) — accepting a request nothing can run would start the Art. 12(3) clock on a
    # journey that will never execute and show the subject "scheduled" forever.
    # NOT YET GATED, and the distinction is load-bearing: `RUN_DELETION_ENGINE` gates the deletion
    # ENGINE POD (c4-l2.yaml), not these mutations. Wiring the refusal to read that key is part of
    # the runtime chunk, where there is finally an ON branch for it to select. Until then the
    # refusal is unconditional, which is strictly safer than a gate whose ON side does nothing.
    - message: { $ref: 'commands.yaml#/RequestCustomerErasure' }
      emits: [{ $ref: 'events.yaml#/CustomerErasureRequested' }]
      throws:
        - { $ref: 'errors.yaml#/ErasureBlockedByOpenOrder' }
        - { $ref: 'errors.yaml#/ErasureEngineUnavailable' }
      effect: "Record the Art. 17 request (acceptance-first, returns the erasureRequestId) and send the confirmation token. Idempotent while one is pending — the same id comes back and nothing new is recorded."
    - message: { $ref: 'commands.yaml#/ConfirmCustomerErasure' }
      emits: [{ $ref: 'events.yaml#/CustomerErasureConfirmed' }]
      throws:
        - { $ref: 'errors.yaml#/InvalidErasureConfirmationToken' }
        - { $ref: 'errors.yaml#/ErasureNotRequested' }
        - { $ref: 'errors.yaml#/ErasureEngineUnavailable' }
      effect: "Verify the token server-side, then record the confirmation. The grace window is scheduled from here as a REMINDER, so the moment it elapses becomes a recorded fact rather than an engine-internal timer."
      schedules:
        - { $ref: '#/Customer/reminders/CustomerErasureDue' }
    - message: { $ref: 'commands.yaml#/CancelCustomerErasure' }
      emits: [{ $ref: 'events.yaml#/CustomerErasureCancelled' }]
      throws:
        - { $ref: 'errors.yaml#/ErasureNotRequested' }
      effect: "The subject keeps their account (re-login-cancels — the user's act, never an admin resurrection). Deliberately does NOT throw ErasureEngineUnavailable: a customer must always be able to stop a deletion, whatever state the engine is in."
    # INBOUND INTEGRATION FACT, no command (ADR-0004): the provider confirmed the identity is gone.
    # Recorded here so the erasure journey's unlink leg has a foldable completion fact in the log
    # rather than a return value nobody can replay.
    - message: { $ref: 'events.yaml#/CustomerIdentityUnlinked' }
      emits: [{ $ref: 'events.yaml#/CustomerIdentityUnlinked' }]
      deferred:
        reason: >
          MODELLING: identity is Supabase-side and deliberately not business data (the auth wrapper is identity-only), so whether the Customer aggregate records an unlink AT ALL is the open question. No recorder, no fold rule.
        issue: "https://github.com/TheCaptainCompany/captain-food/issues/786"
      effect: "Record the auth provider's confirmation that the subject's identity was deleted at its end (Art. 28 processor instruction completed). Idempotent under re-delivery."
    # The grace window elapsing is a RECORDED fact, not an engine-internal timer — record semantics,
    # never rejected (ADR-20260731-153000 §1a). It is what projections fold to move the subject's
    # status, and what the deletion trigger fires on.
    - message: { $ref: '#/Customer/reminders/CustomerErasureDue' }
      emits: [{ $ref: 'events.yaml#/CustomerErasureDue' }]
      deferred:
        reason: >
          MODELLING: the Customer fold has no erasure-due rule, so nothing answers "already reflected?" and a redelivery would append a second due-date. This is a LEGAL clock with no second copy anywhere, so the delivery PARKS (never terminal) until the rule exists.
        issue: "https://github.com/TheCaptainCompany/captain-food/issues/786"
      effect: "The grace window elapsed: record it. CustomerErasureProcess then re-checks the open-order precondition and, only if it passes, begins the destructive legs."

  # The `deletion:` block — the recorded grammar of ADR-20260731-214500, reused, not reinvented.
  # The engine's journey is unchanged (tombstone through projections, including View_Customer.auth_ref
  # — the access-control artifact #708 names — then technical tombstone, stream deletion, ledger
  # receipt). What Customer adds beyond the Order pilot is BESPOKE LEGS, which is the recorded escape
  # hatch of §4: "an aggregate needing bespoke steps falls back to a hand-written PM — `deletion:` is
  # sugar over the same machinery." Those legs are CustomerErasureProcess.
  #
  # The grace window lives on the REMINDER, exactly as the Order pilot's does — NOT on the trigger.
  # The reason is ADR-20260731-160000 §2's, and it applies with more force here: the expiry must be a
  # recorded business fact projections can fold, because it is the moment the subject's own status
  # screen changes from "you can still cancel" to "this is running". An engine-internal timer would
  # move that screen with no foldable cause in the log.
  # `reschedule: keep` on purpose (#167's shape, not the pilot's `in-place`): a redelivered,
  # duplicate-absorbed confirmation must NOT push the deletion date out again — the FIRST
  # scheduled_at wins, because the subject was told a date and re-delivery is not a new decision.
  reminders:
    CustomerErasureDue:
      payload: { $ref: 'events.yaml#/CustomerErasureDue' }
      after: { $ref: 'configuration.yaml#/keys/CUSTOMER_ERASURE_GRACE_WINDOW_DAYS' }
      reschedule: keep
  # THE `deletion:` BLOCK IS DEFERRED TO THE RUNTIME CHUNK, and the deletion ENGINE is what proved
  # it must be. Declaring it here does not describe a promise — it CHANGES THE RUNNING SYSTEM, in
  # two ways this chunk cannot honour:
  #   1. `DeletionEngine::new` validates EVERY declared policy at construction. A Customer block
  #      with no receipt builder makes the engine fail to construct AT ALL — so declaring it here
  #      would have broken ORDER erasure in production, an existing, working, legally-required
  #      journey. That is a regression, not an incomplete feature.
  #   2. The block needs `cancelled_on:` (re-login-cancels is the designed behaviour and the
  #      subject's own act), and the engine refuses it outright: the UNDO PASS IS NOT BUILT
  #      (deletion.rs). Declaring the block WITHOUT `cancelled_on` would be far worse than not
  #      declaring it — a cancelled erasure would still destroy the account, silently, which is the
  #      one outcome no part of this design tolerates.
  # So the block lands in the runtime chunk together with its receipt builder and the undo pass,
  # where the three test each other. Everything the block would have referenced already exists here
  # and is validated: the commands, the confirmed/cancelled/due facts, `CustomerErased`, the
  # reminder that schedules the grace window, and the rules that pin the ladder. What is missing is
  # exactly the machinery, and it is missing HONESTLY rather than declared and inert.
  # Shape it must take (unchanged from PROP-20260829-150752 §3.2, recorded so it is not re-derived):
  #   deletion:
  #     triggers:
  #       - on:           [CustomerErasureDue]
  #         cancelled_on: [CustomerErasureCancelled]
  #         match: { event: CustomerErasureDue.customerId, state: Customer.customerId }
  #     receipt: CustomerErased
  # The receipt builder must read `erasureRequestId` off the CONFIRMED fact (scanning in reverse:
  # request → cancel → request again is legal on one stream, and only the last confirmation
  # authorised the run), never off a merely-requested one, and never from the Customer fold —
  # every field on a receipt that outlives the erasure must be one we are allowed to keep.
