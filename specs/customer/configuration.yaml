version: 1
description: >
  customer scope — configuration fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `configuration.yaml` catalog; $refs stay kind-logical
  (`configuration.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

keys:


  # ===================================================================
  # SMS-OTP SEND GUARDS (#516) — the money controls on an anonymous endpoint
  #
  # `requestPhoneVerification` is anonymous BY DESIGN (a visitor has no identity yet to rate-limit),
  # and every accepted send spends real money on OUR OVHcloud account (ADR-20260722-174500). That is
  # the exact shape SMS pumping automates: drive OTP requests at premium-payout ranges the attacker
  # shares revenue on, and the bill arrives overnight.
  #
  # Three guards, and they do DIFFERENT jobs — do not treat one as a substitute for another:
  #   * the ALLOWLIST removes the attack's economics (there is no revenue share on a French mobile);
  #   * the PER-NUMBER caps stop one number being pumped;
  #   * the GLOBAL DAILY CEILING is the only one that bounds the TOTAL BILL, because an attacker
  #     rotates numbers and per-number caps then multiply instead of limiting.
  #
  # All FIVE keys have defaults, so the guards are ON with no configuration. The env override exists
  # so the ceiling can be raised or dropped to zero WITHOUT a deploy (the kill switch).
  # ===================================================================

  SMS_ALLOWED_DIALING_CODES:
    type: string
    default: "+33,+32,+41,+44,+49,+34,+39,+1"
    gates: >
      Comma-separated `DialingCode` allowlist for OTP delivery — EXACT membership, never a prefix
      match (a prefix test passes '+337…' and is not an allowlist). A number whose code is absent, or
      which cannot be parsed at all, is refused with `errors.yaml#/PhoneCountryNotServed` and NOTHING
      is handed to the sender (fail-closed).

      WHY THIS SET, AND WHY THE BOUNDARY IS "PAYOUT TIER" RATHER THAN "EU": pumping profit lives in
      high-payout mobile ranges, which these are not. V0 serves Tours, so '+33' is the traffic — but
      Tours has international students and Loire-valley tourists, a real single-digit share of
      signups, and a '+33'-only list would refuse those real customers while buying no additional
      protection, since none of BE/CH/UK/DE/ES/IT/US pays an attacker anything. Widening this list is
      therefore not a matter of taste: adding a code opens a spend path, and the question to answer
      first is what a send to that range PAYS, not which union the country belongs to.

      Unset, the default above applies. Set it to '+33' alone to harden further; there is no value
      that disables the check.


  SMS_MAX_SENDS_PER_NUMBER_PER_HOUR:
    type: int
    default: 3
    gates: >
      OTP sends allowed to ONE canonical phone number per rolling hour. 3 covers the real fumbling
      customer (one send plus one or two resends); beyond that a further SMS is not what fixes their
      problem. Exceeding it is `errors.yaml#/RateLimited`, carrying the remaining window so the screen
      renders the server's countdown rather than guessing one.


  SMS_MAX_SENDS_PER_NUMBER_PER_DAY:
    type: int
    default: 5
    gates: >
      OTP sends allowed to ONE canonical phone number per rolling day — the backstop that stops an
      hourly allowance being harvested 24 times. Exceeding it is
      `errors.yaml#/VerificationSendLimitReached`, which deliberately offers help instead of a
      countdown, because counting down to tomorrow is not information.


  SMS_SEND_BACKOFF_SECONDS:
    type: string
    default: "30,120,600"
    gates: >
      Comma-separated cooldown after the Nth send to the same number, in seconds: 30s after the first,
      2min after the second, 10min after the third and beyond (the last value repeats). This is the
      SERVER-SIDE control; the client's resend countdown is a courtesy, never an enforcement point —
      a caller that ignores it is refused, not served.


  SMS_MAX_SENDS_PER_DAY_GLOBAL:
    type: int
    default: 200
    gates: >
      THE KILL SWITCH AND THE ONLY CEILING ON THE BILL. Total OTP sends allowed platform-wide per
      rolling day, across every number. Once spent, every further send is refused with
      `errors.yaml#/VerificationSendCapacityExhausted` until the ceiling is raised — which DOES turn
      real sign-ups away, and is the correct trade against an unbounded invoice, but only because it
      is loud (`otp_send_refused_total{reason=global_ceiling}`, and each refusal logs at ERROR).

      THE DEFAULT IS A DELIBERATELY CONSERVATIVE GUESS, NOT A COSTED NUMBER. The per-message price of
      our OVH credit pack is not recorded anywhere in this repository, so no ceiling here can be
      derived — 200/day is chosen as "comfortably above any plausible V0 day in Tours, low enough that
      the worst overnight case is tens of euros rather than hundreds". It must be re-derived from the
      real EUR/SMS the day that price is known (see ADR-20260813-021500).

      OPERABLE WITHOUT A DEPLOY, two ways, and both matter: setting the env key and restarting the
      surface changes the ceiling persistently, while `UPDATE sms_send_quota SET sent_count = <big>
      WHERE quota_key = 'global:day'` stops sends IMMEDIATELY on a live system with no rollout at all
      (and `DELETE` on that row restores them). The second is the one to use at 02:00.
