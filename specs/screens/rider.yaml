# ==============================================================================
# Captain.Food — Rider UI Specification (Spec-Driven Server-Driven UI)
# ------------------------------------------------------------------------------
# The RIDER APP: the independent courier's job surface — assigned/available delivery jobs, the
# pickup→dropoff flow (accept → confirm pickup → complete) and the contact rows — served at
# riders.captain.food (audience role RIDER; host→surface convention in the split-4 ADR). One file per
# audience (ADR-0037 as refined by ADR-20260722-091500); siblings: `restaurant_frontoffice.yaml`,
# `captain_frontoffice.yaml`, `restaurant_backoffice.yaml`.
#
# Same two-layer contract as every surface (ADR-0033): a `resolvers`/`actions` data-layer allowlist
# $ref-bound to api.yaml. Binds ONLY existing api.yaml operations (zero new API surface) and REUSES
# the shared renderer registry declared in `restaurant_frontoffice.yaml` — no new component kinds.
# Every user-visible string is a `$ref` into `rider.translations.yaml` (sidecar,
# ADR-20260722-101500) or the shared `translations.yaml`.
# ==============================================================================

version: 1
spec_version: "1.0.0"
app_id: captain.food.rider
app_name: "Captain.Food Rider"
base_url: "https://riders.captain.food"
default_locale: fr
supported_locales: [en, fr]
app_types: [web, ios, android]   # couriers live on phones; web is the V0 vehicle (ADR-0037)

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — RESOLVERS (reads). Both bound to EXISTING api.yaml queries.
# ──────────────────────────────────────────────────────────────────────────────
resolvers:
  deliveries.mine:  { query: { $ref: 'api.yaml#/queries/myDeliveries' } }
  delivery.byOrder: { query: { $ref: 'api.yaml#/queries/delivery' } }
  # #639 part C step 4-ii (ADR-20260904-124600 §4): the `/restricted` screen's ONE read — every
  # binding path on that screen is `standing.*` (the resolver alias root is the key's FIRST
  # segment, `standing`; `standing.mine` -> `standing.*`, never `myStanding.*`).
  standing.mine: { query: { $ref: 'api.yaml#/queries/myStanding' } }

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — ACTIONS. The pickup→dropoff flow; `mark_order_delivered` redeclares the
# back-office binding IDENTICALLY (union rule). The online/offline availability toggle is a
# recorded GAP: api.yaml has no rider-status mutation yet.
# ──────────────────────────────────────────────────────────────────────────────
actions:
  navigate: { kind: client }
  phone_call: { kind: client }
  accept_delivery:   { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/acceptDelivery' } }
  confirm_pickup:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/confirmPickup' } }
  complete_delivery: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/completeDelivery' } }
  mark_order_delivered: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/markOrderDelivered' }, note: "Self-dispatch: the restaurant confirms the handover itself." }
  rider_toggle_online: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/changeRiderStatus' }, note: "The online/offline availability toggle (#95 closed the gap)." }
  # The issue doors (#639 part C step 3-i, ADR-20260904-015903 §4/§7): report by closed kind from
  # the job's "Un problème" sheet (report-only path; the handback exit is 3-ii), refuse a PENDING
  # offer from the list. In-app only — no call button anywhere (SUPPORT-CONTACT: no voice leg).
  # `riderId` is deliberately NOT bound anywhere on this surface (#865): api.yaml's `derived:`
  # declares it DERIVED from the caller's `ReadScope::Rider` at the resolver seam — the rider
  # surface never had a rider-identity root to bind it FROM (this comment used to say so as a gap;
  # #865 closes it by removing the need, not by adding a root), and the generated Input type no
  # longer carries the field at all.
  report_delivery_issue: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/reportDeliveryIssue' } }
  decline_delivery:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/declineDelivery' } }
  # The handback door (#639 part C step 3-ii, ADR-20260904-015903 §1/§7): the sheet's second exit.
  # `riderId` is likewise DERIVED (#865) — never bound here.
  hand_back_delivery:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/handBackDelivery' } }
  # The sign-in door (#639 part C step 2c): two identify-only `roles: [PUBLIC]` mutations, reachable
  # from this surface ONLY through the `sign_in` screen's `graphql_role: PUBLIC` (R1, PROP-20260831-180622
  # §5). The session itself never travels in a GraphQL response: `claim_session` collects it from
  # `POST /auth/session` after the confirmation is accepted.
  request_rider_sign_in_code: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/requestRiderSignInCode' } }
  confirm_rider_sign_in:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/confirmRiderSignIn' } }

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL CHROME
# ──────────────────────────────────────────────────────────────────────────────
global_components:
  rider_topbar:
    id: rider_topbar
    type: sticky_header
    slots:
      left: [{ type: logo, asset: "/assets/logo.svg", link: "/" }]
      center:
        - { type: text, value: { $ref: 'rider.translations.yaml#/rider.title' } }
      right:
        - type: button
          id: online_toggle
          label: { $ref: 'rider.translations.yaml#/rider.go_online' }
          variant: outline
          action: { type: rider_toggle_online }

# ──────────────────────────────────────────────────────────────────────────────
# BOTTOM SHEETS — the code entry of the sign-in door. Mounted hidden on every screen (renderer
# rule) but opened ONLY by the `sign_in` screen's request button, so its PUBLIC-only confirmation
# is bound by that screen alone (the validator follows `open_bottom_sheet` edges when it computes
# what a screen binds).
# ──────────────────────────────────────────────────────────────────────────────
bottom_sheets:
  # "Un problème" (#639 part C step 3-i/3-ii; ADR-20260904-015903 §7 — one control, two exits).
  # REGRESSION FIX (review round 2 on #870): `RenderContext` reads resolver data only (`lookup`,
  # `renderer.rs`) — a `visible_when`/`conditional_section` keyed on a FORM FIELD (`issue_exit.value`)
  # evaluates against nothing at paint, and `visible_when` fails CLOSED, so nested content never
  # appeared and the driver never re-evaluates conditions after a chip pick (`interact.rs` toggles
  # only sheets and inline_error) — no in-sheet re-render exists to save it either. The single
  # first-choice sheet is now a ROUTER: two buttons, each an `open_bottom_sheet` edge (a real SDUI
  # transition, not a form-field condition) into its own sheet. `rider_report_sheet` (3-i, "Je
  # continue, mais…") and `rider_handback_sheet` (3-ii, "Je ne peux pas continuer") hold their real
  # content UNCONDITIONALLY except where the condition is genuinely resolver data
  # (`delivery.status`, which `lookup` DOES serve at paint) — kept, because that one evaluates
  # correctly. No free-text `reason` anywhere on the handback exit (legal: HandBackDelivery carries
  # none).
  rider_issue_sheet:
    id: rider_issue_sheet
    type: bottom_sheet
    title: { $ref: 'rider.translations.yaml#/rider.issue.title' }
    sections:
      - { type: text, value: { $ref: 'rider.translations.yaml#/rider.issue.exit_label' } }
      - type: button
        id: issue_exit_continue_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.exit.continue' }
        variant: outline
        full_width: true
        action: { type: open_bottom_sheet, sheet_id: rider_report_sheet }
      - type: button
        id: issue_exit_hand_back_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.exit.hand_back' }
        variant: outline
        full_width: true
        action: { type: open_bottom_sheet, sheet_id: rider_handback_sheet }

  # 3-i exit: report-only, kind chips (six DeliveryIssueKind values) + OTHER's bounded 300-char note
  # (the D2 pattern, ADR-20260808-171056) + confirm; tells the restaurant through the read model.
  # The refusal lands INLINE — never a toast: the rider is never left with a dismissed sheet and no
  # proof. All content here is UNCONDITIONAL on the sheet's own entry (this sheet IS the CONTINUE
  # branch — no `issue_exit` gate needed once the router above has already chosen it).
  rider_report_sheet:
    id: rider_report_sheet
    type: bottom_sheet
    title: { $ref: 'rider.translations.yaml#/rider.issue.title' }
    sections:
      - type: chip_multi_select
        id: issue_kind
        label: { $ref: 'rider.translations.yaml#/rider.issue.kind_label' }
        single_select: true
        options:
          - { value: ADDRESS_NOT_FOUND,     label: { $ref: 'rider.translations.yaml#/rider.issue.kind.address_not_found' } }
          - { value: CUSTOMER_UNREACHABLE,  label: { $ref: 'rider.translations.yaml#/rider.issue.kind.customer_unreachable' } }
          - { value: RESTAURANT_NOT_READY,  label: { $ref: 'rider.translations.yaml#/rider.issue.kind.restaurant_not_ready' } }
          - { value: FOOD_DAMAGED,          label: { $ref: 'rider.translations.yaml#/rider.issue.kind.food_damaged' } }
          - { value: VEHICLE_OR_INJURY,     label: { $ref: 'rider.translations.yaml#/rider.issue.kind.vehicle_or_injury' } }
          - { value: OTHER,                 label: { $ref: 'rider.translations.yaml#/rider.issue.kind.other' } }
      # Pre-existing gap, not this fix's to close (dispatch: remove every `issue_exit.value`
      # condition only): `issue_kind.value == 'OTHER'` is itself a form-field `visible_when` and
      # inherits the same non-reactivity. Left as-is — it was not part of the regression this round
      # addresses, and is not on the path to the confirm control.
      - { type: text_area, id: issue_note, placeholder: { $ref: 'rider.translations.yaml#/rider.issue.note_prompt' }, max_length: 300, visible_when: "issue_kind.value == 'OTHER'" }
      - type: button
        id: report_issue_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.confirm' }
        variant: primary
        full_width: true
        action:
          type: report_delivery_issue
          variables: { deliveryJobId: "{{ delivery.id }}", kind: "{{ issue_kind.value }}", issue: "{{ issue_note.value }}" }
          loading_label: { $ref: 'rider.translations.yaml#/rider.issue.pending' }
          on_success: [{ type: close_sheet }]
      - { type: inline_error, id: report_issue_error, for_action: report_delivery_issue }

  # 3-ii exit: the handback. The food question is asked only at PICKED_UP/OUT_FOR_DELIVERY (two
  # options); from ASSIGNED the rider never picked up, so `foodLocation` is DERIVED NOT_COLLECTED and
  # no question is asked (ADR-20260904-015903 §2 "ask the rider nothing about the food it can
  # derive") — two separate confirm buttons, gated by `delivery.status` (RESOLVER data — `lookup`
  # serves it at paint, so this `visible_when` is real and kept), carry the literal or the chosen
  # value. No kind chips on this sheet (3-ii names no `DeliveryIssueKind`; ADR-20260904-015903 §7).
  # `hand_back_delivery` dispatches a single Tell; the ADR's "report + hand back" sequencing is a
  # follow-on — the SDUI `on_success` grammar has no mutation-chaining primitive today, and a control
  # that renders and silently fails half its job is worse than a narrower one that fully works
  # (CLAUDE.md) — filed as an adjacent finding in the PR body.
  rider_handback_sheet:
    id: rider_handback_sheet
    type: bottom_sheet
    title: { $ref: 'rider.translations.yaml#/rider.issue.exit.hand_back' }
    sections:
      - type: chip_multi_select
        id: handback_location
        label: { $ref: 'rider.translations.yaml#/rider.issue.custody_label' }
        single_select: true
        visible_when: "delivery.status in ['PICKED_UP', 'OUT_FOR_DELIVERY']"
        options:
          - { value: WITH_RIDER,             label: { $ref: 'rider.translations.yaml#/rider.issue.custody.with_rider' } }
          - { value: RETURNED_TO_RESTAURANT, label: { $ref: 'rider.translations.yaml#/rider.issue.custody.returned' } }
      # Confirm label is `rider.issue.confirm` ("Prévenir le restaurant" / "Tell the restaurant") —
      # not a "hand back" verb: on the WITH_RIDER card the rider has just said they did NOT return
      # the order, so the button must promise only what actually happens (the restaurant is told).
      - type: button
        id: hand_back_delivery_picked_up_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.confirm' }
        variant: primary
        full_width: true
        visible_when: "delivery.status in ['PICKED_UP', 'OUT_FOR_DELIVERY']"
        action:
          type: hand_back_delivery
          variables: { deliveryJobId: "{{ delivery.id }}", foodLocation: "{{ handback_location.value }}" }
          loading_label: { $ref: 'rider.translations.yaml#/rider.issue.handback_pending' }
          on_success: [{ type: close_sheet }]
      # From ASSIGNED: no question, foodLocation is the literal NOT_COLLECTED (derived by the sheet).
      - type: button
        id: hand_back_delivery_assigned_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.confirm' }
        variant: primary
        full_width: true
        visible_when: "delivery.status == 'ASSIGNED'"
        action:
          type: hand_back_delivery
          variables: { deliveryJobId: "{{ delivery.id }}", foodLocation: "NOT_COLLECTED" }
          loading_label: { $ref: 'rider.translations.yaml#/rider.issue.handback_pending' }
          on_success: [{ type: close_sheet }]
      - { type: inline_error, id: hand_back_delivery_error, for_action: hand_back_delivery }

  # #639 part C step 4-ii (ADR-20260904-124600 §5): the `/restricted` screen's held-job control —
  # a SECOND sheet, a COPY of `rider_handback_sheet` re-bound to `standing.heldDelivery.status` /
  # `.id` (the screen's own resolver root; no screen-level alias grammar exists between two
  # different resolver roots, and inventing one is a second naming scheme the validator cannot
  # see — ADR §5 refused the alias). `on_success` closes the sheet AND re-executes the screen's
  # own reads (`$reload`, #529's declared same-page token): `heldDelivery` is a view over the log
  # (correct on the very next read), so the after-state renders without a second control existing
  # anywhere to invent.
  rider_restricted_handback_sheet:
    id: rider_restricted_handback_sheet
    type: bottom_sheet
    title: { $ref: 'rider.translations.yaml#/rider.issue.exit.hand_back' }
    sections:
      - type: chip_multi_select
        id: restricted_handback_location
        label: { $ref: 'rider.translations.yaml#/rider.issue.custody_label' }
        single_select: true
        visible_when: "standing.heldDelivery.status in ['PICKED_UP', 'OUT_FOR_DELIVERY']"
        options:
          - { value: WITH_RIDER,             label: { $ref: 'rider.translations.yaml#/rider.issue.custody.with_rider' } }
          - { value: RETURNED_TO_RESTAURANT, label: { $ref: 'rider.translations.yaml#/rider.issue.custody.returned' } }
      - type: button
        id: restricted_hand_back_delivery_picked_up_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.confirm' }
        variant: primary
        full_width: true
        visible_when: "standing.heldDelivery.status in ['PICKED_UP', 'OUT_FOR_DELIVERY']"
        action:
          type: hand_back_delivery
          variables: { deliveryJobId: "{{ standing.heldDelivery.id }}", foodLocation: "{{ restricted_handback_location.value }}" }
          loading_label: { $ref: 'rider.translations.yaml#/rider.issue.handback_pending' }
          on_success: [{ type: close_sheet }, { type: navigate, route: "$reload" }]
      # From ASSIGNED: no question, foodLocation is the literal NOT_COLLECTED (ADR-20260904-015903
      # §2 "ask the rider nothing about the food it can derive") — the SAME derivation as the
      # first sheet's ASSIGNED button.
      - type: button
        id: restricted_hand_back_delivery_assigned_btn
        label: { $ref: 'rider.translations.yaml#/rider.issue.confirm' }
        variant: primary
        full_width: true
        visible_when: "standing.heldDelivery.status == 'ASSIGNED'"
        action:
          type: hand_back_delivery
          variables: { deliveryJobId: "{{ standing.heldDelivery.id }}", foodLocation: "NOT_COLLECTED" }
          loading_label: { $ref: 'rider.translations.yaml#/rider.issue.handback_pending' }
          on_success: [{ type: close_sheet }, { type: navigate, route: "$reload" }]
      - { type: inline_error, id: restricted_hand_back_delivery_error, for_action: hand_back_delivery }

  rider_code_sheet:
    id: rider_code_sheet
    type: bottom_sheet
    title: { $ref: 'rider.translations.yaml#/rider.sign_in.code_title' }
    drag_to_close: false
    sections:
      - { type: text, value: { $ref: 'rider.translations.yaml#/rider.sign_in.code_body' } }
      # On the 6th digit: confirm. On SUCCESS the parked session is claimed FIRST (`claim_session`
      # awaits `POST /auth/session`, which answers Set-Cookie), THEN the app navigates to the job
      # list — the order is load-bearing, exactly as the customer door's `verify_otp` pair (#529).
      # The phone parts are re-read from the sign-in screen's own inputs, which are still in the DOM.
      - { type: otp_input, id: rider_code, length: 6, autofocus: true, on_complete: { type: confirm_rider_sign_in, variables: { dialingCode: "{{ rider_dialing_code.value }}", nationalNumber: "{{ rider_phone.value }}", code: "{{ rider_code.value }}" }, loading_label: { $ref: 'rider.translations.yaml#/rider.sign_in.verifying' }, on_success: [{ type: claim_session }, { type: navigate, route: "/" }] } }
      # The refusal states, rendered HERE in the rider's language rather than as a passing toast
      # (ADR-20260830-213135): `RiderNotRegistered` (naming the support contact from the error's own
      # context — the key is baked server-side, never spelled in this file), `AuthSubjectHoldsAnotherRole`,
      # and the OTP refusals (`InvalidVerificationCode`, `VerificationCodeExpired`, …). The text is the
      # errors.yaml message localized by the server; this component only declares WHERE it lands.
      - { type: inline_error, id: rider_sign_in_error, for_action: confirm_rider_sign_in }
      # The one route out of an OTP refusal: ask for a fresh code (same operation, same phone).
      - { type: text_button, id: rider_resend_code, label: { $ref: 'rider.translations.yaml#/rider.sign_in.resend' }, action: { type: request_rider_sign_in_code, variables: { dialingCode: "{{ rider_dialing_code.value }}", nationalNumber: "{{ rider_phone.value }}" }, loading_label: { $ref: 'rider.translations.yaml#/rider.sign_in.sending' } } }

# ──────────────────────────────────────────────────────────────────────────────
# SCREENS
# ──────────────────────────────────────────────────────────────────────────────
screens:

  # SCREEN 0 — The sign-in door (#639 part C step 2c-ii; PROP-20260831-180622 §5 FORK 3 = R1,
  # founder 2026-08-31). The ONE screen of this surface that speaks to `/public/graphql`
  # (`graphql_role: PUBLIC`): the two identify-only mutations it binds admit PUBLIC and nothing
  # else, and the validator refuses the declaration if any bound operation would refuse that role
  # (`screen-graphql-role-refused-operation`). Deliberately NOT the `rider_topbar` chrome: its
  # online toggle is a RIDER mutation, which this screen's transport could never carry.
  # On-bike ergonomics: two inputs (the dialing code is prefilled, the number is the only typing),
  # one large primary button, the six-digit code in a sheet. No greyed control: a state that cannot
  # proceed shows its reason inline and the one route out (resend / the support contact).
  - id: sign_in
    roles: [PUBLIC]
    route: "/sign-in"
    title: { $ref: 'rider.translations.yaml#/rider.sign_in.title' }
    sdui: true
    requires_auth: false
    graphql_role: PUBLIC
    data_requirements: []
    actions_used: [request_rider_sign_in_code, confirm_rider_sign_in]
    components:
      - type: sticky_header
        id: rider_sign_in_topbar
        slots:
          left: [{ type: logo, asset: "/assets/logo.svg", link: "/sign-in" }]
          center: [{ type: text, value: { $ref: 'rider.translations.yaml#/rider.title' } }]
      - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.sign_in.title' } }
      - { type: text, value: { $ref: 'rider.translations.yaml#/rider.sign_in.body' } }
      - type: section
        id: rider_sign_in_form
        content:
          - { type: text_input, id: rider_dialing_code, label: { $ref: 'rider.translations.yaml#/rider.sign_in.dialing_code_label' }, value: "+33" }
          - { type: phone_field, id: rider_phone, label: { $ref: 'rider.translations.yaml#/rider.sign_in.phone_label' }, autofocus: true }
          # Acceptance opens the code sheet (never before the response — the #529 rule). The request
          # answers the same way for a rider's phone and a stranger's (no enumeration oracle), so the
          # sheet opens for both; the refusal, if any, comes at confirmation.
          - { type: button, id: rider_request_code, label: { $ref: 'rider.translations.yaml#/rider.sign_in.request_code' }, variant: primary, full_width: true, action: { type: request_rider_sign_in_code, variables: { dialingCode: "{{ rider_dialing_code.value }}", nationalNumber: "{{ rider_phone.value }}" }, loading_label: { $ref: 'rider.translations.yaml#/rider.sign_in.sending' }, on_success: { type: open_bottom_sheet, sheet_id: rider_code_sheet } } }
          - { type: inline_error, id: rider_request_error, for_action: request_rider_sign_in_code }

  # SCREEN 1 — Job list (assigned/available deliveries; accept from here)
  - id: jobs
    roles: [RIDER]
    route: "/"
    title: { $ref: 'rider.translations.yaml#/rider.jobs.title' }
    sdui: true
    requires_auth: true
    # No session -> the door (2c-ii). Server-side: a document GET with no auth cookie is 302'd
    # there before any render; client-side: a 401 from this surface's role path on the screen's
    # reads navigates there. Before 2c-ii this screen rendered its shell with the read failed.
    unauthenticated: { type: navigate, route: "/sign-in" }
    # #639 part C step 4-ii (ADR-20260904-124600 §2): the `unauthenticated:` twin, keyed on the
    # server's own standing signal (`extensions.reason == RIDER_RESTRICTED`) rather than "no
    # session" — a refused read OR a refused Tell on this screen bounces here.
    restricted: { type: navigate, route: "/restricted" }
    data_requirements: [deliveries.mine]
    actions_used: [accept_delivery, decline_delivery, rider_toggle_online]
    components:
      - { component: rider_topbar }
      - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.jobs.title' } }
      - type: order_list
        items: "{{ deliveries }}"
        item_type: order_card
        item_action: { type: navigate, route: "/jobs/{{ item.orderId }}" }
        empty_state: { icon: truck, title: { $ref: 'rider.translations.yaml#/rider.jobs.empty.title' }, body: { $ref: 'rider.translations.yaml#/rider.jobs.empty.body' } }
      - type: section
        id: job_list_actions
        content:
          - { type: button, label: { $ref: 'rider.translations.yaml#/rider.jobs.accept' }, variant: primary, action: { type: accept_delivery, variables: { deliveryJobId: "{{ delivery.id }}" } } }
          # #639 part C step 3-i: refuse a PENDING offer (no reason field — a decline is a fold no-op).
          - { type: button, id: decline_delivery_btn, label: { $ref: 'rider.translations.yaml#/rider.jobs.decline' }, variant: outline, visible_when: "delivery.status == 'PENDING'", action: { type: decline_delivery, variables: { deliveryJobId: "{{ delivery.id }}" } } }
          - { type: inline_error, id: decline_delivery_error, for_action: decline_delivery }

  # SCREEN 2 — Job detail (the pickup→dropoff state machine + contact rows)
  - id: job_detail
    roles: [RIDER]
    route: "/jobs/:orderId"
    title: { $ref: 'rider.translations.yaml#/rider.job.title' }
    sdui: true
    requires_auth: true
    # Before 2c-ii an unauthenticated visitor here was bounced to `/` (the staff-surface arm of the
    # #92 client guard), where `jobs` then rendered its shell with the read failed.
    unauthenticated: { type: navigate, route: "/sign-in" }
    # #639 part C step 4-ii (ADR-20260904-124600 §2): a rider mid-job here who gets restricted —
    # the next refused Tell (confirm_pickup/complete_delivery/…) bounces to the notice, never a
    # toast (`delivery.byOrder` itself stays reachable, `whileRestricted: [RIDER]`).
    restricted: { type: navigate, route: "/restricted" }
    data_requirements: [delivery.byOrder]
    actions_used: [confirm_pickup, complete_delivery, report_delivery_issue, hand_back_delivery, phone_call]
    gaps:
      - "Rider → restaurant pickup contact: the api Restaurant type exposes no phone, so the removed restaurant_contact_row bound fields (restaurantName/restaurantPhone) DeliveryJob never carried and its call button could never dial (#717). The projection INTENT is recorded (DECISIONS STO-8 joins the restaurant's phone into the rider job view) but no api field carries it. The concept: a rider at pickup who cannot find the entrance, or whose order is not ready, needs to call the restaurant."
      - "The handback after-state's 'Rapportez la commande' instruction (#639 part C step 3-ii) names no external-navigation control: no `ClientEffect`/action kind for opening a maps app exists anywhere in this DSL (`navigate` is the SDUI's own internal route change, not GPS). The pickup address is shown as the biggest element instead (page_header); a real turn-by-turn deep link is a follow-on, not invented here as a dead control."
    components:
      - { type: back_button_header, title: { $ref: 'rider.translations.yaml#/rider.job.title' } }
      - { type: status_chip, status: "{{ delivery.status }}" }
      # #639 part C step 3-i: after a report the job STAYS (status untouched); the chip says so,
      # read from the fold's `openIssue` — the rider's proof the restaurant was told.
      - { type: badge, text: { $ref: 'rider.translations.yaml#/rider.job.issue_reported' }, variant: warning, visible_when: "delivery.openIssue != null" }
      # #639 part C step 3-ii: the after-state, once a handback has landed (`foodLocation` set).
      # WITH_RIDER is the biggest-element instruction screen (ADR-20260904-015903 §7); any other
      # non-null value (RETURNED_TO_RESTAURANT, or NOT_COLLECTED from ASSIGNED) is the calmer
      # "handed back, re-offering" state. Both replace the operational controls below — a job the
      # fold has already moved to PENDING/FAILED and unassigned (rider_id null) is no longer this
      # rider's to act on.
      - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.job.handback_instruction_title' }, visible_when: "delivery.foodLocation == 'WITH_RIDER'" }
      - { type: text, value: { $ref: 'rider.translations.yaml#/rider.job.handback_done_body' }, visible_when: "delivery.foodLocation in ['NOT_COLLECTED', 'RETURNED_TO_RESTAURANT']" }
      - { type: button, id: handback_back_to_jobs_btn, label: { $ref: 'rider.translations.yaml#/rider.job.back_to_jobs' }, variant: primary, full_width: true, visible_when: "delivery.foodLocation in ['NOT_COLLECTED', 'RETURNED_TO_RESTAURANT']", action: { type: navigate, route: "/" } }
      - { type: info_row, icon: map_pin, label: { $ref: 'rider.translations.yaml#/rider.job.pickup' },  value: "{{ delivery.pickupAddress | format_address }}" }
      - { type: info_row, icon: home,    label: { $ref: 'rider.translations.yaml#/rider.job.dropoff' }, value: "{{ delivery.dropoffAddress | format_address }}", visible_when: "delivery.foodLocation == null" }
      # #717: plain name row via the FK-derived navigation edge (DeliveryJob.restaurant: Restaurant!).
      # Deliberately NOT a contact row — a rebound name beside a dead call button is a false signifier.
      - { type: info_row, icon: store, label: { $ref: 'rider.translations.yaml#/rider.job.restaurant' }, value: "{{ delivery.restaurant.displayName }}" }
      - type: sticky_bottom_bar
        # Hidden once a handback has landed (`foodLocation` set) — the after-state above replaces
        # these, and none of them can legally succeed on a job this rider no longer holds.
        visible_when: "delivery.foodLocation == null"
        content:
          - { type: button, id: confirm_pickup_btn,   label: { $ref: 'rider.translations.yaml#/rider.job.picked_up' }, variant: primary, full_width: true, action: { type: confirm_pickup,    variables: { deliveryJobId: "{{ delivery.id }}" } } }
          - { type: button, id: complete_delivery_btn, label: { $ref: 'rider.translations.yaml#/rider.job.delivered' }, variant: primary, full_width: true, action: { type: complete_delivery, variables: { deliveryJobId: "{{ delivery.id }}" } } }
          # #639 part C step 3-i/3-ii: the secondary "Un problème" beside the primaries (outline,
          # full width, min 56px on-bike target) opens the issue sheet — its second exit is the
          # handback door. In-app only: no call button.
          - { type: button, id: report_issue_open_btn, label: { $ref: 'rider.translations.yaml#/rider.job.problem' }, variant: outline, full_width: true, min_height: 56, action: { type: open_bottom_sheet, sheet_id: rider_issue_sheet } }

  # SCREEN 3 — The restricted notice (#639 part C step 4-ii, ADR-20260904-124600 §4/§5): where the
  # `restricted:` bounce on `jobs`/`job_detail` lands — a refused read (the hydrate loop) or a
  # refused Tell (`interact.rs`) carrying `extensions.reason == RIDER_RESTRICTED`. NO
  # `rider_topbar`: its online toggle dispatches `changeRiderStatus`, never `whileRestricted:`
  # (validator rule `screen-restricted-binds-uncarved-op` would refuse mounting it here — a plain
  # `back_button_header` in its place). `standing.mine` is the ONLY read; every binding path is
  # `standing.*` (the resolver alias root is the key's FIRST segment).
  - id: restricted
    roles: [RIDER]
    route: "/restricted"
    title: { $ref: 'rider.translations.yaml#/rider.restricted.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    while_restricted: true
    data_requirements: [standing.mine]
    actions_used: [hand_back_delivery]
    gaps:
      - "The restaurant's phone on the held-job card (#717): DeliveryJob carries no phone field, same declared gap as job_detail's contact row."
      - "The copy-to-clipboard control on the contact address (#872): `copy_to_clipboard` is a declared ActionKey with no listener (`crates/web/src/executor.rs:405,545`, `interact.rs:227,516`) — the address is plain selectable text instead, per ADR-20260904-124600 §4 ('no copy button — a declared action with no listener is the control that does nothing, on a legal surface')."
      - "The document-GET bounce (ADR-20260904-081527 §11, amended by ADR-20260904-124600 §3): the page GET makes zero Postgres reads today; a restricted rider who opens a fresh tab sees the ordinary shell until the client's own `standing.mine` read answers. Rides with step 5's socket re-resolution (one resolver, three callers)."
    components:
      # #882 round-2 item 2 (ADR-20260904-081527 §7): a reinstated (ACTIVE) rider can land
      # here (back-navigation, a stale `$reload`) with `restriction: null` -- the whole
      # notice body, INCLUDING the door's own header (a rider who back-navigates here must
      # never read "Votre accès est restreint." anywhere on the page, not even in the back
      # button's title), is gated on the rider's OWN current standing; the else branch is a
      # full-page swap to the reinstated sentence, verbatim, with the ONE control back to the
      # job list.
      - type: conditional_section
        id: restricted_notice_or_reinstated
        condition: "standing.standing == 'RESTRICTED'"
        if_true:
          - { type: back_button_header, title: { $ref: 'rider.translations.yaml#/rider.restricted.title' } }
          # Title + the "no more jobs" sentence: UNCONDITIONAL while RESTRICTED (ADR §4) — never
          # gated on the attribution row below, which can lag one tick behind the standing flip.
          - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.restricted.title' } }
          - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.no_more_jobs' } }
          # The attribution: EITHER the ground + both dates (restriction resolved) OR the transient
          # "not yet available" sentence (restriction.decidedAt/effectiveAt not folded yet, ADR §4's
          # documented one-tick transient) — the two branches of ONE `condition:` section, so the
          # transient can only ever show while the restriction is genuinely absent, never alongside it
          # (the corpus grammar has no `&&`; nesting is how "unrecognised renders only when the
          # restriction exists" holds without inventing one).
          - type: conditional_section
            id: restricted_attribution
            condition: "standing.restriction != null"
            if_true:
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground_label' } }
              - type: row
                id: restricted_ground_rider_requested
                visible_when: "standing.restriction.ground == 'RIDER_REQUESTED'"
                content:
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.rider_requested.lead' } }
                  - { type: text, value: "{{ standing.contestContact }}" }
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.rider_requested.trail' } }
              - type: row
                id: restricted_ground_eligibility_document_lapsed
                visible_when: "standing.restriction.ground == 'ELIGIBILITY_DOCUMENT_LAPSED'"
                content:
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.eligibility_document_lapsed.lead' } }
                  - { type: text, value: "{{ standing.contestContact }}" }
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.eligibility_document_lapsed.trail' } }
              - type: row
                id: restricted_ground_identity_mismatch
                visible_when: "standing.restriction.ground == 'IDENTITY_MISMATCH'"
                content:
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.identity_mismatch.lead' } }
                  - { type: text, value: "{{ standing.contestContact }}" }
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.identity_mismatch.trail' } }
              - type: row
                id: restricted_ground_account_compromise
                visible_when: "standing.restriction.ground == 'ACCOUNT_COMPROMISE'"
                content:
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.account_compromise.lead' } }
                  - { type: text, value: "{{ standing.contestContact }}" }
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.account_compromise.trail' } }
              # The catch-all (#639 part C step 4-i, ADR-20260904-081527 §3): `ground == null` INSIDE
              # this branch means "a restriction exists whose ground the strict decode could not
              # spell" — never the transient (that is the OTHER branch of this same section) and
              # never a blank row (never a key built from the value).
              - type: row
                id: restricted_ground_unrecognised
                visible_when: "standing.restriction.ground == null"
                content:
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.unrecognised.lead' } }
                  - { type: text, value: "{{ standing.contestContact }}" }
                  - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.ground.unrecognised.trail' } }
              - { type: info_row, icon: calendar, label: { $ref: 'rider.translations.yaml#/rider.restricted.decided_at_label' }, value: "{{ standing.restriction.decidedAt | format_datetime }}" }
              - { type: info_row, icon: calendar, label: { $ref: 'rider.translations.yaml#/rider.restricted.effective_at_label' }, value: "{{ standing.restriction.effectiveAt | format_datetime }}" }
            if_false:
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.details_pending' } }
          # The held-job card (ADR-20260904-015903 §7, ADR-20260904-124600 §5): the pickup address is
          # the biggest element; the restaurant's phone is #717 (declared above). The one control opens
          # the second sheet; once `foodLocation` is set the after-state text replaces it — no control
          # is ever live on a job this rider no longer holds.
          - type: conditional_section
            id: restricted_held_job
            condition: "standing.heldDelivery != null"
            if_true:
              - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.restricted.held_title' } }
              - { type: info_row, icon: store, label: { $ref: 'rider.translations.yaml#/rider.job.restaurant' }, value: "{{ standing.heldDelivery.restaurant.displayName }}" }
              - { type: info_row, icon: map_pin, label: { $ref: 'rider.translations.yaml#/rider.job.pickup' }, value: "{{ standing.heldDelivery.pickupAddress | format_address }}" }
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.held_instruction' }, visible_when: "standing.heldDelivery.foodLocation == null" }
              - { type: button, id: restricted_cannot_continue_btn, label: { $ref: 'rider.translations.yaml#/rider.issue.exit.hand_back' }, variant: outline, full_width: true, visible_when: "standing.heldDelivery.foodLocation == null", action: { type: open_bottom_sheet, sheet_id: rider_restricted_handback_sheet } }
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.held_after' }, visible_when: "standing.heldDelivery.foodLocation != null" }
          # The footer: UNCONDITIONAL (Art. 11(2), ADR-014136 §6(ii)) — how to contest, plain
          # selectable text, no copy button, no deadline, no verdict word.
          - type: row
            id: restricted_contest
            content:
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.contest.lead' } }
              - { type: text, value: "{{ standing.contestContact }}" }
              - { type: text, value: { $ref: 'rider.translations.yaml#/rider.restricted.contest.trail' } }
        if_false:
          - { type: back_button_header, title: { $ref: 'rider.translations.yaml#/rider.restricted.reinstated' } }
          - { type: page_header, title: { $ref: 'rider.translations.yaml#/rider.restricted.reinstated' } }
          - { type: button, id: restricted_reinstated_back_to_jobs_btn, label: { $ref: 'rider.translations.yaml#/rider.job.back_to_jobs' }, variant: primary, full_width: true, action: { type: navigate, route: "/" } }
