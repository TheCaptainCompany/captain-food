# Authorize-then-capture disclosure (#544, ADR-20260808-195315 §1.2): the card is AUTHORIZED at
# checkout (a hold, not a charge) and only DEBITED when the order is handed over. Framing the hold
# as an immediate charge would be factually wrong, so the pay step says so persistently.
checkout.payment.hold_notice: { messages: { en: "Your card is authorized now and charged when your order is delivered.", fr: "Votre carte est autorisée maintenant, débitée à la livraison." } }
checkout.processing:       { messages: { en: "Processing…", fr: "Traitement…" } }
# Obligation-to-pay button (#817, C. conso. L221-14 / CRD 2011/83 Art. 8(2)): immediately before
# a distance order the button must carry an unambiguous mention of the OBLIGATION TO PAY, the
# statutory safe-harbour formula being "commander avec obligation de paiement" (ou une formule
# analogue dénuée d'ambiguïté). The previous copy — "Commander — {total}" — announced an AMOUNT,
# which is a different statement.
#
# What the shipped label IS, stated precisely because counsel will be asked about this exact
# string: `fr` is the safe-harbour formula FOLLOWED BY the total ("Commander avec obligation de
# paiement — 23,50 EUR"), not the formula alone; `en` is the directive's own English formulation
# followed by the same total, so both locales state the same obligation. Two consequences are
# deliberately left OPEN here rather than resolved:
#   * Art. 8(2)'s second subparagraph requires the button be labelled "only with the words ... or a
#     corresponding unambiguous formulation". Whether a total appended to the formula is inside or
#     outside that limb is precisely what QT-4 must weigh. Keeping the total is a DESIGN choice —
#     the customer should not have to look away from the control to see what they are committing to
#     — and it is NOT an assertion that the article permits it.
#   * the total renders as "23,50 EUR", not "23,50 €" (crates/web/src/renderer.rs `format_currency`,
#     one function shared by every money binding); QT-2 asks which display regime governs that.
#
# Whether any given wording SATISFIES the article is counsel's call (QT-4 on the counsel list in
# docs/legal/BRIEF-20260831-repricing-and-price-quote-counsel-packet.md) and no counsel is engaged.
# This copy is chosen to OVER-COMPLY pending that answer, because the sanction is that the consumer
# is not bound — it does not close the question, and this repo issues no legal clearance
# (ADR-20260812-143619).
checkout.place_order:
  params: { total: "formatted order total" }
  messages:
    en: "Order with obligation to pay — {total}"
    fr: "Commander avec obligation de paiement — {total}"
checkout.payment_failed.title: { messages: { en: "Payment failed", fr: "Paiement refusé" } }
checkout.payment_failed.body:  { messages: { en: "Your card was not charged. Your cart is intact.", fr: "Votre carte n'a pas été débitée. Votre panier est intact." } }
checkout.payment_failed.retry: { messages: { en: "Retry payment", fr: "Réessayer le paiement" } }
checkout.payment_failed.back_to_cart: { messages: { en: "Back to cart", fr: "Revenir au panier" } }
# Payment UNAVAILABLE (#440, presence-gated publishable key): no usable key => no element, honest copy.
checkout.payment_unavailable.title: { messages: { en: "Payment temporarily unavailable", fr: "Paiement momentanément indisponible" } }
checkout.payment_unavailable.body:  { messages: { en: "Online payment is temporarily unavailable — your cart is saved, try again in a few minutes.", fr: "Le paiement en ligne est momentanément indisponible — votre panier est conservé, réessayez dans quelques minutes." } }
# Test-mode banner (#440): shown while the delivered key is pk_test_ — pre-launch, that is always.
checkout.test_mode.banner: { messages: { en: "Test mode — no real charges", fr: "Mode test — aucun débit réel" } }

