order.rate:       { messages: { en: "Rate your order", fr: "Évaluer la commande" } }
order.reorder:    { messages: { en: "Reorder", fr: "Recommander" } }
order.help:       { messages: { en: "Get help", fr: "Obtenir de l'aide" } }
order.not_found:  { messages: { en: "Order not found", fr: "Commande introuvable" } }
# #472 — a FAILED read is never the not-found/empty state: the cart error state and the
# tracking staleness state carry their own copy (rendered from hand-written Rust — declared in
# translations.code_refs.yaml). The tracking line must never imply the order vanished.
