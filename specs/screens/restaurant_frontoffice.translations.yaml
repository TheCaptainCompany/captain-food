# #167 acceptance timeout — release-not-refund register: the hold is released, the customer was
# never charged. Never the word "refund", never a promised bank-clearance date.
order.status.acceptance_timed_out.title: { messages: { en: "The restaurant didn't respond in time", fr: "Le restaurant n'a pas répondu à temps" } }
order.status.acceptance_timed_out.body:  { messages: { en: "Your order was cancelled automatically and the hold on your card is being released — you were never charged.", fr: "Votre commande a été annulée automatiquement et l'empreinte sur votre carte est en cours de libération — vous n'avez jamais été débité." } }
order.eta:        { messages: { en: "Estimated arrival", fr: "Arrivée estimée" } }
# #639 part C step 3-ii (ADR-20260904-015903 §7): REPLACES the ETA bar while the delivery is
# PENDING/FAILED and the order is still OUT_FOR_DELIVERY — never blank, never counting down to
# nothing.
order.delivery_reassigning: { messages: { en: "Your order is ready — we are reassigning the delivery. New estimate coming.", fr: "Votre commande est bien préparée — nous réattribuons la livraison. Nouvelle estimation en cours." } }
