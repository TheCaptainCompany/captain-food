# ==============================================================================
# Captain.Food — Restaurant Back-Office UI Specification (Spec-Driven Server-Driven UI)
# ------------------------------------------------------------------------------
# The RESTAURANT BACK OFFICE: the staff-facing operations dashboard — live order queue
# (accept/reject/prepare/ready), delivery board, refund decisions and the #62 delivery-satisfaction
# signal — served at restos.captain.food (audience roles RESTAURANT + RESTAURANT_ACCOUNT; host→surface
# convention in the split-4 ADR). One file per audience (ADR-0037 as refined by ADR-20260722-091500);
# the customer-facing surfaces are `restaurant_frontoffice.yaml` (storefront) and
# `captain_frontoffice.yaml` (marketplace); `rider.yaml` is the courier app.
#
# Same two-layer contract as every surface (ADR-0033): a `resolvers`/`actions` data-layer allowlist
# $ref-bound to api.yaml (the codegen PROVES the API answers the UI), and the layout layer below.
# Binds ONLY existing api.yaml operations — this surface adds zero API surface. The component
# vocabulary REUSES the shared renderer registry declared in `restaurant_frontoffice.yaml`
# (one renderer, one ComponentKind dispatch surface); no new kinds are introduced.
# Every user-visible string is a `$ref` into `restaurant_backoffice.translations.yaml` (sidecar,
# ADR-20260722-101500) or the shared `translations.yaml`.
# ==============================================================================

version: 1
spec_version: "1.0.0"
app_id: captain.food.backoffice
app_name: "Captain.Food Back Office"
base_url: "https://restos.captain.food"
default_locale: fr
supported_locales: [en, fr]
app_types: [web, windows]   # staff dashboard: web first; the counter tablet/till build follows (ADR-0037)

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — RESOLVERS (reads). All bound to EXISTING api.yaml queries; the restaurant scope
# (restaurantId) is caller-supplied at runtime from the staff session's restaurant binding.
# ──────────────────────────────────────────────────────────────────────────────
resolvers:
  orders.byRestaurant:       { query: { $ref: 'api.yaml#/queries/orders' } }
  deliveries.byRestaurant:   { query: { $ref: 'api.yaml#/queries/restaurantDeliveries' } }
  refunds.pending:           { query: { $ref: 'api.yaml#/queries/pendingRefunds' } }
  satisfaction.byRestaurant: { query: { $ref: 'api.yaml#/queries/restaurantDeliverySatisfaction' } }
  # #129 — the per-order staff conversation: BOTH the PUBLIC thread and the INTERNAL notes. Staff read
  # the full picture. `orderId` comes from the route `:orderId` (same-name convention). TWO data
  # namespaces on purpose (#717): the runtime stores each resolver's result under its name's FIRST
  # segment, so two resolvers sharing one root silently shadow each other (last write wins) — the
  # public thread reads `{{ conversation.* }}` (api OrderConversation), the staff-only notes read
  # `{{ internal_notes.* }}` (api ConversationInternalNotes, absent from the CUSTOMER schema).
  conversation.byOrder:    { query: { $ref: 'api.yaml#/queries/orderConversation' } }
  internal_notes.byOrder:  { query: { $ref: 'api.yaml#/queries/orderConversationInternalNotes' } }
  # #157 — the claims queue (this restaurant's customer claims, filterable by status/category) + one
  # claim's detail. `reclamationId` for the detail comes from the route `:reclamationId` (same-name).
  reclamations.queue: { query: { $ref: 'api.yaml#/queries/restaurantReclamations' } }
  # ADR-20260728-011344: the storefront-address screen needs THIS restaurant, and the only
  # single-restaurant query (`restaurant`) is keyed by SLUG -- circular when the slug is precisely what
  # is being configured, and unusable for a restaurant that has none yet. So it reads the account's
  # locations and binds the selected one. See the screen's `gaps` for the by-id query this really wants.
  restaurant.locations: { query: { $ref: 'api.yaml#/queries/restaurantLocationsByAccount' } }
  reclamation.byId:   { query: { $ref: 'api.yaml#/queries/reclamation' } }
  # #639 part C step 6-iv round 2 (ADR-20260905-101349 §2 amendment, PROP §6.4/§6.5): the roster
  # and the invitation list. TWO distinct root segments (#717's own lesson, restated above): a
  # shared root would shadow one of the two.
  roster.mine:      { query: { $ref: 'api.yaml#/queries/restaurantRoster' } }
  invitations.mine: { query: { $ref: 'api.yaml#/queries/restaurantInvitations' } }

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — ACTIONS (writes + client behaviours). All mutations exist in api.yaml already.
# `navigate`/`phone_call` redeclare the shared client kinds IDENTICALLY (union rule).
# ──────────────────────────────────────────────────────────────────────────────
actions:
  navigate: { kind: client }
  phone_call: { kind: client }
  accept_order:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/acceptOrder' } }
  reject_order:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/rejectOrder' } }
  start_preparation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/startPreparation' } }
  mark_order_ready:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/markOrderReady' } }
  cancel_order_by_restaurant: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/cancelOrderByRestaurant' } }
  change_order_acceptance:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/changeOrderAcceptanceMode' }, note: "The pause/resume toggle in the header." }
  mark_order_delivered: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/markOrderDelivered' }, note: "Self-dispatch: the restaurant confirms the handover itself." }
  escalate_delivery:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/escalateDelivery' }, note: "Skip the current channel and advance the ranked dispatch walk (#60)." }
  resolve_delivery_issue: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/resolveDeliveryIssue' }, note: "Acknowledge a rider's reported issue from the board's pinned card with a closed resolution (#639 part C step 3-i)." }
  open_bottom_sheet: { kind: client }
  close_sheet: { kind: client }
  configure_storefront_slug: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/configureRestaurantSlug' }, note: "Choose or rename the storefront host. A rename 301s the old address and keeps it reserved (ADR-20260728-011344)." }
  update_restaurant_profile: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/updateRestaurant' }, note: "The editable LOCATION fields. Replace-on-provided: an omitted field is left alone, never cleared." }
  approve_refund: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/approveRefund' } }
  deny_refund:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/denyRefund' } }
  # #129 — order conversation writes. post_message serves BOTH visibilities (PUBLIC reply / INTERNAL note),
  # the visibility toggle picks which. escalate_to_admin / mute_participant are the staff-only moderation moves.
  post_message:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/postMessage' } }
  escalate_to_admin: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/escalateToAdmin' } }
  mute_participant:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/muteParticipant' } }
  # #157 — claims queue decisions. resolve serves FULL_REFUND / PARTIAL_REFUND / REPLACEMENT /
  # GOODWILL_CREDIT (never REJECTED — reject is a separate control with a REQUIRED reason). A
  # PARTIAL_REFUND carries a nested Money `refundAmount` (built like the tip_order amount, #62).
  resolve_reclamation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/resolveReclamation' } }
  reject_reclamation:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/rejectReclamation' } }
  # The member sign-in door (#639 part C step 6-ii, ADR-20260905-101349 §7-§10) -- the ONE action
  # on this surface that speaks to `/public/graphql` (`graphql_role: PUBLIC` on the `sign_in`
  # screen that binds it).
  request_member_sign_in_link: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/requestMemberSignInLink' } }
  # Round 2 R2-D/R2-R2: bound here so codegen mints the `ActionKey` a hand-written screen can
  # `actions::dispatch` directly -- `confirmMemberSignIn` is never rendered by an SDUI control
  # (this DSL declares no `{{ query.* }}`/query-string binding grammar to extract the mail
  # client's `?token=`), so `sign_in_return` (`sdui: false`, `crates/web/src/sign_in_return.rs`)
  # calls it from Rust, the SAME `checkout.rs`/`HandWrittenScreen` shape.
  confirm_member_sign_in: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/confirmMemberSignIn' } }
  sign_out: { kind: auth, note: "Supabase Auth sign-out (out of domain, #94, unwired -- kind: auth renders ActionPlan::Disabled). Round 2 R2-U3: the not-yet-linked refusal's exit control uses `navigate` to `/sign-in` instead until #94 lands; this declaration is kept as the named target for that follow-up." }
  # #639 part C step 6-iv round 2: the roster and the invitation.
  invite_restaurant_member:   { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/inviteRestaurantMember' } }
  revoke_restaurant_invitation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/revokeRestaurantInvitation' } }
  # Round 2 R2-D: the `/invitation` acceptance page (`sdui: false`, the `sign_in_return.rs`
  # precedent) dispatches both from Rust -- neither is ever rendered by an SDUI control, exactly
  # the `confirm_member_sign_in` shape above.
  accept_restaurant_invitation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/acceptRestaurantInvitation' } }
  grant_restaurant_access_by_invitation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/grantRestaurantAccessByInvitation' } }

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL CHROME — the staff top bar (shared across the four screens).
# ──────────────────────────────────────────────────────────────────────────────
global_components:
  staff_topbar:
    id: staff_topbar
    type: sticky_header
    slots:
      left: [{ type: logo, asset: "/assets/logo.svg", link: "/" }]
      center:
        - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.title' } }
      right:
        - type: button
          id: acceptance_toggle
          label: { $ref: 'restaurant_backoffice.translations.yaml#/back.pause_orders' }
          variant: outline
          action: { type: change_order_acceptance }
  staff_nav:
    id: staff_nav
    type: bottom_navigation
    items:
      - { id: orders,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.orders' },       icon: receipt, route: "/" }
      - { id: deliveries,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.deliveries' },   icon: truck,   route: "/deliveries" }
      - { id: refunds,      label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.refunds' },      icon: coin,    route: "/refunds" }
      - { id: claims,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.claims' },       icon: life_buoy, route: "/claims" }
      - { id: satisfaction, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.satisfaction' }, icon: star,    route: "/satisfaction" }

# ──────────────────────────────────────────────────────────────────────────────
# BOTTOM SHEETS — the board's acknowledgement of a rider's reported issue (#639 part C step 3-i).
# ──────────────────────────────────────────────────────────────────────────────
bottom_sheets:
  # `[Vu]` on the pinned issue card opens this: the four DeliveryIssueResolution chips + an optional
  # bounded note; confirm = resolveDeliveryIssue, which clears `openIssue` on the row.
  issue_resolution_sheet:
    id: issue_resolution_sheet
    type: bottom_sheet
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolve_title' }
    sections:
      - type: chip_multi_select
        id: issue_resolution
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolution_label' }
        single_select: true
        options:
          - { value: REASSIGNED,              label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolution.reassigned' } }
          - { value: DELIVERED_BY_RESTAURANT, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolution.delivered_by_restaurant' } }
          - { value: CANCELLED,               label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolution.cancelled' } }
          - { value: OTHER,                   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.resolution.other' } }
      # #639 part C step 4-iii-A round 2 addendum item 12 (`screen-condition-on-form-field`): was
      # gated on `issue_resolution.value == 'OTHER'` — `issue_resolution` is this SAME sheet's chip,
      # a form field, never resolver data, so the note could never render regardless of which chip
      # was picked. Rendered unconditionally instead.
      - { type: text_area, id: issue_resolution_note, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.note_prompt' }, max_length: 300 }
      - type: button
        id: resolve_issue_btn
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.confirm' }
        variant: primary
        full_width: true
        action:
          type: resolve_delivery_issue
          variables: { deliveryJobId: "{{ delivery.id }}", resolution: "{{ issue_resolution.value }}", note: "{{ issue_resolution_note.value }}" }
          on_success: [{ type: close_sheet }]
      - { type: inline_error, id: resolve_issue_error, for_action: resolve_delivery_issue }

  # The member sign-in door's confirmation panel (#639 part C step 6-ii, PROP-20260831-180622
  # §8.1): opened on ACCEPTED (`request_member_sign_in_link`'s `on_success`), never a spinner and
  # never `operationStatus` -- the handler emits nothing, so there is no event-sourced state to
  # poll. Says the SAME thing whether or not the address is on the roster (no enumeration oracle).
  member_sign_in_confirmation_sheet:
    id: member_sign_in_confirmation_sheet
    type: bottom_sheet
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.confirmation_title' }
    # Round 2 R2-U1: was `drag_to_close: false` with no `close_sheet` control -- un-dismissable
    # over the SAME screen's own form, so a typo'd address trapped the user with no way back to
    # correct it. `drag_to_close: true` plus the explicit button below (belt-and-braces: a sheet
    # opened by a mutation's `on_success` has no swipe affordance on every client).
    drag_to_close: true
    sections:
      # Round 3 R3-1 (ux, BLOCKING; #870 class, `crates/web/src/renderer.rs:~1751`): round 2's
      # comment above claimed the `{{ member_email.value }}` text node "echoes EXACTLY what
      # `member_email` held when the mutation fired" -- false. A `text` node resolves at PAINT
      # from RESOLVER data (`renderer.rs` `text_of` -> `RenderContext::lookup`); a form field's
      # `.value` exists only at DISPATCH, for ACTION variables (`interact.rs:~251-272`), and
      # `open_bottom_sheet` only toggles `hidden` -- there is no repaint that carries the typed
      # value into this sheet's resolver context. The panel rendered the sentence followed by an
      # EMPTY paragraph. `confirmation_body` is restored to the self-contained sentence ux
      # accepted in round 1 (it never needed the address); the address node is removed rather than
      # left to paint empty. See `gaps:` below on the `sign_in` screen for the real fix.
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.confirmation_body' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.expiry_note' } }
      # The 60s-delayed re-enable is the declared `gaps:` line on the `sign_in` screen (no timer
      # primitive exists in this DSL); this control is always active.
      - { type: text_button, id: member_resend_link, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.resend' }, action: { type: request_member_sign_in_link, variables: { email: "{{ member_email.value }}" }, loading_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.sending' } } }
      - { type: text_button, id: member_sign_in_confirmation_close, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.close' }, action: { type: close_sheet } }

  # #639 part C step 6-iv round 2 (§8.2): invite a colleague by email. Round 2 R2-D: the Art.
  # 14 in-context line (a third party's own address, typed by the manager) sits AT the field --
  # what is sent, to whom, by whom, that the colleague may object, and that the manager confirms
  # they may share this address. `on_success` chaining (closing the sheet AND refreshing the list)
  # is unsupported (#872) -- declared in the screen's own `gaps:`, not invented here.
  invite_member_sheet:
    id: invite_member_sheet
    type: bottom_sheet
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.title' }
    drag_to_close: true
    sections:
      - { type: email_input, id: invite_email, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.email_label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.email_placeholder' }, autofocus: true }
      - type: chip_multi_select
        id: invite_authority
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.authority_label' }
        single_select: true
        # Bare tokens (the `issue_resolution_sheet`/`DeliveryIssueResolution` precedent for a
        # closed-enum chip picker) — MANAGER/OPERATOR, `scalars.yaml#/MemberAuthority`'s two values.
        options:
          - { value: MANAGER,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.authority.manager' } }
          - { value: OPERATOR, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.authority.operator' } }
      - { type: text, id: invite_legal_notice, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.legal_notice' } }
      - type: button
        id: invite_member_btn
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.confirm' }
        variant: primary
        full_width: true
        action:
          # invitationId/memberId are CALLER-MINTED birth keys (ADR-0034) -- the `{{ $uuid }}` mint
          # token (#147, `post_message`/`openReclamation` precedent), resolved to a fresh UUIDv7 at
          # dispatch time by `crate::executor::fill_mint_tokens`, never an invented grammar.
          type: invite_restaurant_member
          variables: { invitationId: "{{ $uuid }}", restaurantId: "{{ restaurant.id }}", invitedEmail: "{{ invite_email.value }}", authority: "{{ invite_authority.value }}", memberId: "{{ $uuid }}" }
          on_success: [{ type: close_sheet }]
      - { type: inline_error, id: invite_member_error, for_action: invite_restaurant_member }

# ──────────────────────────────────────────────────────────────────────────────
# SCREENS
# ──────────────────────────────────────────────────────────────────────────────
screens:

  # SCREEN 1 — Live order queue (the core loop: PLACED → accept/reject → prepare → ready)
  - id: orders_queue
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [orders.byRestaurant]
    actions_used: [accept_order, reject_order, start_preparation, mark_order_ready, cancel_order_by_restaurant, change_order_acceptance]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.title' } }
      - type: tab_bar
        id: queue_tabs
        tabs:
          - { id: incoming,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.incoming' } }
          - { id: preparing, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.preparing' } }
          - { id: ready,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.ready' } }
      - type: order_list
        items: "{{ orders }}"
        item_type: order_card
        empty_state: { icon: receipt, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.empty.body' } }
      # #167: the DECLARED surfacing for a timed-out card. When the acceptance deadline cancels
      # an order (CANCELLED_BY_TIMEOUT) the card leaves the incoming tab with THIS expired
      # treatment — "expired, no response, payment hold being released" — never a silent vanish:
      # the restaurant must see what it lost and why. Rendering is PER-CARD and status-driven
      # (renderer.rs OrderCardStatus arm): one treatment card per bound order whose `status`
      # equals the declared token, and NOTHING when no bound order holds it — so today, with the
      # enforcement gate OFF and no order ever reaching CANCELLED_BY_TIMEOUT, the board shows
      # nothing here (mob STOP on PR #586: the previous unconditional screen-level node rendered
      # the expired copy on every board load).
      - type: order_card_status
        id: acceptance_timed_out
        items: "{{ orders }}"
        status: CANCELLED_BY_TIMEOUT
        icon: clock_x
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.timed_out.title' }
        body: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.timed_out.body' }
      - type: section
        id: order_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.accept' },  variant: primary, action: { type: accept_order,      variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.reject' },  variant: outline, action: { type: reject_order,      variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.start' },   variant: primary, action: { type: start_preparation, variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.ready' },   variant: primary, action: { type: mark_order_ready,  variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.cancel' },  variant: ghost,   action: { type: cancel_order_by_restaurant, variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
      - { component: staff_nav }

  # SCREEN 2 — Delivery board (jobs of my orders; escalate a stuck dispatch; confirm self-dispatch handover)
  - id: deliveries_board
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/deliveries"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [deliveries.byRestaurant]
    # §25b (#745): `restaurantDeliveries` requires `restaurantId!` — the staff surface's own
    # tenant identity, an auth-context fact the paint loop has no source for (no param, no pin).
    # The read has failed structurally on every paint; needs identity-context arg sourcing
    # (#749's machinery) or an identity-carrying transport (#750).
    skipped_reads:
      - resolver: { $ref: '#/resolvers/deliveries.byRestaurant' }
        missing_arg: { $ref: 'api.yaml#/queries/restaurantDeliveries/args/restaurantId' }
        supplied_by: none
        note: "restaurantId is the signed-in staff's own tenant — an identity fact with no paint-time source. Land #749's arg sourcing (or #750's identity-carrying transport + server-side scoping) and the dead-man rule retires this declaration."
    actions_used: [escalate_delivery, mark_order_delivered, resolve_delivery_issue, open_bottom_sheet]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.title' } }
      # #639 part C step 3-i: a job whose `openIssue` is set renders a PINNED card headlined by the
      # kind (French label per kind — one badge per closed value, so the label is a translation and
      # never the raw token), with `[Vu]` opening the resolution sheet. The board's read itself is
      # in `skipped_reads` (§25b, #745): the declaration is the deliverable; the row arrives once
      # #749's arg sourcing lands. Rendered BEFORE the list so it pins.
      - type: conditional_section
        id: delivery_issue_card
        visible_when: "delivery.openIssue != null"
        content:
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.address_not_found' },    variant: warning, visible_when: "delivery.openIssue == 'ADDRESS_NOT_FOUND'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.customer_unreachable' }, variant: warning, visible_when: "delivery.openIssue == 'CUSTOMER_UNREACHABLE'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.restaurant_not_ready' }, variant: warning, visible_when: "delivery.openIssue == 'RESTAURANT_NOT_READY'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.food_damaged' },         variant: warning, visible_when: "delivery.openIssue == 'FOOD_DAMAGED'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.vehicle_or_injury' },    variant: warning, visible_when: "delivery.openIssue == 'VEHICLE_OR_INJURY'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.kind.other' },                variant: warning, visible_when: "delivery.openIssue == 'OTHER'" }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.body' } }
          - { type: button, id: issue_seen_btn, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.seen' }, variant: primary, action: { type: open_bottom_sheet, sheet_id: issue_resolution_sheet } }
      # #639 part C step 3-ii: a handed-back job (`foodLocation` set) renders its OWN pinned card,
      # headlined by where the food physically is — orthogonal to the issue card above (a job can
      # carry either, both, or neither). [Réattribuer]/[Je livre moi-même] are the SAME per-item
      # buttons the section below already binds (escalate_delivery/mark_order_delivered) — reused,
      # not duplicated. [Vu] reuses the issue-resolution sheet, but ONLY when an issue is actually
      # open (`openIssue != null`): this card's own confirm flow dispatches `handBackDelivery`
      # alone (the ADR's "report + hand back" sequencing has no chaining primitive in this DSL yet,
      # see rider.yaml's `job_detail` gap note), so a pinned card from a PURE handback carries
      # nothing for `resolveDeliveryIssue` to acknowledge and stays pinned until reassignment
      # (`foodLocation` resets to null) rather than show a control that would always fail.
      - type: conditional_section
        id: delivery_handback_card
        visible_when: "delivery.foodLocation != null"
        content:
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.handback.with_rider' },    variant: danger,  visible_when: "delivery.foodLocation == 'WITH_RIDER'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.handback.returned' },      variant: warning, visible_when: "delivery.foodLocation == 'RETURNED_TO_RESTAURANT'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.handback.not_collected' }, variant: warning, visible_when: "delivery.foodLocation == 'NOT_COLLECTED'" }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.handback.body' } }
          - { type: button, id: handback_seen_btn, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.issue.seen' }, variant: outline, visible_when: "delivery.openIssue != null", action: { type: open_bottom_sheet, sheet_id: issue_resolution_sheet } }
      - type: order_list
        items: "{{ deliveries }}"
        item_type: order_card
        empty_state: { icon: truck, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.empty.body' } }
      - type: section
        id: delivery_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.escalate' },  variant: outline, action: { type: escalate_delivery,    variables: { orderId: "{{ delivery.orderId }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.delivered' }, variant: primary, action: { type: mark_order_delivered, variables: { orderId: "{{ delivery.orderId }}", restaurantId: "{{ restaurant.id }}" } } }
      - { component: staff_nav }

  # SCREEN 3 — Refund queue (RefundProcess: REQUESTED rows awaiting the restaurant's decision)
  - id: refunds_queue
    roles: [RESTAURANT]
    route: "/refunds"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [refunds.pending]
    actions_used: [approve_refund, deny_refund]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.title' } }
      - type: order_list
        items: "{{ refunds }}"
        item_type: order_card
        empty_state: { icon: coin, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.empty.body' } }
      - type: section
        id: refund_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.approve' }, variant: primary, action: { type: approve_refund, variables: { refundId: "{{ refund.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.deny' },    variant: outline, action: { type: deny_refund,    variables: { refundId: "{{ refund.id }}" } } }
      - { component: staff_nav }

  # SCREEN 4 — Delivery-satisfaction signal (#62: the self-dispatch-vs-Captain decision data)
  - id: satisfaction
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/satisfaction"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [satisfaction.byRestaurant]
    # §25b (#745): same verdict as the deliveries board — `restaurantDeliverySatisfaction`
    # requires `restaurantId!`, an identity fact with no paint-time source on this route.
    skipped_reads:
      - resolver: { $ref: '#/resolvers/satisfaction.byRestaurant' }
        missing_arg: { $ref: 'api.yaml#/queries/restaurantDeliverySatisfaction/args/restaurantId' }
        supplied_by: none
        note: "restaurantId is the signed-in staff's own tenant — see the deliveries board's declaration; same fix, same dead-man retirement."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.title' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.explainer' } }
      - type: order_list
        items: "{{ satisfaction }}"
        item_type: info_row
        empty_state: { icon: star, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.empty.body' } }
      - { component: staff_nav }

  # SCREEN 5 — Order conversation (#129): the STAFF side of the per-order chat. Unlike the customer's
  # single PUBLIC thread (restaurant_frontoffice `order_conversation`), staff read the FULL picture —
  # the PUBLIC timeline AND the INTERNAL staff notes — and can post to either visibility, pull in an
  # admin (escalate) or mute a disruptive role. Two resolvers under two roots (#717: `conversation` =
  # the PUBLIC OrderConversation, `internal_notes` = the staff-only ConversationInternalNotes — one
  # shared root would shadow whichever loads first); `orderId` flows from the route `:orderId`.
  #
  # Follow-up (nicety, not blocking): the mute control omits the optional `until` duration — every mute
  # is indefinite for now; a duration picker (bounded mute) is a later addition. The muted-participants
  # banner binds `conversation.mutedParticipants` through the generic `list` component, which renders one
  # row per entry; a bespoke role+reason row is a renderer follow-up.
  - id: order_conversation
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/orders/:orderId/chat"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [conversation.byOrder, internal_notes.byOrder]
    actions_used: [post_message, escalate_to_admin, mute_participant]
    components:
      - { component: staff_topbar }
      # Header — order ref + live status chip.
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.title' } }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.order_ref' }, value: "{{ conversation.orderId }}" }
      - { type: status_chip, status: "{{ conversation.status }}" }

      # Escalation / mute banner — shown when an admin was pulled in; lists any muted participants.
      - type: section
        id: moderation_banner
        content:
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.admin_invited' }, visible_when: "internal_notes.adminInvited" }
          - type: list
            title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.muted.title' }
            items: "{{ internal_notes.mutedParticipants }}"

      # PUBLIC timeline (customer-visible).
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.label' } }
      - type: message_bubble
        items: "{{ conversation.messages }}"
        item_type: message_bubble
        translated_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.translated' }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.empty.body' }

      # INTERNAL staff notes (lock affordance in the label — staff-only).
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.label' } }
      - type: message_bubble
        items: "{{ internal_notes.notes }}"
        item_type: message_bubble
        translated_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.translated' }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.empty.body' }

      # Compose — body + visibility toggle (PUBLIC/INTERNAL) + send. The toggle is a single-select chip
      # group whose selected value lands in a hidden input `id=visibility`; the send action reads it as
      # `{{ visibility.value }}` (the #114 chip→form-field binding). messageId/originalLocale are the #147
      # dispatch-time mint tokens — the six fields cover every required PostMessage field.
      - type: chip_multi_select
        id: visibility
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.label' }
        single_select: true
        options:
          - { value: PUBLIC,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.public' } }
          - { value: INTERNAL, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.internal' } }
      - type: row
        id: compose
        content:
          - { type: text_input, id: body, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.compose_placeholder' } }
          - type: button
            id: send_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.send' }
            variant: primary
            action:
              type: post_message
              variables:
                orderId: "{{ conversation.orderId }}"
                body: "{{ body.value }}"
                visibility: "{{ visibility.value }}"
                authorRole: "RESTAURANT"
                messageId: "{{ $uuid }}"
                originalLocale: "{{ $locale }}"

      # Escalate to admin — a reason + a button.
      - type: section
        id: escalate
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.label' }
        content:
          - { type: text_input, id: escalation_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.reason_ph' } }
          - type: button
            id: escalate_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.label' }
            variant: outline
            action:
              type: escalate_to_admin
              variables:
                orderId: "{{ conversation.orderId }}"
                reason: "{{ escalation_reason.value }}"

      # Mute a participant — target role (CUSTOMER/RIDER) + a REQUIRED reason (the domain rejects an
      # empty reason via MuteReasonRequired) + a button. `until` (bounded mute) is omitted for now.
      - type: section
        id: mute
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.label' }
        content:
          - type: chip_multi_select
            id: mute_role
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role_label' }
            single_select: true
            options:
              - { value: CUSTOMER, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role.customer' } }
              - { value: RIDER,    label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role.rider' } }
          - { type: text_input, id: mute_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.reason_ph' } }
          - type: button
            id: mute_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.label' }
            variant: outline
            action:
              type: mute_participant
              variables:
                orderId: "{{ conversation.orderId }}"
                mutedRole: "{{ mute_role.value }}"
                reason: "{{ mute_reason.value }}"

      - { component: staff_nav }

  # SCREEN 6 — Claims queue (#157): the restaurant's customer claims, beside the refunds queue. A status
  # filter (the chip's selected value scopes the list at runtime) + claim cards (order · customer ·
  # category · status), tapping through to the resolve panel. Empty state when nothing is outstanding.
  - id: claims_queue
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/claims"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [reclamations.queue]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.title' } }
      # Status filter — the selected value scopes restaurantReclamations(status) at runtime.
      - type: chip_multi_select
        id: status_filter
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.filter.label' }
        single_select: true
        options:
          - { value: OPEN,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.open' } }
          - { value: RESOLVED, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.resolved' } }
          - { value: REJECTED, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.rejected' } }
      # SLA overdue toggle (#160) — a dedicated filter (overdue is orthogonal to status: it always
      # implies OPEN). The selected value scopes restaurantReclamations(overdue) at runtime, exactly
      # like the status chip above; "Overdue only" surfaces OPEN claims past the first-response target.
      - type: chip_multi_select
        id: overdue_filter
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.filter.overdue' }
        single_select: true
        options:
          - { value: "false", label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.all' } }
          - { value: "true",  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.only' } }
      - type: list
        id: claims_list
        items: "{{ reclamations }}"
        item_action: { type: navigate, route: "/claims/{{ item.reclamationId }}" }
        # Per-item SLA marker (#160): the overdue badge shows on any claim the read model flags overdue.
        item_badge: { text: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.badge' }, visible_when: "item.overdue", variant: warning }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.empty.body' }
      - { component: staff_nav }

  # SCREEN 7 — Resolve panel (#157): one claim, every resolution. A resolution chip (FULL_REFUND /
  # PARTIAL_REFUND / REPLACEMENT / GOODWILL_CREDIT — NOT REJECTED, which is the separate Reject control
  # below with a REQUIRED reason). An amount picker (tip_amount_selector — a Money-cents picker, #62)
  # shown for the amount resolutions; its own action confirms a PARTIAL_REFUND with the nested Money
  # `refundAmount` built exactly like tip_order. The main Resolve button covers the no-amount
  # resolutions. Arg `reclamationId` from the route `:reclamationId`.
  - id: claim_resolve
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/claims/:reclamationId"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [reclamation.byId]
    actions_used: [resolve_reclamation, reject_reclamation]
    gaps:
      - "PARTIAL_REFUND has no UI path until a renderer arm lands for `tip_amount_selector` (round 3, #639 part C step 4-iii-A R3-3): the amount picker was DELETED rather than rendered inert, since `tip_amount_selector` has no renderer arm (falls to the generic catch-all — a bare label, no presets, no input, no `data-action`) and an inert money control on a live screen is worse than none — [#888 \"Renderer: `text_area` and `tip_amount_selector` have no arm — …\"](https://github.com/TheCaptainCompany/captain-food/issues/888). `resolve_btn`'s own action still dispatches `resolve_reclamation` for FULL_REFUND/REPLACEMENT/GOODWILL_CREDIT. `refundAmount` currency is hard-coded EUR when the picker returns (V0 Tours is single-currency; View_Reclamation exposes no order currency on the panel); a GOODWILL_CREDIT *amount* is recorded as intent only (the credit ledger is #158, post-V0)."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.title' } }
      - { type: status_chip, status: "{{ reclamation.status }}" }
      # SLA marker (#160): shown only when the read model flags this OPEN claim overdue (past the
      # first-response target). Bound to the computed `overdue` field on the Reclamation api type.
      - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.badge' }, visible_when: "reclamation.overdue", variant: warning }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.order_ref' }, value: "{{ reclamation.orderId }}" }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.category' }, value: "{{ reclamation.category }}" }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.description' }, value: "{{ reclamation.description }}" }

      # Resolve — a resolution chip + optional note. The main button submits the no-amount resolutions.
      - type: chip_multi_select
        id: resolution
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.label' }
        single_select: true
        options:
          - { value: FULL_REFUND,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.full_refund' } }
          - { value: PARTIAL_REFUND,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.partial_refund' } }
          - { value: REPLACEMENT,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.replacement' } }
          - { value: GOODWILL_CREDIT, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.goodwill_credit' } }
      - { type: text_input, id: note, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.note_ph' } }
      # ROUND 3 fix (#639 part C step 4-iii-A R3-3, `screen-condition-on-form-field`): round 2 had
      # rendered this amount picker unconditionally after finding it could never render behind its
      # OWN sheet's `resolution.value in [...]` gate — but `tip_amount_selector` ALSO has no renderer
      # arm (`renderer.rs::render_node_kind` falls to the generic catch-all: a bare "Montant" label,
      # no presets, no input, no `data-action`), so rendering it unconditionally put an INERT
      # MONEY-PATH control on a LIVE screen (`claim_resolve`, routed `/claims/:reclamationId`) — an
      # admin sees a control that looks live and does nothing (CLAUDE.md: worse than no control at
      # all). DELETED rather than un-conditioned. GAP(renderer): #888, `gaps:` line above.
      - type: button
        id: resolve_btn
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.submit' }
        variant: primary
        # No refundAmount here: this covers FULL_REFUND / REPLACEMENT / GOODWILL_CREDIT (recorded intent).
        # PARTIAL_REFUND has no UI path until the amount picker's renderer arm lands
        # ([#888 "Renderer: `text_area` and `tip_amount_selector` have no arm — …"](https://github.com/TheCaptainCompany/captain-food/issues/888));
        # this button carries no `inline_error` of its own either
        # ([#890 "claim_resolve mounts no inline_error for resolve_reclamation"](https://github.com/TheCaptainCompany/captain-food/issues/890)).
        action:
          type: resolve_reclamation
          variables:
            reclamationId: "{{ reclamation.reclamationId }}"
            resolution: "{{ resolution.value }}"
            note: "{{ note.value }}"

      # Reject — a REQUIRED reason (the write model rejects an empty one via RejectionReasonRequired).
      - type: section
        id: reject
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.label' }
        content:
          - { type: text_input, id: reject_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.reason_ph' } }
          - type: button
            id: reject_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.label' }
            variant: outline
            action:
              type: reject_reclamation
              variables:
                reclamationId: "{{ reclamation.reclamationId }}"
                reason: "{{ reject_reason.value }}"
      - { component: staff_nav }

  # SCREEN — Team (#639 part C step 6-iv round 2, ADR-20260905-101349 §2 amendment, PROP §8.2):
  # the restaurant's own roster + invitation list. MANAGER and OPERATOR both see the lists;
  # `roster.viewerAuthority` (resolver DATA, never a form field, never a second `roles:` list) is
  # the ONLY expressible MANAGER condition -- Invite/per-row Revoke are `visible_when` on it.
  - id: team
    roles: [RESTAURANT]
    route: "/team"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [roster.mine, invitations.mine]
    actions_used: [invite_restaurant_member, revoke_restaurant_invitation, open_bottom_sheet]
    gaps:
      - "The per-row Revoke control on the invitation list dispatches `revokeRestaurantInvitation` DIRECTLY off the row, with no confirmation step — `open_bottom_sheet` only toggles a sheet's `hidden` flag and carries no per-row context into it (the SAME #870-class limitation `member_sign_in_confirmation_sheet`'s own `gaps:` line already documents: a `text`/action-variable binding resolves from the SCREEN's own resolver data, never from a DIFFERENT item's row context passed at open time). A confirmation sheet is the card's suggested shape; it cannot correctly bind `invitationId` today without a renderer change this round did not build."
      - "No display name/email column on the roster (`RestaurantRoster`'s own `note:`, YAGNI): a row shows `memberId` and `authority` only, never a human name — a real gap for a MANAGER trying to recognise a colleague, named rather than painted with a fabricated column."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.title' } }
      - type: button
        id: invite_member_open_btn
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invite.open' }
        variant: primary
        visible_when: "roster.viewerAuthority == 'MANAGER'"
        action: { type: open_bottom_sheet, sheet_id: invite_member_sheet }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.roster_heading' } }
      - type: list
        id: roster_list
        items: "{{ roster.items }}"
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.roster.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.roster.empty.body' }
        item_components:
          - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.roster.member' }, value: "{{ item.memberId }}" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.authority.manager' },  variant: info, visible_when: "item.authority == 'MANAGER'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.authority.operator' }, variant: outline, visible_when: "item.authority == 'OPERATOR'" }
          - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.roster.since' }, value: "{{ item.since }}" }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invitations_heading' } }
      - type: list
        id: invitations_list
        items: "{{ invitations }}"
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invitations.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invitations.empty.body' }
        item_components:
          - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invitations.email' }, value: "{{ item.invitedEmail }}" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.status.pending' },                 variant: warning, visible_when: "item.status == 'PENDING'" }
          # ux/business: the accepted-not-yet-granted state is its OWN status, never painted as a
          # plain failure -- "access being activated", not "something went wrong".
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.status.accepted_pending_access' }, variant: info,    visible_when: "item.status == 'ACCEPTED_PENDING_ACCESS'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.status.accepted' },                variant: success, visible_when: "item.status == 'ACCEPTED'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.status.revoked' },                 variant: outline, visible_when: "item.status == 'REVOKED'" }
          - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.status.expired' },                 variant: outline, visible_when: "item.status == 'EXPIRED'" }
          # No expiry COUNTDOWN (no timer primitive in this DSL, the `member_sign_in_confirmation_sheet`
          # precedent) -- a server-rendered date instead.
          - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.invitations.expires' }, value: "{{ item.expiresAt }}", visible_when: "item.status == 'PENDING'" }
          # No "Renvoyer" (resend) control: a re-mint is a new invitation, never an action on an
          # existing row (the card's own instruction) -- omitted rather than rendered dead.
          # `visible_when` has no compound (`&&`) grammar (`crates/web/src/condition.rs`'s parser:
          # one comparison, a quoted literal/null/integer right-hand side) -- gated on
          # `viewerAuthority` alone; the SERVER already refuses `revokeRestaurantInvitation` on a
          # non-PENDING invitation (`RestaurantInvitationAlreadyRevoked`/terminal-state checks), so
          # a stale-status click is refused there, not a security gap, only a UX rough edge on a
          # terminal row this round did not also hide.
          - type: button
            id: revoke_invitation_row_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.team.revoke.confirm' }
            variant: destructive
            visible_when: "roster.viewerAuthority == 'MANAGER'"
            action: { type: revoke_restaurant_invitation, variables: { invitationId: "{{ item.invitationId }}" } }
      - { component: staff_nav }

  # SCREEN — Restaurant profile: the editable LOCATION fields behind UpdateRestaurant.
  #
  # This screen is why `Restaurant.description` exists at all. The column was a spec hole for a long
  # time — a GraphQL field over a column no event fed — precisely because the mutation that can set it
  # had no screen: `updateRestaurant` was reached by story steps only, so `op-uncovered-by-story` was
  # satisfied and nothing ever asked whether a human could reach it.
  #
  # Deliberately NOT the storefront address: that is IDENTITY and keeps its own screen, with the
  # rename consequences stated before the button. This screen is presentation only.
  - id: restaurant_profile
    roles: [RESTAURANT_ACCOUNT]
    route: "/settings/profile"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [restaurant.locations]
    # §25b (#745): `restaurantLocationsByAccount` requires `accountId!` — the signed-in account's
    # own identity, with no paint-time source on this route (an identity-context fact, and — per
    # the #618 IDOR note on the query itself — one the SERVER should resolve, never the client).
    skipped_reads:
      - resolver: { $ref: '#/resolvers/restaurant.locations' }
        missing_arg: { $ref: 'api.yaml#/queries/restaurantLocationsByAccount/args/accountId' }
        supplied_by: none
        note: "accountId is the caller's own account — no paint-time source, and #618 says the resolver should derive it from the credential rather than trust an argument. Either fix retires this declaration via the dead-man rule."
    actions_used: [update_restaurant_profile]
    gaps:
      - "Same missing `restaurantById` query as the storefront screen: the only single-restaurant read is keyed by SLUG, so this screen reads `restaurantLocationsByAccount` and binds the selected location. A restaurant that has not yet chosen a storefront address has no slug to be fetched by."
      - "`openingHours` is editable through UpdateRestaurant but not offered here: a weekly slot editor is a repeatable per-day range control the SDUI component set does not have, and a half-built one would silently drop slots on save. It is left off the form rather than rendered as a control that cannot round-trip the array."
      - "`contact`, `address` and `location` are carried by UpdateRestaurant but stay off this screen: address changes move the geocoded position and the delivery quote, so they belong with a geocoding confirmation step rather than in a free-text profile form."
      - "`marginRate` is an UpdateRestaurant field the owner must NOT set — it is the Captain service-fee split input (ADR-0017), back-office/ADMIN only. It is excluded here by omission; the mutation still accepts it from an ADMIN caller."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.title' } }

      - type: section
        id: identity
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.identity.title' }
        content:
          - { type: text_input, id: display_name_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.name.label' }, value: "{{ restaurant.displayName }}" }
          # The field this whole screen was built for. text_area, not text_input: it is prose.
          - { type: text_area, id: description_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description_ph' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description.help' }, value: "{{ restaurant.description }}", max_length: 2000, rows: 5 }
          - { type: text_input, id: website_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.website.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.website_ph' }, value: "{{ restaurant.website }}" }

      # ONE value, hence single_select — the help text says why, because "cuisine" reads like a
      # discovery filter and is not one (that is `tags`).
      - type: section
        id: cuisine
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.title' }
        content:
          - type: chip_multi_select
            id: cuisine_category
            single_select: true
            help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.help' }
            options:
              - { value: FAST_FOOD,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.fast_food' } }
              - { value: PIZZA,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.pizza' } }
              - { value: TRADITIONAL, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.traditional' } }
              - { value: BISTRONOMIC, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.bistronomic' } }
              - { value: FOOD_TRUCK,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.food_truck' } }

      - type: section
        id: tags
        content:
          - { type: text_input, id: tags_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.tags.label' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.tags.help' } }

      - type: button
        id: save_profile
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.save' }
        variant: primary
        action:
          type: update_restaurant_profile
          variables:
            restaurantId: "{{ restaurant.id }}"
            displayName: "{{ display_name_input.value }}"
            description: "{{ description_input.value }}"
            website: "{{ website_input.value }}"
            cuisineCategory: "{{ cuisine_category.value }}"
            tags: "{{ tags_input.value }}"
      - { component: staff_nav }

  # SCREEN — Storefront address (ADR-20260728-011344): choose the {slug}.captain.food host, or rename it.
  #
  # Why this screen exists rather than a field buried in a profile form: the slug is IDENTITY. It goes on
  # printed menus, QR codes and the Google "Order online" link, and a restaurant cannot be activated
  # without one. The consequences of changing it therefore have to be legible BEFORE the owner commits —
  # hence the explicit consequences block stating what a rename does before the owner commits.
  #
  # `restaurant.slug` is nullable, so the unset case is a first-class state, not an empty string.
  - id: storefront_address
    roles: [RESTAURANT_ACCOUNT]
    route: "/settings/storefront"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.title' }
    sdui: true
    requires_auth: true
    unauthenticated: { type: navigate, route: "/sign-in" }
    data_requirements: [restaurant.locations]
    # §25b (#745): same verdict as the profile screen — `restaurantLocationsByAccount` requires
    # `accountId!` with no paint-time source (see that screen's declaration and the #618 note).
    skipped_reads:
      - resolver: { $ref: '#/resolvers/restaurant.locations' }
        missing_arg: { $ref: 'api.yaml#/queries/restaurantLocationsByAccount/args/accountId' }
        supplied_by: none
        note: "accountId is the caller's own account — see the profile screen's declaration; same fix, same dead-man retirement."
    actions_used: [configure_storefront_slug]
    gaps:
      - "Availability is not checked as the owner types: there is no `restaurantSlugAvailable` query, so the only feedback is the SlugAlreadyTaken rejection on submit. Deliberate -- an availability query is a public existence oracle over the tenant namespace and wants its own decision. The write side is authoritative either way."
      - "No `restaurantById` query exists: the only single-restaurant read (`restaurant`) is keyed by SLUG, which is circular here -- a restaurant with no storefront address cannot be fetched by the thing it lacks. This screen therefore reads `restaurantLocationsByAccount` and binds the selected location. A by-id query is the real fix and is a deliberate API-surface decision, not something to slip in under a screen."
      - "`Previous addresses` has no resolver: SlugAlias is server-internal (it serves the 301 in hosts.rs) and no api.yaml query exposes it. Listing them needs a read model decision, so the section renders from nothing today and is marked here rather than shipped as a live-looking widget bound to no data."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.title' } }

      # Current state. The unset case is the one that matters: it is why activation is refused.
      - type: section
        id: current
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.current.label' }
        content:
          - { type: text, value: "{{ restaurant.slug }}", empty_value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.unset' } }

      - type: section
        id: choose
        content:
          - { type: text_input, id: slug_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.field.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.field_ph' }, suffix: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.suffix' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.help' } }

      # Stated before the button, not after: this is the information that makes the decision reversible
      # in the owner's mind, and it is the whole reason previousSlug is business data.
      - type: section
        id: consequences
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.title' }
        content:
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.redirect' } }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.reserved' } }

      - type: button
        id: save_slug
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.save' }
        variant: primary
        action:
          type: configure_storefront_slug
          variables:
            restaurantId: "{{ restaurant.id }}"
            slug: "{{ slug_input.value }}"
      - { component: staff_nav }

  # SCREEN — The member sign-in door (#639 part C step 6-ii; PROP-20260831-180622 §5 FORK 3 = R1,
  # §8.1). The ONE screen on this surface that speaks to `/public/graphql` (`graphql_role: PUBLIC`):
  # the one mutation it binds admits PUBLIC and nothing else, and the validator refuses the
  # declaration if any bound operation would refuse that role
  # (`screen-graphql-role-refused-operation`). Deliberately NOT `staff_topbar`/`staff_nav`: their
  # controls (pause orders, the nav tabs) are RESTAURANT mutations/reads this screen's transport
  # could never carry. The confirmation panel is a bottom sheet (the rider `sign_in` door's
  # `on_success: open_bottom_sheet` shape) rather than a section "swap" -- the same rendered
  # effect (the screen changes to the confirmation) through an established primitive.
  - id: sign_in
    roles: [PUBLIC]
    route: "/sign-in"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.title' }
    sdui: true
    requires_auth: false
    graphql_role: PUBLIC
    data_requirements: []
    actions_used: [request_member_sign_in_link]
    gaps:
      - "The link-expiry countdown and the 60s-delayed 'Renvoyer un lien' re-enable (PROP-20260831-180622 §8.1) need a client-side timer/countdown primitive this DSL does not declare anywhere yet -- the resend control below is always active (calling the SAME identify-only action again is harmless: the wall is server-side, ADR-20260905-101349 §9) rather than a fake-disabled control that renders and does nothing."
      - "Round 2 R2-L1 (legal, grade (b), counsel to confirm): Art. 13 information is owed AT COLLECTION -- the moment an address is typed and this form's mutation fires, whether or not it turns out to be a roster address (the no-enumeration-oracle design means Captain has already processed a non-member's address by the time any refusal could show it a notice). This screen carries no Art. 13 notice/link yet; MEMBER-SIGN-IN-DOOR-PRECONDITIONS names it as a precondition of the flip, not resolved here."
      - "Round 3 R3-1 (ux, #870 class): the confirmation panel does not echo the typed address back to the operator -- the SDUI `text` node type has no binding to FORM-FIELD state (only to resolver data, `renderer.rs:~1751`'s class), and `open_bottom_sheet` performs no repaint that could carry `member_email`'s dispatch-time value into the sheet's render context. A form-state-to-text binding is the shape of the fix (not built by this slice); the confirmation sentence stays self-contained (`back.sign_in.confirmation_body`) instead of ending in an empty paragraph."
    components:
      - type: sticky_header
        id: member_sign_in_topbar
        slots:
          left: [{ type: logo, asset: "/assets/logo.svg", link: "/sign-in" }]
          center: [{ type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.header' } }]
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.title' } }
      - type: section
        id: member_sign_in_form
        content:
          - { type: email_input, id: member_email, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.email_label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.email_placeholder' }, autofocus: true }
          # Acceptance opens the confirmation panel (never before the response, the #529 rule). The
          # request answers the same way for a roster address and a stranger's (no enumeration
          # oracle, ADR-20260905-101349 §9), so the panel opens for both.
          - { type: button, id: member_request_link, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.request_link' }, variant: primary, full_width: true, action: { type: request_member_sign_in_link, variables: { email: "{{ member_email.value }}" }, loading_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.sending' }, on_success: { type: open_bottom_sheet, sheet_id: member_sign_in_confirmation_sheet } } }
          - { type: inline_error, id: member_request_error, for_action: request_member_sign_in_link }
          # Round 2 R2-U2: the §8.1 mockup's first line was landed missing -- "Ouvrez-le sur cet
          # appareil." is the mitigation for the top magic-link failure mode (opened in a mail
          # client's in-app browser, so the parked session's cookie lands in a browser the
          # operator never returns to): telling them up front to expect and open the link on THIS
          # device.
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.open_on_device' } }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.no_password' } }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in.support_lead' } }

  # SCREEN — The magic-link RETURN landing (#639 part C step 6-ii round 2, R2-D/R2-R2; NOT SDUI --
  # the `checkout`/`order_tracking` precedent): the page the restaurateur's mail client opens.
  # Extracting `?token=` from the opened URL and sequencing confirm -> claim -> route is client
  # logic this DSL declares no query-string-to-variable grammar for (`crates/web/src/router.rs`:
  # "query strings are the caller's to strip"), and `confirmMemberSignIn`'s acceptance-first
  # outcome needs the dispatch+poll sequencing (`crates/web/src/actions.rs`) no SDUI binding
  # expresses either -- both reasons `checkout`/`order_tracking` are hand-written too.
  - id: sign_in_return
    roles: [PUBLIC]
    route: "/sign-in/return"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.sign_in_return.title' }
    sdui: false
    sdui_reason: "Query-string token extraction + acceptance-first confirm/claim/route sequencing -- a hand-written page, the checkout/order_tracking precedent."
    requires_auth: false
    graphql_role: PUBLIC
    data_requirements: []
    actions_used: [confirm_member_sign_in]
    gaps:
      - "`?next=` return-to-screen (ADR-20260905-101349 §13) is a NAMED DEPENDENCY of flipping RUN_MEMBER_SIGN_IN_DOOR, not of this landing page existing -- on success this page always routes to `/` (the orders queue), never back to whatever page the 401 originated from. MEMBER-SIGN-IN-DOOR-PRECONDITIONS names the follow-up."

  # SCREEN — Invitation acceptance (#639 part C step 6-iv round 2, ADR-20260905-101349 §2
  # amendment, PROP §8.3): the two-lane accept, client-sequenced. The SAME reasons `sign_in_return`
  # is hand-written (query-string `?token=`/`?invitationId=` extraction; acceptance-first
  # dispatch+poll sequencing this DSL declares no binding grammar for) apply here TWICE over, since
  # this page sequences TWO commands rather than one.
  - id: invitation_accept
    roles: [PUBLIC]
    route: "/invitation"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.invitation.title' }
    sdui: false
    sdui_reason: "Query-string token/invitationId extraction + a TWO-command acceptance-first sequence (acceptRestaurantInvitation then grantRestaurantAccessByInvitation) -- the sign_in_return precedent, doubled."
    requires_auth: false
    graphql_role: PUBLIC
    data_requirements: []
    actions_used: [accept_restaurant_invitation, grant_restaurant_access_by_invitation]
    gaps:
      - "No consent PREVIEW (restaurant name / invited email / authority) before dispatching: `invitationPreview`, the query the card's R2-C section proposed for this, was not built this round (STOPped and reported: it needs a resolver combining live identity-provider verification with a read-model lookup, a shape with no precedent in this codebase's mechanical query-emission pipeline). The page dispatches straight from the URL's token, exactly like `sign_in_return` does for the sign-in door."
      - "No REFUSE control: there is nothing to decline before either command runs (no preview to refuse FROM), and once accepted the invitation is spent regardless — a `/sign-in` link is offered on every terminal state instead, the `sign_in_return`/`not_linked` precedent."
      - "Terminal states collapse to ONE generic refusal (\"this invitation link is no longer valid\") for every server-side non-acceptable cause (unknown invitationId, wrong verified email, already accepted BY SOMEONE ELSE, revoked, expired) — this is the SERVER's own no-enumeration property (`errors.yaml#/RestaurantInvitationNotAcceptable` is ONE typed refusal for all five), not a missing state machine: the client cannot route differently on a distinction the server itself never reveals. A SEPARATE state exists for leg 2 failing AFTER leg 1 succeeded (the invitation WAS validly accepted) — that state never says \"invalid\"."

  # SCREEN — The not-yet-linked refusal (#639 part C step 6-ii, PROP-20260831-180622 §8.5): its
  # own screen, not a banner -- no nav, no tabs, no counts, no phone (no voice leg). Reached when
  # `confirmMemberSignIn` answers the typed `MemberNotLinked` rejection.
  - id: not_linked
    roles: [PUBLIC]
    route: "/sign-in/not-linked"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.title' }
    sdui: true
    requires_auth: false
    graphql_role: PUBLIC
    data_requirements: []
    actions_used: [navigate]
    gaps:
      - "Printing the VERIFIED address (ux, ADR-20260905-101349 §10): `MemberNotLinked`'s context carries `email`, but no query on this PUBLIC screen's role reads back a just-rejected mutation's error context as resolver data, and no screen anywhere binds one (the rider door's inline_error pattern renders a MESSAGE, not a structured context field, and only inline to the ORIGINATING screen, never a navigated-to one). The body text below is the static two sentences of the §8.5 mockup; the address is not interpolated until a cross-screen error-context binding exists."
      - "SUPPORT_CONTACT is a resolved DEPLOYMENT configuration value (`configuration.yaml`), never a translation string, and no screen anywhere in this DSL binds a config key as `{{ }}` resolver data -- inventing that grammar here is out of this card's scope, so the support address is named by the STATIC translation string below (which a deploy must keep in step with the configured key by hand until such a binding exists) rather than a dynamic `{{ config.* }}` placeholder."
      - "The legal/privacy link (LCEN 6-III + Art. 13, legal): no legal/privacy page exists on this surface yet, so the target is this line rather than a dead route."
      - "Round 2 R2-U3: `sign_out` (`kind: auth`) has no client wiring yet (#94) -- `crates/web/src/executor.rs` renders any `kind: auth` action as `ActionPlan::Disabled`, so this screen's ONLY control was previously dead (a control that renders and does nothing, #888). The exit is a plain `navigate → /sign-in` instead (`ActionKind::Client`, live today): it does not clear the parked/rotated session, only leaves the refusal screen -- the real sign-out wiring (#94) is the named follow-up, not built here."
    components:
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.title' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.body' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.write_to_us' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.support_contact' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.precise' } }
      - { type: button, id: not_linked_sign_out, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.not_linked.sign_out' }, variant: outline, action: { type: navigate, route: "/sign-in" } }
