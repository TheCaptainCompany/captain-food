# ==============================================================================
# Captain.Food — Restaurant Back-Office UI Specification (Spec-Driven Server-Driven UI)
# ------------------------------------------------------------------------------
# The RESTAURANT BACK OFFICE: the staff-facing operations dashboard — live order queue
# (accept/reject/prepare/ready), delivery board, refund decisions and the #62 delivery-satisfaction
# signal — served at restos.captain.food (audience roles RESTAURANT + RESTAURANT_ACCOUNT; host→surface
# convention in the split-4 ADR). One file per audience (ADR-0037 as refined by ADR-20260722-091500);
# the customer-facing surfaces are `restaurant_frontoffice.yaml` (storefront) and
# `captain_frontoffice.yaml` (marketplace); `rider.yaml` is the courier app.
#
# Same two-layer contract as every surface (ADR-0033): a `resolvers`/`actions` data-layer allowlist
# $ref-bound to api.yaml (the codegen PROVES the API answers the UI), and the layout layer below.
# Binds ONLY existing api.yaml operations — this surface adds zero API surface. The component
# vocabulary REUSES the shared renderer registry declared in `restaurant_frontoffice.yaml`
# (one renderer, one ComponentKind dispatch surface); no new kinds are introduced.
# Every user-visible string is a `$ref` into `restaurant_backoffice.translations.yaml` (sidecar,
# ADR-20260722-101500) or the shared `translations.yaml`.
# ==============================================================================

version: 1
spec_version: "1.0.0"
app_id: captain.food.backoffice
app_name: "Captain.Food Back Office"
base_url: "https://restos.captain.food"
default_locale: fr
supported_locales: [en, fr]
app_types: [web, windows]   # staff dashboard: web first; the counter tablet/till build follows (ADR-0037)

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — RESOLVERS (reads). All bound to EXISTING api.yaml queries; the restaurant scope
# (restaurantId) is caller-supplied at runtime from the staff session's restaurant binding.
# ──────────────────────────────────────────────────────────────────────────────
resolvers:
  orders.byRestaurant:       { query: { $ref: 'api.yaml#/queries/orders' } }
  deliveries.byRestaurant:   { query: { $ref: 'api.yaml#/queries/restaurantDeliveries' } }
  refunds.pending:           { query: { $ref: 'api.yaml#/queries/pendingRefunds' } }
  satisfaction.byRestaurant: { query: { $ref: 'api.yaml#/queries/restaurantDeliverySatisfaction' } }
  # #129 — the per-order staff conversation: BOTH the PUBLIC thread and the INTERNAL notes. Staff read
  # the full picture. `orderId` comes from the route `:orderId` (same-name convention). TWO data
  # namespaces on purpose (#717): the runtime stores each resolver's result under its name's FIRST
  # segment, so two resolvers sharing one root silently shadow each other (last write wins) — the
  # public thread reads `{{ conversation.* }}` (api OrderConversation), the staff-only notes read
  # `{{ internal_notes.* }}` (api ConversationInternalNotes, absent from the CUSTOMER schema).
  conversation.byOrder:    { query: { $ref: 'api.yaml#/queries/orderConversation' } }
  internal_notes.byOrder:  { query: { $ref: 'api.yaml#/queries/orderConversationInternalNotes' } }
  # #157 — the claims queue (this restaurant's customer claims, filterable by status/category) + one
  # claim's detail. `reclamationId` for the detail comes from the route `:reclamationId` (same-name).
  reclamations.queue: { query: { $ref: 'api.yaml#/queries/restaurantReclamations' } }
  # ADR-20260728-011344: the storefront-address screen needs THIS restaurant, and the only
  # single-restaurant query (`restaurant`) is keyed by SLUG -- circular when the slug is precisely what
  # is being configured, and unusable for a restaurant that has none yet. So it reads the account's
  # locations and binds the selected one. See the screen's `gaps` for the by-id query this really wants.
  restaurant.locations: { query: { $ref: 'api.yaml#/queries/restaurantLocationsByAccount' } }
  reclamation.byId:   { query: { $ref: 'api.yaml#/queries/reclamation' } }

# ──────────────────────────────────────────────────────────────────────────────
# DATA LAYER — ACTIONS (writes + client behaviours). All mutations exist in api.yaml already.
# `navigate`/`phone_call` redeclare the shared client kinds IDENTICALLY (union rule).
# ──────────────────────────────────────────────────────────────────────────────
actions:
  navigate: { kind: client }
  phone_call: { kind: client }
  accept_order:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/acceptOrder' } }
  reject_order:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/rejectOrder' } }
  start_preparation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/startPreparation' } }
  mark_order_ready:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/markOrderReady' } }
  cancel_order_by_restaurant: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/cancelOrderByRestaurant' } }
  change_order_acceptance:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/changeOrderAcceptanceMode' }, note: "The pause/resume toggle in the header." }
  mark_order_delivered: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/markOrderDelivered' }, note: "Self-dispatch: the restaurant confirms the handover itself." }
  escalate_delivery:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/escalateDelivery' }, note: "Skip the current channel and advance the ranked dispatch walk (#60)." }
  configure_storefront_slug: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/configureRestaurantSlug' }, note: "Choose or rename the storefront host. A rename 301s the old address and keeps it reserved (ADR-20260728-011344)." }
  update_restaurant_profile: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/updateRestaurant' }, note: "The editable LOCATION fields. Replace-on-provided: an omitted field is left alone, never cleared." }
  approve_refund: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/approveRefund' } }
  deny_refund:    { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/denyRefund' } }
  # #129 — order conversation writes. post_message serves BOTH visibilities (PUBLIC reply / INTERNAL note),
  # the visibility toggle picks which. escalate_to_admin / mute_participant are the staff-only moderation moves.
  post_message:      { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/postMessage' } }
  escalate_to_admin: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/escalateToAdmin' } }
  mute_participant:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/muteParticipant' } }
  # #157 — claims queue decisions. resolve serves FULL_REFUND / PARTIAL_REFUND / REPLACEMENT /
  # GOODWILL_CREDIT (never REJECTED — reject is a separate control with a REQUIRED reason). A
  # PARTIAL_REFUND carries a nested Money `refundAmount` (built like the tip_order amount, #62).
  resolve_reclamation: { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/resolveReclamation' } }
  reject_reclamation:  { kind: mutation, mutation: { $ref: 'api.yaml#/mutations/rejectReclamation' } }

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL CHROME — the staff top bar (shared across the four screens).
# ──────────────────────────────────────────────────────────────────────────────
global_components:
  staff_topbar:
    id: staff_topbar
    type: sticky_header
    slots:
      left: [{ type: logo, asset: "/assets/logo.svg", link: "/" }]
      center:
        - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.title' } }
      right:
        - type: button
          id: acceptance_toggle
          label: { $ref: 'restaurant_backoffice.translations.yaml#/back.pause_orders' }
          variant: outline
          action: { type: change_order_acceptance }
  staff_nav:
    id: staff_nav
    type: bottom_navigation
    items:
      - { id: orders,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.orders' },       icon: receipt, route: "/" }
      - { id: deliveries,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.deliveries' },   icon: truck,   route: "/deliveries" }
      - { id: refunds,      label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.refunds' },      icon: coin,    route: "/refunds" }
      - { id: claims,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.claims' },       icon: life_buoy, route: "/claims" }
      - { id: satisfaction, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.nav.satisfaction' }, icon: star,    route: "/satisfaction" }

# ──────────────────────────────────────────────────────────────────────────────
# SCREENS
# ──────────────────────────────────────────────────────────────────────────────
screens:

  # SCREEN 1 — Live order queue (the core loop: PLACED → accept/reject → prepare → ready)
  - id: orders_queue
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.title' }
    sdui: true
    requires_auth: true
    data_requirements: [orders.byRestaurant]
    actions_used: [accept_order, reject_order, start_preparation, mark_order_ready, cancel_order_by_restaurant, change_order_acceptance]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.title' } }
      - type: tab_bar
        id: queue_tabs
        tabs:
          - { id: incoming,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.incoming' } }
          - { id: preparing, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.preparing' } }
          - { id: ready,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.tab.ready' } }
      - type: order_list
        items: "{{ orders }}"
        item_type: order_card
        empty_state: { icon: receipt, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.empty.body' } }
      # #167: the DECLARED surfacing for a timed-out card. When the acceptance deadline cancels
      # an order (CANCELLED_BY_TIMEOUT) the card leaves the incoming tab with THIS expired
      # treatment — "expired, no response, payment hold being released" — never a silent vanish:
      # the restaurant must see what it lost and why. Rendering is PER-CARD and status-driven
      # (renderer.rs OrderCardStatus arm): one treatment card per bound order whose `status`
      # equals the declared token, and NOTHING when no bound order holds it — so today, with the
      # enforcement gate OFF and no order ever reaching CANCELLED_BY_TIMEOUT, the board shows
      # nothing here (mob STOP on PR #586: the previous unconditional screen-level node rendered
      # the expired copy on every board load).
      - type: order_card_status
        id: acceptance_timed_out
        items: "{{ orders }}"
        status: CANCELLED_BY_TIMEOUT
        icon: clock_x
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.timed_out.title' }
        body: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.timed_out.body' }
      - type: section
        id: order_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.accept' },  variant: primary, action: { type: accept_order,      variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.reject' },  variant: outline, action: { type: reject_order,      variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.start' },   variant: primary, action: { type: start_preparation, variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.ready' },   variant: primary, action: { type: mark_order_ready,  variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.orders.cancel' },  variant: ghost,   action: { type: cancel_order_by_restaurant, variables: { orderId: "{{ order.id }}", restaurantId: "{{ restaurant.id }}" } } }
      - { component: staff_nav }

  # SCREEN 2 — Delivery board (jobs of my orders; escalate a stuck dispatch; confirm self-dispatch handover)
  - id: deliveries_board
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/deliveries"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.title' }
    sdui: true
    requires_auth: true
    data_requirements: [deliveries.byRestaurant]
    actions_used: [escalate_delivery, mark_order_delivered]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.title' } }
      - type: order_list
        items: "{{ deliveries }}"
        item_type: order_card
        empty_state: { icon: truck, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.empty.body' } }
      - type: section
        id: delivery_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.escalate' },  variant: outline, action: { type: escalate_delivery,    variables: { orderId: "{{ delivery.orderId }}", restaurantId: "{{ restaurant.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.deliveries.delivered' }, variant: primary, action: { type: mark_order_delivered, variables: { orderId: "{{ delivery.orderId }}", restaurantId: "{{ restaurant.id }}" } } }
      - { component: staff_nav }

  # SCREEN 3 — Refund queue (RefundProcess: REQUESTED rows awaiting the restaurant's decision)
  - id: refunds_queue
    roles: [RESTAURANT]
    route: "/refunds"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.title' }
    sdui: true
    requires_auth: true
    data_requirements: [refunds.pending]
    actions_used: [approve_refund, deny_refund]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.title' } }
      - type: order_list
        items: "{{ refunds }}"
        item_type: order_card
        empty_state: { icon: coin, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.empty.body' } }
      - type: section
        id: refund_actions
        content:
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.approve' }, variant: primary, action: { type: approve_refund, variables: { refundId: "{{ refund.id }}" } } }
          - { type: button, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.refunds.deny' },    variant: outline, action: { type: deny_refund,    variables: { refundId: "{{ refund.id }}" } } }
      - { component: staff_nav }

  # SCREEN 4 — Delivery-satisfaction signal (#62: the self-dispatch-vs-Captain decision data)
  - id: satisfaction
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/satisfaction"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.title' }
    sdui: true
    requires_auth: true
    data_requirements: [satisfaction.byRestaurant]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.title' } }
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.explainer' } }
      - type: order_list
        items: "{{ satisfaction }}"
        item_type: info_row
        empty_state: { icon: star, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.empty.title' }, body: { $ref: 'restaurant_backoffice.translations.yaml#/back.satisfaction.empty.body' } }
      - { component: staff_nav }

  # SCREEN 5 — Order conversation (#129): the STAFF side of the per-order chat. Unlike the customer's
  # single PUBLIC thread (restaurant_frontoffice `order_conversation`), staff read the FULL picture —
  # the PUBLIC timeline AND the INTERNAL staff notes — and can post to either visibility, pull in an
  # admin (escalate) or mute a disruptive role. Two resolvers under two roots (#717: `conversation` =
  # the PUBLIC OrderConversation, `internal_notes` = the staff-only ConversationInternalNotes — one
  # shared root would shadow whichever loads first); `orderId` flows from the route `:orderId`.
  #
  # Follow-up (nicety, not blocking): the mute control omits the optional `until` duration — every mute
  # is indefinite for now; a duration picker (bounded mute) is a later addition. The muted-participants
  # banner binds `conversation.mutedParticipants` through the generic `list` component, which renders one
  # row per entry; a bespoke role+reason row is a renderer follow-up.
  - id: order_conversation
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/orders/:orderId/chat"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.title' }
    sdui: true
    requires_auth: true
    data_requirements: [conversation.byOrder, internal_notes.byOrder]
    actions_used: [post_message, escalate_to_admin, mute_participant]
    components:
      - { component: staff_topbar }
      # Header — order ref + live status chip.
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.title' } }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.order_ref' }, value: "{{ conversation.orderId }}" }
      - { type: status_chip, status: "{{ conversation.status }}" }

      # Escalation / mute banner — shown when an admin was pulled in; lists any muted participants.
      - type: section
        id: moderation_banner
        content:
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.admin_invited' }, visible_when: "internal_notes.adminInvited" }
          - type: list
            title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.muted.title' }
            items: "{{ internal_notes.mutedParticipants }}"

      # PUBLIC timeline (customer-visible).
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.label' } }
      - type: message_bubble
        items: "{{ conversation.messages }}"
        item_type: message_bubble
        translated_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.translated' }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.public.empty.body' }

      # INTERNAL staff notes (lock affordance in the label — staff-only).
      - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.label' } }
      - type: message_bubble
        items: "{{ internal_notes.notes }}"
        item_type: message_bubble
        translated_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.translated' }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.internal.empty.body' }

      # Compose — body + visibility toggle (PUBLIC/INTERNAL) + send. The toggle is a single-select chip
      # group whose selected value lands in a hidden input `id=visibility`; the send action reads it as
      # `{{ visibility.value }}` (the #114 chip→form-field binding). messageId/originalLocale are the #147
      # dispatch-time mint tokens — the six fields cover every required PostMessage field.
      - type: chip_multi_select
        id: visibility
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.label' }
        single_select: true
        options:
          - { value: PUBLIC,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.public' } }
          - { value: INTERNAL, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.visibility.internal' } }
      - type: row
        id: compose
        content:
          - { type: text_input, id: body, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.compose_placeholder' } }
          - type: button
            id: send_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.send' }
            variant: primary
            action:
              type: post_message
              variables:
                orderId: "{{ conversation.orderId }}"
                body: "{{ body.value }}"
                visibility: "{{ visibility.value }}"
                authorRole: "RESTAURANT"
                messageId: "{{ $uuid }}"
                originalLocale: "{{ $locale }}"

      # Escalate to admin — a reason + a button.
      - type: section
        id: escalate
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.label' }
        content:
          - { type: text_input, id: escalation_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.reason_ph' } }
          - type: button
            id: escalate_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.escalate.label' }
            variant: outline
            action:
              type: escalate_to_admin
              variables:
                orderId: "{{ conversation.orderId }}"
                reason: "{{ escalation_reason.value }}"

      # Mute a participant — target role (CUSTOMER/RIDER) + a REQUIRED reason (the domain rejects an
      # empty reason via MuteReasonRequired) + a button. `until` (bounded mute) is omitted for now.
      - type: section
        id: mute
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.label' }
        content:
          - type: chip_multi_select
            id: mute_role
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role_label' }
            single_select: true
            options:
              - { value: CUSTOMER, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role.customer' } }
              - { value: RIDER,    label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.role.rider' } }
          - { type: text_input, id: mute_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.reason_ph' } }
          - type: button
            id: mute_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.chat.mute.label' }
            variant: outline
            action:
              type: mute_participant
              variables:
                orderId: "{{ conversation.orderId }}"
                mutedRole: "{{ mute_role.value }}"
                reason: "{{ mute_reason.value }}"

      - { component: staff_nav }

  # SCREEN 6 — Claims queue (#157): the restaurant's customer claims, beside the refunds queue. A status
  # filter (the chip's selected value scopes the list at runtime) + claim cards (order · customer ·
  # category · status), tapping through to the resolve panel. Empty state when nothing is outstanding.
  - id: claims_queue
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/claims"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.title' }
    sdui: true
    requires_auth: true
    data_requirements: [reclamations.queue]
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.title' } }
      # Status filter — the selected value scopes restaurantReclamations(status) at runtime.
      - type: chip_multi_select
        id: status_filter
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.filter.label' }
        single_select: true
        options:
          - { value: OPEN,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.open' } }
          - { value: RESOLVED, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.resolved' } }
          - { value: REJECTED, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.status.rejected' } }
      # SLA overdue toggle (#160) — a dedicated filter (overdue is orthogonal to status: it always
      # implies OPEN). The selected value scopes restaurantReclamations(overdue) at runtime, exactly
      # like the status chip above; "Overdue only" surfaces OPEN claims past the first-response target.
      - type: chip_multi_select
        id: overdue_filter
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.filter.overdue' }
        single_select: true
        options:
          - { value: "false", label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.all' } }
          - { value: "true",  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.only' } }
      - type: list
        id: claims_list
        items: "{{ reclamations }}"
        item_action: { type: navigate, route: "/claims/{{ item.reclamationId }}" }
        # Per-item SLA marker (#160): the overdue badge shows on any claim the read model flags overdue.
        item_badge: { text: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.badge' }, visible_when: "item.overdue", variant: warning }
        empty_state:
          title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.empty.title' }
          body: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.empty.body' }
      - { component: staff_nav }

  # SCREEN 7 — Resolve panel (#157): one claim, every resolution. A resolution chip (FULL_REFUND /
  # PARTIAL_REFUND / REPLACEMENT / GOODWILL_CREDIT — NOT REJECTED, which is the separate Reject control
  # below with a REQUIRED reason). An amount picker (tip_amount_selector — a Money-cents picker, #62)
  # shown for the amount resolutions; its own action confirms a PARTIAL_REFUND with the nested Money
  # `refundAmount` built exactly like tip_order. The main Resolve button covers the no-amount
  # resolutions. Arg `reclamationId` from the route `:reclamationId`.
  - id: claim_resolve
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    route: "/claims/:reclamationId"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.title' }
    sdui: true
    requires_auth: true
    data_requirements: [reclamation.byId]
    actions_used: [resolve_reclamation, reject_reclamation]
    gaps:
      - "refundAmount currency is hard-coded EUR (V0 Tours is single-currency; View_Reclamation exposes no order currency on the panel). PARTIAL_REFUND is fully wired via the amount picker's own action; a GOODWILL_CREDIT *amount* is recorded as intent only (the credit ledger is #158, post-V0)."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.title' } }
      - { type: status_chip, status: "{{ reclamation.status }}" }
      # SLA marker (#160): shown only when the read model flags this OPEN claim overdue (past the
      # first-response target). Bound to the computed `overdue` field on the Reclamation api type.
      - { type: badge, text: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.overdue.badge' }, visible_when: "reclamation.overdue", variant: warning }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.order_ref' }, value: "{{ reclamation.orderId }}" }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.category' }, value: "{{ reclamation.category }}" }
      - { type: info_row, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.description' }, value: "{{ reclamation.description }}" }

      # Resolve — a resolution chip + optional note. The main button submits the no-amount resolutions.
      - type: chip_multi_select
        id: resolution
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.label' }
        single_select: true
        options:
          - { value: FULL_REFUND,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.full_refund' } }
          - { value: PARTIAL_REFUND,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.partial_refund' } }
          - { value: REPLACEMENT,     label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.replacement' } }
          - { value: GOODWILL_CREDIT, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolution.goodwill_credit' } }
      - { type: text_input, id: note, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.note_ph' } }
      # Amount picker — for PARTIAL_REFUND (and GOODWILL_CREDIT). Its OWN action confirms the partial
      # refund with a nested Money `refundAmount` (amountCents from the picker, currency EUR), so the
      # partial-refund path is fully wired without conditional variables on the main button.
      - type: tip_amount_selector
        id: refund_amount
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.amount.title' }
        subtitle: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.amount.subtitle' }
        visible_when: "resolution.value in ['PARTIAL_REFUND','GOODWILL_CREDIT']"
        presets_cents: [200, 450, 500, 1000]
        custom_label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.amount.custom' }
        action:
          type: resolve_reclamation
          variables:
            reclamationId: "{{ reclamation.reclamationId }}"
            resolution: "PARTIAL_REFUND"
            note: "{{ note.value }}"
            refundAmount: { amountCents: "{{ refund_amount.value }}", currency: "EUR" }
      - type: button
        id: resolve_btn
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.resolve.submit' }
        variant: primary
        # No refundAmount here: this covers FULL_REFUND / REPLACEMENT / GOODWILL_CREDIT (recorded intent).
        # PARTIAL_REFUND is confirmed through the amount picker's own action above.
        action:
          type: resolve_reclamation
          variables:
            reclamationId: "{{ reclamation.reclamationId }}"
            resolution: "{{ resolution.value }}"
            note: "{{ note.value }}"

      # Reject — a REQUIRED reason (the write model rejects an empty one via RejectionReasonRequired).
      - type: section
        id: reject
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.label' }
        content:
          - { type: text_input, id: reject_reason, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.reason_ph' } }
          - type: button
            id: reject_btn
            label: { $ref: 'restaurant_backoffice.translations.yaml#/back.claims.reject.label' }
            variant: outline
            action:
              type: reject_reclamation
              variables:
                reclamationId: "{{ reclamation.reclamationId }}"
                reason: "{{ reject_reason.value }}"
      - { component: staff_nav }

  # SCREEN — Restaurant profile: the editable LOCATION fields behind UpdateRestaurant.
  #
  # This screen is why `Restaurant.description` exists at all. The column was a spec hole for a long
  # time — a GraphQL field over a column no event fed — precisely because the mutation that can set it
  # had no screen: `updateRestaurant` was reached by story steps only, so `op-uncovered-by-story` was
  # satisfied and nothing ever asked whether a human could reach it.
  #
  # Deliberately NOT the storefront address: that is IDENTITY and keeps its own screen, with the
  # rename consequences stated before the button. This screen is presentation only.
  - id: restaurant_profile
    roles: [RESTAURANT_ACCOUNT]
    route: "/settings/profile"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.title' }
    sdui: true
    requires_auth: true
    data_requirements: [restaurant.locations]
    actions_used: [update_restaurant_profile]
    gaps:
      - "Same missing `restaurantById` query as the storefront screen: the only single-restaurant read is keyed by SLUG, so this screen reads `restaurantLocationsByAccount` and binds the selected location. A restaurant that has not yet chosen a storefront address has no slug to be fetched by."
      - "`openingHours` is editable through UpdateRestaurant but not offered here: a weekly slot editor is a repeatable per-day range control the SDUI component set does not have, and a half-built one would silently drop slots on save. It is left off the form rather than rendered as a control that cannot round-trip the array."
      - "`contact`, `address` and `location` are carried by UpdateRestaurant but stay off this screen: address changes move the geocoded position and the delivery quote, so they belong with a geocoding confirmation step rather than in a free-text profile form."
      - "`marginRate` is an UpdateRestaurant field the owner must NOT set — it is the Captain service-fee split input (ADR-0017), back-office/ADMIN only. It is excluded here by omission; the mutation still accepts it from an ADMIN caller."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.title' } }

      - type: section
        id: identity
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.identity.title' }
        content:
          - { type: text_input, id: display_name_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.name.label' }, value: "{{ restaurant.displayName }}" }
          # The field this whole screen was built for. text_area, not text_input: it is prose.
          - { type: text_area, id: description_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description_ph' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.description.help' }, value: "{{ restaurant.description }}", max_length: 2000, rows: 5 }
          - { type: text_input, id: website_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.website.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.website_ph' }, value: "{{ restaurant.website }}" }

      # ONE value, hence single_select — the help text says why, because "cuisine" reads like a
      # discovery filter and is not one (that is `tags`).
      - type: section
        id: cuisine
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.title' }
        content:
          - type: chip_multi_select
            id: cuisine_category
            single_select: true
            help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.help' }
            options:
              - { value: FAST_FOOD,   label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.fast_food' } }
              - { value: PIZZA,       label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.pizza' } }
              - { value: TRADITIONAL, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.traditional' } }
              - { value: BISTRONOMIC, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.bistronomic' } }
              - { value: FOOD_TRUCK,  label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.cuisine.food_truck' } }

      - type: section
        id: tags
        content:
          - { type: text_input, id: tags_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.tags.label' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.tags.help' } }

      - type: button
        id: save_profile
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.profile.save' }
        variant: primary
        action:
          type: update_restaurant_profile
          variables:
            restaurantId: "{{ restaurant.id }}"
            displayName: "{{ display_name_input.value }}"
            description: "{{ description_input.value }}"
            website: "{{ website_input.value }}"
            cuisineCategory: "{{ cuisine_category.value }}"
            tags: "{{ tags_input.value }}"
      - { component: staff_nav }

  # SCREEN — Storefront address (ADR-20260728-011344): choose the {slug}.captain.food host, or rename it.
  #
  # Why this screen exists rather than a field buried in a profile form: the slug is IDENTITY. It goes on
  # printed menus, QR codes and the Google "Order online" link, and a restaurant cannot be activated
  # without one. The consequences of changing it therefore have to be legible BEFORE the owner commits —
  # hence the explicit consequences block stating what a rename does before the owner commits.
  #
  # `restaurant.slug` is nullable, so the unset case is a first-class state, not an empty string.
  - id: storefront_address
    roles: [RESTAURANT_ACCOUNT]
    route: "/settings/storefront"
    title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.title' }
    sdui: true
    requires_auth: true
    data_requirements: [restaurant.locations]
    actions_used: [configure_storefront_slug]
    gaps:
      - "Availability is not checked as the owner types: there is no `restaurantSlugAvailable` query, so the only feedback is the SlugAlreadyTaken rejection on submit. Deliberate -- an availability query is a public existence oracle over the tenant namespace and wants its own decision. The write side is authoritative either way."
      - "No `restaurantById` query exists: the only single-restaurant read (`restaurant`) is keyed by SLUG, which is circular here -- a restaurant with no storefront address cannot be fetched by the thing it lacks. This screen therefore reads `restaurantLocationsByAccount` and binds the selected location. A by-id query is the real fix and is a deliberate API-surface decision, not something to slip in under a screen."
      - "`Previous addresses` has no resolver: SlugAlias is server-internal (it serves the 301 in hosts.rs) and no api.yaml query exposes it. Listing them needs a read model decision, so the section renders from nothing today and is marked here rather than shipped as a live-looking widget bound to no data."
    components:
      - { component: staff_topbar }
      - { type: page_header, title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.title' } }

      # Current state. The unset case is the one that matters: it is why activation is refused.
      - type: section
        id: current
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.current.label' }
        content:
          - { type: text, value: "{{ restaurant.slug }}", empty_value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.unset' } }

      - type: section
        id: choose
        content:
          - { type: text_input, id: slug_input, label: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.field.label' }, placeholder: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.field_ph' }, suffix: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.suffix' }, help: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.help' } }

      # Stated before the button, not after: this is the information that makes the decision reversible
      # in the owner's mind, and it is the whole reason previousSlug is business data.
      - type: section
        id: consequences
        title: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.title' }
        content:
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.redirect' } }
          - { type: text, value: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.consequences.reserved' } }

      - type: button
        id: save_slug
        label: { $ref: 'restaurant_backoffice.translations.yaml#/back.storefront.save' }
        variant: primary
        action:
          type: configure_storefront_slug
          variables:
            restaurantId: "{{ restaurant.id }}"
            slug: "{{ slug_input.value }}"
      - { component: staff_nav }
