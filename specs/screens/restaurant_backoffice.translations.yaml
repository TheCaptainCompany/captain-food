# --- Storefront address (ADR-20260728-011344) ---
# The slug is the tenant HOST, so the copy has to make the consequences of changing it legible BEFORE
# the owner commits: old links keep working via a 301, and the previous address stays reserved to them.
back.storefront.title:          { messages: { en: "Storefront address", fr: "Adresse de la boutique" } }
back.storefront.current.label:  { messages: { en: "Current address", fr: "Adresse actuelle" } }
