back.storefront.consequences.title: { messages: { en: "What happens when you change it", fr: "Ce qui se passe si vous la changez" } }
back.storefront.consequences.redirect: { messages: { en: "Your old address redirects here, so printed menus and QR codes keep working.", fr: "Votre ancienne adresse redirige ici : menus imprimés et QR codes continuent de fonctionner." } }
