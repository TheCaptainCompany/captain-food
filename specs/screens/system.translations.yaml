version: 1
description: >
  System-surface UI strings (ADR-0033; sidecar convention ADR-20260722-101500) — the
  surface-specific translation catalog for `screens/system.yaml` (internal ADMIN operations @
  system.captain.food). First block: the actor-mailbox supervision page (#242 Runtime B). The
  codegen merges every translations file into a single `translations.generated.json`; keys are
  globally namespaced and unique across all files. Same convention as translations.yaml (dotted
  key - optional params - en+fr messages with matching {param} tokens).

# ── mailbox supervision ───────────────────────────────────────────────────────
mailbox.title:          { messages: { en: "Actor mailbox", fr: "Boîte aux lettres des acteurs" } }
mailbox.subtitle:       { messages: { en: "One lane per (actor type, partition) — leases, checkpoints and backlog.", fr: "Une voie par (type d'acteur, partition) — baux, points de contrôle et arriéré." } }
mailbox.lanes:          { messages: { en: "Lanes", fr: "Voies" } }
mailbox.lane:           { messages: { en: "Lane", fr: "Voie" } }
mailbox.owner:          { messages: { en: "Owner", fr: "Propriétaire" } }
mailbox.lease:          { messages: { en: "Lease until", fr: "Bail jusqu'à" } }
mailbox.ownership:      { messages: { en: "Ownership version", fr: "Version de propriété" } }
mailbox.checkpoint:     { messages: { en: "Checkpoint", fr: "Point de contrôle" } }
mailbox.pending:        { messages: { en: "Pending", fr: "En attente" } }
mailbox.scheduled:      { messages: { en: "Scheduled", fr: "Planifiés" } }
mailbox.oldest_pending: { messages: { en: "Oldest pending since", fr: "Plus ancien en attente depuis" } }
mailbox.registration:   { messages: { en: "Registration", fr: "Enregistrement" } }
mailbox.empty.title:    { messages: { en: "No lanes registered", fr: "Aucune voie enregistrée" } }
mailbox.empty.body:     { messages: { en: "No actor declares a mailbox in this build. Lanes come from the declaration (actors.yaml mailbox.partitions), not from what a worker has registered, so this list is never empty just because no worker has started.", fr: "Aucun acteur ne declare de boite aux lettres dans cette version. Les voies proviennent de la declaration (actors.yaml mailbox.partitions), pas de ce qu'un worker a enregistre : cette liste n'est donc jamais vide du seul fait qu'aucun worker n'a demarre." } }
mailbox.guide.title:    { messages: { en: "How to read this page", fr: "Comment lire cette page" } }
mailbox.guide.body:     { messages: { en: "Every DECLARED lane is listed, seeded or not, so read the Registration badge first. Seeded: a healthy lane has a live lease and pending near zero; a growing pending count with an expired lease means no worker owns the lane, and with a live lease it means the owner is stuck. Never seeded: no worker has EVER started for this lane, so no owner, no lease and ownership version 0 are expected, not a fault — but pending above zero here is the serious one, because nothing is coming to drain it; that is a paid order waiting on a worker that was never deployed. Stranded: work addressed outside the declared keyspace by a past width change — nothing will ever drain it and it needs a deliberate cutover. Ownership version increments on every takeover, so it should be stable outside deployments.", fr: "Toutes les voies DECLAREES sont listees, initialisees ou non : lisez d'abord le badge Enregistrement. Initialisee : une voie saine a un bail actif et un arriere proche de zero ; un arriere croissant avec un bail expire signifie qu'aucun worker ne possede la voie, et avec un bail actif que le proprietaire est bloque. Jamais initialisee : aucun worker n'a JAMAIS demarre pour cette voie, donc l'absence de proprietaire et de bail et une version de propriete a 0 sont normales — mais un arriere superieur a zero y est le cas grave, car rien ne viendra le traiter : c'est une commande payee qui attend un worker jamais deploye. Orpheline : du travail adresse hors de l'espace declare par un ancien changement de largeur — rien ne le traitera jamais et cela exige une bascule deliberee. La version de propriete s'incremente a chaque reprise : elle doit rester stable hors deploiements." } }

# ── poisoned rows + requeue (#315) ────────────────────────────────────────────
mailbox.poisoned.title:       { messages: { en: "Poisoned rows", fr: "Lignes empoisonnées" } }
mailbox.poisoned.guide:       { messages: { en: "Rows terminally FAILED at the delivery-attempts cap. Fix the cause first (the error code is the lead), then requeue — the row returns to RECEIVED with its attempts reset and its lane is nudged. Judge before you click: the row re-enters AHEAD of newer work on its lane and replays an OLD intent after everything delivered since (last-write-wins updates can reverse). A row whose error names a payload decode failure cannot be recovered by requeue — it would only fail again.", fr: "Lignes en échec définitif au plafond de tentatives de livraison. Corrigez d'abord la cause (le code d'erreur est la piste), puis remettez en file — la ligne repasse à RECEIVED, ses tentatives sont réinitialisées et sa voie est relancée. Jugez avant de cliquer : la ligne repasse DEVANT le travail plus récent de sa voie et rejoue une intention ANCIENNE après tout ce qui a été livré depuis (les mises à jour dernier-écrit-gagne peuvent s'inverser). Une ligne dont l'erreur indique un échec de décodage ne peut pas être récupérée par remise en file — elle échouerait à nouveau." } }
mailbox.poisoned.message:     { messages: { en: "Message", fr: "Message" } }
mailbox.poisoned.id:          { messages: { en: "Message id", fr: "Identifiant du message" } }
mailbox.poisoned.attempts:    { messages: { en: "Attempts", fr: "Tentatives" } }
mailbox.poisoned.error:       { messages: { en: "Error code", fr: "Code d'erreur" } }
mailbox.poisoned.received:    { messages: { en: "Received at", fr: "Reçu à" } }
mailbox.poisoned.requeue:     { messages: { en: "Requeue", fr: "Remettre en file" } }
mailbox.poisoned.empty.title: { messages: { en: "No poisoned rows", fr: "Aucune ligne empoisonnée" } }
mailbox.poisoned.empty.body:  { messages: { en: "Nothing has failed at the delivery-attempts cap. This is the healthy state.", fr: "Rien n'a échoué au plafond de tentatives de livraison. C'est l'état sain." } }

# ── rider roster (#639 part C step 4-iii-A, ADR-20260904-152807 §5-6) ────────────────────────
# Never `rider.restrict.*` — one letter from the rider's OWN `rider.restricted.*` block
# (specs/screens/rider.translations.yaml) would be a copy-paste hazard between the two surfaces.
roster.title:              { messages: { en: "Riders", fr: "Livreurs" } }
roster.subtitle:           { messages: { en: "Triage: riders holding a job first, then restricted, then active.", fr: "Triage : livreurs tenant une commande d'abord, puis restreints, puis actifs." } }
roster.list.name:          { messages: { en: "Name", fr: "Nom" } }
roster.detail.title:       { messages: { en: "Rider detail", fr: "Détail du livreur" } }
roster.empty.title:        { messages: { en: "No riders", fr: "Aucun livreur" } }
roster.empty.body:         { messages: { en: "No rider has registered yet.", fr: "Aucun livreur ne s'est encore inscrit." } }

# Access (standing) — the ONLY two badges the LIST shows besides the held-job stage.
roster.standing.restricted: { messages: { en: "Restricted", fr: "Restreint" } }
roster.standing.active:     { messages: { en: "Active", fr: "Actif" } }
roster.access_label:        { messages: { en: "Access", fr: "Accès" } }

# Availability (RiderStatus) — DETAIL only; SUSPENDED is the retired legacy value (ADR-20260904-014136
# §4/§6), never rendered as a standing/access badge and never hidden.
roster.status.offline:          { messages: { en: "Offline", fr: "Hors ligne" } }
roster.status.available:        { messages: { en: "Available", fr: "Disponible" } }
roster.status.on_delivery:      { messages: { en: "On delivery", fr: "En course" } }
roster.status.suspended_legacy: { messages: { en: "Suspended (legacy status)", fr: "Suspendu (ancien statut)" } }
roster.availability_label:      { messages: { en: "Availability", fr: "Disponibilité" } }

# The held job — stage badges (LIST + DETAIL, `held_by_rider`/`held_by_riders`' own narrowing:
# ASSIGNED/PICKED_UP/OUT_FOR_DELIVERY, never the other DeliveryStatus values) and, DETAIL only,
# the foodLocation badges (a handback's custody fact, #639 part C step 3-ii).
roster.held.assigned:              { messages: { en: "Assigned", fr: "Assignée" } }
roster.held.picked_up:             { messages: { en: "Picked up", fr: "Récupérée" } }
roster.held.out_for_delivery:      { messages: { en: "Out for delivery", fr: "En livraison" } }
roster.food_location.with_rider:            { messages: { en: "With the rider", fr: "Chez le livreur" } }
roster.food_location.returned_to_restaurant: { messages: { en: "Returned to the restaurant", fr: "Retournée au restaurant" } }
roster.food_location.not_collected:         { messages: { en: "Not collected", fr: "Non récupérée" } }
roster.pickup_label:               { messages: { en: "Pickup", fr: "Récupération" } }

# The grounds — the SAME closed four the rider's own notice names, with the admin's OWN nouns
# (ADR §6: labels name the FACT, not a claim).
roster.ground.rider_requested:              { messages: { en: "At the rider's request", fr: "À la demande du rider" } }
roster.ground.eligibility_document_lapsed:  { messages: { en: "Eligibility document lapsed", fr: "Justificatif expiré" } }
roster.ground.identity_mismatch:            { messages: { en: "Identity mismatch", fr: "Identité non concordante" } }
roster.ground.account_compromise:           { messages: { en: "Account compromise", fr: "Compte compromis" } }
roster.effective_since:                     { messages: { en: "Effective since", fr: "Effectif depuis" } }
# Round 2 item 4 (legal): a reinstated rider's past ground/effective-since are gated OFF
# (`standing == 'RESTRICTED'` only); this is the ACTIVE-only counterpart naming the OTHER fact —
# `reinstatedAt`, already selected by the resolver, rendered nowhere before this round.
roster.detail.reinstated_at_label:          { messages: { en: "Reinstated on", fr: "Rétabli le" } }
roster.phone_label:                         { messages: { en: "Phone", fr: "Téléphone" } }

# The two controls.
roster.restrict.open:      { messages: { en: "Restrict access", fr: "Restreindre l'accès" } }
roster.reinstate.action:   { messages: { en: "Lift the restriction", fr: "Lever la restriction" } }

# The sheet (`restrict_rider_sheet`).
# Round 2 addendum item 14: stage-honest — ASSIGNED (not yet collected) gets its own sentence,
# never "récupérée" (collected), which only PICKED_UP/OUT_FOR_DELIVERY have earned.
roster.restrict.holds_job_assigned: { messages: { en: "Holds an order — not yet collected. The restriction does not take it away.", fr: "Tient une commande — pas encore récupérée. La restriction ne la lui retire pas." } }
roster.restrict.holds_job:   { messages: { en: "Holds an order — collected. The restriction does not take it away.", fr: "Tient une commande — récupérée. La restriction ne la lui retire pas." } }
roster.restrict.consequence: { messages: { en: "Will no longer receive runs; keeps access to finish or return the run in progress.", fr: "Ne recevra plus de courses ; garde l'accès pour terminer ou rendre la course en cours." } }
roster.restrict.ground_label: { messages: { en: "Ground", fr: "Motif" } }
roster.restrict.effective_now: { messages: { en: "Effective: now", fr: "Effectif : maintenant" } }
roster.restrict.notice:      { messages: { en: "The rider is told in the app the next time they open it.", fr: "Le rider est informé dans l'application à sa prochaine ouverture." } }
roster.restrict.rider_requested_procedure: { messages: { en: "Keep the rider's message (procedure).", fr: "Conservez le message du rider (procédure)." } }
roster.restrict.confirm:     { messages: { en: "Restrict access now", fr: "Restreindre l'accès maintenant" } }

# ── The ADMIN sign-in door (#639 part C step 6-iii, ADR-20260906-023825) ─────────────────────
# Neutral throughout (legal): no "not yet linked" implication, no entity/capacity/employment
# words, no population statement. `sys.no_access.body` names the typed refusal only -- it must
# never assert what a lookup found beyond that one fact.
sys.sign_in.header:            { messages: { en: "Captain.Food — internal tools", fr: "Captain.Food — outils internes" } }
sys.sign_in.title:             { messages: { en: "Sign in", fr: "Connexion" } }
sys.sign_in.email_label:       { messages: { en: "Email address", fr: "Adresse e-mail" } }
sys.sign_in.email_placeholder: { messages: { en: "you@captain.food", fr: "vous@captain.food" } }
sys.sign_in.request_link:      { messages: { en: "Send my sign-in link", fr: "Recevoir mon lien de connexion" } }
sys.sign_in.sending:           { messages: { en: "Sending…", fr: "Envoi en cours…" } }
sys.sign_in.open_on_device:    { messages: { en: "We'll send you a link. Open it on this device.", fr: "Nous vous envoyons un lien. Ouvrez-le sur cet appareil." } }
sys.sign_in.no_password:       { messages: { en: "No password: the link replaces it.", fr: "Aucun mot de passe : le lien remplace le mot de passe." } }
sys.sign_in.support_lead:      { messages: { en: "A problem? support@captain.food", fr: "Un problème ? support@captain.food" } }
sys.sign_in.confirmation_body: { messages: { en: "If this address has platform access, a link has just been sent to it.", fr: "Si cette adresse dispose d'un accès plateforme, un lien vient de lui être envoyé." } }

sys.sign_in_return.title:      { messages: { en: "Signing you in…", fr: "Connexion en cours…" } }
sys.sign_in_return.working:    { messages: { en: "Please wait, we're checking your link…", fr: "Merci de patienter, nous vérifions votre lien…" } }
sys.sign_in_return.no_token:   { messages: { en: "This link is incomplete. Please request a new one.", fr: "Ce lien est incomplet. Merci d'en demander un nouveau." } }
sys.sign_in_return.failed:     { messages: { en: "This link is invalid or has expired. Please request a new one.", fr: "Ce lien est invalide ou a expiré. Merci d'en demander un nouveau." } }
sys.sign_in_return.back_to_sign_in: { messages: { en: "Back to sign-in", fr: "Retour à la connexion" } }

# `no_access`: neutral, no entity/capacity/employment words, no lookup outcome beyond the typed
# refusal, NO exit control (ux STOP: "Se déconnecter"/navigate-to-sign-in loops on System until
# #94 lands -- the still-valid cookie fails the same grant test every time).
sys.no_access.title:           { messages: { en: "Access not available", fr: "Accès non disponible" } }
sys.no_access.body:            { messages: { en: "This space is reserved for people with platform access.", fr: "Cet espace est réservé aux personnes disposant d'un accès plateforme." } }
sys.no_access.write_to_us:     { messages: { en: "If you believe this is an error, write to us:", fr: "Si vous pensez qu'il s'agit d'une erreur, écrivez-nous :" } }
sys.no_access.support_contact: { messages: { en: "support@captain.food", fr: "support@captain.food" } }
