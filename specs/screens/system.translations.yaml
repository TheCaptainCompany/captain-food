version: 1
description: >
  System-surface UI strings (ADR-0033; sidecar convention ADR-20260722-101500) — the
  surface-specific translation catalog for `screens/system.yaml` (internal ADMIN operations @
  system.captain.food). First block: the actor-mailbox supervision page (#242 Runtime B). The
  codegen merges every translations file into a single `translations.generated.json`; keys are
  globally namespaced and unique across all files. Same convention as translations.yaml (dotted
  key - optional params - en+fr messages with matching {param} tokens).

# ── mailbox supervision ───────────────────────────────────────────────────────
mailbox.title:          { messages: { en: "Actor mailbox", fr: "Boîte aux lettres des acteurs" } }
mailbox.subtitle:       { messages: { en: "One lane per (actor type, partition) — leases, checkpoints and backlog.", fr: "Une voie par (type d'acteur, partition) — baux, points de contrôle et arriéré." } }
mailbox.lanes:          { messages: { en: "Lanes", fr: "Voies" } }
mailbox.lane:           { messages: { en: "Lane", fr: "Voie" } }
mailbox.owner:          { messages: { en: "Owner", fr: "Propriétaire" } }
mailbox.lease:          { messages: { en: "Lease until", fr: "Bail jusqu'à" } }
mailbox.ownership:      { messages: { en: "Ownership version", fr: "Version de propriété" } }
mailbox.checkpoint:     { messages: { en: "Checkpoint", fr: "Point de contrôle" } }
mailbox.pending:        { messages: { en: "Pending", fr: "En attente" } }
mailbox.scheduled:      { messages: { en: "Scheduled", fr: "Planifiés" } }
mailbox.oldest_pending: { messages: { en: "Oldest pending since", fr: "Plus ancien en attente depuis" } }
mailbox.empty.title:    { messages: { en: "No lanes registered", fr: "Aucune voie enregistrée" } }
mailbox.empty.body:     { messages: { en: "Lanes appear when a mailbox worker seeds the partition registry on startup.", fr: "Les voies apparaissent quand un worker de boîte aux lettres initialise le registre des partitions au démarrage." } }
mailbox.guide.title:    { messages: { en: "How to read this page", fr: "Comment lire cette page" } }
mailbox.guide.body:     { messages: { en: "A healthy lane has a live lease and pending near zero. A growing pending count with an expired lease means no worker owns the lane; a growing count with a live lease means the owner is stuck. Ownership version increments on every takeover — it should be stable outside deployments.", fr: "Une voie saine a un bail actif et un arriéré proche de zéro. Un arriéré croissant avec un bail expiré signifie qu'aucun worker ne possède la voie ; un arriéré croissant avec un bail actif signifie que le propriétaire est bloqué. La version de propriété s'incrémente à chaque reprise — elle doit rester stable hors déploiements." } }

# ── poisoned rows + requeue (#315) ────────────────────────────────────────────
mailbox.poisoned.title:       { messages: { en: "Poisoned rows", fr: "Lignes empoisonnées" } }
mailbox.poisoned.guide:       { messages: { en: "Rows terminally FAILED at the delivery-attempts cap. Fix the cause first (the error code is the lead), then requeue — the row returns to RECEIVED with its attempts reset and its lane is nudged.", fr: "Lignes en échec définitif au plafond de tentatives de livraison. Corrigez d'abord la cause (le code d'erreur est la piste), puis remettez en file — la ligne repasse à RECEIVED, ses tentatives sont réinitialisées et sa voie est relancée." } }
mailbox.poisoned.message:     { messages: { en: "Message", fr: "Message" } }
mailbox.poisoned.id:          { messages: { en: "Message id", fr: "Identifiant du message" } }
mailbox.poisoned.attempts:    { messages: { en: "Attempts", fr: "Tentatives" } }
mailbox.poisoned.error:       { messages: { en: "Error code", fr: "Code d'erreur" } }
mailbox.poisoned.received:    { messages: { en: "Received at", fr: "Reçu à" } }
mailbox.poisoned.requeue:     { messages: { en: "Requeue", fr: "Remettre en file" } }
mailbox.poisoned.empty.title: { messages: { en: "No poisoned rows", fr: "Aucune ligne empoisonnée" } }
mailbox.poisoned.empty.body:  { messages: { en: "Nothing has failed at the delivery-attempts cap. This is the healthy state.", fr: "Rien n'a échoué au plafond de tentatives de livraison. C'est l'état sain." } }
