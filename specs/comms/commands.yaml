version: 1
description: >
  comms scope — commands fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `commands.yaml` catalog; $refs stay kind-logical
  (`commands.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# =====================================================================
# Order conversations / messaging (Conversation aggregate, #129)
# =====================================================================

OpenConversation:
  description: >
    Open the in-app conversation for an order (id = orderId; idempotent birth). Snapshots whether
    customer<->restaurant direct chat is enabled (default true). orderId is the client-generated,
    idempotent key.
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    customerId:
      $ref: 'scalars.yaml#/CustomerId'
      nullable: true   # copied from OrderPlaced by the opener (PM); null for guest orders (#235)
    customerChatEnabled: { type: boolean }
  required: [orderId, restaurantId, customerChatEnabled]


PostMessage:
  description: >
    Post a message to an order's conversation — PUBLIC (customer-visible) or INTERNAL (staff-only note).
    The client-generated messageId is the idempotency key (a re-post with the same id is rejected).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    messageId: { $ref: 'scalars.yaml#/ConversationMessageId' }
    authorRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
    visibility: { $ref: 'scalars.yaml#/MessageVisibility' }
    body: { $ref: 'scalars.yaml#/MessageBody' }
    originalLocale: { $ref: 'scalars.yaml#/Locale' }
    attachmentRefs:
      type: array
      items: { $ref: 'scalars.yaml#/AttachmentRef' }
      nullable: true
  required: [orderId, messageId, authorRole, visibility, body, originalLocale]


RecordMessageTranslation:
  description: >
    Record (cache) a translation of a posted message into a target locale; idempotent per (message,
    locale). The conversation and the message must exist. Translate once, reuse (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    messageId: { $ref: 'scalars.yaml#/ConversationMessageId' }
    locale: { $ref: 'scalars.yaml#/Locale' }
    text: { $ref: 'scalars.yaml#/TranslatedText' }
  required: [orderId, messageId, locale, text]


EscalateToAdmin:
  description: >
    Pull an admin into an order's conversation through a reasoned escalation (restaurant or rider). The
    conversation must exist. Emits AdminInvitedToConversation (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    reason: { $ref: 'scalars.yaml#/EscalationReason' }
  required: [orderId, reason]


MuteParticipant:
  description: >
    Mute a participant role in an order's conversation. A justification `reason` is REQUIRED, but is left
    OUT of `required` on purpose: the "justified" invariant is enforced by the write model as an
    anticipated error (errors.yaml#/MuteReasonRequired), not by the schema. `until` bounds the mute in
    time; absent = indefinite. The conversation must exist (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    mutedRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
    reason: { $ref: 'scalars.yaml#/MuteReason' }
    until:
      type: string
      format: date-time
      nullable: true
  required: [orderId, mutedRole]


UnmuteParticipant:
  description: >
    Unmute a previously muted participant role in an order's conversation. The conversation must exist
    and the role must currently be muted (errors.yaml#/ParticipantNotMuted) (#129).
  type: object
  properties:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    mutedRole: { $ref: 'scalars.yaml#/ConversationAuthorRole' }
  required: [orderId, mutedRole]
