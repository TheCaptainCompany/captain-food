version: 2
description: >
  Captain.Food command PAYLOAD spec. A command is a request to change state that the system can
  reject. This file defines ONLY each command's input payload — strongly typed, with exactly the
  same shape as an event or a value object (description + type + properties + required). It is a
  pure catalog, parallel to events.yaml.

  Everything ABOUT a command lives where it is owned, not here:
  - the PERSONA that may send it, the USE CASE it derives from, its release SLICE
      -> story-map.md (+ api.yaml `@auth` path-role + traceability.md)
  - the aggregate that HANDLES it and the events it EMITS / reacts to
      -> actors.yaml
  - the ERRORS it may raise when rejected (what were `invariants`)
      -> errors.yaml, mapped per message in actors.yaml `throws`

  Conventions:
  - Properties carry the caller's INTENT. Aggregate IDs are CLIENT-GENERATED (UUIDs) and supplied IN
    the command, so creates are idempotent (retry-safe) and the client can read the projection by that
    id without a round-trip. Two ids are NOT client-minted: `paymentIntentId` (assigned by Stripe), and
    `customerId` may be re-resolved to an existing Customer on a returning phone — so
    RegisterCustomerPayload returns the authoritative `customerId` + `created`.
  - Money (lineTotal, totalAmount) and StockStatus are computed server-side, never trusted from the client.


# --- Mailbox supervision (#315, ADR-20260803-002712 Q1) ---

RequeueMailboxMessage:
  description: >
    ADMIN operator recovery of a POISONED mailbox row (#315): after fixing the cause, return an
    inbound_messages row that the delivery-attempts cap flipped to terminal FAILED
    (error code DeliveryInfrastructureError, PROP-20260802-223522 D4) to RECEIVED — attempts
    reset, error and backoff schedule cleared — so its lane's worker delivers it again. Only
    cap-poisoned rows are requeueable: handler REJECTED/FAILED verdicts are business decisions,
    not infrastructure casualties (errors.yaml#/MailboxMessageNotRequeueable). `targetMessageId`
    names the poisoned row (from the poisonedMailboxMessages supervision query) — distinct from
    the envelope's own messageId, which identifies THIS requeue submission.
  type: object
  properties:
    targetMessageId: { $ref: 'scalars.yaml#/MessageId' }
  required: [targetMessageId]


# --- The platform grant and the ADMIN seam binding (#639 part C step 6-v,
# ADR-20260905-223957 §1-§3) -- kernel-homed with the `PlatformMembership` actor -----------------

GrantPlatformAccess:
  description: >
    Grant one `authSubject` access to the PLATFORM itself (ADR-20260905-223957 §1/§2/§3). Handled
    by `PlatformMembership`, its own aggregate, its own stream, its own lane -- platform standing is
    its OWN relationship, never a `ScopeType` widening (PRINCIPALS-MEMBER untouched) and never
    `RestaurantAccessGranted` reused (that event's `scopeId` is restaurant-typed). `roles: [ADMIN]`
    in steady state (§3): the ordinary GraphQL door for a SECOND admin, hand-issued by an existing
    one. The FIRST admin is never reached through this GraphQL door at all -- the one-shot bootstrap
    dispatches this SAME command through the ordinary mailbox enqueue path, with an actor envelope
    naming the bootstrap as the acting principal, so no public "claim the first admin" path ever
    exists (ADR-20260905-223957 §3, the rejected alternative).

    `platformMembershipId` is REQUIRED and CALLER-MINTED, the `MembershipId`/`GrantRestaurantAccess`
    precedent: the mailbox lane address needs it present to route at all. But it is not FREELY
    minted (round 2, R2-5, ADR-20260905-223957 §1/§2): the caller MUST derive it as
    `UUIDv5(PLATFORM_MEMBERSHIP_NAMESPACE, authSubject)` -- the SAME formula the one-shot bootstrap
    already uses (`platform_membership_id_for`, `crates/application/src/commands.rs`) -- and the
    handler REFUSES any other value with the typed `PlatformMembershipIdMismatch`. This collapses
    "one platform membership per subject" into stream identity: two grants for the same subject
    always target the SAME stream, so the fold's own exists-once check is the arbiter, not a
    projection read racing a UNIQUE constraint. Submitting an already-granted `platformMembershipId`
    is an idempotent no-op (`rules.yaml#/PlatformAccessGrantIsIdempotent`) -- never a second event
    for the same stream. The `PlatformMember` bridge's `auth_subject UNIQUE` stays as a BELT, not
    the arbiter: a grant whose `authSubject` already holds a LIVE platform membership is refused
    with the typed `PlatformAccessAlreadyGranted` (ADMIN is not a `PrincipalKind`, so this reuses no
    reservation table, unlike the MEMBER arm) -- this can only be observed on the vanishingly rare
    id-collision path, since the id-derivation check above already makes id and subject deterministic.

    The handler accepts only `basis: CAPTAIN_ONBOARDING` -- the only value `PlatformAccessBasis`
    declares (evans: an operational act, never a corporate status). Gated by
    `configuration.yaml#/keys/RUN_PLATFORM_ACCESS_GRANT`, checked BEFORE the store is touched (the
    `RUN_MEMBER_ACCESS_GRANT` shape): every platform grant is the irreversible moment that starts a
    real Tours human's legal clock. NO revoke command exists yet (ADR-20260905-223957 §3):
    revocation of platform access is deferred until a second admin exists -- a named follow-up, not
    a hidden gap.
  type: object
  properties:
    platformMembershipId:
      $ref: 'scalars.yaml#/PlatformMembershipId'
    authSubject:
      $ref: 'scalars.yaml#/AuthSubject'
    basis:
      $ref: 'scalars.yaml#/PlatformAccessBasis'
  required: [platformMembershipId, authSubject, basis]


# --- The ADMIN sign-in door (#639 part C step 6-iii, ADR-20260906-023825) -------------------------
# The `requestMemberSignInLink`/`confirmMemberSignIn` shape (ADR-20260905-101349 SS7-SS10)
# transposed to the platform context. IDENTIFY-ONLY, never register: a verified email with no LIVE
# `PlatformMembership` grant is refused (`AdminAccessNotGranted`), never stamped -- `GrantPlatformAccess`
# (6-v) is the only birth. Addressed to their OWN actor `AdminSignIn` (mailbox.partitions: 5), never
# to `PlatformMembership` (partitions: 1, human-paced) -- an anonymous caller here must never
# head-of-line block the single lane carrying `GrantPlatformAccess` and the one-shot bootstrap.

RequestAdminSignInLink:
  description: >
    Ask the auth provider to send an email magic link (the SAME `send_email_magic_link` port
    `RequestMemberSignInLink`/`RequestEmailVerification` use, and the SAME email send-abuse wall
    shape). Emits no event, and MUST NOT reveal whether the address holds a platform grant: the
    handler never consults the `PlatformMember` bridge, so the outcome is identical for a granted
    admin and a stranger's (no enumeration oracle) -- ADR-20260906-023825 SS1.
  type: object
  properties:
    email:
      $ref: 'scalars.yaml#/EmailAddress'
    locale:
      $ref: 'scalars.yaml#/Locale'
      nullable: true
      description: "The email's language; no stored locale exists pre-identification, so this is caller-supplied."
  required: [email]


ConfirmAdminSignIn:
  description: >
    Verify the magic-link token with the auth provider, then IDENTIFY against the platform grant:
    the proved auth subject is looked up through `application::queries::PlatformMemberRepository`
    (the SAME read port `grant_platform_access`'s handler already consults, ADR-20260905-223957
    SS1) -- no live grant -> the session is still parked (so a future sign-out control has a real
    cookie to act on) but NOTHING is stamped and `AdminAccessNotGranted` is thrown; a live grant ->
    the ADMIN role claim is stamped (`identity.stamp_admin_claim`, `{ role: ADMIN }` and nothing
    else) and the post-stamp provider session is parked for cookie pickup via POST /auth/session --
    the credential is never in the GraphQL response. Emits no event. The stamped claim is a HINT
    the seam (`resolve_platform_scope`) RE-DERIVES on every subsequent request -- a stamped ADMIN
    claim with no live grant resolves `Identity::Unbound`, never `Identity::Admin`
    (ADR-20260906-023825 SS1, pinned from ADR-20260905-223957 SS2).
  type: object
  properties:
    token:
      $ref: 'scalars.yaml#/EmailVerificationToken'
  required: [token]

# =====================================================================
# Where the rest lives
# =====================================================================
# - Which events each command emits / the saga reacts to:  actors.yaml (`receives` → `emits`).
# - Which errors each command may raise on rejection:      errors.yaml, mapped in actors.yaml `throws`.
# - Who may send each command, and its use case / slice:   story-map.md + api.yaml `@auth`.
