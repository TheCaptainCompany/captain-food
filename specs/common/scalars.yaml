RestaurantId:
  type: string
  format: uuid
  description: "A single restaurant location (HubRise: location), belonging to a RestaurantAccount."


ProductId:
  type: string
  format: uuid
  description: "A product groups one or more offers (HubRise: product)."


SessionId:
  type: string
  format: uuid
  description: "A session is a temporary auth token (ADR-0041) for a visitor or customer, used to bind carts and track the user across devices."


OfferId:
  type: string
  format: uuid
  description: "A purchasable offer with its own price (HubRise: SKU)."


OptionListId:
  type: string
  format: uuid


OptionId:
  type: string
  format: uuid


OrderId:
  type: string
  format: uuid


CustomerId:
  type: string
  format: uuid


CartId:
  type: string
  format: uuid


CorrelationId:
  type: string
  format: uuid
  description: >
    Correlates a command with the events/state it produces. Returned by every mutation payload so the
    client can track the outcome via the read side (matches domain_events.correlation_id).


CauseId:
  type: string
  format: uuid
  description: >
    Causation id: the id of the message/event that directly caused this one (matches
    domain_events.cause_id). Threads a cause→effect chain through the log; null for a root command.


MessageId:
  type: string
  format: uuid
  description: >
    Unique id of one command submission — the idempotency key of the write path (inbound_messages
    pk, ADR-20260720-015300). Client-suppliable via MetadataInput; server-generated (UUIDv7) when absent.
    A replayed messageId with an identical payload acknowledges against the original; the same id
    with a different payload is rejected (Conflict). Events emitted by the command carry it as
    domain_events.cause_id.


TraceId:
  type: string
  pattern: '^[0-9a-f]{32}$'
  description: >
    W3C trace-id (from the inbound `traceparent` header, or server-started). Response-only technical
    tracing identifier — never client-suppliable, never a substitute for correlationId (P-02).


RiderId:
  type: string
  format: uuid
  description: "An independent Captain rider (courier). Null on a partner-fulfilled job (the partner's courier is name/phone only)."


PaymentIntentId:
  type: string
  maxLength: 255
  description: "Stripe PaymentIntent id (provider reference). Example: 'pi_3Nabc...'."


ExternalReference:
  type: string
  maxLength: 128
  description: >
    External reference code (HubRise `ref`), unique within its scope.
    Used for idempotent import/sync and as a stable reference inside orders.
    Example: 'MARGHERITA', 'CAT-PIZZAS'.


Slug:
  type: string
  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  maxLength: 80
  description: >
    URL-safe identifier for restaurants. Lowercase, dash-separated.
    Example: 'chez-marco', 'tokyo-sushi'.


# --- Names (strongly typed, no reuse) ---

RestaurantDisplayName:
  type: string
  maxLength: 140
  description: >
    Public label shown to customers. Can be short and brand-oriented.
    Example: 'Chez Marco', 'Tokyo Sushi'.


ProductName:
  type: string
  maxLength: 140


OfferName:
  type: string
  maxLength: 140
  description: >
    Offer label, unique within a product (HubRise SKU name).
    Example: 'Small', 'Large', 'Default'.


OptionName:
  type: string
  maxLength: 140


# --- Tags ---

Tag:
  type: string
  maxLength: 80
  description: "Free-form label (HubRise: tags). Example: 'vegan', 'spicy', 'eco'."


# --- Contact & Address ---

EmailAddress:
  type: string
  format: email
  maxLength: 255


PhoneNumber:
  type: string
  maxLength: 32
  description: >
    Canonical E.164 phone (e.g. '+33612345678'). Composed server-side from DialingCode + NationalPhoneNumber
    and stored on events/views. Validation enforced at application level.


AddressLine:
  type: string
  maxLength: 255


CityName:
  type: string
  maxLength: 120


PostalCode:
  type: string
  maxLength: 20


CountryCode:
  type: string
  pattern: "^[A-Z]{2}$"
  description: "ISO 3166-1 alpha-2 country code. Example: 'FR'."


TimeZone:
  type: string
  maxLength: 64
  description: "IANA timezone. Example: 'Europe/Paris'."


Locale:
  type: string
  pattern: "^[a-z]{2}-[A-Z]{2}$"
  maxLength: 5
  description: >
    i18n culture code, language-REGION (BCP 47 / .NET CultureInfo). Example: 'fr-FR', 'en-US'. Drives
    the UI language AND the display of dates, times and numbers (paired with TimeZone for the zone).


# --- Money & Currencies ---
# We keep a stronger model than HubRise (which serialises "9.80 EUR" as a string):
# amount is an integer in minor units + an explicit currency, wrapped in the
# Money value object (see entities.yaml#/Money).

CurrencyCode:
  type: string
  pattern: "^[A-Z]{3}$"
  description: "ISO 4217 currency code. Example: 'EUR'."


MoneyCents:
  type: integer
  minimum: 0
  description: "Monetary amount in minor units (e.g. cents)."


RetryAfterSeconds:
  type: integer
  minimum: 0
  description: >
    How long the caller must wait before the same request can succeed, in seconds — the SERVER's own
    remaining backoff window, never a client guess (#516). Carried by the `RateLimited` rejection so a
    screen can render an honest countdown instead of inventing one. ABSENT means the rejection has no
    useful countdown to offer (a daily ceiling — counting down to tomorrow is not information), never
    "retry immediately".


PageLimit:
  type: integer
  minimum: 1
  description: >
    Requested page size for a paginated list query (#113). The server CLAMPS it to a per-query
    maximum (restaurants: 200) — asking for more returns the maximum, never an error. Absent = the
    query's default page size.


TaxRatePercent:
  type: number
  minimum: 0
  maximum: 100
  description: "Percentage tax rate. Example: 10.0 for 10%."


# --- Stock ---

Quantity:
  type: number
  minimum: 0
  description: >
    Stock quantity in units. Decimals allowed to match HubRise inventory.
    0 means out of stock.


# --- Customer / Order ---

CustomerDisplayName:
  type: string
  maxLength: 140


OrderNote:
  type: string
  maxLength: 1000


# --- Enums (logical, not tied to specific language) ---

ServiceType:
  type: string
  enum: [DELIVERY, COLLECTION] 
  description: >
    Aligned with HubRise service types. COLLECTION == customer pickup.
    (EAT_IN is not offered by Captain.Food but is kept in TaxRate for catalog fidelity.)


OrderStatus:
  type: string
  enum:
    - PLACED
    - ACCEPTED
    - REJECTED
    - PREPARING
    - READY
    - OUT_FOR_DELIVERY
    - DELIVERED
    - CANCELLED_BY_CUSTOMER
    - CANCELLED_BY_RESTAURANT
    # #167: the acceptance deadline elapsed while still PLACED (OrderAcceptanceTimedOut) —
    # `CANCELLED_BY_{cause}` grammar; timeout is a cause, not an actor (like REJECTED).
    - CANCELLED_BY_TIMEOUT


# Lifecycle of a DeliveryJob, orthogonal to OrderStatus (a delivery is a separate aggregate).
DeliveryStatus:
  type: string
  enum:
    - PENDING           # job requested, awaiting a courier (partner or independent rider)
    - ASSIGNED          # a courier/rider has accepted it
    - PICKED_UP         # collected from the restaurant
    - OUT_FOR_DELIVERY  # en route to the customer
    - DELIVERED         # handed over — terminal (success)
    - FAILED            # could not be delivered — terminal
    - CANCELLED         # cancelled before delivery — terminal
  description: "Status of one delivery, reported by the partner (inbound) or driven by an independent rider's commands."


PaymentStatus:
  type: string
  enum: [PENDING, AUTHORIZED, CAPTURED, FAILED, REFUNDED, RELEASED]
  description: >
    Order payment state, folded from Stripe facts (PaymentIntentCreated/Authorized/Captured/Failed/
    Refunded/Released). Authorize-then-capture posture (ADR-20260808-195315 §1.2): AUTHORIZED = funds
    held on the customer's card at checkout confirmation, not yet moved; CAPTURED = the money moved
    (capture on delivered / picked up); RELEASED = an uncaptured authorization was voided (rejection,
    cancellation or expiry — "no need to refund because no capture").


OperationStatus:
  type: string
  enum: [PENDING, SUCCEEDED, REJECTED, FAILED]
  description: >
    Live status of a command/operation streamed by the operationStatusChanged subscription:
    PENDING (accepted, in flight), SUCCEEDED, REJECTED (business invariant), FAILED (technical error)."


# RSO-1 (DECISIONS §43): lives in the KERNEL because entities.yaml#/CheckoutSnapshot (common)
# records it as acceptance evidence — a network/ placement would be a scope-kernel-purity error.
ServiceWindowVerdict:
  type: string
  enum: [OPEN, OUTSIDE_HOURS, HOURS_UNDECLARED]
  description: >
    "Is this restaurant serving right now?" as a three-valued VERDICT derived AT AN INSTANT from the
    declared opening hours + timezone with the clock injected — deliberately NOT a `*Status` (that
    suffix means stored state; nobody stores this, everybody computes it, and no event announces it).
    The third value is the whole point (DECISIONS §43 blocker): `opening_hours` storage collapses
    "never provided", "cleared" and "unparseable" into ONE `[]`, so `[]` IS HOURS_UNDECLARED by
    definition — never "closed" — and a NULL timezone (or one that does not parse while hours are
    declared) is HOURS_UNDECLARED too, because the once-documented account-timezone fallback has no
    materialized source. Evaluation converts the UTC instant into the restaurant's LOCAL time (total,
    DST-safe), never slot times to UTC; overnight slots (`to` < `from`, e.g. Friday 19:00–01:00) are
    legal and cross midnight. At checkout, OUTSIDE_HOURS is the ONLY refusing verdict — OPEN and
    HOURS_UNDECLARED accept (rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours).


# --- Write-path journal lifecycles (database/tables/journals.yaml, ADR-20260731-122500) ---
# Enum $ref columns store the enum's TEXT value verbatim (ADR-20260728, superseding the ADR-0037
# ordinal + ref_<enum> scheme), so rows are self-describing; renaming a value is the migration event.
# Since #242 Runtime D there is ONE journal, so there is ONE lifecycle enum and ONE channel enum:
# the mailbox's. `CommandJournalStatus`/`CommandChannel` retired with `command_journal`.

InboundMessageKind:
  type: string
  enum: [COMMAND, EVENT, MESSAGE]
  description: >
    What kind of thing one inbound_messages row is — the request/report split as a column
    (PROP-20260728-152752 §2): COMMAND = a request the actor may reject (feeds the operationStatus
    surface); EVENT = an adapted external fact that already happened (nothing to reject — the
    aggregate decides what follows); MESSAGE = a plain note, typically a reminder to self
    (§3.4) — neither rejectable nor a business fact.


MailboxLaneRegistration:
  type: string
  enum: [SEEDED, DECLARED_UNSEEDED, UNDECLARED_ORPHAN]
  description: >
    How a supervision lane relates to the DECLARED routing contract (#596). The lane monitor is
    driven by the declaration (actors.yaml `mailbox.partitions`), not by the `mailbox_partitions`
    registry, so it renders three genuinely different situations that were previously
    indistinguishable — a registry row is absent in two of them, and both rendered as
    `ownershipVersion 0` + `claimedBy null` + `checkpoint 0`, byte for byte.
    SEEDED = declared AND registered: a worker has started for it at some point, so the lease,
    fencing counter and checkpoint mean what they say.
    DECLARED_UNSEEDED = declared but NEVER registered: no worker has ever started for this lane in
    this database. Nothing owns it and nothing will drain it. With `pending > 0` this is the state
    that holds a paid order waiting on a worker that never started — the one an operator must be
    able to find, and the reason this field exists.
    UNDECLARED_ORPHAN = carrying work OUTSIDE the declared keyspace: rows stranded by a past width
    DECREASE, addressed to a partition the declaration no longer has. Nothing else in the system
    mentions them. `seed_partitions` now refuses the start that would create this state, so it can
    only be historical.

InboundMessageStatus:
  type: string
  enum: [SCHEDULED, CANCELLED, RECEIVED, SUCCEEDED, REJECTED, FAILED, IGNORED, DUPLICATE]
  description: >
    Lifecycle of a mailbox row (PROP-20260728-152752 §2/§3.4). Immediate rows are born RECEIVED;
    scheduled rows (reminders / scheduled operations) are born SCHEDULED with NO position and are
    PROMOTED to RECEIVED with a fresh position when due — or completed CANCELLED before it.
    Terminal outcomes merge the two legacy vocabularies: SUCCEEDED / REJECTED (business invariant,
    {code, context} in `error`) / FAILED (technical) from the command journal; IGNORED (the
    aggregate decided nothing changed) / DUPLICATE (the exact fact was already in the stream) from
    the inbound-events inbox.


InboundMessageChannel:
  type: string
  enum: [GRAPHQL, WORKER, EXTERNAL]
  description: >
    Surface a mailbox row arrived through: the GraphQL BFF dispatch (typed client at the edge), an
    on-app worker (enricher/PM emission/promotion), or an external adapter ACL (Stripe, SIRENE,
    HubRise…). Succeeds the retired CommandChannel (whose INTERNAL became WORKER here, and which
    gained EXTERNAL for adapted facts).


MailboxActorType:
  type: string
  maxLength: 80
  description: >
    The actor type a mailbox lane belongs to — one of the actors.yaml keys with a declared
    `mailbox:` (e.g. 'Payment', 'Cart'), as stored in inbound_messages.actor_type /
    mailbox_partitions.actor_type. Carried on mailbox-supervision facts (#315) so an audit reader
    sees WHICH lane's row an operator requeued without dereferencing the id.


# --- Process-manager state statuses (processmanager.yaml state tables) ---

PaymentProcessStatus:
  type: string
  enum:
    - AWAITING_PAYMENT_RESULT  # PaymentIntent created, cart locked; waiting for the Stripe outcome
    - ORDER_PLACED             # payment authorized (funds held); Order materialized and cart closed — terminal (success); capture follows on fulfilment
    - FAILED                   # payment failed; cart stays OPEN — terminal (failure)
  description: "State of one PlaceOrderProcess checkout run (payment_process_manager row, keyed by cart)."


RefundProcessStatus:
  type: string
  enum:
    - PENDING_APPROVAL          # a refundable fact opened the request; waiting for a restaurant/admin decision
    - APPROVED_AWAITING_SETTLEMENT  # approved (restaurant or admin); Stripe refund requested, waiting for PaymentRefunded
    - DENIED                    # admin denied — terminal
    - REFUNDED                  # Stripe reported the settled refund — terminal (success)
  description: "State of one RefundProcess run (refund_process_manager row, keyed by order). Refunds are approved by the restaurant (own orders) or an admin."


DeliveryDispatchProcessStatus:
  type: string
  enum:
    - OFFERED           # DeliveryRequested delivered to the DeliveryJob; job offered to the current ranked channel (advancing the walk returns here)
    - ACCEPTED          # a partner/rider accepted the job
    - FAILED            # the ranked channel walk is exhausted: DeliveryDispatchFailed recorded — terminal (manual handling)
    - COMPLETED         # delivery done and order closed — terminal
    - SELF_DISPATCHED   # the restaurant self-dispatches (RestaurantDispatchMode RESTAURANT): no channel offered, Captain only tracks (#60)
  description: >
    State of one DeliveryDispatchProcess run (delivery_dispatch_process_manager row, keyed by order).
    FAILED now marks the ranked channel walk exhausted (fail closed, rules.yaml#/DispatchExhaustionFailsClosed —
    #60 supersedes the ADR-20260720-004556 numeric cap-3 framing). SELF_DISPATCHED was appended LAST to
    preserve the then-stored ordinals of the pre-#60 values (moot since ADR-20260728: enums persist as TEXT)."


RestaurantDispatchMode:
  type: string
  enum:
    - CAPTAIN           # Captain routes the delivery through the city's ranked channel list (default)
    - RESTAURANT        # the restaurant delivers itself (own couriers or its own partner deal); Captain tracks only, never offers a job
  description: "Who is responsible for fulfilling a restaurant's deliveries (restaurant-scoped config, resolved at runtime; #60). Default CAPTAIN keeps today's behaviour."


DeliveryChannelKind:
  type: string
  enum:
    - POOL              # the independent-rider pool (riders claim; no outbound adapter call)
    - PARTNER           # an outbound delivery partner reached through a DeliveryService adapter
  description: "Kind of a DeliveryChannelCatalog entry — POOL (independent riders) vs PARTNER (adapter-backed). Every PARTNER channel must have a wired services.yaml delivery implementation (#60)."


CuisineCategory:
  type: string
  enum: [FAST_FOOD, PIZZA, TRADITIONAL, BISTRONOMIC, FOOD_TRUCK]
  description: >
    A restaurant's SINGLE primary/representative cuisine bucket, used only to select ONE Uber Eats mark-up
    coefficient in View_UberEstimationPolicy (ADR-0024): FAST_FOOD 1.30, PIZZA 1.35, TRADITIONAL 1.40,
    BISTRONOMIC 1.45, FOOD_TRUCK 1.35. NOT for discovery — a restaurant may belong to several cuisines for
    browsing/filtering; that is the multi-valued `Restaurant.tags`. This is deliberately one value because
    the estimate needs a single coefficient.


# Whether an Uber Eats comparison figure is the restaurant's real HubRise price (ADR-0023, opt-in)
# or a labelled estimate derived from mark-up coefficients (ADR-0024). V0 shows ESTIMATED.
ComparisonBasis:
  type: string
  enum: [ESTIMATED, REAL]
  description: >
    Provenance of an Uber Eats comparison amount: REAL (the restaurant's own Uber prices, shared via
    HubRise after explicit opt-in — ADR-0023) or ESTIMATED (coefficient-based, always labelled — ADR-0024).


# --- Test mode (ADR-0038) ---

Mode:
  type: string
  enum: [LIVE, TEST]
  description: >
    Whether an aggregate is production (LIVE) or a non-production TEST fixture coexisting in prod
    (ADR-0038, Stripe-`livemode`-style). Set at creation, immutable; absent = LIVE. TEST data is isolated
    from payouts, analytics and real notifications; a TEST order may target a LIVE restaurant to validate
    the real receipt path.


# --- Caller persona / user type ---

# Caller user type (a.k.a. persona / role). Established by the GraphQL path: the master
# api.yaml is filtered per user type via @auth / @public, and `domain_events.user_type`
# records which one authored an event. EXTERNAL = third-party ACL callers (Stripe, HubRise, Avelo37).
UserType:
  type: string
  enum:
    - PUBLIC             # anonymous visitor                       -> /public/graphql
    - CUSTOMER           # authenticated end user                  -> /customer/graphql
    - RESTAURANT_ACCOUNT # account: locations + catalog          -> /restaurant-account/graphql
    - RESTAURANT         # single location: order ops            -> /restaurant/graphql
    - RIDER              # delivery partner / courier              -> /rider/graphql   (mostly post-V0)
    - ADMIN              # platform operator                       -> /admin/graphql
    - EXTERNAL           # third-party ACL (Stripe/HubRise/Avelo37) -> /external/graphql


AttachmentRef:
  type: string
  maxLength: 500
  description: >
    Opaque reference to a framework-managed attachment on a conversation message. Storage, moderation
    and GDPR retention are handled generically by the framework, not by this aggregate (#129).


# --- Reclamations / customer claims (#151) ---
# Customer claim/dispute over a delivered order (aggregate `Reclamation`, id = reclamationId; #153).

ReclamationId:
  type: string
  format: uuid
  description: >
    Client-generated id of a customer reclamation (claim/dispute) — the idempotency key for
    OpenReclamation (a re-open with the same id is rejected). Multiple reclamations may exist per
    order, so the reclamation has its own identity, distinct from the orderId it is about (#151).


ReclamationCategory:
  type: string
  enum: [MISSING_ITEM, WRONG_ITEM, QUALITY, LATE_DELIVERY, DAMAGED, NOT_DELIVERED, OTHER]
  description: >
    What the customer is claiming about the order: an item was missing, the wrong item was delivered,
    a quality problem, a late delivery, damaged goods, nothing delivered at all, or another reason (#151).


ReclamationResolution:
  type: string
  enum: [FULL_REFUND, PARTIAL_REFUND, REPLACEMENT, GOODWILL_CREDIT, REJECTED]
  description: >
    The decision recorded when a reclamation is closed: a full or partial refund, a replacement order,
    a goodwill credit, or a rejection of the claim. The aggregate records the DECISION only; the refund
    money-move, credit ledger and replacement orders are downstream slices (#151).


ReclamationReason:
  type: string
  maxLength: 500
  description: >
    Free-text reason recorded when a reclamation is rejected or reopened — why the claim was declined,
    or why it is being reopened after a decision (#151).


# =====================================================================
# CONFIGURATION scalars (PROP-20260729-004500, issue #246)
#
# Every configuration key is typed by one of these, and the generated reader VALIDATES the supplied
# value against the scalar's `pattern` at startup. A key that is present but malformed is reported
# exactly like a missing one — in production the app logs it and stops.
#
# Why this and not just `type: string`: "present" is not "usable". A live Stripe key pasted into the
# test slot, a webhook secret with a trailing newline from a dashboard copy-paste, an AUTH_SESSION_KEY
# that is 31 bytes — each boots happily today and fails later, at the worst moment, in a way that looks
# like a code bug. The pattern moves that discovery to startup, where it is unmissable and free.
#
# A secret's VALUE is never printed when it fails: the report names the key and the EXPECTED shape only.
# =====================================================================

ConfigBoolean:
  type: string
  pattern: "^(?i)(true|yes|1|on|false|no|0|off)$"
  description: >
    A boolean configuration value. Accepts true/yes/1/on and false/no/0/off, CASE-INSENSITIVE, with
    surrounding whitespace and wrapping quotes trimmed before matching (ADR-20260728-224500).
    Deliberately generous, because the failure it prevents was real: `RUN_SIRENE_WORKER=TRUE` silently
    meant PAUSED under an exact `== "true"` gate, and 6,649 rows sat unprocessed for four hours.
    Anything NOT in this set is a misconfiguration, not a false — it is reported, never guessed.


StripeSecretKey:
  type: string
  pattern: "^sk_(test|live)_[A-Za-z0-9]+$"
  description: >
    A Stripe secret API key, either mode. The app is mode-agnostic by design: the deployed value decides,
    and its `sk_test_` / `sk_live_` prefix is what the boot report renders as the MODE (never the key).
    Accepting both is deliberate for now — V0 runs TEST keys on production pre-launch. At go-live,
    swapping this key's scalar to StripeSecretKeyLive makes "production must be live mode" a startup
    guarantee instead of a thing someone remembers to check.


StripeSecretKeyTest:
  type: string
  pattern: "^sk_test_[A-Za-z0-9]+$"
  description: >
    A Stripe TEST-mode secret key. Typing the test slot separately is what stops a LIVE key being pasted
    into it — which would move real money from a job whose entire premise is that it cannot
    (`prod-smoke.sh` already refuses to confirm a payment unless the key is `sk_test_`; this makes the
    same rule declarative and checked at startup rather than only in one script).


StripeSecretKeyLive:
  type: string
  pattern: "^sk_live_[A-Za-z0-9]+$"
  description: >
    A Stripe LIVE-mode secret key. The counterpart slot: it rejects a test key, so a go-live that
    silently kept test credentials cannot boot as if it were taking real payments.


StripePublishableKeyTest:
  type: string
  pattern: "^pk_test_[A-Za-z0-9]+$"
  description: >
    A Stripe TEST-mode PUBLISHABLE key. Public by design — it ships to every browser that loads the
    checkout shell and can only initialise stripe.js, never move money — which is why it is not
    secret-classed. The `^pk_test_` anchor makes a LIVE publishable key or ANY secret key
    unspellable in this slot, mirroring the sk_ scalars rejecting `pk_`. Go-live deliberately
    requires a spec change here: the live publishable key gets its own scalar and mode witness
    (ADR-20260809-050000 decision 5), so production cannot start fronting live-mode Stripe by a
    dashboard edit alone.


StripeWebhookSecret:
  type: string
  pattern: "^whsec_[A-Za-z0-9_-]+$"
  description: >
    A Stripe webhook signing secret. Stripe issues a DIFFERENT one per mode, so it must be switched
    together with the secret key; a mismatched pair verifies nothing and the endpoint fails closed —
    the customer is charged and the restaurant is never told.


AuthSessionKey:
  type: string
  pattern: "^([0-9a-fA-F]{64}|[A-Za-z0-9+/]{43}=)$"
  description: >
    The AES-256-GCM key encrypting parked auth sessions: exactly 32 bytes, as 64 hex chars or standard
    base64. A key of the wrong length currently makes the store fall back to the no-op, so login
    SILENTLY degrades to anonymous-only — the pattern turns that into a startup failure.


PostgresUrl:
  type: string
  pattern: "^postgres(ql)?://"
  description: >
    A PostgreSQL connection string. On Supabase this must be the SESSION POOLER host (IPv4); the direct
    `db.<ref>.supabase.co` host is IPv6-only and unreachable from Render — a distinction the URL shape
    cannot express, so it stays documented in the key's `gates`.


HttpsUrl:
  type: string
  pattern: "^https?://"
  description: >
    An absolute HTTP(S) endpoint. Catches the common paste error of a bare host, which fails later as an
    opaque request error rather than at startup.


DepartmentList:
  type: string
  pattern: "^([0-9]{2,3}|2[AB])(,([0-9]{2,3}|2[AB]))*$"
  description: >
    A comma-separated INSEE department list for a scoped SIRENE sweep (e.g. `37`, `37,41`). Allows the
    Corsican `2A`/`2B` codes, which a naive numeric check would reject.


HoneycombIngestKey:
  type: string
  pattern: "^[A-Za-z0-9_]{20,120}$"
  description: >
    A Honeycomb INGEST key — the credential the OTLP exporter sends as `x-honeycomb-team` (ADR-20260729
    telemetry backend, issue #191).

    Deliberately PERMISSIVE on charset and length, and that is a considered choice rather than laziness.
    Honeycomb has shipped several ingest-key formats (32-char hex "classic" keys, and the newer
    `hc?ik_`-prefixed keys), and this value gates STARTUP: on production a pattern that is stricter than
    reality turns a perfectly good key into `exit 78` and a failed deploy. An over-tight regex here would
    manufacture exactly the outage this file exists to prevent, so the rule encodes only what is
    genuinely invariant across formats.

    What it does still catch is the mistake people actually make: a **management** key
    (`<Key ID>:<Secret Key>`, used by the Honeycomb MCP server and the Query API) pasted into the ingest
    slot. Management keys contain a colon, ingest keys never do — so the colon exclusion is the load-
    bearing part of this pattern, in the same spirit as rejecting a `pk_` publishable key in a
    `StripeSecretKey` slot. It also rejects the empty, whitespace-padded and obviously-truncated value.


TraceSampleRatio:
  type: string
  pattern: "^(0(\\.[0-9]+)?|1(\\.0+)?)$"
  description: >
    The head-sampling probability for traces, as a decimal in [0, 1] — `1.0` keeps every trace, `0.1`
    keeps a tenth. Rejects the two plausible mistakes that would otherwise be discovered as missing data
    weeks later: a percentage (`50`, `50%`) silently read as "way out of range", and a ratio above 1.


LogLevel:
  type: string
  pattern: "^(?i)(trace|debug|info|warn|error)$"
  description: >
    The minimum severity emitted by the structured-logging layer, case-insensitive. A closed set rather
    than a free-form `RUST_LOG` filter, because the failure mode of a typo'd directive is silence — the
    logs simply stop, which reads as a healthy quiet system.

RestaurantAccountId:
  type: string
  format: uuid
  description: "Restaurant account (HubRise: restaurant) — groups one or more Restaurant locations."

# --- Authorization scopes (#144, PROP-20260725-185140) ---

ScopeType:
  type: string
  enum:
    - ORDER       # one order and everything hanging off it (conversation, attachments)
    - RESTAURANT  # one restaurant location (back-office reads, restaurant-owned documents)
  description: >
    The kind of instance an authorization scope refers to (#144). Paired with a scope id, it names
    exactly one protected instance: `ScopeMembership` records who belongs to it. Read-side
    per-instance authorization asks one question of this vocabulary — "is this principal a member of
    (scopeType, scopeId)?" — for every role and every surface, so the guard never learns what an
    order or a restaurant is.


# --- Command-failure attribution (#623) -------------------------------------------------------
#
# `inbound_messages.error` persists for the retention window and is served as
# `Operation.errorCode`/`Operation.message`. A failed command must be ATTRIBUTABLE from that row
# without the row ever carrying provider prose: Stripe's error `message` is provider-controlled and
# for an authentication failure literally contains `sk_test_…`. So the attribution vocabulary is a
# pair of CLOSED sets — free text has nowhere to go, by type rather than by convention.

CommandFailureSeam:
  type: string
  enum:
    - PAYMENT_GATEWAY   # the outbound payment-gateway call refused or declined
    - COMMAND_PAYLOAD   # the journaled command payload did not decode into its declared shape
    - DOMAIN_INVARIANT  # an aggregate/handler invariant that is not a catalogued errors.yaml code
    - INFRASTRUCTURE    # a transient infrastructure failure that nonetheless landed terminally
  description: >
    WHICH SEAM of a command's handling failed — the first thing an operator needs and the thing
    [#623](https://github.com/TheCaptainCompany/captain-food/issues/623) found missing: a failed
    `PlaceOrder` recorded `{"code":"Internal","context":{}}`, so "Stripe is refusing us" and "our
    database is wedged" were the same string at peak. Deliberately COARSE and closed: it names the
    boundary that failed, never what the boundary said. The operational response differs per member,
    which is the test for whether a value belongs here.

    EVERY MEMBER HAS A PRODUCER, and that is enforced rather than promised: an exhaustive test in
    `crates/infrastructure/src/mailbox/attribution.rs` drives a real `DomainError` onto each one, so
    adding a member here fails the build until something can actually emit it. `EVENT_APPEND` was
    drafted in the #623 review and WITHDRAWN before landing for exactly that reason — its producers
    are the three staged-flush arms of
    [#628](https://github.com/TheCaptainCompany/captain-food/issues/628), which are out of #623's
    scope, and a declared-but-unemitted member is the same defect class this scalar exists to fix.
    It comes back with #628, in the change that emits it.

CommandFailureReason:
  type: string
  enum:
    - GATEWAY_REFUSED           # the gateway refused DETERMINISTICALLY (a retry cannot succeed)
    - CARD_DECLINED             # the gateway declined the instrument (a business outcome)
    - PAYLOAD_UNDECODABLE       # the stored payload does not fit the deployed command shape
    - UNCATALOGUED_INVARIANT    # an invariant with no errors.yaml code — a defect, not a refusal
    - TRANSIENT_INFRASTRUCTURE  # an infrastructure failure that reached a terminal verdict
  description: >
    WHY the seam failed, in the coarsest vocabulary that still changes what an operator does.
    Paired with `CommandFailureSeam`, never alone: the same reason means different things at
    different seams. Closed for the same reason as the seam — this value is written into a durable,
    customer-servable jsonb row, so the set of things it can say must be enumerable in advance.
    `UNCATALOGUED_INVARIANT` is the honest catch-all and its presence in a row is itself a finding:
    a business refusal that reaches it is a missing `errors.yaml` declaration.

GatewayStatusCode:
  type: integer
  minimum: 100
  description: >
    The HTTP status an external gateway answered with, when a failure attribution has one. A NUMBER,
    on purpose: it is the one further discrimination the operator needs (401 = our credentials, 400 =
    our request, 402 = the customer's card) and it is the only shape at that seam that cannot carry
    a provider's prose. The provider's message goes to the log; this goes to the journal row.
