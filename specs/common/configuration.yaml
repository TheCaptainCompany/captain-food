version: 1
description: >
  Captain.Food runtime configuration — the single declaration of every setting the app needs, and the
  source of truth for reading it, validating it, and documenting it (PROP-20260729-004500, issue #246).

  Configuration used to be the one part of this system with NO source of truth: the DSL governed the
  domain, the API, the screens and the observability contracts, while the ~21 environment variables the
  app actually reads existed only as inline `std::env::var` calls scattered through the composition
  root, plus a partial and stale mirror in a `render.yaml` that is not applied. The cost was real:
  `RUN_SIRENE_WORKER` gated a paused pipeline and was set in NO file and no dashboard, so 6,649 staging
  rows sat PENDING for four hours; `API_SECRET` was configured on the service and read by nothing; a
  missing `STRIPE_WEBHOOK_SECRET` silently produced the worst failure mode this product has — a
  captured payment that never reaches the domain.

  From this file the codegen emits the typed reader (`Config::from_env`), and a drift test asserts that
  every `env::var` / `env_flag` call site in `crates/**` corresponds to a key declared here. A variable
  the code reads but does not declare is a build failure, not a discovery someone makes at 00:40.

  Convention:
    - key       : the environment variable name, SCREAMING_SNAKE_CASE (also the struct field, snake_cased).
    - type      : bool | string | int | enum. `bool` accepts true/1/yes/on and false/0/no/off,
                  case-insensitive, trimmed, quotes stripped (ADR-20260728-224500) — an unrecognised
                  value falls back to `default` AND logs that it did.
    - required  : list of PROFILES in which the key MUST be present. Absent/[] = never required.
                  A missing required key is reported WITH EVERY OTHER missing key and the app STOPS.
    - default   : value when unset. Required keys must not declare one (it would mask the requirement).
    - secret    : true = the value is NEVER rendered — logs and status surfaces report `set`/`unset`.
    - gates     : WHAT BREAKS without it, in one sentence. This is not a comment: it is printed next to
                  the key in the fail-fast report, so it must read usefully to an operator who has never
                  seen the Rust. A key without `gates` fails validation.
    - scalar    : $ref into scalars.yaml. The generated reader VALIDATES the supplied value against the
                  scalar's `pattern` at startup — "present" is not "usable". A live Stripe key in the
                  test slot, a webhook secret with a pasted trailing newline, a 31-byte session key:
                  each boots happily without this and fails later, at the worst moment, looking like a
                  code bug. A malformed value is reported exactly like a missing one, and a SECRET's
                  value is never printed — only the key name and the expected shape.
    - mode_of   : optional. Names a secret whose MODE is derivable from its value prefix and safe to
                  report (never the value itself) — e.g. Stripe `sk_test_` / `sk_live_`.
    - deploy    : WHO SUPPLIES THE VALUE in each profile (PROP-20260729-014500, all five decisions
                  approved 2026-07-29). Two forms, split by secrecy — see the block below.

  ENFORCEMENT is decided by the profile, not by a separate toggle (product-owner directive,
  2026-07-29 — "fast fail to avoid misconfiguration on production"):

    - production / staging : any missing OR malformed key is logged in full and the app STOPS (exit 78).
    - development          : the same report is printed, and the app continues.

  Stopping is SAFE on Render, which is what makes it the right default rather than a brave one: a
  container that exits fails the deploy and the PREVIOUS version keeps serving. A misconfigured build
  cannot replace a working one — where booting into silent degradation, which is what happened before,
  replaces it immediately and quietly.

  Profiles (`APP_PROFILE`, default `development`): development | staging | production. The profile is
  DECLARED, never inferred from the host or from a key's prefix — an inferred profile is wrong exactly
  when it matters most (during a mode switch-over).

  HOW A VALUE REACHES THE APP (PROP-20260729-014500 D5). Render has no per-deploy environment override
  — its deploy API takes only clearCache/commitId/imageUrl/deployMode, so a deploy always runs with the
  SERVICE's stored variables. Attaching configuration to the deployment therefore means putting it in
  the artifact. Three categories, and the split is forced by secrecy, not preference:

    1. NON-SECRET, per profile -> `deploy: { production: "true", … }`
       BAKED INTO THE BINARY by the codegen as a per-profile table. The digest then determines
       behaviour: redeploying `sha-abc123` next month behaves exactly as it did today, and a rollback
       restores the configuration that shipped with that build. This is why it is baked rather than
       stored on the service — deploys here are digest-pinned precisely so production never runs an
       ambiguous artifact, and mutable service state re-opens that ambiguity through the back door.

       A non-secret may NOT be sourced from a repo secret (directive, 2026-07-29). The point of
       declaring configuration is that it is VISIBLE: a non-secret hidden in Actions secrets is as
       opaque as one typed into the dashboard — you still cannot read the repo and know what production
       runs. Validator-enforced (`config-nonsecret-from-secret`).

    2. SECRET -> `deploy: { from_secret: { production: NAME_OF_GITHUB_SECRET, … } }`
       Pushed by CI from GitHub repo secrets to the Render service env. NEVER baked: the GHCR package
       is PUBLIC (it must be, so Render can pull it without credentials), and a baked `ENV` is readable
       by anyone via `docker pull` + `docker history`.

    3. THE PROFILE SELECTOR ITSELF (`APP_PROFILE`) -> service env, necessarily.
       One image is promoted across environments by digest, so the thing that DISTINGUISHES those
       environments cannot live inside it. Baking it per-profile would also be circular: the profile is
       what selects the per-profile table.

  PRECEDENCE, highest first: environment variable > baked profile value > `default`. The env var wins
  so an operator keeps a seconds-fast override for an incident, while the reviewed, recorded value in
  this file is what runs the rest of the time.

# =====================================================================
# Profile selector
# =====================================================================

keys:

  APP_PROFILE:
    type: enum
    values: [development, staging, production]
    default: development
    gates: >
      Which keys are REQUIRED at startup. Defaults to `development` so a local run needs no production
      secrets; production must set it explicitly, or it inherits development's leniency.


  # ===================================================================
  # Persistence — without this nothing is durable
  # ===================================================================

  DATABASE_URL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/PostgresUrl'
    secret: true
    required: [staging, production]
    gates: >
      Postgres pool: the event store, every read model and every background worker. Unset, /health
      reports `not_configured` (503) and no worker is constructed at all.
    deploy:
      from_secret:
        production: DATABASE_URL
        staging: DATABASE_URL

  DATABASE_POOL_MAX_CONNECTIONS:
    type: int
    default: 5
    gates: >
      sqlx pool ceiling per PROCESS (ADR-20260807-183024 realization, issue #385): the monolith and
      every wired bin size their PgPool from this DECLARED value instead of a per-main constant.
      Matters at bin granularity: 49 pods x this ceiling is the CNPG cluster's connection budget,
      so the number must be reviewable in one place. Per-bin tuning is an env override on the
      pod (env > baked > default), not a code change.


  # ===================================================================
  # Identity (Supabase, ADR-0015) — without these, auth is anonymous-only
  #
  # Values below are LITERAL and baked (2026-07-29), read off the production boot report. They are not
  # secrets: a Supabase project URL and its JWKS endpoint are public addresses, and `sb_publishable_` is
  # Supabase's own marker for a key designed to be shared — which retires the caveat this note used to
  # carry about the older anon-key format.
  #
  # DECLARED FOR production/staging ONLY, deliberately: a developer running locally must not silently
  # inherit the production Supabase project, so `development` is left to whatever the developer sets.
  #
  # ⚠️ FOR THESE TO GOVERN, the same three keys must be REMOVED from the Render service. Precedence is
  # env > baked, so a leftover dashboard value silently wins and the digest stops determining behaviour.
  # The sync is upsert-only (D1) and will never delete them for you — it reports them instead.
  # ===================================================================

  SUPABASE_URL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HttpsUrl'
    required: [staging, production]
    gates: >
      Supabase Auth base URL: the passwordless OTP/magic-link flows, AND (#519) half the token
      verification contract -- the expected `iss` is derived from it as `{SUPABASE_URL}/auth/v1`.
      Unset, the identity service is the fail-closed stand-in and every login is refused, AND there
      is no verifier at all: `/public` degrades to anonymous and every ROLE path answers 503. An
      unset issuer never means "skip the issuer check".
    deploy:
      production: "https://zcshlzhiinwmpzujuiep.supabase.co"
      staging: "https://zcshlzhiinwmpzujuiep.supabase.co"


  SUPABASE_PUBLISHABLE_KEY:
    type: string
    required: [staging, production]
    gates: >
      Supabase anon key sent as the `apikey` header on OTP flows. Unset, identity is fail-closed
      (auth stays anonymous-only).
    deploy:
      production: "sb_publishable_iJnNRwbG123-7bNcFEtz7Q_IvhhfwBE"
      staging: "sb_publishable_iJnNRwbG123-7bNcFEtz7Q_IvhhfwBE"


  SUPABASE_JWKS_URL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HttpsUrl'
    required: [staging, production]
    gates: >
      JWKS endpoint used to verify Supabase-issued JWTs -- the other half of the #519 verification
      contract, useless without SUPABASE_URL and vice-versa. Unset, tokens cannot be verified: the
      open path `/public` falls back to anonymous, and every ROLE path fails closed with 503.
    deploy:
      production: "https://zcshlzhiinwmpzujuiep.supabase.co/auth/v1/.well-known/jwks.json"
      staging: "https://zcshlzhiinwmpzujuiep.supabase.co/auth/v1/.well-known/jwks.json"


  AUTH_SESSION_KEY:
    type: string
    scalar:
      $ref: 'scalars.yaml#/AuthSessionKey'
    secret: true
    required: [staging, production]
    gates: >
      AES-256-GCM key (32 bytes, 64 hex chars or base64) encrypting parked auth sessions at rest.
      Unset OR malformed, the store is the no-op: parking succeeds, claiming yields nothing, and login
      SILENTLY degrades to anonymous-only. Rotating it invalidates every in-flight login.
    deploy:
      from_secret:
        production: AUTH_SESSION_KEY
        staging: AUTH_SESSION_KEY


  SUPABASE_SMS_HOOK_SECRET:
    type: string
    secret: true
    gates: >
      Shared secret verifying Supabase's SMS send-hook callbacks. Unset, the hook endpoint fails closed.
    deploy:
      from_secret:
        production: SUPABASE_SMS_HOOK_SECRET
        staging: SUPABASE_SMS_HOOK_SECRET


  SUPABASE_SECRET_KEY:
    type: string
    secret: true
    gates: >
      Supabase SECRET (service-role) key authorizing exactly one server-side operation: the admin
      `app_metadata` stamp on the identity project (`identity.stamp_customer_claim`, #437 — PUT
      /auth/v1/admin/users/{authRef} writing `app_metadata.captain_food` = `{ role, customer_id }` at phone
      verification). Its PRESENCE is the gate — no feature flag: unset, stamping fails CLOSED
      (verification stands, but the session is never rotated or parked, so login degrades to a
      fresh-OTP retry once configured — an unstamped token is never parked). Never used on the
      anon OTP flows, which keep SUPABASE_PUBLISHABLE_KEY; never sent to any client.
    deploy:
      from_secret:
        production: SUPABASE_SECRET_KEY
        staging: SUPABASE_SECRET_KEY


  # ===================================================================
  # Support route (SUPPORT-CONTACT, decided 2026-08-31; ADR-20260830-213135 / ADR-20260830-234532)
  # ===================================================================

  SUPPORT_CONTACT:
    type: string
    required: [staging, production]
    gates: >
      The functional support address printed on every typed refusal that names a human route --
      first the rider sign-in refusal (`RiderNotRegistered`, #639 part C step 2c-i), next the
      not-yet-linked restaurateur screen (#792). REQUIRED with NO DEFAULT on purpose
      (ADR-20260830-213135): a refusal that renders no route is a control that does nothing, so
      the surface must not boot with a blank. Unset (development), the rider sign-in door refuses
      every attempt with a loud unconfigured error rather than printing an empty contact. A role
      address on a domain we control, never a person; no voice leg (SUPPORT-CONTACT: the rider
      handback screen gets an in-app report instead of a call button).
    deploy:
      production: "support@captain.food"
      staging: "support@captain.food"


  # ===================================================================
  # Telemetry (issue #191, PROP-170500 D1/D2) — without this, production is undiagnosable
  #
  # `specs/observability.yaml` declares 898 lines of REQUIRED spans, attributes, metrics and SLOs. None
  # of it left the repo before #191: there was no OTel dependency and logging was 69 `println!` calls, so
  # the mandatory `correlation_id` / `trace_id` in every contract's `run_identity` existed only on paper.
  #
  # The backend is Honeycomb, pinned to its **EU (eu1)** region. The region is not a default anyone can
  # flip casually: ADR-0042 chose Frankfurt for compute AND data specifically for GDPR, and these traces
  # carry `customerId` / `orderId`, which are personal data. Sending them to `api.honeycomb.io` (US)
  # would move personal data out of the EU as a side effect of a telemetry setting.
  #
  # Telemetry DEGRADES, it never gates: absence of the key is the off switch, and the app then keeps
  # emitting the same structured logs to stdout with no exporter attached. That asymmetry is deliberate.
  # A missing payment secret must stop the boot, because money silently failing is the worst outcome this
  # product has; a missing telemetry key must NOT, because refusing to serve orders in order to protest
  # that it cannot describe itself is a self-inflicted outage. So no telemetry key is `required:`.
  # ===================================================================

  HONEYCOMB_API_KEY:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HoneycombIngestKey'
    secret: true
    gates: >
      Honeycomb INGEST key for the OTLP trace/metric exporter (`x-honeycomb-team`). Unset, the exporter is
      not constructed at all and the app runs with local structured logs only — every span is built and
      dropped, so a production incident is diagnosed by reading stdout, which is the pre-#191 situation.
      This must be an INGEST key: a management key (`<id>:<secret>`, what the Honeycomb MCP server and
      Query API use) has a different shape and is rejected at startup rather than failing as an opaque
      401 on the first export.
    deploy:
      from_secret:
        production: HONEYCOMB_API_KEY
        staging: HONEYCOMB_API_KEY


  HONEYCOMB_API_ENDPOINT:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HttpsUrl'
    default: https://api.eu1.honeycomb.io
    gates: >
      OTLP/HTTP base endpoint. Defaults to and is baked as the **EU** host (`api.eu1.honeycomb.io`) — the
      US host `api.honeycomb.io` is a GDPR decision, not a preference, because spans carry customer and
      order ids (ADR-0042 pinned data to Frankfurt). Pointed at the wrong region, exports 401 against an
      account that does not hold the key and telemetry is silently absent.
    deploy:
      production: https://api.eu1.honeycomb.io
      staging: https://api.eu1.honeycomb.io


  HONEYCOMB_DATASET:
    type: string
    default: captain-food-dev
    gates: >
      The Honeycomb service/dataset traces land in, also reported as the OTel `service.name` resource
      attribute. Baked per profile so staging traffic can never be read as production: sharing one dataset
      makes a staging load test look like a Friday-night peak and corrupts every SLO computed from it.
    deploy:
      production: captain-food
      staging: captain-food-staging


  OTEL_TRACES_SAMPLE_RATIO:
    type: string
    scalar:
      $ref: 'scalars.yaml#/TraceSampleRatio'
    default: "1.0"
    gates: >
      Head-sampling probability, parent-respecting. Baked at `1.0` (keep everything) because PROP-170500
      D2's reasoning holds at V0 volume: "head-sampling would mostly discard the interesting traces".
      This is the dial to turn DOWN if ingest cost becomes real — turning it down before there is volume
      buys nothing and loses the traces that explain the incidents. Set to 0 and traces stop; the metrics
      and logs continue, so the app looks healthy while being undiagnosable.
    deploy:
      production: "1.0"
      staging: "1.0"


  LOG_LEVEL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/LogLevel'
    default: info
    gates: >
      Minimum severity for the structured JSON log layer. At `error` the boot report and every worker
      lifecycle line disappear, which is how a paused pipeline becomes invisible (issue #220) — so the
      baked value stays `info` and `debug` is an incident tool, not a default.
    deploy:
      production: info
      staging: info


  EXTERNAL_API_TOKENS:
    type: string
    secret: true
    gates: >
      Comma-separated pre-shared tokens for EXTERNAL machine callers (`X-External-Api-Key`, ADR-0047).
      Unset, only a Supabase JWT with `captain_food.role` EXTERNAL reaches /external.
    deploy:
      from_secret:
        production: EXTERNAL_API_TOKENS
        staging: EXTERNAL_API_TOKENS


  INTERNAL_TRIGGER_TOKEN:
    type: string
    secret: true
    gates: >
      Shared secret for `POST /internal/sirene/drain` and `/internal/inbound/drain` (`x-internal-token`).
      Unset, both fail closed (503) and the CI sweep cannot wake the worker — the drain then waits for
      its hourly poll instead of starting in seconds.
    deploy:
      from_secret:
        production: INTERNAL_TRIGGER_TOKEN
        staging: INTERNAL_TRIGGER_TOKEN


  # ===================================================================
  # Actor mailbox + projection runtime (ADR-20260730-231500; PROP-20260728-152752 /
  # PROP-20260730-230803). Declared AHEAD of their readers — the drift gate is one-directional
  # (a read must be declared; a declaration may precede its read): the mailbox worker (#242
  # slice 3) and the batched projector (#267) land against keys that already exist, instead of
  # smuggling constants in with the code.
  # ===================================================================

  MAILBOX_LEASE_SECONDS:
    type: int
    default: 30
    gates: >
      How long a mailbox partition lease lives without renewal (PROP-20260728-152752 §3.1). Too
      short and healthy workers flap ownership; too long and a crashed worker's partitions sit
      unserved for that many seconds before takeover — at peak that is paid-order latency. Reader
      lands with the #242 slice-3 worker.


  MAILBOX_HEARTBEAT_SECONDS:
    type: int
    default: 10
    gates: >
      Lease renewal cadence — also the balancing-loop tick (claim free, steal ONE) and the upper
      bound on the dual-belief window during a steal (§3.1: belief may lag one heartbeat,
      authority never — the ownership_version fence is commit-time). Keep at roughly a third of
      MAILBOX_LEASE_SECONDS. Reader lands with the #242 slice-3 worker.


  RUN_MAILBOX_WORKERS:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    # `consumer` keeps this key OUT of the server Config: only the adapter binaries read it
    # (their own env parse in infrastructure::mailbox::standalone), and a resolved-but-ignored
    # monolith field would imply an authority the monolith does not have.
    consumer: adapters
    gates: >
      Standalone adapter workers (#272 D3, deferred from the PR #270 review): ON in a webhook
      adapter's own deployment, the binary runs MailboxWorkers for exactly the lanes its
      ingestor feeds — so facts keep being DELIVERED (not just accepted) while the monolith is
      down. OFF, the adapter only mirrors + enqueues and the monolith's fleet
      delivers. The trade-off the flip accepts: the status/event buses are in-process, so a
      fact delivered by the adapter process never reaches the monolith's push subscribers
      (polls unaffected) — which is why this is a deployment posture, not a default. The MONEY
      lanes (Payment / PlaceOrderProcess / RefundProcess) used to be additionally gated on the
      PM_MAILBOX_DELIVERY posture read at spawn; that gate RETIRED with `command_journal` in
      #242 Runtime D (ADR-20260812-000000), so an adapter fleet now spawns exactly the lane set
      the monolith does, with no posture read and nothing left to drift.
      Read by the adapter binaries only; the monolith ignores it (its composition root
      always runs the full fleet).


  ACTOR_ACTIVATIONS:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      ACTIVATIONS (#272 D3, PROP-20260728-152752 §3.5): ON, each mailbox delivery folds the
      delivered actor's own stream through a shared held-state cache — filled on first load,
      extended with the committed appends strictly AFTER the fenced transaction commits
      (apply-after-commit), dropped on a lost version race, on lane loss, on idle expiry and
      under the memory bound. OFF (gate-then-stabilize; the flip is its own
      one-line ADR after staging smoke), every delivery folds from the log, byte-identically
      to the pre-D3 runtime. Correctness never depends on the cache, on BOTH verdict shapes:
      an APPEND from a stale hold loses the UNIQUE(stream_name, version) race, and a NON-APPEND
      terminal verdict (a deterministic rejection, an Ignored/Duplicate record) from a
      cache-served fold re-asserts the stream version inside the fenced transaction — either
      way the delivery aborts, invalidates and refolds, out-of-band writers (saga-runner legs,
      peer-process fleets, the deletion engine) included.


  ACTOR_ACTIVATION_IDLE_SECONDS:
    type: int
    default: 300
    gates: >
      Global default for activation passivation (PROP-20260728-152752 §3.5): an in-memory actor
      unsolicited for this long is dropped, its next message paying one rehydration fold.
      Per-actor overrides live in actors.yaml (mailbox.activations.idle_seconds). Zero would
      disable the cache; too high and idle aggregates hold memory the LRU bound must then evict.
      Read by the ACTOR_ACTIVATIONS-gated cache (#272 D3).


  ACTOR_ACTIVATION_MAX_MEMORY_MB:
    type: int
    default: 64
    gates: >
      The activation cache's byte bound (PROP-20260728-152752 §3.5 "hot cache pressure evicts by
      size"): crossing it evicts least-recently-used held states, sized by their serialized event
      payloads. Idle actors expire by the clock (ACTOR_ACTIVATION_IDLE_SECONDS); this bound is
      the backstop for a hot Friday-peak set larger than memory should carry.


  PROJECTION_BATCH_SIZE:
    type: int
    default: 500
    gates: >
      Events per projection unit-of-work flush (PROP-20260730-230803 §2, 100–1000): one
      transaction per THIS MANY events instead of one per event. Higher = fewer fsyncs but a
      larger replay window after a crash and a bigger in-memory identity map. Reader lands with
      the #267 batched projector.


  PROJECTION_BATCH_MEMORY_MB:
    type: int
    default: 64
    gates: >
      Early-flush bound on the projection identity map (PROP-20260730-230803 §4): a batch whose
      loaded row states outgrow this flushes before reaching PROJECTION_BATCH_SIZE, keeping wide
      rows (catalog imports) from ballooning the projector. Reader lands with the #267 batched
      projector.


  PROJECTION_PARTITIONS:
    type: int
    default: 16
    gates: >
      Projection lane keyspace width — hash(business_key) mod THIS routes events to lanes with
      per-key order preserved (PROP-20260730-230803 §3). Fixed-wide like the mailbox width:
      changing it re-maps lanes (a drain-then-resize operation), while worker scaling only
      re-divides lane ownership. Reader lands with the #267 batched projector.


  # ===================================================================
  # Worker toggles — each pauses a pipeline (ADR-20260728-224500)
  # ===================================================================

  RUN_PROJECTOR:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      In-process projection worker (ADR-0040). OFF, no read model advances — queries serve stale data
      indefinitely. Readiness at GET /projector.
    deploy:
      production: "true"
      staging: "true"


  RUN_PROCESS_MANAGERS:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      In-process saga runner (actors.yaml process managers). OFF, no cross-aggregate reaction fires.
      Readiness at GET /saga.
    deploy:
      production: "true"
      staging: "true"


  RUN_EVENT_PUSH:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      Push wake for the drain loops (ADR-20260802-200416): one dedicated LISTEN connection turns
      each committed append's pg_notify into an immediate drain of the projector AND the saga
      runner, replacing the 1.5 s poll as the primary signal (~70,900 idle queries/hour -> ~120).
      OFF, both loops fall back to unassisted 1.5 s polling — correct but bandwidth-expensive; the
      escape hatch for a deployment behind a TRANSACTION-mode pooler, which silently cannot carry
      LISTEN (session pooler required, e.g. Supabase port 5432).
    deploy:
      production: "true"
      staging: "true"


  RUN_RIDER_RESTRICTION_SOCKET_CLOSE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    decisionRow: RIDER-RESTRICTION-PRECONDITIONS
    gates: >
      The restriction fact terminates the rider's socket (#639 part C step 5,
      ADR-20260905-065415 §6). ON, a RIDER connection's `connection_init` spawns the
      connection-local watcher (matching this rider's OWN `RiderRestricted` fact on the in-process
      EventBus), seeds the connection-local standing cell `StandingGuard` reads first, and pushes a
      4403 Close frame the moment the fact lands or a re-derivation confirms RESTRICTED. OFF, no
      watcher is spawned, no close is ever sent, and `StandingGuard` reads `ReadScope` exactly as
      before this record — the one-writer WS sink refactor itself (ADR §3) is STRUCTURAL and
      ALWAYS ON, unaffected by this key. Ships DARK (production/staging `"false"`): the restrict
      door itself is pinned off (`RUN_RIDER_RESTRICTION_DOOR`) and the rider population is zero
      (ADR-20260817-105844), so this key protects nothing today; flipping it is a SEPARATE,
      one-line ADR after a smoke, never bundled with this key's introduction.
    deploy:
      production: "false"
      staging: "false"


  RUN_MAILBOX_PUSH:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      Push wake for the actor mailbox (PROP-20260802-223522 D1/D2, ADR-20260802-224532): the
      PgMailbox door raises pg_notify('inbound_messages', actor_type) inside every enqueue
      transaction, and one dedicated LISTEN connection per consuming process turns it into an
      immediate nudge of that actor type's worker — including ACROSS processes, so a standalone
      adapter's recorded fact wakes the monolith's worker on commit instead of waiting out the
      heartbeat (up to 10 s on the payment path). While push is confirmed live the full drain
      pass stretches to the 60 s safety net; lease renewal (beat) stays on
      MAILBOX_HEARTBEAT_SECONDS unconditionally. OFF — or whenever the listener is down — workers
      fall back to full passes at the heartbeat cadence: exactly the pre-push behaviour, never
      worse. Liveness is CANARY-VERIFIED, not assumed: the listener notifies itself on the same
      channel every canary interval and drops to down (mailbox_push_down_total{reason}) when the
      echo does not come back within the next interval — this catches the transaction-mode
      pooler's failure mode, where LISTEN registers but silently delivers nothing (session
      pooler required, e.g. Supabase port 5432 — same constraint as RUN_EVENT_PUSH).
    deploy:
      production: "true"
      staging: "true"


  MAILBOX_MAX_DELIVERY_ATTEMPTS:
    type: int
    default: 5
    gates: >
      Poison bound (PROP-20260802-223522 D4): a delivery whose completion transaction fails with
      an infrastructure error (the status flip aborts with it, so nothing is recorded on the row)
      increments inbound_messages.attempts OUTSIDE the failed transaction; at this cap the row
      flips to terminal FAILED with the error recorded and the lane's head-of-line unblocks.
      Counts only actual delivery attempts — a lane that cannot be claimed consumes none, and
      re-attempts back off EXPONENTIALLY (ADR-20260803-002712 Q2): attempt N schedules the next
      try base * 2^(N-1) seconds out, base = the heartbeat (10s -> 20s -> 40s -> 80s -> 160s,
      ~5 min to terminal at cap 5), because push-driven retries have no natural cadence: without
      pacing, a nudge storm at Friday peak could burn the whole cap on a seconds-long transient
      blip (review #314 MAJOR-3). 0 = no
      cap: the pre-#313 infinite-retry behaviour, kept as the rollback lever. Handler
      REJECTED/FAILED verdicts are terminal on the first attempt and never involve this cap.
      A poison flip is an OPERATOR EVENT: counted (mailbox_poison_failed_total{actor_type}) and
      surfaced per lane on the ADMIN mailboxLanes supervision query (retryingAttempts/poisoned).


  RUN_DELETION_ENGINE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The generic deletion engine (ADR-20260731-214500 §4): runs the declared deletion journeys
      (tombstone -> stream deletion -> ledger receipt) for every actors.yaml `deletion:` block.
      OFF, recorded expiry facts accumulate and no stream is ever erased — GDPR deletion pauses,
      data is never lost. Gate-then-stabilize: this worker DELETES event streams;
      the default flips by its own one-line ADR after the gated form is smoked in staging.
      Readiness at GET /deletion.


  # PM_MAILBOX_DELIVERY is GONE. It was never an env key (#318, ADR-20260803-104819 moved it to a
  # RuntimePosture database row), and in #242 Runtime D (ADR-20260812-000000) the gate itself
  # retired with `command_journal`: its OFF arm was the legacy journal+spawn path, and with that
  # table dropped there is no arm to fall back to. PM mutations deliver through the PM mailboxes,
  # the Payment lane B2-chains inbound Stripe facts and the saga runner carries no Stripe-fact
  # triggers -- unconditionally, in every process.

  RUN_RETENTION_SWEEP:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      Retention sweep over terminal journal/mirror rows. OFF, nothing expires and storage grows without
      bound.
    deploy:
      production: "true"
      staging: "true"


  # ===================================================================
  # SMS delivery (OVH, #118 / ADR-20260722-174500) — the Supabase Send-SMS hook's sender
  #
  # These were READ BY THE CODE AND DECLARED NOWHERE until 2026-07-29 — invisible to the startup
  # validation, to the boot report and to the sync manifest. The drift gate missed them because
  # `OvhSmsClient::from_env` reads through a closure (`var("OVH_APPLICATION_KEY")`) rather than a
  # literal `env::var("…")` call, which string matching cannot see. The gate now catches that shape.
  #
  # ALL OPTIONAL: phone-OTP delivery is not the live login path. But they are all-or-nothing —
  # `from_env` returns None unless the full credential set is present, and `/auth/sms-hook` then
  # answers 503 (fail-closed: never a half-configured send path). So a partial set delivers nothing
  # while looking configured, which is why the `gates` text below says so per key.
  # ===================================================================

  OVH_APPLICATION_KEY:
    type: string
    secret: true
    gates: >
      OVH API application key — one of the THREE values the v1 signature needs (`X-Ovh-Application`).
      Missing any one of the three and the SMS client is None, so the Send-SMS hook 503s and Supabase
      surfaces an OTP delivery error to the customer.
    deploy:
      from_secret:
        production: OVH_APPLICATION_KEY
        staging: OVH_APPLICATION_KEY


  OVH_APPLICATION_SECRET:
    type: string
    secret: true
    gates: >
      OVH API application secret — the HMAC key for `X-Ovh-Signature`
      (`sha1(secret + "+" + consumerKey + "+" + METHOD + "+" + URL + "+" + BODY + "+" + timestamp)`).
      The one value here that grants send capability; treat it as a payment credential.
    deploy:
      from_secret:
        production: OVH_APPLICATION_SECRET
        staging: OVH_APPLICATION_SECRET


  OVH_CONSUMER_KEY:
    type: string
    secret: true
    gates: >
      OVH API consumer key — binds the application credentials to the authorised access rules
      (`POST /sms/*/jobs`). A key whose rules omit that path authenticates fine and then fails the
      send, which is why the rule set matters as much as the value.
    deploy:
      from_secret:
        production: OVH_CONSUMER_KEY
        staging: OVH_CONSUMER_KEY


  OVH_SMS_SERVICE_NAME:
    type: string
    secret: true
    gates: >
      The OVH SMS account the messages are billed to (e.g. `sms-ab12345-1`), used as
      `POST /sms/{serviceName}/jobs`. BORDERLINE as a secret: it grants nothing on its own — the
      credential triplet does that — but it embeds the OVH account identifier. Declared `secret: true`
      because it is already held as a repo secret and its literal value is not in this repository; if
      you would rather it be readable, give it literal per-profile `deploy` values instead and drop
      `secret`. Also note the account must hold SMS CREDITS: with none, the credentials authenticate
      and the send still fails at OVH.
    deploy:
      from_secret:
        production: OVH_SMS_SERVICE_NAME
        staging: OVH_SMS_SERVICE_NAME


  OVH_SMS_SENDER:
    type: string
    gates: >
      The sender name shown on the SMS. Unset, the client substitutes `CaptainFood`. Declares NO
      `default` deliberately: the fallback lives in `OvhSmsClient::from_env`, and a second copy here
      would be two sources of truth for one value. OVH requires a sender to be REGISTERED and approved
      before it can be used, so an unapproved name fails at send time, not at startup.


  OVH_ENDPOINT:
    type: string
    gates: >
      OVH API base URL. Unset, the client substitutes `https://eu.api.ovh.com/1.0` — the EU region,
      which is the deliberate choice for data residency (ADR-20260722-174500) and must match the
      region the API credentials were created in. Declares NO `default` for the same reason as
      OVH_SMS_SENDER: the fallback is the client's.


  INTERNAL_TRIGGER_URL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HttpsUrl'
    consumer: sirene_ingest
    gates: >
      The deployed server's drain endpoint, pinged at the end of a sweep so the worker starts in seconds
      instead of waiting for its hourly poll. Unset, the sweep logs that it skipped the ping — which is
      how department 37's 6,649 rows stayed PENDING after a successful ingestion.


  # ===================================================================
  # Runtime / build identity
  # ===================================================================

  PORT:
    type: int
    default: 8080
    gates: >
      TCP port the HTTP server binds. Render injects this; a mismatch means the platform health check
      never reaches the app and the deploy fails.


  WEB_ASSETS_DIR:
    type: string
    default: /app/web-assets
    gates: >
      Directory served for the Leptos/WASM bundle. Wrong path, the storefront loads no assets.


  GATEWAY_SUBGRAPH_URLS:
    type: string
    default: ""
    gates: >
      Subgraph address overrides for the gateway-{role} bins (#385, D8): comma-separated
      `scope=url` pairs. Empty (the default), a gateway resolves each scope to its in-cluster
      Service DNS (`http://graphql-{scope}`) — so in Kubernetes nothing sets this; a local or
      off-cluster gateway that cannot resolve Service names routes nowhere without it.


  SURFACE_GATEWAY_URL:
    type: string
    default: ""
    gates: >
      The role-gateway origin the fo-*/bo-* surface bins resolve SSR reads through (#385, D8 —
      a surface holds no database credential; it reads only over GraphQL, always as the
      anonymous PUBLIC role). Empty (the default) resolves the in-cluster
      `http://gateway-public` Service; a local or off-cluster surface renders data-less shells
      without it.


  CAPTAIN_BUILD_VERSION:
    type: string
    gates: >
      Short git SHA baked into the image at build time (ADR-20260721-175411) and reported by /health and
      the X-VERSION header. Unset, `build_version()` substitutes `dev-<crate version>` for local and
      uncontainerized runs, so a build that forgot it is identifiable AS unidentified. Deliberately
      declares NO `default`: the fallback is COMPUTED (it interpolates the crate version), and a spec
      default of plain `dev` would state a value the runtime never produces — a false declaration is
      worse than an absent one.


# ══════════════════════════════════════════════════════════════════════════════════════════════════
# RETENTION WINDOWS — the approved catalog (MET-W, CLOSED 2026-08-11 "APPROVED AS RECOMMENDED")
# ══════════════════════════════════════════════════════════════════════════════════════════════════
# A NAMED CATALOG of approved retention windows, `$ref`'d — deliberately NOT a `Duration` scalar with
# a pattern, because "a pattern catches `P90DD` but not a well-formed window nobody approved"
# (DECISIONS MET-W). An event declares the obligation ON ITSELF via `legalRetention:`, naming a
# window from here; the validator then enforces two things no reviewer can be trusted to catch by
# eye (`legal-retention-window-uncatalogued`, `deletion-undercuts-retention`).
#
# WHY THIS IS A SECTION OF configuration.yaml AND NOT A NEW KIND: the deletion grammar's `after:`
# already names `configuration.yaml#/keys/<KEY>`, so the enforcement and the obligation now read out
# of ONE catalog file, and the kind list in CLAUDE.md is unchanged. The two sections are NOT
# interchangeable: a `keys` entry is an environment variable an operator sets, a `retention_windows`
# entry is a legal instrument nobody may set at runtime — which is exactly why it has no `type`,
# no `default` and no `deploy`.
#
# BRIEF-20260811 §3 is the reason this exists: without it the only way to say "this event is a legal
# register" was to hard-code `RestaurantListingOptedOut` in the validator — "a comment written in
# Rust, not a spec-derived gate".
#
# Fields:
#   - instrument  : the legal instrument that COMPELS the retention, in the words of the instrument.
#                   Not a comment: it is interpolated into the customer-facing "what was retained
#                   and why" copy (PROP-20260829-150752 §3.6), so the screen and the enforcement are
#                   generated from the SAME declaration and cannot drift apart.
#   - days        : the horizon, in days. Mutually exclusive with `indefinite`.
#   - indefinite  : true = there is NO horizon; the obligation never expires, and any deletion
#                   trigger reaching this event is refused OUTRIGHT (an Art. 21 register is retained
#                   BECAUSE retaining it is the lawful act — deleting it is the violation).

  # ── Routed-send lane gates (#807) ──────────────────────────────────────────────────────────────
  # KERNEL keys, not scope keys, and the reason is mechanical rather than aesthetic: the generated
  # `RouteGates` struct carries ONE FIELD PER DECLARED ROUTE and every PM bin's composition root
  # constructs the WHOLE struct, so a route gate must be readable from every bin's scoped Config or
  # that bin does not compile. It is also the semantics -- "both the monolith and any standalone
  # worker fleet MUST read the same value; a split fleet would route some messages and append
  # others" -- so a route gate is platform configuration by definition, whatever scope the saga
  # that declares the route lives in.

  ROUTE_CART_BIND_THROUGH_LANE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The customer-bind routing (#807, ADR-20260829-230418 as corrected by ADR-20260831-093000). ON,
      CartBindingProcess stops CALLING the BindCartToCustomer handler in-process, once per open cart
      on its own thread, and instead stages one COMMAND lane enqueue per cart that the runner's
      fenced leg transaction turns into an inbound_messages row; each Cart's own lane worker then
      runs the command and appends CartBoundToCustomer. OFF is today's behaviour byte for byte: the
      saga writes Cart-{id} itself, for every cart the read returned, with no transaction and no lane.
      What flipping it CHANGES: (a) each bind gains one lane hop of latency after the identification
      is recorded; (b) the ENVELOPE changes -- user_id/user_type and cause_id come from the mailbox
      row rather than the saga's system actor, and stored rows are NEVER backfilled; (c) the fan-out
      stops being serial work on one saga thread and becomes N independent lane messages, so one
      slow or conflicted cart no longer delays the rest; (d) a rejection lands a REJECTED verdict on
      a supervisable row instead of a `tracing::warn!` nobody routes -- which matters more here than
      anywhere else in this group, because the for_each arm's rejection path does not even set an
      Outcome, so a failed bind is invisible today. ROLLBACK IS A FLIP, NOT A REDEPLOY: set it OFF
      and the next identification takes the legacy in-process calls; already-routed binds stay as
      they are. Both the monolith and any standalone worker fleet MUST read the same value.
      Flipping the default is a SEPARATE recorded decision, after smoke; the legacy arm is deleted
      in a SEPARATE change again, with golden payload equality as its precondition.

  ROUTE_CREDIT_GRANT_THROUGH_LANE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The goodwill-credit routing (#807, ADR-20260829-230418 as corrected by ADR-20260831-093000).
      THE MONEY PATH: ON, ReclamationProcess's GOODWILL_CREDIT arm stops CALLING the
      GrantCustomerCredit handler in-process and instead stages a COMMAND lane enqueue that the
      runner's fenced leg transaction turns into an inbound_messages row; the CustomerCredit
      ledger's own lane worker then runs the command and appends CustomerCreditGranted. OFF is
      today's behaviour byte for byte: the saga writes CustomerCredit-{customerId} itself, from
      outside the ledger's serialization point, with no transaction and no lane. The saga that declares this
      route is in ordering and the TARGET ledger is in payments -- a process manager is a declared
      cross-scope bridge -- while the KEY is kernel, because every PM bin's composition root
      constructs the whole RouteGates struct (see the block header above). What flipping it CHANGES: (a) the grant gains one
      lane hop of latency after the resolution is recorded -- the claimant's balance moves a beat
      later, and nothing shows the credit before it lands; (b) the ENVELOPE changes -- user_id/
      user_type and cause_id come from the mailbox row rather than the saga's system actor, and
      stored rows are NEVER backfilled; (c) the writer to CustomerCredit-{customerId} becomes
      SERIALIZED by the ledger's own lane instead of racing on an optimistic version conflict --
      which is the property that stops mattering hypothetically the moment a second writer exists;
      (d) a rejection lands a REJECTED verdict on a supervisable row instead of a Skipped outcome.
      DOUBLE-GRANT SAFETY DOES NOT DEPEND ON THIS FLIP, in either position: the handler is
      idempotent per reclamationId (at most one grant per resolved claim) and the routed door is
      keyed on the ROUTE plus the RECLAMATION (`dedup_by:`), so a re-delivered ReclamationResolved
      is absorbed on both arms. The door is deliberately NOT keyed on the ledger's own id: the
      ledger is per CUSTOMER and a customer legitimately receives many goodwill credits, so a
      customer-keyed door would swallow every grant after the first -- money owed, never paid, no
      error raised anywhere. ROLLBACK IS A FLIP, NOT A REDEPLOY. Flipping the default is a SEPARATE recorded
      decision, after smoke; the legacy arm is deleted in a SEPARATE change again, with golden
      payload equality as its precondition.

  ROUTE_ORDER_DELIVERY_COMPLETION_THROUGH_LANE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The delivery-completion routing (#807, ADR-20260829-230418 as corrected by
      ADR-20260831-093000). ON, DeliveryDispatchProcess stops CALLING the MarkOrderDelivered
      handler in-process and instead stages a COMMAND lane enqueue that the runner's fenced leg
      transaction turns into an inbound_messages row; the Order's own lane worker then runs the
      command and appends OrderDelivered. OFF is today's behaviour byte for byte: the saga writes
      Order-{id} itself, from the delivery scope, with no transaction and no lane.

      ONE key for BOTH completion legs, and that is not a fused flag. DeliveryStatusUpdated
      (a partner's terminal DELIVERED report) and DeliveryCompleted (an independent rider's
      completion) are two TRIGGERS for the SAME route: the same command to the same aggregate from
      the same process manager. A route's identity is the (message, target) pair -- it is one
      `Route::MarkOrderDeliveredToOrder` variant and one ROUTED_LANES row -- so two keys here could
      not be honoured by anything, and the per-route independence ADR-20260829-230418 C3 protects
      is independence between UNRELATED routes, which these two legs are not.

      What flipping it CHANGES: (a) the closure gains one lane hop of latency after the completion
      is reported, so the order shows DELIVERED a beat later; (b) the ENVELOPE changes -- user_id/
      user_type and cause_id come from the mailbox row rather than the saga's system actor, and
      stored rows are NEVER backfilled; (c) the Order's writer is serialized by its own lane, so
      a completion racing any other Order write no longer resolves by optimistic version conflict;
      (d) a rejection -- notably the terminal-status rejection that stops a cancelled order being
      resurrected -- lands a REJECTED verdict on a supervisable row instead of a Skipped outcome.
      DOUBLE-CLOSE SAFETY IMPROVES: the routed door is keyed on the ROUTE plus the ORDER's id, so
      if both a partner report and a rider completion arrive for one order the second is absorbed
      at the door, where today it reaches the aggregate and is refused by the status invariant.

      (e) A LEGAL-SURFACE CONSEQUENCE, and the reason this key is not a pure plumbing flip: a
      successful COMMAND-door delivery ARMS THE DECLARED `schedules:`. `actors.yaml` declares
      MarkOrderDelivered -> OrderExpired, the ORDER RETENTION CLOCK
      (`ORDER_RETENTION_WINDOW_DAYS`, `reschedule: in-place`, set against
      FRENCH_COMMERCIAL_BOOKS_10Y), and the delivery glue applies a delivered message's schedules
      inside the completion transaction for COMMAND rows exactly as for recorded facts. Today the
      saga's in-process arm creates no mailbox row at all, so it arms nothing: a delivery
      completed by a PARTNER's DELIVERED report or by an INDEPENDENT RIDER's completion starts NO
      retention clock, while the same order closed through the `markOrderDelivered` mutation does
      -- the two paths to the same business fact have different retention behaviour, and only the
      operator-driven one is covered. Flipping this key ON puts both saga legs on the same footing
      as the mutation. That is a GDPR-relevant improvement rather than a regression, and it is
      named here because the flip decision is made from this text: an order whose retention clock
      was never armed is an order nothing will ever expire.

      ROLLBACK IS A FLIP, NOT A REDEPLOY. Flipping the default is a SEPARATE recorded decision,
      after smoke; the legacy arm is deleted in a SEPARATE change again, with golden payload
      equality as its precondition.


  # --- The email send-abuse wall (#639 part C step 6-ii, ADR-20260905-101349 §9) -------------------
  # `identity.send_email_magic_link` is the ONE way anything in this product sends a magic-link
  # email (RequestEmailVerification AND RequestMemberSignInLink both call it), so the guard lives
  # AT that seam and protects both callers uniformly -- the same placement choice SMS made
  # (`send_phone_otp` guards RequestPhoneVerification and RequestRiderSignInCode alike). Platform
  # key, not scope-owned, for the same reason: two scopes already call the one port it guards.
  # `UNVERIFIED input` (ADR-20260817-105845): these numbers MIRROR the SMS defaults verbatim --
  # nobody has costed an email-send abuse ceiling, and email carries no direct per-message price
  # the way a prepaid SMS credit pack does, so "mirror the phone numbers and say so" is the honest
  # placeholder rather than a derived figure.
  EMAIL_MAX_SENDS_PER_ADDRESS_PER_HOUR:
    type: int
    default: 3
    gates: >
      UNVERIFIED input (mirrors SMS_MAX_SENDS_PER_NUMBER_PER_HOUR verbatim). Magic-link sends
      allowed to ONE canonical email address per rolling hour. Exceeding it is
      `errors.yaml#/RateLimited`.

  EMAIL_MAX_SENDS_PER_ADDRESS_PER_DAY:
    type: int
    default: 5
    gates: >
      UNVERIFIED input (mirrors SMS_MAX_SENDS_PER_NUMBER_PER_DAY verbatim). The daily backstop
      beside the hourly cap above -- exceeding it is `errors.yaml#/VerificationSendLimitReached`.

  EMAIL_MAX_SENDS_PER_DAY_GLOBAL:
    type: int
    default: 200
    gates: >
      UNVERIFIED input (mirrors SMS_MAX_SENDS_PER_DAY_GLOBAL verbatim, itself "a deliberately
      conservative guess, not a costed number"). Total magic-link sends allowed platform-wide per
      rolling day, across every address and every caller of `send_email_magic_link`. Once spent,
      every further send is refused with `errors.yaml#/VerificationSendCapacityExhausted` --
      turning real requests away is a correct trade against runaway sending-domain reputation
      damage, but only because the refusal is loud
      (`email_send_refused_total{reason=global_ceiling}`, logged at ERROR).

  GRAPHQL_LIMIT_HEADROOM_PERCENT:
    type: int
    default: 50
    gates: >
      UNVERIFIED input (ADR-20260905-101349 §9): the per-role GraphQL depth/complexity ceiling is
      `codegen-emitted max x (100 + this) / 100` -- the emitted max is the deepest/most complex
      GENERATED client document that role's screens actually bind
      (`tools/codegen-rs`'s `graphql-limits` emitter over `crates/web/src/generated/data_layer.rs`'s
      `ResolverKey::selection()`), and this percentage is the safety margin above that observed
      real traffic before a request is refused. 50% is a round, unresearched starting margin --
      wide enough that an ordinary screen fragment addition does not immediately trip the ratchet,
      narrow enough that an order-of-magnitude pathological query still refuses. Never a
      public-only limit: it applies to the ceiling computed for EVERY role.

retention_windows:

  FRENCH_COMMERCIAL_BOOKS_10Y:
    instrument: "Code de commerce L123-22 (livres et documents comptables) + CGI 242 nonies A (pièces justificatives)"
    days: 3650
    description: >
      The accounting/invoice horizon French law compels for the financial record of a sale: ten
      years from the close of the exercise. Deliberately set at the CONSERVATIVE whole-order
      horizon because the per-FIELD split — which order fields are invoice data (retained,
      plaintext) versus personal data (encrypted, crypto-shredded) — is counsel's to name and is
      OPEN (PROP-20260829-150752 §9 Q1, sharpening BRIEF-20260811 G3). Narrowing this window, or
      splitting it per field, is a counsel-driven change to this ONE declaration; nothing else moves.
      This is the window `ORDER_RETENTION_WINDOW_DAYS` (default 3650) is set against — the pilot
      passes `deletion-undercuts-retention` exactly AT the boundary, not comfortably inside it, and
      that is deliberate: any shortening of the config key is meant to go red.

  GDPR_ART21_OBJECTION_REGISTER:
    instrument: "GDPR Art. 21 objection register (liste repoussoir, CNIL doctrine) — read with Art. 5(2) accountability"
    indefinite: true
    description: >
      The suppression register: the minimal record that a person OBJECTED. It has no horizon and
      may never be deleted, because retaining it IS the lawful act and deleting it is the violation
      — re-import would re-contact the person who objected, and under Art. 5(2) the controller
      would then be unable to evidence that the objection was ever honoured
      (BRIEF-20260808 Q1/Q4, BRIEF-20260811 §3, recorded there as BLOCKER-on-arrival).
      `RestaurantListingOptedOut` carries this window. An `indefinite` window bars a stream-deleting
      `deletion:` trigger OUTRIGHT — there is no window long enough to satisfy it.
