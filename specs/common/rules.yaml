version: 2
description: >
  Business rules / invariants the system must uphold (ADR-0032). Each behaviour test in tests.yaml links
  to at least one rule via `rules: [{ $ref: 'rules.yaml#/RuleName' }]`, and the validator enforces the link
  BOTH ways: every rule is exercised by ≥1 test, and every test asserts ≥1 rule. Rules say WHAT we
  guarantee (readable intent); tests say HOW it's verified (Given/When/Then). A rule may span several tests
  (typically a happy path + its rejection). Keyed by PascalCase name; description is the guarantee.

CheckoutSnapshotFrozenAtIntent:
  description: "When it creates the PaymentIntent, PlaceOrderProcess freezes the full priced checkout (cart, contact, service type, delivery address, priced items, breakdown) onto PaymentIntentCreated, so the order can be materialized from the event log alone on payment authorization — no out-of-log store."

OrderMaterializedOnPaymentAuthorization:
  description: "On payment AUTHORIZATION (funds held on the card, not captured — ADR-20260808-195315 §1.2) the order is materialized and the cart is closed; the money moves only at capture, on fulfilment."

PaymentCapturedOnFulfilment:
  description: "A payment is captured on handover (OrderDelivered — the one fact for DELIVERY and COLLECTION alike) ONLY when the order carries a Captain AUTHORIZATION to capture: an order whose OrderTracking row has a payment_intent_id AND payment_status AUTHORIZED. The delivery fact alone NEVER captures — an order with no Captain PaymentIntent ($0 replacements today; post-V0 external orders ingested from Uber Eats, already paid on the partner's rails with no Captain authorization, ADR-20260813-233418 AR-2) is structurally skipped, not captured. PaymentSettlementProcess requests the full-amount capture; the settled inbound PaymentCaptured records that the money moved. The concrete external-order regression test (an ExternalOrderReceived order marked delivered triggers no capture) lands with the external-orders slice — the event does not exist yet."

AuthorizationReleasedWithoutCapture:
  description: "A rejected or cancelled order whose payment is AUTHORIZED but not captured RELEASES the hold (Stripe void) instead of refunding — 'no need to refund because no capture' (ADR-20260808-195315 §1.3). Post-capture rejection/cancellation still opens the ordinary refund path (RefundProcess)."

CaptureFailureIsRecordedAndPaged:
  description: "A capture that fails after fulfilment — food cooked, money did not move — is never silent: PaymentSettlementProcess records PaymentCaptureFailed with a typed reason on the Payment and the paging counter fires (observability.yaml#/payment-settlement). The payment stays AUTHORIZED so a retried capture can still settle."

RefundRequiresApproval:
  description: "Only an explicit decision — by the RESTAURANT for its own orders, or by an ADMIN — resolves a pending refund: ApproveRefund (possibly partial) requests the Stripe refund, DenyRefund closes it; both are rejected when no refund is pending approval for the order."


# --- CartBindingProcess ---
GuestCartsBoundOnIdentification:
  description: "A returning visitor's open guest carts are bound to their Customer on identification."

ReadyDeliveryOrderTriggersDispatch:
  description: "A ready DELIVERY order triggers creation of a delivery job (dispatch)."

OnlyCapPoisonedMailboxRowsAreRequeueable:
  description: >
    An admin requeue returns a POISONED mailbox row — one the delivery-attempts cap flipped to
    terminal FAILED with error code DeliveryInfrastructureError (PROP-20260802-223522 D4) — to
    RECEIVED with attempts reset and error + backoff schedule cleared, and records the
    intervention as a MailboxMessageRequeued fact on the row's supervision stream. Rows in any
    other state are never requeued: handler REJECTED/FAILED verdicts are recorded business
    decisions, and SUCCEEDED/IGNORED/DUPLICATE rows already ran — re-executing either class
    would overturn something the system decided on purpose (#315, ADR-20260803-002712 Q1).


# --- The platform grant and the ADMIN seam binding (#639 part C step 6-v,
# ADR-20260905-223957 §1-§3) -- kernel-homed with the PlatformMembership actor -------------------

PlatformAccessGrantIsIdempotent:
  description: "GrantPlatformAccess on an EXISTING platformMembershipId is an idempotent no-op (no second event) -- a caller retry, or a re-run of the one-shot bootstrap targeting the SAME deterministic id, never mints a duplicate relationship (#639 part C step 6-v, ADR-20260905-223957 §1/§3)."

PlatformAuthSubjectResolvesToOneMembership:
  description: "A GrantPlatformAccess whose authSubject already holds a LIVE PlatformMembership on a DIFFERENT platformMembershipId is rejected before any fact is recorded (PlatformAccessAlreadyGranted) -- the PlatformMember bridge's auth_subject UNIQUE constraint is a BELT the handler consults before appending, since ADMIN is NOT a PrincipalKind and reuses no reservation table (#639 part C step 6-v, ADR-20260905-223957 §1, PRINCIPALS-MEMBER). Round 2, R2-5: the PRIMARY arbiter is now PlatformMembershipIdMustBeDerivedFromAuthSubject below -- this bridge check can only fire on a genuine UUIDv5 collision once that invariant holds."

PlatformMembershipIdMustBeDerivedFromAuthSubject:
  description: "GrantPlatformAccess's platformMembershipId must equal UUIDv5(PLATFORM_MEMBERSHIP_NAMESPACE, authSubject) -- the SAME formula the one-shot bootstrap uses (platform_membership_id_for) -- refused with the typed PlatformMembershipIdMismatch otherwise, BEFORE any store read (#639 part C step 6-v round 2, R2-5, ADR-20260905-223957 §1/§2, young + vernon). Collapses 'one platform membership per subject' into stream identity: two grants for one subject always target the SAME stream, so the fold's own exists-once check is the arbiter."

GrantPlatformAccessIsAHumanAct:
  description: "GrantPlatformAccess is roles: [ADMIN] with requires: acting: { ADMIN: any } and no EXTERNAL key -- every subsequent admin is hand-issued by an existing one, and the FIRST is a recorded act dispatched through the mailbox by the one-shot bootstrap, never a public claim-the-first-admin path (#639 part C step 6-v, ADR-20260905-223957 §3); no process manager may `send` it (validator pm-sends-human-only-command)."

PlatformAccessGrantGatedBeforeStore:
  description: "GrantPlatformAccess refuses with the typed PlatformAccessGrantDoorClosed BEFORE the store is touched while configuration.yaml#/keys/RUN_PLATFORM_ACCESS_GRANT is off, for BOTH the hand-issued GraphQL door and the one-shot bootstrap dispatching the same command (#639 part C step 6-v, ADR-20260905-223957 §5)."
