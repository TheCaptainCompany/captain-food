version: 1
description: >
  Captain.Food anticipated errors. A command handler rejects a request by raising one of these —
  they are the old command `invariants`, now first-class. An error carries CONTEXT (typed data
  identifying the failure) and a default, HUMAN-FRIENDLY MESSAGE in English and French. Which
  errors each command can raise is mapped in actors.yaml (`throws`). Transport/HTTP-level failures
  are out of scope.

  Cross-cutting errors (Unauthorized, Forbidden, ValidationError, Conflict, RateLimited, Internal)
  may occur on ANY command; they are NOT repeated in every actors.yaml `throws` list — only
  domain-specific errors are listed there.

  Convention:
    - key      : PascalCase stable error code (also the wire `code`).
    - context  : typed fields carried with the error ($ref to scalars where applicable); {} if none.
                 Includes ids (for logging/handling) AND human names (for the message) when the
                 offending entity is known. *NotFound errors omit the name (it is unknown).
    - messages : default user-facing text; `en` and `fr` both required. They may contain
                 `{placeholder}` tokens that reference a `context` field name; the server
                 interpolates them (e.g. "The restaurant '{restaurantName}' is not active.").


# =====================================================================
# Cross-cutting (may occur on any command)
# =====================================================================

Unauthorized:
  description: "No valid authentication for this path/role."
  context: {}
  messages:
    en: "You must be signed in to do this."
    fr: "Vous devez être connecté pour effectuer cette action."


Forbidden:
  description: "Authenticated, but not allowed to act on this resource (e.g. not the owner)."
  context: {}
  messages:
    en: "You are not allowed to perform this action."
    fr: "Vous n'êtes pas autorisé à effectuer cette action."


ValidationError:
  description: "Input failed schema validation (type, format, required, bounds)."
  context:
    field: { type: string }
  messages:
    en: "The field '{field}' is invalid."
    fr: "Le champ '{field}' est invalide."


Conflict:
  description: "Concurrent modification (optimistic-concurrency version clash); retry."
  context: {}
  messages:
    en: "This item was modified meanwhile. Please retry."
    fr: "Cet élément a été modifié entre-temps. Veuillez réessayer."


RateLimited:
  description: >
    Too many requests on this path, and the caller may succeed later — a WAIT, not a refusal. Carries
    the server's own remaining backoff so the screen renders a real countdown rather than guessing
    (#516: the SMS-OTP send is the first path to throw it, where a wrong countdown costs a resend and a
    resend costs money). A ceiling with no useful countdown is a DIFFERENT error, not this one with a
    null field.
  context:
    retryAfterSeconds: { $ref: 'scalars.yaml#/RetryAfterSeconds' }
  messages:
    en: "Too many requests. Please wait {retryAfterSeconds}s and try again."
    fr: "Trop de requêtes. Veuillez patienter {retryAfterSeconds}s avant de réessayer."


Internal:
  description: "Unexpected server error."
  context: {}
  messages:
    en: "Something went wrong on our side."
    fr: "Une erreur est survenue de notre côté."


RestaurantNotFound:
  description: "No restaurant with this id."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "Restaurant not found."
    fr: "Restaurant introuvable."


NoEditableFieldProvided:
  description: "Update command carried no editable field."
  context: {}
  messages:
    en: "Provide at least one field to update."
    fr: "Indiquez au moins un champ à modifier."


OfferNotFound:
  description: "No offer with this id in the catalog."
  context:
    offerId: { $ref: 'scalars.yaml#/OfferId' }
  messages:
    en: "Product offer not found."
    fr: "Offere de produit introuvable."


PaymentEventOrphaned:
  description: >
    A Stripe payment outcome (capture or failure) references a PaymentIntent that matches no known
    checkout run. The inbound fact stays recorded on the Payment, but the process manager aborts and
    surfaces this error for ops attention (money may have been taken with no order to materialize) —
    an anomaly is never silently skipped.
  context:
    paymentIntentId: { $ref: 'scalars.yaml#/PaymentIntentId' }
  messages:
    en: "Payment event received for an unknown checkout."
    fr: "Événement de paiement reçu pour un checkout inconnu."


# =====================================================================
# Mailbox supervision (#315)
# =====================================================================

MailboxMessageNotFound:
  description: "No inbound_messages row with this id (e.g. a stale supervision screen after retention swept the row)."
  context:
    targetMessageId: { $ref: 'scalars.yaml#/MessageId' }
  messages:
    en: "Mailbox message not found."
    fr: "Message de boîte aux lettres introuvable."


MailboxMessageNotRequeueable:
  description: >
    The row exists but is not a cap-poisoned FAILED (error code DeliveryInfrastructureError):
    handler REJECTED/FAILED verdicts are recorded business decisions and SUCCEEDED/IGNORED/
    DUPLICATE rows already ran — requeueing any of them would re-execute something the system
    decided on purpose (#315, rules.yaml#/OnlyCapPoisonedMailboxRowsAreRequeueable).
  context:
    targetMessageId: { $ref: 'scalars.yaml#/MessageId' }
    status: { $ref: 'scalars.yaml#/InboundMessageStatus' }
  messages:
    en: "This mailbox message did not fail at the delivery-attempts cap; it cannot be requeued."
    fr: "Ce message n'a pas échoué au plafond de tentatives de livraison ; il ne peut pas être remis en file."

# --- Phone-OTP sign-in vocabulary (promoted from specs/customer/ by #639 part C step 2c-i) --------
# Thrown by TWO doors now -- the customer's RequestPhoneVerification/VerifyPhone and the rider's
# RequestRiderSignInCode/ConfirmRiderSignIn -- so the placement rule derives `common` (an error
# lives with its throwing actor's scope; a multi-scope derivation is the kernel's). Same names,
# same contexts, same en/fr copy: a kind-logical `errors.yaml#/...` ref never noticed the move.

PhoneCountryNotServed:
  description: >
    The phone's dialing code is outside the served set (`SMS_ALLOWED_DIALING_CODES`). NOT a validation
    error and NOT an accusation: it lands on a real person whose number is simply somewhere we do not
    deliver yet, so the message NAMES the country code and points at an exit. The allowlist is the
    served-country decision plus cost containment — a calling code is not a destination, and a code we
    do not serve can reach territories rated far above what we budgeted (the global ceiling, not this
    list, is the economic control against pumping) — which is why the refusal is fail-closed: an
    unparseable number lands here too, never on a send.
  context:
    dialingCode: { $ref: 'scalars.yaml#/DialingCode' }
  messages:
    en: "We can't send a code to {dialingCode} numbers yet — we deliver in Tours. Please use a French mobile number, or contact us."
    fr: "Nous ne pouvons pas encore envoyer de code vers les numéros {dialingCode} — nous livrons à Tours. Utilisez un numéro de mobile français ou contactez-nous."


VerificationSendLimitReached:
  description: >
    This phone number has used up its allowance of OTP sends for the day. Deliberately NOT a
    `RateLimited`: there is no countdown worth rendering (tomorrow is not a countdown), so the screen
    must offer help instead of a timer. A customer who genuinely burned five sends has a delivery
    problem no sixth SMS will fix.
  context: {}
  messages:
    en: "You've requested too many codes today. Please try again tomorrow, or contact us and we'll help you sign in."
    fr: "Vous avez demandé trop de codes aujourd'hui. Réessayez demain ou contactez-nous, nous vous aiderons à vous connecter."


VerificationSendCapacityExhausted:
  description: >
    The GLOBAL daily SMS ceiling is spent, so NO further OTP is sent to anyone until it is raised
    (#516). This is the one refusal that turns legitimate sign-ups away ON PURPOSE: per-number caps
    limit an individual, and an attacker rotates numbers, so only a total ceiling bounds the bill. It
    must be LOUD — if this fires, either the ceiling is too low for real traffic or an attack is under
    way, and both need a human tonight.
  context: {}
  messages:
    en: "We can't send verification codes right now. Please contact us — we'll get you signed in."
    fr: "Nous ne pouvons pas envoyer de code de vérification pour le moment. Contactez-nous, nous vous connecterons."


InvalidVerificationCode:
  description: "The SMS OTP code does not match (rejected by Supabase Auth)."
  context:
    phone: { $ref: 'scalars.yaml#/PhoneNumber' }
  messages:
    en: "The verification code is incorrect. Please try again."
    fr: "Le code de vérification est incorrect. Veuillez réessayer."


VerificationCodeExpired:
  description: "The SMS OTP (or email link) has expired; request a new one."
  context: {}
  messages:
    en: "The verification code has expired. Please request a new one."
    fr: "Le code de vérification a expiré. Veuillez en demander un nouveau."


# Promoted from customer/errors.yaml (#639 part C step 6-ii, ADR-20260905-101349): now thrown by
# BOTH customer's ConfirmEmailVerification and network's ConfirmMemberSignIn -- a cross-scope
# thrower promotes the error to the kernel (`scope-placement-error`).
InvalidVerificationToken:
  description: "The email magic-link token failed server-side verification with Supabase Auth."
  context: {}
  messages:
    en: "This email verification link is invalid or has already been used."
    fr: "Ce lien de vérification d'e-mail est invalide ou a déjà été utilisé."


# Promoted from delivery/errors.yaml (#639 part C step 6-ii): now thrown by BOTH the rider door's
# ConfirmRiderSignIn and network's ConfirmMemberSignIn -- a cross-scope thrower promotes the error
# to the kernel. Wording generalised (it named "rider" before this promotion; ADR-20260818-101500's
# one-stamper-per-role shape is common to both doors).
AuthSubjectHoldsAnotherRole:
  description: >
    The verified login already carries a claim for ANOTHER role (a customer's `customer_id`, a
    restaurant's `restaurant_id`, ...), and the provider replaces the `captain_food` claim object
    wholesale -- stamping this door's role would erase it. Until the `one-subject-one-role` Concern
    of PROP-20260831-180622 is decided, the sign-in is REFUSED rather than overwriting (fail closed).
  context:
    authRef: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "This login is already used for another kind of Captain.Food account and cannot sign in here yet."
    fr: "Cette identité de connexion est déjà utilisée pour un autre type de compte Captain.Food et ne peut pas encore se connecter ici."


# --- The platform grant and the ADMIN seam binding (#639 part C step 6-v,
# ADR-20260905-223957 §1-§3) -- kernel-homed with the `PlatformMembership` actor
# (scalars.yaml's PlatformMembershipId header explains why: `network`'s folder is wholly claimed
# by the `restaurant` bounded context) ---------------------------------------------------------

PlatformAccessGrantDoorClosed:
  description: >
    The platform grant door is closed by `configuration.yaml#/keys/RUN_PLATFORM_ACCESS_GRANT`
    (#639 part C step 6-v, ADR-20260905-223957 §5) -- a declared, supervisable refusal while the
    preconditions (`docs/decisions/ADMIN-DOOR-PRECONDITIONS.yaml`) are open, never a silent no-op.
    Every platform grant, hand-issued or bootstrap-dispatched, is an irreversible act about a real
    Tours human that starts every legal clock -- the store is never touched while this is off.
  context:
    authSubject: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "Granting platform access is not yet enabled in this environment."
    fr: "L'octroi d'accès à la plateforme n'est pas encore activé dans cet environnement."


PlatformAccessAlreadyGranted:
  description: >
    This `authSubject` already holds a LIVE `PlatformMembership` on a DIFFERENT
    `platformMembershipId` (#639 part C step 6-v, ADR-20260905-223957 §1): the `PlatformMember`
    bridge's `auth_subject UNIQUE` is the arbiter, checked by the handler before appending (ADMIN is
    NOT a `PrincipalKind`, PRINCIPALS-MEMBER, so this reuses no reservation table). A resubmission of
    the SAME `platformMembershipId` is a DIFFERENT outcome -- the idempotent no-op the fold already
    grants, never this refusal.
  context:
    authSubject: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "This login already holds platform access under a different membership."
    fr: "Cette identité de connexion dispose déjà d'un accès plateforme sous une autre adhésion."
