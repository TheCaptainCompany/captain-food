version: 3
description: >
  Observability CONTRACTS for critical workflows — a first-class part of the Captain.Food DSL, not an
  afterthought. Each contract declares, for one workflow, the REQUIRED spans, identifiers, attributes,
  metrics, success/error semantics and SLOs that production telemetry must satisfy, so a workflow can be
  asserted to be not only implemented but DIAGNOSABLE. Contracts bind to the domain via `$ref`s into
  actors.yaml / commands.yaml / events.yaml / scalars.yaml, so the codegen proves they never drift from
  the model (a span that claims to publish `OrderPlaced` must reference a real event).

  Implementation rule (see docs/claude/observability.md): OpenTelemetry stays in framework boundaries
  (command bus, event store, publisher, consumers, projections, GraphQL gateway, BAM projector,
  middleware) — NEVER in aggregates or pure domain handlers. The `business.*` attributes below are set
  by those decorators, not scattered through the domain.

  Convention per contract:
    - feature / criticality : workflow identity and importance.
    - workflow              : $ref bindings to the saga/aggregate, command, emitted + inbound events —
                              OR a dispatch `surface` (`graphql`) for a PIPELINE contract that binds a
                              whole dispatch surface instead of a single command/saga/aggregate
                              (mutually exclusive with the $ref bindings; validator §8).
    - run_identity          : ids every run must carry; `correlation_id` and `trace_id` are mandatory
                              (correlation_id is business-facing and survives the whole causality chain;
                              trace_id is technical and may rotate across async boundaries).
    - spans                 : required spans, each with an OTel `kind`
                              (SERVER|CLIENT|INTERNAL|PRODUCER|CONSUMER) and required attributes.
    - metrics/business_metrics : technical vs business signals (kept separate — see BAM).
    - status_rules          : how spans/attributes map to success | technical_error | business_rejected;
                              `success.required_spans` must be a subset of the declared `spans`.
    - latency_budget / error_budget : workflow SLOs.

# =====================================================================
# command-acceptance — the acceptance-first GraphQL dispatch pipeline (ADR-20260720-015500)
# mutation (metadata?) -> sync validate + DURABLE ACCEPTANCE INSERT -> MutationAcceptance echoed
#   -> async handling -> terminal status (SUCCEEDED | REJECTED | FAILED)
#   -> operationStatus/operationStatusChanged.
# ONE acceptance door carries the contract since #242 Runtime D: EVERY command — aggregate- or
# PM-addressed, GraphQL or worker — is accepted as an `inbound_messages` row and the partitioned
# worker delivers and completes it (dispatch_outcome `enqueued`). The `command_journal` door and
# its in-request spawn (dispatch_outcome `spawned`) are retired with the table; the three PM
# commands (placeOrder/approveRefund/denyRefund) no longer pick an arm per request.
# Binds the WHOLE dispatch surface (`surface: graphql`), not one command — every mutation flows
# through it. Per-workflow contracts (place-order, ...) remain the deep-dive complement.
# =====================================================================
command-acceptance:
  feature: command-acceptance
  criticality: high
  workflow:
    surface: graphql   # dispatch-surface binding — no single command/saga/aggregate (validator §8)

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: message_id, source: "command.message_id", required: true }   # inbound_messages pk (ADR-20260720-015300)
    - { name: command_type, source: "command.type", required: true }
    - { name: channel, source: "journal.channel", required: true }   # scalars InboundMessageChannel: GRAPHQL | WORKER | EXTERNAL

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
        - { key: "business.actor", type: string, required: true }
        - { key: "business.channel", type: string, required: true }
    - name: "command.journal"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.message_id", type: string, required: true }
        - { key: "business.journal_status", type: string, required: true }   # RECEIVED | duplicate | conflict (messageId reuse w/ different payload → sync Conflict)
    - name: "command.dispatch"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.message_id", type: string, required: true }
        - { key: "business.dispatch_outcome", type: string, required: true }   # enqueued | duplicate_skipped

  metrics:
    - { name: "commands_accepted_total", type: counter, attributes: ["channel"] }
    - { name: "command_duplicates_total", type: counter, attributes: ["channel"] }   # duplicate: true acceptances — client retry correctness (#17)
    - { name: "command_sync_conflicts_total", type: counter, attributes: ["command_type"] }   # sync Conflict rate: messageId reuse with a different payload (ADR-20260720-015500 §2)
    # Acceptance insert → COMMITTED terminal status; status = SUCCEEDED | REJECTED | FAILED
    # (REJECTED/FAILED split). Emitted by the mailbox delivery's post-commit observer, with the
    # row's received_at as t0 — the single door since #242 Runtime D.
    - { name: "command_completion_ms", type: histogram, attributes: ["status"] }
    # PROP-20260802-223522 D4: a delivery terminally FAILED by the attempts cap is an OPERATOR
    # EVENT — the paid-order failure mode ("who gets told?") made countable. Emitted by the
    # mailbox delivery observer at the poison flip; the row itself carries the error evidence.
    - { name: "mailbox_poison_failed_total", type: counter, attributes: ["actor_type"] }
    # The push listener's health: incremented on every DOWN transition (connection lost, or the
    # liveness canary timed out — the transaction-pooler failure mode where LISTEN goes silently
    # deaf). While down, workers run the pre-push heartbeat cadence; a RISING rate here means the
    # deployment is fighting its pooler, not that deliveries are failing.
    - { name: "mailbox_push_down_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      required_spans: ["command.receive", "command.journal", "command.dispatch"]
      conditions: ["command.journal.business.journal_status != 'conflict'"]   # a duplicate IS a successful acceptance (duplicate: true echoed)
    business_rejected:
      conditions: ["journal terminal status == 'REJECTED'"]   # post-acceptance rejection — surfaces as Operation.errorCode, never a GraphQL error
    technical_error:
      any_span_errors: true

  # Budgets bind the SYNCHRONOUS acceptance path (receive → journal → MutationAcceptance) — the
  # async handler completion is watched via command_completion_ms{status}, not this latency budget.
  latency_budget: { max_p95_ms: 150, max_p99_ms: 400 }
  error_budget: { max_error_rate_pct: 0.5 }

# =====================================================================
# place-order — the V0 checkout saga (highest risk: external Stripe call)
# Cart (OPEN) -> PlaceOrder -> PaymentIntentCreated -> [Stripe] -> PaymentCaptured
#   -> OrderPlaced + CartCheckedOut   (or PaymentFailed -> abort, cart stays OPEN)
#
# Since #242 Runtime D the spans ride ONE topology: the command leg is a PlaceOrderProcess
# mailbox delivery whose PREPARE phase carries
# command.validate/cart.read/pricing.compute/payment.intent.create (no transaction open), the
# fenced commit carries event.store.append, and the capture leg is a chained PM-lane delivery
# (B2), never a saga-runner tick. Correlate by correlation_id across the hops — the
# acceptance-first note below applies doubly: THREE mailbox rows share one correlation.
# =====================================================================
place-order:
  feature: place-order
  criticality: high
  workflow:
    saga: { $ref: 'processmanager.yaml#/PlaceOrderProcess' }
    command: { $ref: 'commands.yaml#/PlaceOrder' }
    emits:
      - { $ref: 'events.yaml#/PaymentIntentCreated' }
      - { $ref: 'events.yaml#/OrderPlaced' }
      - { $ref: 'events.yaml#/CartCheckedOut' }
    inbound:
      - { $ref: 'events.yaml#/PaymentAuthorized' }
      - { $ref: 'events.yaml#/PaymentFailed' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: message_id, source: "command.message_id", required: true }   # inbound_messages pk (ADR-20260720-015300)
    - { name: order_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/OrderId' }, required: true }
    - { name: command_type, source: "command.type", required: true }

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
        - { key: "business.actor", type: string, required: true }
    - name: "command.journal"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.message_id", type: string, required: true }
        - { key: "business.journal_status", type: string, required: true }   # RECEIVED | duplicate
    - name: "command.validate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.validation_status", type: string, required: true }
        # RSO-1 (DECISIONS §43): the service-hours verdict this checkout was evaluated at — the
        # accept branch's signal (shadow mode refuses nothing, so without this attribute the
        # decision is invisible). Value set is the scalar, by $ref — never a hand-copied enum
        # list. A refusal surfaces through the existing `business.validation_status == 'rejected'`
        # classification; deliberately NO new metric/counter here (that is HRS-1's row).
        # `required` flipped in the SAME commit that declared the field on the span constructor +
        # its recorder (crates/telemetry spans.rs/contract.rs) — the tests.rs cross-check demands
        # the wiring exist first, which is why Phase 1 landed it unmarked.
        - { key: "business.service_window_verdict", type: string, required: true, values: { $ref: 'scalars.yaml#/ServiceWindowVerdict' } }
    - name: "cart.read"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.aggregate_id", type: string, required: true }
    - name: "pricing.compute"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.service_fee", type: int, required: true }
        - { key: "business.split_ok", type: string, required: true }
    - name: "payment.intent.create"
      kind: CLIENT
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }
    # NOT required since #588 (ADR-20260816-040239, farley): with
    # `configuration.yaml#/ROUTE_ORDER_BIRTH_THROUGH_LANE` ON the saga no longer appends
    # OrderPlaced — it enqueues onto the Order's lane, and the append happens in a DIFFERENT
    # mailbox delivery with its own trace. Keeping this span REQUIRED for place-order success
    # would mean one of two lies: either the contract fails a saga that did exactly the right
    # thing, or the trace is stitched across deliveries and the 800 ms p95 budget silently starts
    # measuring a shorter workflow while reading green. The append is still instrumented and still
    # required by the contracts that own it; what place-order now owns is the DECISION and the
    # handover, and the handover's own latency is `order_birth_lag_ms` below.
    - name: "event.store.append"
      kind: INTERNAL
      required: false
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }
    # #598: the HANDOVER's ACT, and the other half of the alternation below. With
    # ROUTE_ORDER_BIRTH_THROUGH_LANE ON the saga does not append the birth — it enqueues it onto
    # the Order's own lane INSIDE the same fenced transaction (a degenerate outbox). That enqueue
    # happens in the SAGA's trace, unlike the lane delivery's append, which is a different
    # delivery with a different trace — which is exactly why it, and not the lane-side append, is
    # what `place-order` can require. `required: false` because exactly ONE of the two spans
    # occurs per run; `status_rules.success` is where "one of them MUST" becomes enforceable.
    - name: "order.lane.enqueue"
      kind: PRODUCER
      required: false
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.aggregate_id", type: string, required: true }
    - name: "event.publish"
      kind: PRODUCER
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.event_type", type: string, required: true }
    - name: "event.consume.projection"
      kind: CONSUMER
      required: true
      multiplicity: ">= 1"
      attributes:
        - { key: "business.projection_name", type: string, required: true }

  metrics:
    - { name: "place_order_duration_ms", type: histogram, attributes: ["result"] }
    # DEFECT counter (the customer_claim_stamp_failed_total pattern): a checkout shell that renders
    # WITHOUT a mountable payment element produces ZERO place-order runs — the customer cannot even
    # try — so this contract cannot see the failure by construction. The defect is counted at the
    # render/mount seam instead. `reason` is the canonical bounded set:
    #   stripe_key_absent    — emitted TODAY, server-side at the SSR render boundary (hosts.rs):
    #                          no usable publishable key, the shell ships the degraded state.
    #   stripe_js_load_failed | mount_threw — the client-side legs, DOCUMENTED-FOR-FUTURE: the
    #                          browser degrades honestly but no beacon exists (no OTel in WASM),
    #                          so these values are reserved, not yet emitted.
    # Alert on ANY sustained non-zero rate. Distinct from checkout_payment_failures_total below,
    # the saga's business metric for payments that RAN and failed.
    - { name: "checkout_degraded_render_total", type: counter, attributes: ["reason"] }
    # #588 (ADR-20260816-040239): the HANDOVER latency the routed birth introduces — from the
    # saga's lane enqueue committing to the Order lane's delivery recording OrderPlaced. Nothing
    # measured this before, because before #588 there was no handover: the saga appended inline.
    # It is a technical metric, not a BAM fold: it is a property of the runtime (lane depth,
    # worker liveness, head-of-line blocking on a hot order), not of the business, and it must
    # keep working when Postgres is degraded — exactly the operational/BAM split
    # ADR-20260811-014129 draws. `routed` (true|false) is the gate-then-stabilize label: while
    # ROUTE_ORDER_BIRTH_THROUGH_LANE is OFF nothing is recorded at all, so a flat series here is
    # the honest reading of "the flag is off", and a GROWING p95 after the flip is the first sign
    # the acceptance clock is arming late — a paid order the restaurant learns about a beat later.
    #
    # #598 — the handover carries its OWN budget, and that is the condition on keeping the
    # contract's 800 ms unchanged (see `latency_budget` below). NEITHER number is measured (no
    # distribution exists yet), and they are two DIFFERENT kinds of number — stated separately
    # because "derived" is a provenance claim a reader will not re-check:
    #
    #   p95 1000 ms is a CHOSEN DISCRIMINATION THRESHOLD, not a derivation. It has no declared
    #   antecedent: the lane wake rides the enqueue's own commit (an in-transaction pg_notify with
    #   no declared latency) and the only declared cadences are 10 s and 60 s. A p95 above a
    #   second means the PUSH path is not carrying the handover and the fallback is — that is the
    #   discrimination it is picked to make, and the reason it is round.
    #
    #   p99 12000 ms is substantially DERIVED: one
    #   `configuration.yaml#/MAILBOX_HEARTBEAT_SECONDS` fallback pass (10 s, declared) plus
    #   2000 ms of drain slack for claiming the lease, reading the row and committing — that
    #   slack is an allowance, declared nowhere. Above this bound neither push nor the fallback is
    #   carrying it and the restaurant is learning about a paid order late.
    - name: "order_birth_lag_ms"
      type: histogram
      attributes: ["routed"]
      latency_budget: { max_p95_ms: 1000, max_p99_ms: 12000 }
    # THE ORDER-LANE DEAD-MAN'S SWITCH (#598, ADR-20260810-231300's monitoring carve-out) — two
    # series, deliberately NOT a zero-seeding of `order_birth_lag_ms` above.
    #
    # Why not seed that histogram: injected zeros would poison the p95 the flip is judged on. A
    # liveness signal and a latency measurement are different facts and must not share a series.
    #
    # Emitted by `infrastructure::mailbox::order_lane_watch_tick` — a sampler OUTSIDE the lane it
    # watches — on EVERY tick, for EVERY declared routed-birth lane, INCLUDING while
    # ROUTE_ORDER_BIRTH_THROUGH_LANE is OFF. "Nothing until the flip" would be the wrong shape:
    # silence is the ambiguity these series exist to remove, and a switch first proved on the day
    # of the flip is a switch proved by the flip.
    #
    # ALERT ON THE ABSENCE OF AN INCREMENT, NEVER ON A THRESHOLD: `..._heartbeat_total` is
    # monotonic and must rise every tick — a flat or vanished counter is the watcher, or its
    # process, dead. `..._oldest_pending_age_ms` is the backlog's own alarm (0 = the lane is
    # drained), and is only readable BECAUSE the heartbeat proves the reporter alive.
    - { name: "order_lane_watch_heartbeat_total", type: counter, attributes: ["lane"] }
    - { name: "order_lane_oldest_pending_age_ms", type: gauge, attributes: ["lane"] }
    # DEPLOY-TIME FLEET PARITY (#598, farley): each process re-asserts its RESOLVED value for each
    # declared runtime flag, so "monolith and standalone workers agree" stops being a review-time
    # assertion and becomes evidence. `count(distinct value) by (flag) > 1` is the condition that
    # BLOCKS a flip — and, for ROUTE_ORDER_BIRTH_THROUGH_LANE, the only thing that can see the
    # split-clock hazard (one birth, a coin-flip on the acceptance deadline, per order) while a
    # rolling deploy is in flight. An OBSERVABLE gauge, re-asserted on every export cycle: a
    # value written once at boot says only "this process once started", which is the inverted
    # dead-man's switch `otp_send_guard_enforcing` already paid for.
    #
    # `version` is deliberately NOT a label: `service.version` (the build's short git SHA) is
    # already a RESOURCE attribute on every export, so a label would duplicate it and multiply the
    # series during exactly the rolling deploy this is meant to watch. `bin` stays, because one
    # deploy runs several DIFFERENT binaries and their disagreement is the hazard.
    - { name: "runtime_flag_state", type: gauge, attributes: ["flag", "value", "bin"] }
    # ================================================================================================
    # THE BIRTH-GAP DEAD-MAN'S SWITCH (#608) — "money is held and no order exists", made a signal
    # the system EMITS rather than a fact someone eventually notices.
    #
    # THE QUESTION IT ANSWERS: *is there a customer whose card is authorized right now with no
    # order behind it, and for how long has that been true?* That is the product's worst failure
    # mode (CLAUDE.md domain lens) with the money already moved.
    #
    # WHY IT IS NOT `payment_authorized_unsettled_age_seconds` (payment-settlement): that gauge is
    # computed over the OrderTracking read model, and an order that was NEVER BORN has no
    # OrderTracking row. It is structurally blind to exactly this case. Its header has been
    # corrected; the two gauges are complementary and are emitted by the SAME sweep.
    #
    # THE SOURCE IS THE SAGA'S OWN RUN STATE, NOT AN ANTI-JOIN OF TWO AGGREGATES (vernon,
    # ADR-20260816-213000). The deciding fact: the `payment_process_manager` row is created at
    # CHECKOUT (the PlaceOrder handler opens the run at AWAITING_PAYMENT_RESULT before any Stripe
    # outcome exists), not at PM processing time — the PM legs only `expect` an existing row. So an
    # authorization the saga never processed STILL HAS A RUN ROW, and the population is
    # single-owner, single-write-path, with no cross-aggregate simultaneity to reason about.
    #
    # THREE REASONS, ONE BOUNDED LABEL SET — one gauge, never three:
    #   retry_pending      — the PaymentAuthorized hop is on the PlaceOrderProcess lane and still
    #                        DELIVERABLE (RECEIVED/SCHEDULED) while the run is AWAITING_PAYMENT_RESULT.
    #                        Time may still fix this, so it gets the lane-derived threshold below.
    #   delivery_exhausted — the hop reached a TERMINAL status (FAILED at the attempts cap,
    #                        REJECTED, IGNORED, ...) and the run is STILL AWAITING_PAYMENT_RESULT.
    #                        Nothing will ever redeliver it, so waiting is pointless and the
    #                        threshold is ZERO.
    #   no_run             — a PaymentAuthorized fact in `domain_events` whose intent has NO
    #                        `payment_process_manager` row at all. The residue the run-state source
    #                        cannot cover: `PlaceOrder` performs TWO sequential unfenced durable
    #                        writes (the Stripe intent-create, then the run-row upsert), and a crash
    #                        between them leaves funds held with no run. The webhook leg then finds
    #                        nothing by intent and skips, while the Payment aggregate still records
    #                        PaymentAuthorized — visible ONLY in the log. Threshold ZERO.
    #
    # ZEROS ARE THE CONTRACT. Every member of the label set is emitted on EVERY sweep, 0 included,
    # and `payment_birth_gap_sweep_heartbeat_total` increments after a COMPLETE sweep. An absent
    # series must never be readable as "nothing stranded": that is ADR-20260810-231300's defect
    # class — a monitor that can only fire when a signal ARRIVES goes quiet exactly when it should
    # scream. An early return on an empty population is the specific bug to design against.
    #
    # THE FOLD IS OVER OPENNESS, NEVER AGE (young). Nothing materialises `ageSeconds` or
    # `isOrphaned`: the sweep reads the OPEN set and its stored timestamps and subtracts `now()` at
    # QUERY time. A stored age would be rewritten by rebuild-time `now` — truncate, replay, diff:
    # the open set and its timestamps must come back identical.
    #
    # OPERATIONAL, NOT BAM (ADR-20260811-014129): this is a dead-man's switch on the money path. It
    # must work when the business read models are broken, so it stays on OTLP and is NOT a `bam`
    # fold. It reads Postgres because the durable record IS Postgres; when Postgres is down the
    # series stops, which is itself the alarm.
    #
    # RUNBOOK — the named response, without which an alert is a control that renders and does
    # nothing (business): docs/runbooks/authorized-payment-no-order-birth.md.
    # KNOWN GAP, recorded rather than invented: there is no alert-ROUTE wiring anywhere in this
    # repo, so no human or rota is named by any artifact. Same gap as the
    # `configuration.yaml#/ROUTE_ORDER_BIRTH_THROUGH_LANE` flip's "the rollback trigger has no
    # observer" obligation, which is founder-gated. Naming the route is not this contract's to do.
    - name: "payment_authorized_no_order_birth_age_seconds"
      type: gauge
      attributes: ["reason"]
      # The BOUNDED population of the grouping key, DECLARED (ADR-20260811-014129: a grouping key
      # needs a declared bounded population). This list is a DECLARATION, so the members are bare
      # names; every other reference to them is a `$ref`. The emitter iterates exactly this set,
      # which is what makes "0 for every member, every tick" expressible at all.
      attribute_values:
        reason: [retry_pending, delivery_exhausted, no_run]
      # PAGE ON THE FIRST ONE (business): at V0 the base rate is ~0/day and no rate of "a customer's
      # money is held with nothing behind it" is tolerable, so noise is not an argument against
      # alerting immediately. `retry_pending` is the only member with a non-zero threshold, and it
      # is LANE-DERIVED rather than a wall-clock guess (vernon): the honest bound on a hop that the
      # mailbox may still redeliver is the whole exponential retry schedule.
      thresholds:
        # base * (2^cap - 1) = 10 * (2^5 - 1) = 310 s to terminal, from the DECLARED keys below:
        # `retry_spacing_seconds` is bound to MAILBOX_HEARTBEAT_SECONDS by every composition root,
        # and MAILBOX_MAX_DELIVERY_ATTEMPTS's own `gates` prose spells the same schedule out
        # (10 -> 20 -> 40 -> 80 -> 160, "~5 min to terminal at cap 5"). NOTE the backoff is
        # EXPONENTIAL, not linear: a `cap * base` reading gives 50 s and would page on every
        # healthy retry. 600 s = 310 s plus roughly one schedule of slack for claim/lease/drain.
        - reason: retry_pending
          max_age_seconds: 600
          derived_from:
            - { $ref: 'configuration.yaml#/keys/MAILBOX_MAX_DELIVERY_ATTEMPTS' }
            - { $ref: 'configuration.yaml#/keys/MAILBOX_HEARTBEAT_SECONDS' }
        # No further delivery will ever happen: time cannot help, so any age is already too much.
        - reason: delivery_exhausted
          max_age_seconds: 0
        # Funds held with no run at all: nothing in the system is even trying.
        - reason: no_run
          max_age_seconds: 0
    # The sweep's own LIVENESS (#608). Monotonic, incremented once per COMPLETED sweep — after all
    # three reason series and the payment-settlement gauge have been emitted, never before, so it
    # cannot certify a half-run pass. ALERT ON THE ABSENCE OF AN INCREMENT, never on a threshold:
    # the gauges above are 0 on a healthy system, and 0 is indistinguishable from "the sweep died"
    # without this counter. Same shape and same reason as `order_lane_watch_heartbeat_total`.
    - { name: "payment_birth_gap_sweep_heartbeat_total", type: counter, attributes: [] }
  business_metrics:
    - { name: "orders_placed_total", type: counter, attributes: ["status"] }
    - { name: "checkout_payment_failures_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      # THE ALTERNATION (#598, farley — superseding #588's unconditional removal).
      #
      # #588 dropped `event.store.append` from this list with NO predicate, which loosened the
      # rule in the state we are in TODAY: with the flag still OFF the birth is appended inline,
      # so a checkout whose append never happened scored `success`. *A success rule that passes
      # when the money-path append vanished is a gate that lies.*
      #
      # The fix is NOT a flag predicate — a rule that reads the gate is a second place the flip
      # has to be got right, and it silently returns different verdicts for the same trace. It is
      # an ALTERNATION: the run must show that the birth was made durable by ONE of the two
      # legal means. OFF => `event.store.append`; ON => `order.lane.enqueue`. Same verdict in
      # both flag states, no gate inside the rule, and a run that did NEITHER — the paid order
      # nobody is told about — is no longer a success.
      #
      # KNOWN GAP, stated here rather than discovered from a false verdict (#598 review, F1):
      # the OFF branch is not emitted on EVERY live birth route. The mailbox PM lane
      # (`handler.rs`, live and unconditional since #242) births through `flush_staged_in_tx`,
      # which constructs no span at all — so a birth taken through that route today satisfies
      # NEITHER alternative. `event.publish` below has the identical gap and is still
      # `required: true`, which predates this change. The reason no gate caught it: the
      # emitted-contract test proves a span constructor runs SOMEWHERE in the workspace, never
      # that it runs on THIS workflow's path. Tracked as issue #602; the alternation is correct
      # as written and closing the gap is instrumentation, not a rule change.
      required_spans:
        - "command.receive"
        - "command.journal"
        - "pricing.compute"
        - "payment.intent.create"
        - { any_of: ["event.store.append", "order.lane.enqueue"] }
        - "event.publish"
        - "event.consume.projection"
      # 'authorized' is recorded by the webhook path (payment_intent.amount_capturable_updated ->
      # PaymentAuthorized), never by the create call itself; capture success lives in the
      # payment-settlement contract (ADR-20260808-195315 §1.2).
      conditions: ["payment.intent.create.business.result == 'authorized'"]
    technical_error:
      any_span_errors: true
    business_rejected:
      conditions: ["command.validate.business.validation_status == 'rejected'"]

  # DECIDED UNCHANGED at 800/1500 (#598, option B of the dispatch card; the alternative was to
  # re-baseline onto the routed workflow). The routed birth makes this workflow strictly SHORTER
  # — the append moves to another delivery — so the number now scores less work than it used to.
  # It stays anyway, for one reason and with two conditions.
  #
  # THE REASON: this budget is a CUSTOMER-PERCEIVED checkout ceiling, and the customer's
  # perception did not change. Re-baselining today would invent a percentile from a distribution
  # that does not exist — a guess wearing a number, and an evidence question answered without
  # evidence (ADR-20260808-144738).
  #
  # CONDITION 1 — the removed time is still measured: `order_birth_lag_ms` above carries its own
  # `latency_budget`, so "paid order -> restaurant told" stays covered END TO END rather than
  # falling into the gap between two contracts.
  #
  # CONDITION 2 — THE RE-BASELINE TRIGGER, which is a date and not an intention: the FIRST
  # Fri/Sat 19:00-21:30 service after ROUTE_ORDER_BIRTH_THROUGH_LANE is flipped ON. Peak is the
  # only traffic that produces a distribution worth baselining from. Until then this number reads
  # LOOSE on purpose, and that is a known, recorded cost — not an oversight to be re-derived.
  latency_budget: { max_p95_ms: 800, max_p99_ms: 1500 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# cart-price — READ-side pricing on the checkout hot path (#451, PROP-20260810-231500 Concern)
# cart.current / cart / carts resolve a money-free Cart row -> price_cart (LIVE catalog) ->
#   priced Cart | PriceUnresolvable (fail-closed, the honest no-price state).
# Every /checkout render and every mini-cart runs this seam — at peak (Fri/Sat 19:00-21:30) it
# is the hottest read in the product, and a per-line unresolvable is a SILENT conversion killer
# (screen 3c: the customer sees no payable amount and walks). Binds the graphql read surface
# (like read-authorization): there is no command/saga — the pricer is SDK-free application code
# (`application::pricing::price_cart`); the span lives at the GRAPHQL RESOLVER seam, the
# framework boundary, per the implementation rule above.
# =====================================================================
cart-price:
  feature: cart-price
  criticality: high
  workflow:
    surface: graphql   # read-path binding — no single command/saga/aggregate (validator §8)

  run_identity:
    # Reads carry no command envelope: the correlation id is the request-scoped one minted at the
    # server boundary (same posture as read-authorization).
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # ONE span per priced cart read, at the resolver seam (the pricer itself stays SDK-free).
    # business.aggregate_id = the cartId being priced; correlate a bad render to the checkout
    # attempt that followed via business.correlation_id.
    - name: "cart.price"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.aggregate_id", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }

  metrics:
    # Read-side pricing latency: an in-memory fold over already-loaded offers — if this histogram
    # drifts toward the budget, the per-request memoized catalog read (PROP §8) is the lever, and
    # this metric is what tells us BEFORE it hurts at peak.
    - { name: "cart_price_ms", type: histogram, attributes: [] }
    # DEFECT counter (the checkout_degraded_render_total pattern): a cart whose price cannot be
    # resolved at read renders the honest no-price state — a sale silently lost, never an error
    # the customer reports. `reason` is the canonical bounded set:
    #   offer_gone     — a line's offer (or a selected option) no longer resolves in the live catalog
    #   policy_missing — the fee/comparison policy needed to complete the priced shape is absent
    #   stock_unknown  — the offer resolves but its orderability/stock state cannot be established
    # Alert on ANY sustained non-zero rate.
    - { name: "cart_price_unresolvable_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      required_spans: ["cart.price"]
    # CLASSIFICATION (recorded, deliberate): an unresolvable price at READ is a technical_error,
    # never business_rejected — the customer asked to see their cart and got no price (a defect in
    # what we serve), not a domain rule refusing a request. The write-path twin (PriceUnresolvable
    # rejecting PlaceOrder) stays a rejection under the place-order contract.
    technical_error:
      any_span_errors: true

  # INITIAL budgets — set from the write-path pricing seam's share of place-order, TUNABLE once
  # cart_price_ms carries real traffic; revisit after the first peak (Fri/Sat 19:00-21:30) window.
  latency_budget: { max_p95_ms: 300, max_p99_ms: 600 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# customer-identity — IDENT-1 Phase A (ADR-20260818-004646, #641): the request-seam translation
# from the verified auth SUBJECT (authRef) to the CUSTOMER's domain identity, resolved from
# Postgres via the EXISTING by_auth_ref bridge -- GATED
# (configuration.yaml#/RESOLVE_CUSTOMER_IDENTITY_FROM_POSTGRES), DEFAULT OFF. A step INSIDE
# auth.read_scope's span (read-authorization contract, #144): this one fires only when the gate is
# ON and the caller is on the CUSTOMER path -- claim mode (the default) never opens it, and the
# claim is UNREAD in this path (no per-request fallback; the ADR forbids a runtime
# try-Postgres-else-claim). NoMapping and LookupFailed BOTH fail closed to Public identically at
# the API boundary, but they are DISTINGUISHABLE here because they have OPPOSITE operator
# responses: a missing mapping row is an ordinary provisioning gap (OBSERVE), a failed lookup means
# the identity seam itself is unavailable (PAGE).
# =====================================================================
customer-identity:
  feature: customer-identity
  criticality: high
  workflow:
    surface: graphql   # read-path binding, request seam -- no single command/saga/aggregate (validator §8)

  run_identity:
    # Reads carry no command envelope: the SAME request-scoped id auth.read_scope stamps (#144).
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # ONE per Postgres-mode CUSTOMER resolution -- never emitted in claim mode (the DEFAULT), and
    # never for a non-CUSTOMER role (Phase A's whole scope, ADR-20260818-004646: the other three
    # roles have no sign-in operation in the DSL, STAFF-AUTH, DECISIONS §46). `business.result` is
    # the seam's typed three-way outcome; `business.failure_reason` is set only when it is
    # `lookup_failed` (the coarse DomainError class, never the query text or driver message --
    # unbounded cardinality on a labeled series).
    - name: "customer.identity.resolve"
      kind: INTERNAL
      required: false   # only present in Postgres mode -- claim mode (the DEFAULT) never opens it
      attributes:
        - { key: "business.result", type: string, required: true }   # resolved | not_found | lookup_failed
        - { key: "business.correlation_id", type: string, required: true }
        - { key: "business.failure_reason", type: string, required: false }

  metrics:
    - { name: "customer_identity_resolve_ms", type: histogram, attributes: ["result"] }
    # OBSERVE: an ordinary provisioning gap (no mapping row yet for this subject) -- fails closed
    # to Public, the same population read_authorization_bridge_unresolved_total watches on the
    # role-path side, but scoped to THIS seam so it is never conflated with the general bridge
    # counter or misread as an outage.
    - { name: "customer_identity_not_found_total", type: counter, attributes: [] }
    # PAGE: the seam itself could not be asked -- the opposite operator response from not_found (a
    # stale-but-working index vs a broken/unreachable read path). `reason` is the coarse DomainError
    # class.
    - { name: "customer_identity_lookup_failed_total", type: counter, attributes: ["reason"] }
    # So request-scoped reuse (the mitigation: resolve once per request/WS connection_init, share
    # across resolvers of that request -- vernon+holub+dba convergence) can never hide an outage:
    # `db` is one real Postgres round trip, `request_reuse` is the same request's ALREADY resolved
    # value handed to a second reader with no further I/O. Phase A's two call sites each resolve
    # read scope exactly once per request, so `request_reuse` is declared for the shape a later
    # resolver reusing this seam's result would need -- not yet reachable from this change alone.
    - { name: "customer_identity_lookup_source_total", type: counter, attributes: ["source"] }

  status_rules:
    success:
      required_spans: []   # the span is OPTIONAL (claim mode never opens it) -- gated by configuration, not by this contract
    technical_error:
      any_span_errors: true

  # The lookup rides the EXISTING `Customer.auth_ref` index (dba) -- one indexed lookup, same
  # discipline as read-authorization's membership check: if it drifts, something started scanning.
  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }

# =====================================================================
# rider-identity -- #639 part C step 2b, the rider sign-in door (PROP-20260831-180622 build-order
# row 2; ADR-20260818-004646, ADR-20260830-234532): the request-seam translation from the verified
# auth SUBJECT to the RIDER's domain identity, resolved from OUR Postgres -- the `Rider` read model's
# `auth_ref` bridge, one btree probe on its UNIQUE constraint -- on EVERY request and WS connect.
# UNGATED, by design, and that is the one way it differs from customer-identity: no rider token has
# ever carried a domain binding (the sole claim stamper hardcodes CUSTOMER), so an OFF state would
# preserve nothing -- "no rider can sign in" is the feature's absence, not a gate. The JWT is
# UNREAD for this decision structurally: `Identity::Rider` holds the subject and nothing else, and
# `ProductClaims` parses no rider field. NoMapping and LookupFailed BOTH fail closed to Public
# identically at the API boundary and are DISTINGUISHABLE here for the customer seam's reason:
# a missing row is OBSERVE (a provisioning gap, a projector not yet caught up -- rebuild by
# checkpoint reset, never TRUNCATE -- or a registration the reservation refused), a failed lookup
# is PAGE (the seam itself is unavailable). Its OWN metric names rather than a `role` label on the
# customer seam's: a paging rule keyed on `customer_identity_lookup_failed_total` must not go
# quiet while riders fail on a seam it does not watch.
# =====================================================================
rider-identity:
  feature: rider-identity
  criticality: high
  workflow:
    surface: graphql   # read-path binding, request seam -- no single command/saga/aggregate (validator §8)

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # ONE per RIDER-path resolution, INSIDE auth.read_scope's span. Never emitted for any other
    # role. `business.result` is the seam's typed three-way outcome; `business.failure_reason` is
    # set only when it is `lookup_failed` (the coarse DomainError class, never the driver message).
    - name: "rider.identity.resolve"
      kind: INTERNAL
      required: false   # only a RIDER-path caller opens it; every other role's request never does
      attributes:
        - { key: "business.result", type: string, required: true }   # resolved | not_found | lookup_failed
        - { key: "business.correlation_id", type: string, required: true }
        - { key: "business.failure_reason", type: string, required: false }
        # #639 part C step 4-i (ADR-20260904-081527 §9): the standing the seam read, on
        # result=resolved ONLY — an attribute on the wide event, never a label on the histogram, so
        # "why was THIS rider denied at 19:40" is answerable per request. NO `business.ground`
        # anywhere on OTLP (§3) — the ground is attribution for counsel and the notice, never here.
        - { key: "business.standing", type: string, required: false }

  metrics:
    - { name: "rider_identity_resolve_ms", type: histogram, attributes: ["result"] }
    # OBSERVE: no `rider` row for this subject -- fails closed to Public.
    - { name: "rider_identity_not_found_total", type: counter, attributes: [] }
    # PAGE: the seam could not be asked. `reason` is the coarse DomainError class.
    - { name: "rider_identity_lookup_failed_total", type: counter, attributes: ["reason"] }
    # `db` is one real Postgres round trip; `request_reuse` is declared for the same reason as on
    # customer-identity (an in-request reuse must never hide an outage) and is not reachable yet.
    - { name: "rider_identity_lookup_source_total", type: counter, attributes: ["source"] }
    # The rider CLAIM STAMP (#639 part C step 2c-i, `identity.stamp_rider_claim`): a DEFECT counter,
    # the customer_claim_stamp_failed_total pattern under THIS contract's own name -- never ordinary
    # user error, each one a rider whose verified sign-in issued no credential. `reason` is bounded:
    # not_configured | claim_conflict | provider_error (`claim_conflict` is the one-subject-one-role
    # refusal, PROP-20260831-180622 Concern -- fail closed, never an overwrite).
    - { name: "rider_claim_stamp_failed_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      required_spans: []   # the span is opened only on the RIDER path
    technical_error:
      any_span_errors: true

  # One probe on `rider.auth_ref`'s UNIQUE index -- the customer seam's budget, and for the same
  # reason: if it drifts, something started scanning.
  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }

# =====================================================================
# rider-restriction -- #639 part C step 4-i (ADR-20260904-081527 §9): the standing GUARD at the
# gateway boundary, the first guard-level emitter (today a plain FORBIDDEN emits nothing) -- and the
# projection lag gauge, because while the Rider projector lags a restricted rider is still GRANTED
# and "immediately" is a measured claim only with this gauge. An already-open WS subscription NEVER
# fires the DENIAL counter -- standing resolves once at connection_init; step 5 (ADR-20260905-065415)
# closes that gap for the RIDER socket specifically -- a connection-local standing cell the guard
# reads first, and the socket is TERMINATED (4403) the moment a RESTRICTED fact lands, behind
# RUN_RIDER_RESTRICTION_SOCKET_CLOSE (default off, ships dark). The new metrics below are that
# closure's own contract, additive to this file's existing section.
# =====================================================================
rider-restriction:
  feature: rider-restriction
  criticality: high
  workflow:
    surface: graphql   # StandingGuard runs at the gateway boundary — no single command/saga/aggregate
    # Round 3 item 4 (graphql, dba, young, reviewer, obs): `Rider.standing` (the `"Rider"`
    # checkpoint) and `RiderRestriction` (its OWN checkpoint, round 2 item 7) advance
    # INDEPENDENTLY, so `myStanding` can legitimately answer `standing: RESTRICTED` with
    # `restriction: null` for the one tick between them — not a bug, a client-visible transient
    # ("ground pending"), never rendered as an error.

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  # Round 2 item 6(a) (observability-agent, dba, farley): as landed in round 1 this declared a span
  # the runtime never constructed — only a bare `tracing::info!` EVENT (`crates/server/src/graphql/
  # acl.rs`, `StandingGuard::check`), no matching constructor in `crates/telemetry/src/spans.rs` —
  # so the attributes below were never actually emitted, and `status_rules.technical_error.
  # any_span_errors` (removed below) was unreachable by construction (the same shape
  # `obs-technical-error-unreachable` already catches elsewhere in this file). FIXED AT THE ROOT
  # rather than reworded away (`crates/telemetry/src/spans.rs::rider_standing_denied`): the span is
  # real now, opened on every carved-out-tested RIDER denial, and `rider_id` rides beside it as a
  # nested INFO event (the #748 skip-trace pattern — deliberately off the span's own structured
  # attributes and off the counter, so a rider identity never becomes a metric cardinality axis;
  # joinable to both by `correlation_id`, visible under the deployed `LOG_LEVEL=info` default).
  spans:
    - name: "rider.standing.denied"
      kind: INTERNAL
      required: false   # only a carve-out-tested RIDER denial opens it
      attributes:
        - { key: "business.operation", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }

  metrics:
    # #882 round-2 item 3 (#639 part C step 4-ii): the CLIENT bounce leg (`crate::bounce`
    # redirecting a refused read/Tell to the `restricted` screen, `crates/web/src/router.rs`
    # `restricted_route`) is RESERVED, not yet emitted — no OTel in `web` (WASM), the same
    # `sdui_degraded_render_total` convention as the `client_resolver_failed` /
    # `client_condition_unparseable` legs above. When a beacon exists it joins the refused
    # request by `correlation_id` and the event name is `rider.restricted.bounced` — step 5's
    # problem (the document-GET bounce this same file already defers there), documented not
    # fixed.
    # `operation` bounded by the closed `api-operation-key` set; NO `rider_id` label (the span
    # above, and its nested event, carry it — joinable by correlation_id).
    - { name: "rider_restricted_denied_total", type: counter, attributes: ["operation"] }
    # The `scope_membership_lag_positions` mirror, for the Rider projector group. Round 2 item 6(b)
    # (dba, farley): reworded to what `drain_group` actually records — "0 when caught up" was FALSE
    # as written (`drain_group` returns on a short page and the idle gate never re-records, so an
    # idle platform exports the pre-drain page length until the log next moves). True shape: the
    # pending page length at each scan — a lower bound capped at `batch_size` while draining,
    # RE-RECORDED only when the log moves, and 0 on every empty scan (each tick after the log
    # moved). This is `drain_group`'s own shared, pre-existing behaviour (mirrored by
    # `scope_membership_lag_positions` and `read_authorization::lag_positions` too) — not fixed
    # here (architect-owned issue).
    - { name: "rider_standing_lag_positions", type: gauge, attributes: [] }
    # #639 part C step 4-iii-B (ADR-20260904-152807 §8): THE RIDER-CUSTODY DEAD-MAN'S SWITCH — "how
    # long has a RESTRICTED rider still held food?" (a restriction revokes future job offers; it
    # never releases food already in the rider's hands). Age in seconds of the OLDEST stranded row
    # — a job in ASSIGNED | PICKED_UP | OUT_FOR_DELIVERY (the same held set `held_by_rider(s)` uses,
    # `crates/infrastructure/src/persistence/delivery.rs`) whose rider is RESTRICTED, joined through
    # `RiderRestriction` (the read model, never the internal `Rider` row) ON `rider_id` — literally
    # `rider_restriction.standing = 'RESTRICTED'`, never `effective_at IS NOT NULL` (a
    # `RiderReinstated` LEAVES `effective_at` populated as history, so that predicate would page
    # forever after every reinstatement — dba, pre-code read). Anchored on `now - effective_at`: a
    # job accepted after `effective_at` overstates the age, the safe direction. Emitted EVERY sweep,
    # 0 when the population is empty (the ADR-20260810-231300 defect class again: a monitor that
    # fires only when a signal ARRIVES goes quiet exactly when it should scream). NO `rider_id`
    # label (cardinality and a person's identity on OTLP) — the rider and job ids ride an INFO
    # event `rider.restricted.holding_job` instead (`rider_id`, `delivery_job_id`, `age_seconds`),
    # joined by aggregate ids — no `correlation_id` on a timer tick, a recorded divergence from the
    # #748 shape.
    # LIVENESS PROOF: `delivery_handback_sweep_heartbeat_total` (the `custody-handback` contract,
    # below) — emitted from the SAME `delivery_handback_watch_tick`, after this gauge and before
    # the heartbeat, so the heartbeat now certifies both gauges' sweep completed.
    # SEVERITY: PAGE-class (prose — the observability grammar has no `severity:` field: contract
    # keys are exactly feature/criticality/workflow/run_identity/spans/metrics/business_metrics/
    # status_rules/latency_budget/error_budget, and an unknown key is silently ignored by the
    # validator). ALERT ROUTE: the recorded known gap — naming one is not this contract's to do
    # (`docs/decisions/RIDER-RESTRICTION-PRECONDITIONS.yaml`).
    - name: "rider_restricted_holding_job_age_seconds"
      type: gauge
      attributes: []
      thresholds:
        # UNVERIFIED input (ADR-20260817-105845): no antecedent justifies 1800 specifically — see
        # the key's own `gates:` prose in `specs/delivery/configuration.yaml`. `derived_from` names
        # the antecedent so the number here must actually equal the key's declared default (the
        # #870 300-vs-900 lesson, generalised by the codegen test below).
        - max_age_seconds: 1800
          derived_from:
            - { $ref: 'configuration.yaml#/keys/RIDER_RESTRICTED_CUSTODY_MAX_AGE_SECONDS' }

    # #639 part C step 5 (ADR-20260905-065415 §8), behind RUN_RIDER_RESTRICTION_SOCKET_CLOSE.
    # `outcome` bounded: closed (the 4403 close was pushed, whether triggered by the live fact
    # match or by a Lagged/Closed re-derivation that confirmed RESTRICTED) | no_open_socket
    # (declared, RESERVED — a cross-process "this rider had no live watcher anywhere" fact needs
    # the BUS-1/#385 cross-process bus this slice does not carry; unreachable while the EventBus is
    # in-process) | missed (declared, RESERVED — round 2 R2-4: the signal for a Lagged/Closed
    # re-derivation that could not complete after bounded retry is the DEDICATED
    # `rider_restriction_socket_close_missed_total{reason}` counter below, never double-counted
    # here too; same RESERVED treatment as `no_open_socket` just above). NO `rider_id` label on
    # this counter, and none on the nested INFO event below either — see its own note.
    - { name: "rider_restriction_socket_close_total", type: counter, attributes: ["outcome"] }
    # t0 = the EventBus publish instant (`EventBus::subscribe_with_publish_instant`), never
    # `occurred_at` (cross-host skew post-#358) — the time from the fact landing on this process's
    # bus to the Close frame being pushed into the transport sink. No attributes: a distribution
    # metric, not a per-outcome one. Recorded ONLY when the close was triggered by the live fact
    # match — a Lagged/Closed re-derivation has no bus-publish instant to measure from (the fact
    # that caused it may be arbitrarily old by the time the gap is noticed), so that `closed`
    # sample carries no latency observation.
    - { name: "rider_restriction_socket_close_latency_ms", type: histogram, attributes: [] }
    # `reason` bounded: lookup_failed (the read-model Ask errored after bounded retry) | not_found
    # (round 2 R2-0/R2-6: the identity seam answered NoMapping — the row this connection's grant
    # came from is gone; NEVER an infrastructure error, so it stays a DISTINCT reason from
    # lookup_failed rather than folded into ACTIVE uncounted) — declared with an attribute for the
    # same reason `rider_claim_stamp_failed_total` is, so a further reason never needs a second
    # counter.
    - { name: "rider_restriction_socket_close_missed_total", type: counter, attributes: ["reason"] }
    # THE WATCHER'S OWN LIVENESS PROOF (the `otp_send_guard_enforcing` inverted dead-man precedent):
    # 1 while at least one rider-restriction watcher task is alive in this process, 0 the instant
    # none is — re-asserted on every export cycle (an ObservableGauge, never a synchronous one), so
    # "zero closes" and "the watcher never spawns" stay distinguishable. A second instance existing
    # at all is BUS-1's (the EventBus is in-process, ADR §7); this gauge is what would notice one
    # going silent.
    - { name: "rider_restriction_socket_watch_live", type: gauge, attributes: [] }
    # NESTED INFO EVENT (prose — this grammar has no `events:` key, the `rider.restricted.
    # holding_job` precedent above): `rider.restricted.socket_terminated`, emitted at the same
    # point as the `closed` outcome above, carrying the FACT's correlation_id (the RiderRestricted
    # command's) and the CONNECTION's (`request.correlation_id`) — two distinct ids, both joinable,
    # never merged into one. Round 2 R2-9 correction: NO `rider_id` on this event either — ADR §8's
    # own shape names exactly the two correlation ids, nothing else; an earlier draft of this note
    # implied the event carries `rider_id` in the counter's place, which the landed emission never
    # does and which the counter's own no-cardinality reasoning would have contradicted anyway.

  status_rules:
    success:
      required_spans: []   # opened only on a denial

  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }

# =====================================================================
# refund — the compensation saga (Stripe refund driven by RefundProcess)
# OrderRejected/Cancelled* or RefundRequested -> [Stripe refund] -> PaymentRefunded (recorded)
# =====================================================================
refund:
  feature: refund
  criticality: high
  workflow:
    saga: { $ref: 'processmanager.yaml#/RefundProcess' }
    inbound:
      - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
      - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      - { $ref: 'events.yaml#/RefundRequested' }
      - { $ref: 'events.yaml#/PaymentRefunded' }

  run_identity:
    - { name: correlation_id, source: "event.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: order_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/OrderId' }, required: true }

  spans:
    - name: "event.consume.trigger"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }
    - name: "refund.request"
      kind: CLIENT
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "refund_duration_ms", type: histogram, attributes: ["result"] }
  business_metrics:
    - { name: "refunds_settled_total", type: counter, attributes: ["trigger"] }
    - { name: "saga_compensation_total", type: counter, attributes: ["workflow"] }

  status_rules:
    success:
      required_spans: ["refund.request", "event.store.append"]
      conditions: ["refund.request.business.result == 'refunded'"]
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 1000, max_p99_ms: 3000 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# payment-settlement — capture on fulfilment / release on abort (ADR-20260808-195315 §1.2/§1.3)
# OrderDelivered -> payment.capture (money moves; inbound PaymentCaptured settles);
# rejection/cancellation -> payment.release (hold voided; inbound PaymentReleased settles).
# THE alarm of this workflow: `payment_capture_failed_total` — a capture that fails after
# fulfilment means the food is cooked and the money did not move, the inverse of the
# paid-order-nobody-told-about class. It PAGES (any increment is actionable): the recorded
# PaymentCaptureFailed fact carries the typed reason, the counter is the dead-man-visible tap.
# `payment_release_failed_total` is a warn-level counter, not a page: a failed void self-heals —
# the authorization expires on its own within ~7 days and Stripe reports PaymentReleased.
#
# THE DEAD-MAN'S-SWITCH (ADR-20260810-231300, monitoring carve-out): `payment_capture_failed_total`
# only fires on a failed capture ATTEMPT. The worse, SILENT failure is a NEVER-attempt — an order
# whose OrderDelivered never arrives (courier app dies, the saga runner wedges, the mailbox stalls)
# sits AUTHORIZED until the hold auto-releases at ~7 days: money never captured, and nothing pages,
# because no attempt was ever made. Silence is ambiguous — a threshold that can only fire when a
# signal ARRIVES goes quiet exactly when it should scream. `payment_authorized_unsettled_age_seconds`
# is the liveness proof: the AGE of the OLDEST order still `payment_status = AUTHORIZED`, computed by
# a timer-driven reconciling sweep over the OrderTracking read model (the "sleep until the next due
# row" time-triggered pattern — NOT a fixed-interval poll of a push path). It PAGES above a threshold
# set well under the 7-day expiry and above the delivery-SLA + webhook-lag envelope (~2h).
#
# WHAT IT DOES **NOT** COVER (#608 — this header previously claimed coverage it does not have).
# The gauge is computed over the OrderTracking read model, so its population is orders that WERE
# BORN and were never captured. An authorization whose order was **never born** has no
# OrderTracking row and is structurally invisible here — and that is the case where the money is
# held with nothing at all behind it. That population has its own contract and its own gauge,
# `place-order` / `payment_authorized_no_order_birth_age_seconds{reason}`, sourced from the
# PlaceOrderProcess run state plus the log residue. The two are complementary and are emitted by
# the SAME sweep (`infrastructure::mailbox::birth_gap_watch_tick`, #608) — this gauge had ZERO
# emit sites in `crates/**` until then, and a declared-but-silent contract is the failure the
# `obs-metric-no-emitter` validator rule now ratchets against.
# =====================================================================
payment-settlement:
  feature: payment-settlement
  criticality: high
  workflow:
    saga: { $ref: 'processmanager.yaml#/PaymentSettlementProcess' }
    inbound:
      - { $ref: 'events.yaml#/OrderDelivered' }
      - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
      - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
      - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }

  run_identity:
    - { name: correlation_id, source: "event.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: order_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/OrderId' }, required: true }

  spans:
    - name: "event.consume.trigger"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }
    - name: "payment.capture"
      kind: CLIENT
      required: false   # the release arms never open it; required on the OrderDelivered arm's happy path
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }
    - name: "payment.release"
      kind: CLIENT
      required: false
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }

  metrics:
    # PAGES (food cooked, money did not move; label = CaptureFailureReason). ALERT ROUTING BY REASON
    # CLASS (tracked follow-up — the split is an alert-rule change, not a code one): terminal reasons
    # (CARD_DECLINED / AUTHORIZATION_EXPIRED / GATEWAY_REFUSED) page immediately; GATEWAY_UNAVAILABLE
    # is transient (capture MAY have settled provider-side, superseded by the webhook) and should page
    # only after retries are exhausted — keying the page off the idempotent recorded PaymentCaptureFailed
    # fact, not the per-attempt increment, so a retried transient does not cry wolf on the one page
    # that must be believed.
    - { name: "payment_capture_failed_total", type: counter, attributes: ["reason"] }
    # Warn-level: a failed void self-heals via the ~7-day authorization expiry.
    - { name: "payment_release_failed_total", type: counter, attributes: ["reason"] }
    # DEAD-MAN'S-SWITCH (see header): the age of the oldest OrderTracking row still
    # `payment_status = AUTHORIZED`, from its immutable `placed_at`. PAGES above the
    # delivery-SLA + webhook-lag envelope and well under the ~7-day hold expiry — catches the
    # never-attempted CAPTURE that the counter above cannot. Emitted since #608 by
    # `infrastructure::mailbox::birth_gap_watch_tick`, the same sweep that carries the birth-gap
    # gauge; it covers born-but-never-captured ONLY, never the never-born case (see header).
    - { name: "payment_authorized_unsettled_age_seconds", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: ["event.consume.trigger"]
      conditions: ["payment_capture_failed_total did not increment for this correlation_id"]
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 1000, max_p99_ms: 3000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# customer-identification — phone-OTP sign-in wrapping Supabase Auth (ADR-0015)
# RequestPhoneVerification (send SMS) -> VerifyPhone (verify OTP synchronously) -> CustomerRegistered
#   (new) | CustomerIdentified (returning). The Supabase call is synchronous, through the supabase-acl.
# =====================================================================
customer-identification:
  feature: customer-identification
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/Customer' }
    command: { $ref: 'commands.yaml#/VerifyPhone' }
    emits:
      - { $ref: 'events.yaml#/CustomerRegistered' }
      - { $ref: 'events.yaml#/CustomerIdentified' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: customer_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/CustomerId' }, required: true }

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
    - name: "otp.verify"
      kind: CLIENT
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }
    # The claim stamp (identity.stamp_customer_claim, #437): after the OTP verifies and the
    # customer resolves, the provider-side auth user is stamped with app_metadata.captain_food
    # ({ role, customer_id }, nested by #519) so the session the customer keeps CARRIES the domain
    # claim. `failed` here means verification stood but no session was rotated or parked
    # (fail-closed on the credential).
    - name: "claims.stamp"
      kind: CLIENT
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.result", type: string, required: true }   # stamped | failed
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
    - name: "event.publish"
      kind: PRODUCER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "customer_identification_duration_ms", type: histogram, attributes: ["result"] }
    # DEFECT counter (the read_authorization_bridge_unresolved_total pattern): a stamp failure is
    # a credential/provisioning/provider defect — never ordinary user error — and each one is a
    # customer whose login silently stayed anonymous. Alert on ANY sustained non-zero rate.
    - { name: "customer_claim_stamp_failed_total", type: counter, attributes: ["reason"] }
    # ---- The OTP SEND leg (#516): the money half of identity, and it had no instrumentation at all.
    #
    # OTLP-ONLY, deliberately, and not a BAM fold: an OTP send emits NO domain event (actors.yaml
    # `emits: []`), so there is nothing for a projection to fold — a business metric cannot see this
    # path, and the one thing we must never do is start writing a `domain_events` row per refused
    # send, since that is a log an anonymous attacker gets to drive.
    #
    # `dialing_code` is bounded (SMS_ALLOWED_DIALING_CODES plus 'other' for everything refused), so it
    # is a legal label. THE PHONE NUMBER IS NEVER A LABEL — high cardinality belongs on the span, and
    # only hashed; a metric series per phone number is both a cost incident and personal data in a
    # place with no retention story.
    #
    # ALARM SHAPE, and the trap: never alert on a static send rate. Friday 19:00-21:30 looks exactly
    # like an attack by volume. Alert on the RATIO of sends to verifications (an attack moves only the
    # numerator, because nobody verifies the codes) plus burn of the daily ceiling
    # (SMS_MAX_SENDS_PER_DAY_GLOBAL). Joining a send to its later verification cannot use
    # correlation_id -- it BREAKS across the provider's SMS-hook hop, because Supabase calls us back on
    # a fresh request -- so the join is the hashed phone plus a time window.
    - { name: "otp_send_requested_total", type: counter, attributes: ["dialing_code", "allowed"] }
    # DEFECT-ADJACENT counter, and the one with the INVERTED dead-man's-switch problem: zero refusals
    # reads identically to "the limiter is switched off". `reason` is bounded: country_not_served |
    # unparseable | cooldown | hourly_cap | daily_cap | global_ceiling | store_unavailable.
    # `reason=global_ceiling` is the loud one — it means real sign-ups are being turned away.
    #
    # `region` (#696) is the fix OWED in ADR-20260813-021500 (#535): dropping bare `+1` from the
    # served allowlist made the North American refusal cohort unmeasurable, because
    # `otp_send_requested_total`'s `dialing_code` label is bounded to what we SERVE and every
    # refused, unserved code collapses into `other` there. `region` is a SEPARATE, hand-declared
    # 3-value business segmentation over the code the refusal was decided against — never ITU or
    # geographic data — so an attacker rotating dialing codes cannot mint a fourth label however
    # many distinct codes they try (the same attacker-cardinality property `dialing_code` already
    # has, extended to refusals). `north_america` and `non_eu_europe` name only codes NOT already
    # served (a served code, e.g. `+41`, keeps its per-code detail on `dialing_code` above and
    # falls through to `rest_of_world` here — this attribute exists to bucket what we do NOT
    # serve). THE PHONE NUMBER IS STILL NEVER A LABEL: `region` carries the dialing code's BUCKET,
    # never the code or the number itself.
    - name: "otp_send_refused_total"
      type: counter
      attributes: ["reason", "region"]
      # The bounded populations of both grouping keys, DECLARED (ADR-20260811-014129: a grouping
      # key needs a declared bounded population). `region`'s mapping table (which dialing codes
      # fall into which bucket) is declared once, in Rust, next to the function it bounds
      # (`crates/telemetry/src/meters.rs` `otp_send::region_label` — NORTH_AMERICA/NON_EU_EUROPE
      # dialing-code tables) rather than duplicated here as a second copy that could drift.
      attribute_values:
        reason:
          [country_not_served, unparseable, cooldown, hourly_cap, daily_cap, global_ceiling, store_unavailable]
        region: [north_america, non_eu_europe, rest_of_world]
    # THE MONEY SEAM: emitted at the OVH sender itself, on the hook path, where a send becomes a euro.
    # `result` is bounded: sent | failed | refused. The gap between otp_send_requested_total{allowed=true}
    # and sms_send_total is the provider hop, and a persistent gap means we are being asked to send
    # messages nobody requested through our own front door.
    - { name: "sms_send_total", type: counter, attributes: ["result"] }
    # GUARD LIVENESS (the inverted dead-man's switch, ADR-20260810-231300): 1 while the guard is
    # enforcing with a shared counter, 0 when it is degraded. Without this, "no refusals tonight" and
    # "the limiter has been disabled since the last deploy" are the same observation.
    - { name: "otp_send_guard_enforcing", type: gauge, attributes: [] }
    # NOT YET IMPLEMENTED — tracked by #699, DECLARED here so the gap is a recorded fact rather
    # than a silent one (CLAUDE.md: "reporting replaces the freeze"). OWED in ADR-20260813-021500
    # as the SECOND item (ranked by the business lens ABOVE the refusal-cohort hole #696 itself
    # closes): the OVH prepaid SMS pack drains SILENTLY — OVH pushes nothing — and the first
    # symptom would be every OTP send failing, on the ONLY V0 sign-in path. This is monitoring's
    # PERMANENT-POLL carve-out (ADR-20260810-231300): the observer is outside what it observes and
    # has no durable record of its own to reconcile a missed push against, so a poll here is the
    # intended, permanent shape, not a degraded fallback earning its way back to push. Follows the
    # `checkout_degraded_render_total` DOCUMENTED-FOR-FUTURE precedent (line ~237 above): the name
    # is declared and reserved, nothing emits it today. `make validate`'s `obs-metric-no-emitter`
    # ratchet (tools/codegen-rs/src/validate/metric_emitters.rs) is deliberately left to flag this
    # ONE new warning rather than silently widening its own baseline for an unbuilt gauge — #699
    # closes it by building the OVH balance poll and the instrument together, never by declaring
    # the name alone.
    - { name: "ovh_sms_credit_balance", type: gauge, attributes: [] }
  business_metrics:
    - { name: "customer_signins_total", type: counter, attributes: ["outcome"] }
    - { name: "otp_verifications_failed_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      required_spans: ["command.receive", "otp.verify", "claims.stamp", "event.store.append", "event.publish"]
      conditions: ["otp.verify.business.result == 'verified'", "claims.stamp.business.result == 'stamped'"]
    business_rejected:
      conditions: ["otp.verify.business.result == 'invalid_code'"]
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 600, max_p99_ms: 1200 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# prospection — B2B outreach to NON_PARTNER listings (ADR-0020)
# The prospection-acl worker reads the COMPUTED score from ProspectionPipeline, applies the
# schedule + anti-spam, fires HubSpot/Resend/Slack, then issues RecordProspectContact to record the fact.
# The score is a read-model projection — never an input or an emitted event.
# =====================================================================
prospection:
  feature: prospection
  criticality: medium
  workflow:
    aggregate: { $ref: 'actors.yaml#/Prospect' }
    command: { $ref: 'commands.yaml#/RecordProspectContact' }
    emits:
      - { $ref: 'events.yaml#/ProspectContacted' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: restaurant_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/RestaurantId' }, required: true }

  spans:
    - name: "pipeline.read"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.score", type: int, required: true }
    - name: "outreach.dispatch"
      kind: CLIENT
      required: true
      attributes:
        - { key: "messaging.system", type: string, required: true }
        - { key: "business.channel", type: string, required: true }
        - { key: "business.sequence_step", type: int, required: true }
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
    - name: "event.publish"
      kind: PRODUCER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "prospect_contact_duration_ms", type: histogram, attributes: ["channel"] }
  business_metrics:
    - { name: "prospect_contacts_sent_total", type: counter, attributes: ["channel", "sequence_step"] }
    - { name: "prospects_converted_total", type: counter, attributes: ["source"] }
    - { name: "prospects_cold_total", type: counter, attributes: ["reason"] }

  status_rules:
    success:
      required_spans: ["pipeline.read", "outreach.dispatch", "event.store.append", "event.publish"]
    business_rejected:
      conditions: ["command.receive.business.command_type == 'RecordProspectContact' && error.type == 'ProspectContactLimitReached'"]
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 2000, max_p99_ms: 5000 }
  error_budget: { max_error_rate_pct: 5.0 }

# =====================================================================
# stripe-webhook-ingestion — inbound event sourcing at the Stripe seam (ADR-20260720-015400)
# webhook -> verify signature -> external_stripe_events UPSERT -> ACL translate
#   -> inbound_events (RECEIVED) -> drain -> Repository append (Payment stream) -> DELIVERED
# =====================================================================
stripe-webhook-ingestion:
  feature: stripe-webhook-ingestion
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/Payment' }
    inbound:
      - { $ref: 'events.yaml#/PaymentAuthorized' }
      - { $ref: 'events.yaml#/PaymentCaptured' }
      - { $ref: 'events.yaml#/PaymentReleased' }
      - { $ref: 'events.yaml#/PaymentFailed' }
      - { $ref: 'events.yaml#/PaymentRefunded' }

  run_identity:
    - { name: correlation_id, source: "inbound.correlation_id", required: true }   # UUIDv5(stripe event id)
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: inbound_event_id, source: "inbound.inbound_event_id", required: true }   # inbound_events pk → domain_events.cause_id
    - { name: external_event_id, source: "stripe.event_id", required: true }

  spans:
    - name: "webhook.verify"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.source", type: string, required: true }          # 'stripe'
        - { key: "business.signature_status", type: string, required: true } # verified | rejected
    - name: "external.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.external_event_id", type: string, required: true }
        - { key: "business.dedupe", type: string, required: true }           # new | duplicate
    - name: "acl.translate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
    - name: "inbound.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
    - name: "inbound.drain.deliver"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
        - { key: "business.delivery_outcome", type: string, required: true } # recorded | already_recorded | failed
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    - { name: "stripe_webhook_ingest_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "inbound_drain_lag_ms", type: histogram, attributes: ["source"] }
  business_metrics:
    - { name: "inbound_events_staged_total", type: counter, attributes: ["source", "event_type"] }
    - { name: "inbound_events_delivered_total", type: counter, attributes: ["source", "outcome"] }
    - { name: "webhook_duplicates_total", type: counter, attributes: ["source"] }

  status_rules:
    success:
      required_spans: ["webhook.verify", "external.persist", "acl.translate", "inbound.persist", "inbound.drain.deliver", "event.store.append"]
      conditions: ["inbound.drain.deliver.business.delivery_outcome != 'failed'"]
    technical_error:
      any_span_errors: true
    business_rejected:
      conditions: ["webhook.verify.business.signature_status == 'rejected'"]

  latency_budget: { max_p95_ms: 1000, max_p99_ms: 3000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# avelo37-webhook-ingestion — inbound event sourcing at the delivery-partner seam
# (ADR-20260720-015400 follow-up, issue #28)
# webhook -> verify signature -> external_avelo37_events UPSERT -> ACL translate
#   -> inbound_events (RECEIVED) -> drain -> Repository append (DeliveryJob stream) -> DELIVERED
# =====================================================================
avelo37-webhook-ingestion:
  feature: avelo37-webhook-ingestion
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/DeliveryJob' }
    inbound:
      - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
      - { $ref: 'events.yaml#/DeliveryRejectedByPartner' }
      - { $ref: 'events.yaml#/DeliveryStatusUpdated' }

  run_identity:
    - { name: correlation_id, source: "inbound.correlation_id", required: true }   # UUIDv5(avelo37 event id)
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: inbound_event_id, source: "inbound.inbound_event_id", required: true }   # inbound_events pk → domain_events.cause_id
    - { name: external_event_id, source: "avelo37.event_id", required: true }

  spans:
    - name: "webhook.verify"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.source", type: string, required: true }          # 'avelo37'
        - { key: "business.signature_status", type: string, required: true } # verified | rejected
    - name: "external.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.external_event_id", type: string, required: true }
        - { key: "business.dedupe", type: string, required: true }           # new | duplicate
    - name: "acl.translate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
    - name: "inbound.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
    - name: "inbound.drain.deliver"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
        - { key: "business.delivery_outcome", type: string, required: true } # recorded | already_recorded | failed
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    - { name: "avelo37_webhook_ingest_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "inbound_drain_lag_ms", type: histogram, attributes: ["source"] }

# =====================================================================
# coopcycle-webhook-ingestion — inbound event sourcing at the CoopCycle
# federation seam (issue #58, ADR-20260721-122910). Same two-layer inbox
# as avelo37-webhook-ingestion; the FEDERATION dimension adds business.instance_id
# (which self-hosted co-op instance the verified webhook came from).
# webhook -> verify signature (per-instance secret) -> external_coopcycle_events UPSERT
#   -> ACL translate -> inbound_events (RECEIVED) -> drain -> Repository append (DeliveryJob stream)
# =====================================================================
coopcycle-webhook-ingestion:
  feature: coopcycle-webhook-ingestion
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/DeliveryJob' }
    inbound:
      - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
      - { $ref: 'events.yaml#/DeliveryRejectedByPartner' }
      - { $ref: 'events.yaml#/DeliveryStatusUpdated' }

  run_identity:
    - { name: correlation_id, source: "inbound.correlation_id", required: true }   # UUIDv5("{instance_id}:{coopcycle event id}")
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: inbound_event_id, source: "inbound.inbound_event_id", required: true }   # inbound_events pk → domain_events.cause_id
    - { name: external_event_id, source: "coopcycle.event_id", required: true }
    - { name: instance_id, source: "coopcycle.instance_id", required: true }   # the federation dimension — originating co-op instance

  spans:
    - name: "webhook.verify"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.source", type: string, required: true }          # 'coopcycle'
        - { key: "business.instance_id", type: string, required: true }      # originating co-op instance (federation)
        - { key: "business.signature_status", type: string, required: true } # verified | rejected
    - name: "external.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.external_event_id", type: string, required: true }
        - { key: "business.instance_id", type: string, required: true }
        - { key: "business.dedupe", type: string, required: true }           # new | duplicate
    - name: "acl.translate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
    - name: "inbound.persist"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
    - name: "inbound.drain.deliver"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.inbound_event_id", type: string, required: true }
        - { key: "business.delivery_outcome", type: string, required: true } # recorded | already_recorded | failed
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    - { name: "coopcycle_webhook_ingest_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "inbound_drain_lag_ms", type: histogram, attributes: ["source"] }
  business_metrics:
    - { name: "inbound_events_staged_total", type: counter, attributes: ["source", "event_type"] }
    - { name: "inbound_events_delivered_total", type: counter, attributes: ["source", "outcome"] }
    - { name: "webhook_duplicates_total", type: counter, attributes: ["source"] }

  status_rules:
    success:
      required_spans: ["webhook.verify", "external.persist", "acl.translate", "inbound.persist", "inbound.drain.deliver", "event.store.append"]
      conditions: ["inbound.drain.deliver.business.delivery_outcome != 'failed'"]
    technical_error:
      any_span_errors: true
    business_rejected:
      conditions: ["webhook.verify.business.signature_status == 'rejected'"]

  latency_budget: { max_p95_ms: 1000, max_p99_ms: 3000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# uber_direct-webhook-ingestion — inbound event sourcing at the Uber
# Direct delivery seam (issue #57, ADR-20260721-172500). Same two-layer
# inbox as avelo37-webhook-ingestion; Uber Direct is ONE central API (no
# federation instance dimension) and signs with a plain X-Uber-Signature
# raw-body HMAC (no timestamp).
# webhook -> verify signature -> external_uber_direct_events UPSERT
#   -> ACL translate -> inbound_events (RECEIVED) -> drain -> Repository append (DeliveryJob stream)
# =====================================================================
uber_direct-webhook-ingestion:
  feature: uber_direct-webhook-ingestion
