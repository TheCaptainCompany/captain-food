  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# delivery-dispatch-strategy — the resolve→walk dispatch saga (#60)
# OrderMarkedReady (DELIVERY) -> resolve strategy (restaurant mode / city ranking)
#   -> RESTAURANT: SELF_DISPATCHED (Captain tracks only)
#   -> CAPTAIN: offer the rank-1 channel, then advance on decline/timeout/escalate to the
#      next ranked channel, else fail closed (DeliveryDispatchFailed).
# =====================================================================
delivery-dispatch-strategy:
  feature: delivery-dispatch-strategy
  criticality: high
  workflow:
    saga: { $ref: 'processmanager.yaml#/DeliveryDispatchProcess' }
    emits:
      - { $ref: 'events.yaml#/DeliveryRequested' }
      - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
    inbound:
      - { $ref: 'events.yaml#/OrderMarkedReady' }
      - { $ref: 'events.yaml#/DeliveryRejectedByPartner' }
      - { $ref: 'events.yaml#/DeliveryEscalationRequested' }
      - { $ref: 'events.yaml#/DeliveryOfferTimedOut' }

  run_identity:
    - { name: correlation_id, source: "event.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: order_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/OrderId' }, required: true }
    - { name: delivery_job_id, source: "domain.delivery_job_id", businessKey: { $ref: 'scalars.yaml#/DeliveryJobId' }, required: true }

  spans:
    - name: "event.consume.trigger"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }   # OrderMarkedReady | DeliveryRejectedByPartner | DeliveryOfferTimedOut | DeliveryEscalationRequested
    - name: "dispatch.resolve_strategy"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.dispatch_mode", type: string, required: true }   # CAPTAIN | RESTAURANT (RestaurantDispatchConfig)
        - { key: "business.city_id", type: string, required: false }         # absent on a SELF_DISPATCHED short-circuit
    - name: "dispatch.select_channel"
      kind: INTERNAL
      required: false   # skipped on a RESTAURANT (SELF_DISPATCHED) run — no channel is selected
      attributes:
        - { key: "business.channel", type: string, required: true }         # the DeliveryChannelCatalog key offered
        - { key: "business.rank", type: int, required: true }                # 1-based position in the city's ranked walk
        - { key: "business.channels_remaining", type: string, required: true } # true | false (fail-closed when false)
    - name: "delivery.offer_job"
      kind: CLIENT
      required: false   # skipped when the run self-dispatches or the walk is already exhausted
      attributes:
        - { key: "business.channel", type: string, required: true }
        - { key: "business.result", type: string, required: true }          # offered | self_dispatched | exhausted
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    - { name: "delivery_dispatch_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "delivery_offer_timeout_ms", type: histogram, attributes: ["channel"] }
  business_metrics:
    - { name: "delivery_offers_total", type: counter, attributes: ["channel", "rank", "trigger"] }
    - { name: "delivery_dispatch_failed_total", type: counter, attributes: ["city_id"] }
    - { name: "delivery_self_dispatched_total", type: counter, attributes: ["restaurant_id"] }

  status_rules:
    success:
      required_spans: ["event.consume.trigger", "dispatch.resolve_strategy", "event.store.append"]
      conditions: ["delivery.offer_job.business.result != 'exhausted'"]
    technical_error:
      any_span_errors: true
    business_rejected:
      conditions: ["delivery.offer_job.business.result == 'exhausted'"]

  latency_budget: { max_p95_ms: 800, max_p99_ms: 2000 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# reclamation-sla — the claim first-response SLA (epic #151, slice #160)
# OpenReclamation -> ReclamationOpened (OPEN, the first-response clock starts) -> the staff decide it:
#   ResolveReclamation -> ReclamationResolved | RejectReclamation -> ReclamationReoccured... (REJECTED)
# "First response" for V0 = the claim being DECIDED (resolved/rejected). There is NO domain clock
# (time is event-envelope occurred_at, #154); `overdue` is a READ-TIME computation in the query repo
# (status OPEN AND opened_at older than RECLAMATION_FIRST_RESPONSE_TARGET_HOURS) surfaced on the
# staff claims queue — hence the reclamations_overdue_total BAM signal, not a domain event.
# The contract binds the decision command (ResolveReclamation) on the Reclamation aggregate; the
# spans cover the decide path (open is the birth fact whose occurred_at anchors the clock).
# =====================================================================
reclamation-sla:
  feature: reclamation-sla
  criticality: medium
  workflow:
    aggregate: { $ref: 'actors.yaml#/Reclamation' }
    command: { $ref: 'commands.yaml#/ResolveReclamation' }
    emits:
      - { $ref: 'events.yaml#/ReclamationOpened' }
      - { $ref: 'events.yaml#/ReclamationResolved' }
      - { $ref: 'events.yaml#/ReclamationRejected' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: reclamation_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/ReclamationId' }, required: true }
    - { name: command_type, source: "command.type", required: true }

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }   # ResolveReclamation | RejectReclamation
        - { key: "business.actor", type: string, required: true }
    - name: "command.validate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.validation_status", type: string, required: true }   # accepted | rejected (ReclamationNotOpen / ReclamationNotFound)
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }   # ReclamationResolved | ReclamationRejected
        - { key: "business.stream_id", type: string, required: true }
    - name: "event.publish"
      kind: PRODUCER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "reclamation_decision_duration_ms", type: histogram, attributes: ["outcome"] }   # opened_at -> decided (first-response latency)
  business_metrics:
    - { name: "reclamations_decided_total", type: counter, attributes: ["outcome"] }   # outcome = resolved | rejected
    - { name: "reclamations_overdue_total", type: counter, attributes: ["restaurant_id"] }   # SLA breach signal — the read-time overdue count surfaced to the staff queue (#160)

  status_rules:
    success:
      required_spans: ["command.receive", "command.validate", "event.store.append", "event.publish"]
      conditions: ["command.validate.business.validation_status == 'accepted'"]
    business_rejected:
      conditions: ["command.validate.business.validation_status == 'rejected'"]   # decided a non-OPEN / unknown claim
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 600, max_p99_ms: 1500 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# sirene-sync — the open-data registry ingestion (ADR-0045, converted to inbound events by
# ADR-20260728-011344). CI ingest -> external_sirene_restaurants (payload_hash gates re-pending)
#   -> ACL stages RestaurantRegistered -> inbound_events (RECEIVED)
#   -> drain -> Restaurant aggregate DECIDES -> record | update | nothing
#   -> DELIVERED | IGNORED | DUPLICATE
#
# Why this workflow needs a contract at all, despite being a background job with no customer waiting:
# it writes to the event store on a loop with nobody watching, and its previous failure mode was
# SILENT. A swallowed constraint violation looked identical to a successful registration, so a sweep
# that did nothing 200,000 times reported the same number as one that registered 200,000 restaurants —
# and the first notification of the resulting damage was an email from the database vendor. The
# business metrics below exist to make "did this sweep do anything, and was it what we meant?"
# answerable without reading logs.
# =====================================================================
sirene-sync:
  feature: sirene-sync
  criticality: medium   # no customer is waiting; but silent divergence of the prospection base is costly
  workflow:
    aggregate: { $ref: 'actors.yaml#/Restaurant' }
    inbound:
      - { $ref: 'events.yaml#/RestaurantRegistered' }

  run_identity:
    - { name: correlation_id, source: "inbound.correlation_id", required: true }   # UUIDv5(siret:payload_hash)
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: inbound_event_id, source: "inbound.inbound_event_id", required: true }   # -> domain_events.cause_id
    - { name: external_id, source: "sirene.siret_and_hash", required: true }   # {siret}:{payload_hash} — stable across sweeps

  spans:
    - name: "registry.stage"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.source", type: string, required: true }        # 'sirene'
        - { key: "business.staged", type: bool, required: true }          # false = already in the inbox
    - name: "inbound.drain"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }    # RestaurantRegistered
        # The whole point of the conversion: the AGGREGATE's verdict, not the adapter's guess.
        - { key: "business.decision", type: string, required: true }      # recorded | updated | no_change | duplicate
    - name: "event.store.append"
      kind: INTERNAL
      required: false   # deliberately optional: a no_change decision appends NOTHING, and that is success
      attributes:
        - { key: "business.event_type", type: string, required: true }    # RestaurantRegistered | RestaurantUpdated

  metrics:
    - { name: "sirene_sweep_duration_ms", type: histogram, attributes: ["phase"] }   # phase = ingest | drain
  business_metrics:
    # The four numbers that answer "what did this sweep DO?" — the split that did not exist before.
    - { name: "sirene_records_created_total", type: counter, attributes: ["department"] }
    - { name: "sirene_records_updated_total", type: counter, attributes: ["department"] }
    - { name: "sirene_records_ignored_total", type: counter, attributes: ["department"] }   # steady state: nearly the whole mirror
    - { name: "sirene_records_failed_total", type: counter, attributes: ["reason"] }
    # A version conflict is never "nothing" — it is either a bulk-replay pathology or genuine
    # contention on a hot aggregate. Counted, never swallowed (ADR-20260728-011344).
    - { name: "event_store_version_conflicts_total", type: counter, attributes: ["stream_category"] }

  status_rules:
    success:
      required_spans: ["registry.stage", "inbound.drain"]
      conditions: ["inbound.drain.business.decision != 'failed'"]
    technical_error:
      any_span_errors: true

  # A sweep is a background loop, not a request: the budget bounds one record's translation, not the
  # whole France pass (which is INSEE-API-paced, see issue #218).
  latency_budget: { max_p95_ms: 500, max_p99_ms: 2000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# read-authorization — the per-instance read guard (#144, PROP-20260725-185140)
# verified Principal -> ReadScope (claim resolution, once per request) -> ScopeMembership -> allow | deny
# Binds the WHOLE read surface (`surface: graphql`), like command-acceptance binds the write surface:
# every guarded read and every by-id object fetch flows through the same question.
# =====================================================================
read-authorization:
  feature: read-authorization
  criticality: high
  workflow:
    surface: graphql   # dispatch-surface binding — not one command/saga/aggregate (validator §8)

  run_identity:
    # Reads carry no command envelope, so the correlation id is MINTED at the server boundary when
    # the ReadScope is resolved (one per request) — not copied from a command that does not exist.
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # The claims bridge: Principal -> domain-id ReadScope, a PURE function of the token's verified
    # claims since #433 (CARD-11 — no per-request lookup, no DB). ONE per request, not one per
    # check — N appearances for a single request is a STRUCTURAL regression (scope resolved more
    # than once), the one-per-request sentinel this span exists to keep.
    - name: "auth.read_scope"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.role", type: string, required: true }
        - { key: "business.bridge_resolved", type: string, required: true }   # true | false — false ⇒ the request degrades to Public, i.e. denied
    # The discrete membership check (a by-id read or the subscription guard). The LIST path enforces
    # via an EXISTS predicate fused into the SQL — there is no per-row decision to record, so this
    # span (and a denial) is STRUCTURALLY unemittable for lists: out-of-scope rows simply never
    # return. denied_total therefore only ever fires on by-id/subscription paths — do not "fix" the
    # missing list denials.
    - name: "auth.scope_membership"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.scope_type", type: string, required: true }        # ORDER | RESTAURANT
        - { key: "business.role", type: string, required: true }
        - { key: "business.authorized", type: string, required: true }        # true | false

  metrics:
    # The load-bearing signal. A DENIAL is ordinary (a stale link, a signed-out tab); a SPIKE in
    # denials is id enumeration, not user error — that distinction is the whole reason this contract
    # exists. Alert on the rate of change, never on the absolute count. by-id/subscription paths only
    # (see the span note: list denials are structurally invisible).
    - { name: "read_authorization_denied_total", type: counter, attributes: ["scope_type", "role"] }
    - { name: "read_authorization_checks_total", type: counter, attributes: ["scope_type", "role"] }
    # bridge_resolved=false means an authenticated caller's token carries no domain binding — a
    # missing (or malformed, or pre-refresh stale) captain_* claim, NEVER a DB outage: resolution
    # has no I/O since #433. It denies (safe), but it is a provisioning gap or staleness — never
    # ordinary user denial — and must not sit inside the denial count where it would look like noise.
    - { name: "read_authorization_bridge_unresolved_total", type: counter, attributes: ["role"] }
    - { name: "read_authorization_check_ms", type: histogram, attributes: ["scope_type"] }

  business_metrics:
    # Projection lag on the ACL index is not a normal read-model lag: while it lags, a just-placed
    # order's own customer is DENIED their order (and a rider's just-accepted job can vanish from
    # their board). Watched separately from generic projection lag precisely because its
    # user-visible symptom is a denial rather than stale data.
    - { name: "scope_membership_lag_positions", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: ["auth.read_scope", "auth.scope_membership"]
      conditions: ["auth.scope_membership.business.authorized == 'true'"]
    business_rejected:
      conditions: ["auth.scope_membership.business.authorized == 'false'"]   # a denial is an ORDINARY outcome, never a technical error
    technical_error:
      any_span_errors: true

  # The guard is one primary-key lookup by construction (a derived membership_id), so the budget is
  # deliberately tight: if it drifts, something has started joining or scanning.
  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }
