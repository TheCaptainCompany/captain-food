    business_rejected:
      conditions: ["webhook.verify.business.signature_status == 'rejected'"]

  latency_budget: { max_p95_ms: 1000, max_p99_ms: 3000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# delivery-dispatch-strategy — the resolve→walk dispatch saga (#60)
# OrderMarkedReady (DELIVERY) -> resolve strategy (restaurant mode / city ranking)
#   -> RESTAURANT: SELF_DISPATCHED (Captain tracks only)
#   -> CAPTAIN: offer the rank-1 channel, then advance on decline/timeout/escalate to the
#      next ranked channel, else fail closed (DeliveryDispatchFailed).
# =====================================================================
delivery-dispatch-strategy:
  feature: delivery-dispatch-strategy
  criticality: high
  workflow:
    saga: { $ref: 'processmanager.yaml#/DeliveryDispatchProcess' }
    emits:
      - { $ref: 'events.yaml#/DeliveryRequested' }
      - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
    inbound:
      - { $ref: 'events.yaml#/OrderMarkedReady' }
      - { $ref: 'events.yaml#/DeliveryRejectedByPartner' }
      - { $ref: 'events.yaml#/DeliveryEscalationRequested' }
      - { $ref: 'events.yaml#/DeliveryOfferTimedOut' }

  run_identity:
    - { name: correlation_id, source: "event.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: order_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/OrderId' }, required: true }
    - { name: delivery_job_id, source: "domain.delivery_job_id", businessKey: { $ref: 'scalars.yaml#/DeliveryJobId' }, required: true }

  spans:
    - name: "event.consume.trigger"
      kind: CONSUMER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }   # OrderMarkedReady | DeliveryRejectedByPartner | DeliveryOfferTimedOut | DeliveryEscalationRequested
    - name: "dispatch.resolve_strategy"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.dispatch_mode", type: string, required: true }   # CAPTAIN | RESTAURANT (RestaurantDispatchConfig)
        - { key: "business.city_id", type: string, required: false }         # absent on a SELF_DISPATCHED short-circuit
    - name: "dispatch.select_channel"
      kind: INTERNAL
      required: false   # skipped on a RESTAURANT (SELF_DISPATCHED) run — no channel is selected
      attributes:
        - { key: "business.channel", type: string, required: true }         # the DeliveryChannelCatalog key offered
        - { key: "business.rank", type: int, required: true }                # 1-based position in the city's ranked walk
        - { key: "business.channels_remaining", type: string, required: true } # true | false (fail-closed when false)
    - name: "delivery.offer_job"
      kind: CLIENT
      required: false   # skipped when the run self-dispatches or the walk is already exhausted
      attributes:
        - { key: "business.channel", type: string, required: true }
        - { key: "business.result", type: string, required: true }          # offered | self_dispatched | exhausted
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    - { name: "delivery_dispatch_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "delivery_offer_timeout_ms", type: histogram, attributes: ["channel"] }
  business_metrics:
    - { name: "delivery_offers_total", type: counter, attributes: ["channel", "rank", "trigger"] }
    - { name: "delivery_dispatch_failed_total", type: counter, attributes: ["city_id"] }
    - { name: "delivery_self_dispatched_total", type: counter, attributes: ["restaurant_id"] }

  status_rules:
    success:
      required_spans: ["event.consume.trigger", "dispatch.resolve_strategy", "event.store.append"]
      conditions: ["delivery.offer_job.business.result != 'exhausted'"]
    technical_error:
      any_span_errors: true
    business_rejected:
      conditions: ["delivery.offer_job.business.result == 'exhausted'"]

  latency_budget: { max_p95_ms: 800, max_p99_ms: 2000 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# custody-handback — the dead-man's switch on a handed-back job (#639 part C step 3-ii,
# ADR-20260904-015903 §8). Mirrors the #608 shape (`payment_authorized_no_order_birth_age_seconds`
# in `place-order`'s metrics, above): the re-offer is DeliveryDispatchProcess's job and the PM step
# is fenced (issue #860, `deferred:`), so until it lands a handed-back job is PENDING/FAILED with
# nothing automatically re-offering it — a counter that fires on the handback and goes quiet during
# the stranding is the ADR-20260810-231300 defect class (a monitor that can only fire when a signal
# ARRIVES goes quiet exactly when it should scream). THE QUESTION IT ANSWERS: is there a customer
# whose food a rider handed back, with no later acceptance or cancellation resolving it, and for how
# long has that been true? ZEROS ARE THE CONTRACT: the gauge is 0 EVERY sweep when nothing is stranded, and the
# heartbeat increments only after a COMPLETE sweep — an absent series must never read as "nothing
# stranded". Emitted by a NON-FENCED timer worker beside `delivery_offer_timeout_worker.rs`
# (`delivery_handback_watch.rs`), never inside the fenced mailbox handler. KNOWN GAP, repeated
# verbatim from the #608 contract: there is no alert-ROUTE wiring anywhere in this repo, so no human
# or rota is named by any artifact — naming the route is not this contract's to do.
# =====================================================================
custody-handback:
  feature: custody-handback
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/DeliveryJob' }
    command: { $ref: 'commands.yaml#/HandBackDelivery' }
    emits:
      - { $ref: 'events.yaml#/DeliveryHandedBackByRider' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: delivery_job_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/DeliveryJobId' }, required: true }
    - { name: command_type, source: "command.type", required: true }

  # The existing command middleware spans (no new instrumentation surface) — same three as
  # reclamation-sla. Review round 2 on #870: `business.food_location` was claimed HERE as a
  # `command.validate` attribute the middleware stamps from the command payload, but the ONLY emit
  # site for this workflow's spans is the fenced `inbox.rs` handler — no middleware anywhere stamps
  # per-command payload fields onto `command.validate`, and the fact already lives on the event
  # itself (`DeliveryHandedBackByRider.foodLocation`) and on `View_DeliveryJob.food_location` — so
  # the attribute is removed rather than left `required: true` and unrecorded.
  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
        - { key: "business.actor", type: string, required: true }
    - name: "command.validate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.validation_status", type: string, required: true }   # accepted | rejected (InvalidDeliveryStatus / DeliveryAlreadyAssigned / DeliveryJobNotFound)
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    # Age of the OLDEST job whose latest lifecycle fact is a handback with no later acceptance or
    # cancellation (DeliveryAcceptedByRider/DeliveryAcceptedByPartner) — the re-offer that never
    # came. A FAILED WITH_RIDER job and an acknowledged PENDING one both keep ageing here until an
    # acceptance lands or the job is cancelled — a handback alone never clears this gauge. Emitted
    # EVERY sweep, 0 included, by the non-fenced `delivery_handback_watch.rs` worker.
    - name: "delivery_handed_back_unreassigned_age_seconds"
      type: gauge
      attributes: []
      thresholds:
        # The offer TTL, review round 2 on #870: this WAS 300, mismatched against the referenced
        # key's own declared default (900, `specs/delivery/configuration.yaml`) and against the
        # worker's own doc comment (also 900) — `derived_from` names the antecedent, so the number
        # here must actually equal it.
        - max_age_seconds: 900
          derived_from:
            - { $ref: 'configuration.yaml#/keys/DELIVERY_OFFER_MAX_TTL_SECONDS' }
    # The sweep's own LIVENESS — incremented once per COMPLETED sweep, never before. Same shape and
    # same reason as `payment_birth_gap_sweep_heartbeat_total` / `order_lane_watch_heartbeat_total`.
    # Since #639 part C step 4-iii-B this heartbeat certifies TWO gauges' sweep completed, not one:
    # the handback gauge above AND `rider-restriction`'s `rider_restricted_holding_job_age_seconds`
    # — both are emitted from the same `delivery_handback_watch_tick`, before this counter, so a
    # responder reading only this contract is not misled about what the heartbeat covers.
    - { name: "delivery_handback_sweep_heartbeat_total", type: counter, attributes: [] }

  status_rules:
    success:
      required_spans: ["command.receive", "command.validate", "event.store.append"]
      conditions: ["command.validate.business.validation_status == 'accepted'"]
    business_rejected:
      conditions: ["command.validate.business.validation_status == 'rejected'"]
    technical_error:
      any_span_errors: true

# =====================================================================
# reclamation-sla — the claim first-response SLA (epic #151, slice #160)
# OpenReclamation -> ReclamationOpened (OPEN, the first-response clock starts) -> the staff decide it:
#   ResolveReclamation -> ReclamationResolved | RejectReclamation -> ReclamationReoccured... (REJECTED)
# "First response" for V0 = the claim being DECIDED (resolved/rejected). There is NO domain clock
# (time is event-envelope occurred_at, #154); `overdue` is a READ-TIME computation in the query repo
# (status OPEN AND opened_at older than RECLAMATION_FIRST_RESPONSE_TARGET_HOURS) surfaced on the
# staff claims queue — hence the reclamations_overdue_total BAM signal, not a domain event.
# The contract binds the decision command (ResolveReclamation) on the Reclamation aggregate; the
# spans cover the decide path (open is the birth fact whose occurred_at anchors the clock).
# =====================================================================
reclamation-sla:
  feature: reclamation-sla
  criticality: medium
  workflow:
    aggregate: { $ref: 'actors.yaml#/Reclamation' }
    command: { $ref: 'commands.yaml#/ResolveReclamation' }
    emits:
      - { $ref: 'events.yaml#/ReclamationOpened' }
      - { $ref: 'events.yaml#/ReclamationResolved' }
      - { $ref: 'events.yaml#/ReclamationRejected' }

  run_identity:
    - { name: correlation_id, source: "command.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: reclamation_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/ReclamationId' }, required: true }
    - { name: command_type, source: "command.type", required: true }

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }   # ResolveReclamation | RejectReclamation
        - { key: "business.actor", type: string, required: true }
    - name: "command.validate"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.validation_status", type: string, required: true }   # accepted | rejected (ReclamationNotOpen / ReclamationNotFound)
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }   # ReclamationResolved | ReclamationRejected
        - { key: "business.stream_id", type: string, required: true }
    - name: "event.publish"
      kind: PRODUCER
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "reclamation_decision_duration_ms", type: histogram, attributes: ["outcome"] }   # opened_at -> decided (first-response latency)
  business_metrics:
    - { name: "reclamations_decided_total", type: counter, attributes: ["outcome"] }   # outcome = resolved | rejected
    - { name: "reclamations_overdue_total", type: counter, attributes: ["restaurant_id"] }   # SLA breach signal — the read-time overdue count surfaced to the staff queue (#160)

  status_rules:
    success:
      required_spans: ["command.receive", "command.validate", "event.store.append", "event.publish"]
      conditions: ["command.validate.business.validation_status == 'accepted'"]
    business_rejected:
      conditions: ["command.validate.business.validation_status == 'rejected'"]   # decided a non-OPEN / unknown claim
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 600, max_p99_ms: 1500 }
  error_budget: { max_error_rate_pct: 2.0 }

# =====================================================================
# sirene-sync — the open-data registry ingestion (ADR-0045, converted to inbound events by
# ADR-20260728-011344). CI ingest -> external_sirene_restaurants (payload_hash gates re-pending)
#   -> ACL stages RestaurantRegistered -> inbound_events (RECEIVED)
#   -> drain -> Restaurant aggregate DECIDES -> record | update | nothing
#   -> DELIVERED | IGNORED | DUPLICATE
#
# Why this workflow needs a contract at all, despite being a background job with no customer waiting:
# it writes to the event store on a loop with nobody watching, and its previous failure mode was
# SILENT. A swallowed constraint violation looked identical to a successful registration, so a sweep
# that did nothing 200,000 times reported the same number as one that registered 200,000 restaurants —
# and the first notification of the resulting damage was an email from the database vendor. The
# business metrics below exist to make "did this sweep do anything, and was it what we meant?"
# answerable without reading logs.
# =====================================================================
sirene-sync:
  feature: sirene-sync
  criticality: medium   # no customer is waiting; but silent divergence of the prospection base is costly
  workflow:
    aggregate: { $ref: 'actors.yaml#/Restaurant' }
    inbound:
      - { $ref: 'events.yaml#/RestaurantRegistered' }

  run_identity:
    - { name: correlation_id, source: "inbound.correlation_id", required: true }   # UUIDv5(siret:payload_hash)
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: inbound_event_id, source: "inbound.inbound_event_id", required: true }   # -> domain_events.cause_id
    - { name: external_id, source: "sirene.siret_and_hash", required: true }   # {siret}:{payload_hash} — stable across sweeps

  spans:
    - name: "registry.stage"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.source", type: string, required: true }        # 'sirene'
        - { key: "business.staged", type: bool, required: true }          # false = already in the inbox
    - name: "inbound.drain"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }    # RestaurantRegistered
        # The whole point of the conversion: the AGGREGATE's verdict, not the adapter's guess.
        - { key: "business.decision", type: string, required: true }      # recorded | updated | no_change | duplicate
    - name: "event.store.append"
      kind: INTERNAL
      required: false   # deliberately optional: a no_change decision appends NOTHING, and that is success
      attributes:
        - { key: "business.event_type", type: string, required: true }    # RestaurantRegistered | RestaurantUpdated

  metrics:
    - { name: "sirene_sweep_duration_ms", type: histogram, attributes: ["phase"] }   # phase = ingest | drain
  business_metrics:
    # The four numbers that answer "what did this sweep DO?" — the split that did not exist before.
    - { name: "sirene_records_created_total", type: counter, attributes: ["department"] }
    - { name: "sirene_records_updated_total", type: counter, attributes: ["department"] }
    - { name: "sirene_records_ignored_total", type: counter, attributes: ["department"] }   # steady state: nearly the whole mirror
    - { name: "sirene_records_failed_total", type: counter, attributes: ["reason"] }
    # A version conflict is never "nothing" — it is either a bulk-replay pathology or genuine
    # contention on a hot aggregate. Counted, never swallowed (ADR-20260728-011344).
    - { name: "event_store_version_conflicts_total", type: counter, attributes: ["stream_category"] }

  status_rules:
    success:
      required_spans: ["registry.stage", "inbound.drain"]
      conditions: ["inbound.drain.business.decision != 'failed'"]
    technical_error:
      any_span_errors: true

  # A sweep is a background loop, not a request: the budget bounds one record's translation, not the
  # whole France pass (which is INSEE-API-paced, see issue #218).
  latency_budget: { max_p95_ms: 500, max_p99_ms: 2000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# read-authorization — the per-instance read guard (#144, PROP-20260725-185140)
# verified Principal -> ReadScope (claim resolution, once per request) -> ScopeMembership -> allow | deny
# Binds the WHOLE read surface (`surface: graphql`), like command-acceptance binds the write surface:
# every guarded read and every by-id object fetch flows through the same question.
# =====================================================================
read-authorization:
  feature: read-authorization
  criticality: high
  workflow:
    surface: graphql   # dispatch-surface binding — not one command/saga/aggregate (validator §8)

  run_identity:
    # Reads carry no command envelope, so the correlation id is MINTED at the server boundary when
    # the ReadScope is resolved (one per request) — not copied from a command that does not exist.
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # The claims bridge: Principal -> domain-id ReadScope, a PURE function of the token's verified
    # claims since #433 (CARD-11 — no per-request lookup, no DB). ONE per request, not one per
    # check — N appearances for a single request is a STRUCTURAL regression (scope resolved more
    # than once), the one-per-request sentinel this span exists to keep.
    - name: "auth.read_scope"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.role", type: string, required: true }
        - { key: "business.bridge_resolved", type: string, required: true }   # true | false — false ⇒ the request degrades to Public, i.e. denied
    # The discrete membership check (a by-id read or the subscription guard). The LIST path enforces
    # via an EXISTS predicate fused into the SQL — there is no per-row decision to record, so this
    # span (and a denial) is STRUCTURALLY unemittable for lists: out-of-scope rows simply never
    # return. denied_total therefore only ever fires on by-id/subscription paths — do not "fix" the
    # missing list denials.
    - name: "auth.scope_membership"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.scope_type", type: string, required: true }        # ORDER | RESTAURANT
        - { key: "business.role", type: string, required: true }
        - { key: "business.authorized", type: string, required: true }        # true | false

  metrics:
    # The load-bearing signal. A DENIAL is ordinary (a stale link, a signed-out tab); a SPIKE in
    # denials is id enumeration, not user error — that distinction is the whole reason this contract
    # exists. Alert on the rate of change, never on the absolute count. by-id/subscription paths only
    # (see the span note: list denials are structurally invisible).
    - { name: "read_authorization_denied_total", type: counter, attributes: ["scope_type", "role"] }
    - { name: "read_authorization_checks_total", type: counter, attributes: ["scope_type", "role"] }
    # bridge_resolved=false means an authenticated caller's token carries no domain binding — a
    # missing (or malformed, or pre-refresh stale) captain_* claim, NEVER a DB outage: resolution
    # has no I/O since #433. It denies (safe), but it is a provisioning gap or staleness — never
    # ordinary user denial — and must not sit inside the denial count where it would look like noise.
    - { name: "read_authorization_bridge_unresolved_total", type: counter, attributes: ["role"] }
    # The OPEN path's credential degrade (#469). `/public` now READS the caller's credential (the
    # storefront is pinned to the anonymous path, so `cart.current`'s claim leg could never fire
    # without it) and NEVER fails: anything unverifiable degrades to anonymous. That degrade has to
    # be visible, or a JWKS outage looks like customers who simply stopped having carts.
    # `reason` is the canonical bounded set:
    #   invalid_token        — absent kid, expired, tampered, wrong issuer/audience. The ORDINARY
    #                          case (a stale cookie): alert on the rate of change, never the count.
    #   verifier_unavailable — JWKS unconfigured or unreachable. Any sustained non-zero rate means
    #                          identified customers are being served the anonymous view.
    #   role_not_customer    — the credential does not prove a Captain Food CUSTOMER. Two
    #                          populations, one outcome and one action: a verified
    #                          ADMIN/RESTAURANT/RIDER token, which stays anonymous by design
    #                          ("role = path", ADR-0047); and (#519) a token proving no Captain Food
    #                          role AT ALL — no app_metadata.captain_food object, or an unrecognised
    #                          role in it. The second is the ordinary shape of a SIBLING PRODUCT's
    #                          user once one identity project serves the whole group, where `iss`
    #                          and `aud` no longer separate products. Telling the two apart in
    #                          telemetry is #517's subject, not this counter's.
    #   claim_absent         — a verified CUSTOMER token carrying no (or a malformed)
    #                          captain_food.customer_id: the pre-claim-stamp window, EXPECTED and
    #                          high-volume for one token lifetime after a rollout. It is counted
    #                          HERE rather than as read_authorization_bridge_unresolved_total
    #                          precisely so that window cannot read as a provisioning incident — on
    #                          /public such a caller is served the anonymous view and DENIED
    #                          nothing, which is not what that counter means. Expect a burst that
    #                          decays toward zero; a floor that does NOT decay is a claim-stamping
    #                          failure, and customer_claim_stamp_failed_total is where that lives.
    - { name: "public_credential_degraded_total", type: counter, attributes: ["reason"] }
    # #472 — the SSR render boundary's DEFECT counter (the checkout_degraded_render_total pattern):
    # a page whose declared read FAILED (or whose declared condition expression cannot be parsed)
    # renders its DEGRADED state — an error state distinct from the null-data empty state, per
    # binding. Counted at the framework boundary (server hosts.rs, after `render_path_with` reports
    # the degradations), never inside the renderer/evaluator: `web` compiles to wasm and stays
    # telemetry-free. `screen` is the generated screen id (a closed set), `resolver` the spec's
    # resolver key ("none" for condition defects), `correlation_id` the render's own id (minted per
    # page render by SchemaTransport) so a degraded page joins its read-path spans.
    # `reason` is the canonical bounded set:
    #   resolver_failed        — emitted TODAY, server-side: a REAL transport/contract failure on a
    #                            resolver this role path is allowed to ask. A role-refused read on
    #                            the anonymous SSR transport is a SKIP BY DESIGN and is NOT counted
    #                            — and so is a read the §25b validator proves STRUCTURALLY
    #                            unfulfillable (#745: a required arg with no route-param/pin/
    #                            tenant-host source, declared on the binding via `skipped_reads:`
    #                            and skipped BEFORE any network). Skip reasons feed the render's
    #                            TRACE (a per-skip event with screen/resolver/reason/
    #                            correlation_id at the hosts.rs boundary, at INFO — proven
    #                            visible under the deployed LOG_LEVEL=info default by
    #                            crates/server/tests/skip_trace_visibility.rs; a debug-gated
    #                            emission was the #748-checkpoint blocking finding, the
    #                            wired-never-to-scream class), never a metric label:
    #                            a metric reason wired to weigh zero is a signal wired never to
    #                            scream. The §25b dead-man rule keeps the skip honest — the
    #                            moment the spec gives the read a source, the declaration is a
    #                            validation ERROR and the read runs (and may fail loudly) again.
    #   condition_unparseable  — emitted TODAY, server-side: a `visible_when`/`disabled_when`/
    #                            `condition` expression outside the corpus grammar reached a render
    #                            (fails closed + loud DOM marker; the codegen corpus gate makes
    #                            this unreachable from checked-in specs).
    #   client_resolver_failed | client_condition_unparseable — the browser legs, RESERVED
    #                            (documented-for-future): the hydrate path degrades identically but
    #                            no beacon exists (no OTel in WASM).
    # Alert on ANY sustained non-zero rate.
    - { name: "sdui_degraded_render_total", type: counter, attributes: ["screen", "resolver", "reason", "correlation_id"] }
    - { name: "read_authorization_check_ms", type: histogram, attributes: ["scope_type"] }

  business_metrics:
    # Projection lag on the ACL index is not a normal read-model lag: while it lags, a just-placed
    # order's own customer is DENIED their order (and a rider's just-accepted job can vanish from
    # their board). Watched separately from generic projection lag precisely because its
    # user-visible symptom is a denial rather than stale data.
    - { name: "scope_membership_lag_positions", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: ["auth.read_scope", "auth.scope_membership"]
      conditions: ["auth.scope_membership.business.authorized == 'true'"]
    business_rejected:
      conditions: ["auth.scope_membership.business.authorized == 'false'"]   # a denial is an ORDINARY outcome, never a technical error
    technical_error:
      any_span_errors: true

  # The guard is one primary-key lookup by construction (a derived membership_id), so the budget is
  # deliberately tight: if it drifts, something has started joining or scanning.
  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }

# =====================================================================
# acceptance-timeout — the #167 auto-cancel clock (ADR-20260808-195315 §1.3), gated OFF
# birth (`schedules:`) -> SCHEDULED row -> promotion pass -> kind-MESSAGE delivery ->
#   gate ON: OrderAcceptanceTimedOut appended (PLACED -> CANCELLED_BY_TIMEOUT) + GDPR clock
#   gate OFF (DEFAULT, shadow): identical still-PLACED guard, append inert, verdict Ignored.
# THE FLIP EVIDENCE lives here: the `reminder.promote` span's shadow/would_cancel split is the
# data set the ENFORCE_ACCEPTANCE_TIMEOUT flip ADR reads (the service_window_verdict precedent),
# and the fire-delay attribute is the honest measurement of the "due + promotion slop" precision
# the config key promises. Emitted at the MAILBOX layer (handler.rs), never in the pure record
# handler — business code stays SDK-free.
# =====================================================================
acceptance-timeout:
  feature: acceptance-timeout
  criticality: high
  workflow:
    aggregate: { $ref: 'actors.yaml#/Order' }
    emits:
      - { $ref: 'events.yaml#/OrderAcceptanceTimedOut' }

  run_identity:
    - { name: correlation_id, source: "message.correlation_id", required: true }   # the reminder row's correlation (cause-chained to the delivery that declared it)
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: order_id, source: "payload.orderId", required: true }

  spans:
    # One promoted reminder's DELIVERY. `business.shadow` is the gate position read AT DELIVERY
    # (never scheduling); `business.would_cancel` is the still-PLACED guard's decision on the
    # IDENTICAL fold+predicate code path in both positions — the outcome label split
    # (would_cancel vs noop) that turns shadow traffic into flip evidence. due_at/fire_delay_ms
    # measure real promotion slop against the row's declared scheduled_at (absent only on a
    # redelivery under a fresh, unscheduled identity).
    - name: "reminder.promote"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.reminder_type", type: string, required: true }
        - { key: "business.shadow", type: string, required: true }         # true = gate OFF (append inert) | false = enforcing
        - { key: "business.would_cancel", type: string, required: true }   # true = still PLACED (cancelled, or would be) | false = benign no-op
        - { key: "business.due_at", type: string, required: false }
        - { key: "business.fire_delay_ms", type: string, required: false }
        - { key: "business.order_id", type: string, required: true }
    # The append, on the enforcing arm only (shadow appends nothing by design).
    - name: "event.store.append"
      kind: INTERNAL
      required: false
      attributes:
        - { key: "business.event_type", type: string, required: true }
        - { key: "business.stream_id", type: string, required: true }

  metrics:
    # THE DEAD-MAN'S SWITCH (ADR-20260810-231300): emitted on EVERY watch tick per actor type,
    # 0 included, by a sampler OUTSIDE the worker (promotion_watch.rs) — a monitor that can only
    # fire when a reminder arrives goes quiet exactly when it should scream. Alert twice: on a
    # GROWING value (promotion dead, deadlines piling up) and on the series STOPPING (the watcher
    # or its process died). Never alert on a threshold alone.
    - { name: "reminder_promotion_due_lag_ms", type: histogram, attributes: ["actor_type"] }
    # The dba cardinality watch: SCHEDULED depth per (actor_type, purpose). V0 expectation is
    # single digits; a runaway is a scheduling leak, not load. Same every-tick emission.
    - { name: "mailbox_scheduled_depth", type: gauge, attributes: ["actor_type", "purpose"] }

  status_rules:
    success:
      required_spans: ["reminder.promote"]   # Ignored/Duplicate ARE successes — record semantics, never Rejected
    technical_error:
      any_span_errors: true

  # The delivery leg only (fold + verdict, no external calls). The end-to-end precision promise —
  # due + <=60 s promotion slop + head-of-line drain — is the config key's documented contract and
  # is watched via business.fire_delay_ms, not this budget.
  latency_budget: { max_p95_ms: 500, max_p99_ms: 2000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# customer-erasure — the GDPR Art. 17 journey (PROP-20260829-150752 §3.8; #708)
#
# IDENTITY IS PSEUDONYMOUS THROUGHOUT, and that is a hard constraint rather than a preference: this
# workflow instruments the destruction of a person's data, so a span attribute carrying their email,
# phone or name would survive in the telemetry backend exactly the data the journey just erased —
# and telemetry retention is not our erasure ledger's to control. `aggregate_id` survives as the
# tombstone reference; nothing else identifying does.
#
# THE DEAD-MAN'S SWITCH IS THE POINT OF THIS CONTRACT. Every other signal here fires when something
# HAPPENS; the failure that actually costs a person their rights is an erasure that goes QUIET. A
# PARKED request emits no spans at all — by construction, since parking means no leg ran — so a
# monitor that can only fire on signal arrival goes silent exactly when it should scream (the
# defect class ADR-20260810-231300 names). `erasure_overdue_age_seconds` is therefore the age of the
# OLDEST request without a receipt, computed by a timer-driven sweep over the process rows: it rises
# on silence. It is ANCHORED AT REQUEST RECEIPT and parking never re-anchors or pauses it — our own
# scheduling may not extend the subject's statutory month.
#
# Operational telemetry stays on OTLP/Honeycomb, not in the BAM fold: it has to work when Postgres
# is down, which is one of the ways an erasure goes overdue.
# =====================================================================
customer-erasure:
  feature: customer-erasure
  criticality: high
  workflow:
    # Bound to the AGGREGATE that authors the erasure facts, not to a saga: the orchestrator is the
    # next chunk's (its declaration is inseparable from its runtime seam — see the PR body). The
    # contract lands FIRST on purpose, so the instrumentation it demands is a requirement on that
    # chunk rather than something remembered afterwards.
    aggregate: { $ref: 'actors.yaml#/Customer' }
    inbound:
      - { $ref: 'events.yaml#/CustomerErasureRequested' }
      - { $ref: 'events.yaml#/CustomerErasureConfirmed' }
      - { $ref: 'events.yaml#/CustomerErasureCancelled' }
      - { $ref: 'events.yaml#/CustomerErasureDue' }
      - { $ref: 'events.yaml#/CustomerIdentityUnlinked' }

  run_identity:
    - { name: correlation_id, source: "event.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    # The stream key, which for a Customer stream IS the customerId — and it is what survives as the
    # TOMBSTONE reference, so it stays meaningful after the subject's data is gone. Pseudonymous by
    # construction and treated exactly like `OrderDeleted.customerId`: an accountability reference,
    # never personal data. No email, phone or name is admitted as a span attribute anywhere in this
    # workflow — telemetry retention is not our erasure ledger's to control.
    - { name: customer_id, source: "domain.aggregate_id", businessKey: { $ref: 'scalars.yaml#/CustomerId' }, required: true }

  spans:
    - name: "command.receive"
      kind: SERVER
      required: true
      attributes:
        - { key: "business.command_type", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }
    - name: "erasure.store.purge"
      kind: CLIENT
      required: true
      attributes:
        # One span per LEG, distinguished by this attribute (views / identity provider / key table /
        # stream). A partial purge — one store done, another failed — must be visible AS partial,
        # never as a generic failure, because the remedy differs per store.
        - { key: "business.store", type: string, required: true }
        - { key: "business.result", type: string, required: true }
    - name: "event.store.append"
      kind: INTERNAL
      required: true
      attributes:
        - { key: "business.event_type", type: string, required: true }

  metrics:
    - { name: "erasure_duration_ms", type: histogram, attributes: ["result"] }
    - { name: "erasure_store_failed_total", type: counter, attributes: ["store"] }
    # The bounded population is `scalars.yaml#/ErasureParkReason` (OPEN_ORDER | FUNDS_IN_FLIGHT) —
    # a grouping key needs a declared closed set, and this one is declared as a domain scalar.
    - { name: "erasure_request_parked_total", type: counter, attributes: ["reason"] }
    # The dead-man's switch. PAGES above a threshold set well under thirty days.
    - { name: "erasure_overdue_age_seconds", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: ["erasure.store.purge", "event.store.append"]
      conditions: ["erasure.store.purge.business.result == 'purged'"]
    technical_error:
      any_span_errors: true
      # PARKED IS NOT AN ERROR AND NOT A SUCCESS — it is non-terminal, and classifying it either way
      # loses the only thing worth knowing about it. As an error it would page for the ordinary case
      # of a customer with an order in flight, and the page would be ignored within a week; as a
      # success it would close a run that has destroyed nothing. It stays open, on the clock, and
      # visible through erasure_request_parked_total and the overdue gauge.

  latency_budget: { max_p95_ms: 5000, max_p99_ms: 15000 }
  error_budget: { max_error_rate_pct: 0.0 }

# =====================================================================
# mailbox-delivery — the EVENT/MESSAGE delivery door (#780)
# an adapted inbound FACT (Stripe, a delivery partner) or a promoted REMINDER
#   -> ActorInbox::parse (lane + type together)
#   -> fact_route (pure, total, human-owned)
#   -> the aggregate's own recorder, a PM event leg, or a PARK.
#
# WHY IT IS ITS OWN CONTRACT AND NOT PART OF `command-acceptance`. That contract binds
# `surface: graphql`, and this door's traffic is a Stripe webhook, a partner callback or a reminder
# the platform promoted for itself — none of which touches GraphQL. Binding them there would be a
# false binding, so `mailbox` joins `graphql` as a declared dispatch surface.
#
# WHAT WAS INVISIBLE BEFORE IT. The whole route was uninstrumented: `handle_recorded_fact` opened no
# span at all, and `StatusBusObserver::committed` returns early for any row whose kind is not
# COMMAND — so `command_completion_ms{status="FAILED"}` was never recorded for an EVENT/MESSAGE row
# and nothing reached the status bus. `mailbox_poison_failed_total` could not cover the gap either:
# a terminally FAILED verdict is a SUCCESSFULLY COMMITTED delivery, so it never becomes poison. A
# declared fact with no record route was therefore lost at ZERO signal, with `make validate` and
# `cargo test` both green. #780 removes the loss by construction (E0004 over `ActorFactInbox`) and
# this contract is what makes the residue observable.
#
# OTLP AND NOT BAM, deliberately (ADR-20260811-014129): a fact that never reached its aggregate
# never reached `domain_events`, so a fold is structurally blind to it. The signal has to live where
# it still works when the write path does not.
#
# NO PER-FACT-TYPE LIVENESS GAUGE. For most declared facts zero is a legitimate reading — silence
# here is not ambiguous the way an overdue erasure is — so a dead-man's switch would be a series
# that must be permanently zero, which is the alarm everyone learns to ignore.
# =====================================================================
mailbox-delivery:
  feature: mailbox-delivery
  criticality: high
  workflow:
    surface: mailbox   # dispatch-surface binding: the EVENT/MESSAGE door, not one command or saga

  run_identity:
    - { name: correlation_id, source: "message.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }
    - { name: message_id, source: "message.message_id", required: true }   # inbound_messages pk

  spans:
    - name: "message.deliver"
      kind: CONSUMER
      required: true
      attributes:
        # WHICH LANE and WHICH FACT — the entire question when a fact does not arrive. Both are read
        # from the parsed typed value, which is keyed off the ROW's actor_type, so the pair can never
        # be the payload's opinion of where it belongs.
        - { key: "business.actor_type", type: string, required: true }
        - { key: "business.message_type", type: string, required: true }
        - { key: "business.message_kind", type: string, required: true }   # EVENT | MESSAGE
        - { key: "business.message_id", type: string, required: true }
        - { key: "business.correlation_id", type: string, required: true }
        # The delivery's outcome, late-bound: recorded | duplicate | ignored | pm_leg | parked.
        - { key: "business.verdict", type: string, required: true }

  metrics:
    # A DECLARED fact that did not reach its aggregate. `reason` is a CLOSED set and the two members
    # are kept in SEPARATE series ON PURPOSE (observability, #780 briefing): collapsing them makes a
    # counter that must be permanently zero non-zero, and it gets ignored within a week.
    #
    #   deferred           — the fact is declared and the receiving aggregate has no fold rule for
    #                        it, so it PARKS: the row stays RECEIVED, retries, and at the cap the
    #                        runtime flips it into the existing poison queue where an operator can
    #                        requeue it. Must be zero in production; every increment is a routed
    #                        `deliver:` that landed before its fold rule did.
    #   unparsable_payload — a DECLARED fact whose payload does not deserialize, or whose staged
    #                        `eventType` disagrees with the row's `message_type`. Deterministic, so
    #                        terminal; the row is the evidence.
    #
    # `no_route` is deliberately ABSENT: over `ActorFactInbox` an unrouted declared fact is an
    # E0004, so the member would name a state the build cannot reach.
    - name: "mailbox_fact_unrecorded_total"
      type: counter
      attributes: ["actor_type", "message_type", "reason"]
      # The bounded population of the `reason` key, DECLARED (ADR-20260811-014129). `actor_type` and
      # `message_type` are bounded by `actors.yaml` itself — the declared lane set and that lane's
      # declared `receives:` set — which is why `message_type` is kept: it answers WHICH fact, the
      # entire question. `message_id`/`correlation_id` stay on the SPAN, never on a metric label.
      attribute_values:
        reason: [deferred, unparsable_payload]

  status_rules:
    success:
      required_spans: ["message.deliver"]
      conditions: ["message.deliver.business.verdict != 'parked'"]
    technical_error:
      any_span_errors: true

  # The delivery itself: parse, fold the addressed stream, append, commit. Not the end-to-end
  # webhook latency — that spans the provider hop and belongs to the workflow contracts.
  latency_budget: { max_p95_ms: 250, max_p99_ms: 1000 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# member-sign-in -- #639 part C step 6-ii (ADR-20260905-101349 §10): the restaurateur's email
# sign-in door, the `rider-identity`/`otp_send_guard_enforcing` shape transposed to email. OTLP
# only (no BAM): the anonymous door has no bounded-population beneficiary a fold could serve, and
# an `on_roster` label would CREATE the enumeration oracle the door exists to deny -- so this
# section declares NO metric ever carrying an email, a token or a messageId as a label.
# `correlation_id` breaks across the mail hop exactly as the SMS one breaks across the SMS hook:
# the join is hashed-email + a time window, prose only, never a stored/emitted key.
# =====================================================================
member-sign-in:
  feature: member-sign-in
  criticality: high
  workflow:
    surface: graphql   # read/write seam under a PUBLIC path -- no single command/saga/aggregate

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # ONE per restaurant-path resolution through the MEMBER seam, the `rider.identity.resolve`
    # shape transposed -- INSIDE auth.read_scope's span, never emitted for any other role.
    - name: "member.identity.resolve"
      kind: INTERNAL
      required: false
      attributes:
        - { key: "business.result", type: string, required: true }   # resolved | not_found | lookup_failed
        - { key: "business.correlation_id", type: string, required: true }
        - { key: "business.failure_reason", type: string, required: false }
    - name: "member.signin.link_request"
      kind: INTERNAL
      required: false   # only requestMemberSignInLink opens it
      attributes:
        - { key: "business.correlation_id", type: string, required: true }
    - name: "member.signin.confirm"
      kind: INTERNAL
      required: false   # only confirmMemberSignIn opens it
      attributes:
        # Round 2 R2-O2: widened from five to the true nine values the mapper
        # (`crates/infrastructure/src/member_sign_in_reasons.rs::member_sign_in_confirm_result`,
        # plus the handler's own "linked" on success) actually yields -- all bounded, PII-free
        # (typed error codes / a fixed success token, never an email/token/messageId).
        - { key: "business.result", type: string, required: true }   # linked | not_linked | token_invalid | token_expired | lookup_failed | door_closed | requires_session | claim_conflict | rejected
        - { key: "business.correlation_id", type: string, required: true }
    - name: "claims.stamp"
      kind: CLIENT   # round 2 R2-O1: matches customer-identification's own "claims.stamp" (:~1016)
      required: false   # shared with customer/rider claim stamps -- opened only on the MEMBER stamp attempt here

  metrics:
    # The MEMBER seam's own resolution metrics -- the `rider_identity_*` shape, never that
    # contract's own series (a paging rule keyed on rider_identity_lookup_failed_total must not go
    # quiet because members started failing on a differently-named seam).
    - { name: "member_identity_resolve_ms", type: histogram, attributes: ["result"] }
    - { name: "member_identity_not_found_total", type: counter, attributes: [] }
    - { name: "member_identity_lookup_failed_total", type: counter, attributes: ["reason"] }
    - { name: "member_identity_lookup_source_total", type: counter, attributes: ["source"] }
    - { name: "member_sign_in_link_requested_total", type: counter, attributes: ["result"] }
    - { name: "member_sign_in_confirmed_total", type: counter, attributes: ["result"] }
    # DEFECT counter, the rider_claim_stamp_failed_total pattern under THIS contract's own name --
    # never ordinary user error, each one a linked member whose confirmed sign-in issued no
    # credential. `reason` bounded: not_configured | claim_conflict | provider_error.
    - { name: "member_claim_stamp_failed_total", type: counter, attributes: ["reason"] }
    - { name: "member_sign_in_refused_total", type: counter, attributes: ["reason"] }
    # GATE LIVENESS (the `otp_send_guard_enforcing` shape, ADR-20260810-231300): 1 while
    # RUN_MEMBER_SIGN_IN_DOOR enforces its refusal on a request, 0 the moment the composition root
    # boots with the key OFF -- so "zero refusals tonight" and "the door has been off since the
    # last deploy" are distinguishable, registered at the composition root (the #895 lesson: a
    # boot-time `true` never refreshed proves the process started, not that the gate is live).
    - { name: "member_sign_in_door_enforcing", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: []   # spans open only on the member sign-in path
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 400, max_p99_ms: 1200 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# admin-sign-in -- #639 part C step 6-v (ADR-20260905-223957 §5): the ADMIN seam binding. A NEW
# contract, never a widening of `member-sign-in` -- the platform population is 1-3, orders of
# magnitude below the restaurant population, and pre-aggregation cannot be decomposed back apart.
# NO `email`/`sub`/`admin_id`/`on_roster` label anywhere: any label on a population this small is
# near-identifying. Two dead-man gauges live with this contract: `platform_access_grant_enforcing`
# here; the System-host door gauge arrives with 6-iii.
# =====================================================================
admin-sign-in:
  feature: admin-sign-in
  criticality: high
  workflow:
    surface: graphql   # read-path binding, request seam -- no single command/saga/aggregate (the rider-identity precedent)

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # ONE per ADMIN-path resolution through the platform seam, the `rider.identity.resolve`/
    # `member.identity.resolve` shape transposed -- INSIDE auth.read_scope's span, never emitted
    # for any other role.
    - name: "admin.identity.resolve"
      kind: INTERNAL
      required: false   # only an ADMIN-path caller opens it
      attributes:
        - { key: "business.result", type: string, required: true }   # resolved | not_found | lookup_failed
        - { key: "business.correlation_id", type: string, required: true }
        - { key: "business.failure_reason", type: string, required: false }

  metrics:
    # The ADMIN seam's own resolution outcome -- ONE bounded counter (card F), never a per-role
    # widening of `member_identity_resolve_ms`/`rider_identity_resolve_ms`'s histogram shape: the
    # platform population is too small for a latency distribution to mean anything.
    - { name: "admin_identity_resolve_total", type: counter, attributes: ["result"] }
    # `platformAccessGranted`'s outcome -- `basis` is bounded (PlatformAccessBasis, one value today).
    - { name: "platform_access_granted_total", type: counter, attributes: ["basis"] }
    # GATE LIVENESS (the `member_sign_in_door_enforcing`/`otp_send_guard_enforcing` shape,
    # ADR-20260810-231300): 1 while RUN_PLATFORM_ACCESS_GRANT enforces its refusal, 0 the moment
    # the composition root boots with the key OFF -- registered at BOTH composition roots
    # unconditionally (farley's RUN_* parity codegen test).
    - { name: "platform_access_grant_enforcing", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: []   # the span is opened only on the ADMIN path
    technical_error:
      any_span_errors: true

  # One probe on `platform_member.auth_subject`'s UNIQUE index -- the rider/member seam's own
  # budget, and for the same reason: if it drifts, something started scanning a population of 1-3.
  # #639 part C step 6-iii (ADR-20260906-023825, obs BLOCKING): this budget is `admin.identity.
  # resolve`'s ALONE -- the door legs (email send + IdP verify) are a different call shape entirely
  # and get their OWN contract below (`admin-sign-in-door`) rather than stretching this probe's
  # 15/50ms floor to cover an IdP round trip.
  latency_budget: { max_p95_ms: 15, max_p99_ms: 50 }
  error_budget: { max_error_rate_pct: 0.1 }

# =====================================================================
# admin-sign-in-door -- #639 part C step 6-iii (ADR-20260906-023825): the ADMIN sign-in door
# itself (requestAdminSignInLink/confirmAdminSignIn), the member-sign-in shape transposed to the
# platform context. A SECOND, separate contract from `admin-sign-in` (obs SS4/Q6 at the 2026-09-06
# briefing): `admin-sign-in`'s {15,50}ms budget is ONE Postgres index probe
# (`platform_member.auth_subject`), while these two mutations call the identity PROVIDER (an email
# send + a magic-link verify, an IdP round trip) -- the member-sign-in {400,1200}ms shape, never a
# stretched seam-probe number. NO `email`/`sub`/`admin_id`/`on_roster` label anywhere: the platform
# population is 1-3, so any label is near-identifying.
# =====================================================================
admin-sign-in-door:
  feature: admin-sign-in-door
  criticality: high
  workflow:
    surface: graphql   # read/write seam under a PUBLIC path -- no single command/saga/aggregate

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    - name: "admin.signin.link_request"
      kind: INTERNAL
      required: false   # only requestAdminSignInLink opens it
      attributes:
        - { key: "business.correlation_id", type: string, required: true }
    - name: "admin.signin.confirm"
      kind: INTERNAL
      required: false   # only confirmAdminSignIn opens it
      attributes:
        # The mapper's TRUE vocabulary (`crates/infrastructure/src/admin_sign_in_reasons.rs::
        # admin_sign_in_confirm_result`, plus the handler's own "granted" on success -- round 2
        # R2-4, evans: nothing LINKS here, the grant pre-exists and the door only identifies
        # against it) -- all bounded, PII-free (typed error codes / a fixed success token, never an
        # email/token/messageId).
        - { key: "business.result", type: string, required: true }   # granted | not_granted | token_invalid | token_expired | lookup_failed | door_closed | requires_session | claim_conflict | rejected
        - { key: "business.correlation_id", type: string, required: true }
    - name: "claims.stamp"
      kind: CLIENT   # matches customer/rider/member's own "claims.stamp" -- shared across every stamper
      required: false   # opened only on the ADMIN stamp attempt here

  metrics:
    - { name: "admin_sign_in_link_requested_total", type: counter, attributes: ["result"] }
    - { name: "admin_sign_in_confirmed_total", type: counter, attributes: ["result"] }
    # DEFECT counter, the `member_claim_stamp_failed_total` pattern under THIS contract's own name
    # -- never ordinary user error, each one a granted admin whose confirmed sign-in issued no
    # credential. `reason` bounded: not_configured | claim_conflict | provider_error.
    - { name: "admin_claim_stamp_failed_total", type: counter, attributes: ["reason"] }
    - { name: "admin_sign_in_refused_total", type: counter, attributes: ["reason"] }
    # GATE LIVENESS (the `member_sign_in_door_enforcing`/`platform_access_grant_enforcing` shape,
    # ADR-20260810-231300): 1 while RUN_ADMIN_SIGN_IN_DOOR enforces its refusal on a request, 0 the
    # moment the composition root boots with the key OFF -- registered at BOTH composition roots
    # unconditionally (farley's RUN_* fleet-parity codegen test).
    - { name: "admin_sign_in_door_enforcing", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: []   # spans open only on the admin sign-in path
    technical_error:
      any_span_errors: true

  # The member-sign-in shape: an email send + an IdP magic-link verify, never a bare index probe.
  latency_budget: { max_p95_ms: 400, max_p99_ms: 1200 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# restaurant-invitation -- #639 part C step 6-iv (ADR-20260905-101349 §2/§3): the roster and the
# invitation. Spans on BOTH legs of the two-lane accept; counters carry NO email/token/invitationId
# label (PII/opaque-credential-free, the member-sign-in contract's own posture). The mail-hop
# correlation break is the SAME as 6-ii's: `invite.send`/`accept.confirm` correlate by
# `business.correlation_id` on THIS side of the send; nothing here traces into the mail provider or
# the click that lands on `/invitation`. The §12-parked business metric (a persona-activity fold
# over `domain_events`) is NOT invented here -- this contract is operational telemetry only.
# =====================================================================
restaurant-invitation:
  feature: restaurant-invitation
  criticality: high
  workflow:
    surface: graphql   # read/write seam under a PUBLIC (accept) + RESTAURANT (invite/revoke) path

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    - name: "invitation.invite"
      kind: INTERNAL
      required: false   # only inviteRestaurantMember opens it
      attributes:
        - { key: "business.authority", type: string, required: true }   # MANAGER | OPERATOR (the invited authority, never the caller's)
        - { key: "business.result", type: string, required: true }   # sent | door_closed | rejected
        - { key: "business.correlation_id", type: string, required: true }
    - name: "invitation.accept"
      kind: INTERNAL
      required: false   # only acceptRestaurantInvitation opens it
      attributes:
        - { key: "business.result", type: string, required: true }   # accepted | not_acceptable | token_invalid | token_expired
        - { key: "business.correlation_id", type: string, required: true }

  metrics:
    - { name: "restaurant_invitation_sent_total", type: counter, attributes: ["authority"] }
    - { name: "restaurant_invitation_accepted_total", type: counter, attributes: [] }
    - { name: "restaurant_invitation_expired_total", type: counter, attributes: [] }
    - { name: "restaurant_invitation_revoked_total", type: counter, attributes: [] }
    # GATE LIVENESS (the `member_sign_in_door_enforcing` shape, ADR-20260810-231300): 1 while
    # RUN_RESTAURANT_INVITATION enforces its refusal on a request, 0 the moment the composition
    # root boots with the key OFF, registered at BOTH composition roots (the #895 lesson).
    - { name: "restaurant_invitation_door_enforcing", type: gauge, attributes: [] }
    # Round 3 (obs, the `rider_standing_lag_positions`/`scope_membership_lag_positions` shape): one
    # gauge per NEW `ProjectorGroup` this slice adds — `RestaurantRoster` and
    # `RestaurantInvitationList` are their OWN checkpoint groups (round 2), and until now their
    # replay lag had ZERO emit sites, the exact defect class this contract file exists to catch.
    # The pending page length at each scan — a lower bound while draining, 0 only on the first scan
    # that finds nothing (`drain_group`'s own shape, shared verbatim).
    - { name: "restaurant_roster_lag_positions", type: gauge, attributes: [] }
    - { name: "restaurant_invitation_list_lag_positions", type: gauge, attributes: [] }

  status_rules:
    success:
      required_spans: []   # spans open only on the invite/accept path
    technical_error:
      any_span_errors: true

  latency_budget: { max_p95_ms: 400, max_p99_ms: 1200 }
  error_budget: { max_error_rate_pct: 1.0 }

# =====================================================================
# graphql-limits -- #639 part C step 6-ii (ADR-20260905-101349 §9): the per-role depth/complexity
# ceiling on EVERY role's schema, riding on the member door's PR because it lands with the entry
# point it bounds. Zero rejections must not read like "limits not installed" -- the max gauge and
# the observed histograms are what tell the two apart.
# =====================================================================
graphql-limits:
  feature: graphql-limits
  criticality: medium
  workflow:
    surface: graphql   # the parse_query extension, ahead of every resolver, every role

  run_identity:
    - { name: correlation_id, source: "request.correlation_id", required: true }
    - { name: trace_id, source: "otel.trace_id", required: true }

  spans:
    # Opened ONLY when the extension actually refuses a document -- an accepted request emits the
    # histograms/gauge below and no span, so a healthy peak does not open one per request.
    - name: "graphql.limits.refused"
      kind: INTERNAL
      required: false
      attributes:
        - { key: "business.role", type: string, required: true }
        - { key: "business.reason", type: string, required: true }   # depth | complexity
        - { key: "business.correlation_id", type: string, required: true }

  metrics:
    # Refused BEFORE any resolver runs; `reason` is bounded depth|complexity, `role` the acting role.
    - { name: "graphql_request_rejected_total", type: counter, attributes: ["role", "reason"] }
    - { name: "graphql_query_depth", type: histogram, attributes: ["role"] }
    - { name: "graphql_query_complexity", type: histogram, attributes: ["role"] }
    # The CONFIGURED ceiling this process is enforcing, per role/kind -- so a deploy that silently
    # regenerated a lower limit shows up as a moved gauge rather than a mystery refusal spike.
    - { name: "graphql_limit_max", type: gauge, attributes: ["role", "kind"] }

  # No `technical_error` rule: a refusal here is the limiter working as designed (a business
  # outcome), never a technical error -- there is no failure mode this span's own construction
  # could set `otel.status_code` for (the `obs-technical-error-unreachable` shape this avoids).
  status_rules:
    success:
      required_spans: []

  latency_budget: { max_p95_ms: 5, max_p99_ms: 20 }
  error_budget: { max_error_rate_pct: 5.0 }
