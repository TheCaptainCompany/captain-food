version: 1
description: >
  ordering scope — api fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `api.yaml` catalog; $refs stay kind-logical
  (`api.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

types:

  Cart:
    description: "A customer's in-progress selection for a single restaurant (priced by the projection)."
    reads: [{ $ref: 'database/tables/projection_tables.yaml#/Cart' }]
    properties:
      id: { $ref: 'scalars.yaml#/CartId' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      customerId: { $ref: 'scalars.yaml#/CustomerId', nullable: true }
      status: { $ref: 'scalars.yaml#/CartStatus' }
      lines: { $ref: 'entities.yaml#/OrderLineItem', array: true }   # read lines are priced (same shape as order lines)
      totalAmount: { $ref: 'entities.yaml#/Money' }   # food sub-total (the cart's items)
      breakdown: { $ref: 'entities.yaml#/PaymentBreakdown', nullable: true }   # estimated checkout fee breakdown (ADR-0018)
      uberComparison: { $ref: 'entities.yaml#/UberComparison', nullable: true }   # estimated Uber Eats price/split for this cart (ADR-0022/0025); null if no cuisine
      updatedAt: { type: string, format: date-time }

  Order:
    description: "An order with its tracking status and payment state."
    reads: [{ $ref: 'database/tables/projection_tables.yaml#/OrderTracking' }]
    navRoles:   # #22: the order's delivery legs are ops data (customer tracking uses Order.deliveryStatus/courier)
      deliveryJobs: [RESTAURANT, RESTAURANT_ACCOUNT, RIDER, ADMIN]
    properties:
      id: { $ref: 'scalars.yaml#/OrderId' }
      ref: { $ref: 'scalars.yaml#/ExternalReference' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      customerId: { $ref: 'scalars.yaml#/CustomerId', nullable: true }
      status: { $ref: 'scalars.yaml#/OrderStatus' }
      serviceType: { $ref: 'scalars.yaml#/ServiceType' }
      items: { $ref: 'entities.yaml#/OrderLineItem', array: true }
      totalAmount: { $ref: 'entities.yaml#/Money' }   # buyer total (== breakdown.total)
      breakdown: { $ref: 'entities.yaml#/PaymentBreakdown' }   # fee/split breakdown (ADR-0016/0017/0018)
      deliveryAddress: { $ref: 'entities.yaml#/Address', nullable: true }
      estimatedReadyAt: { type: string, format: date-time, nullable: true }
      placedAt: { type: string, format: date-time }
      statusChangedAt: { type: string, format: date-time }
      paymentStatus: { $ref: 'scalars.yaml#/PaymentStatus' }   # folded from Stripe facts
      restaurantStars: { $ref: 'scalars.yaml#/StarRating', nullable: true }   # null until rated
      ratingComment: { $ref: 'scalars.yaml#/RatingComment', nullable: true }
      riderThumb: { $ref: 'scalars.yaml#/ThumbRating', nullable: true }
      deliveryTimeliness: { $ref: 'scalars.yaml#/DeliveryTimeliness', nullable: true }   # #62 delay-survey answer; null until answered (hides the prompt once set)
      riderTip: { $ref: 'entities.yaml#/Money', nullable: true }        # Σ tips to the rider (any tipper)
      restaurantTip: { $ref: 'entities.yaml#/Money', nullable: true }   # Σ tips to the restaurant
      captainTip: { $ref: 'entities.yaml#/Money', nullable: true }      # Σ tips to Captain
      uberComparison: { $ref: 'entities.yaml#/UberComparison', nullable: true }   # Uber side of the receipt (ADR-0025); Captain side is `breakdown`. Null if no cuisine
      deliveryStatus: { $ref: 'scalars.yaml#/DeliveryStatus', nullable: true }   # live delivery progress (ADR-0031); null for COLLECTION / before dispatch
      courier: { $ref: 'entities.yaml#/Courier', nullable: true }                # assigned courier once accepted
      estimatedDropoffAt: { type: string, format: date-time, nullable: true }    # partner-reported ETA
      ratedAt: { type: string, format: date-time, nullable: true }

  DeliverySatisfaction:
    description: >
      One customer's delivery-delay satisfaction answer for an order (#62): the timeliness verdict and
      optional reason. Serves the restaurant's timeliness insight (self-dispatch-vs-Captain signal).
    reads: [{ $ref: 'database/projection_views.yaml#/View_DeliverySatisfaction' }]
    properties:
      orderId: { $ref: 'scalars.yaml#/OrderId' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      timeliness: { $ref: 'scalars.yaml#/DeliveryTimeliness' }
      reason: { $ref: 'scalars.yaml#/DeliveryDissatisfactionReason', nullable: true }
      recordedAt: { type: string, format: date-time }

  Reclamation:
    description: >
      A customer claim/dispute over a delivered order (aggregate Reclamation, id = reclamationId; #154).
      Serves the customer's "my claims" list + claim detail and the restaurant's/admin's claims queue.
      `status` is derived from the lifecycle facts (OPEN → RESOLVED/REJECTED → OPEN on reopen); the
      decision fields (`resolution`, `refundAmount`, `rejectReason`, `decidedAt`) are null while OPEN.
    reads: [{ $ref: 'database/projection_views.yaml#/View_Reclamation' }]
    properties:
      reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
      orderId: { $ref: 'scalars.yaml#/OrderId' }
      customerId: { $ref: 'scalars.yaml#/CustomerId' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      category: { $ref: 'scalars.yaml#/ReclamationCategory' }
      description: { $ref: 'scalars.yaml#/ReclamationDescription' }
      requestedResolution: { $ref: 'scalars.yaml#/ReclamationResolution', nullable: true }
      status: { $ref: 'scalars.yaml#/ReclamationStatus' }
      resolution: { $ref: 'scalars.yaml#/ReclamationResolution', nullable: true }   # the decided resolution once resolved
      refundAmount: { $ref: 'entities.yaml#/Money', nullable: true }   # the PARTIAL_REFUND amount, if recorded
      rejectReason: { $ref: 'scalars.yaml#/ReclamationReason', nullable: true }   # the reason recorded on rejection
      openedAt: { type: string, format: date-time }
      decidedAt: { type: string, format: date-time, nullable: true }
      overdue: { type: boolean }   # #160 first-response SLA: computed AT READ TIME (not stored) — status OPEN and opened_at older than the target (RECLAMATION_FIRST_RESPONSE_TARGET_HOURS); the fold-view generator can't express a now()-dependent column, so the read repo computes it

queries:


  carts:
    description: >
      A customer's carts (one OPEN cart per restaurant). Ownership enforced server-side (#144): for a
      CUSTOMER caller the customerId argument is IGNORED and forced to the caller's own identity
      (resolved once per request from the verified principal); only ADMIN reads another customer's
      carts. An unresolvable caller identity yields an empty list, never a fall-through to the
      client-supplied filter.
    args:
      customerId: { $ref: 'scalars.yaml#/CustomerId', required: true }
    returns: { $ref: '#/types/Cart', array: true }
    roles: [CUSTOMER, ADMIN]
    slice: V0

  cart:
    description: "A single cart by id (session-scoped; readable by the guest/customer who owns it)."
    args:
      id: { $ref: 'scalars.yaml#/CartId', required: true }
    returns: { $ref: '#/types/Cart', nullable: true }
    slice: V0


  orders:
    description: >
      Orders, optionally scoped by customer and/or restaurant and filtered by status. Serves both the
      customer's own history and the restaurant back-office queue; ownership/scope enforced server-side.
    args:
      customerId: { $ref: 'scalars.yaml#/CustomerId' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      status: { $ref: 'scalars.yaml#/OrderStatus' }
    returns: { $ref: '#/types/Order', array: true }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0

  order:
    description: "Order tracking by id; owning customer or the restaurant/admin. Ownership enforced server-side."
    args:
      id: { $ref: 'scalars.yaml#/OrderId', required: true }
    returns: { $ref: '#/types/Order', nullable: true }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0

  restaurantDeliverySatisfaction:
    description: >
      A restaurant's delivery-delay satisfaction answers (#62): one row per surveyed order, the
      customer timeliness verdict feeding the self-dispatch-vs-Captain decision. Ownership enforced
      server-side. Optionally filtered to a single timeliness verdict.
    args:
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId', required: true }
      timeliness: { $ref: 'scalars.yaml#/DeliveryTimeliness' }
    returns: { $ref: '#/types/DeliverySatisfaction', array: true }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V1


  myReclamations:
    description: >
      The authenticated customer's own reclamations (claims/disputes), newest-first (#154). No args —
      scoped server-side to the caller's Customer identity (the verified session principal → Customer
      row); an anonymous caller sees an empty list.
    returns: { $ref: '#/types/Reclamation', array: true }
    roles: [CUSTOMER]
    slice: V1


  restaurantReclamations:
    description: >
      The claims queue for the restaurant's orders (#154): a manager/owner works its customers' claims,
      an admin oversees. Optional filters by status (OPEN = the outstanding queue) and category.
      Restaurant/ownership scoping is enforced server-side; the per-restaurant narrowing seam is a
      recorded follow-up gap (no restaurant principal in the GraphQL context yet — the same gap the
      EXTERNAL deliveryPartnerAvailabilities queue records).
    args:
      status: { $ref: 'scalars.yaml#/ReclamationStatus' }
      category: { $ref: 'scalars.yaml#/ReclamationCategory' }
      overdue: { type: boolean }   # #160 SLA: when true, only OPEN claims past the first-response target (opened_at < now() - target)
    returns: { $ref: '#/types/Reclamation', array: true }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V1


  reclamation:
    description: >
      A single reclamation by id (#154) — claim detail for the customer who raised it and the
      restaurant/admin deciding it. Null when unknown.
    args:
      reclamationId: { $ref: 'scalars.yaml#/ReclamationId', required: true }
    returns: { $ref: '#/types/Reclamation', nullable: true }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V1

mutations:


  addCartLine:
    command: { $ref: 'commands.yaml#/AddCartLine' }
    slice: V0

  removeCartLine:
    command: { $ref: 'commands.yaml#/RemoveCartLine' }
    slice: V0

  changeCartLineQuantity:
    command: { $ref: 'commands.yaml#/ChangeCartLineQuantity' }
    slice: V0

  placeOrder:
    command: { $ref: 'commands.yaml#/PlaceOrder' }
    roles: [CUSTOMER]
    slice: V0
    # orderId is client-generated (in the command); the Stripe-assigned values are reads:
    # queries/paymentStatus + subscriptions/paymentStatusChanged (acceptance-first, ADR-20260720-015500).


  acceptOrder:
    command: { $ref: 'commands.yaml#/AcceptOrder' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V0

  rejectOrder:
    command: { $ref: 'commands.yaml#/RejectOrder' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V0

  startPreparation:
    command: { $ref: 'commands.yaml#/StartPreparation' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V1

  markOrderReady:
    command: { $ref: 'commands.yaml#/MarkOrderReady' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V0

  markOrderDelivered:
    command: { $ref: 'commands.yaml#/MarkOrderDelivered' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, RIDER]
    slice: V0

  cancelOrderByCustomer:
    command: { $ref: 'commands.yaml#/CancelOrderByCustomer' }
    roles: [CUSTOMER]
    slice: V0

  cancelOrderByRestaurant:
    command: { $ref: 'commands.yaml#/CancelOrderByRestaurant' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V1

  rateOrder:
    command: { $ref: 'commands.yaml#/RateOrder' }
    roles: [CUSTOMER]
    slice: V1

  rateRestaurant:
    command: { $ref: 'commands.yaml#/RateRestaurant' }
    roles: [CUSTOMER]
    slice: V1

  recordDeliverySatisfaction:
    command: { $ref: 'commands.yaml#/RecordDeliverySatisfaction' }
    roles: [CUSTOMER]
    slice: V1

  tipOrder:
    command: { $ref: 'commands.yaml#/TipOrder' }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT]   # customer tips rider/restaurant/Captain; restaurant tips rider/Captain
    slice: V1

  requestRefund:
    command: { $ref: 'commands.yaml#/RequestRefund' }
    roles: [CUSTOMER]
    slice: V1


  # Reclamations / customer claims (#151)
  openReclamation:
    command: { $ref: 'commands.yaml#/OpenReclamation' }
    roles: [CUSTOMER]
    slice: V0

  resolveReclamation:
    command: { $ref: 'commands.yaml#/ResolveReclamation' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0

  rejectReclamation:
    command: { $ref: 'commands.yaml#/RejectReclamation' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0

  reopenReclamation:
    command: { $ref: 'commands.yaml#/ReopenReclamation' }
    roles: [CUSTOMER]
    slice: V0

  attachReclamationEvidence:
    command: { $ref: 'commands.yaml#/AttachReclamationEvidence' }
    roles: [CUSTOMER]
    slice: V0

subscriptions:

  orderStatusChanged:
    description: >
      Order status change events for ONE order, tracked by orderId — what the confirmation screen
      has in hand (#14, ADR-20260720-220000; replaces the pre-acceptance-first correlationId key).
      Ownership is resolver-side per row: a CUSTOMER caller must BE the order's customer; ADMIN sees
      any order; RESTAURANT/RESTAURANT_ACCOUNT paths are trusted like the `orders` query until a
      caller↔restaurant binding exists (recorded gap). No guest session scope on Order reads
      (ADR-20260720-213000 §3 — guests follow paymentStatusChanged until they verify a phone).
    args:
      orderId: { $ref: 'scalars.yaml#/OrderId', required: true }
    returns: { $ref: '#/types/Order' }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0
