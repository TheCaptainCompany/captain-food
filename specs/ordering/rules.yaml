version: 1
description: >
  ordering scope — rules fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `rules.yaml` catalog; $refs stay kind-logical
  (`rules.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# --- Cart ---
CartPricedFromLiveCatalog:
  description: >
    The cart price is LIVE: cart mutation events and the Cart read model carry NO money — the
    price a customer sees is computed ON READ from the live catalog by the SAME `price_cart`
    authority the write path uses (one code path), never stored in the fold and never trusted
    from the client. A restaurant price change is reflected on the next read; the one
    authoritative freeze happens at checkout (CheckoutSnapshotFrozenAtIntent).
    (PROP-20260810-231500 Option B, ADR-20260810-112836 — corrects the earlier impure-fold
    wording that had the projection reading the catalog.)

CartRejectsUnorderableOrInvalidLine:
  description: "Adding an unorderable offer or operating on an invalid/absent line is rejected."


# --- Order ---
OrderLifecycleStatusMachine:
  description: "An order advances accept → prepare → ready → delivered (or reject/cancel), each transition allowed only from the correct status."

OrderLifecycleIsExplicit:
  description: >
    The Order status machine is the DECLARED lifecycle (actors.yaml#/Order/lifecycle,
    ADR-20260720-004419), not implicit code: a move the declared transition table does not contain —
    a skipped/repeated step, or any transition out of a terminal state (DELIVERED, REJECTED,
    CANCELLED_BY_CUSTOMER, CANCELLED_BY_RESTAURANT) — is rejected with InvalidOrderStatus.

OrderRatedOnceWhenDelivered:
  description: "A delivered order can be rated (rider thumb) exactly once."

RestaurantRatedOncePerOrder:
  description: "The restaurant can be rated exactly once per order."

DeliverySatisfactionRecordedOncePerDeliveredOrder:
  description: "A delivered order's delivery-delay satisfaction survey can be answered exactly once (#62); a second answer, a missing order, or a not-delivered order is rejected."

DeliverySatisfactionVisibleToRestaurant:
  description: "A recorded delivery-delay verdict (DeliverySatisfactionRecorded) is projected into the restaurant-facing timeliness read model (restaurantDeliverySatisfaction) so the restaurant can weigh self-dispatch vs Captain routing (#62)."

TipsAdditiveMultiRecipientSeparate:
  description: "Tips (rider/restaurant/Captain, by customer or restaurant) are additive and separate from the split; an invalid recipient is rejected (ADR-0029)."

RefundRequestByCustomer:
  description: "A customer can request a refund for an order."


# --- PlaceOrderProcess (checkout saga) ---
ServerPriceAuthority:
  description: >
    NOTE (evans, to action when the write-side verify guard lands): this phase-scaffolding
    paragraph exists only to describe today's split and should be DELETED at that point, leaving
    the rule's evergreen text to stand alone. Rewritten in the same change as the write-side
    expand/contract door's SPEC shapes (PROP-20260831-134539 slice 3b + the command change,
    ADR-20260906-192007 D-A/D-D/D-F) — the write-side ENFORCEMENT this rule describes still lands
    only once the quote is verified server-side, together with `errors.yaml#/QuoteNoLongerHonoured`'s
    real test coverage (the two cannot split across phases: `make validate`'s `test-uncovered-error`
    refuses a `throws:` reference to an error no code can yet produce). Until then, the rule below
    is UNCHANGED IN BEHAVIOUR: the server is the only price authority on the write path — order
    line totals, the order total and the payment-intent amount are recomputed AT HEAD from the live
    catalog (Offer prices, Option prices) TODAY, while the write door is CLOSED; once the door
    opens, the CHARGE SOURCE becomes the fold `as_of(catalogId, V)` AT THE COORDINATE the quote
    names (never `at_head`, D-F) instead — no client-supplied amount is ever trusted, in either
    arm. A client-submitted `expectedTotal` is a confirmation only, checked for equality (divergence
    rejects with `PriceMismatch`), and a cart line whose price cannot be resolved from the live
    catalog rejects the checkout fail-closed (`PriceUnresolvable`) — never a fallback to the
    client's number. LEGAL DISPLAY GUARANTEE (Code de la consommation L112-1/L221-5 posture,
    narrowed so it overstates neither arm): the amount charged never exceeds the CTA total the
    consumer agreed to — today (CLOSED arm) that is enforced as exact equality against the server's
    live HEAD recomputation, drift rejected and re-confirmed rather than charged. That equality
    check on `expectedTotal` is LIVE IN CODE and DEAD ON THE SHIPPED CLIENT: no shipped client sets
    `expected_total` outside a test fixture (`crates/web/src/checkout.rs:610`), so today every
    order is charged AT HEAD, UNVERIFIED against anything the customer was actually shown — #816
    stands open until the quote is verified server-side. D-E — `totalCents` scope: the token signs
    the catalog-lines total, never the full CTA number; the displayed CTA total = lines (bound by
    the token) + live fees (recomputed at verify time); the write side REFUSES when the two
    disagree, and never charges a delta. F4 exact: a HEAD price that has since moved LOWER than the
    quoted lines-total still charges the QUOTED total — verify is a veto, never a re-source (D-F),
    so a pass charges exactly the token's own amount.

    **What this deliverable adds, additive-only in this phase, inert until the quote is verified
    server-side**:
    `expectedTotal` is now DEPRECATED (superseded by the signed `quote`, D-A/D-J) — retired by the
    quote: today no shipped client sends it and the check is dead in production; still checked
    exactly as above for whatever DOES send it, kept nullable for expand/contract, its own deletion
    a later, separate step. `quote` is accepted on the command, structurally, and NEVER READ while
    the write door (`configuration.yaml#/RUN_QUOTE_REQUIRED_ON_PLACE_ORDER`) is CLOSED (default,
    everywhere) — the behaviour above is exactly today's, unconditionally. Once the quote is
    verified server-side and the write door opens: an absent `quote` refuses at the handler (typed, never an SDL non-null violation); a
    present `quote` is verified against `as_of(catalogId, V)` AT THE COORDINATE it names (never
    `at_head` — D-F) — the fold-derived projection may only VETO a price the catalog can no longer
    support or refuse a stale/tampered/foreign quote, NEVER ADD a price, a tax rate or an
    acceptance the fold itself did not produce (the same "projection is a veto, never a source"
    posture ADR-20260906-154419 D2 states for the read side, restated here for the write side); the
    `expectedTotal` equality check and `errors.yaml#/PriceMismatch` are retired TOGETHER with that
    same change, replaced by `errors.yaml#/QuoteNoLongerHonoured` (the ONE business refusal for a
    cart edited after minting or an expired quote) plus the ADR-20260810-112836 §6 technical path
    for every structural cause (forged signature, a foreign cart's quote, a retired key, a
    coordinate beyond the stream's own head) — the customer sees ONE cause-neutral screen for the
    whole set, D-D.

CheckoutPricesCartCreatesPaymentIntent:
  description: >
    Checkout reads the open cart's money-free lines, prices them from the live catalog (price_cart),
    and creates a Stripe PaymentIntent; it is rejected on paused restaurant / empty cart / missing or
    out-of-area address / declined payment. ORDERABILITY IS RE-DERIVED AT CHECKOUT, never inherited
    from the moment the line was added: every cart line is re-validated against the LIVE catalog for
    availability (OfferUnavailable), tracked stock covering its quantity (InsufficientStock) and a
    still-valid option selection (InvalidOptionSelection), strictly BEFORE the payment call so a
    refusal can never strand a Stripe hold. Pricing alone is not this check — it fails closed only on
    a line that LEFT the catalog, while an offer the kitchen 86'd between adding and paying still
    resolves a price; without the re-check that order is accepted and the ticket lands on a pass that
    has none. Untracked stock (no quantity) never blocks — untracked is not zero (availability ≠
    stock; orderable = AVAILABLE and stock > 0).

CheckoutRefusesOnlyOutsideServiceHours:
  description: >
    PlaceOrder refuses on service hours ONLY at verdict OUTSIDE_HOURS
    (errors.yaml#/OutsideServiceHours, carrying the next opening slot and the evaluated
    window/timezone/instant as evidence); OPEN and HOURS_UNDECLARED both ACCEPT — a deliberately
    activated restaurant with no declared hours takes orders (DECISIONS §43 fourth amendment:
    refusing over missing seed data is the worse failure, and a zero-order graph is
    indistinguishable from "no demand"). Every accepted checkout freezes the verdict evidence onto
    the CheckoutSnapshot regardless of the enforcement gate
    (configuration.yaml#/ENFORCE_SERVICE_HOURS_GUARD, default OFF = shadow), so the log can prove
    what was known at acceptance; a snapshot frozen BEFORE the evidence existed still materializes
    its order (the fields are optional forever).

OrderTestModeIsolation:
  description: "Test-mode isolation (ADR-0038): a production (LIVE) order is rejected against a TEST restaurant, so real customers never reach test data; a TEST order MAY target a LIVE restaurant to validate the real receipt path, and TEST orders/deliveries are excluded from payouts and analytics."


# --- RefundProcess (restaurant- or admin-approved) ---
RefundOnRejectionOrCancellation:
  description: "When a paid order is rejected, cancelled, or a refund is requested, a refund is opened as PENDING_APPROVAL for a restaurant/admin decision; nothing is refunded without approval."

PendingRefundVisibleUntilDecided:
  description: "A refund opened for decision is recorded as a domain fact (RefundOpened on the Payment) and stays visible in the refund queue (pendingRefunds) as REQUESTED until an explicit decision resolves it; the decision and the Stripe settlement update its status (APPROVED/DENIED, then REFUNDED) instead of dropping it."

RestaurantDispatchBypassesRouting:
  description: "A RESTAURANT-dispatch order (RestaurantDispatchMode RESTAURANT) is never offered to a delivery channel: the dispatch run short-circuits to SELF_DISPATCHED and Captain only tracks the delivery, while the restaurant drives its progress and the customer still gets order tracking (#60)."


# --- Reclamations / customer claims (#151) ---
ReclamationIsUniquePerId:
  description: "A reclamation is opened once per reclamationId; opening a claim with an already-used id is rejected (#151)."

OnlyOpenReclamationsAreDecided:
  description: "A reclamation can be resolved or rejected only while it is OPEN; deciding one that is not open is rejected (#151)."

ReclamationRejectionCarriesAReason:
  description: "Rejecting a reclamation requires a non-empty reason; a rejection without one is rejected (#151)."

PartialRefundResolutionCarriesAnAmount:
  description: "Resolving a reclamation as PARTIAL_REFUND requires a refund amount; a partial refund without one is rejected (#151)."

OnlyDecidedReclamationsCanBeReopened:
  description: "Only a decided (resolved or rejected) reclamation can be reopened; reopening an open reclamation is rejected (#151)."

ReclamationEvidenceTargetsAnExistingClaim:
  description: "Evidence (an attachment ref) can only be attached to an existing reclamation; attaching to a claim that was never opened is rejected (#156)."

GoodwillCreditGrantedOnResolution:
  description: "When a reclamation is resolved as GOODWILL_CREDIT, the ReclamationProcess saga grants the claimant store credit for the recorded amount (#158)."

ReplacementOrderPlacedOnResolution:
  description: >
    When a reclamation is resolved as REPLACEMENT, a no-charge replacement order is placed with the SAME
    line items as the original, a $0 buyer total and no payment (no Stripe PaymentIntent), linked to the
    original via OrderPlaced.replacementOf — so it enters the normal fulfilment/dispatch flow. Idempotent
    per reclamationId: a re-delivered resolution never places a second replacement (#159, ADR-20260726-171736).

RefundSettledOnResolution:
  description: >
    When a reclamation is resolved as FULL_REFUND or PARTIAL_REFUND, the ReclamationProcess drives the
    EXISTING refund path (RefundProcess) to a settled Stripe refund — the restaurant's resolution IS the
    approval, so the refund settles without a separate manual ApproveRefund. FULL_REFUND refunds the
    order's captured total; PARTIAL_REFUND refunds the recorded amount. RefundProcess remains the single
    Stripe-driving mechanism (no parallel money path). Idempotent per reclamationId: a re-delivered
    resolution never opens or settles a second refund (#207, ADR-20260727-090000).

RefundResolutionCappedAtCaptured:
  description: >
    A refund resolution can never refund more than the order's captured total; a PARTIAL_REFUND amount
    over the captured total is rejected before any Stripe refund is driven (#207).


# --- Order retention & deletion (GDPR pilot: ADR-20260731-153000/-160000/-214500, #272) ---
TerminalOrderSchedulesItsExpiry:
  description: >
    Every order reaching a terminal state (delivered, rejected or cancelled) schedules its
    OrderExpired reminder ORDER_RETENTION_WINDOW_DAYS out. One pending expiry per order — the
    deterministic reminder identity guarantees it: a later terminal fact postpones the SAME
    scheduled row in place, it never duplicates it (ADR-20260731-150500, #272).

OrderExpiryIsRecordedNeverRejected:
  description: >
    Delivering the due OrderExpired reminder records the fact with record semantics: Recorded the
    first time, a benign no-op when the order is already expired — a retention deadline's passage
    cannot be refused, so REJECTED is not a possible verdict for this delivery
    (ADR-20260731-153000 §1a, #272).


# --- Acceptance timeout (#167, ADR-20260808-195315 §1.3) ---
UnacceptedOrderIsCancelledByTimeoutAndNeverCharged:
  description: >
    A paid order that nobody accepts is never left sitting forever: if it is still PLACED when
    the acceptance deadline (ORDER_ACCEPTANCE_TIMEOUT_SECONDS past birth — both births, including
    the $0 replacement, whose first deadline wins: reschedule keep) is delivered, the timeout is
    recorded and the order moves PLACED -> CANCELLED_BY_TIMEOUT, a terminal state that also starts
    the GDPR retention clock. The customer is never charged on this path: capture happens on
    fulfilment (ADR-20260808-195315 §1.2), so the downstream payment leg RELEASES the
    authorization — release, not refund. Enforcement is gated (ENFORCE_ACCEPTANCE_TIMEOUT, read
    at delivery time): while OFF the identical guard runs in shadow and only the append is inert.

AcceptanceTimeoutOnlyCancelsAStillPlacedOrder:
  description: >
    The timeout delivery is record-semantics, never a rejection, and it cancels ONLY an order
    that is still PLACED: an order accepted, rejected or cancelled before the deadline fires
    absorbs the delivery as a benign no-op (the race is lost by design — cancel_scheduled loses
    to promotion, so the still-PLACED guard is the real protection), and a redelivered timeout
    on an already timed-out order is a duplicate no-op (#167).
