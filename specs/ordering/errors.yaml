version: 1
description: >
  ordering scope — errors fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `errors.yaml` catalog; $refs stay kind-logical
  (`errors.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


RestaurantPaused:
  description: "Restaurant acceptance mode is PAUSED; it cannot take orders."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
  messages:
    en: "'{restaurantName}' is not taking orders right now."
    fr: "'{restaurantName}' ne prend pas de commandes pour le moment."


# =====================================================================
# Availability & stock (shared by cart and checkout)
# =====================================================================

OfferUnavailable:
  description: "Offer availability is UNAVAILABLE (manual flag)."
  context:
    offerId: { $ref: 'scalars.yaml#/OfferId' }
    productName: { $ref: 'scalars.yaml#/ProductName' }
    offerName: { $ref: 'scalars.yaml#/OfferName' }
  messages:
    en: "'{productName}' ({offerName}) is currently unavailable."
    fr: "'{productName}' ({offerName}) est actuellement indisponible."


InsufficientStock:
  description: "Requested quantity exceeds available stock."
  context:
    offerId: { $ref: 'scalars.yaml#/OfferId' }
    productName: { $ref: 'scalars.yaml#/ProductName' }
    offerName: { $ref: 'scalars.yaml#/OfferName' }
    requested: { $ref: 'scalars.yaml#/Quantity' }
    available: { $ref: 'scalars.yaml#/Quantity' }
  messages:
    en: "Only {available} left of '{productName}' ({offerName}), but {requested} were requested."
    fr: "Il ne reste que {available} de '{productName}' ({offerName}), mais {requested} ont été demandés."


QuantityExceedsLimit:
  description: "Requested quantity exceeds the per-line maximum."
  context:
    offerId: { $ref: 'scalars.yaml#/OfferId' }
    productName: { $ref: 'scalars.yaml#/ProductName' }
  messages:
    en: "You can't order that many of '{productName}'."
    fr: "Vous ne pouvez pas commander autant de '{productName}'."


InvalidOptionSelection:
  description: "A selected option does not belong to the offer, or violates the option list's min/max."
  context:
    offerId: { $ref: 'scalars.yaml#/OfferId' }
    productName: { $ref: 'scalars.yaml#/ProductName' }
  messages:
    en: "Invalid option selection for '{productName}'."
    fr: "Sélection d'options invalide pour '{productName}'."


# =====================================================================
# Cart
# =====================================================================

CartNotFound:
  description: "No cart with this id."
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
  messages:
    en: "Cart not found."
    fr: "Panier introuvable."


CartNotOpen:
  description: "Cart is not OPEN (already checked out)."
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
    status: { $ref: 'scalars.yaml#/CartStatus' }
  messages:
    en: "This cart can no longer be modified."
    fr: "Ce panier ne peut plus être modifié."


CartRestaurantMismatch:
  description: "Line/checkout restaurant differs from the cart's restaurant (no mixing)."
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
  messages:
    en: "Your cart already has items from another restaurant, not '{restaurantName}'."
    fr: "Votre panier contient déjà des articles d'un autre restaurant que '{restaurantName}'."


CartLineNotFound:
  description: "No line with this id in the cart."
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
    cartLineId: { $ref: 'scalars.yaml#/CartLineId' }
  messages:
    en: "This cart line no longer exists."
    fr: "Cette ligne du panier n'existe plus."


CartEmpty:
  description: "Checkout attempted on an empty cart."
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
  messages:
    en: "Your cart is empty."
    fr: "Votre panier est vide."


# =====================================================================
# Order
# =====================================================================

OrderNotFound:
  description: "No order with this id."
  context:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  messages:
    en: "Order not found."
    fr: "Commande introuvable."


InvalidOrderStatus:
  description: "Order is not in a status that allows this transition."
  context:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    currentStatus: { $ref: 'scalars.yaml#/OrderStatus' }
  messages:
    en: "This action is not allowed while the order is '{currentStatus}'."
    fr: "Cette action n'est pas autorisée tant que la commande est '{currentStatus}'."


OrderAlreadyRated:
  description: "The delivery (rider thumb) has already been rated for this order; final."
  context:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  messages:
    en: "You have already rated this delivery."
    fr: "Vous avez déjà noté cette livraison."


RestaurantAlreadyRated:
  description: "The restaurant has already been rated for this order; final (one per order)."
  context:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  messages:
    en: "You have already rated the restaurant for this order."
    fr: "Vous avez déjà noté le restaurant pour cette commande."


DeliverySatisfactionAlreadyRecorded:
  description: "The delivery-delay satisfaction survey has already been answered for this order; final (one per order)."
  context:
    orderId: { $ref: 'scalars.yaml#/OrderId' }
  messages:
    en: "You have already answered the delivery survey for this order."
    fr: "Vous avez déjà répondu au questionnaire de livraison pour cette commande."


InvalidTipRecipient:
  description: "The tipper cannot tip this recipient (e.g. a restaurant tipping itself)."
  context:
    tippedBy: { $ref: 'scalars.yaml#/Tipper' }
    recipient: { $ref: 'scalars.yaml#/TipRecipient' }
  messages:
    en: "You can't send a tip to this recipient."
    fr: "Vous ne pouvez pas envoyer de pourboire à ce destinataire."


DeliveryAddressRequired:
  description: "serviceType is DELIVERY but no delivery address was provided."
  context: {}
  messages:
    en: "A delivery address is required for delivery."
    fr: "Une adresse de livraison est requise pour la livraison."


OutsideDeliveryArea:
  description: "Delivery address is outside the restaurant's delivery area."
  context:
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
  messages:
    en: "This address is outside the delivery area of '{restaurantName}'."
    fr: "Cette adresse est en dehors de la zone de livraison de '{restaurantName}'."


# RSO-1 (DECISIONS §43): the TEMPORAL sibling of OutsideDeliveryArea (spatial boundary → temporal
# boundary, same `Outside*` family) — deliberately NOT `RestaurantClosed`, which would collide with
# the PERMANENT closure vocabulary (events.yaml#/RestaurantMarkedClosed → INACTIVE).
OutsideServiceHours:
  description: >
    PlaceOrder arrived at an instant outside the restaurant's declared service hours — thrown ONLY
    on verdict OUTSIDE_HOURS (rules.yaml#/CheckoutRefusesOnlyOutsideServiceHours: OPEN and
    HOURS_UNDECLARED both accept), and only while configuration.yaml#/ENFORCE_SERVICE_HOURS_GUARD
    is ON (default OFF = shadow). The context carries the NEXT OPENING SLOT (the actionable half of
    the message — "closed, opens tomorrow 11:30" is a different product from "closed") AND the
    refusal EVIDENCE: the window and timezone the verdict was evaluated against plus the evaluation
    instant, so a disputed refusal is provable from the record. Copy note: never phrase this as a
    refund/no-refund statement — the perishables withdrawal exemption is not a non-performance
    posture.
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
    nextOpensAt:
      type: string
      format: date-time
      nullable: true
      description: "Next opening instant (null only when the declared week holds no future slot)."
    windowFrom:
      type: string
      format: date-time
      nullable: true
      description: "Evidence: start instant of the nearest window the instant was judged against (null when the evaluated day has none)."
    windowTo:
      type: string
      format: date-time
      nullable: true
      description: "Evidence: end instant of that window — min(door-close, cutoff), the same number serviceWindow.lastOrderAt displays."
    timezone: { $ref: 'scalars.yaml#/TimeZone' }
    evaluatedAt:
      type: string
      format: date-time
      description: "Evidence: the injected request instant the verdict was evaluated at."
  messages:
    en: "'{restaurantName}' is closed right now — it opens again at {nextOpensAt}."
    fr: "'{restaurantName}' est fermé pour le moment — réouverture à {nextOpensAt}."


# =====================================================================
# Payment
# =====================================================================

PaymentDeclined:
  description: "Stripe declined the payment synchronously at checkout (no order placed)."
  context: {}
  messages:
    en: "Payment was declined."
    fr: "Le paiement a été refusé."


QuoteNoLongerHonoured:
  description: >
    WIRED IN CODE (ADR-20260906-192007 D-D/D-F/D-G, PROP-20260831-134539 slice 3b): the write-side
    verify guard (`application::quote::verify_quote`, `application::commands::place_order`'s
    pre-payment block) throws this for the ONE business cause in the refusal set, in exactly two
    forms, both collapsed to the SAME structural fact the signed quote's own binding makes
    checkable: the cart was edited after the quote was minted (the token binds a digest of the
    cart's own repricing inputs, so an edit is a content mismatch the moment the two differ — see
    `application::quote`'s module doc for why this is a content digest rather than the cart's raw
    stream version), and expiry (QUOTE-STALENESS, 30 min). Replaces `errors.yaml#/PriceMismatch`
    (deleted in the same change): repurposing it instead was refused (evans) — its copy ("Prices
    have changed…") is false for the structural refusal causes the new refusal set enumerates.
    Quiet in telemetry (`DomainError::Rejected`, never loud like the structural refusals, which
    reject with `errors.yaml#/QuoteVerificationFailed` instead and never reach this error at all).
    `context: { cartId }` ONLY — no amount, no delta, no currency, no cause. MUST NOT: an amount,
    an old→new pair, a delta, a currency figure, a countdown, refund/bank-date language, or the
    word "price" in a way that implies one changed for causes that never were a price change. The
    CTA reuses `checkout.payment_failed.back_to_cart` — no new CTA, no retry control. Messages
    below are ux's DRAFT for counsel review (CQ-7, never clearance) — not yet legally cleared copy.

    DECLARED but DSL-UNWIRED (no `throws:` reference in actors.yaml/processmanager.yaml, a KNOWN
    GAP, not an oversight): both causes need a REAL, signature-valid token minted against a
    specific cart/catalog state to reach at all, which `tests.yaml`'s static fixtures cannot
    express, and `noTestFixturePossible: true`'s justification is hard-restricted to the
    `readOnlyCatchAll` class (`error-exemption-unjustified`, #639 part C step 4-i round 3 item 1)
    — a class this error does not belong to. Pinned instead by NAMED Rust unit tests
    (`application::commands::tests::a_cart_edited_after_the_mint_is_refused_with_quote_no_longer_honoured`
    and its `_expired` sibling) that call `place_order` directly with a real, minted-then-mutated
    quote. Closing this gap needs either a validator extension (a second, equally-justified
    exemption class for signature-bearing fixtures) or a `tests.yaml` mechanism that can mint a
    token at test-generation time — flagged for the architect, not resolved here.
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
  messages:
    en: "We couldn't confirm your total. Your card was not charged and no authorization was taken. Your basket is intact — open it to see current prices and order again."
    fr: "Nous n'avons pas pu confirmer votre total. Votre carte n'a pas été débitée et aucune autorisation n'a été prise. Votre panier est intact — ouvrez-le pour voir les prix actuels et commander à nouveau."


QuoteVerificationFailed:
  description: >
    WIRED (ADR-20260906-192007 D-D i/iii, D-F/D-G): the ONE structural/technical error for every
    verify-guard refusal cause OTHER than `QuoteNoLongerHonoured`'s two — an ABSENT `quote` when
    the write door is open (D-A; genuinely tests.yaml-coverable, no signature needed, see
    `tests.yaml#/TestPlaceOrderRejectsQuoteVerificationFailed`), a forged signature, an
    unknown/retired `keyId`, a quote naming a different cart/restaurant/catalog than the command's
    live state, a coordinate absent or beyond the live stream head, or a fold read failure. Rejects
    on the ADR-20260810-112836 §6 technical path (LOUD in telemetry — the `quote.verify` span
    marked ERROR with `business.failure_reason` recording which of these fired; never on the
    customer-facing copy, which is identical to `QuoteNoLongerHonoured`'s — the customer sees ONE
    cause-neutral screen for the whole refusal set). `context: { cartId }` only — no signature, no
    key material, no token bytes anywhere in the context (D-I's spy-binary concern). The
    signature/keyId/foreign-cart/coordinate-beyond-head causes share this SAME code with the
    absent-quote cause but are pinned by NAMED Rust unit tests, not `tests.yaml`, for the same
    reason `QuoteNoLongerHonoured` names above (`application::commands::tests::
    a_forged_signature_refuses_with_quote_verification_failed` and its siblings). Messages below
    are ux's DRAFT for counsel review (CQ-7, never clearance) — not yet legally cleared copy, the
    SAME posture `QuoteNoLongerHonoured`'s copy states (checkpoint 2, legal item D: this
    description previously omitted the marker its sibling error already carried).
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
  messages:
    en: "We couldn't confirm your total. Your card was not charged and no authorization was taken. Your basket is intact — open it to see current prices and order again."
    fr: "Nous n'avons pas pu confirmer votre total. Votre carte n'a pas été débitée et aucune autorisation n'a été prise. Votre panier est intact — ouvrez-le pour voir les prix actuels et commander à nouveau."


PriceUnresolvable:
  description: >
    A cart line's price could not be resolved from the live catalog at checkout (offer or selected
    option no longer present). Fail-closed: the checkout is rejected — the server never falls back
    to a client-supplied amount.
  context:
    cartId: { $ref: 'scalars.yaml#/CartId' }
    offerId: { $ref: 'scalars.yaml#/OfferId' }
  messages:
    en: "An item in your cart is no longer available at a known price. Please review your cart."
    fr: "Un article de votre panier n'a plus de prix connu. Veuillez vérifier votre panier."


CannotOrderTestRestaurant:
  description: >
    A production (LIVE) order was placed against a TEST restaurant (ADR-0038 test-mode isolation). Real
    customers never reach test data; a TEST order may instead target a LIVE restaurant (receipt validation).
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "This restaurant is not available."
    fr: "Ce restaurant n'est pas disponible."


# --- Reclamations / customer claims (#151) ---

ReclamationAlreadyExists:
  description: >
    OpenReclamation targeted a reclamationId that already exists; the birth is idempotent-guarded, so a
    second open is rejected (rules.yaml#/ReclamationIsUniquePerId) (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "A reclamation already exists with this id."
    fr: "Une réclamation existe déjà avec cet identifiant."


ReclamationNotFound:
  description: >
    Resolve/reject/reopen targeted a reclamation that does not exist; a decision cannot be made before the
    reclamation is opened (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "No reclamation exists with this id."
    fr: "Aucune réclamation n'existe avec cet identifiant."


ReclamationNotOpen:
  description: >
    Resolve or reject targeted a reclamation that is not currently OPEN; only an open reclamation can be
    decided (rules.yaml#/OnlyOpenReclamationsAreDecided) (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "This reclamation is not open."
    fr: "Cette réclamation n'est pas ouverte."


ReclamationNotReopenable:
  description: >
    Reopen targeted a reclamation that is not in a decided (resolved or rejected) state; only a decided
    reclamation can be reopened (rules.yaml#/OnlyDecidedReclamationsCanBeReopened) (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "This reclamation cannot be reopened."
    fr: "Cette réclamation ne peut pas être rouverte."


RejectionReasonRequired:
  description: >
    A reclamation was rejected without a (non-empty) reason; a rejection must record why the claim was
    declined (rules.yaml#/ReclamationRejectionCarriesAReason) (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "A reason is required to reject a reclamation."
    fr: "Un motif est requis pour rejeter une réclamation."


PartialRefundAmountRequired:
  description: >
    A reclamation was resolved as PARTIAL_REFUND without a refund amount; a partial refund must carry the
    amount to refund (rules.yaml#/PartialRefundResolutionCarriesAnAmount) (#151).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
  messages:
    en: "A refund amount is required for a partial refund."
    fr: "Un montant de remboursement est requis pour un remboursement partiel."


RefundExceedsCaptured:
  description: >
    A reclamation resolved as PARTIAL_REFUND asked to refund more than the order's captured total; the
    ReclamationProcess refund arm never refunds more than was captured, so the over-total resolution is
    rejected before any Stripe refund is driven (rules.yaml#/RefundResolutionCappedAtCaptured) (#207).
  context:
    reclamationId: { $ref: 'scalars.yaml#/ReclamationId' }
    orderId: { $ref: 'scalars.yaml#/OrderId' }
    requestedAmountCents: { $ref: 'scalars.yaml#/MoneyCents' }
    capturedAmountCents: { $ref: 'scalars.yaml#/MoneyCents' }
  messages:
    en: "The refund amount exceeds the order's captured total."
    fr: "Le montant du remboursement dépasse le total encaissé de la commande."
