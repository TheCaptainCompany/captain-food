version: 1
description: >
  ordering scope — configuration fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `configuration.yaml` catalog; $refs stay kind-logical
  (`configuration.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

keys:


  ENFORCE_SERVICE_HOURS_GUARD:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The PlaceOrder service-hours guard (RSO-1, DECISIONS §43): ON, a checkout evaluated
      OUTSIDE_HOURS is refused with errors.yaml#/OutsideServiceHours. OFF
      (gate-then-stabilize: PlaceOrder is the money path, and openingHours is already writable via
      UpdateRestaurant and the HubRise/registry imports, so the refuse branch is reachable without
      any new screen) is SHADOW MODE: the verdict is still computed and frozen onto the
      CheckoutSnapshot evidence, it just never refuses. OPEN and HOURS_UNDECLARED accept in BOTH
      positions. The default flips by its own one-line ADR after the shadow form is smoked (the
      RUN_DELETION_ENGINE precedent). The read-side Restaurant.serviceWindow field is NOT gated —
      it is additive and nothing binds acceptance to it.


  ROUTE_ORDER_BIRTH_THROUGH_LANE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: true
    gates: >
      The Order-lane BIRTH routing (#588, ADR-20260816-040239 "deliver: is a lane ENQUEUE, not a
      foreign-stream append"). ON, PlaceOrderProcess's `deliver: OrderPlaced to: Order` step stops
      calling Repository::save on the Order's stream and instead stages a lane ENQUEUE that the
      delivery glue turns into an inbound_messages row INSIDE the same fenced transaction; the
      Order's own lane worker then appends the birth, and it is THAT delivery's Recorded verdict
      the acceptance deadline is keyed on. ON is WHERE THIS KEY STANDS TODAY: the default flipped
      from OFF to ON on 2026-08-30 (ADR-20260830-012200, on the founder's LANE-FLIP answer), so
      every checkout's birth is routed unless somebody sets it OFF. OFF is the LEGACY unrouted
      birth — the saga appends OrderPlaced (and CartCheckedOut) itself and no Order-lane message
      exists — which is where this key started and is NOT "current behaviour": turning it OFF is a
      change, not a no-op. What the ROUTED position does differently from the legacy one, stated
      plainly (and therefore what setting it OFF gives back): (a) the birth gains one lane hop of
      latency after the payment authorization commits — the order is still accepted
      acceptance-first, but the OrderPlaced row appears a beat later; (b) the birth's ENVELOPE
      changes — user_id/user_type and cause_id come from the mailbox row rather than the saga's
      system actor (no fold, view or projector reads either, verified in the ADR §2, and stored
      rows are NEVER backfilled); (c) one aggregate per transaction on the checkout saga's most
      expensive leg, where the legacy position writes Order-{id} and Cart-{id} in one; (d) the
      acceptance clock arms at all, which is precondition (5a) of ENFORCE_ACCEPTANCE_TIMEOUT below.
      ROLLBACK IS A FLIP, NOT A REDEPLOY: set it OFF and the next delivery appends the legacy way;
      already-routed births stay as they are (reversible in code, not in state — those rows exist).
      Both the monolith and any standalone worker fleet MUST read the same value; a split fleet
      would route some births and append others. The flip WAS its own recorded decision
      (ADR-20260830-012200), and it is scoped to the Order/OrderPlaced pair alone — the other
      twelve deliver: steps keep the legacy append until each is moved by its own record.

  ROUTE_REPLACEMENT_BIRTH_THROUGH_LANE:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The REPLACEMENT-order birth routing (#595, ADR-20260829-230418 chunk C2). ON,
      ReclamationProcess's REPLACEMENT arm stops CALLING the PlaceReplacementOrder handler
      in-process and instead stages a COMMAND lane enqueue that the polling runner's fenced leg
      transaction turns into an inbound_messages row; the Order's own lane worker then runs the
      command and appends the birth, and it is THAT delivery which (re)declares the
      OrderAcceptanceTimedOut reminder the spec already promises for `Order`/`PlaceReplacementOrder`.
      OFF is today's behaviour byte for byte: the saga writes Order-{id} itself,
      with no transaction and no lane, and the replacement order's acceptance clock never arms.
      This is a SEPARATE key from ROUTE_ORDER_BIRTH_THROUGH_LANE on purpose (farley,
      ADR-20260829-230418 C3): one fused flag would flip unrelated routes together, which is exactly
      the un-flippable blast radius a per-route gate exists to avoid. What flipping it CHANGES: (a)
      the replacement birth gains one lane hop of latency after the resolution is recorded; (b) the
      birth's ENVELOPE changes -- user_id/user_type and cause_id come from the mailbox row rather
      than the saga's system actor, and stored rows are NEVER backfilled; (c) the door becomes a
      COMMAND row, so an OrderNotFound rejection lands a REJECTED verdict on a supervisable row
      instead of a `tracing::warn!` nobody routes; (d) the version-conflict retry path disappears --
      the lane serialises the Order's writer, so there is no concurrent saga append to lose a race
      to. ROLLBACK IS A FLIP, NOT A REDEPLOY: set it OFF and the next resolution takes the legacy
      in-process call; already-routed births stay as they are. Flipping the default is a SEPARATE
      recorded decision, and the legacy arm is deleted in a SEPARATE change again, with golden
      payload equality as its precondition (beck).

  ORDER_ACCEPTANCE_TIMEOUT_SECONDS:
    type: int
    unit: seconds     # typed duration unit (#167) — the emitters branch on THIS, never on the name
    default: 300
    gates: >
      The acceptance deadline (#167, ADR-20260808-195315 §1.3): a paid order still PLACED this
      many seconds after birth records OrderAcceptanceTimedOut (PLACED -> CANCELLED_BY_TIMEOUT;
      the payment leg RELEASES the authorization — capture-on-fulfilment means the customer was
      never charged, no refund machinery on this path). Honest precision: the cancellation lands
      at due + up to ~60 s promotion slop (the pass runs on the worker heartbeat — 10 s cadence,
      60 s while push is live) + head-of-line drain on the order's lane, so 300 means "within
      roughly five to six minutes", which is the right grain for a restaurant SLA. Scheduled with
      `reschedule: keep`: a redelivered birth fact never extends the deadline. The window is read
      at delivery via Config::reminder_windows(); the key must ALWAYS be wired — gate-OFF is
      ENFORCE_ACCEPTANCE_TIMEOUT=false, never an absent key (a missing window aborts every
      delivery on the Order lane for retry, by design). Per-restaurant override is a recorded
      later step (§1.3), not this key.

  ENFORCE_ACCEPTANCE_TIMEOUT:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    gates: >
      The #167 acceptance-timeout ACTION gate (gate-then-stabilize; the ENFORCE_SERVICE_HOURS_GUARD
      pattern): ON, a due OrderAcceptanceTimedOut delivery whose order is still PLACED appends the
      cancellation. OFF is SHADOW MODE: scheduling, firing and the FULL
      still-PLACED guard all run on the identical code path; only the append is inert, the
      delivery lands Ignored, and the would-cancel decision is exported as OTLP shadow evidence
      (specs/observability.yaml#/acceptance-timeout). OFF is a first-class value, never an absent
      key. The flip is a separate one-line ADR gated on FIVE preconditions: (1) the
      payment-release leg reacting to OrderAcceptanceTimedOut (behind PR #566's answers work),
      (2) the customer notice (comms), (3) shadow evidence from the reminder.promote span, AND
      (4) the time-to-accept distribution — business_metrics.yaml#/metrics/time_to_accept_ms,
      p50/p90/p99 by daypart AND restaurantId — live and read, because the TTL must be CHOSEN
      from how long real restaurants actually take per daypart, never guessed: a 300 s deadline
      that cancels a quarter of Friday-dinner orders at a slow-but-honest kitchen is a product
      decision made blind. AND (5) a production PRODUCER for the Order-lane birth message — issue
      #588, "the normal checkout path never enqueues OrderPlaced onto the Order lane". This
      precondition is TWO distinct flips, split on purpose (#758, ADR-20260829-230418 C1a — the
      earlier fused wording priced them as one): (5a) the ROUTING default flip —
      ROUTE_ORDER_BIRTH_THROUGH_LANE above — is DONE: it was flipped ON on 2026-08-30
      (ADR-20260830-012200) on the founder's LANE-FLIP answer, licensed by births observed on the
      birth-lag histogram (specs/observability.yaml#/place-order) in the WALK stack; "walk stack,
      not production" was a READING of the suspended-production reality (ADR-20260817-105844:
      production stays suspended on purpose and the first end-to-end reading happens locally, on
      one database — a reading, never a certificate). The checkout path therefore now enqueues the
      birth onto the Order lane, so an acceptance clock IS armed for a real order and precondition
      (3)'s shadow evidence can accumulate at all — which it could not while the routing default
      was OFF, when a flip on an unarmed clock would have changed nothing while reading as shipped.
      (5b) the ACCEPTANCE-TIMEOUT flip — THIS key's own — still waits on production time-to-accept
      distributions (precondition (4)), which no walk can produce: the TTL is chosen from how long
      real restaurants take per daypart, and that number only exists once real orders flow. (5a)
      was FIRST in dependency order even though it is listed last. Second producer, its own gate:
      the REPLACEMENT-order birth is no longer unlaneable — #595 gave the polling runner a fenced
      leg transaction and put the replacement birth behind ROUTE_REPLACEMENT_BIRTH_THROUGH_LANE
      above, whose OFF position keeps the legacy in-process call and therefore keeps a replacement
      order's clock unarmed. That key's own flip is what arms it, and it is a separate recorded
      decision from this one. The flip is PROSPECTIVE only: occurrences
      fired-and-absorbed while OFF are spent, nobody synthesizes timeouts for orders already past
      the TTL.

  ORDER_RETENTION_WINDOW_DAYS:
    type: int
    unit: days        # typed duration unit (#167) — the emitters branch on THIS, never on the name
    default: 3650
    gates: >
      The Order deletion pilot's retention window (ADR-20260731-153000/-160000, #272): a terminal
      order schedules its OrderExpired reminder this many days out; recording the delivered fact
      starts the deletion journey (tombstone -> stream deletion -> OrderDeleted receipt). ONE
      window for now, set to the conservative accounting horizon (~10 years) because the
      per-data-category split (personal vs financial retention, a legal/product input) is still
      open — shortening it below the accounting horizon before that split lands would delete
      financial facts French commercial law retains. Rescheduling is safe: changing this value
      re-declares each order's reminder IN PLACE at the next terminal fact, and the deletion
      engine re-reads it at delivery.

  # PROP-20260831-134539 slice 3a of "the priced quote token" ([#816
  # "Display/charge divergence is undetected"](https://github.com/TheCaptainCompany/captain-food/issues/816)),
  # ADR-20260906-154419-the-priced-read-is-served-from-the-fold-and-carries-its-coordinate-behind-a-door
  # (D2/D4, consent farley/vernon/young/beck/dba/business/holub/ux/graphql/observability/evans/legal
  # by ADR-20260904-013834). Placed HERE, in the `ordering` scope fragment, per the DSL placement
  # rule (ADR-20260807-183024 D1): the key's HANDLING actor is the cart READ seam
  # (`crates/server/src/graphql/cart_read.rs::priced`), which resolves `Cart` — an ordering-owned
  # entity — never a catalog- or common-scope concern.
  RUN_FOLD_PRICED_CART_READ:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    runKind: door
    decisionRow: QUOTE-MINT-PRECONDITIONS
    gates: >
      The priced-read mint (PROP-20260831-134539 slice 3a, D2/D4): ON, `cart.current`/`cart`/`carts`
      price the cart from `AsOfPriceAuthority::at_head` — ONE unbounded range read of the
      `Catalog-<id>` stream, returning `(AsOfCatalog, CatalogVersion)` as ONE value, never a second
      read and never a caller-supplied expectation to check against. The coordinate is
      server-carried only in this slice: it travels inside the read and is DROPPED at the reply
      boundary — no `catalogVersion` field, no input, no entities.yaml property (D3; the published
      `quote` word is slice 3b's). OFF is NOT a fallback of a failed fold: it is TODAY'S read,
      stated explicitly as the closed arm — `CatalogSnapshot::load` + `price_cart` against the live
      catalog PROJECTION, exactly as it has always run, carrying no coordinate. A fold failure with
      the door OPEN (the coordinate absent, the stream unreadable, or over the request deadline) is
      `technical_error` through the EXISTING unresolvable-at-read path
      (`errors.yaml#/PriceUnresolvable`'s sibling classification, ADR-20260810-112836 §6) — NEVER a
      HEAD/projection fallback, and never presented as a price change. `decisionRow` binds this key
      to `docs/decisions/QUOTE-MINT-PRECONDITIONS.yaml` (open): the phase-0 latency budget, the
      observability contract rows (incl. `payload_bytes`), the walk drill, 3b's signed quote, and
      dba's preconditions (content-hash import suppression landed, the buffer-cache instrument
      named) all gate the flip. `declare_flag` at BOTH composition roots
      (`crates/server/src/lib.rs`, `crates/infrastructure/src/mailbox/standalone.rs`) is the
      fleet-parity evidence (ADR-20260905-223957 §5, ADR-20260906-113444) — the standalone root's
      line is the PRE-RECORDED carve-out of ADR-20260904-081527 §8's standing clause, since this key
      is a `runKind: door` newly introduced.
    deploy:
      production: "false"
      staging: "false"
