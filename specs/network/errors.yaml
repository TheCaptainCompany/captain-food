version: 1
description: >
  network scope — errors fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `errors.yaml` catalog; $refs stay kind-logical
  (`errors.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# =====================================================================
# Restaurant
# =====================================================================

RestaurantAccountNotFound:
  description: "No restaurant account with this id (e.g. registering a location under a missing account)."
  context:
    restaurantAccountId: { $ref: 'scalars.yaml#/RestaurantAccountId' }
  messages:
    en: "Restaurant account not found."
    fr: "Compte restaurant introuvable."


SlugAlreadyTaken:
  description: >
    Another restaurant already holds this slug. Includes a label a restaurant RELEASED by renaming:
    released labels stay reserved so their 301 redirect cannot be hijacked (ADR-20260728-011344).
  context:
    slug: { $ref: 'scalars.yaml#/Slug' }
  messages:
    en: "The address '{slug}' is already taken."
    fr: "L'adresse '{slug}' est déjà utilisée."


SlugNotConfigured:
  description: >
    The restaurant has no storefront address yet, so it cannot be activated — customers would have no
    host to reach it on (ADR-20260728-011344). Aggregate-local: the fold sees whether
    RestaurantSlugConfigured ever landed, so no read model is consulted.
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "Choose your storefront address before going live."
    fr: "Choisissez l'adresse de votre boutique avant la mise en ligne."


RefAlreadyUsed:
  description: "The external reference (idempotent import key) is already owned by another aggregate."
  context:
    ref: { $ref: 'scalars.yaml#/ExternalReference' }
  messages:
    en: "The reference '{ref}' is already in use."
    fr: "La référence '{ref}' est déjà utilisée."


InvalidCurrency:
  description: "Currency is not a valid ISO 4217 code."
  context:
    currency: { $ref: 'scalars.yaml#/CurrencyCode' }
  messages:
    en: "'{currency}' is not a valid currency."
    fr: "'{currency}' n'est pas une devise valide."


# (RestaurantAlreadyActive removed: ActivateRestaurant is idempotent — re-activating is a no-op, not an error.)

RestaurantNotActive:
  description: "Operation requires an ACTIVE restaurant."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
  messages:
    en: "The restaurant '{restaurantName}' is not active."
    fr: "Le restaurant '{restaurantName}' n'est pas actif."


RestaurantNotReadyForActivation:
  description: "Activation requires at least one catalog with one orderable offer."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
  messages:
    en: "Add at least one orderable product before activating '{restaurantName}'."
    fr: "Ajoutez au moins un produit commandable avant d'activer '{restaurantName}'."


AcceptanceModeUnchanged:
  description: "Requested acceptance mode equals the current one."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
    restaurantName: { $ref: 'scalars.yaml#/RestaurantDisplayName' }
    mode: { $ref: 'scalars.yaml#/OrderAcceptanceMode' }
  messages:
    en: "'{restaurantName}' is already in '{mode}' mode."
    fr: "'{restaurantName}' est déjà en mode '{mode}'."


# --- Restaurant listing & pre-registration (ADR-0019/0021) ---

ListingAlreadyClaimed:
  description: "The restaurant listing has already been claimed by an owner."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "This restaurant listing has already been claimed."
    fr: "Cette fiche restaurant a déjà été revendiquée."


ListingOwnershipNotVerified:
  description: "Could not verify ownership of the listing (Google Business Profile proof rejected)."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "We couldn't verify that you own this restaurant. Please confirm via your Google Business Profile."
    fr: "Nous n'avons pas pu vérifier que ce restaurant vous appartient. Confirmez via votre fiche Google Business Profile."


GbpOrderLinkNotConfigured:
  description: "No Google Business Profile 'Order online' link is configured to verify."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "Configure the Google 'Order online' link before verifying it."
    fr: "Configurez le lien Google « Commander en ligne » avant de le vérifier."


# --- Prospection (ADR-0020) ---

ProspectContactLimitReached:
  description: "The prospect already received the maximum number of outreach contacts (anti-spam: ≤ 3)."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "This prospect has already been contacted the maximum number of times."
    fr: "Ce prospect a déjà été contacté le nombre maximum de fois."


ProspectContactedTooRecently:
  description: "A new contact is too soon after the previous one (anti-spam: ≥ 7 days apart)."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "This prospect was contacted too recently; wait before contacting again."
    fr: "Ce prospect a été contacté trop récemment ; patientez avant de le recontacter."


ProspectNotFound:
  description: "No prospect (contact history) exists for this restaurant."
  context:
    restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "Prospect not found."
    fr: "Prospect introuvable."


# --- Staff authentication: the RestaurantMembership aggregate (#639 part C step 6-i,
# ADR-20260905-101349 §1-§7) -------------------------------------------------------------------

MemberAccessGrantDoorClosed:
  description: >
    The grant door is closed by `configuration.yaml#/keys/RUN_MEMBER_ACCESS_GRANT` (#639 part C
    step 6-i, ADR-20260905-101349 §6) -- a declared, supervisable refusal while the preconditions
    (`docs/decisions/MEMBER-ACCESS-GRANT-PRECONDITIONS.yaml`) are open, never a silent no-op. The
    first hand-provisioned grant about a real Tours human is the irreversible moment that starts
    every legal clock, so the store is never touched while this is off.
  context:
    scopeId: { $ref: 'scalars.yaml#/RestaurantId' }
  messages:
    en: "Granting restaurant access is not yet enabled in this environment."
    fr: "L'octroi d'accès restaurant n'est pas encore activé dans cet environnement."


AccessBasisNotYetAccepted:
  description: >
    `GrantRestaurantAccess.basis` named a declared but not-yet-implemented door (#639 part C step
    6-i, ADR-20260905-101349 §3): only `CAPTAIN_ONBOARDING` is accepted today.
    `GOOGLE_BUSINESS_PROFILE`, `OWNER_DECLARATION` and `MEMBER_INVITATION` are named in the closed
    `AccessBasis` set so the vocabulary does not widen a second time when each door lands, but none
    of the three has a handler yet.
  context:
    basis: { $ref: 'scalars.yaml#/AccessBasis' }
  messages:
    en: "This access basis is not yet supported."
    fr: "Ce fondement d'accès n'est pas encore pris en charge."


MemberAuthSubjectAlreadyBound:
  description: >
    The login credential (`authSubject`) is already bound to ANOTHER member id: the write-side
    reservation `(MEMBER, authSubject)` in `database/tables/reservations.yaml#/
    auth_subject_reservations` lost its insert to a row held by a different principal (#639 part C
    step 6-i, ADR-20260905-101349 §4). The binding is never released by a revoke, so the remedy is
    to grant the EXISTING member id, never a new one.
  context:
    authSubject: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "This login is already linked to a restaurant member. Grant the existing member instead."
    fr: "Cette identité de connexion est déjà liée à un membre. Accordez l'accès au membre existant."


RestaurantMembershipNotFound:
  description: "No `RestaurantMembership` exists for this `membershipId` (#639 part C step 6-i)."
  context:
    membershipId: { $ref: 'scalars.yaml#/MembershipId' }
  messages:
    en: "This restaurant membership was not found."
    fr: "Cette adhésion restaurant est introuvable."


RestaurantMembershipAlreadyRevoked:
  description: >
    The `RestaurantMembership` was already revoked (#639 part C step 6-i) -- revocation is a fact
    that happens once; a second `RevokeRestaurantAccess` on the same `membershipId` is rejected
    rather than silently re-recorded (the Art. 11-log style: the log is never overwritten).
  context:
    membershipId: { $ref: 'scalars.yaml#/MembershipId' }
  messages:
    en: "This restaurant membership was already revoked."
    fr: "Cette adhésion restaurant a déjà été révoquée."


# --- The member sign-in door (#639 part C step 6-ii, ADR-20260905-101349 §7-§10) -----------------

MemberNotLinked:
  description: >
    The magic-link token verified (the email is genuinely proven), but no `Member` row exists for
    this auth subject in `Member.auth_subject` (the step-6-i bridge) -- the not-yet-linked refusal
    (PROP-20260831-180622 §8.5, the rider door's `RiderNotRegistered` precedent). NOTHING is
    stamped and NOTHING is created; the session is still parked so the refusal screen can offer
    "Se déconnecter" against a real cookie. `email` carries the VERIFIED address (the token's
    output, never client input) so the refusal screen can print it.
  context:
    email: { $ref: 'scalars.yaml#/EmailAddress' }
    supportContact: { $ref: 'scalars.yaml#/EmailAddress' }
  messages:
    en: "Your account is not yet linked to a restaurant. Write to {supportContact}."
    fr: "Votre compte n'est pas encore relié à un restaurant. Écrivez-nous à {supportContact}."


MemberSignInRequiresSession:
  description: >
    The sign-in confirmation arrived with no `X-SESSION-ID` (the rider door's #852 B1 precedent).
    The credential it would mint is parked for `POST /auth/session` under the OWNING anonymous
    session (envelope data, ADR-0041), and a session parked with no owner could be claimed by any
    header-less caller holding the acceptance messageId. So the door refuses BEFORE the token is
    spent (the link stays usable for a correct retry) and nothing is verified, stamped or parked.
    Carries nothing: the remedy is the client's (the SDUI client always sends the header, so a
    restaurateur never sees this).
  context: {}
  messages:
    en: "Sign-in needs a browser session. Reload the page and try again."
    fr: "La connexion nécessite une session de navigation. Rechargez la page et réessayez."


MemberSignInDoorClosed:
  description: >
    `RUN_MEMBER_SIGN_IN_DOOR` is OFF (`configuration.yaml`, default false) -- the member sign-in
    door refuses BEFORE touching the identity provider (ADR-20260905-101349 §6/§F): the writer key
    flips only after the preconditions in `decisions/MEMBER-SIGN-IN-DOOR-PRECONDITIONS.yaml` are
    met.
  context: {}
  messages:
    en: "Restaurant sign-in is not yet available."
    fr: "La connexion restaurateur n'est pas encore disponible."
