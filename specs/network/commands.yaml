version: 1
description: >
  network scope — commands fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `commands.yaml` catalog; $refs stay kind-logical
  (`commands.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# =====================================================================
# 1. Onboard the restaurant  (persona: admin)  — story-map activity 1
# =====================================================================

RegisterRestaurantAccount:
  description: >
    Admin creates a restaurant ACCOUNT (HubRise: restaurant) that will own one or more locations.
    Account-level facts (legal entity, billing contact, currency, default tax, timezone) live here.
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
      description: "Client-generated id for the new account."
    legalName:
      $ref: 'scalars.yaml#/RestaurantLegalName'
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    defaultCurrency:
      $ref: 'scalars.yaml#/CurrencyCode'
    defaultTaxRate:
      $ref: 'entities.yaml#/TaxRate'
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
      description: "HubRise restaurant (account) reference, when seeded externally."
  required: [restaurantAccountId, legalName, defaultCurrency, defaultTaxRate]


UpdateRestaurantAccount:
  description: "Owner/admin edits account-level fields (legal name, billing contact, default tax, timezone)."
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    legalName:
      $ref: 'scalars.yaml#/RestaurantLegalName'
      nullable: true
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    defaultTaxRate:
      $ref: 'entities.yaml#/TaxRate'
      nullable: true
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
  required: [restaurantAccountId]


DeleteRestaurantAccount:
  description: "Owner/admin closes a restaurant account (its locations must already be removed)."
  type: object
  properties:
    restaurantAccountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantAccountId]


RegisterRestaurant:
  description: >
    The single, generic way to register a restaurant LOCATION. Used by an owner/admin onboarding a partner
    location (accountId set), AND by the Sirene/Google sync ACL seeding a public listing as if it were the
    owner (no accountId, listingStatus NON_PARTNER, externalIdentifiers from the source). Starts in DRAFT.
  type: object
  properties:
    mode: { $ref: 'scalars.yaml#/Mode' }   # test mode (ADR-0038); optional, absent = LIVE
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
      description: "Client/ACL-generated id for the new location."
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
      nullable: true
      description: "The owning account (must already exist) — omitted for a non-partner public listing."
    listingStatus:
      $ref: 'scalars.yaml#/RestaurantListingStatus'
      nullable: true
      description: "Partnership funnel; defaults to NON_PARTNER when omitted (e.g. sync-seeded listing)."
    # NOTE: no `slug` (ADR-20260728-011344) -- the storefront host is chosen by the OWNER during
    # onboarding via ConfigureRestaurantSlug, not derived at registration. A registration that
    # invented one reserved a hostname the merchant never picked.
    displayName:
      $ref: 'scalars.yaml#/RestaurantDisplayName'
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
      description: "Location-specific contact; falls back to the account contact when absent."
    website:
      $ref: 'scalars.yaml#/WebUrl'
      nullable: true
    tags:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
    marginRate:
      $ref: 'scalars.yaml#/MarginPercent'
      nullable: true
      description: "Food margin %, input to the service-fee split (ADR-0017)."
    cuisineCategory:
      $ref: 'scalars.yaml#/CuisineCategory'
      nullable: true
      description: "Cuisine bucket; selects the Uber Eats price-estimate coefficient (ADR-0024)."
    uberPricesOptIn:
      type: boolean
      nullable: true
      description: "Authorize showing real Uber Eats prices for comparison (ADR-0023 opt-in)."
    address:
      $ref: 'entities.yaml#/Address'
    location:
      $ref: 'entities.yaml#/GeoPoint'
      nullable: true
      description: "Geo coordinates (typically from the Google Maps sync)."
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
      description: "Location timezone; falls back to the account timezone when absent."
    preparationTimeMinutes:
      type: integer
      minimum: 0
      nullable: true
    openingHours:
      type: array
      items:
        $ref: 'entities.yaml#/OpeningHoursSlot'
    externalIdentifiers:
      type: array
      items:
        $ref: 'entities.yaml#/ExternalIdentifier'
      description: "Source-agnostic identifiers preserving original keys (siret/naf/google_place_id…). Not unique."
    ref:
      $ref: 'scalars.yaml#/ExternalReference'
      nullable: true
      description: "Set only when seeded from an external source (e.g. HubRise location)."
  required: [restaurantId, displayName, address]


ConfigureRestaurantSlug:
  description: >
    The owner chooses (or changes) the restaurant's STOREFRONT ADDRESS -- the {slug}.captain.food host
    (ADR-20260728-011344). A real command precisely because it CAN be refused: the label may already
    belong to another restaurant, and the person asking is a human who can pick again -- contrast the
    SIRENE registry feed, which states facts nobody can be told "no" about.
    Issued during onboarding after ownership is verified and before activation (a restaurant cannot be
    activated without a configured slug), and again later from the back office to rename. The aggregate
    decides which fact it is: first configuration emits RestaurantSlugConfigured, a change emits
    RestaurantSlugReconfigured carrying the previous label, and re-submitting the CURRENT label is an
    idempotent no-op (no event, no error).
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    slug:
      $ref: 'scalars.yaml#/Slug'
      description: "The requested storefront host label. Rejected with SlugAlreadyTaken if reserved by another restaurant -- including a label another restaurant has RELEASED by renaming, which stays reserved so its redirect cannot be hijacked."
  required: [restaurantId, slug]


ActivateRestaurant:
  description: "Admin makes a restaurant visible and orderable by customers."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId]



UpdateRestaurant:
  description: >
    Admin edits one or more mutable LOCATION fields (full replace of provided fields). Account-level
    facts (legalName, defaultTaxRate, currency) are edited on the account, not here.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    displayName:
      $ref: 'scalars.yaml#/RestaurantDisplayName'
      nullable: true
    description:
      $ref: 'scalars.yaml#/RestaurantDescription'
      nullable: true
      description: "Free-text presentation shown on the storefront and the discovery card."
    contact:
      $ref: 'entities.yaml#/RestaurantContact'
      nullable: true
    website:
      $ref: 'scalars.yaml#/WebUrl'
      nullable: true
    tags:
      type: array
      items:
        $ref: 'scalars.yaml#/Tag'
      nullable: true
    marginRate:
      $ref: 'scalars.yaml#/MarginPercent'
      nullable: true
    cuisineCategory:
      $ref: 'scalars.yaml#/CuisineCategory'
      nullable: true
      description: "Cuisine bucket; selects the Uber Eats price-estimate coefficient (ADR-0024)."
    uberPricesOptIn:
      type: boolean
      nullable: true
      description: "Authorize showing real Uber Eats prices for comparison (ADR-0023 opt-in)."
    address:
      $ref: 'entities.yaml#/Address'
      nullable: true
    location:
      $ref: 'entities.yaml#/GeoPoint'
      nullable: true
    timezone:
      $ref: 'scalars.yaml#/TimeZone'
      nullable: true
    preparationTimeMinutes:
      type: integer
      minimum: 0
      nullable: true
    openingHours:
      type: array
      items:
        $ref: 'entities.yaml#/OpeningHoursSlot'
      nullable: true
  required: [restaurantId]


DeactivateRestaurant:
  description: "Admin takes a restaurant offline so it can no longer receive orders."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId]


RemoveRestaurant:
  description: "Owner/admin removes a location from its account (delisted; no longer orderable)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId, accountId]


ChangeOrderAcceptanceMode:
  description: "Restaurant toggles its live order-acceptance mode (NORMAL / BUSY / PAUSED)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    mode:
      $ref: 'scalars.yaml#/OrderAcceptanceMode'
  required: [restaurantId, mode]


# --- Restaurant listing & pre-registration (ADR-0019/0021). The Sirene/Google sync is an ACL that
#     issues RegisterRestaurant / UpdateRestaurantGoogleBusinessProfile / MarkRestaurantClosed as the
#     owner — no dedicated "pre-register" command. ---

UpdateRestaurantGoogleBusinessProfile:
  description: >
    Record GBP-SPECIFIC metrics (Google place id + rating/reviews) for a restaurant. Issued by the
    Sirene/Google sync ACL (or admin). Carries ONLY Google-listing data — general restaurant info
    (name/address/hours/phone/website/tags) is set via Register/UpdateRestaurant, so the two data sources
    stay independent.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    googlePlaceId:
      $ref: 'scalars.yaml#/GooglePlaceId'
      nullable: true
    rating:
      $ref: 'scalars.yaml#/GoogleRating'
      nullable: true
    reviewsCount:
      type: integer
      minimum: 0
      nullable: true
  required: [restaurantId]


MarkRestaurantClosed:
  description: "Record that the establishment is closed (e.g. Sirene closure); issued by the sync ACL or admin."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId]


ClaimRestaurantListing:
  description: >
    An owner claims a public listing. Ownership is proven by verifying the restaurant's Google Business
    Profile (delegated to Google as a start); the backend validates the proof server-side before accepting.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    accountId:
      $ref: 'scalars.yaml#/RestaurantAccountId'
      nullable: true
      description: "Account to attach the claimed listing to, when the claimant already has one."
    googleOwnershipProof:
      type: string
      maxLength: 4096
      description: "Opaque Google Business Profile ownership proof/token, verified server-side."
  required: [restaurantId, googleOwnershipProof]


OptOutRestaurantListing:
  description: "An owner opts a public listing out (edit/remove), proven via Google Business Profile ownership."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    googleOwnershipProof:
      type: string
      maxLength: 4096
      description: "Opaque Google Business Profile ownership proof/token, verified server-side."
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId, googleOwnershipProof]


ChangeRestaurantListingStatus:
  description: "Admin moves a listing along the partnership funnel (NON_PARTNER → PASSIVE_PARTNER → ACTIVE_PARTNER)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    listingStatus:
      $ref: 'scalars.yaml#/RestaurantListingStatus'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId, listingStatus]


ConfigureGoogleBusinessProfileOrderLink:
  description: "Restaurant/admin sets the GBP 'Order online' link to its {slug}.captain.food page (ADR-0021; V1)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    gbpOrderUrl:
      $ref: 'scalars.yaml#/WebUrl'
  required: [restaurantId, gbpOrderUrl]


VerifyGoogleBusinessProfileOrderLink:
  description: "Ping the configured GBP 'Order online' link and record whether it is live (ADR-0021; V1)."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
  required: [restaurantId]


# --- Prospection (ADR-0020). Issued by the prospection-acl worker (it reads the pipeline score +
#     schedule, fires HubSpot/Resend/Slack, then records the fact). The score is never an input. ---

RecordProspectContact:
  description: >
    Record a B2B outreach contact to a prospect. The worker decides WHO/WHEN from the read-model score +
    schedule; this just records the fact. First contact is the prospect's birth. Anti-spam invariants apply.
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    channel:
      $ref: 'scalars.yaml#/OutreachChannel'
    sequenceStep:
      type: integer
      minimum: 0
  required: [restaurantId, channel, sequenceStep]


MarkProspectCold:
  description: "Mark a prospect cold (no reply by J+21); stops the outreach sequence."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId]


RecordProspectReply:
  description: "Record that a prospect replied (CRM/admin or inbound), stopping the sequence."
  type: object
  properties:
    restaurantId:
      $ref: 'scalars.yaml#/RestaurantId'
    note:
      type: string
      maxLength: 500
      nullable: true
  required: [restaurantId]


# --- Staff authentication: the RestaurantMembership aggregate (#639 part C step 6-i,
# ADR-20260905-101349 §1-§7) -------------------------------------------------------------------

GrantRestaurantAccess:
  description: >
    Grant a `MemberId` access to a restaurant scope (ADR-20260905-101349 §2/§3/§6). Handled by
    `RestaurantMembership`, its own aggregate, its own stream, its own lane -- FORK 1 Option A
    (young, evans): a targeted revoke by `membershipId` needs its own identity, distinct from the
    invitation that may precede it (6-iv) and from the person (`MemberId`) it grants.

    `scopeType` is carried for vocabulary alignment with `ScopeMembership` (#144) even though this
    aggregate only ever mints a RESTAURANT scope in V0 -- `scopeId` is therefore typed `RestaurantId`
    directly; a future scope type widens the union rather than reshaping this command.

    `membershipId` is REQUIRED and CALLER-MINTED: the mailbox lane address declares
    `Some("membershipId")` and `declared_identity` errors "unaddressable" when it is absent, so a
    handler-side mint branch is
    DEAD over the mailbox in practice, and a second grant omitting the id would duplicate the
    membership (two streams, two `ScopeMembership` rows -- a targeted revoke would then leave a
    sibling). Nothing consumes this command yet (dark), so the shape is free to fix now rather than
    migrate later. Submitting an already-granted `membershipId` is an idempotent no-op
    (`rules.yaml#/RestaurantAccessGrantIsIdempotent`) -- never a second event for the same
    relationship.

    The handler ACCEPTS only `basis: CAPTAIN_ONBOARDING` today (Captain provisions by hand; the
    human is the process manager, PROP-20260831-180622 §6.2 Q1) and REFUSES the other three
    declared `AccessBasis` values with the typed `AccessBasisNotYetAccepted` (unimplemented, not
    illegal -- 6-iv accepts `MEMBER_INVITATION`). Gated by `configuration.yaml#/keys/
    RUN_MEMBER_ACCESS_GRANT`, checked BEFORE the store is touched (the `RestrictRider` shape): the
    first hand-provisioned grant about a real Tours human is the irreversible moment that starts
    every legal clock (ADR-20260905-101349 §6/§11).
  type: object
  properties:
    membershipId:
      $ref: 'scalars.yaml#/MembershipId'
    scopeType:
      $ref: 'scalars.yaml#/ScopeType'
    scopeId:
      $ref: 'scalars.yaml#/RestaurantId'
    memberId:
      $ref: 'scalars.yaml#/MemberId'
    authSubject:
      $ref: 'scalars.yaml#/AuthSubject'
    authority:
      $ref: 'scalars.yaml#/MemberAuthority'
    basis:
      $ref: 'scalars.yaml#/AccessBasis'
  required: [membershipId, scopeType, scopeId, memberId, authSubject, authority, basis]


RevokeRestaurantAccess:
  description: >
    End one `RestaurantMembership` (ADR-20260905-101349 §2/§11). Revocation of ACCESS is never
    release of the underlying `(MEMBER, authSubject)` reservation (§4, PROP §7): the human stays
    bound to their `MemberId` forever, so a later re-invitation cannot mint a second person for the
    same credential. `ground` is the closed, additive-only `AccessRevocationGround` -- no free-text
    field exists on this command, on purpose (the ADR-20260904-014136 precedent: a stored
    performance-keyed reason is the strongest requalification exhibit a labour dispute could ask
    for). Never gated: releasing access is always safe to allow (the `ReinstateRider`/
    `RestrictRider` asymmetry, ADR-20260904-152807 §7).
  type: object
  properties:
    membershipId:
      $ref: 'scalars.yaml#/MembershipId'
    ground:
      $ref: 'scalars.yaml#/AccessRevocationGround'
  required: [membershipId, ground]
