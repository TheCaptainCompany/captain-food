version: 1
description: >
  network scope — rules fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `rules.yaml` catalog; $refs stay kind-logical
  (`rules.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# --- RestaurantAccount ---
AccountRegistrationValidCurrencyUniqueRef:
  description: "A restaurant account is registered only with a valid ISO currency and a not-already-used external ref."

AccountUpdateRequiresExistingAccountAndField:
  description: "Account-level fields update only for an existing account and when at least one editable field is provided."

AccountDeletion:
  description: "A restaurant account can be deleted."


# --- Restaurant ---
LocationRegistrationUnderAccount:
  description: "A location is registered under an existing account with a not-already-used external ref."

# --- Storefront address (ADR-20260728-011344) ---
StorefrontSlugChosenByOwner:
  description: "The storefront address is chosen by the owner, never derived at registration; re-submitting the current one is a no-op."

StorefrontSlugRenameKeepsThePreviousAddress:
  description: "Renaming a storefront records the previous address, so old links, menus and QR codes keep resolving to it."

StorefrontSlugUniqueAndNeverReused:
  description: "A storefront address belongs to at most one restaurant, and an address released by a rename is never handed to another."

RegistryReportAppliesOnlyRealChanges:
  description: "An open-data registry report updates a restaurant only where it genuinely differs, never clears fields the registry knows nothing about, and produces no event at all when nothing changed."

ActivationRequiresStorefrontSlug:
  description: "A restaurant cannot go live without a storefront address — there would be no host for customers to reach it on."

RestaurantActivationVisibility:
  description: "Activating a restaurant makes it visible/orderable; activation is rejected from an invalid state."

RestaurantActivationIdempotent:
  description: "Re-activating an already-active restaurant is a no-op (idempotent)."

RestaurantLocationFieldsUpdate:
  description: "Editable location fields can be updated; an update to a missing location or with no field is rejected."

RestaurantDeactivation:
  description: "A restaurant can be deactivated (hidden from customers)."

OrderAcceptanceModeManagement:
  description: "The order-acceptance mode reflects kitchen capacity and is rejected from an invalid state."

# --- Service hours (RSO-1, DECISIONS §43) ---
ServiceWindowVerdictDerivedAtAnInstant:
  description: >
    "Is this restaurant serving right now?" is a three-valued VERDICT (OPEN / OUTSIDE_HOURS /
    HOURS_UNDECLARED) derived AT AN INSTANT from the declared opening hours + timezone with the
    clock injected — one shared derivation consumed by both the api serviceWindow field and the
    checkout guard, so badge and guard cannot disagree. Empty hours ([] — which storage makes
    indistinguishable from "cleared" and "unparseable") and a missing/unparseable timezone are
    HOURS_UNDECLARED, never "closed": a verdict must not take a live restaurant offline over
    missing seed data. Evaluation converts the instant to the restaurant's local time (DST-safe);
    overnight slots cross midnight; the effective close is min(door-close, cutoff) with the
    degradation to door-close explicit while no cutoff source is declared.

OrderableExcludesServiceHours:
  description: >
    THE single statement of the orderable formula (api.yaml Restaurant.orderable and
    scalars.yaml#/RestaurantListingStatus cite it): orderable ⇔ listingStatus ACTIVE_PARTNER +
    RestaurantStatus ACTIVE + acceptance ≠ PAUSED — and service hours are NOT a term of it: an
    OUTSIDE_HOURS restaurant still reads orderable: true, and the time-varying answer lives ONLY
    on serviceWindow. The formula is an event fold carried alongside updatedAt; a clock-varying
    bit folded into it would have no meaningful updatedAt and would serve stale answers from every
    cache keyed on it. Folding hours into orderable would silently reverse DECISIONS §43
    correction 3 — this rule exists so that reversal cannot be silent.

RestaurantRemoval:
  description: "A restaurant location can be removed."

ListingSeededFromOpenData:
  description: "A public NON_PARTNER listing can be seeded from open data (Sirene/Google) with no account, preserving source identifiers."

GoogleBusinessProfileEnrichment:
  description: "Google Business Profile data (rating/reviews/hours…) is stored separately from the restaurant's own info."

ClosedListingSyncedFromSource:
  description: "A listing reported closed by the source is marked closed."

ListingClaimRequiresVerifiedOwnership:
  description: "A listing can be claimed only with verified ownership, and only once."

ListingOptOut:
  description: "A restaurant can opt a listing out."

ListingFunnelProgression:
  description: "A listing progresses through the partnership funnel (NON_PARTNER → PASSIVE_PARTNER → ACTIVE_PARTNER)."

GbpOrderLinkSetupAndVerification:
  description: "The Google 'Order online' link can be configured and verified; verification is rejected when it fails."


# --- Prospect ---
ProspectContactScheduleAndLimit:
  description: "A prospect contact is recorded only within the outreach schedule and under the contact limit."

ProspectOutreachStateTransitions:
  description: "A prospect can be marked cold or replied; acting on a missing prospect is rejected."


# --- Staff authentication: the RestaurantMembership aggregate (#639 part C step 6-i,
# ADR-20260905-101349 §1-§7) -------------------------------------------------------------------

RestaurantAccessGrantIsIdempotent:
  description: "GrantRestaurantAccess on an EXISTING membershipId is an idempotent no-op (no second event) -- a caller retry never mints a duplicate relationship (#639 part C step 6-i, ADR-20260905-101349 §2)."

MemberAuthSubjectBoundOnce:
  description: "One login credential (authSubject) binds to at most one MemberId, forever: a grant whose authSubject is already bound to another member is rejected before any fact is recorded (MemberAuthSubjectAlreadyBound), and revoking a membership never frees the binding -- the same human always resolves to the same member (#639 part C step 6-i, ADR-20260905-101349 §4, the 2a auth_subject_reservations precedent)."

RestaurantMembershipRevocationIsFinal:
  description: "RevokeRestaurantAccess on an unknown membershipId is rejected (RestaurantMembershipNotFound); on an already-revoked one it is rejected (RestaurantMembershipAlreadyRevoked) rather than silently re-recorded -- the log is never overwritten (#639 part C step 6-i)."

GrantRestaurantAccessIsAHumanAct:
  description: "RevokeRestaurantAccess is roles: [ADMIN] with requires: acting: { ADMIN: any }; GrantRestaurantAccess is roles: [ADMIN, PUBLIC] with requires: acting: { ADMIN: any, PUBLIC: any } (6-iv adds the invitation-accept caller) -- neither carries an EXTERNAL key, so both stay human-only (Captain provisions by hand, or a real person accepts an invitation; a process manager may `send` neither, validator pm-sends-human-only-command) (#639 part C step 6-i/6-iv, ADR-20260905-101349 §1/§2)."

MemberAccessGrantGatedBeforeStore:
  description: "GrantRestaurantAccess refuses with the typed MemberAccessGrantDoorClosed BEFORE the store is touched while configuration.yaml#/keys/RUN_MEMBER_ACCESS_GRANT is off; RevokeRestaurantAccess is never gated -- releasing access is always safe to allow (#639 part C step 6-i, ADR-20260905-101349 §6, the RestrictRider/ReinstateRider asymmetry)."

RestaurantAccessBasisAcceptedSetIsNarrower:
  description: "AccessBasis declares four values; GrantRestaurantAccess's handler accepts only CAPTAIN_ONBOARDING and refuses the other three (GOOGLE_BUSINESS_PROFILE, OWNER_DECLARATION, and -- round 2 -- MEMBER_INVITATION, which now has its OWN door, GrantRestaurantAccessByInvitation) with the typed AccessBasisNotYetAccepted (#639 part C step 6-i/6-iv, ADR-20260905-101349 §3)."

RestaurantInvitationExpiryIsARecordedFact:
  description: "RestaurantInvitationExpired is scheduled at RESTAURANT_INVITATION_TTL_SECONDS out (reschedule: keep) and delivered by the promotion pass as a recorded fact -- never an engine timer (ADR-20260810-231300); only a STILL-PENDING invitation records it, with record semantics (#639 part C step 6-iv)."

RestaurantInvitationRevocationIsFinal:
  description: "RevokeRestaurantInvitation on an unknown invitationId is rejected (RestaurantInvitationNotFound); on an already-revoked one it is rejected (RestaurantInvitationAlreadyRevoked) rather than silently re-recorded (#639 part C step 6-iv, the RestaurantMembershipRevocationIsFinal precedent)."

RestaurantInvitationGatedBeforeStore:
  description: "InviteRestaurantMember refuses with the typed RestaurantInvitationDoorClosed BEFORE the store is touched while configuration.yaml#/keys/RUN_RESTAURANT_INVITATION is off; RevokeRestaurantInvitation is never gated -- withdrawing an unaccepted offer is always safe to allow (#639 part C step 6-iv)."

RestaurantInvitationAcceptIsUniformlyRefused:
  description: "AcceptRestaurantInvitation refuses an unknown invitationId, a wrong invited/verified email, an already-accepted, a revoked, and an expired invitation with the SAME typed error (RestaurantInvitationNotAcceptable) and the same shape -- no enumeration oracle for a stranger holding any invitationId (#639 part C step 6-iv, the 6-ii sign-in door's no-enumeration posture carried)."

MemberInvitationGrantDerivesFromInvitation:
  description: "GrantRestaurantAccessByInvitation (round 2, ADR-20260905-101349 §2 amendment) verifies its own token, derives scopeType/scopeId/memberId/authSubject/authority from the RestaurantInvitation stream identified by invitationId -- never from a client-supplied copy of any of them, since the command carries none -- and requires that invitation to be terminal ACCEPTED with acceptedAuthSubject equal to the caller's own proved auth subject; any other outcome is the SAME typed RestaurantInvitationNotAcceptable as an unknown invitation (#639 part C step 6-iv, ADR-20260905-101349 §2)."

RestaurantAccessGrantByInvitationDerivesMembershipId:
  description: "GrantRestaurantAccessByInvitation's membershipId is DERIVED as UUIDv5(namespace, invitationId), never client-supplied -- one accepted invitation can produce at most one RestaurantMembership stream; a second call for the same accepted invitation folds the existing membership and returns the ordinary idempotent no-op (#639 part C step 6-iv round 2, ADR-20260905-101349 §2 amendment)."

RestaurantAccessGrantByInvitationReusesTheHeldMemberId:
  description: "GrantRestaurantAccessByInvitation's memberId is the CURRENT reservation holder for (MEMBER, authSubject) when one already exists (a re-hire, or a person joining a second restaurant), never the invitation's own minted memberId in that case -- neither is refused MemberAuthSubjectAlreadyBound after a terminal accept, with no retry available (#639 part C step 6-iv round 2, young B1)."


MemberSignInIdentifiesOnly:
  description: "Member sign-in is identify-only, never register: a verified email whose login is bound to a member stamps { role: MEMBER } (and nothing else -- no id) on the provider user and parks the post-stamp session; a verified email with no member behind it is refused with MemberNotLinked but the session is STILL parked (so the not-yet-linked refusal screen has a real cookie) and nothing is stamped; a login already carrying another role's claim is refused rather than overwritten; a confirmation that carries no session to own the parked credential is refused with MemberSignInRequiresSession BEFORE the token is spent; and the link REQUEST never reveals whether the address is on the roster (#639 part C step 6-ii, ADR-20260905-101349 §7-§10)."

MemberSignInGatedBeforeStore:
  description: "requestMemberSignInLink and confirmMemberSignIn both refuse with the typed MemberSignInDoorClosed BEFORE the identity provider is touched while configuration.yaml#/keys/RUN_MEMBER_SIGN_IN_DOOR is off (#639 part C step 6-ii, ADR-20260905-101349 §6)."
