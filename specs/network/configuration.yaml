version: 1
description: >
  network scope — configuration fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `configuration.yaml` catalog; $refs stay kind-logical
  (`configuration.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

keys:


  SERVICE_WINDOW_VALIDITY_HORIZON_SECONDS:
    type: int
    default: 900
    gates: >
      The Restaurant.serviceWindow.validUntil horizon (RSO-1, DECISIONS §43 sub-question iii):
      validUntil = min(next window transition, evaluatedAt + this horizon), and under
      HOURS_UNDECLARED — where no transition exists to wait for — it is evaluatedAt + horizon
      alone. Exists so no cache can treat a verdict as immortal: without it a restaurant declaring
      its hours at 18:50 on a Friday would keep rendering a blank badge in every warm cache at the
      hour it matters. Seconds; the 900 default trades staleness against re-evaluation load at
      Friday-peak list fan-out.


  RUN_SIRENE_WORKER:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    decisionRow: SIRENE-RESTART
    gates: >
      SIRENE staging drain (ADR-0045): translates `external_sirene_restaurants` rows through the ACL and
      releases their payloads. OFF, staged rows stay PENDING indefinitely and registry-driven prospect
      creation does not happen. Readiness at GET /sirene.
      STOPPED since 2026-07-28, and the reason this text used to give ("PAUSED with the CI sweep,
      issue #220") is STALE: #220 closed the same day, as did the other named bottleneck #218, so the
      chain has been off for over a month behind a blocker that no longer exists and nobody has
      re-taken the restart decision. Restarting is NOT a flag flip -- an owner-declared restaurant
      carries no SIRET, which is the crawl's idempotency key, so un-pausing before that door shares
      the key manufactures duplicate restaurants; and a self-declared listing currently enters the
      prospect funnel. Both guards, and the decision itself, are issue #800.
      `decisionRow` binds this key to `docs/decisions/SIRENE-RESTART.yaml` explicitly (#917), so the
      codegen rule `decision-row-open-key-must-be-off` refuses any `deploy.production` value other
      than `"false"` while that row stays open -- the prose and the deploy value can no longer
      disagree unreconciled the way they did for a month.
    deploy:
      production: "false"
      staging: "false"


  # #639 part C step 6-i (ADR-20260905-101349 §6): the grant door as a MECHANISM, not prose --
  # "nothing reachable because no UI exists" is intent, and the first hand-provisioned grant about
  # a real Tours human is the irreversible moment that starts every legal clock (Art. 14 notice,
  # Art. 30 entry). Consumed at the WRITE door only (`grant_restaurant_access`'s handler, the
  # `RestrictRider` shape): OFF returns the typed refusal `MemberAccessGrantDoorClosed` BEFORE the
  # store is touched; `revokeRestaurantAccess` is NEVER gated -- releasing access is always safe.
  # `decisionRow` binds this key to `docs/decisions/MEMBER-ACCESS-GRANT-PRECONDITIONS.yaml`
  # explicitly, so the codegen rule `decision-row-open-key-must-be-off` refuses any
  # `deploy.production` value other than `"false"` while that row stays open (the `RUN_SIRENE_WORKER`
  # lesson made executable). Flipping the default is a SEPARATE recorded decision that closes the
  # row (gate-then-stabilize, ADR-20260808-144738). This slice ships dark: no UI exists yet, and
  # the door (6-ii) is a hard dependency for verification, not compilation (ADR-20260905-101349 §1).
  RUN_MEMBER_ACCESS_GRANT:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    decisionRow: MEMBER-ACCESS-GRANT-PRECONDITIONS
    gates: >
      The staff access grant door (#639 part C step 6-i, ADR-20260905-101349 §6). ON,
      `grantRestaurantAccess` appends `RestaurantAccessGranted` as normal (subject to the accepted-
      basis check, `AccessBasisNotYetAccepted`). OFF, the handler refuses BEFORE touching the store
      with the typed `MemberAccessGrantDoorClosed` rejection -- a supervisable row, never a silent
      no-op. `revokeRestaurantAccess` is NEVER gated by this key: releasing access is always safe
      to allow. Preconditions gating the flip are named in
      `docs/decisions/MEMBER-ACCESS-GRANT-PRECONDITIONS.yaml` (open): the Art. 14 notice to the
      provisioned person, an Art. 30 entry "staff access management", the lifetime reservation
      written down with its future path, the Supabase DPA/region and Art. 26 items (founder's,
      external), and 6-ii merged (a grant with no door is a binding nobody can use).
    deploy:
      production: "false"


  # #639 part C step 6-ii (ADR-20260905-101349 §6/§10): the door as a MECHANISM, mirroring
  # RUN_MEMBER_ACCESS_GRANT's shape exactly. Consumed at BOTH mutation handlers
  # (`request_member_sign_in_link`, `confirm_member_sign_in`): OFF refuses BEFORE the identity
  # provider is touched at all, with the typed `MemberSignInDoorClosed`. `decisionRow` binds this
  # key to `docs/decisions/MEMBER-SIGN-IN-DOOR-PRECONDITIONS.yaml` explicitly, so
  # `decision-row-open-key-must-be-off` refuses any `deploy.production` value other than `"false"`
  # while that row stays open. The public-graph limits (E) are NOT behind this key -- they are a
  # bound applied to every role's schema, not a door.
  RUN_MEMBER_SIGN_IN_DOOR:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    decisionRow: MEMBER-SIGN-IN-DOOR-PRECONDITIONS
    gates: >
      The member sign-in door (#639 part C step 6-ii, ADR-20260905-101349 §6). ON, both
      `requestMemberSignInLink` and `confirmMemberSignIn` run their identify/stamp/park flow as
      designed. OFF, BOTH refuse BEFORE touching the identity provider with the typed
      `MemberSignInDoorClosed` rejection -- a supervisable row, never a silent no-op. Preconditions
      gating the flip are named in `docs/decisions/MEMBER-SIGN-IN-DOOR-PRECONDITIONS.yaml` (open):
      6-i merged (done), the silent `/auth/refresh` retry + `?next=` in the client (#894-class, own
      issue), email deliverability proven by a hand-dispatched drill (SPF/DKIM/DMARC, founder's),
      the Supabase DPA/region (founder's), the legal/privacy page the refusal screen links (owner
      named), and `MEMBER-ACCESS-GRANT-PRECONDITIONS` flipped first (a door with no grant path is a
      refusal machine).
    deploy:
      production: "false"
      staging: "false"


  # #639 part C step 6-iv (ADR-20260905-101349 §2/§3, PROP-20260831-180622 §6.1): the invitation
  # door, mirroring RUN_MEMBER_ACCESS_GRANT's shape. Consumed at the WRITE door only
  # (`invite_restaurant_member`'s handler, the RestrictRider shape): OFF returns the typed refusal
  # `RestaurantInvitationDoorClosed` BEFORE the store is touched. `revokeRestaurantInvitation` is
  # NEVER gated -- withdrawing an unaccepted offer is always safe to allow. `decisionRow` binds this
  # key to `docs/decisions/RESTAURANT-INVITATION-PRECONDITIONS.yaml`.
  RUN_RESTAURANT_INVITATION:
    type: bool
    scalar:
      $ref: 'scalars.yaml#/ConfigBoolean'
    default: false
    decisionRow: RESTAURANT-INVITATION-PRECONDITIONS
    gates: >
      The invitation door (#639 part C step 6-iv, ADR-20260905-101349 §2/§3). ON,
      `inviteRestaurantMember` sends the invite email and appends `RestaurantInvitationSent` as
      normal. OFF, the handler refuses BEFORE touching the store with the typed
      `RestaurantInvitationDoorClosed` rejection -- a supervisable row, never a silent no-op.
      `revokeRestaurantInvitation` is NEVER gated by this key: withdrawing an offer nobody has
      accepted yet is always safe to allow. `GrantRestaurantAccess`'s `MEMBER_INVITATION` leg stays
      behind `RUN_MEMBER_ACCESS_GRANT` (the SAME irreversible-grant gate CAPTAIN_ONBOARDING already
      uses -- a member-invitation grant is equally the first fact that starts a real Tours human's
      legal clock, so it is not a separate key). Preconditions gating the flip are named in
      `docs/decisions/RESTAURANT-INVITATION-PRECONDITIONS.yaml` (open): the invitation email
      deliverability drill, `RUN_MEMBER_SIGN_IN_DOOR` flipped FIRST (an invitation nobody can sign
      in with afterwards is a dead letter), the Art. 13 notice at the invited address (a third
      party's email typed by a manager -- legal names the instrument), the TTL value below
      confirmed (not just defaulted), and no seat-count/billing semantics anywhere in this slice.
    deploy:
      production: "false"
      staging: "false"


  # UNVERIFIED input (ADR-20260817-105845: a dispatch card may not state a derived number without
  # its antecedents, and this session has none to derive from -- no cost model, no support-ticket
  # data, no comparable product's own TTL is on the record). 604800s = 7 days is PROPOSED, not
  # decided: it mirrors the common "invite link expires in a week" convention (GitHub/Slack-class
  # products), it is comfortably longer than the email send-abuse wall's own windows
  # (EMAIL_MAX_SENDS_PER_ADDRESS_PER_DAY, hours-to-days), and it is short enough that a MANAGER who
  # invited the wrong address is not stuck waiting out a stale, still-acceptable offer for months.
  # The founder's row (`docs/decisions/RESTAURANT-INVITATION-PRECONDITIONS.yaml`) owns the actual
  # value; this default only lets the reminder/schedule mechanism compile and test meaningfully.
  RESTAURANT_INVITATION_TTL_SECONDS:
    type: int
    unit: seconds     # typed duration unit (#167 precedent) -- the emitters branch on THIS, never on the name
    default: 604800
    gates: >
      UNVERIFIED input (see the comment above this key). How long a `RestaurantInvitation` stays
      PENDING before the promotion pass delivers `RestaurantInvitationExpired`
      (`reschedule: keep` -- a redelivered birth never moves the deadline). Proposed default: 7
      days (604800s), pending confirmation in
      `docs/decisions/RESTAURANT-INVITATION-PRECONDITIONS.yaml`.


  # ===================================================================
  # CI ingestion job (`sirene_ingest`) — a SEPARATE deployable (ADR-0045)
  #
  # Declared here so the drift gate and the docs cover them, but `consumer` keeps them OUT of the
  # server's typed Config: the server never reads them, and a boot report listing settings the process
  # ignores is noise that trains people to skim it.
  # ===================================================================

  INSEE_API_TOKEN:
    type: string
    secret: true
    consumer: sirene_ingest
    gates: >
      INSEE portal API key, sent as `X-INSEE-Api-Key-Integration` (no OAuth2 on the 2024+ portal).
      `SireneClient::from_env` FAILS when it is unset, so a sweep with no token does not silently ingest
      zero établissements — it refuses. No `deploy` block: this consumer runs in GitHub Actions, which
      injects the repo secret of the same name directly; the Render sync (which only carries the server
      service) has nothing to do with it.


  INSEE_API_BASE_URL:
    type: string
    scalar:
      $ref: 'scalars.yaml#/HttpsUrl'
    consumer: sirene_ingest
    gates: >
      Override of the version-pinned Sirene base URL. Exists because the version is IN the path
      (`/api-sirene/3.11`): when INSEE bumps it, a sweep can be redirected without a release. Unset, the
      client uses its own pinned constant -- so no `default` here, which would be a second copy of it.


  SIRENE_DEPARTMENTS:
    type: string
    scalar:
      $ref: 'scalars.yaml#/DepartmentList'
    consumer: sirene_ingest
    gates: >
      Comma-separated departments to sweep, honoured VERBATIM and in order (e.g. `37` for Tours only).
      Blank = stalest-first across all of France (#218). Set per workflow_dispatch run, not persisted.


  SIRENE_BUDGET_MINUTES:
    type: string
    consumer: sirene_ingest
    gates: >
      Wall-clock a sweep may spend before stopping cleanly at a department boundary. Blank = the binary
      default (75 sweep / 60 compact); the run resumes where it stopped on the next invocation.
