version: 1
description: >
  network scope — scalars fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `scalars.yaml` catalog; $refs stay kind-logical
  (`scalars.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

# --- Identity & Slugs ---

UserId:
  type: string
  format: uuid


ExternalIdentifierKey:
  type: string
  maxLength: 64
  description: >
    Key of a generic external identifier kept on a Restaurant listing (see entities.yaml#/ExternalIdentifier).
    Open vocabulary preserving the ORIGINAL source key; well-known values: 'siret', 'naf', 'google_place_id',
    'hubrise_ref'. NOTE: external ids are NOT assumed unique — one SIRET can host several dark-kitchen brands;
    cross-reference sources (a google_place_id usually distinguishes them).


GooglePlaceId:
  type: string
  maxLength: 255
  description: "Google Maps Place id identifying the establishment (enrichment / Business Profile)."


Latitude:
  type: number
  minimum: -90
  maximum: 90
  description: "WGS84 latitude in decimal degrees."


Longitude:
  type: number
  minimum: -180
  maximum: 180
  description: "WGS84 longitude in decimal degrees."


GoogleRating:
  type: number
  minimum: 0
  maximum: 5
  description: "Google Maps / Business Profile average rating (0–5), enrichment only."


WebUrl:
  type: string
  pattern: "^https?://"
  maxLength: 2048
  description: "An http(s) URL — restaurant website or the Google Business Profile 'Order online' link."


RestaurantLegalName:
  type: string
  maxLength: 255
  description: >
    Legal entity name used for invoices and contracts.
    Example: 'SARL CHEZ MARCO', 'TOKYO SUSHI RESTAURATION SAS'.


RestaurantDescription:
  type: string
  maxLength: 2000
  description: >
    Free-text presentation of a restaurant LOCATION, shown on the storefront and the discovery card.
    Dedicated scalar rather than a reuse of ProductDescription — same shape today, different subject
    (one name = one scalar), so the two can diverge without a migration.


MarginPercent:
  type: number
  minimum: 0
  maximum: 100
  description: >
    A restaurant's food margin (%), input to the proportional Captain service fee (ADR-0016/0017):
    the restaurant's variable contribution scales with clamp((margin−55)/(70−55),0,1). Example: 62.0.


# --- Time ---

Weekday:
  type: string
  enum:
    - MONDAY
    - TUESDAY
    - WEDNESDAY
    - THURSDAY
    - FRIDAY
    - SATURDAY
    - SUNDAY


TimeOfDay:
  type: string
  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  description: "Local time of day, HH:mm (HubRise opening_hours format)."


RestaurantStatus:
  type: string
  enum:
    - DRAFT
    - ACTIVE
    - INACTIVE


RestaurantListingStatus:
  type: string
  enum:
    - NON_PARTNER       # public listing seeded from open data (Sirene/Google); not orderable, no agreement
    - PASSIVE_PARTNER   # menu synced (e.g. HubRise) but no signed contract; not orderable
    - ACTIVE_PARTNER    # signed partner; orderable when also RestaurantStatus ACTIVE and not PAUSED
  description: >
    Partnership funnel of a restaurant LISTING, orthogonal to RestaurantStatus (the operational
    DRAFT/ACTIVE/INACTIVE state). Orderable ⇔ ACTIVE_PARTNER + RestaurantStatus ACTIVE + acceptance ≠ PAUSED
    (the single statement is rules.yaml#/OrderableExcludesServiceHours — service hours are NOT a term).


GbpLinkStatus:
  type: string
  enum: [UNSET, CONFIGURED, VERIFIED, BROKEN]
  description: "State of the restaurant's Google Business Profile 'Order online' link to {slug}.captain.food (ADR-0021; V1)."


ProspectionScore:
  type: integer
  minimum: 0
  maximum: 10
  description: "B2B prospection priority (0–10), COMPUTED by the ProspectionPipeline projection from listing facts (ADR-0020) — never stored in an event."


ProspectPipelineStatus:
  type: string
  enum: [NEW, CONTACTED, COLD, REPLIED, CONVERTED]
  description: "Prospect funnel stage, DERIVED in the pipeline projection: NEW (no contact) → CONTACTED → COLD (J+21) / REPLIED, and CONVERTED when the restaurant reaches ACTIVE_PARTNER."


OutreachChannel:
  type: string
  enum: [EMAIL, SLACK, PHONE]
  description: "Channel of a prospection contact (email via Resend, Slack alert, or phone)."


OrderAcceptanceMode:
  type: string
  enum: [NORMAL, BUSY, PAUSED]
  description: "Current order acceptance mode of a restaurant (HubRise: order_acceptance)."


# --- Discovery / filtering ---

PriceRange:
  type: string
  enum: [BUDGET, MODERATE, PREMIUM]
  description: "Coarse price tier of a restaurant, used as a discovery filter (UI: $ / $$ / $$$)."


RestaurantListKey:
  type: string
  enum:
    - ORDER_AGAIN      # restaurants the customer has ordered from before
    - RECOMMENDED      # "Places you might like" / "Tailored to your taste"
    - TOP_DEALS        # "Most loved deals on Captain.Food"
    - GREEN_PACKAGING  # "Spots using Green Packaging"
  description: >
    Named, read-side-curated/personalized discovery shelf for the restaurants query. The read model
    resolves the actual member restaurants (editorial rules / customer history); the client just
    asks for a list by key.


# --- Staff authentication: the RestaurantMembership aggregate (#639 part C step 6-i,
# ADR-20260905-101349 §1-§7) -------------------------------------------------------------------
#
# Local to `network` (not `specs/common/`): unlike RiderId/CustomerId/RestaurantId, a membership
# is never referenced by ANOTHER scope's events or commands — `ScopeMembership.member_id` stores
# the person's `MemberId` (kernel), never this. Declared here beside the aggregate that mints it.

MembershipId:
  type: string
  format: uuid
  description: >
    Identity of one `RestaurantMembership` grant (#639 part C step 6-i) -- the relationship between
    one `MemberId` and one restaurant scope, NOT the person (`MemberId`, `specs/common/scalars.yaml`)
    and NOT the ScopeMembership ACL row's derived key (normally a UUIDv5 over the natural key,
    database/tables/projection_tables.yaml#/ScopeMembership) -- EXCEPT the MEMBER arm, which reuses
    this id VERBATIM as that row's own PK instead of re-deriving one, because it is already a stable,
    unique identifier minted once by this aggregate (see the table's own rule for why). REQUIRED and
    CALLER-MINTED on `GrantRestaurantAccess`: the mailbox lane address needs it present to route at
    all; resubmitting the same id makes a second grant call idempotent
    (rules.yaml#/RestaurantAccessGrantIsIdempotent).


MemberAuthority:
  type: string
  enum: [MANAGER, OPERATOR]
  description: >
    What a member may do within the restaurant scope they hold access to (ADR-20260905-101349 §3,
    evans). `ADMINISTRATOR` was refused: it collides with `restaurant_manager`, an existing word
    already meaning "the person who runs one shop", and would give a second population the same
    stem. Two values, additive-only forever: a change of authority is a revoke followed by a new
    grant, never a `MemberAuthorityChanged` event (`*Updated` carrying a capability is the
    `RiderStatusChanged` shape this scope refuses to reincarnate, PROP-20260831-180622 §6).


AccessBasis:
  type: string
  enum: [CAPTAIN_ONBOARDING, GOOGLE_BUSINESS_PROFILE, OWNER_DECLARATION, MEMBER_INVITATION]
  description: >
    WHY a `RestaurantAccessGranted` fact was recorded -- the closed set of four doors
    (ADR-20260905-101349 §3): Captain provisions by hand (`CAPTAIN_ONBOARDING`), an owner proves
    ownership through the Google Business Profile link (`GOOGLE_BUSINESS_PROFILE`), an owner
    declares without external proof (`OWNER_DECLARATION`), or an existing member invites a
    colleague who accepts (`MEMBER_INVITATION`). Renamed from the proposal's `AccessEvidence`:
    only the Google leg is actual evidence Captain holds, so naming the whole set "evidence" would
    overstate the other three. Step 6-i's `GrantRestaurantAccess` handler accepted only
    `CAPTAIN_ONBOARDING`; **6-iv adds `MEMBER_INVITATION`**, as the second command of the two-lane
    accept (`AcceptRestaurantInvitation` then `GrantRestaurantAccess`, never a process manager,
    ADR-20260905-101349 §2) -- the handler DERIVES `scopeId`/`memberId`/`authority`/`authSubject`
    from the invitation's own recorded facts rather than trusting the client's copies
    (`GrantRestaurantAccess.invitationId` is the sole proof). `GOOGLE_BUSINESS_PROFILE` and
    `OWNER_DECLARATION` stay declared-but-refused with the typed error
    `errors.yaml#/AccessBasisNotYetAccepted`.


AccessRevocationGround:
  type: string
  enum: [LEFT_THE_RESTAURANT, ACCESS_NO_LONGER_NEEDED]
  readOnlyCatchAll: UNRECOGNISED
  description: >
    WHY a `RestaurantAccessRevoked` fact was recorded -- the smallest closed set naming no
    work-performance ground (the ADR-20260904-014136 precedent, legal-graded: a stored
    decline/performance-keyed reason is the strongest requalification exhibit a labour tribunal
    could ask for, so none is offered). `LEFT_THE_RESTAURANT` (the member's own departure --
    resignation, end of contract) and `ACCESS_NO_LONGER_NEEDED` (the restaurant's own operational
    call -- a role changed, a device was reassigned) are the two ordinary paths. `UNRECOGNISED` is
    the read-only catch-all (`#[serde(other)]`, unspellable at the command door -- the same shape
    `RiderRestrictionGround` carries): without it a future stored value fails the whole stream load
    on decode. No free text rides beside either value -- no `note` field exists on
    `RevokeRestaurantAccess`. Counsel review at the checkpoint (ADR-20260905-101349 §11); additive-
    only if it ever grows, same discipline as `RiderRestrictionGround` (counsel can only add).


# --- The roster and the invitation: the RestaurantInvitation aggregate (#639 part C step 6-iv,
# ADR-20260905-101349 §2/§3, PROP-20260831-180622 §6.1) ------------------------------------------
# Local to `network`, the RestaurantMembership precedent: an invitation is never referenced by
# another scope's events or commands.

RestaurantInvitationId:
  type: string
  format: uuid
  description: >
    Identity of one `RestaurantInvitation` (#639 part C step 6-iv) -- one invite of one email
    address to one restaurant scope. REQUIRED and CALLER-MINTED on `InviteRestaurantMember`, the
    `MembershipId`/`GrantRestaurantAccess` precedent: the mailbox lane address needs it present to
    route at all. Carried as `GrantRestaurantAccess.invitationId` on the accept leg's SECOND
    command as the sole proof that a grant on `basis: MEMBER_INVITATION` corresponds to a real,
    ACCEPTED invitation -- the handler derives `scopeId`/`memberId`/`authority`/`authSubject` from
    the invitation's OWN recorded facts rather than trusting the client's copies of them (6-iv
    STOP finding: see the hand-back for the full reasoning).


RestaurantInvitationStatus:
  type: string
  enum: [PENDING, ACCEPTED_PENDING_ACCESS, ACCEPTED, REVOKED, EXPIRED]
  description: >
    Read-side status of a `RestaurantInvitation` (#639 part C step 6-iv, `RestaurantInvitationList`
    read model, PROP §6.4) -- derived by folding `RestaurantInvitationSent` (PENDING),
    `RestaurantInvitationAccepted` (`ACCEPTED_PENDING_ACCESS` -- round 2, ux/business: the two-lane
    accept's FIRST leg landed but the SECOND, `GrantRestaurantAccessByInvitation`, has not yet been
    observed by this projector; its own status, never painted as a plain failure on `/invitation`),
    `RestaurantInvitationRevoked` (REVOKED) and `RestaurantInvitationExpired` (EXPIRED). The final
    `ACCEPTED_PENDING_ACCESS` -> `ACCEPTED` transition (once the grant leg's own
    `RestaurantAccessGranted` fact is observed) is round 2's NAMED GAP, tracked by #902's sibling
    follow-up -- `RestaurantInvitationList` never regresses a row FROM this state, so the gap is
    honest under-reporting, never a wrong answer. Terminal once ACCEPTED/REVOKED/EXPIRED -- the
    write side never re-opens a closed invitation (`errors.yaml#/RestaurantInvitationNotAcceptable`
    covers every terminal state uniformly, by design: see the no-enumeration note there).


# --- The platform grant and the ADMIN seam binding (#639 part C step 6-v,
# ADR-20260905-223957 §1-§3) -----------------------------------------------------------------
#
# Local to `network` (not `specs/common/`), the `MembershipId`/RestaurantMembership precedent: a
# platform membership is never referenced by ANOTHER scope's events or commands.

PlatformMembershipId:
  type: string
  format: uuid
  description: >
    Identity of one `PlatformMembership` grant (#639 part C step 6-v, ADR-20260905-223957 §1) -- the
    relationship between one `authSubject` and the PLATFORM ITSELF, NOT a `ScopeType` instance
    (`ScopeType` names "one protected instance" and there is one platform and no platform id --
    PRINCIPALS-MEMBER, RLS-SEQ finding (3): untouched) and NOT the `RestaurantMembership.membershipId`
    the `MembershipId` scalar names (a DIFFERENT relationship, a DIFFERENT aggregate). REQUIRED and
    CALLER-MINTED on `GrantPlatformAccess`, the `MembershipId`/`GrantRestaurantAccess` precedent
    exactly: the mailbox lane address needs it present to route at all, and the one-shot bootstrap
    (§3) mints it DETERMINISTICALLY (UUIDv5 over the granted `authSubject`) so running it twice
    targets the SAME stream.


PlatformAccessBasis:
  type: string
  enum: [CAPTAIN_ONBOARDING]
  description: >
    WHY a `PlatformAccessGranted` fact was recorded -- a NEW closed scalar, deliberately NOT
    `network.yaml#/AccessBasis` (ADR-20260905-223957 §1, evans): that scalar's four values are
    RESTAURANT-worded (`OWNER_DECLARATION`, `MEMBER_INVITATION`, …) and reusing it here would let a
    platform grant carry a value that means nothing for the platform relationship, or worse, invite
    a future restaurant-only value onto this door by accident. One value today -- the grant records
    an operational ACT (Captain onboards its own person), never a corporate/governance status
    (business: SAS today, SCIC conversion deferred to M18; ASSOCIE/COOPERATEUR/MANDATAIRE/SALARIE
    are forbidden values, on this scalar as on `AccessBasis`). Closed and additive-only, same
    discipline as every other basis scalar in this scope.
