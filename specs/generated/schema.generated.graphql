  deliveryPartnerAvailabilities(input: DeliveryPartnerAvailabilitiesQueryInput): [DeliveryPartnerAvailability!]! @auth(requires: [EXTERNAL, ADMIN]) @reads(views: ["View_DeliveryPartnerAvailability"])
  favoriteRestaurants(input: FavoriteRestaurantsQueryInput!): [Restaurant!]! @auth(requires: [CUSTOMER]) @reads(views: ["Restaurant"])
  restaurants(input: RestaurantsQueryInput): [Restaurant!]! @public @reads(views: ["Restaurant"])
  restaurant(input: RestaurantQueryInput!): Restaurant @public @reads(views: ["Restaurant"])
  restaurantLocationsByAccount(input: RestaurantLocationsByAccountQueryInput!): [Restaurant!]! @auth(requires: [ADMIN, RESTAURANT_ACCOUNT]) @reads(views: ["Restaurant"])
  prospectionPipeline(input: ProspectionPipelineQueryInput): [Prospect!]! @auth(requires: [ADMIN]) @reads(views: ["ProspectionPipeline"])
  carts(input: CartsQueryInput!): [Cart!]! @auth(requires: [CUSTOMER, ADMIN]) @reads(views: ["Cart"])
  cart(input: CartQueryInput!): Cart @public @reads(views: ["Cart"])
  orders(input: OrdersQueryInput): [Order!]! @auth(requires: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]) @reads(views: ["OrderTracking"])
  order(input: OrderQueryInput!): Order @auth(requires: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]) @reads(views: ["OrderTracking"])
  restaurantDeliverySatisfaction(input: RestaurantDeliverySatisfactionQueryInput!): [DeliverySatisfaction!]! @auth(requires: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]) @reads(views: ["View_DeliverySatisfaction"])
  myReclamations: [Reclamation!]! @auth(requires: [CUSTOMER]) @reads(views: ["View_Reclamation"])
  restaurantReclamations(input: RestaurantReclamationsQueryInput): [Reclamation!]! @auth(requires: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]) @reads(views: ["View_Reclamation"])
  reclamation(input: ReclamationQueryInput!): Reclamation @auth(requires: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]) @reads(views: ["View_Reclamation"])
  paymentStatus(input: PaymentStatusQueryInput!): PaymentIntent @auth(requires: [PUBLIC, CUSTOMER, ADMIN])
  pendingRefunds(input: PendingRefundsQueryInput): [Refund!]! @auth(requires: [RESTAURANT, ADMIN]) @reads(views: ["View_PendingRefunds"])
  customerCredit: CustomerCredit @auth(requires: [CUSTOMER]) @reads(views: ["CustomerCreditBalance"])
