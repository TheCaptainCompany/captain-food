  operationStatus(input: OperationStatusQueryInput!): Operation @public
  orderConversation(input: OrderConversationQueryInput!): OrderConversation @auth(requires: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, RIDER, ADMIN]) @reads(views: ["OrderConversation"])
