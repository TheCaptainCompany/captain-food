version: 1
description: >
  delivery scope — errors fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `errors.yaml` catalog; $refs stay kind-logical
  (`errors.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


DeliveryJobNotFound:
  description: "No delivery job with this id."
  context:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
  messages:
    en: "Delivery job not found."
    fr: "Livraison introuvable."


InvalidDeliveryStatus:
  description: "The delivery job is not in a status that allows this transition."
  context:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    currentStatus: { $ref: 'scalars.yaml#/DeliveryStatus' }
    expectedStatus: { $ref: 'scalars.yaml#/DeliveryStatus' }
  messages:
    en: "This action is not allowed while the delivery is '{currentStatus}'."
    fr: "Cette action n'est pas autorisée tant que la livraison est '{currentStatus}'."


DeliveryAlreadyAssigned:
  description: "The delivery job has already been accepted by a courier/rider."
  context:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
  messages:
    en: "This delivery has already been taken."
    fr: "Cette livraison a déjà été prise en charge."


# --- Delivery partner self-registration (#61) ---
DeliveryPartnerAvailabilityAlreadyRequested:
  description: "A registration with this id already exists (idempotent self-registration guard)."
  context:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
  messages:
    en: "This availability registration already exists."
    fr: "Cette demande de disponibilité existe déjà."


DeliveryPartnerAvailabilityNotFound:
  description: "No delivery-partner availability registration with this id."
  context:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
  messages:
    en: "Availability registration not found."
    fr: "Demande de disponibilité introuvable."


DeliveryPartnerAvailabilityNotPending:
  description: "The availability registration is not PENDING, so it cannot be approved."
  context:
    registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
    currentStatus: { $ref: 'scalars.yaml#/CityAvailabilityStatus' }
  messages:
    en: "This availability registration is not awaiting review."
    fr: "Cette demande de disponibilité n'est pas en attente de validation."


# =====================================================================
# Rider
# =====================================================================

RiderAlreadyRegistered:
  description: "A rider is already registered for this identity (authRef/id)."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  messages:
    en: "You are already registered as a rider."
    fr: "Vous êtes déjà inscrit en tant que livreur."


RiderAuthSubjectAlreadyBound:
  description: >
    The login credential (`authRef`) is already bound to ANOTHER rider id: the write-side
    reservation `(RIDER, authRef)` in `database/tables/reservations.yaml#/auth_subject_reservations`
    lost its insert to a row held by a different principal (#639 part C, #794). Named for THIS
    population and distinct from `RiderAlreadyRegistered` (same rider id twice) and from
    `RefAlreadyUsed` (a HubRise import key): the human already has a rider account, and the remedy
    is to sign in to it, never to register a second one -- the binding is never released.
  context:
    authRef: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "This login is already linked to a rider account. Sign in to that account instead."
    fr: "Cette identité de connexion est déjà liée à un compte livreur. Connectez-vous à ce compte."


RiderNotFound:
  description: "No rider with this id."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  messages:
    en: "Rider not found."
    fr: "Livreur introuvable."


InvalidRiderStatusTransition:
  description: "The rider is not in a status that allows this transition."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    currentStatus: { $ref: 'scalars.yaml#/RiderStatus' }
    targetStatus: { $ref: 'scalars.yaml#/RiderStatus' }
  messages:
    en: "A rider cannot move from '{currentStatus}' to '{targetStatus}'."
    fr: "Un livreur ne peut pas passer de '{currentStatus}' à '{targetStatus}'."


RiderNotRegistered:
  description: >
    A phone was verified but no rider account is bound to the login it proves (#639 part C step
    2c-i): rider sign-in is IDENTIFY-ONLY and registers nobody, so the sign-in is refused and
    nothing is created. Named for the RIDER population; the remedy is the support route
    (`SUPPORT_CONTACT`, ADR-20260830-213135 -- a required key with no default), never
    self-registration. Only the phone's owner can see it (the OTP was verified first), so it is
    not an enumeration oracle.
  context:
    supportContact: { $ref: 'scalars.yaml#/EmailAddress' }
  messages:
    en: "This phone number is not linked to a rider account. Contact {supportContact} to get set up."
    fr: "Ce numéro de téléphone n'est lié à aucun compte livreur. Contactez {supportContact} pour être enregistré."


RiderSignInRequiresSession:
  description: >
    The sign-in confirmation arrived with no `X-SESSION-ID` (the independent review of #852, B1).
    The credential it would mint is parked for `POST /auth/session` under the OWNING anonymous
    session (envelope data, ADR-0041), and a session parked with no owner could be claimed by any
    header-less caller holding the acceptance messageId -- which travels in spans and logs. So the
    door refuses BEFORE the OTP is spent (the code stays usable for a correct retry) and nothing is
    verified, stamped or parked. Carries nothing: the remedy is the client's, not the rider's
    (the SDUI client always sends the header, so a rider never sees this). The `AuthSessionStore`
    port's both-`None` claim is untouched -- that is another channel's contract; this door simply
    never parks without an owner.
  context: {}
  messages:
    en: "Sign-in needs a browser session. Reload the page and try again."
    fr: "La connexion nécessite une session de navigation. Rechargez la page et réessayez."


RiderAlreadyRestricted:
  description: "The rider is already restricted (#639 part C step 4-i) — restrict only an unrestricted rider; a second ground needs a reinstatement first (the Art. 11 log is never overwritten)."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  messages:
    en: "This rider is already restricted."
    fr: "Ce livreur est déjà restreint."


RiderNotRestricted:
  description: "The rider is not currently restricted (#639 part C step 4-i) — reinstate only a restricted rider."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  messages:
    en: "This rider is not restricted."
    fr: "Ce livreur n'est pas restreint."


RiderAccessRestricted:
  description: "The rider's access is restricted (#639 part C step 4-i, ADR-20260904-081527 §6) — a restricted rider cannot go AVAILABLE; the aggregate's own belt over ChangeRiderStatus."
  context:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  messages:
    en: "Your access is restricted, so you cannot go available for deliveries."
    fr: "Votre accès est restreint : vous ne pouvez pas passer disponible pour des livraisons."


AuthSubjectHoldsAnotherRole:
  description: >
    The verified login already carries a claim for ANOTHER role (a customer's `customer_id`, a
    restaurant's `restaurant_id`, ...), and the provider replaces the `captain_food` claim object
    wholesale -- stamping RIDER would erase it. Until the `one-subject-one-role` Concern of
    PROP-20260831-180622 is decided, the sign-in is REFUSED rather than overwriting (fail closed).
  context:
    authRef: { $ref: 'scalars.yaml#/AuthSubject' }
  messages:
    en: "This login is already used for another kind of Captain.Food account and cannot sign in as a rider yet."
    fr: "Cette identité de connexion est déjà utilisée pour un autre type de compte Captain.Food et ne peut pas encore se connecter comme livreur."
