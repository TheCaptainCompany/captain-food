version: 1
description: >
  delivery scope — rules fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `rules.yaml` catalog; $refs stay kind-logical
  (`rules.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# --- Delivery (ADR-0031) ---
DeliveryAcceptedOnlyWhenPending:
  description: "A pending delivery job can be accepted by an independent rider only once."

DeliveryPickupAndCompletionByRider:
  description: "The assigned rider confirms pickup then records hand-over, in the correct order."

DeliveryCancellableBeforeCompletion:
  description: "A delivery job can be cancelled before completion but not after it is delivered."

PartnerAcceptanceRecordsCourier:
  description: "When the partner accepts (inbound), the assigned courier is recorded on the job."

PartnerRejectionReoffers:
  description: "When the partner declines (inbound), the job is re-offered or flagged for manual handling."

DispatchExhaustionFailsClosed:
  description: "When Captain dispatches, the delivery job walks the city's ranked channel list, offering each ranked channel at most once in rank order; once every ranked channel has been offered and none accepts, the dispatch fails terminally (DeliveryDispatchFailed, run FAILED) and is surfaced to the restaurant for manual handling — never an unbounded retry loop (#60, supersedes ADR-20260720-004556)."

CityRankingWalkedInOrder:
  description: "When Captain dispatches, channels are offered in the city's configured rank order (CityDeliveryRanking, rank 1 first): the birth offer goes to the rank-1 channel and each advance moves to the next rank (#60)."

TimeoutEscalatesToNextChannel:
  description: "When an outstanding delivery offer times out (DeliveryOfferTimedOut), the dispatch advances to the next ranked channel (or fails closed when the ranked walk is exhausted) — a stale offer never blocks the walk (#60)."

ManualEscalateSkipsChannel:
  description: "An operator (restaurant/admin) may escalate an outstanding delivery offer (EscalateDelivery → DeliveryEscalationRequested), skipping the channel currently offered and advancing to the next ranked channel (or failing closed when the ranked walk is exhausted) (#60)."

OrderClosedOnDeliveryCompletion:
  description: "The order is closed (OrderDelivered) when the partner reports DELIVERED or an independent rider completes the delivery."

DeliveryPartnerAssignmentLifecycle:
  description: "A delivery job ASSIGNED to a partner (by the partner's acceptance — the only assignment path) can be unassigned to be re-offered, and partner-reported status changes apply only as valid transitions."

DeliveryDeclineKeepsJobPending:
  description: "An independent rider may decline a pending delivery job; the job stays PENDING and re-offerable."

DeliveryIssueLifecycle:
  description: "A delivery issue is reported on a non-delivered job by its closed kind (DeliveryIssueKind — one tap, an optional bounded note only for the facts) and NEVER moves the job's status or its rider; it is told to the restaurant through the read model (View_DeliveryJob.open_issue_kind) and later resolved with a closed DeliveryIssueResolution by whoever was told — resolving with nothing open, or reporting on a DELIVERED job, is rejected (#639 part C step 3-i, ADR-20260904-015903 §4)."

DeliveryHandBackKeepsCustodyHonest:
  description: "A rider holding a delivery job (ASSIGNED, PICKED_UP or OUT_FOR_DELIVERY) may hand it back stating where the food is: from ASSIGNED it returns PENDING (foodLocation NOT_COLLECTED, derived); from PICKED_UP/OUT_FOR_DELIVERY, RETURNED_TO_RESTAURANT returns it PENDING (re-offerable) and WITH_RIDER fails it closed (FAILED — never re-offered while a restricted rider's bag still holds the food, which would be an oversell); a rider who does not hold the job (rider mismatch) is rejected DeliveryAlreadyAssigned, a job not in one of those three statuses is rejected InvalidDeliveryStatus, and a partner-held job is rejected InvalidDeliveryStatus (UnassignDeliveryFromPartner is that door, not this one) (#639 part C step 3-ii, ADR-20260904-015903 §1-2)."

HandBackIsNeverALever:
  description: "DeliveryHandedBackByRider is a custody fact for the read side ONLY: no dispatchability, ranking or restriction fold reads it — a handback changes what the board and the customer are told, never who gets offered a job, in what order, or whether a rider may act (#639 part C step 3-ii, ADR-20260904-015903 §9). The same holds for the `DeliveryHandback` business-metrics projection (specs/business_metrics.yaml): its `riderId` measure is job ATTRIBUTION only (which rider held the job), never a `groupBy` dimension — no `metrics:` may group a handback rate by `riderId`, because a per-rider handback rate IS the performance-and-behaviour ground counsel's own gate refused before counsel (ADR-20260904-014136 §3): the right to refuse a proposal without penalty and the subordination criterion make a stored decline/handback-keyed ground the strongest requalification exhibit obtainable."


# --- Delivery partner self-registration (#61) ---
DeliveryPartnerSelfRegistersCityAvailability:
  description: "A delivery partner can self-register (via the EXTERNAL API) its availability to serve a city on a catalog channel; the registration is idempotent by its client-generated id and lands PENDING (#61)."

DeliveryPartnerAvailabilityGoesLiveOnlyAfterApproval:
  description: "A self-registered city availability becomes APPROVED (eligible for the city's dispatch ranking) only after an admin approves a PENDING registration; approving anything not PENDING is rejected, and a registration may later be revoked by the partner or an admin (#61)."


# --- Rider ---
RiderLifecycle:
  description: "A rider registers once (per auth user), may update editable profile fields, and changes availability status only through valid transitions."

RiderAuthSubjectBoundOnce:
  description: "One login credential binds to at most one rider id, forever: a registration whose authRef is already bound to another rider is rejected before any fact is recorded, and restricting a rider never frees the binding -- the same human always resolves to the same rider (#639 part C step 2a, #794)."

RiderStandingIsAGrant:
  description: "The seam admits a RIDER-role operation iff the identity row's `standing` is ACTIVE, or the operation declares `whileRestricted: [RIDER]`; a missing row is Unbound, never a grant (#639 part C step 4-i, ADR-20260904-081527 §1/§4)."

RiderRestrictionLifecycle:
  description: "Restrict only an unrestricted rider (RiderAlreadyRestricted otherwise); reinstate only a restricted one (RiderNotRestricted otherwise); a second ground needs a reinstatement first -- the Art. 11 log is never overwritten (#639 part C step 4-i, ADR-20260904-081527 §Enforced-by, ADR-20260904-014136)."

RestrictionTakesEffectWhenDecided:
  description: "V0: `effectiveAt == decidedAt`, both server-set, never in the past -- no admin-typed date, no clock term in the grant predicate (RIDER-REVOCATION-TTL, ADR-20260810-231300). The future scheduled form is designed, not shipped (#639 part C step 4-i, ADR-20260904-081527 §5)."

RestrictRiderIsAHumanAct:
  description: "RestrictRider/ReinstateRider are `roles: [ADMIN]` with `requires: acting: { ADMIN: any }` and no EXTERNAL key; no process manager may `send` either (validator `pm-sends-human-only-command`) and no PM inbox `emits` RiderRestricted (validator `pm-emits-human-only-event`) (#639 part C step 4-i, ADR-20260904-081527 §6/§8)."

RiderAvailabilityNeverSpellsRestriction:
  description: "ChangeRiderStatus takes RiderAvailabilityTarget (OFFLINE/AVAILABLE/ON_DELIVERY) — SUSPENDED is unspellable at this door — and a restricted rider's ChangeRiderStatus -> AVAILABLE is rejected RiderAccessRestricted (#639 part C step 4-i, ADR-20260904-081527 §6)."

RiderSignInIdentifiesOnly:
  description: "Rider sign-in is identify-only, never register: a verified phone whose login is bound to a rider stamps `{ role: RIDER }` (and nothing else -- no id) on the provider user and parks the post-stamp session; a verified phone with no rider behind it is refused with RiderNotRegistered and creates nothing; a login already carrying another role's claim is refused rather than overwritten; a confirmation that carries no session to own the parked credential is refused with RiderSignInRequiresSession BEFORE the OTP is spent, so a parked rider session always has an owner; and the code REQUEST never reveals whether the phone belongs to a rider (#639 part C step 2c-i)."
