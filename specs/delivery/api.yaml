version: 1
description: >
  delivery scope — api fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `api.yaml` catalog; $refs stay kind-logical
  (`api.yaml#/Name`), so moving an item between scope folders never rewrites a ref.

types:

  DeliveryJob:
    description: "One delivery of an order (ADR-0031): status, courier, addresses and ETAs. Serves the rider job list, the restaurant delivery board and admin."
    reads: [{ $ref: 'database/projection_views.yaml#/View_DeliveryJob' }]
    properties:
      id: { $ref: 'scalars.yaml#/DeliveryJobId' }
      orderId: { $ref: 'scalars.yaml#/OrderId' }
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId' }
      status: { $ref: 'scalars.yaml#/DeliveryStatus' }
      provider: { $ref: 'scalars.yaml#/DeliveryProvider', nullable: true }
      courier: { $ref: 'entities.yaml#/Courier', nullable: true }
      pickupAddress: { $ref: 'entities.yaml#/Address' }
      dropoffAddress: { $ref: 'entities.yaml#/Address' }
      estimatedPickupAt: { type: string, format: date-time, nullable: true }
      estimatedDropoffAt: { type: string, format: date-time, nullable: true }
      requestedAt: { type: string, format: date-time }
      pickedUpAt: { type: string, format: date-time, nullable: true }
      deliveredAt: { type: string, format: date-time, nullable: true }
      # #639 part C step 3-i: the open issue's kind, folded from DeliveryIssueReported and cleared
      # by DeliveryIssueResolved — the board's pinned card and the rider's "Problème signalé" chip.
      openIssue: { $ref: 'scalars.yaml#/DeliveryIssueKind', nullable: true }
      # #639 part C step 3-ii: where the food is, folded from DeliveryHandedBackByRider — the
      # board's pinned handback card headline and the customer tracking banner's predicate.
      foodLocation: { $ref: 'scalars.yaml#/FoodCustody', nullable: true }
      handedBackAt: { type: string, format: date-time, nullable: true }


  # #639 part C step 4-i (ADR-20260904-081527 §2/§4): the attribution behind a restriction, nested
  # under `myStanding` — no `reads:` (hand-written resolver, entities.yaml-style bare shape).
  RiderRestrictionInfo:
    description: "Why and when a rider's access is restricted (#639 part C step 4-i) — the Art. 11 attribution: ground, decidedAt, effectiveAt."
    properties:
      ground: { $ref: 'scalars.yaml#/RiderRestrictionGround', nullable: true }
      decidedAt: { type: string, format: date-time }
      effectiveAt: { type: string, format: date-time }

  # The rider's own standing answer (#639 part C step 4-i, ADR-20260904-081527 §4) — bootstraps the
  # `/restricted` screen (4-ii) with no `orderId` in hand: `heldDelivery` is keyed on
  # `ReadScope::Rider.id`, never the JWT `sub` (#869).
  RiderStandingInfo:
    description: "The calling rider's own standing (#639 part C step 4-i) — ACTIVE/RESTRICTED, the restriction attribution when restricted, and the held delivery job (if any) so the restricted rider's one control (hand it back) needs no second query."
    reads: [{ $ref: 'database/tables/projection_tables.yaml#/RiderRestriction' }, { $ref: 'database/projection_views.yaml#/View_DeliveryJob' }]
    properties:
      standing: { $ref: 'scalars.yaml#/RiderStanding' }
      restriction: { $ref: '#/types/RiderRestrictionInfo', nullable: true }
      heldDelivery: { $ref: '#/types/DeliveryJob', nullable: true }

  DeliveryPartnerAvailability:
    description: "A delivery partner's declared availability to serve a city on a catalog channel, with its review status (#61). Serves the EXTERNAL partner portal + the admin review queue."
    reads: [{ $ref: 'database/projection_views.yaml#/View_DeliveryPartnerAvailability' }]
    properties:
      registrationId: { $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId' }
      channel: { $ref: 'scalars.yaml#/DeliveryChannelKey' }
      cityId: { $ref: 'scalars.yaml#/CityId' }
      partnerName: { $ref: 'scalars.yaml#/DeliveryPartnerName' }
      contactEmail: { $ref: 'scalars.yaml#/EmailAddress' }
      status: { $ref: 'scalars.yaml#/CityAvailabilityStatus' }
      requestedAt: { type: string, format: date-time }
      decidedAt: { type: string, format: date-time, nullable: true }

queries:


  delivery:
    description: "The delivery job of an order (tracking); owning customer, the restaurant/admin, or the assigned rider. Ownership enforced server-side."
    args:
      orderId: { $ref: 'scalars.yaml#/OrderId', required: true }
    returns: { $ref: '#/types/DeliveryJob', nullable: true }
    roles: [CUSTOMER, RESTAURANT, RESTAURANT_ACCOUNT, RIDER, ADMIN]
    whileRestricted: [RIDER]   # #639 part C step 4-i, ADR-20260904-081527 §4: the held-job read stays reachable
    slice: V0

  # #639 part C step 4-i (ADR-20260904-081527 §4): the ONE additive query the restricted-rider carve-out
  # needs — NOT `myDeliveries` (refused §4: it hands the unassigned PENDING pool to whoever holds the
  # session, which under ACCOUNT_COMPROMISE is exactly the exposure the restriction closes). Keyed on
  # `ReadScope::Rider.id` — never the JWT `sub` (#869) — so the /restricted screen (4-ii) bootstraps
  # with no `orderId` in hand.
  myStanding:
    description: "The calling rider's own standing (#639 part C step 4-i): ACTIVE/RESTRICTED, the restriction attribution when restricted, and the held delivery job (if any)."
    returns: { $ref: '#/types/RiderStandingInfo' }
    roles: [RIDER]
    whileRestricted: [RIDER]
    slice: V0

  myDeliveries:
    description: "The independent rider's assigned/available delivery jobs (rider app)."
    args:
      status: { $ref: 'scalars.yaml#/DeliveryStatus' }
    returns: { $ref: '#/types/DeliveryJob', array: true }
    roles: [RIDER]
    slice: V0

  restaurantDeliveries:
    description: "A restaurant's active delivery jobs (delivery board; ownership enforced server-side)."
    args:
      restaurantId: { $ref: 'scalars.yaml#/RestaurantId', required: true }
      status: { $ref: 'scalars.yaml#/DeliveryStatus' }
    returns: { $ref: '#/types/DeliveryJob', array: true }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT]
    slice: V0


  deliveryPartnerAvailabilities:
    description: >
      Delivery-partner city-availability registrations (#61): a partner (EXTERNAL) reviews the state of
      its own submissions and an admin works the review queue. Optional filters by city, channel and
      status (status = PENDING is the admin review queue). EXTERNAL is a trusted partner-ACL role — no
      per-owner narrowing in this slice (a recorded gap; contact-scoped narrowing is a follow-up).
    args:
      cityId: { $ref: 'scalars.yaml#/CityId' }
      channel: { $ref: 'scalars.yaml#/DeliveryChannelKey' }
      status: { $ref: 'scalars.yaml#/CityAvailabilityStatus' }
    returns: { $ref: '#/types/DeliveryPartnerAvailability', array: true }
    roles: [EXTERNAL, ADMIN]
    slice: V1

mutations:

  # #865 (ADR-20260904-015903 §6, PROP-171500 D2, realized by #849 "#639 part C step 2b" /
  # ADR-20260830-191457 parts A+B's `auth.rs::resolve_rider_scope`): `riderId` is DERIVED from
  # the caller's `ReadScope::Rider` at the resolver seam, never a client input -- deleted from the
  # generated Input type entirely. `changeRiderStatus`'s riderId is REQUIRED, so the derived-role
  # rule forces `roles:` to EXACTLY [RIDER] -- the rider's own online/offline toggle; admin manages
  # a rider's LIFECYCLE (restriction/reinstatement) through `RestrictRider` instead
  # (ADR-20260904-014136 §Decision 6(i)), not through this door (the #95 comment this replaces read
  # "admin manages lifecycle (#95)", true of the FEATURE, never of THIS mutation's roles).
  changeRiderStatus:
    command: { $ref: 'commands.yaml#/ChangeRiderStatus' }
    roles: [RIDER]
    derived: { riderId: rider }
    slice: V0

  acceptDelivery:
    command: { $ref: 'commands.yaml#/AcceptDelivery' }
    roles: [RIDER]
    derived: { riderId: rider }
    slice: V0

  confirmPickup:
    command: { $ref: 'commands.yaml#/ConfirmPickup' }
    roles: [RIDER]
    derived: { riderId: rider }
    slice: V0

  completeDelivery:
    command: { $ref: 'commands.yaml#/CompleteDelivery' }
    roles: [RIDER]
    derived: { riderId: rider }
    slice: V0

  cancelDelivery:
    command: { $ref: 'commands.yaml#/CancelDelivery' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]
    slice: V0

  escalateDelivery:
    command: { $ref: 'commands.yaml#/EscalateDelivery' }
    roles: [RESTAURANT, ADMIN]   # restaurant/operator skips the current channel and advances the ranked dispatch walk (#60)
    slice: V0

  # The issue doors (#639 part C step 3-i, ADR-20260904-015903 §5) — additive, and the sets START
  # NARROW on purpose: widening a roles list later is additive, narrowing is a break. Step 4's
  # restricted-rider carve-out binds `reportDeliveryIssue` (with `handBackDelivery`, 3-ii).
  # #865: riderId is nullable on ReportDeliveryIssue (an ADMIN report carries none -- "ops
  # reported", the envelope's `user_id` says who), so the derived-role rule imposes no roles
  # constraint here; the resolver simply omits the key on the non-RIDER (ADMIN) path.
  reportDeliveryIssue:
    command: { $ref: 'commands.yaml#/ReportDeliveryIssue' }
    roles: [RIDER, ADMIN]   # the reporter, or ops on their behalf
    derived: { riderId: rider }
    whileRestricted: [RIDER]   # #639 part C step 4-i, ADR-20260904-081527 §4: a restricted rider may still report on the job they hold
    slice: V0

  resolveDeliveryIssue:
    command: { $ref: 'commands.yaml#/ResolveDeliveryIssue' }
    roles: [RESTAURANT, RESTAURANT_ACCOUNT, ADMIN]   # whoever is TOLD acts; the reporter never closes their own issue
    slice: V0

  declineDelivery:
    command: { $ref: 'commands.yaml#/DeclineDelivery' }
    roles: [RIDER]   # refuse a PENDING offer; the job stays PENDING and re-offerable (a fold no-op)
    derived: { riderId: rider }
    slice: V0

  # #639 part C step 3-ii, ADR-20260904-015903 §1/§5/§6: the second door in the restricted-rider's
  # carve-out (with reportDeliveryIssue, 3-i) — restriction of ACCESS is not release of CUSTODY
  # (#639 part C step 4-i, ADR-20260904-081527 §7: "restriction", never "revocation", for this act).
  # The input never carries riderId (#865 grammar): the resolver injects it from ReadScope::Rider.
  handBackDelivery:
    command: { $ref: 'commands.yaml#/HandBackDelivery' }
    roles: [RIDER]
    derived: { riderId: rider }
    whileRestricted: [RIDER]   # #639 part C step 4-i, ADR-20260904-081527 §4: restriction of ACCESS is not release of CUSTODY
    slice: V0


  # --- Rider standing: the human-only doors (#639 part C step 4-i, ADR-20260904-081527 §6/§11) -----
  restrictRider:
    command: { $ref: 'commands.yaml#/RestrictRider' }
    roles: [ADMIN]   # the target is payload (riderId), the actor is the envelope — no `derived:`
    slice: V0

  reinstateRider:
    command: { $ref: 'commands.yaml#/ReinstateRider' }
    roles: [ADMIN]
    slice: V0


  # Delivery partner self-registration (#61)
  registerDeliveryPartnerAvailability:
    command: { $ref: 'commands.yaml#/RegisterDeliveryPartnerAvailability' }
    roles: [EXTERNAL, ADMIN]   # the partner self-registers (EXTERNAL partner-ACL); admin may register on their behalf
    slice: V1

  approveDeliveryPartnerAvailability:
    command: { $ref: 'commands.yaml#/ApproveDeliveryPartnerAvailability' }
    roles: [ADMIN]             # admin-only review gate
    slice: V1

  revokeDeliveryPartnerAvailability:
    command: { $ref: 'commands.yaml#/RevokeDeliveryPartnerAvailability' }
    roles: [EXTERNAL, ADMIN]   # partner withdraws (EXTERNAL) or admin disables
    slice: V1


  # Rider sign-in door (#639 part C step 2c-i, PROP-20260831-180622 build-order row 2c) -- the
  # phone-OTP transposition of §5's staff pair. `roles: [PUBLIC]` is KEPT, with the justification
  # ADR-20260818-101500 requires rather than left to be discovered later: THE CALLER HAS NO
  # CREDENTIAL YET -- this IS the door that issues one, so there is no role it could arrive with,
  # and `verifyPhone` (the customer's PUBLIC door) is the established precedent. Identify-only:
  # nothing here registers anybody. Session delivery stays on POST /auth/session (never in the
  # GraphQL response). Reachable from the rider surface only through the R1 per-screen PUBLIC
  # capability (2c-ii, the next step) -- a staff surface cannot reach a PUBLIC operation today.
  requestRiderSignInCode:
    command: { $ref: 'commands.yaml#/RequestRiderSignInCode' }
    roles: [PUBLIC]   # necessity: no credential exists before this door; identical outcome for a rider's phone and a stranger's
    slice: V0

  confirmRiderSignIn:
    command: { $ref: 'commands.yaml#/ConfirmRiderSignIn' }
    roles: [PUBLIC]   # necessity: the OTP is the authentication; refuses an unknown phone, never registers
    slice: V0
