version: 1
description: >
  delivery scope — commands fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `commands.yaml` catalog; $refs stay kind-logical
  (`commands.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


# --- Delivery (bounded context: delivery) — ADR-0031 -----------------------
# Independent-rider commands on the DeliveryJob (the partner path is inbound events instead).

AcceptDelivery:
  description: "An independent Captain rider accepts a pending delivery job."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    riderId:
      $ref: 'scalars.yaml#/RiderId'
  required: [deliveryJobId, riderId]


ConfirmPickup:
  description: "The assigned rider confirms they collected the order from the restaurant."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    riderId:
      $ref: 'scalars.yaml#/RiderId'
  required: [deliveryJobId, riderId]




CancelDelivery:
  description: "Restaurant/admin cancels a delivery job before it completes."
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]


EscalateDelivery:
  description: >
    Restaurant/admin asks to skip the delivery channel currently offered and advance the ranked walk now
    (#60). The DeliveryJob emits DeliveryEscalationRequested; DeliveryDispatchProcess offers the next
    ranked channel, or fails the dispatch closed when the walk is exhausted. Self-dispatch and exhaustion
    are handled by the saga (a benign skip / a terminal fact), not rejected as command errors.
  type: object
  properties:
    deliveryJobId:
      $ref: 'scalars.yaml#/DeliveryJobId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]


# =====================================================================
# Delivery — operational commands (DeliveryJob aggregate)
# =====================================================================

CompleteDelivery:
  description: "The assigned rider marks the delivery complete (handed to the customer)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    riderId: { $ref: 'scalars.yaml#/RiderId' }
  required: [deliveryJobId, riderId]


DeclineDelivery:
  description: "An independent rider declines a pending delivery job (it stays PENDING, re-offerable)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId, riderId]


ReportDeliveryIssue:
  description: >
    Report an issue on a delivery job (rider/support) by its closed KIND, with an optional bounded
    note (#639 part C step 3-i, ADR-20260904-015903 §4 — the D2 controlled-enum-plus-note pattern).
    The report never moves the job's status; it tells the restaurant through the read model.
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    riderId:
      $ref: 'scalars.yaml#/RiderId'
      nullable: true
    kind: { $ref: 'scalars.yaml#/DeliveryIssueKind' }
    issue:
      type: string
      maxLength: 300
      nullable: true
      description: "Optional note — facts only, no description of persons (prompted on the rider sheet as such); personal data inside the order's stream, erased with the order's tombstone (ADR-20260731-160000)."
  required: [deliveryJobId, kind]


ResolveDeliveryIssue:
  description: >
    Acknowledge and close a reported delivery issue with a closed RESOLUTION kind and an optional
    bounded note (#639 part C step 3-i). Whoever was told acts — the reporter never closes their own
    issue (api roles). Requires an OPEN issue on a non-DELIVERED job.
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    resolution: { $ref: 'scalars.yaml#/DeliveryIssueResolution' }
    note:
      type: string
      maxLength: 300
      nullable: true
      description: "Optional note — facts only; same erasure scope as the report's note."
  required: [deliveryJobId, resolution]


UpdateDeliveryStatus:
  description: "Drive a delivery job's status (independent-rider path / admin correction)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    status: { $ref: 'scalars.yaml#/DeliveryStatus' }
  required: [deliveryJobId, status]


UnassignDeliveryFromPartner:
  description: "Unassign a delivery job from its partner (to re-offer it)."
  type: object
  properties:
    deliveryJobId: { $ref: 'scalars.yaml#/DeliveryJobId' }
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [deliveryJobId]


# =====================================================================
# Delivery partner self-registration (#61)
# =====================================================================
# A delivery partner (already integrated: a known catalog channel) declares availability to serve a city
# through the EXTERNAL API; an admin approves. Derived from the story-map "partner self-registers" use case.

RegisterDeliveryPartnerAvailability:
  description: >
    A delivery partner self-registers its availability to serve a city on a catalog channel (#61). Birth
    of a DeliveryPartnerRegistration; lands PENDING until an admin approves. registrationId is
    client-generated (idempotent).
  type: object
  properties:
    registrationId:
      $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId'
      description: "Client-generated id for the new availability registration."
    channel:
      $ref: 'scalars.yaml#/DeliveryChannelKey'
      description: "The catalog channel this partner operates (e.g. 'uber_direct')."
    cityId:
      $ref: 'scalars.yaml#/CityId'
    partnerName:
      $ref: 'scalars.yaml#/DeliveryPartnerName'
    contactEmail:
      $ref: 'scalars.yaml#/EmailAddress'
  required: [registrationId, channel, cityId, partnerName, contactEmail]


ApproveDeliveryPartnerAvailability:
  description: "An admin approves a PENDING delivery-partner availability registration (#61); it becomes eligible for the city's dispatch ranking."
  type: object
  properties:
    registrationId:
      $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId'
  required: [registrationId]


RevokeDeliveryPartnerAvailability:
  description: "Revoke a delivery-partner availability registration (#61) — the partner withdraws or an admin disables it."
  type: object
  properties:
    registrationId:
      $ref: 'scalars.yaml#/DeliveryPartnerRegistrationId'
    reason:
      type: string
      maxLength: 500
      nullable: true
  required: [registrationId]


# =====================================================================
# Rider (independent Captain courier)
# =====================================================================

RegisterRider:
  description: "Register as an independent Captain rider (linked to the auth provider user)."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    authRef: { $ref: 'scalars.yaml#/AuthSubject' }
    displayName:
      type: string
      maxLength: 200
    phone: { $ref: 'scalars.yaml#/PhoneNumber' }
  required: [riderId, authRef, displayName, phone]


UpdateRiderInfo:
  description: "Update editable rider profile fields."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    displayName:
      type: string
      maxLength: 200
      nullable: true
    phone:
      $ref: 'scalars.yaml#/PhoneNumber'
      nullable: true
  required: [riderId]


ChangeRiderStatus:
  description: "Change a rider's availability/lifecycle status."
  type: object
  properties:
    riderId: { $ref: 'scalars.yaml#/RiderId' }
    status: { $ref: 'scalars.yaml#/RiderStatus' }
  required: [riderId, status]


# --- Rider sign-in door (#639 part C step 2c-i, PROP-20260831-180622 build-order row 2c) ---------
# The phone-OTP transposition of the proposal's §5 staff pair. IDENTIFY-ONLY, never register: a
# verified phone with no rider behind it is REFUSED and creates nothing -- which is exactly why
# `VerifyPhone` (register-or-identify) is not reused with a wider roles list (ADR-20260818-101500).

RequestRiderSignInCode:
  description: >
    Ask the auth provider to send an SMS OTP to a rider's phone (the same OVHcloud SMS hook and the
    same send guards as RequestPhoneVerification). Emits no event, and MUST NOT reveal whether the
    phone belongs to a rider: the handler never consults the rider read model, so the outcome is
    identical for a rider's phone and a stranger's (no enumeration oracle).
  type: object
  properties:
    dialingCode: { $ref: 'scalars.yaml#/DialingCode' }
    nationalNumber: { $ref: 'scalars.yaml#/NationalPhoneNumber' }
    locale:
      $ref: 'scalars.yaml#/Locale'
      nullable: true
      description: "SMS language; defaults from the dialing code's country when absent."
  required: [dialingCode, nationalNumber]


ConfirmRiderSignIn:
  description: >
    Verify the SMS OTP with the auth provider, then IDENTIFY the rider: the proved auth subject is
    looked up in the `Rider` read model (`auth_ref -> rider_id`, the step-2b port); no rider ->
    RiderNotRegistered (nothing is created); a rider -> the RIDER role claim is stamped on the
    provider user (`identity.stamp_rider_claim`, `{ role: RIDER }` and nothing else) and the
    post-stamp provider session is parked for cookie pickup via POST /auth/session -- the
    credential is never in the GraphQL response. Emits no event.
  type: object
  properties:
    dialingCode: { $ref: 'scalars.yaml#/DialingCode' }
    nationalNumber: { $ref: 'scalars.yaml#/NationalPhoneNumber' }
    code: { $ref: 'scalars.yaml#/OtpCode' }
  required: [dialingCode, nationalNumber, code]
