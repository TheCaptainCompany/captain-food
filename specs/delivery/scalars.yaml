version: 1
description: >
  delivery scope — scalars fragment (ADR-20260807-183024 D1, #375). Merged by the
  codegen loader into the logical `scalars.yaml` catalog; $refs stay kind-logical
  (`scalars.yaml#/Name`), so moving an item between scope folders never rewrites a ref.


DeliveryJobId:
  type: string
  format: uuid
  description: "Identifies one DeliveryJob (a single delivery of an order from restaurant to customer)."


CityId:
  type: string
  format: uuid
  description: "A city Captain operates in — the scope that anchors delivery routing config (CityDeliveryRanking) and, later, partner availability. First-class id (delivery dispatch strategy foundation, #60)."


RiderStatus:
  type: string
  enum:
    - OFFLINE        # not accepting jobs
    - AVAILABLE      # online, can be offered jobs
    - ON_DELIVERY    # currently fulfilling a delivery
    # LEGACY — retired by RiderRestricted (ADR-20260904-014136 §4, ADR-20260904-081527 §6);
    # unspellable at the command door (ChangeRiderStatus takes RiderAvailabilityTarget instead),
    # parse-only so a stored legacy row still decodes.
    - SUSPENDED
  description: "Availability/lifecycle status of an independent Captain rider."


# #639 part C step 4-i (ADR-20260904-081527 §6): the target vocabulary ChangeRiderStatus accepts —
# one name, one scalar, deliberately narrower than RiderStatus so SUSPENDED cannot be spelled at the
# door. The event keeps RiderStatus (SUSPENDED stays a decodable legacy value).
RiderAvailabilityTarget:
  type: string
  enum:
    - OFFLINE
    - AVAILABLE
    - ON_DELIVERY
  description: "The rider-settable availability targets for ChangeRiderStatus (#639 part C step 4-i, ADR-20260904-081527 §6) — RiderStatus minus the retired SUSPENDED, so an admin-imposed restriction cannot be spelled through this door."


# #639 part C step 4-i (ADR-20260904-081527 §1): the platform's GRANT on the rider identity row —
# orthogonal to availability (RiderStatus): an OFFLINE rider is ACTIVE, and a RESTRICTED rider may
# legitimately be ON_DELIVERY holding food (the held-job carve-out). Named `standing`, not `status`:
# RiderStatus is the rider's own fact, standing is the platform's.
RiderStanding:
  type: string
  enum:
    - ACTIVE
    - RESTRICTED
  description: "The platform's grant on a rider's identity row (#639 part C step 4-i, ADR-20260904-081527 §1) — orthogonal to RiderStatus (availability). ACTIVE admits every door; RESTRICTED admits only the carve-out (myStanding, delivery, reportDeliveryIssue, handBackDelivery)."


# #639 part C step 4-i (ADR-20260904-081527 §3, ADR-20260904-014136): the closed set of grounds a
# human admin may cite to restrict a rider (Art. 11(5) Directive 2024/2831 — additive-only, counsel
# can only ADD). `readOnlyCatchAll: UNRECOGNISED` (docs/claude/dsl.md "readOnlyCatchAll") declares a
# READ-ONLY decode-tolerant variant: the Rust enum gets `#[serde(other)]`, the GraphQL SDL enum
# EXCLUDES it (unspellable at any write door), `EnumText::from_text` tolerates it rather than
# failing the whole `Rider-{id}` stream load. The raw stored text stays in the immutable
# `domain_events.payload` for counsel; UNRECOGNISED itself is never emitted by any command.
RiderRestrictionGround:
  type: string
  enum:
    - RIDER_REQUESTED
    - ELIGIBILITY_DOCUMENT_LAPSED
    - IDENTITY_MISMATCH
    - ACCOUNT_COMPROMISE
  readOnlyCatchAll: UNRECOGNISED
  description: "The closed, additive-only set of grounds a human admin cites to restrict a rider's access (#639 part C step 4-i, ADR-20260904-014136, ADR-20260904-081527 §3/§7). No free text rides beside it — the narrative the restriction ADR made unspellable would re-enter by the side door."


# Who fulfils a delivery: an external delivery PARTNER (e.g. Avelo37, with its own couriers) or an
# INDEPENDENT Captain rider (RIDER role) accepting the job directly. Both converge on one DeliveryJob.
DeliveryProvider:
  type: string
  enum: [PARTNER, INDEPENDENT]
  description: "Fulfilment channel of a delivery: PARTNER (e.g. Avelo37) or INDEPENDENT (a Captain rider)."


# --- Delivery issue vocabulary (#639 part C step 3-i, ADR-20260904-015903 §4; the D2 pattern of
# ADR-20260808-171056: a controlled enum + an optional bounded note, never free text alone) ---------
DeliveryIssueKind:
  type: string
  enum:
    - ADDRESS_NOT_FOUND      # the rider cannot locate the drop-off
    - CUSTOMER_UNREACHABLE   # at the door, no answer
    - RESTAURANT_NOT_READY   # at pickup, the order is not ready
    - FOOD_DAMAGED           # the bag/food is not deliverable
    - VEHICLE_OR_INJURY      # the rider cannot continue for their own reason
    - OTHER                  # the note carries the facts (bounded, no description of persons)
  description: "The closed set of reasons a rider (or ops) reports an issue on a delivery job — one tap on the rider sheet; the restaurant board headlines the card with it. OTHER is the only kind that expects a note (#639 part C step 3-i)."


DeliveryIssueResolution:
  type: string
  enum:
    - REASSIGNED               # the job was re-offered / another courier takes it
    - DELIVERED_BY_RESTAURANT  # the restaurant delivered it itself
    - CANCELLED                # the delivery was cancelled
    - OTHER                    # the note carries the facts
  description: "The closed set of outcomes whoever was TOLD of a delivery issue records when acknowledging it (#639 part C step 3-i); the reporter never closes their own issue."


# --- Custody vocabulary (#639 part C step 3-ii, ADR-20260904-015903 §1 Decision 1): where the food
# physically is when a rider hands a job back. One name = one scalar; no free-text `reason` rides
# alongside it (legal: the narrative the restriction ADR made unspellable would re-enter by the side
# door) — HandBackDelivery carries exactly this and nothing else.
FoodCustody:
  type: string
  enum:
    - NOT_COLLECTED          # the rider never picked up — derived from ASSIGNED, never asked
    - RETURNED_TO_RESTAURANT # the rider physically handed the bag back to the kitchen
    - WITH_RIDER             # the rider still has it — a re-offer would be an oversell
  description: "Where a delivery job's food physically is at the moment a rider hands the job back (#639 part C step 3-ii). Drives the custody-keyed lifecycle: RETURNED_TO_RESTAURANT re-offers (PENDING), WITH_RIDER fails closed (FAILED) rather than risk a second courier taking food the first one still holds."


DeliveryChannelKey:
  type: string
  pattern: "^[a-z0-9]+(?:_[a-z0-9]+)*$"
  maxLength: 40
  description: "Slug key of a delivery channel in the DeliveryChannelCatalog (e.g. 'independent', 'avelo37', 'uber_direct', 'coopcycle'). Data-driven (a new partner = a catalog row + an adapter), so channels are NOT a fixed enum (#60)."


# --- Delivery partner self-registration (#61) ---
# A delivery partner declares its availability to serve a city on a known catalog channel through the
# EXTERNAL GraphQL API; an admin reviews it. The approved set is the substrate the city dispatch
# ranking (#60) consumes (dispatch wiring is a follow-up). Runtime write-path over domain_events.
DeliveryPartnerRegistrationId:
  type: string
  format: uuid
  description: "A delivery partner's self-registration of availability to serve one city on one catalog channel (#61). Client-generated; the aggregate id of the DeliveryPartnerRegistration."


DeliveryPartnerName:
  type: string
  maxLength: 200
  description: "The delivery partner's display/legal name as stated on self-registration (#61)."


CityAvailabilityStatus:
  type: string
  enum:
    - PENDING           # self-registered, awaiting admin review
    - APPROVED          # an admin approved it; eligible for the city's dispatch ranking (#60 consumption is a follow-up)
    - REVOKED           # withdrawn by the partner or disabled by an admin; not eligible
  description: "Review state of a delivery partner's declared availability to serve a city (#61): PENDING until an admin approves, APPROVED = live for dispatch consideration, REVOKED = withdrawn/disabled."
