version: 1
description: >
  Captain.Food MATERIALIZED read-model TABLES (ADR-0039/0040) — the read models whose columns are NOT a
  pure state-fold the codegen can generate as a SQL VIEW (contrast specs/database/projection_views.yaml,
  which holds the generated `View_*` folds). These are real `CREATE TABLE`s under tables/, filled by a
  projector; queries read them exactly like the fold views (api.yaml `reads`). Same metadata as a view
  (aggregate/slice/fedBy/rules/columns with `from` lineage) so the validator still proves API↔read-model.

  Conventions (in addition to a view's):
    - projector : how the table is maintained from domain_events. Always `app` — an application-layer
                  (Rust) projector subscribing to domain_events, in crates/application/infrastructure
                  (ADR-0040). Projection logic stays in the tested application layer, NOT in SQL triggers,
                  so business rules never leak into the DB and the event-store append is never coupled to a
                  read-model projection. A deferred runtime contract until crates/ exists.
    - name      : the table name (top-level key), NOT prefixed `View_` — it is a real table, not a view.


Restaurant:
  projector: app   # mechanically foldable (+ a cross-stream default_currency lookup from the account stream), but maintained by the app-layer projector for uniformity
  aggregate: Restaurant
  slice: V0
  fedBy:
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantUpdated' }
    - { $ref: 'events.yaml#/RestaurantActivated' }
    - { $ref: 'events.yaml#/RestaurantDeactivated' }
    - { $ref: 'events.yaml#/RestaurantAcceptanceModeChanged' }
    - { $ref: 'events.yaml#/RestaurantRemoved' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated' }
    - { $ref: 'events.yaml#/RestaurantListingClaimed' }
    - { $ref: 'events.yaml#/RestaurantListingOptedOut' }
    - { $ref: 'events.yaml#/RestaurantMarkedClosed' }
    - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkConfigured' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkVerified' }
    - { $ref: 'events.yaml#/RestaurantSlugConfigured' }       # the storefront host, once the owner picks it
    - { $ref: 'events.yaml#/RestaurantSlugReconfigured' }     # a rename moves it (the old label lives on in SlugAlias)
    - { $ref: 'events.yaml#/RestaurantAccountRegistered' }   # folds the account's default_currency onto its locations
  columns:
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }]
      pk: true
    restaurant_account_id:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/accountId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/accountId' }
      index: true
      nullable: true
      # No `fk:` — View_RestaurantAccount was deleted as unread (ADR below). The account id is still
      # carried and indexed (restaurantLocationsByAccount queries by it); it just no longer points at a
      # read model, so there is no read-navigation edge to declare.
      note: "NULL for a non-partner public listing; set on claim/conversion."
    listing_status:
      type: { $ref: 'scalars.yaml#/RestaurantListingStatus' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/listingStatus' }
        - { $ref: 'events.yaml#/RestaurantListingStatusChanged/properties/listingStatus' }
      index: true
    external_identifiers:
      type: jsonb
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/externalIdentifiers' }]
      nullable: true
      note: "Source-agnostic [{key,value}] (siret/naf/google_place_id…); not unique."
    google_place_id:
      from:
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/googlePlaceId' }
      type: { $ref: 'scalars.yaml#/GooglePlaceId' }
      nullable: true
    slug:
      # NULL until the owner configures one, then the storefront host (ADR-20260728-011344).
      # `unique` + `nullable` is exactly right here: Postgres permits many NULLs in a unique index,
      # so ~200k unconfigured open-data listings coexist while the DATABASE enforces uniqueness over
      # precisely the configured set. Registration no longer feeds this column.
      from:
        - { $ref: 'events.yaml#/RestaurantSlugConfigured/properties/slug' }
        - { $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/slug' }
      unique: true
      nullable: true
    display_name:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/displayName' }
    description:
      type: { $ref: 'scalars.yaml#/RestaurantDescription' }
      from: [{ $ref: 'events.yaml#/RestaurantUpdated/properties/description' }]
      nullable: true
    tags:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/tags' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/tags' }
      nullable: true
      note: "Cuisine/attribute tags — general restaurant info (source-agnostic), not from the GBP event."
    margin_rate:
      type: { $ref: 'scalars.yaml#/MarginPercent' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/marginRate' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/marginRate' }
      nullable: true
      note: "Food margin %, input to the Captain service-fee split (ADR-0017); back-office only."
    cuisine_category:
      type: { $ref: 'scalars.yaml#/CuisineCategory' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/cuisineCategory' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/cuisineCategory' }
      nullable: true
      note: "Selects the Uber Eats price-estimate coefficient in UberEstimationPolicy (ADR-0024)."
    uber_prices_opt_in:
      type: boolean
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/uberPricesOptIn' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/uberPricesOptIn' }
      nullable: true
      note: "Restaurant authorized showing its real Uber prices via HubRise (ADR-0023). Gates REAL vs ESTIMATED basis."
    website:
      type: { $ref: 'scalars.yaml#/WebUrl' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/website' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/website' }
      nullable: true
    rating:
      type: { $ref: 'scalars.yaml#/GoogleRating' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/rating' }]
      nullable: true
      note: "GBP-specific metric (Google listing), independent of the restaurant's own info."
    reviews_count:
      type: integer
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/reviewsCount' }]
      nullable: true
    gbp_order_url:
      type: { $ref: 'scalars.yaml#/WebUrl' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkConfigured/properties/gbpOrderUrl' }]
      nullable: true
    gbp_link_status:
      type: { $ref: 'scalars.yaml#/GbpLinkStatus' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkVerified/properties/status' }]
      nullable: true
    address:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/address' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/address' }
    location:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/location' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/location' }
      nullable: true
      note: "Geo coordinates {latitude, longitude}; typically from the Google Maps sync."
    opening_hours:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/openingHours' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/openingHours' }
    status:
      type: { $ref: 'scalars.yaml#/RestaurantStatus' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantActivated' }
        - { $ref: 'events.yaml#/RestaurantDeactivated' }
        - { $ref: 'events.yaml#/RestaurantRemoved' }
        - { $ref: 'events.yaml#/RestaurantMarkedClosed' }
      note: "Derived from the lifecycle event type: DRAFT on register, ACTIVE/INACTIVE on (de)activation, INACTIVE on closure."
    order_acceptance:
      from: [{ $ref: 'events.yaml#/RestaurantAcceptanceModeChanged/properties/mode' }]
    default_currency:
      from: [{ $ref: 'events.yaml#/RestaurantAccountRegistered/properties/defaultCurrency' }]
    timezone:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/timezone' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/timezone' }
      nullable: true
      note: "Location timezone; falls back to the account's when null."
    preparation_time_minutes:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/preparationTimeMinutes' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/preparationTimeMinutes' }
      nullable: true
SlugAlias:
  projector: app   # one row per SUPERSEDED label -- the projector keys on previousSlug, not the aggregate id
  aggregate: Restaurant
  slice: V0
  note: >
    Superseded storefront labels, so a renamed restaurant's OLD host keeps resolving
    (ADR-20260728-011344). `hosts.rs` resolves an incoming Host header against `Restaurant.slug` first
    and falls back here, answering 301 -> the current address. Without this, a rename instantly 404s
    every printed menu, QR code, inbound link and search result pointing at the old label -- which is why
    `RestaurantSlugReconfigured` carries `previousSlug` as business data rather than leaving it to be
    re-derived by folding history. Host resolution runs on EVERY request and must never fold.
  fedBy:
    - { $ref: 'events.yaml#/RestaurantSlugReconfigured' }
  rules:
    - "One row per superseded label, keyed by that label. A restaurant renamed N times leaves N rows -- each recording the address that superseded it AT THAT MOMENT, which is a historical fact and therefore never stale."
    - "`current_slug` is NOT how a redirect is resolved: after A->B->C, row A still says B. `hosts.rs` resolves the alias to `restaurant_id` and reads that restaurant's CURRENT slug from the Restaurant projection, so every superseded label lands on the live address in ONE hop rather than walking a 301 chain."
    - "Rows are never deleted: the reservation table bars reuse of a released label, so an alias can never start pointing at a different business."
  columns:
    previous_slug:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/previousSlug' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/restaurantId' }]
      index: true
      # Deliberately NO `fk`. This table is server-internal -- `hosts.rs` reads it during host
      # resolution and no api.yaml query exposes it -- and an `fk` is what makes the codegen weave a
      # GraphQL navigation edge. Declaring one here produced a self-referential `Restaurant.restaurant`
      # field (an infinitely-sized type). Integrity holds by construction instead: the projector only
      # ever writes a row while folding an event off an existing Restaurant stream.
    current_slug:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/slug' }]
      note: "The address that superseded `previous_slug` at the time of the rename. Historical, not authoritative -- see the rules above: resolution goes through `restaurant_id`."

ProspectionPipeline:
  projector: app   # weighted 0–10 score COMPUTED from listing facts (never in an event) — application logic
  aggregate: Prospect
  slice: V1
  note: "B2B prospection pipeline (ADR-0020): one row per worked listing, with the COMPUTED score and outreach state. Read by the admin prospectionPipeline query."
  fedBy:
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated' }
    - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
    - { $ref: 'events.yaml#/ProspectContacted' }
    - { $ref: 'events.yaml#/ProspectMarkedCold' }
    - { $ref: 'events.yaml#/ProspectReplied' }
  filters:
    - "Rows for NON_PARTNER / PASSIVE_PARTNER listings (active prospects); CONVERTED once ACTIVE_PARTNER."
  rules:
    - "`score` (0–10) is COMPUTED by the projection from listing facts, NEVER stored in an event: food-truck NAF 56.10C +3, Google rating ≥4.0 +2, reviews <20 +2, created <12mo +2, no website +1, already on Uber/Deliveroo −2, national franchise −3; clamped to 0–10."
    - "Inputs not yet captured as fields (Sirene creation date, on-aggregator, national franchise) are best-effort/V1; the formula degrades gracefully to the available signals."
    - "`pipeline_status` is derived: NEW (no contact) → CONTACTED → COLD (ProspectMarkedCold) / REPLIED (ProspectReplied); CONVERTED when RestaurantListingStatusChanged reaches ACTIVE_PARTNER."
  columns:
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }]
      pk: true
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    score:
      type: { $ref: 'scalars.yaml#/ProspectionScore' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/externalIdentifiers' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/website' }
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/rating' }
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/reviewsCount' }
      index: true
      note: "Derived (see rules); not an event field."
    pipeline_status:
      type: { $ref: 'scalars.yaml#/ProspectPipelineStatus' }
      from:
        - { $ref: 'events.yaml#/ProspectContacted' }
        - { $ref: 'events.yaml#/ProspectMarkedCold' }
        - { $ref: 'events.yaml#/ProspectReplied' }
        - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
      index: true
      note: "Derived from the prospect events + listingStatus (see rules)."
    contacts_count:
      type: integer
      from: [{ $ref: 'events.yaml#/ProspectContacted' }]
      note: "Count of ProspectContacted; drives the anti-spam ≤3 rule."
    last_contacted_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ProspectContacted' }]
      nullable: true
    replied_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ProspectReplied' }]
      nullable: true

Customer:
  projector: app   # scalar folds + jsonb ACCUMULATIONS (favorites/addresses/ratings) — maintained by the app-layer projector
  aggregate: Customer
  slice: V0
  note: "Identity/lookup read model: resolves a returning phone (or auth_ref) to an existing Customer, backs VerifyPhone idempotency + auth resolution, and serves the `me` query (CustomerProfile). Also bound when CustomerIdentified stamps carts. The stored `locale` localizes authenticated SMS/email sends."
  fedBy:
    - { $ref: 'events.yaml#/CustomerRegistered' }
    - { $ref: 'events.yaml#/RestaurantRated' }
    - { $ref: 'events.yaml#/RestaurantFavorited' }
    - { $ref: 'events.yaml#/RestaurantUnfavorited' }
    - { $ref: 'events.yaml#/CustomerInfoUpdated' }
    - { $ref: 'events.yaml#/CustomerEmailVerified' }
    - { $ref: 'events.yaml#/CustomerPhoneChanged' }
    - { $ref: 'events.yaml#/CustomerLanguageChanged' }
    - { $ref: 'events.yaml#/CustomerPreferencesSet' }
    - { $ref: 'events.yaml#/CustomerAddressSet' }
    - { $ref: 'events.yaml#/CustomerAddressRemoved' }
    - { $ref: 'events.yaml#/CustomerPaymentMethodSet' }
  rules:
    - "`ratings` accumulates the customer's own restaurant ratings (from RestaurantRated) so they can see how they rated each restaurant."
    - "`favorite_restaurant_ids` is maintained from RestaurantFavorited/RestaurantUnfavorited; the favoriteRestaurants query joins it to Restaurant."
  columns:
    customer_id:
      from: [{ $ref: 'events.yaml#/CustomerRegistered/properties/customerId' }]
      pk: true
    phone:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/phone' }
        - { $ref: 'events.yaml#/CustomerPhoneChanged/properties/phone' }
      unique: true
    auth_ref:
      from: [{ $ref: 'events.yaml#/CustomerRegistered/properties/authRef' }]
      index: true
      nullable: true
      note: "Auth provider user id (Supabase Auth) → Customer."
    display_name:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/CustomerInfoUpdated/properties/displayName' }
      nullable: true
    email:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/email' }
        - { $ref: 'events.yaml#/CustomerEmailVerified/properties/email' }
      nullable: true
    email_verified:
      type: boolean
      from: [{ $ref: 'events.yaml#/CustomerEmailVerified' }]
      note: "True once an email magic link has been confirmed (CustomerEmailVerified)."
    locale:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/locale' }
        - { $ref: 'events.yaml#/CustomerLanguageChanged/properties/locale' }
      nullable: true
      note: "i18n culture; set at registration or via ChangeLanguage. Localizes authenticated SMS/email sends."
    timezone:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/timezone' }
        - { $ref: 'events.yaml#/CustomerPreferencesSet/properties/timezone' }
      nullable: true
    ratings:
      type: jsonb
      from: [{ $ref: 'events.yaml#/RestaurantRated' }]
      note: "The customer's own submitted ratings (assembled from RestaurantRated): [{ order_id, restaurant_id, stars, comment, rated_at }]."
    favorite_restaurant_ids:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/RestaurantFavorited' }
        - { $ref: 'events.yaml#/RestaurantUnfavorited' }
      note: "[restaurant_id] the customer favorited."
    preferences:
      type: jsonb
      from: [{ $ref: 'events.yaml#/CustomerPreferencesSet' }]
      nullable: true
      note: "{ dietary_tags: [...], favorite_cuisines: [...] } from CustomerPreferencesSet."
    addresses:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CustomerAddressSet' }
        - { $ref: 'events.yaml#/CustomerAddressRemoved' }
      note: "Saved address book: [{ address_id, label, address }] from CustomerAddressSet/Removed."
    payment_method_id:
      from: [{ $ref: 'events.yaml#/CustomerPaymentMethodSet/properties/paymentMethodId' }]
      nullable: true
Catalog:
  projector: app   # nested category→product→offer TREE assembled from an event stream — application logic
  aggregate: Catalog
  slice: V0
  fedBy:
    - { $ref: 'events.yaml#/CatalogCreated' }
    - { $ref: 'events.yaml#/CatalogCategoryAdded' }
    - { $ref: 'events.yaml#/CatalogCategoryUpdated' }
    - { $ref: 'events.yaml#/CatalogCategoryRemoved' }
    - { $ref: 'events.yaml#/ProductAdded' }
    - { $ref: 'events.yaml#/ProductUpdated' }
    - { $ref: 'events.yaml#/ProductRemoved' }
    - { $ref: 'events.yaml#/OptionListAdded' }
    - { $ref: 'events.yaml#/OptionListUpdated' }
    - { $ref: 'events.yaml#/OptionListRemoved' }
    - { $ref: 'events.yaml#/OfferStockUpdated' }
    - { $ref: 'events.yaml#/CatalogImported' }
    - { $ref: 'events.yaml#/CatalogSlugConfigured' }   # the storefront route, once the owner picks it
  rules:
    - "`stock_status` is derived (quantity vs lowStockThreshold); orderable = AVAILABLE and stock > 0."
    - "Could be normalized (one row per offer) if per-item querying is needed later."
    - "Each offer carries a derived `uberPrice` { amountCents, currency } + `uberPriceBasis` for the product-level comparison (ADR-0022): ESTIMATED = UberEstimationPolicy[restaurant.cuisine_category].price_coefficient × offer price (null when the restaurant has no cuisine_category); REAL = the restaurant's own Uber price when uber_prices_opt_in and a HubRise Uber menu is present (ingestion deferred — runtime). Always labelled."
  columns:
    catalog_id:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/catalogId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/restaurantId' }]
      index: true
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    slug:
      type: { $ref: 'scalars.yaml#/Slug' }
      from: [{ $ref: 'events.yaml#/CatalogSlugConfigured/properties/slug' }]
      nullable: true
      note: "Null until the owner configures it (ConfigureCatalogSlug) -- the unset case is first-class, not an empty string, exactly like Restaurant.slug."
    name:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/name' }]
    tree:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CatalogCategoryAdded' }
        - { $ref: 'events.yaml#/CatalogCategoryUpdated' }
        - { $ref: 'events.yaml#/CatalogCategoryRemoved' }
        - { $ref: 'events.yaml#/ProductAdded' }
        - { $ref: 'events.yaml#/ProductUpdated' }
        - { $ref: 'events.yaml#/ProductRemoved' }
        - { $ref: 'events.yaml#/OptionListAdded' }
        - { $ref: 'events.yaml#/OptionListUpdated' }
        - { $ref: 'events.yaml#/OptionListRemoved' }
        - { $ref: 'events.yaml#/OfferStockUpdated' }
        - { $ref: 'events.yaml#/CatalogImported' }
      note: "Assembled tree: categories -> products -> offers { price_cents, currency, availability, stock_status, uberPrice?, uberPriceBasis? } + option lists. See rules for how uberPrice is derived (ADR-0022/0024)."
Cart:
  projector: app   # hand-written fold (crates/application/src/projectors/cart.rs) — a PURE, money-free fold of the cart events; NO catalog/policy read inside the fold
  aggregate: Cart
  slice: V0
  note: >
    MONEY-FREE fold (PROP-20260810-231500 Option B, ADR-20260810-112836): the row stores only
    identity, status and the REPRICING INPUTS (per line: offer_id, quantity, selected_option_ids).
    A replay reproduces these rows exactly — the fold reads nothing outside the event stream.
    Prices are computed AT READ TIME by `application::pricing::price_cart` against the live
    catalog (the same authority the checkout write path uses); the authoritative price freeze
    happens once, on PaymentIntentCreated.CheckoutSnapshot.
  fedBy:
    - { $ref: 'events.yaml#/CartStarted' }
    - { $ref: 'events.yaml#/CartLineAdded' }
    - { $ref: 'events.yaml#/CartLineQuantityChanged' }
    - { $ref: 'events.yaml#/CartLineRemoved' }
    - { $ref: 'events.yaml#/CartCheckedOut' }
    - { $ref: 'events.yaml#/CartBoundToCustomer' }
  rules:
    - "The fold is PURE and money-free: no price, currency, breakdown or comparison is stored — the read side prices the lines fresh on every read via price_cart (LIVE catalog), fail-closed on an unresolvable line (PriceUnresolvable → the honest no-price state, never a stale or client number)."
    - "`customer_id` is NULL while the cart is owned by a guest; bound when CartBindingProcess reacts to CustomerIdentified by sending BindCartToCustomer to each OPEN cart of the session (same-stream CartBoundToCustomer), or at checkout."
    - "The estimated PaymentBreakdown and UberComparison shown on the cart (ADR-0018/0022/0025) are READ-TIME computations from the freshly priced food total + PricingPolicy / Uber*Policy — same formulas as before, no longer materialized. Recomputed authoritatively on OrderPlaced.breakdown."
  indexes:
    - [customer_id, updated_at]   # the claim-resolved "most-recently-updated OPEN cart" lookup (queries/current) — a seq scan without it; status is filtered app-side (two-value enum, low selectivity)
  columns:
    cart_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/cartId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/restaurantId' }]
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    session_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/sessionId' }]
      index: true
      note: "The visitor session that started the cart; CartBindingProcess binds all OPEN carts of a session on CustomerIdentified."
    customer_id:
      from:
        - { $ref: 'events.yaml#/CartStarted/properties/customerId' }
        - { $ref: 'events.yaml#/CartBoundToCustomer/properties/customerId' }
      nullable: true
      fk: { $ref: '#/Customer/columns/customer_id' }
      note: "NULL while guest; bound by CartBoundToCustomer (CartBindingProcess sends BindCartToCustomer per open cart of the identified session) or at checkout."
    status:
      type: { $ref: 'scalars.yaml#/CartStatus' }
      from:
        - { $ref: 'events.yaml#/CartStarted' }
        - { $ref: 'events.yaml#/CartCheckedOut' }
      note: "Derived from event type: OPEN on CartStarted, CHECKED_OUT on CartCheckedOut."
    lines:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CartLineAdded' }
        - { $ref: 'events.yaml#/CartLineQuantityChanged' }
        - { $ref: 'events.yaml#/CartLineRemoved' }
      note: "MONEY-FREE repricing inputs, folded verbatim from the cart events: [{ cart_line_id, offer_id, quantity, selected_option_ids }]. NO stored price/name fields — the read side resolves names and prices from the live catalog via price_cart."
OrderTracking:
  projector: app   # tip Σ-by-recipient + uber_* comparison COMPUTED by the projector — application logic
  aggregate: Order
  slice: V0
  note: >
    The single canonical Order read model. Folds the Order lifecycle + Stripe payment facts (secondary
    source). Serves every order query — by id (`order`), by customer (history) and by restaurant+status
    (back-office queue) — via the indexes below; there is no separate per-persona order projection.
  fedBy:
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
    - { $ref: 'events.yaml#/OrderPreparationStarted' }
    - { $ref: 'events.yaml#/OrderMarkedReady' }
    - { $ref: 'events.yaml#/OrderDelivered' }
    - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
    - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
    - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
    - { $ref: 'events.yaml#/PaymentCaptured' }
    - { $ref: 'events.yaml#/PaymentRefunded' }
    - { $ref: 'events.yaml#/OrderRated' }
    - { $ref: 'events.yaml#/RestaurantRated' }
    - { $ref: 'events.yaml#/DeliverySatisfactionRecorded' }
    - { $ref: 'events.yaml#/OrderTipped' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
    - { $ref: 'events.yaml#/DeliveryPickedUp' }
    - { $ref: 'events.yaml#/DeliveryStatusUpdated' }
    - { $ref: 'events.yaml#/DeliveryCompleted' }
    - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
  rules:
    - "`payment_status` is folded from the Stripe payment facts."
    - "`delivery_status`/`courier`/`estimated_dropoff_at` mirror the order's DeliveryJob (correlated by order_id) so the customer's order view shows live delivery progress (ADR-0031); the full operational board is View_DeliveryJob."
    - "Rating columns are populated from OrderRated (rider_thumb), RestaurantRated (restaurant_stars + comment); null until the customer acts. The restaurant reads restaurant_stars/comment to see its rating."
    - "`delivery_timeliness` is the customer's post-delivery delay verdict (DeliverySatisfactionRecorded; #62); null until answered — the client hides the survey once set. The restaurant-facing aggregate is View_DeliverySatisfaction."
    - "`*_tip_cents` sum OrderTipped.tips by recipient (customer AND restaurant tippers combined; ADR-012); separate from the core split, Captain 0% skim; feed per-recipient Open-Collective totals."
    - "`uber_*` columns are the estimated Uber Eats comparison for the pedagogical receipt (ADR-0025), COMPUTED by the projection from breakdown.articles + the restaurant's cuisine_category → UberEstimationPolicy.price_coefficient + UberSplitPolicy. uber_total = coefficient·articles + avg_delivery_fee + platform fee; uber_restaurant = coefficient·articles·(1−uber_commission_pct/100); uber_rider ≈ rider_base_cents (per-km omitted, distance not modelled); uber_platform = uber_total − uber_restaurant − uber_rider. All null when the restaurant has no cuisine_category. uber_basis is ESTIMATED in V0 (REAL when opted-in + HubRise Uber prices — deferred). Contrast against the exact Captain split (restaurant_payout/rider_payout/captain_net)."
  indexes:
    - [restaurant_id, status, placed_at]   # back-office queue: orders(restaurantId, status)
  columns:
    order_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/orderId' }]
      pk: true
    ref:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/ref' }]
    restaurant_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' }]
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    customer_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/customerId' }]
      nullable: true
      index: true
      fk: { $ref: '#/Customer/columns/customer_id' }
    status:
      type: { $ref: 'scalars.yaml#/OrderStatus' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      note: "Derived from the lifecycle event type."
    service_type:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/serviceType' }]
    items:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/items' }]
    total_amount_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/totalAmount' }]
      note: "amountCents of OrderPlaced.totalAmount (Money)."
    currency:
      type: { $ref: 'scalars.yaml#/CurrencyCode' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/totalAmount' }]
      note: "currency of OrderPlaced.totalAmount (Money)."
    articles_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.articles.amountCents (food TTC; ADR-0016/0018)."
    delivery_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.delivery.amountCents (→ rider; 0 for collection)."
    service_fee_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.serviceFee.amountCents (Captain buyer service fee)."
    restaurant_payout_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.restaurantPayout.amountCents (3-way split → restaurant)."
    rider_payout_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.riderPayout.amountCents (3-way split → rider)."
    captain_net_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.captainNet.amountCents (kept by Captain; feeds Open-Collective totals)."
    uber_total_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber Eats all-in total for the same order (ADR-0025; see rules). Null if no cuisine_category."
    uber_restaurant_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber restaurant net (after ~30% commission; see rules)."
    uber_rider_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber courier earning (base; per-km not modelled in V0; see rules)."
    uber_platform_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber platform take = uber_total − uber_restaurant − uber_rider."
    uber_basis:
      type: { $ref: 'scalars.yaml#/ComparisonBasis' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "ESTIMATED (V0) or REAL (opted-in + HubRise Uber prices; deferred). Null if no comparison."
    delivery_address:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/deliveryAddress' }]
      nullable: true
    estimated_ready_at:
      from: [{ $ref: 'events.yaml#/OrderAcceptedByRestaurant/properties/estimatedReadyAt' }]
      nullable: true
    placed_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/OrderPlaced' }]
      note: "OrderPlaced occurrence time."
    status_changed_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      note: "Occurrence time of the latest status-changing event."
    payment_intent_id:
      from: [{ $ref: 'events.yaml#/PaymentCaptured/properties/paymentIntentId' }]
      nullable: true
      note: "The captured Stripe PaymentIntent; RefundProcess reads it to open a pending refund."
    payment_status:
      type: text
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/PaymentCaptured' }
        - { $ref: 'events.yaml#/PaymentRefunded' }
      note: >
        Folded from Stripe facts; candidate for a PaymentStatus enum. OrderPlaced seeds CAPTURED:
        PlaceOrderProcess emits it only in reaction to PaymentCaptured (V0 prepaid-online), and that
        capture sits earlier in the log than the row it would fold into.
    restaurant_stars:
      from: [{ $ref: 'events.yaml#/RestaurantRated/properties/stars' }]
      nullable: true
      note: "Customer's 0–5 rating of the restaurant; null until rated."
    rating_comment:
      from: [{ $ref: 'events.yaml#/RestaurantRated/properties/comment' }]
      nullable: true
    rider_thumb:
      from: [{ $ref: 'events.yaml#/OrderRated/properties/riderThumb' }]
      nullable: true
    delivery_timeliness:
      type: { $ref: 'scalars.yaml#/DeliveryTimeliness' }
      from: [{ $ref: 'events.yaml#/DeliverySatisfactionRecorded/properties/timeliness' }]
      nullable: true
      note: "Customer's post-delivery delay verdict (#62); null until answered."
    rider_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==RIDER].amount (all tippers); null if none."
    restaurant_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==RESTAURANT].amount; null if none."
    captain_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==CAPTAIN].amount; null if none."
    rated_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderRated' }
        - { $ref: 'events.yaml#/RestaurantRated' }
        - { $ref: 'events.yaml#/DeliverySatisfactionRecorded' }
        - { $ref: 'events.yaml#/OrderTipped' }
      nullable: true
      note: "Occurrence time of the latest rating/tip/survey event."
    delivery_status:
      type: { $ref: 'scalars.yaml#/DeliveryStatus' }
      from:
        - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/DeliveryPickedUp' }
        - { $ref: 'events.yaml#/DeliveryStatusUpdated' }
        - { $ref: 'events.yaml#/DeliveryCompleted' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
      nullable: true
      note: "Mirror of the order's DeliveryJob status (correlated by order_id); null for COLLECTION / before dispatch. DeliveryPickedUp mirrors PICKED_UP on the rider path (the partner path reports it via DeliveryStatusUpdated); DeliveryDispatchFailed (offer cap exhausted) mirrors FAILED (ADR-20260720-004556)."
    courier:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
      nullable: true
      note: "Assigned Courier { displayName, phone?, riderId? } once accepted; null before."
    estimated_dropoff_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/DeliveryAcceptedByPartner/properties/estimatedDropoffAt' }]
      nullable: true
      note: "Partner-reported ETA to the customer; null when unknown."

OrderConversation:
  projector: app   # message timeline appended + PUBLIC/INTERNAL split + order-status fold = application logic
  aggregate: Conversation
  slice: V0
  note: >
    The per-order conversation read model (#129). Folds the conversation's own messages AND the order's
    status lifecycle events (cross-aggregate, correlated by order_id) into one timeline, so order status
    participates in the thread with no status copied into a message. The projector appends each
    MessagePosted, splitting PUBLIC (messages) from INTERNAL (internal_notes).
  fedBy:
    - { $ref: 'events.yaml#/ConversationOpened' }
    - { $ref: 'events.yaml#/MessagePosted' }
    - { $ref: 'events.yaml#/MessageTranslationAdded' }
    - { $ref: 'events.yaml#/AdminInvitedToConversation' }
    - { $ref: 'events.yaml#/ParticipantMuted' }
    - { $ref: 'events.yaml#/ParticipantUnmuted' }
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
    - { $ref: 'events.yaml#/OrderPreparationStarted' }
    - { $ref: 'events.yaml#/OrderMarkedReady' }
    - { $ref: 'events.yaml#/OrderDelivered' }
    - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
    - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
    - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
    - { $ref: 'events.yaml#/ReclamationOpened' }
    - { $ref: 'events.yaml#/ReclamationResolved' }
    - { $ref: 'events.yaml#/ReclamationRejected' }
    - { $ref: 'events.yaml#/ReclamationReopened' }
    - { $ref: 'events.yaml#/ReclamationEvidenceAttached' }
  columns:
    order_id:
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/orderId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/restaurantId' }]
      index: true
    customer_chat_enabled:
      type: boolean
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/customerChatEnabled' }]
    status:
      type: { $ref: 'scalars.yaml#/OrderStatus' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      note: "Derived from the latest order lifecycle event type (cross-aggregate fold, correlated by order_id)."
    messages:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/MessagePosted' }
        - { $ref: 'events.yaml#/MessageTranslationAdded' }
      note: "PUBLIC ConversationMessage[] (entities.yaml#/ConversationMessage), appended per MessagePosted (visibility=PUBLIC) by the projector; MessageTranslationAdded is folded into the targeted message's per-message `translations` array (translate once, reuse; #129)."
    internal_notes:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/MessagePosted' }
        - { $ref: 'events.yaml#/MessageTranslationAdded' }
      note: "INTERNAL ConversationMessage[] staff notes, appended per MessagePosted (visibility=INTERNAL) by the projector; MessageTranslationAdded is folded into the targeted note's per-message `translations` array (#129)."
    opened_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ConversationOpened' }]
    admin_invited:
      type: boolean
      from: [{ $ref: 'events.yaml#/AdminInvitedToConversation' }]
      note: "True once an admin was pulled in by a reasoned escalation (#129)."
    escalation_reason:
      type: { $ref: 'scalars.yaml#/EscalationReason' }
      nullable: true
      from: [{ $ref: 'events.yaml#/AdminInvitedToConversation/properties/reason' }]
      note: "The reason recorded on the latest escalation; null until an admin is invited."
    muted:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/ParticipantMuted' }
        - { $ref: 'events.yaml#/ParticipantUnmuted' }
      note: "current MutedParticipant[] (entities.yaml#/MutedParticipant), applied per mute/unmute by the projector."
    claim_events:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/ReclamationOpened' }
        - { $ref: 'events.yaml#/ReclamationResolved' }
        - { $ref: 'events.yaml#/ReclamationRejected' }
        - { $ref: 'events.yaml#/ReclamationReopened' }
        - { $ref: 'events.yaml#/ReclamationEvidenceAttached' }
      note: "ClaimTimelineEntry[] (entities.yaml#/ClaimTimelineEntry) — weaves the Reclamation lifecycle into the order thread: the projector appends one entry per Reclamation* event (kind OPENED/RESOLVED/REJECTED/REOPENED/EVIDENCE_ATTACHED), keyed onto the order row by the event's orderId (cross-aggregate, correlated by order_id), so a claim's status and evidence show inline in the per-order conversation (§2.5, #155, #156)."

CustomerCreditBalance:
  projector: app   # balance is a SUM (Σ granted − Σ consumed) — NOT foldable into a View_* (a fold view is a per-column state-fold, not an aggregate); the materialized-projector pattern (#158, ADR-20260726-163737) maintains it
  aggregate: CustomerCredit
  slice: V0
  note: >
    The per-customer store-credit BALANCE read model (#158, Part B of #207). One row per customer with a
    ledger; the projector keeps `balance_cents` as the running SUM over the ledger stream
    (`CustomerCredit-{customerId}`): += on CustomerCreditGranted, −= on CustomerCreditConsumed. Serves the
    `customerCredit` query (the customer sees their spendable goodwill balance) and mirrors the pure
    write-side fold in `crates/domain/src/customer_credit.rs`. The balance is never negative (the write
    side rejects an overspend, errors.yaml#/InsufficientCustomerCredit).
  fedBy:
    - { $ref: 'events.yaml#/CustomerCreditGranted' }
    - { $ref: 'events.yaml#/CustomerCreditConsumed' }
  rules:
    - "`balance_cents` is COMPUTED by the projector as Σ granted − Σ consumed (a SUM, not a fold-view column); the row is born on the first CustomerCreditGranted (a consume before any grant never materializes a ledger, mirroring the domain fold)."
    - "`currency` is set from the first grant's amount and stays fixed (a customer's ledger is single-currency — their local currency, EUR for Tours V0)."
  columns:
    customer_id:
      from: [{ $ref: 'events.yaml#/CustomerCreditGranted/properties/customerId' }]
      pk: true
    balance_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from:
        - { $ref: 'events.yaml#/CustomerCreditGranted/properties/amount' }
        - { $ref: 'events.yaml#/CustomerCreditConsumed/properties/amount' }
      note: "Σ granted − Σ consumed (minor units), never negative. amountCents of the grant/consume Money, summed by the projector."
    currency:
      type: { $ref: 'scalars.yaml#/CurrencyCode' }
      from: [{ $ref: 'events.yaml#/CustomerCreditGranted/properties/amount' }]
      note: "The ledger currency, from the first grant's amount (single-currency per customer)."
# --- Read-side per-instance authorization (#144, PROP-20260725-185140) ---

ScopeMembership:
  projector: app   # SET-shaped: one event GRANTS/REVOKES N rows (not a per-entity state fold) — hand-written projector
  aggregate: Order
  slice: V0
  internal: true   # a technical authorization index, never a GraphQL `reads` target (no output type binds it)
  replicated: read-databases   # STO-2(a), DECIDED: projected into EVERY read database by each scope's projector — "composition happens in the projector, not the query", applied to authorization; one database, one grant, and each subgraph stays self-sufficient. The resolved set is every `recovery: replay` database in database/databases.yaml.
  note: >
    WHO may see WHICH protected instance (#144). One row per (scope, member): the single index every
    read-side authorization question resolves against, for every role and every surface —
    `SELECT EXISTS(... WHERE membership_id = $1)`. The guard never learns what an order is, so a new
    ScopeType is a projector rule rather than new code in the guard.

    Adopting this index replaced four separate mechanisms (PROP-20260725-185140 §3.4): per-role
    table/column resolution, the restaurant -> account hop, an `active` predicate on rider membership,
    and multi-rider-per-order special cases. Reassignment needs no special handling: it is a REVOKE
    followed by a GRANT, so the previous rider loses access the moment the new one is recorded.

    SAFETY: this is an ACL cache with asymmetric failure modes. A MISSING row denies (visible, safe); a
    STALE row grants (a silent breach). The revoke rules are therefore more safety-critical than the
    grants, and the projector errs toward deleting. Drift is repairable by replay, which is the property
    that makes the cache acceptable at all.
  rules:
    - "GRANT on OrderPlaced: the order's customer, its restaurant, and that restaurant's account. These are PERMANENT — order history must stay readable forever (product-owner decision, 2026-07-25)."
    - "GRANT on DeliveryAcceptedByRider: the accepting rider, on the `orderId` the event carries (D-QW1 option b, ADR-20260808-234907)."
    - "REVOKE on DeliveryCancelled / DeliveryDispatchFailed: the RIDER role rows for that job's order. The ONLY revoke in V0 — riders are the only membership that ends. DeliveryCancelled carries no orderId, so the worker resolves it via View_DeliveryJob before folding; an unresolvable job yields NO change (allow-stale on an orphan stream — acceptable only because a birth fact always precedes its cancel in position order)."
    - "GRANT on RestaurantRegistered: the restaurant itself and its owning account, scope_type RESTAURANT."
    - "GRANT on RestaurantListingClaimed: the claiming account, scope_type RESTAURANT — the post-registration attachment path. A Sirene-seeded listing registers with NO accountId; without this fold its account would never gain membership and resolve_restaurant_account would find nothing for every subsequent OrderPlaced (review finding, ADR-20260809-160000 addendum)."
    - "ADMIN holds NO rows — the guard short-circuits on the role. Storing them would mean a row per admin per instance, unbounded and pointless."
    - "membership_id is UUIDv5 over (scope_type, scope_id, member_type, member_id), so re-projecting a grant is an idempotent upsert and revoking needs no lookup — the same inputs always derive the same key (the hubrise_connections.restaurant_account_id pattern)."
    - "ERASURE (#194, ADR-20260731-160000): this is an Order-fed read model holding a customer-to-order link — it OWES an OrderExpired tombstone fold (delete the order scope's rows) when the deletion engine lands. Named here so the #194 sweep cannot miss an app-projected table the generated dispatch skips."
  fedBy:
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
    - { $ref: 'events.yaml#/DeliveryCancelled' }
    - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantListingClaimed' }
  indexes:
    - [member_type, member_id, scope_type]   # "everything this member may see" -> list-query filtering
    - [scope_type, scope_id]                       # "who may see this instance" -> audit + revoke sweeps
  columns:
    membership_id:
      type: uuid
      pk: true
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
      note: "UUIDv5(scope_type|scope_id|member_type|member_id) — derived, never random, so a replayed grant upserts onto itself."
    scope_type:
      type: { $ref: 'scalars.yaml#/ScopeType' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
      note: "Which KIND of instance — ORDER or RESTAURANT. Constant per grant/revoke rule, not read from a payload. The revoke events appear in this lineage because the revoke's DELETE predicate reads exactly (scope_type, scope_id, member_type) — they write no value, they key a deletion."
    scope_id:
      type: uuid
      from:
        - { $ref: 'events.yaml#/OrderPlaced/properties/orderId' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/restaurantId' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/orderId' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed/properties/orderId' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
      note: "The protected instance: an OrderId or a RestaurantId. DeliveryCancelled carries no orderId — the worker resolves the job's order via View_DeliveryJob before folding."
    member_type:
      type: { $ref: 'scalars.yaml#/UserType' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
      note: >
        In the key deliberately: a rider who is ALSO a customer must hold two distinct memberships, or
        their customer row would let them fetch rider-audience data. The revoke events key their
        deletion by this column (the RIDER role), which is why they appear in its lineage.
    member_id:
      type: uuid
      from:
        - { $ref: 'events.yaml#/OrderPlaced/properties/customerId' }
        - { $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/riderId' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/accountId' }
      note: "The DOMAIN id (customerId / restaurantId / restaurantAccountId / riderId), never the auth subject — the sub->domain bridge happens once per request at the edge."
    granted_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
      note: "When the membership was recorded (the event's occurred_at) — deterministic under replay; preserved on a replayed grant (ON CONFLICT DO NOTHING)."
