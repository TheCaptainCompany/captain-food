version: 1
description: >
  Captain.Food MATERIALIZED read-model TABLES (ADR-0039/0040) — the read models whose columns are NOT a
  pure state-fold the codegen can generate as a SQL VIEW (contrast specs/database/projection_views.yaml,
  which holds the generated `View_*` folds). These are real `CREATE TABLE`s under tables/, filled by a
  projector; queries read them exactly like the fold views (api.yaml `reads`). Same metadata as a view
  (aggregate/slice/fedBy/rules/columns with `from` lineage) so the validator still proves API↔read-model.

  READER SETS IN THIS FILE ARE A LOWER BOUND, NOT A CLOSED SET (2026-08-14, DECISIONS §32 "the method
  finding"). Every `# STO-2 closure` comment below that enumerates readers carries a two-line marker
  saying so, and the claim class "sole reader" is RETIRED here — including where it happens to be true.
  Three known limits of any hand-walk: (1) FIVE reader classes are known today (subgraph resolvers,
  `CommandDeps` write-path handlers, PM hook ports, gateway middleware, and a repository a BIN
  CONSTRUCTS FOR ITSELF — adapters included, per gated mode); (2) SCOPE granularity is not GRANT
  granularity — CONNECT is held by an APP/role, so "only the ordering scope reads it" is silent about
  `pm-cart-binding` being a different bin from `graphql-ordering`; (3) hand-written wrapper seams
  escape the DSL walker (`ReclamationProcess` is the known instance). The crossings ARE largely
  declared already — the PM `read:` steps in `specs/*/processmanager.yaml` carry
  `model: { $ref: 'database/tables/projection_tables.yaml#/X' }` — so the derivation is mechanical and
  must be MADE mechanical rather than re-walked by hand. (4) — the INVERSE limit, belonging to that
  DERIVATION rather than to the hand-walk, and sitting ALONGSIDE (1)-(3) rather than replacing them:
  a `read:` step declares the model SHAPE a leg consumes, NOT the physical SOURCE. Three of the
  thirteen are `captain_write` stream folds that never touch the projection they name —
  `specs/delivery/processmanager.yaml:43` and `specs/ordering/processmanager.yaml:41` on `Restaurant`,
  and `specs/ordering/processmanager.yaml:31` on `Cart` (both PlaceOrder reads: that leg is a
  hand-written command handler, not a generated PM pipeline). So the hand method failed by MISSING
  crossings and a verbatim mechanical derivation fails by INVENTING them; deriving is right only once
  the declaration distinguishes source from shape (a declared source, or an explicit exception list) —
  DECISIONS §32 limit (4), #513's own sub-step.

  Conventions (in addition to a view's):
    - projector : how the table is maintained from domain_events. Always `app` — an application-layer
                  (Rust) projector subscribing to domain_events, in crates/application/infrastructure
                  (ADR-0040). Projection logic stays in the tested application layer, NOT in SQL triggers,
                  so business rules never leak into the DB and the event-store append is never coupled to a
                  read-model projection. A deferred runtime contract until crates/ exists.
    - name      : the table name (top-level key), NOT prefixed `View_` — it is a real table, not a view.


Restaurant:
  projector: app   # mechanically foldable (+ a cross-stream default_currency lookup from the account stream), but maintained by the app-layer projector for uniformity
  aggregate: Restaurant
  slice: V0
  # STO-2 closure (DECISIONS §32, 2026-08-14). FOUR reader classes beyond the network subgraph, and
  # THIS LINE'S OWN HISTORY IS THE WARNING: it said "two readers ... both recorded", the post-ready
  # independent review made it three, and round 2 of that review made it four. Treat the list as a
  # LOWER BOUND (DECISIONS §32 "the method finding"). (1) The gateway tenant-host-router
  # reads this table on EVERY request's hot path (c4-l3.yaml tenant-host-router). (2) rider.yaml's job
  # screen renders restaurantName/Phone via a join against
  # this table — moving either side of that join breaks one-tap call-restaurant at pickup, a
  # stranded-order exception. (3) OPEN cross-wall dependency, NOT resolved by this placement (register
  # row STO-8, the captain_write -> read_common wall): the mailbox worker declares
  # `CommandDeps.restaurants: RestaurantReadRepository` and FOUR handlers read `restaurant` through
  # it — create_catalog `by_id` (commands.rs:2763, RestaurantNotFound), add_product and update_product
  # via ensure_prices_use_restaurant_currency `by_id` (:2737, the CurrencyMismatch guard reading
  # default_currency — ADR-0016), and mark_restaurant_as_favorite `by_id` (:3491, RestaurantNotFound).
  # Lower stakes than Customer's: all four already treat a not-yet-projected row as passing or
  # rejecting explicitly, and none sits on checkout. NOTE the write path does NOT read this table for
  # the checkout guards — place_order folds RestaurantState from the restaurant's own STREAM
  # (commands.rs:2394), which is captain_write-local and crosses no wall.
  # (4) NOT an open question of (3)'s kind — it CONTRADICTS A CLOSED ROW, so it is AMBER and
  # founder-owned: register row STO-10, which REOPENS ADP-1 (ADR-20260812-115930, decided by
  # directive). A FIFTH reader class no formula contained — a repository the BIN CONSTRUCTS FOR
  # ITSELF: the HubRise adapter builds its own PgRestaurantRepository (adapters/hubrise/src/main.rs:54)
  # and `await_restaurant_projection` polls `by_id` 40x at 250 ms before create_catalog
  # (connect.rs:314-325). adapter_hubrise -> read_common is a SECOND outward grant where ADP-1 allows
  # exactly one (INSERT into inbound_messages), so post-split HubRise onboarding stalls SILENTLY, as a
  # ten-second timeout on a poll that can never resolve. The poll ALSO breaches ADR-20260810-231300:
  # the projector knows it folded RestaurantRegistered before the clock does, so this is propagation
  # and must be PUSHED — as written it has no declared degraded mode, no observability contract and no
  # detected path back. Same bin, gated mode: with RUN_MAILBOX_WORKERS on it spawns
  # standalone mailbox workers for RestaurantAccount/Restaurant/Catalog (main.rs:43-52), so the
  # adapter pod ALSO hosts class (3)'s CommandDeps reads — #513's app<->database CONNECT model cannot
  # assume one app class per bin.
  # margin_rate is a commercial secret; read_common making it physically
  # readable by the marketplace subgraph role is a RECORDED deferral (#513 column narrowing), not an accident.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_common' }
  fedBy:
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantUpdated' }
    - { $ref: 'events.yaml#/RestaurantActivated' }
    - { $ref: 'events.yaml#/RestaurantDeactivated' }
    - { $ref: 'events.yaml#/RestaurantAcceptanceModeChanged' }
    - { $ref: 'events.yaml#/RestaurantRemoved' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated' }
    - { $ref: 'events.yaml#/RestaurantListingClaimed' }
    - { $ref: 'events.yaml#/RestaurantListingOptedOut' }
    - { $ref: 'events.yaml#/RestaurantMarkedClosed' }
    - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkConfigured' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkVerified' }
    - { $ref: 'events.yaml#/RestaurantSlugConfigured' }       # the storefront host, once the owner picks it
    - { $ref: 'events.yaml#/RestaurantSlugReconfigured' }     # a rename moves it (the old label lives on in SlugAlias)
    - { $ref: 'events.yaml#/RestaurantAccountRegistered' }   # folds the account's default_currency onto its locations
  columns:
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }]
      pk: true
    restaurant_account_id:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/accountId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/accountId' }
      index: true
      nullable: true
      # No `fk:` — View_RestaurantAccount was deleted as unread (ADR below). The account id is still
      # carried and indexed (restaurantLocationsByAccount queries by it); it just no longer points at a
      # read model, so there is no read-navigation edge to declare.
      note: "NULL for a non-partner public listing; set on claim/conversion."
    listing_status:
      type: { $ref: 'scalars.yaml#/RestaurantListingStatus' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/listingStatus' }
        - { $ref: 'events.yaml#/RestaurantListingStatusChanged/properties/listingStatus' }
      index: true
    external_identifiers:
      type: jsonb
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/externalIdentifiers' }]
      nullable: true
      note: "Source-agnostic [{key,value}] (siret/naf/google_place_id…); not unique."
    google_place_id:
      from:
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/googlePlaceId' }
      type: { $ref: 'scalars.yaml#/GooglePlaceId' }
      nullable: true
    slug:
      # NULL until the owner configures one, then the storefront host (ADR-20260728-011344).
      # `unique` + `nullable` is exactly right here: Postgres permits many NULLs in a unique index,
      # so ~200k unconfigured open-data listings coexist while the DATABASE enforces uniqueness over
      # precisely the configured set. Registration no longer feeds this column.
      from:
        - { $ref: 'events.yaml#/RestaurantSlugConfigured/properties/slug' }
        - { $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/slug' }
      unique: true
      nullable: true
    display_name:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/displayName' }
    description:
      type: { $ref: 'scalars.yaml#/RestaurantDescription' }
      from: [{ $ref: 'events.yaml#/RestaurantUpdated/properties/description' }]
      nullable: true
    tags:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/tags' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/tags' }
      nullable: true
      note: "Cuisine/attribute tags — general restaurant info (source-agnostic), not from the GBP event."
    margin_rate:
      type: { $ref: 'scalars.yaml#/MarginPercent' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/marginRate' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/marginRate' }
      nullable: true
      note: "Food margin %, input to the Captain service-fee split (ADR-0017); back-office only."
    cuisine_category:
      type: { $ref: 'scalars.yaml#/CuisineCategory' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/cuisineCategory' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/cuisineCategory' }
      nullable: true
      note: "Selects the Uber Eats price-estimate coefficient in UberEstimationPolicy (ADR-0024)."
    uber_prices_opt_in:
      type: boolean
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/uberPricesOptIn' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/uberPricesOptIn' }
      nullable: true
      note: "Restaurant authorized showing its real Uber prices via HubRise (ADR-0023). Gates REAL vs ESTIMATED basis."
    website:
      type: { $ref: 'scalars.yaml#/WebUrl' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/website' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/website' }
      nullable: true
    rating:
      type: { $ref: 'scalars.yaml#/GoogleRating' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/rating' }]
      nullable: true
      note: "GBP-specific metric (Google listing), independent of the restaurant's own info."
    reviews_count:
      type: integer
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/reviewsCount' }]
      nullable: true
    gbp_order_url:
      type: { $ref: 'scalars.yaml#/WebUrl' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkConfigured/properties/gbpOrderUrl' }]
      nullable: true
    gbp_link_status:
      type: { $ref: 'scalars.yaml#/GbpLinkStatus' }
      from: [{ $ref: 'events.yaml#/RestaurantGoogleBusinessProfileOrderLinkVerified/properties/status' }]
      nullable: true
    address:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/address' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/address' }
    location:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/location' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/location' }
      nullable: true
      note: "Geo coordinates {latitude, longitude}; typically from the Google Maps sync."
    opening_hours:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/openingHours' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/openingHours' }
    status:
      type: { $ref: 'scalars.yaml#/RestaurantStatus' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantActivated' }
        - { $ref: 'events.yaml#/RestaurantDeactivated' }
        - { $ref: 'events.yaml#/RestaurantRemoved' }
        - { $ref: 'events.yaml#/RestaurantMarkedClosed' }
      note: "Derived from the lifecycle event type: DRAFT on register, ACTIVE/INACTIVE on (de)activation, INACTIVE on closure."
    order_acceptance:
      from: [{ $ref: 'events.yaml#/RestaurantAcceptanceModeChanged/properties/mode' }]
    default_currency:
      from: [{ $ref: 'events.yaml#/RestaurantAccountRegistered/properties/defaultCurrency' }]
    timezone:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/timezone' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/timezone' }
      nullable: true
      note: >
        Location timezone. NULL means NO timezone — the account-level fallback this note used to
        claim has NO materialized source (View_RestaurantAccount was deleted; corrected under RSO-1,
        DECISIONS §43): service-window evaluation treats NULL, or a zone that does not parse while
        hours are declared, as HOURS_UNDECLARED, never as "closed".
    preparation_time_minutes:
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/preparationTimeMinutes' }
        - { $ref: 'events.yaml#/RestaurantUpdated/properties/preparationTimeMinutes' }
      nullable: true
SlugAlias:
  projector: app   # one row per SUPERSEDED label -- the projector keys on previousSlug, not the aggregate id
  aggregate: Restaurant
  slice: V0
  # STO-2 closure: read by ZERO api.yaml types — its reader is the gateway 301 path (hosts.rs,
  # c4-l3.yaml tenant-host-router), co-located with Restaurant which the same middleware reads on the
  # same request. Deliberately NOT co-located with slug_reservations (write-side, captain_write).
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    Superseded storefront labels, so a renamed restaurant's OLD host keeps resolving
    (ADR-20260728-011344). `hosts.rs` resolves an incoming Host header against `Restaurant.slug` first
    and falls back here, answering 301 -> the current address. Without this, a rename instantly 404s
    every printed menu, QR code, inbound link and search result pointing at the old label -- which is why
    `RestaurantSlugReconfigured` carries `previousSlug` as business data rather than leaving it to be
    re-derived by folding history. Host resolution runs on EVERY request and must never fold.
  fedBy:
    - { $ref: 'events.yaml#/RestaurantSlugReconfigured' }
  rules:
    - "One row per superseded label, keyed by that label. A restaurant renamed N times leaves N rows -- each recording the address that superseded it AT THAT MOMENT, which is a historical fact and therefore never stale."
    - "`current_slug` is NOT how a redirect is resolved: after A->B->C, row A still says B. `hosts.rs` resolves the alias to `restaurant_id` and reads that restaurant's CURRENT slug from the Restaurant projection, so every superseded label lands on the live address in ONE hop rather than walking a 301 chain."
    - "Rows are never deleted: the reservation table bars reuse of a released label, so an alias can never start pointing at a different business."
  columns:
    previous_slug:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/previousSlug' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/restaurantId' }]
      index: true
      # Deliberately NO `fk`. This table is server-internal -- `hosts.rs` reads it during host
      # resolution and no api.yaml query exposes it -- and an `fk` is what makes the codegen weave a
      # GraphQL navigation edge. Declaring one here produced a self-referential `Restaurant.restaurant`
      # field (an infinitely-sized type). Integrity holds by construction instead: the projector only
      # ever writes a row while folding an event off an existing Restaurant stream.
    current_slug:
      from: [{ $ref: 'events.yaml#/RestaurantSlugReconfigured/properties/slug' }]
      note: "The address that superseded `previous_slug` at the time of the rename. Historical, not authoritative -- see the rules above: resolution goes through `restaurant_id`."

ProspectionPipeline:
  projector: app   # weighted 0–10 score COMPUTED from listing facts (never in an event) — application logic
  aggregate: Prospect
  slice: V1
  # STO-2 closure: read by the admin prospectionPipeline query (network scope) — NOT its sole reader;
  # the first version of this line said "sole reader" (corrected by the post-ready independent review).
  # OPEN cross-wall dependency, NOT resolved by this placement (register row STO-8, the SAME
  # captain_write -> read_common wall as Customer's, lower stakes): record_prospect_contact reads
  # `last_contacted_at` through `CommandDeps.prospection: ProspectionReadRepository`
  # (commands.rs:2626) for the >= 7-day anti-spam invariant. The contact TIME is envelope metadata
  # (occurred_at) invisible to the fold, so this projection is the ONLY source. Post-split as mapped
  # the guard cannot read at all: B2B outreach either blocks, or loses its spam ceiling if the read
  # is degraded to "no row" (the handler already treats a not-yet-projected prospect as passing).
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: "B2B prospection pipeline (ADR-0020): one row per worked listing, with the COMPUTED score and outreach state. Read by the admin prospectionPipeline query."
  fedBy:
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated' }
    - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
    - { $ref: 'events.yaml#/ProspectContacted' }
    - { $ref: 'events.yaml#/ProspectMarkedCold' }
    - { $ref: 'events.yaml#/ProspectReplied' }
  filters:
    - "Rows for NON_PARTNER / PASSIVE_PARTNER listings (active prospects); CONVERTED once ACTIVE_PARTNER."
  rules:
    - "`score` (0–10) is COMPUTED by the projection from listing facts, NEVER stored in an event: food-truck NAF 56.10C +3, Google rating ≥4.0 +2, reviews <20 +2, created <12mo +2, no website +1, already on Uber/Deliveroo −2, national franchise −3; clamped to 0–10."
    - "Inputs not yet captured as fields (Sirene creation date, on-aggregator, national franchise) are best-effort/V1; the formula degrades gracefully to the available signals."
    - "`pipeline_status` is derived: NEW (no contact) → CONTACTED → COLD (ProspectMarkedCold) / REPLIED (ProspectReplied); CONVERTED when RestaurantListingStatusChanged reaches ACTIVE_PARTNER."
  columns:
    restaurant_id:
      from: [{ $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }]
      pk: true
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    score:
      type: { $ref: 'scalars.yaml#/ProspectionScore' }
      from:
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/externalIdentifiers' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/website' }
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/rating' }
        - { $ref: 'events.yaml#/RestaurantGoogleBusinessProfileUpdated/properties/reviewsCount' }
      index: true
      note: "Derived (see rules); not an event field."
    pipeline_status:
      type: { $ref: 'scalars.yaml#/ProspectPipelineStatus' }
      from:
        - { $ref: 'events.yaml#/ProspectContacted' }
        - { $ref: 'events.yaml#/ProspectMarkedCold' }
        - { $ref: 'events.yaml#/ProspectReplied' }
        - { $ref: 'events.yaml#/RestaurantListingStatusChanged' }
      index: true
      note: "Derived from the prospect events + listingStatus (see rules)."
    contacts_count:
      type: integer
      from: [{ $ref: 'events.yaml#/ProspectContacted' }]
      note: "Count of ProspectContacted; drives the anti-spam ≤3 rule."
    last_contacted_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ProspectContacted' }]
      nullable: true
    replied_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ProspectReplied' }]
      nullable: true

Customer:
  projector: app   # scalar folds + jsonb ACCUMULATIONS (favorites/addresses/ratings) — maintained by the app-layer projector
  aggregate: Customer
  slice: V0
  # STO-2 closure: BND-3(a) shared read store. NOT a sole-reader table — the first version of this
  # line said "sole reader is the customer scope's `me`/identity path", which this table's OWN `note`
  # four lines below already contradicted (it names VerifyPhone). Corrected by the post-ready
  # independent review, AFTER the mob checkpoint.
  # OPEN cross-wall dependency, NOT resolved by this placement (register row STO-8, DECISIONS §32 —
  # a DIFFERENT wall from STO-7's): the mailbox worker is a captain_write app whose generated
  # composition root declares `CommandDeps.customers: CustomerReadRepository`
  # (crates/infrastructure/src/generated/command_router.rs), and FOUR handlers read `customer`
  # through it — verify_phone `by_phone` (commands.rs:3257, the new-vs-returning decision ON THE
  # LOGIN PATH), request_email_verification `by_email` (:3363, EmailAlreadyInUse), and
  # request_phone_change / confirm_phone_change `by_phone` (:3414, :3453, PhoneAlreadyInUse).
  # Post-split as mapped, captain_write holds no CONNECT on read_common: sign-in either fails
  # outright, or — worse, if the lookup were ever degraded to "not found" — SILENTLY RE-REGISTERS a
  # returning customer as new, forking a second Customer stream and orphaning their order history.
  # Customer cannot simply move to captain_write: it is a genuine read model with subgraph readers.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: "Identity/lookup read model: resolves a returning phone (or auth_ref) to an existing Customer, backs VerifyPhone idempotency + auth resolution, and serves the `me` query (CustomerProfile). Also bound when CustomerIdentified stamps carts. The stored `locale` localizes authenticated SMS/email sends."
  fedBy:
    - { $ref: 'events.yaml#/CustomerRegistered' }
    - { $ref: 'events.yaml#/RestaurantRated' }
    - { $ref: 'events.yaml#/RestaurantFavorited' }
    - { $ref: 'events.yaml#/RestaurantUnfavorited' }
    - { $ref: 'events.yaml#/CustomerInfoUpdated' }
    - { $ref: 'events.yaml#/CustomerEmailVerified' }
    - { $ref: 'events.yaml#/CustomerPhoneChanged' }
    - { $ref: 'events.yaml#/CustomerLanguageChanged' }
    - { $ref: 'events.yaml#/CustomerPreferencesSet' }
    - { $ref: 'events.yaml#/CustomerAddressSet' }
    - { $ref: 'events.yaml#/CustomerAddressRemoved' }
    - { $ref: 'events.yaml#/CustomerPaymentMethodSet' }
  rules:
    - "`ratings` accumulates the customer's own restaurant ratings (from RestaurantRated) so they can see how they rated each restaurant."
    - "`favorite_restaurant_ids` is maintained from RestaurantFavorited/RestaurantUnfavorited; the favoriteRestaurants query joins it to Restaurant."
  columns:
    customer_id:
      from: [{ $ref: 'events.yaml#/CustomerRegistered/properties/customerId' }]
      pk: true
    phone:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/phone' }
        - { $ref: 'events.yaml#/CustomerPhoneChanged/properties/phone' }
      unique: true
    auth_ref:
      from: [{ $ref: 'events.yaml#/CustomerRegistered/properties/authRef' }]
      index: true
      nullable: true
      note: "Auth provider user id (Supabase Auth) → Customer."
    display_name:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/CustomerInfoUpdated/properties/displayName' }
      nullable: true
    email:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/email' }
        - { $ref: 'events.yaml#/CustomerEmailVerified/properties/email' }
      nullable: true
    email_verified:
      type: boolean
      from: [{ $ref: 'events.yaml#/CustomerEmailVerified' }]
      note: "True once an email magic link has been confirmed (CustomerEmailVerified)."
    locale:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/locale' }
        - { $ref: 'events.yaml#/CustomerLanguageChanged/properties/locale' }
      nullable: true
      note: "i18n culture; set at registration or via ChangeLanguage. Localizes authenticated SMS/email sends."
    timezone:
      from:
        - { $ref: 'events.yaml#/CustomerRegistered/properties/timezone' }
        - { $ref: 'events.yaml#/CustomerPreferencesSet/properties/timezone' }
      nullable: true
    ratings:
      type: jsonb
      from: [{ $ref: 'events.yaml#/RestaurantRated' }]
      note: "The customer's own submitted ratings (assembled from RestaurantRated): [{ order_id, restaurant_id, stars, comment, rated_at }]."
    favorite_restaurant_ids:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/RestaurantFavorited' }
        - { $ref: 'events.yaml#/RestaurantUnfavorited' }
      note: "[restaurant_id] the customer favorited."
    preferences:
      type: jsonb
      from: [{ $ref: 'events.yaml#/CustomerPreferencesSet' }]
      nullable: true
      note: "{ dietary_tags: [...], favorite_cuisines: [...] } from CustomerPreferencesSet."
    addresses:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CustomerAddressSet' }
        - { $ref: 'events.yaml#/CustomerAddressRemoved' }
      note: "Saved address book: [{ address_id, label, address }] from CustomerAddressSet/Removed."
    payment_method_id:
      from: [{ $ref: 'events.yaml#/CustomerPaymentMethodSet/properties/paymentMethodId' }]
      nullable: true

Rider:
  projector: app   # `standing` is a Complex/hand-written column (the RiderCompute::standing hook, #639 part C step 4-i round 2 item 8 — the RiderCompute impl is NOT empty); `app` for uniformity with every other table here
  aggregate: Rider
  slice: V0
  # STO-2 closure: co-located with Customer, and derived from readers rather than from the
  # resemblance. Reader classes: (1) the request seam -- `resolve_read_scope`
  # (crates/server/src/auth.rs), once per GraphQL request and once per WS connect; (2) the write-side
  # seam -- `MailboxCommandHandler::resolve_actor`, which already resolves the CUSTOMER `authRef`
  # against this same database. One identity-lookup class, exactly Customer's reader set, so: the
  # same database, and NOT `replicated: read-databases` (resolution happens ONCE at the edge, not per
  # subgraph -- the >= 2 reader-class test is not met). Recorded trigger: if edge resolution ever
  # moves INTO the subgraphs after the physical split, this table joins the replicated class.
  # NOT captain_write, even though that would dodge a wall crossing: this is a fold of the log, so
  # its recovery is `replay`, and a PITR of a `pitr` database would restore an identity mapping that
  # disagrees with the log's head -- riders resolving to stale bindings after a restore.
  # READER SET = LOWER BOUND, not a closed set: an APP holds CONNECT, so a scope-granular claim is
  # not a grant-granular one, and hand-written seams escape the walker. Derive it mechanically, never
  # from this comment -- DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_common' }
  internal: true   # an identity/authorization index, never a GraphQL `reads` target — the ScopeMembership class. Its reader is the request seam (`resolve_read_scope`, through `RiderIdentityRepository::rider_id_by_auth_subject` — #639 part C step 2b, the rider sign-in door: `auth_ref -> rider_id`, one column, every request and WS connect) and, in due course, the mailbox `resolve_actor`; neither is something an api.yaml output type can speak for. STATED PLAINLY, because `internal: true` must not become a way to hide it: part A wrote this table with no reader, and step 2b is the reader. No c4-l3 `reads:` is declared for the seam, for the same reason the CUSTOMER seam declares none: the gateway component may not re-list reads (`gateway-declares-reads`), and the seam lives in it.
  note: >
    The rider identity read model: the auth subject -> riderId mapping the authenticated request path
    resolves against (ADR-20260818-004646 -- no business identifier lives in the identity provider, so
    the mapping resolves in OUR Postgres), plus the rider's profile and availability. `RiderRegistered`
    has always carried `authRef` as required; until #639 nothing projected it, so `auth_ref` occurred
    exactly once in the whole projection set, on Customer, and the RIDER role had no sign-in-capable
    identity at all. A TABLE and not a `View_*` for the reason SlugAlias states three declarations up:
    this is read on EVERY authenticated request and must never fold on read -- peak is Friday/Saturday
    19:00-21:30. Recovery is REPLAY, so there is no backup of it and there must not be one.
  fedBy:
    - { $ref: 'events.yaml#/RiderRegistered' }
    - { $ref: 'events.yaml#/RiderInfoUpdated' }
    - { $ref: 'events.yaml#/RiderStatusChanged' }
    - { $ref: 'events.yaml#/RiderRestricted' }
    - { $ref: 'events.yaml#/RiderReinstated' }
  rules:
    - "This table answers WHO this connection is AND, since #639 part C step 4-i, whether the platform GRANTS that connection anything at all -- the split ADR-20260904-081527 §1 states: the row is a TERM in the read-side derivation and a GRANT test only (`standing`), never the arbiter of an append -- the write side keeps its own authority by folding the `Rider-{id}` stream, which owns the transition table (delivery/actors.yaml) and the restriction fact independently. Concretely: the resolver reads `auth_ref -> rider_id, standing` and NOTHING else. `status` (availability) sits in the same row and remains NOT an authorization signal -- the LEGACY `SUSPENDED` value must never be read as a grant; `standing` is the one column the seam's grant test may read."
    - "`auth_ref` is UNIQUE, not merely indexed, and the difference is a security property rather than a performance one: the repository lookup is `fetch_optional`, which on multiplicity returns an ARBITRARY row -- plan-dependent, no error -- and `ScopeMembership` keys its grants on `member_id = rider_id`, so a duplicate would hand one rider another rider's order scope. The constraint converts a silent breach into a visible denial. It does NOT create the invariant: nothing on the write side prevents two `RiderRegistered` with the same `authRef` and different `riderId`s (`register_rider` guards `riderId` existence only), and the write-side reservation that does is `database/tables/reservations.yaml#/auth_subject_reservations`, keyed `(principal_kind, auth_subject)` and pinned by `rules.yaml#/RiderAuthSubjectBoundOnce`: `register_rider` reserves BEFORE the append, so a duplicate is refused up front and this constraint is the second line, never the first. Uniqueness over a POPULATION is not an aggregate's to enforce."
    - "`phone` carries NO unique constraint and NO index, deliberately, and this is where copying Customer would inject a defect: Customer.phone is UNIQUE because it is that aggregate's identity key, whereas a rider is keyed by `authRef` precisely so the phone never becomes a domain key. French mobile numbers are recycled, so a unique phone here is a scheduled future projector fault on a number's second owner."
    - "Rebuild by RESETTING THE CHECKPOINT, never by TRUNCATE. The fold is an upsert keyed on `rider_id` and `RiderRegistered` is the only creating arm, so a from-zero replay rewrites every row in place and no rider is ever denied mid-rebuild. TRUNCATE + replay does the opposite: every rider fails closed to Public for the length of the drain, and the fleet cannot sign in."
    - "ERASURE, named here so the sweep cannot miss an app-projected table the generated dispatch skips (the ScopeMembership precedent): `display_name` and `phone` are a natural person's data held OUTSIDE the stream, and the deletion engine deletes streams, not projection rows. Delivery declares no `deletion:` block for Rider today, so there is nothing to build yet -- but a rider tombstone fold is OWED the moment one is declared."
  columns:
    rider_id:
      from: [{ $ref: 'events.yaml#/RiderRegistered/properties/riderId' }]
      pk: true
    auth_ref:
      from: [{ $ref: 'events.yaml#/RiderRegistered/properties/authRef' }]
      unique: true
      # NOT NULL (RiderRegistered requires authRef -- unlike Customer, which is nullable because
      # guest customers exist) and deliberately NO `index: true` beside `unique:`: the two are
      # separate emitter passes, so declaring both emits the constraint's implicit btree AND a
      # redundant second one on the same column. The UNIQUE constraint's own index serves the lookup.
      note: "Auth provider user id (Supabase Auth) -> Rider. The lookup key of the identity bridge; see the `auth_ref` rule above for why the constraint is UNIQUE and what it does and does not guarantee."
    display_name:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/RiderInfoUpdated/properties/displayName' }
      # NOT NULL, and that is load-bearing rather than tidiness. The projector emitter branches on
      # the COLUMN's nullability, not the event field's: a nullable column gets a blind assignment
      # and a NOT NULL one gets an `if let Some(v)` guard. `RiderInfoUpdated` is a PARTIAL update
      # (both fields optional) despite the `*Updated` replace convention, so a nullable column here
      # would mean a rider who changes only their phone silently loses their name -- deterministically,
      # live AND on every replay. `RiderRegistered` requires it, so creation always initialises it.
      note: "Rider's display name; RiderInfoUpdated overwrites it only when it carries one."
    phone:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/phone' }
        - { $ref: 'events.yaml#/RiderInfoUpdated/properties/phone' }
      note: "Contact number, a profile attribute and never a lookup key -- see the `phone` rule above. NOT NULL for the same partial-update reason as display_name."
    status:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/status' }
        - { $ref: 'events.yaml#/RiderStatusChanged/properties/status' }
      # Sourced with `from:` off the payload, NEVER a `derive:` event->literal map. Both events carry
      # the target state in the payload (`via: status`, ADR-20260721-093027), so this column is
      # last-writer-wins by global position: idempotent and order-independent under replay. A
      # `derive:` map would be a SECOND copy of the Rider lifecycle transition table
      # (delivery/actors.yaml) living on the read side, and the two would drift.
      note: "Availability/lifecycle status, straight off the payload of whichever event wrote last."
    standing:
      type: { $ref: 'scalars.yaml#/RiderStanding' }
      from:
        - { $ref: 'events.yaml#/RiderRestricted' }
        - { $ref: 'events.yaml#/RiderReinstated' }
      # A COMPLEX (whole-event, hand-written `RiderCompute::standing`) column, deliberately NOT a
      # `derive:` literal map keyed off `RiderRegistered` too (#639 part C step 4-i,
      # ADR-20260904-081527 §2): the creating arm never WRITES this column -- its hook returns the
      # PRIOR row's value when one already exists (a checkpoint-reset replay-in-place over an
      # existing, possibly RESTRICTED row) and only defaults fresh rows to ACTIVE (the physical
      # column's own `DEFAULT 'ACTIVE'`, migration-declared, no CHECK, no covering index). So a
      # from-zero replay by checkpoint reset -- never TRUNCATE -- re-grants nobody for the length
      # of the drain: RiderRestricted/RiderReinstated are the ONLY facts that ever move it, exactly
      # matching the `created_at` precedent's intent (rider_store.rs) generalised to a column two
      # OTHER events, not the creating one, are the sole write authority for.
      note: "The platform's grant (ACTIVE/RESTRICTED) -- see the column comment for why the creating arm (RiderRegistered) never writes it."

RiderRestriction:
  projector: app
  aggregate: Rider
  slice: V0
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    The attribution behind `Rider.standing` (#639 part C step 4-i, ADR-20260904-081527 §2): ground,
    decidedAt, effectiveAt, reinstatedAt -- the source of `myStanding` (§4) and of 4-iii's admin
    surface. Kept OFF the identity row on purpose: `Rider` carries the grant and nothing the notice
    needs, `auth_ref` and `phone` never migrate here. NOT `internal` -- unlike `Rider`, this table IS
    a legitimate GraphQL `reads` target (myStanding), never the request seam's own identity lookup.
  fedBy:
    - { $ref: 'events.yaml#/RiderRegistered' }
    - { $ref: 'events.yaml#/RiderRestricted' }
    - { $ref: 'events.yaml#/RiderReinstated' }
  rules:
    - "Keyed on `riderId` (grain: the rider, not the restriction fact) -- a repeatable-fact grain (riderId + occurrence) is what the business_metrics.yaml `RiderRestriction` projection needs for `restrictRider`/`reinstateRider`'s own fold; THIS read-side table answers 'what is true of this rider right now', so `RiderRestricted` overwrites the prior attribution rather than appending a row -- the Art. 11 LOG lives in `domain_events`, immutable, never here."
    - "No `auth_ref`, no `phone` -- this table answers WHY and WHEN a rider is restricted, never WHO to contact; the identity bridge stays exclusively on `Rider`."
    - "Rebuild by resetting the `RiderRestriction` checkpoint (its OWN `ProjectorGroup`, never a prefix under the already-advanced `Rider` checkpoint -- the #424 lesson): its group starts at 0 with no `projection_checkpoint` row, so a table born after the log is backfilled by replay, never a migration-time copy (#639 part C step 4-i round 2 item 7)."
  columns:
    rider_id:
      from: [{ $ref: 'events.yaml#/RiderRegistered/properties/riderId' }]
      pk: true
    standing:
      type: { $ref: 'scalars.yaml#/RiderStanding' }
      from:
        - { $ref: 'events.yaml#/RiderRestricted' }
        - { $ref: 'events.yaml#/RiderReinstated' }
      note: "Mirrors Rider.standing (the same two facts write it) -- kept here too so myStanding needs no second table join for the value it renders alongside ground/decidedAt/effectiveAt."
    ground:
      type: { $ref: 'scalars.yaml#/RiderRestrictionGround' }
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/ground' }]
      note: "Null before any restriction (RiderRegistered) and untouched by RiderReinstated (the attribution stays for counsel/admin history until the next RiderRestricted overwrites it)."
    decided_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/decidedAt' }]
    effective_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/effectiveAt' }]
    reinstated_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderReinstated' }]
      note: "The occurred_at of the LATEST RiderReinstated fact for this rider (an occurrence timestamp, no payload field) -- history, not a live 'currently reinstated' flag: `standing` is the field that answers whether the rider is restricted right now; this column simply stops being the freshest fact once a later RiderRestricted follows it."

# #639 part C step 4-iii-A (ADR-20260904-152807 §1, §3): the admin's roster of every rider — the
# `riders`/`rider` GraphQL queries (`/system/riders`, `/system/riders/:riderId`). A NEW table,
# never a widening of `RiderRestriction` (refused, §1: it reverses that table's landed rule and
# makes a table named for one concept carry another) and never a widening of `Rider` (`internal:
# true` stays — one reader class, the identity bridge). Fed by the FIVE rider events only, own
# `ProjectorGroup` checkpoint `"RiderRoster"` from 0 — the `RiderRestriction` precedent generalised
# one table further. NEVER `auth_ref`: this table answers WHO to show an admin and WHETHER the
# platform grants them anything, never how a session resolves to a rider (that stays exclusively on
# `Rider`, the identity bridge's own reader class).
RiderRoster:
  projector: app
  aggregate: Rider
  slice: V0
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    The admin triage/detail read model (#639 part C step 4-iii-A, ADR-20260904-152807 §1): name,
    phone, availability and the platform grant (standing/ground/decidedAt/effectiveAt/reinstatedAt)
    for EVERY rider, one row per rider. NOT `internal` — this table IS the `riders`/`rider`
    GraphQL `reads` target, ADMIN-only at the door. The held delivery job is deliberately NOT a
    column here (ADR §2, "one custody truth, read at query time — never a folded column"): the
    DETAIL reads `held_by_rider(rider_id)` fresh at query time and the LIST joins the page's rider
    ids to held statuses in one set-based query, both through `DeliveryReadRepository`, never a
    second fold of the custody lifecycle `View_DeliveryJob` already derives.
  fedBy:
    - { $ref: 'events.yaml#/RiderRegistered' }
    - { $ref: 'events.yaml#/RiderInfoUpdated' }
    - { $ref: 'events.yaml#/RiderStatusChanged' }
    - { $ref: 'events.yaml#/RiderRestricted' }
    - { $ref: 'events.yaml#/RiderReinstated' }
  rules:
    - "Keyed on `riderId` (grain: the rider, not the restriction fact) — the same 'what is true of this rider right now' grain as `RiderRestriction`, upserted in place; the Art. 11 LOG lives in `domain_events`, immutable, never here."
    - "NO `auth_ref` column, ever — a rule line, not merely an omission, so a future edit that reaches for the identity bridge here is refused at review: this table answers WHO to show an admin, never WHO a session resolves to. A test asserts the column does not exist (`SELECT auth_ref FROM rider_roster` errors)."
    - "NEVER a folded `heldDeliveryJobId`/`heldStatus` column (ADR §2): the held job is a SEPARATE fold (`View_DeliveryJob`, its own checkpoint over `Order-`/`Payment-`/`DeliveryJob-` streams) that would drift from this table's own `Rider-` replay on a rebuild and answer differently from the `held_by_rider`/`held_by_riders` ports — one custody truth, read fresh at query time, never two."
    - "Own checkpoint group `\"RiderRoster\"` from 0 (never a prefix under the already-advanced `Rider` or `RiderRestriction` checkpoints — the #424 lesson, generalised a second time): a table born after the log is backfilled by replay, never a migration-time copy. Rebuild by resetting the `RiderRoster` checkpoint."
    - "No CHECK constraint (`DbFaultPolicy::Skip` semantics, the 4-i `RiderRestriction` reasoning): a stray value fails the ONE row's projection rather than halting the whole group."
    - "`standing` is a MECHANICAL `derive:` literal map (`RiderRegistered` → `ACTIVE`, `RiderRestricted` → `RESTRICTED`, `RiderReinstated` → `ACTIVE`) — unlike `Rider.standing`/`RiderRestriction.standing`, which are hand-written `Compute` hooks that preserve the PRIOR value on the creating arm (a checkpoint-reset replay-in-place over an existing row without a TRUNCATE, which those two tables' own rebuild rule forbids). `RiderRoster`'s rebuild is by checkpoint reset AND truncate together (`a_from_zero_replay_yields_the_same_roster_rows`, a full drain from position 0), so chronological event replay alone reproduces the correct end state and the mechanical map is sufficient — a deliberate simplification, not an oversight; a rebuild that resets ONLY this checkpoint without truncating the table would re-grant every restricted rider ACTIVE for the length of the drain, which is why the rule above is TRUNCATE-together, never checkpoint-only."
  indexes:
    - [display_name, rider_id]   # the LIST's declared page order: display_name, then rider_id
    # A partial index (`WHERE standing = 'RESTRICTED'`) is what the RESTRICTED-first triage read
    # wants, but the `indexes:` grammar (tools/codegen-rs/src/emit/sql.rs) emits only whole-column
    # btree indexes — no `WHERE` clause is expressible. Declared PLAIN instead, said so here: the
    # RESTRICTED population is small (a rider base, not an order log), so a plain index still
    # serves the `standing = 'RESTRICTED'` predicate the list's held-first/restricted-first order
    # and the (future, slice B) gauge both filter on; a partial index is a follow-up once the
    # grammar can express one.
    - [standing]
  columns:
    rider_id:
      from: [{ $ref: 'events.yaml#/RiderRegistered/properties/riderId' }]
      pk: true
    display_name:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/displayName' }
        - { $ref: 'events.yaml#/RiderInfoUpdated/properties/displayName' }
      note: "Mirrors `Rider.display_name` — NOT NULL (RiderRegistered always initialises it; RiderInfoUpdated overwrites it only when it carries one, the partial-update convention)."
    phone:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/phone' }
        - { $ref: 'events.yaml#/RiderInfoUpdated/properties/phone' }
      note: "Mirrors `Rider.phone` — a profile attribute, never a lookup key (no unique constraint, no index — French mobile numbers are recycled, the `Rider.phone` rule's reasoning applies identically here)."
    status:
      from:
        - { $ref: 'events.yaml#/RiderRegistered/properties/status' }
        - { $ref: 'events.yaml#/RiderStatusChanged/properties/status' }
      note: "Availability/lifecycle status, straight off the payload of whichever event wrote last — mirrors `Rider.status` exactly; the LEGACY `SUSPENDED` value decodes and renders (never as an authorization signal, never as `standing`)."
    standing:
      type: { $ref: 'scalars.yaml#/RiderStanding' }
      derive:
        RiderRegistered: ACTIVE
        RiderRestricted: RESTRICTED
        RiderReinstated: ACTIVE
      from:
        - { $ref: 'events.yaml#/RiderRegistered' }
        - { $ref: 'events.yaml#/RiderRestricted' }
        - { $ref: 'events.yaml#/RiderReinstated' }
      note: "The platform's grant (ACTIVE/RESTRICTED), mechanically derived — see the table rule above for why this column is `derive:` here while `Rider.standing`/`RiderRestriction.standing` are hand-written."
    ground:
      type: { $ref: 'scalars.yaml#/RiderRestrictionGround' }
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/ground' }]
      note: "Null before any restriction and untouched by RiderReinstated (the attribution stays for admin/counsel history until the next RiderRestricted overwrites it) — mirrors `RiderRestriction.ground`."
    decided_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/decidedAt' }]
      note: "Mirrors `RiderRestriction.decided_at` — a timestamptz VALUE column parsed from the RFC3339 payload string, hence a hand-written `Compute` hook (the generator's own `type_derived`-timestamptz-excludes-ScalarLatest rule), not `derive:`."
    effective_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderRestricted/properties/effectiveAt' }]
      note: "Mirrors `RiderRestriction.effective_at` — same parsed-string reasoning as `decided_at`."
    reinstated_at:
      type: timestamptz
      nullable: true
      from: [{ $ref: 'events.yaml#/RiderReinstated' }]
      note: "The occurred_at of the LATEST RiderReinstated fact (an occurrence timestamp, no payload field) — mirrors `RiderRestriction.reinstated_at` exactly; history, not a live flag."


# The staff authentication bridge (#639 part C step 6-i, ADR-20260905-101349 §5): `auth_subject ->
# member_id`, the SAME shape as `Rider`'s `auth_ref -> rider_id` bridge, in the SAME database
# (`Rider` is delivery-owned, this is network-owned; the pattern generalises across scopes). Its
# own `ProjectorGroup "Member"` checkpoint from 0 (the `RiderRestriction`/`RiderRoster` #424
# lesson): a table born after the log is backfilled by replay, never a migration-time copy.
Member:
  projector: app
  aggregate: RestaurantMembership
  slice: V0
  internal: true   # an identity/authorization bridge, never a GraphQL `reads` target — the roster (6-iv) reads its OWN table, not this one directly; this is the seam's `auth_subject -> member_id` lookup.
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    The bridge a MEMBER-stamped request resolves through (6-ii, not built here): one row per
    person who has ever been granted access to at least one restaurant scope. Deliberately holds
    NOTHING ELSE -- no `display_name` (YAGNI: nothing displays it in 6-i, the roster is 6-iv) and
    no grant-shaped column (authority/basis/scopeId all live on `RestaurantAccessGranted` in
    `domain_events` and on `ScopeMembership`, never duplicated here) -- the binding OUTLIVES any
    one grant, so a column that describes ONE grant does not belong on the person row.
  rules:
    - "Rebuild = checkpoint reset, never TRUNCATE (the `Rider`/`RiderRestriction` precedent, PROP-20260831-180622 §6.4): upsert keyed on `member_id` with ONE creating arm (`RestaurantAccessGranted`), so a from-zero replay rewrites every row in place and no member is denied mid-rebuild. TRUNCATE + reset fails every member closed for the length of the drain. This rule holds only while `Member` carries no grant-shaped column (dba) -- the day one is added, the rebuild discipline must be re-examined exactly as `Rider.standing` forced `RiderRoster` to split off with its OWN opposite recipe."
    - "`auth_subject` is UNIQUE, not merely indexed, and the difference is a security property (the `Rider.auth_ref` precedent): the seam's lookup is `fetch_optional`, which on multiplicity returns an ARBITRARY row -- the constraint converts a silent breach into a visible denial. It does NOT create the invariant: the write-side reservation that does is `database/tables/reservations.yaml#/auth_subject_reservations`, keyed `(principal_kind, auth_subject)` -- `grant_restaurant_access` reserves BEFORE the append, so a duplicate is refused up front and this constraint is the second line, never the first."
    - "RestaurantAccessRevoked touches NOTHING here (ADR-20260905-101349 §5): the binding a person resolves to outlives any one grant they lose -- revoking access is a `ScopeMembership` fact, never a `Member` fact."
    - "No CHECK constraint (`DbFaultPolicy::Skip` semantics, the `RiderRoster` precedent): a stray value fails the ONE row's projection rather than halting the whole group."
    - "ERASURE, named here so the #194 sweep cannot miss an app-projected table the generated dispatch skips (the `Rider`/`ScopeMembership` precedent): `auth_subject` and `member_id` are a natural person's data held OUTSIDE the stream, and the deletion engine deletes streams, not projection rows. The `RestaurantMembership` aggregate declares no `deletion:` block today, so there is nothing to build yet -- but a member tombstone fold is OWED the moment one is declared, on the SAME clock as Customer's (ADR-20260905-101349 §11, MEMBER-ACCESS-GRANT-PRECONDITIONS)."
  fedBy:
    - { $ref: 'events.yaml#/RestaurantAccessGranted' }
  columns:
    member_id:
      type: { $ref: 'scalars.yaml#/MemberId' }
      pk: true
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/memberId' }]
      note: "Keyed on the DOMAIN person id, never `membershipId` (the grant relationship) -- resolved by the projection worker from the PAYLOAD, not from the stream name: the aggregate that authors this event is `RestaurantMembership-{membershipId}`, a DIFFERENT identity from the row this table keys on (the same cross-stream shape as `ScopeMembership`'s `RestaurantListingClaimed` arm)."
    auth_subject:
      type: { $ref: 'scalars.yaml#/AuthSubject' }
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/authSubject' }]
      unique: true
      note: "The login credential this person resolves through (6-ii's seam). UNIQUE, no other index (deliberately no `index: true` beside `unique:` -- the two are separate emitter passes and would emit a redundant second btree, the `Rider.auth_ref` precedent) -- see the table rule."


# The roster (#639 part C step 6-iv round 2, ADR-20260905-101349 §2 amendment, PROP-20260831-180622
# §6.4/§6.5): `restaurantRoster`'s source, ONE row per GRANTED membership. Own `ProjectorGroup
# "RestaurantRoster"` checkpoint from 0 (the `RiderRoster`/`Member` #424 lesson).
RestaurantRoster:
  projector: app
  aggregate: RestaurantMembership
  slice: V0
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    The MANAGER's/OPERATOR's own restaurant team list (`/team`, §8.2). ONE creating arm
    (`RestaurantAccessGranted` only, the `Member` precedent) -- `RestaurantAccessRevoked` touches
    NOTHING here YET (named gap, round 2 scope cut): a revoked colleague stays listed until the
    revoke-removal follow-up lands, tracked beside #902. No `display_name`/email column (YAGNI,
    the `Member` precedent exactly): nothing in this event stream carries one for a
    `CAPTAIN_ONBOARDING` grant, and inventing a cross-stream join to the invitation's
    `invitedEmail` for the `MEMBER_INVITATION` basis ONLY would make the same column mean two
    different things depending on how a row was born -- the `/team` screen names this a `gaps:`
    entry rather than paint a partial truth.
  rules:
    - "Rebuild = checkpoint reset, never TRUNCATE (dba, PROP §6.4): upsert keyed on `membershipId` with the ONE creating arm, so a from-zero replay rewrites every row in place and no member is hidden mid-rebuild. TRUNCATE + reset would hide every member closed for the length of the drain."
    - "No CHECK constraint (`DbFaultPolicy::Skip` semantics, the `RiderRoster`/`Member` precedent): a stray value fails the ONE row's projection rather than halting the whole group."
    - "Predicates over this table are GRANT tests only (PROP §6.4) -- a row's ABSENCE is never the correctness signal (indistinguishable from 'not yet replayed' vs 'revoked' vs 'never granted'); every assertion is a positive existence + value check."
  fedBy:
    - { $ref: 'events.yaml#/RestaurantAccessGranted' }
  indexes:
    - [scope_id, member_id]   # the LIST's page order inside one restaurant -- no display_name column today (YAGNI above), so this is the widest page-order key the table can serve
  columns:
    membership_id:
      type: { $ref: 'scalars.yaml#/MembershipId' }
      pk: true
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/membershipId' }]
      note: "Keyed on the GRANT relationship, not the person -- graphql: revoke is keyed on membershipId, so it MUST be exposed (round-1 graphql finding)."
    scope_id:
      type: { $ref: 'scalars.yaml#/RestaurantId' }
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/scopeId' }]
      note: "The tenant scope this row is visible under -- `restaurantRoster`'s query never takes it as an argument (`ReadScope::Restaurant` supplies it, PROP §6.5), this column is what the WHERE clause filters on."
    member_id:
      type: { $ref: 'scalars.yaml#/MemberId' }
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/memberId' }]
    authority:
      type: { $ref: 'scalars.yaml#/MemberAuthority' }
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted/properties/authority' }]
      note: "The ONLY expressible MANAGER condition for the `/team` screen's Invite/Revoke controls is resolver DATA on the viewer's OWN row (`viewerAuthority` on the connection), never a second `roles:` list (ux/graphql)."
    since:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/RestaurantAccessGranted' }]
      note: "The occurred_at of the granting fact (an occurrence timestamp, no payload field) -- the `RiderRoster.reinstated_at` precedent, hand-written Compute hook."

# The invitation list (#639 part C step 6-iv round 2, PROP-20260831-180622 §6.4): `restaurantInvitations`'s
# source, ONE row per invitation. Own `ProjectorGroup "RestaurantInvitationList"` checkpoint from 0.
RestaurantInvitationList:
  projector: app
  aggregate: RestaurantInvitation
  slice: V0
  database: { $ref: 'database/databases.yaml#/read_common' }
  note: >
    The MANAGER's/OPERATOR's own pending/accepted/revoked/expired invitation list (`/team`, §8.2).
    Status-shaped: EVERY declared `RestaurantInvitation` event updates the SAME row in place
    (`scalars.yaml#/RestaurantInvitationStatus` names the closed set, including the round-2
    `ACCEPTED_PENDING_ACCESS` state and its named gap to plain `ACCEPTED`).
  rules:
    - "Rebuild = TRUNCATE + reset TOGETHER (dba, PROP §6.4, the `RiderRoster` precedent, opposite of `RestaurantRoster`'s): status is grant-shaped (a later fact OVERWRITES an earlier one on the SAME row, never accumulates), so a checkpoint-only reset without truncating would leave a stale REVOKED/EXPIRED row's status untouched if the replay window somehow skipped rewriting it -- truncating first guarantees every row's status is freshly derived from a full chronological replay."
    - "No CHECK constraint (`DbFaultPolicy::Skip` semantics): a stray value fails the ONE row's projection rather than halting the whole group."
    - "Predicates over this table are GRANT tests only (PROP §6.4) -- no `NOT EXISTS` anywhere; every assertion is a positive existence + status-value check."
    - "Retention: `UNVERIFIED input` (register check, dba) -- no controlling record names a ceiling for how long a REVOKED/EXPIRED/ACCEPTED row stays listed; named here so a future record can supersede the current forever-retained default without silently reshaping the table."
  fedBy:
    - { $ref: 'events.yaml#/RestaurantInvitationSent' }
    - { $ref: 'events.yaml#/RestaurantInvitationAccepted' }
    - { $ref: 'events.yaml#/RestaurantInvitationRevoked' }
    - { $ref: 'events.yaml#/RestaurantInvitationExpired' }
  indexes:
    - [scope_id, status, created_at]
  columns:
    invitation_id:
      type: { $ref: 'scalars.yaml#/RestaurantInvitationId' }
      pk: true
      from: [{ $ref: 'events.yaml#/RestaurantInvitationSent/properties/invitationId' }]
    scope_id:
      type: { $ref: 'scalars.yaml#/RestaurantId' }
      from: [{ $ref: 'events.yaml#/RestaurantInvitationSent/properties/restaurantId' }]
    invited_email:
      type: { $ref: 'scalars.yaml#/EmailAddress' }
      from: [{ $ref: 'events.yaml#/RestaurantInvitationSent/properties/invitedEmail' }]
    authority:
      type: { $ref: 'scalars.yaml#/MemberAuthority' }
      from: [{ $ref: 'events.yaml#/RestaurantInvitationSent/properties/authority' }]
    status:
      type: { $ref: 'scalars.yaml#/RestaurantInvitationStatus' }
      derive:
        RestaurantInvitationSent: PENDING
        RestaurantInvitationAccepted: ACCEPTED_PENDING_ACCESS
        RestaurantInvitationRevoked: REVOKED
        RestaurantInvitationExpired: EXPIRED
      from:
        - { $ref: 'events.yaml#/RestaurantInvitationSent' }
        - { $ref: 'events.yaml#/RestaurantInvitationAccepted' }
        - { $ref: 'events.yaml#/RestaurantInvitationRevoked' }
        - { $ref: 'events.yaml#/RestaurantInvitationExpired' }
      note: "Mechanically derived (a literal map, the `RiderRoster.standing` precedent) -- every arm OVERWRITES in place, matching the aggregate's own terminal-once lifecycle."
    expires_at:
      type: timestamptz
      nullable: true
      from: []
      note: "COMPLEX by declaration (empty `from:`, the generator's own occurred_at-vs-parsed-string classifier has no THIRD case for 'occurred_at plus a configuration offset', tools/codegen-rs/src/emit/projectors.rs::classify_column) -- a hand-written Compute hook computes SENT's occurred_at + RESTAURANT_INVITATION_TTL_SECONDS, the SAME configuration key the aggregate's own `reminders:` schedule reads. The resulting `view-column-no-source` WARNING is accepted (warning-baseline.json), named here so the next reader does not mistake it for an oversight. Nullable only because every OTHER event arm preserves the prior value (never actually null once born)."
    # `created_at` is the IMPLICIT technical column (ADR-0040, ColMode::Timestamp) -- it is
    # exactly the SENT fact's occurred_at already (the row's technical birth IS its business
    # birth), so no explicit column is declared here (a duplicate would fail to generate).

Catalog:
  projector: app   # nested category→product→offer TREE assembled from an event stream — application logic
  aggregate: Catalog
  slice: V0
  # STO-2 closure: BND-1(a) keeps catalog its own boundary/database. NOT a sole-reader table — the
  # first version of this line said "sole reader is the catalog scope" and that was FALSE (corrected
  # by the post-ready independent review, AFTER the mob checkpoint): the readers are the catalog
  # scope's api.yaml types AND the captain_write command handlers named below.
  # Its uberPrice derivation reads UberEstimationPolicy — replicated into this database (referential.yaml).
  # OPEN cross-wall dependency, same shape and same chosen direction as OrderTracking's: the uberPrice
  # rule also reads Restaurant.cuisine_category, single-home in read_common — post-split this projector
  # keeps its own fold-local restaurant→cuisine_category lookup (RestaurantRegistered/RestaurantUpdated);
  # Restaurant is deliberately NOT replicated. Implementation belongs to the physical-split slice.
  # OPEN cross-wall dependency #2 — the WRITE PATH reads this table (register row STO-7, WIDENED to
  # name it; DECISIONS §32). The mailbox worker is a captain_write app and its GENERATED composition
  # root declares the dependency: `CommandDeps.catalogs: CatalogReadRepository`
  # (crates/infrastructure/src/generated/command_router.rs). Four handlers read `catalog` through it
  # — add_cart_line and change_cart_line_quantity via require_orderable_line (commands.rs:796, 1006:
  # the availability+stock OVERSELL GUARD, fail-closed OfferNotFound/OfferUnavailable/
  # InsufficientStock/InvalidOptionSelection), place_order via pricing::price_cart (commands.rs:2458
  # -> pricing.rs:56: ServerPriceAuthority repricing, fail-closed PriceUnresolvable), and
  # configure_catalog_slug via slug_taken (commands.rs:2799). `offer_by_id` and `slug_taken` are
  # DEFAULT trait methods over `by_restaurant` (queries.rs:231,249), i.e. literally SELECT ... FROM
  # catalog. Post-split as mapped, captain_write holds no CONNECT on read_catalog: EVERY add-to-cart
  # and EVERY checkout fails closed and the oversell guard never runs — at Friday 19:00-21:30 peak.
  # STO-7 option (a) (a fold-local snapshot for the CART SCREEN, in read_order) does NOT reach this
  # wall: it is the same catalog-authority question asked from captain_write, which is why STO-7 now
  # names both paths and neither may be decided without the other.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_catalog' }
  fedBy:
    - { $ref: 'events.yaml#/CatalogCreated' }
    - { $ref: 'events.yaml#/CatalogCategoryAdded' }
    - { $ref: 'events.yaml#/CatalogCategoryUpdated' }
    - { $ref: 'events.yaml#/CatalogCategoryRemoved' }
    - { $ref: 'events.yaml#/ProductAdded' }
    - { $ref: 'events.yaml#/ProductUpdated' }
    - { $ref: 'events.yaml#/ProductRemoved' }
    - { $ref: 'events.yaml#/OptionListAdded' }
    - { $ref: 'events.yaml#/OptionListUpdated' }
    - { $ref: 'events.yaml#/OptionListRemoved' }
    - { $ref: 'events.yaml#/OfferStockUpdated' }
    - { $ref: 'events.yaml#/CatalogImported' }
    - { $ref: 'events.yaml#/CatalogSlugConfigured' }   # the storefront route, once the owner picks it
  rules:
    - "`stock_status` is derived (quantity vs lowStockThreshold); orderable = AVAILABLE and stock > 0."
    - "Could be normalized (one row per offer) if per-item querying is needed later."
    - "Each offer carries a derived `uberPrice` { amountCents, currency } + `uberPriceBasis` for the product-level comparison (ADR-0022): ESTIMATED = UberEstimationPolicy[restaurant.cuisine_category].price_coefficient × offer price (null when the restaurant has no cuisine_category); REAL = the restaurant's own Uber price when uber_prices_opt_in and a HubRise Uber menu is present (ingestion deferred — runtime). Always labelled."
  columns:
    catalog_id:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/catalogId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/restaurantId' }]
      index: true
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    slug:
      type: { $ref: 'scalars.yaml#/Slug' }
      from: [{ $ref: 'events.yaml#/CatalogSlugConfigured/properties/slug' }]
      nullable: true
      note: "Null until the owner configures it (ConfigureCatalogSlug) -- the unset case is first-class, not an empty string, exactly like Restaurant.slug."
    name:
      from: [{ $ref: 'events.yaml#/CatalogCreated/properties/name' }]
    tree:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CatalogCategoryAdded' }
        - { $ref: 'events.yaml#/CatalogCategoryUpdated' }
        - { $ref: 'events.yaml#/CatalogCategoryRemoved' }
        - { $ref: 'events.yaml#/ProductAdded' }
        - { $ref: 'events.yaml#/ProductUpdated' }
        - { $ref: 'events.yaml#/ProductRemoved' }
        - { $ref: 'events.yaml#/OptionListAdded' }
        - { $ref: 'events.yaml#/OptionListUpdated' }
        - { $ref: 'events.yaml#/OptionListRemoved' }
        - { $ref: 'events.yaml#/OfferStockUpdated' }
        - { $ref: 'events.yaml#/CatalogImported' }
      note: "Assembled tree: categories -> products -> offers { price_cents, currency, availability, stock_status, uberPrice?, uberPriceBasis? } + option lists. See rules for how uberPrice is derived (ADR-0022/0024)."
Cart:
  projector: app   # hand-written fold (crates/application/src/projectors/cart.rs) — a PURE, money-free fold of the cart events; NO catalog/policy read inside the fold
  aggregate: Cart
  slice: V0
  # STO-2 closure: its SUBGRAPH reader is the ordering scope (the order boundary, BND-1(a)). Its read-time
  # estimated breakdown/comparison reads PricingPolicy + Uber*Policy — replicated into this database.
  # OPEN cross-wall dependency, NOT resolved by this placement (register row STO-7, DECISIONS §32):
  # read-time pricing reads the LIVE Catalog projection (read_catalog) at query time — see this
  # table's own note — so post-split as mapped the cart screen cannot resolve names/prices (the #424
  # "built state cannot render" class, on the checkout path, at peak). STO-7 must be decided BEFORE
  # OR WITH the physical split of read_order/read_catalog.
  # SECOND OPEN cross-wall dependency, the same THIRD direction — captain_write -> read_order
  # (register row STO-9; post-ready independent review, round 2). "Sole reader is the ordering scope"
  # was contradicted by this table's OWN rules/notes below, which name CartBindingProcess: a
  # captain_write PM (this very inventory derives its state row into captain_write) whose
  # CustomerIdentified leg calls `CartReadRepository::open_by_session`
  # (process_managers/cart_binding.rs:17-37). Post-split it holds no CONNECT here, so a guest who
  # builds a cart and then signs in AT CHECKOUT never gets it bound — the basket is empty on the far
  # side of the login, at peak intent, and the abandonment is indistinguishable from a change of mind.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_order' }
  note: >
    MONEY-FREE fold (PROP-20260810-231500 Option B, ADR-20260810-112836): the row stores only
    identity, status and the REPRICING INPUTS (per line: offer_id, quantity, selected_option_ids).
    A replay reproduces these rows exactly — the fold reads nothing outside the event stream.
    Prices are computed AT READ TIME by `application::pricing::price_cart` against the live
    catalog (the same authority the checkout write path uses); the authoritative price freeze
    happens once, on PaymentIntentCreated.CheckoutSnapshot.
  fedBy:
    - { $ref: 'events.yaml#/CartStarted' }
    - { $ref: 'events.yaml#/CartLineAdded' }
    - { $ref: 'events.yaml#/CartLineQuantityChanged' }
    - { $ref: 'events.yaml#/CartLineRemoved' }
    - { $ref: 'events.yaml#/CartCheckedOut' }
    - { $ref: 'events.yaml#/CartBoundToCustomer' }
  rules:
    - "The fold is PURE and money-free: no price, currency, breakdown or comparison is stored — the read side prices the lines fresh on every read via price_cart (LIVE catalog), fail-closed on an unresolvable line (PriceUnresolvable → the honest no-price state, never a stale or client number)."
    - "`customer_id` is NULL while the cart is owned by a guest; bound when CartBindingProcess reacts to CustomerIdentified by sending BindCartToCustomer to each OPEN cart of the session (same-stream CartBoundToCustomer), or at checkout."
    - "The estimated PaymentBreakdown and UberComparison shown on the cart (ADR-0018/0022/0025) are READ-TIME computations from the freshly priced food total + PricingPolicy / Uber*Policy — same formulas as before, no longer materialized. Recomputed authoritatively on OrderPlaced.breakdown."
  indexes:
    - [customer_id, updated_at]   # the claim-resolved "most-recently-updated OPEN cart" lookup (queries/current) — a seq scan without it; status is filtered app-side (two-value enum, low selectivity)
  columns:
    cart_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/cartId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/restaurantId' }]
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    session_id:
      from: [{ $ref: 'events.yaml#/CartStarted/properties/sessionId' }]
      index: true
      note: "The visitor session that started the cart; CartBindingProcess binds all OPEN carts of a session on CustomerIdentified."
    customer_id:
      from:
        - { $ref: 'events.yaml#/CartStarted/properties/customerId' }
        - { $ref: 'events.yaml#/CartBoundToCustomer/properties/customerId' }
      nullable: true
      fk: { $ref: '#/Customer/columns/customer_id' }
      note: "NULL while guest; bound by CartBoundToCustomer (CartBindingProcess sends BindCartToCustomer per open cart of the identified session) or at checkout."
    status:
      type: { $ref: 'scalars.yaml#/CartStatus' }
      from:
        - { $ref: 'events.yaml#/CartStarted' }
        - { $ref: 'events.yaml#/CartCheckedOut' }
      note: "Derived from event type: OPEN on CartStarted, CHECKED_OUT on CartCheckedOut."
    lines:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/CartLineAdded' }
        - { $ref: 'events.yaml#/CartLineQuantityChanged' }
        - { $ref: 'events.yaml#/CartLineRemoved' }
      note: "MONEY-FREE repricing inputs, folded verbatim from the cart events: [{ cart_line_id, offer_id, quantity, selected_option_ids }]. NO stored price/name fields — the read side resolves names and prices from the live catalog via price_cart."
OrderTracking:
  projector: app   # tip Σ-by-recipient + uber_* comparison COMPUTED by the projector — application logic
  aggregate: Order
  slice: V0
  # STO-2 closure. The ISOLATION is the reason this sits in read_order rather than a shared read
  # database: catalog-import and prospection bursts must never head-of-line-block the customer
  # anxiety-curve projector at Friday 19:00–21:30 peak. The uber_* fold reads UberEstimationPolicy +
  # UberSplitPolicy — replicated into this database (referential.yaml).
  # OPEN cross-wall dependency, direction recorded (mob checkpoint 2026-08-14): the uber_* fold ALSO
  # reads Restaurant.cuisine_category — Restaurant is single-home in read_common and OrderPlaced does
  # not carry cuisineCategory, so nothing puts it in this database today; post-split that read either
  # crosses the wall or silently nulls the ADR-0025 receipt. Chosen direction: this projector keeps a
  # FOLD-LOCAL restaurant→cuisine_category lookup in its OWN database, folded from
  # RestaurantRegistered/RestaurantUpdated (replay-correct, no cross-wall CONNECT); Restaurant itself
  # is deliberately NOT replicated — that would widen the margin_rate exposure this file defers.
  # Implementation belongs to the physical-split slice, not to the placement declaration.
  # SECOND OPEN cross-wall dependency, in a THIRD wall direction the map did not have — captain_write
  # -> read_order (register row STO-9; found by the post-ready independent review, round 2). Three
  # write-side PMs read this table through `OrderReadRepository` (`SELECT ... FROM ordertracking`,
  # infrastructure/src/persistence/order.rs:28) while running on the mailbox worker, a captain_write
  # app. THE MONEY LEG: SettlementHooks reads the row for `payment_intent_id` on ALL FOUR legs, before
  # every Stripe capture and every release (process_managers/payment_settlement.rs:53-99 — its own doc
  # comment already says "the intent of the row `read_order` admitted", so the code knew it crossed).
  # Post-split the settlement PM holds no CONNECT here and that read ERRORS rather than skipping (the
  # HookOutcome::Skip arm covers a genuinely absent row, not an unreachable table), so the lane stalls
  # in retry: capture-at-DELIVERED never runs and the authorization ages out — food delivered, money
  # never collected — and release-on-reject never runs, so a rejected customer's hold stays held.
  # Riding the same wall, lower stakes: DispatchOpenHooks.orders (delivery_dispatch.rs:83, the
  # OrderMarkedReady birth leg) and on_reclamation_resolved's `orders` (reclamation.rs:91).
  # STO-9 must be decided BEFORE OR WITH the physical split of read_order.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_order' }
  note: >
    The single canonical Order read model. Folds the Order lifecycle + Stripe payment facts (secondary
    source). Serves every order query — by id (`order`), by customer (history) and by restaurant+status
    (back-office queue) — via the indexes below; there is no separate per-persona order projection.
  fedBy:
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
    - { $ref: 'events.yaml#/OrderPreparationStarted' }
    - { $ref: 'events.yaml#/OrderMarkedReady' }
    - { $ref: 'events.yaml#/OrderDelivered' }
    - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
    - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
    - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
    # #167: the acceptance deadline's terminal — folded so the customer's screen leaves PLACED
    # the moment the timeout records (without this fold the tracking page said PLACED forever).
    - { $ref: 'events.yaml#/OrderAcceptanceTimedOut' }
    - { $ref: 'events.yaml#/PaymentCaptured' }
    - { $ref: 'events.yaml#/PaymentReleased' }
    - { $ref: 'events.yaml#/PaymentRefunded' }
    - { $ref: 'events.yaml#/OrderRated' }
    - { $ref: 'events.yaml#/RestaurantRated' }
    - { $ref: 'events.yaml#/DeliverySatisfactionRecorded' }
    - { $ref: 'events.yaml#/OrderTipped' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
    - { $ref: 'events.yaml#/DeliveryPickedUp' }
    - { $ref: 'events.yaml#/DeliveryStatusUpdated' }
    - { $ref: 'events.yaml#/DeliveryCompleted' }
    - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
    - { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
  rules:
    - "`payment_status` is folded from the Stripe payment facts."
    - "`delivery_status`/`courier`/`estimated_dropoff_at` mirror the order's DeliveryJob (correlated by order_id) so the customer's order view shows live delivery progress (ADR-0031); the full operational board is View_DeliveryJob."
    - "A handback (DeliveryHandedBackByRider, #639 part C step 3-ii) mirrors View_DeliveryJob's custody-keyed status arm: `delivery_status` moves to PENDING unless foodLocation is WITH_RIDER (then FAILED), and `courier` resets to null. `delivery_handed_back` (review round 2 on #870) is the SEPARATE flag the customer tracking banner actually reads: true on the handback, reset to false by the next DeliveryAcceptedByRider/DeliveryAcceptedByPartner — never a comparison against `order.status`, because no OrderStatus producer ever emits OUT_FOR_DELIVERY."
    - "Rating columns are populated from OrderRated (rider_thumb), RestaurantRated (restaurant_stars + comment); null until the customer acts. The restaurant reads restaurant_stars/comment to see its rating."
    - "`delivery_timeliness` is the customer's post-delivery delay verdict (DeliverySatisfactionRecorded; #62); null until answered — the client hides the survey once set. The restaurant-facing aggregate is View_DeliverySatisfaction."
    - "`*_tip_cents` sum OrderTipped.tips by recipient (customer AND restaurant tippers combined; ADR-012); separate from the core split, Captain 0% skim; feed per-recipient Open-Collective totals."
    - "`uber_*` columns are the estimated Uber Eats comparison for the pedagogical receipt (ADR-0025), COMPUTED by the projection from breakdown.articles + the restaurant's cuisine_category → UberEstimationPolicy.price_coefficient + UberSplitPolicy. uber_total = coefficient·articles + avg_delivery_fee + platform fee; uber_restaurant = coefficient·articles·(1−uber_commission_pct/100); uber_rider ≈ rider_base_cents (per-km omitted, distance not modelled); uber_platform = uber_total − uber_restaurant − uber_rider. All null when the restaurant has no cuisine_category. uber_basis is ESTIMATED in V0 (REAL when opted-in + HubRise Uber prices — deferred). Contrast against the exact Captain split (restaurant_payout/rider_payout/captain_net)."
  indexes:
    - [restaurant_id, status, placed_at]   # back-office queue: orders(restaurantId, status)
  columns:
    order_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/orderId' }]
      pk: true
    ref:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/ref' }]
    restaurant_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' }]
      fk: { $ref: '#/Restaurant/columns/restaurant_id' }
    customer_id:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/customerId' }]
      nullable: true
      index: true
      fk: { $ref: '#/Customer/columns/customer_id' }
    status:
      type: { $ref: 'scalars.yaml#/OrderStatus' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
        - { $ref: 'events.yaml#/OrderAcceptanceTimedOut' }
      note: "Derived from the lifecycle event type."
    service_type:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/serviceType' }]
    items:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/items' }]
    total_amount_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/totalAmount' }]
      note: "amountCents of OrderPlaced.totalAmount (Money)."
    currency:
      type: { $ref: 'scalars.yaml#/CurrencyCode' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/totalAmount' }]
      note: "currency of OrderPlaced.totalAmount (Money)."
    articles_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.articles.amountCents (food TTC; ADR-0016/0018)."
    delivery_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.delivery.amountCents (→ rider; 0 for collection)."
    service_fee_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.serviceFee.amountCents (Captain buyer service fee)."
    restaurant_payout_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.restaurantPayout.amountCents (3-way split → restaurant)."
    rider_payout_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.riderPayout.amountCents (3-way split → rider)."
    captain_net_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      note: "breakdown.captainNet.amountCents (kept by Captain; feeds Open-Collective totals)."
    uber_total_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber Eats all-in total for the same order (ADR-0025; see rules). Null if no cuisine_category."
    uber_restaurant_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber restaurant net (after ~30% commission; see rules)."
    uber_rider_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber courier earning (base; per-km not modelled in V0; see rules)."
    uber_platform_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "DERIVED estimated Uber platform take = uber_total − uber_restaurant − uber_rider."
    uber_basis:
      type: { $ref: 'scalars.yaml#/ComparisonBasis' }
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/breakdown' }]
      nullable: true
      note: "ESTIMATED (V0) or REAL (opted-in + HubRise Uber prices; deferred). Null if no comparison."
    delivery_address:
      from: [{ $ref: 'events.yaml#/OrderPlaced/properties/deliveryAddress' }]
      nullable: true
    estimated_ready_at:
      from: [{ $ref: 'events.yaml#/OrderAcceptedByRestaurant/properties/estimatedReadyAt' }]
      nullable: true
    placed_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/OrderPlaced' }]
      note: "OrderPlaced occurrence time."
    status_changed_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
        - { $ref: 'events.yaml#/OrderAcceptanceTimedOut' }
      note: "Occurrence time of the latest status-changing event."
    payment_intent_id:
      from:
        - { $ref: 'events.yaml#/OrderPlaced/properties/paymentIntentId' }
        - { $ref: 'events.yaml#/PaymentCaptured/properties/paymentIntentId' }
      nullable: true
      note: >
        The order's Stripe PaymentIntent, SEEDED by OrderPlaced (the birth fact carries it — a
        charging order is born with its authorized intent; a $0 replacement carries none) and
        re-confirmed by PaymentCaptured. PaymentSettlementProcess reads it on fulfilment to
        capture/release the hold, and RefundProcess reads it to open a pending refund. NOT fed by
        PaymentAuthorized: that fact precedes the row's birth, so the OrderPlaced seed carries it.
    payment_status:
      type: text
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/PaymentCaptured' }
        - { $ref: 'events.yaml#/PaymentReleased' }
        - { $ref: 'events.yaml#/PaymentRefunded' }
      note: >
        Folded from Stripe facts; candidate for a PaymentStatus enum. OrderPlaced seeds AUTHORIZED
        for a charging order (authorize-then-capture, ADR-20260808-195315 §1.2): PlaceOrderProcess
        emits it only in reaction to PaymentAuthorized, and that authorization sits earlier in the
        log than the row it would fold into ($0 replacements — no intent — keep the historical
        CAPTURED = "nothing owed"). PaymentCaptured flips it on fulfilment, PaymentReleased on a
        voided/expired hold, PaymentRefunded on settlement of a post-capture abort.
    restaurant_stars:
      from: [{ $ref: 'events.yaml#/RestaurantRated/properties/stars' }]
      nullable: true
      note: "Customer's 0–5 rating of the restaurant; null until rated."
    rating_comment:
      from: [{ $ref: 'events.yaml#/RestaurantRated/properties/comment' }]
      nullable: true
    rider_thumb:
      from: [{ $ref: 'events.yaml#/OrderRated/properties/riderThumb' }]
      nullable: true
    delivery_timeliness:
      type: { $ref: 'scalars.yaml#/DeliveryTimeliness' }
      from: [{ $ref: 'events.yaml#/DeliverySatisfactionRecorded/properties/timeliness' }]
      nullable: true
      note: "Customer's post-delivery delay verdict (#62); null until answered."
    rider_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==RIDER].amount (all tippers); null if none."
    restaurant_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==RESTAURANT].amount; null if none."
    captain_tip_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from: [{ $ref: 'events.yaml#/OrderTipped/properties/tips' }]
      nullable: true
      note: "Σ OrderTipped.tips[recipient==CAPTAIN].amount; null if none."
    rated_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderRated' }
        - { $ref: 'events.yaml#/RestaurantRated' }
        - { $ref: 'events.yaml#/DeliverySatisfactionRecorded' }
        - { $ref: 'events.yaml#/OrderTipped' }
      nullable: true
      note: "Occurrence time of the latest rating/tip/survey event."
    delivery_status:
      type: { $ref: 'scalars.yaml#/DeliveryStatus' }
      from:
        - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/DeliveryPickedUp' }
        - { $ref: 'events.yaml#/DeliveryStatusUpdated' }
        - { $ref: 'events.yaml#/DeliveryCompleted' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
        - { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
      nullable: true
      note: "Mirror of the order's DeliveryJob status (correlated by order_id); null for COLLECTION / before dispatch. DeliveryPickedUp mirrors PICKED_UP on the rider path (the partner path reports it via DeliveryStatusUpdated); DeliveryDispatchFailed (offer cap exhausted) mirrors FAILED (ADR-20260720-004556); DeliveryHandedBackByRider mirrors View_DeliveryJob's custody-keyed arm (PENDING unless WITH_RIDER, then FAILED — #639 part C step 3-ii)."
    courier:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
      nullable: true
      note: "Assigned Courier { displayName, phone?, riderId? } once accepted; null before, and RESET to null by a handback (#639 part C step 3-ii — the job is unassigned again)."
    estimated_dropoff_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/DeliveryAcceptedByPartner/properties/estimatedDropoffAt' }]
      nullable: true
      note: "Partner-reported ETA to the customer; null when unknown."
    delivery_handed_back:
      type: boolean
      from:
        - { $ref: 'events.yaml#/DeliveryHandedBackByRider' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByPartner' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
      note: "#639 part C step 3-ii, review round 2 on #870: true from DeliveryHandedBackByRider, RESET to false by the next DeliveryAcceptedByRider/DeliveryAcceptedByPartner (a re-offer accepted); defaults false. Lives ON this row (not a separate delivery read) so the PUSHED Order frame carries it. The tracking screen's banner reads THIS flag directly — never `status == 'OUT_FOR_DELIVERY'` (no OrderStatus producer emits that token) — which also correctly covers the from-ASSIGNED NOT_COLLECTED case, where the order is only READY."

OrderConversation:
  projector: app   # message timeline appended + PUBLIC/INTERNAL split + order-status fold = application logic
  aggregate: Conversation
  slice: V0
  # STO-2 closure: the SUBGRAPH reads it behind comms-scope types, and BND-1(a)/§31 records
  # Conversation → order ("comms dissolves as a boundary"), so the subgraph serving them IS the order
  # boundary's role — no SECOND subgraph gains CONNECT (a claim about subgraphs only, per the marker). PII note: the free text will incidentally carry allergy
  # statements (Art. 9 special category) — the future PII inventory must not class this as ordinary contact data.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_order' }
  note: >
    The per-order conversation read model (#129). Folds the conversation's own messages AND the order's
    status lifecycle events (cross-aggregate, correlated by order_id) into one timeline, so order status
    participates in the thread with no status copied into a message. The projector appends each
    MessagePosted, splitting PUBLIC (messages) from INTERNAL (internal_notes).
  fedBy:
    - { $ref: 'events.yaml#/ConversationOpened' }
    - { $ref: 'events.yaml#/MessagePosted' }
    - { $ref: 'events.yaml#/MessageTranslationAdded' }
    - { $ref: 'events.yaml#/AdminInvitedToConversation' }
    - { $ref: 'events.yaml#/ParticipantMuted' }
    - { $ref: 'events.yaml#/ParticipantUnmuted' }
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
    - { $ref: 'events.yaml#/OrderPreparationStarted' }
    - { $ref: 'events.yaml#/OrderMarkedReady' }
    - { $ref: 'events.yaml#/OrderDelivered' }
    - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
    - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
    - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
    - { $ref: 'events.yaml#/ReclamationOpened' }
    - { $ref: 'events.yaml#/ReclamationResolved' }
    - { $ref: 'events.yaml#/ReclamationRejected' }
    - { $ref: 'events.yaml#/ReclamationReopened' }
    - { $ref: 'events.yaml#/ReclamationEvidenceAttached' }
  columns:
    order_id:
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/orderId' }]
      pk: true
    restaurant_id:
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/restaurantId' }]
      index: true
    customer_chat_enabled:
      type: boolean
      from: [{ $ref: 'events.yaml#/ConversationOpened/properties/customerChatEnabled' }]
    status:
      type: { $ref: 'scalars.yaml#/OrderStatus' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/OrderAcceptedByRestaurant' }
        - { $ref: 'events.yaml#/OrderPreparationStarted' }
        - { $ref: 'events.yaml#/OrderMarkedReady' }
        - { $ref: 'events.yaml#/OrderDelivered' }
        - { $ref: 'events.yaml#/OrderRejectedByRestaurant' }
        - { $ref: 'events.yaml#/OrderCancelledByCustomer' }
        - { $ref: 'events.yaml#/OrderCancelledByRestaurant' }
      note: "Derived from the latest order lifecycle event type (cross-aggregate fold, correlated by order_id)."
    messages:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/MessagePosted' }
        - { $ref: 'events.yaml#/MessageTranslationAdded' }
      note: "PUBLIC ConversationMessage[] (entities.yaml#/ConversationMessage), appended per MessagePosted (visibility=PUBLIC) by the projector; MessageTranslationAdded is folded into the targeted message's per-message `translations` array (translate once, reuse; #129)."
    internal_notes:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/MessagePosted' }
        - { $ref: 'events.yaml#/MessageTranslationAdded' }
      note: "INTERNAL ConversationMessage[] staff notes, appended per MessagePosted (visibility=INTERNAL) by the projector; MessageTranslationAdded is folded into the targeted note's per-message `translations` array (#129)."
    opened_at:
      type: timestamptz
      from: [{ $ref: 'events.yaml#/ConversationOpened' }]
    admin_invited:
      type: boolean
      from: [{ $ref: 'events.yaml#/AdminInvitedToConversation' }]
      note: "True once an admin was pulled in by a reasoned escalation (#129)."
    escalation_reason:
      type: { $ref: 'scalars.yaml#/EscalationReason' }
      nullable: true
      from: [{ $ref: 'events.yaml#/AdminInvitedToConversation/properties/reason' }]
      note: "The reason recorded on the latest escalation; null until an admin is invited."
    muted:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/ParticipantMuted' }
        - { $ref: 'events.yaml#/ParticipantUnmuted' }
      note: "current MutedParticipant[] (entities.yaml#/MutedParticipant), applied per mute/unmute by the projector."
    claim_events:
      type: jsonb
      from:
        - { $ref: 'events.yaml#/ReclamationOpened' }
        - { $ref: 'events.yaml#/ReclamationResolved' }
        - { $ref: 'events.yaml#/ReclamationRejected' }
        - { $ref: 'events.yaml#/ReclamationReopened' }
        - { $ref: 'events.yaml#/ReclamationEvidenceAttached' }
      note: "ClaimTimelineEntry[] (entities.yaml#/ClaimTimelineEntry) — weaves the Reclamation lifecycle into the order thread: the projector appends one entry per Reclamation* event (kind OPENED/RESOLVED/REJECTED/REOPENED/EVIDENCE_ATTACHED), keyed onto the order row by the event's orderId (cross-aggregate, correlated by order_id), so a claim's status and evidence show inline in the per-order conversation (§2.5, #155, #156)."

CustomerCreditBalance:
  projector: app   # balance is a SUM (Σ granted − Σ consumed) — NOT foldable into a View_* (a fold view is a per-column state-fold, not an aggregate); the materialized-projector pattern (#158, ADR-20260726-163737) maintains it
  aggregate: CustomerCredit
  slice: V0
  # STO-2 closure: §31/BND-1 records CustomerCredit → order, and its known reader (the payments-scope
  # customerCredit query) is served by the order boundary's subgraph — read_common would hand that
  # subgraph a second CONNECT, the exact STO-2(b) rejection.
  # READER SET = LOWER BOUND, not a closed set (2026-08-14): five known reader classes; an APP holds
  # CONNECT, so a scope-granular claim is not a grant-granular one; hand-written seams escape the
  # walker. Derive it mechanically, never from this comment — DECISIONS §32 "the method finding".
  database: { $ref: 'database/databases.yaml#/read_order' }
  note: >
    The per-customer store-credit BALANCE read model (#158, Part B of #207). One row per customer with a
    ledger; the projector keeps `balance_cents` as the running SUM over the ledger stream
    (`CustomerCredit-{customerId}`): += on CustomerCreditGranted, −= on CustomerCreditConsumed. Serves the
    `customerCredit` query (the customer sees their spendable goodwill balance) and mirrors the pure
    write-side fold in `crates/domain/src/customer_credit.rs`. The balance is never negative (the write
    side rejects an overspend, errors.yaml#/InsufficientCustomerCredit).
  fedBy:
    - { $ref: 'events.yaml#/CustomerCreditGranted' }
    - { $ref: 'events.yaml#/CustomerCreditConsumed' }
  rules:
    - "`balance_cents` is COMPUTED by the projector as Σ granted − Σ consumed (a SUM, not a fold-view column); the row is born on the first CustomerCreditGranted (a consume before any grant never materializes a ledger, mirroring the domain fold)."
    - "`currency` is set from the first grant's amount and stays fixed (a customer's ledger is single-currency — their local currency, EUR for Tours V0)."
  columns:
    customer_id:
      from: [{ $ref: 'events.yaml#/CustomerCreditGranted/properties/customerId' }]
      pk: true
    balance_cents:
      type: { $ref: 'scalars.yaml#/MoneyCents' }
      from:
        - { $ref: 'events.yaml#/CustomerCreditGranted/properties/amount' }
        - { $ref: 'events.yaml#/CustomerCreditConsumed/properties/amount' }
      note: "Σ granted − Σ consumed (minor units), never negative. amountCents of the grant/consume Money, summed by the projector."
    currency:
      type: { $ref: 'scalars.yaml#/CurrencyCode' }
      from: [{ $ref: 'events.yaml#/CustomerCreditGranted/properties/amount' }]
      note: "The ledger currency, from the first grant's amount (single-currency per customer)."
# --- Read-side per-instance authorization (#144, PROP-20260725-185140) ---

ScopeMembership:
  projector: app   # SET-shaped: one event GRANTS/REVOKES N rows (not a per-entity state fold) — hand-written projector
  aggregate: Order
  slice: V0
  internal: true   # a technical authorization index, never a GraphQL `reads` target (no output type binds it)
  replicated: read-databases   # STO-2(a), DECIDED: projected into EVERY read database by each scope's projector — "composition happens in the projector, not the query", applied to authorization; one database, one grant, and each subgraph stays self-sufficient. The resolved set is every `recovery: replay` database in database/databases.yaml.
  note: >
    WHO may see WHICH protected instance (#144). One row per (scope, member): the single index every
    read-side authorization question resolves against, for every role and every surface —
    `SELECT EXISTS(... WHERE membership_id = $1)`. The guard never learns what an order is, so a new
    ScopeType is a projector rule rather than new code in the guard.

    Adopting this index replaced four separate mechanisms (PROP-20260725-185140 §3.4): per-role
    table/column resolution, the restaurant -> account hop, an `active` predicate on rider membership,
    and multi-rider-per-order special cases. Reassignment needs no special handling: it is a REVOKE
    followed by a GRANT, so the previous rider loses access the moment the new one is recorded.

    SAFETY: this is an ACL cache with asymmetric failure modes. A MISSING row denies (visible, safe); a
    STALE row grants (a silent breach). The revoke rules are therefore more safety-critical than the
    grants, and the projector errs toward deleting. Drift is repairable by replay, which is the property
    that makes the cache acceptable at all.
  rules:
    - "GRANT on OrderPlaced: the order's customer, its restaurant, and that restaurant's account. These are PERMANENT — order history must stay readable forever (product-owner decision, 2026-07-25)."
    - "GRANT on DeliveryAcceptedByRider: the accepting rider, on the `orderId` the event carries (D-QW1 option b, ADR-20260808-234907)."
    - "REVOKE on DeliveryCancelled / DeliveryDispatchFailed: the RIDER role rows for that job's order. The ONLY revoke in V0 — riders are the only membership that ends. DeliveryCancelled carries no orderId, so the worker resolves it via View_DeliveryJob before folding; an unresolvable job yields NO change (allow-stale on an orphan stream — acceptable only because a birth fact always precedes its cancel in position order)."
    - "GRANT on RestaurantRegistered: the restaurant itself and its owning account, scope_type RESTAURANT."
    - "GRANT on RestaurantListingClaimed: the claiming account, scope_type RESTAURANT — the post-registration attachment path. A Sirene-seeded listing registers with NO accountId; without this fold its account would never gain membership and resolve_restaurant_account would find nothing for every subsequent OrderPlaced (review finding, ADR-20260809-160000 addendum)."
    - "ADMIN holds NO rows — the guard short-circuits on the role. Storing them would mean a row per admin per instance, unbounded and pointless."
    - "membership_id is UUIDv5 over (scope_type, scope_id, member_type, member_id), so re-projecting a grant is an idempotent upsert and revoking needs no lookup — the same inputs always derive the same key (the hubrise_connections.restaurant_account_id pattern). EXCEPTION (#639 part C step 6-i, ADR-20260905-101349 §2): the MEMBER arm reuses `RestaurantAccessGranted.membershipId` VERBATIM as this row's own PK instead of re-deriving it — that id is already a stable, unique identifier minted once by the `RestaurantMembership` aggregate, and reusing it is what lets `RestaurantAccessRevoked` (which carries `membershipId` and NOTHING else identifying the scope) target-delete this ONE row with no lookup."
    - "GRANT on RestaurantAccessGranted (#639 part C step 6-i, ADR-20260905-101349 §2): ONE row, scope_type RESTAURANT, member_type MEMBER, member_id the event's `memberId` — see the member_id column note for why NOT `membershipId`."
    - "REVOKE on RestaurantAccessRevoked (#639 part C step 6-i): a TARGETED delete of the ONE row whose `membership_id` equals the event's `membershipId` — NEVER the broad `revoke_role` arm above (which would strip every MEMBER row on the scope). A member table with a per-relationship identity is exactly the case the broad arm's own doc warns about: 'membership' here names a person, not a role population, so a targeted revoke cannot leave a sibling holding stale access — there IS no sibling row sharing this key."
    - "ADR-20260905-101349 §3, DISAMBIGUATING NOTE (member_id, #639 part C step 6-i): `member_id`'s existing note says 'the DOMAIN id, never the auth subject' — true for MEMBER too, and the domain id here is `MemberId` (the person), never `membershipId` (the grant/relationship). `member_id` therefore now names TWO different things depending on `member_type`: an aggregate's OWN identity (customerId/restaurantId/restaurantAccountId/riderId, each row IS that aggregate) versus a PERSON's identity who is not the scope itself (MEMBER). PROP-20260831-180622 §6.5 names this semantics fix as owed and not built in 6-i; this note is the marker for whoever picks it up."
    - "ERASURE (#194, ADR-20260731-160000): this is an Order-fed read model holding a customer-to-order link — it OWES an OrderExpired tombstone fold (delete the order scope's rows) when the deletion engine lands. Named here so the #194 sweep cannot miss an app-projected table the generated dispatch skips."
  fedBy:
    - { $ref: 'events.yaml#/OrderPlaced' }
    - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
    - { $ref: 'events.yaml#/DeliveryCancelled' }
    - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
    - { $ref: 'events.yaml#/RestaurantRegistered' }
    - { $ref: 'events.yaml#/RestaurantListingClaimed' }
    - { $ref: 'events.yaml#/RestaurantAccessGranted' }
    - { $ref: 'events.yaml#/RestaurantAccessRevoked' }
  indexes:
    - [member_type, member_id, scope_type]   # "everything this member may see" -> list-query filtering
    - [scope_type, scope_id]                       # "who may see this instance" -> audit + revoke sweeps
  columns:
    membership_id:
      type: uuid
      pk: true
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted/properties/membershipId' }
        - { $ref: 'events.yaml#/RestaurantAccessRevoked/properties/membershipId' }
      note: "UUIDv5(scope_type|scope_id|member_type|member_id) — derived, never random, so a replayed grant upserts onto itself. EXCEPTION: the MEMBER arm carries the RestaurantAccessGranted/Revoked payload's `membershipId` VERBATIM instead (see the table rule) — a pre-minted, already-unique id, not re-derived."
    scope_type:
      type: { $ref: 'scalars.yaml#/ScopeType' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted' }
      note: "Which KIND of instance — ORDER or RESTAURANT. Constant per grant/revoke rule, not read from a payload (RestaurantAccessGranted's OWN `scopeType` payload field is RESTAURANT-only in 6-i, but the column here is still the CONSTANT the fold applies, not a passthrough). The revoke events appear in this lineage because the revoke's DELETE predicate reads exactly (scope_type, scope_id, member_type) — they write no value, they key a deletion. RestaurantAccessRevoked is the ONE exception: its targeted delete keys on `membership_id` alone (see the table rule), so it does not appear here."
    scope_id:
      type: uuid
      from:
        - { $ref: 'events.yaml#/OrderPlaced/properties/orderId' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/restaurantId' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/orderId' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed/properties/orderId' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted/properties/scopeId' }
      note: "The protected instance: an OrderId or a RestaurantId. DeliveryCancelled carries no orderId — the worker resolves the job's order via View_DeliveryJob before folding."
    member_type:
      type: { $ref: 'scalars.yaml#/UserType' }
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/DeliveryCancelled' }
        - { $ref: 'events.yaml#/DeliveryDispatchFailed' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted' }
      note: >
        In the key deliberately: a rider who is ALSO a customer must hold two distinct memberships, or
        their customer row would let them fetch rider-audience data. The revoke events key their
        deletion by this column (the RIDER role), which is why they appear in its lineage.
        EXCEPTION (#639 part C step 6-i, ADR-20260905-101349 §3): the constant this column stores
        for a `RestaurantAccessGranted` fold is the LITERAL text `MEMBER` -- a `PrincipalKind`
        value written into a column declared `UserType` (this scalar, above), because typing
        `member_type` as `PrincipalKind` for real would be the retype PROP-20260831-180622 §6.5
        owns and 6-i does not build (`UserType` stays exactly the seven-role enum it is; adding
        `MEMBER` there would mint an eighth `/{path}/graphql` role by accident). The stored column
        is plain TEXT at the DB layer (no FK, no CHECK) so this is representable today; the $ref
        above documents the column's INTENDED type once §6.5 lands, not its current one.
    member_id:
      type: uuid
      from:
        - { $ref: 'events.yaml#/OrderPlaced/properties/customerId' }
        - { $ref: 'events.yaml#/OrderPlaced/properties/restaurantId' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider/properties/riderId' }
        - { $ref: 'events.yaml#/RestaurantRegistered/properties/restaurantId' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed/properties/accountId' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted/properties/memberId' }
      note: >
        The DOMAIN id (customerId / restaurantId / restaurantAccountId / riderId), never the auth
        subject — the sub->domain bridge happens once per request at the edge. DISAMBIGUATING NOTE
        (#639 part C step 6-i, ADR-20260905-101349 §3, D): for the MEMBER arm this is the person's
        `MemberId`, NEVER `membershipId` (the grant/relationship `RestaurantAccessGranted` also
        carries) — every OTHER member_type's value here names an aggregate that IS the scope row
        itself, while MEMBER is the first case where the value names a PERSON distinct from any
        scope they hold access to. This column therefore now carries two different KINDS of
        identity depending on member_type, which PROP-20260831-180622 §6.5 names as an owed
        semantics fix; 6-i does not build it, and this note is the marker for whoever does.
    granted_at:
      type: timestamptz
      from:
        - { $ref: 'events.yaml#/OrderPlaced' }
        - { $ref: 'events.yaml#/DeliveryAcceptedByRider' }
        - { $ref: 'events.yaml#/RestaurantRegistered' }
        - { $ref: 'events.yaml#/RestaurantListingClaimed' }
        - { $ref: 'events.yaml#/RestaurantAccessGranted' }
      note: "When the membership was recorded (the event's occurred_at) — deterministic under replay; preserved on a replayed grant (ON CONFLICT DO NOTHING)."
