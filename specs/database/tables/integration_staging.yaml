version: 4
description: >
  Raw-integration STAGING tables (ADR-0045, generalized by ADR-20260720-015400) — a third table
  category alongside the event store (eventstore.yaml), the event-fed projections
  (projection_tables.yaml / projection_views.yaml) and the seeded reference/config tables
  (referential.yaml). A staging table is ADAPTER-OWNED: the landing zone for RAW external records
  (CI-ingested mirrors like SIRENE, or verified webhook payloads like Stripe/HubRise) kept for the
  exclusive needs of adaptation — dedupe, verification provenance, replay/backfill. It is NOT
  projected from `domain_events` and NOT a GraphQL `reads` target (no `reference: true`) — an
  on-app worker/ACL translates rows into ordinary domain commands (SIRENE → RegisterRestaurant,
  HubRise → ImportCatalog) or adapted business events staged in `journals.yaml#/inbound_events`
  (Stripe). The codegen emits its CREATE TABLE + indexes generically like any other
  `database/tables/*.yaml` table; `staging: true` documents the category.

external_sirene_restaurants:
  staging: true
  description: >
    Raw INSEE Sirene établissement mirror (ADR-0045). The scheduled CI ingestion job UPSERTs one row per
    SIRET with the verbatim INSEE payload; the on-app `sync_sirene_worker` drains rows past its checkpoint,
    runs the SIRENE Anti-Corruption Layer and registers/closes restaurants via the normal write path.
    Detect-by-absence deletion uses `last_seen_at` + the explicit `etat` (etatAdministratifEtablissement).

    `payload_hash` (ADR-20260728-011344) is what stops a sweep re-driving the whole country. The
    ingestion bumps `last_seen_at` on EVERY row it sees -- it must, because absence detection depends on
    that freshness -- but bumping it also re-pended the row, so ~200k identical établissements were
    re-translated, re-journaled and re-appended every Monday for no change at all. The hash covers only
    the fields the ACL actually reads, so an INSEE-internal timestamp cannot defeat it; when it matches,
    the conflict arm advances `processed_at` alongside `last_seen_at` and the row stays NON-pending.
    Note the division of labour: "has this external record changed since we mirrored it?" is a fact
    about INSEE and belongs here, in the adapter. "Is this a meaningful change to the Restaurant?" is a
    domain question and belongs only in the aggregate's fold. Both exist, and neither substitutes for
    the other.

    `payload` is TRANSIENT and `payload_hash` is PERMANENT (ADR-20260728-143000) — the single most
    important thing to know about this table, because the two used to have the same lifetime and the
    asymmetry is what makes national coverage affordable. The payload is an INPUT TO TRANSLATION: needed
    from the moment INSEE reports a change until the worker has turned it into a domain fact, and never
    again. The hash is the change-detection key and is needed forever, because every future sweep
    compares against it. So a payload is present exactly while a row is PENDING; the worker NULLs it on
    successful translation. At steady state almost every row is processed, so the table is
    `siret + payload_hash + etat/naf/department + timestamps` ~ 200 bytes/row instead of ~1.8 kB.
    Measured before the change: 655 MB for 339k rows -- 77% of the whole database, at department 37 of
    101, projecting to ~2 GB for full France on a 2 GB disk.

    The ONE exception is deliberate: a row the ACL could not MAP (no usable name, no postal code,
    unparsable JSON) KEEPS its payload. It is the only evidence of why INSEE's record was unusable, and
    deleting it is how a systematic mapping bug hides. The set is bounded (~5.4k historically).

    `status` answers "HAS THIS ROW BEEN SYNCED, OR NOT?" directly, instead of leaving it to be inferred.
    It exists because making the payload transient would otherwise have made the table ambiguous: once
    `payload` is nullable, a row that HAS one is either still awaiting translation or was kept as
    evidence, and nothing distinguishes the two. Values, written by the worker (except PENDING, written
    by the ingestion):
      * PENDING    — ingested or refreshed, not yet translated. Payload PRESENT, because the worker needs it.
      * STAGED     — the ACL translated the record and HANDED IT OVER to `inbound_events`; the aggregate
                     has not decided yet. This is an intermediate state, not a success — calling it
                     SYNCED would claim more than the worker knows, and a later delivery failure would
                     leave the mirror asserting something that never happened. Payload DROPPED (the
                     inbound row carries its own translated copy).
      * SYNCED     — the record REACHED THE DOMAIN. Either resolved from the aggregate's verdict (see
                     below) or, for the explicit-closure path, known synchronously because
                     `MarkRestaurantClosed` is a real command executed inline.
      * UNMAPPABLE — parsed but rejected by the ACL, or not parsable at all. Payload KEPT as evidence.
                     Checkpointed, so it is NOT retried forever — a refresh from INSEE re-pends it.
      * FAILED     — a write/staging failure. The row keeps its payload and is retried on the next pass;
                     the status records that the last attempt did not get there.
      * POISON     — QUARANTINED after 10 consecutive failed attempts. The drain SKIPS these rows, which
                     is the whole point: without it a permanently-failing row is retried on every pass
                     forever, burning the sweep's budget and drowning the log in an error nobody is
                     acting on (the 605-row SlugAlreadyTaken storm was exactly this shape). The payload
                     is KEPT -- it is the evidence needed to diagnose it, and the retry would need it.
                     Recovery is automatic and needs no operator: a CHANGED record from INSEE re-pends
                     the row through the ordinary conflict arm, which sets PENDING and so clears POISON.
                     So quarantine holds a row exactly as long as it keeps arriving unchanged and broken.
    It is deliberately TEXT rather than a scalar enum `$ref`. Enums persist as declaration-order ints
    (ADR-0037/0041), and the CI `sirene_ingest` crate that writes PENDING cannot see the domain types at
    all (ADR-0045 keeps domain crates out of that build) — it would have to hardcode ordinals, so a
    future reordering of the enum would silently reinterpret every row. Text has no such failure mode,
    and matches its sibling columns (`etat`, `naf`) on this adapter-owned table.
    Note it does NOT replace `processed_at`: that is the CHECKPOINT (`< last_seen_at ⇒ pending`, the
    concurrency-safe high-water mark), while `status` is the OUTCOME. `GROUP BY status` is the operator's
    per-sweep report.

    STAGED -> SYNCED is resolved by JOINING `inbound_events`, and the join key already exists -- nothing
    extra is stored to make it work. The ACL writes `inbound_events.external_id = '{siret}:{payload_hash}'`
    (ADR-20260728-011344), and both halves are columns on this row, so
    `i.external_id = s.siret || ':' || s.payload_hash` links them exactly. On each drain the worker reads
    `inbound_events.status` for its STAGED rows and writes the verdict back: DELIVERED / IGNORED /
    DUPLICATE all mean the record reached the domain and the domain is now correct about it (a no-change
    verdict is a real answer, not a failure -- conflating the two is what once made a sweep unable to
    tell 200,000 registrations from 200,000 no-ops), so all three resolve to SYNCED; FAILED surfaces as
    FAILED; RECEIVED means still in flight and is left alone. This necessarily LAGS by at least one
    drain, because the verdict does not exist at hand-over time.

    `synced_at` is the third of that trio and answers WHEN, in wall-clock terms, this row last became a
    domain fact. It is NOT derivable from `processed_at`, and the difference is easy to miss: the worker
    sets `processed_at` to the `last_seen_at` it READ, deliberately not `now()`, so that a concurrent
    ingestion bump re-pends the row instead of being swallowed -- and the ingestion itself then advances
    `processed_at` to `now()` on every UNCHANGED row it re-sees (the hash-match carry-forward). So
    `processed_at` moves for rows nothing happened to, and its value is a sweep timestamp rather than a
    sync timestamp. `synced_at` moves only when a fact is actually produced. NULL means never synced.
    It deliberately SURVIVES a re-pend: "last synced 3 weeks ago, PENDING again since yesterday" is the
    useful reading, so a row carries both its current state and when it last got through.
    No index: the operational queries filter on `status`, and an extra btree over 339k rows is disk this
    table is specifically trying to give back. Add one if a "not synced since X" query ever needs it.

    `last_attempt_sync_at` + `attempt_sync_retry_count` are the FAILURE side of the same story, and they
    are what make a stuck row findable. A failed sync leaves the row PENDING with its payload intact --
    it must, or the retry would have nothing to translate -- so a permanently-failing row is otherwise
    indistinguishable from one that simply has not been reached yet, and it would retry silently forever.
    Now: `last_attempt_sync_at` moves on EVERY attempt (that is what "last attempt" means, success or
    not), while `attempt_sync_retry_count` counts CONSECUTIVE failures and RESETS to 0 on any
    checkpointed outcome (SYNCED or UNMAPPABLE). Resetting is what gives the number meaning -- a
    monotonic lifetime counter says nothing about whether a row is stuck NOW, and
    `WHERE status = 'POISON'` is the operator's stuck-row list, and the count is what put them there.
    Note the ingestion does NOT reset the count when a changed record re-pends a row: the count is
    "consecutive failures since the last success", and a row whose new version syncs clears it naturally.

    What this costs: an ACL that learns to read a NEW INSEE field cannot re-translate from the mirror.
    It does not need to. The hash covers the TYPED projection, so adding a field to the wire types
    changes the digest of every record, and the next ordinary paced sweep re-pends and re-translates the
    whole mirror on its own -- the backfill is the normal sweep, not a special operation (D5).
    Scope: all active food-service NAF (56.10A/B/C + 56.30Z) across France; the ingestion partitions its
    INSEE queries by `department` when the deep-pagination cap bites.
    NO ROW RETENTION (ADR-20260721-025159): this is a full mirror — detect-by-absence needs the complete
    ROW set, and it holds company (not consumer) data; sweep_retention() never touches it. That is a
    statement about rows, NOT about payloads: payloads have the lifetime described above, and conflating
    the two is exactly what a future reader will trip on.
  columns:
    siret:         { type: text, pk: true }                 # 14-digit SIRET — the idempotent external key
    payload:       { type: jsonb, nullable: true }          # raw INSEE record, verbatim — present only while PENDING (or unmappable); see the note above
    etat:          { type: text, index: true }              # etatAdministratifEtablissement (A=active / F=closed)
    naf:           { type: text, index: true }              # activitePrincipale (56.10A/B/C, 56.30Z)
    department:    { type: text, index: true }              # code département — partitioned sweeps + worker batching
    first_seen_at: { type: timestamptz }                    # when this SIRET first appeared in a sync
    last_seen_at:  { type: timestamptz, index: true }       # latest sync that saw it — drives detect-by-absence
    sync_run_id:   { type: uuid }                           # correlates all rows touched by one ingestion run
    payload_hash:  { type: text, index: true }              # see the note below -- the "did this actually change?" key
    processed_at:  { type: timestamptz, nullable: true }    # worker high-water mark: NULL / < last_seen_at ⇒ pending
    status:        { type: text, index: true }              # what the worker DECIDED -- see the status note below
    synced_at:                { type: timestamptz, nullable: true }  # WHEN the row last became a domain fact (wall clock) -- NULL = never synced
    last_attempt_sync_at:     { type: timestamptz, nullable: true }  # WHEN the worker last TRIED, success or failure
    attempt_sync_retry_count: { type: integer }                      # CONSECUTIVE failed attempts since the last checkpointed outcome

external_stripe_events:
  staging: true
  description: >
    Raw VERIFIED Stripe webhook mirror (ADR-20260720-015400). The webhook endpoint UPSERTs one row
    per Stripe event id AFTER raw-body signature verification (ADR-20260718-145856), then the ACL
    translates it into an adapted business event staged in journals.yaml#/inbound_events.
    Redelivery dedupes on the pk and ACKs immediately; processed_at is the translation high-water
    mark, enabling replay/backfill without asking Stripe to resend.
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (ADR-20260721-025159)
    max_age: '90 days'
    applies_to: >
      Processed rows only (processed_at set), aged from processed_at — the replay/backfill horizon,
      and the PII cap on verbatim Stripe payloads. Unprocessed rows are never swept.
  columns:
    stripe_event_id: { type: text, pk: true }                 # Stripe 'evt_…' — the idempotent external key
    event_type:      { type: text, index: true }              # Stripe type, e.g. 'payment_intent.succeeded'
    payload:         { type: jsonb }                          # raw verified Stripe event, verbatim
    received_at:     { type: timestamptz, index: true }
    processed_at:    { type: timestamptz, nullable: true, index: true }   # NULL ⇒ not yet translated into inbound_events

external_avelo37_events:
  staging: true
  description: >
    Raw VERIFIED Avelo37 delivery-partner webhook mirror (ADR-20260720-015400 follow-up, issue #28).
    The webhook endpoint UPSERTs one row per partner event id AFTER raw-body signature verification
    (Stripe-style timestamped HMAC, fail-closed), then the avelo37-acl translates it into an adapted
    business event (DeliveryAcceptedByPartner / DeliveryRejectedByPartner / DeliveryStatusUpdated)
    staged in journals.yaml#/inbound_events. Redelivery dedupes on the pk and ACKs immediately;
    processed_at is the translation high-water mark, enabling replay/backfill without asking the
    partner to resend.
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (ADR-20260721-025159)
    max_age: '90 days'
    applies_to: >
      Processed rows only (processed_at set), aged from processed_at — the replay/backfill horizon,
      and the PII cap on verbatim partner payloads (courier names/phones). Unprocessed rows are
      never swept.
  columns:
    avelo37_event_id: { type: text, pk: true }                # partner event id — the idempotent external key
    event_type:       { type: text, index: true }             # partner type, e.g. 'delivery.accepted'
    payload:          { type: jsonb }                         # raw verified partner event, verbatim
    received_at:      { type: timestamptz, index: true }
    processed_at:     { type: timestamptz, nullable: true, index: true }   # NULL ⇒ not yet translated into inbound_events

external_coopcycle_events:
  staging: true
  description: >
    Raw VERIFIED CoopCycle delivery-partner webhook mirror (ADR-20260721-122910, issue #58) — the
    third DeliveryProvider=PARTNER seam after Avelo37, adopting the same two-layer inbox pattern
    (ADR-20260720-015400). The FEDERATION twist: CoopCycle is many self-hosted co-op instances (one
    per city/co-op), not a single central API — so every row records its originating `instance_id`
    (the co-op instance key from the adapter's registry) and the webhook is verified with THAT
    instance's per-instance secret. The endpoint UPSERTs one row per event AFTER raw-body signature
    verification (Stripe-style timestamped HMAC, fail-closed), then the coopcycle-acl translates it
    into an adapted business event (DeliveryAcceptedByPartner / DeliveryRejectedByPartner /
    DeliveryStatusUpdated) staged in journals.yaml#/inbound_events. Redelivery dedupes on the pk and
    ACKs immediately; processed_at is the translation high-water mark, enabling replay/backfill
    without asking the instance to resend.
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (ADR-20260721-025159)
    max_age: '90 days'
    applies_to: >
      Processed rows only (processed_at set), aged from processed_at — the replay/backfill horizon,
      and the PII cap on verbatim partner payloads (courier names/phones). Unprocessed rows are
      never swept.
  columns:
    coopcycle_event_id: { type: text, pk: true }               # idempotent external key = "{instance_id}:{provider event id}" (federation makes provider ids unique only per instance, so the ACL namespaces it)
    instance_id:        { type: text, index: true }            # originating co-op instance (registry key) — the federation dimension
    event_type:         { type: text, index: true }            # partner type, e.g. 'task.accepted' / 'delivery.status_updated'
    payload:            { type: jsonb }                         # raw verified partner event, verbatim
    received_at:        { type: timestamptz, index: true }
    processed_at:       { type: timestamptz, nullable: true, index: true }   # NULL ⇒ not yet translated into inbound_events

external_uber_direct_events:
  staging: true
  description: >
    Raw VERIFIED Uber Direct delivery-partner webhook mirror (ADR-20260721-172500, issue #57) — a
    DeliveryProvider=PARTNER seam via the Uber DIRECT delivery API (not the Uber Eats marketplace),
    adopting the same two-layer inbox pattern as Avelo37/CoopCycle (ADR-20260720-015400). Uber Direct
    is ONE central API (no CoopCycle-style federation), so there is no instance dimension; the delta
    from the other partners is the signature scheme — Uber signs with a plain X-Uber-Signature =
    hex(HMAC-SHA256(webhook_secret, raw_body)), no timestamp. The endpoint UPSERTs one row per event
    AFTER raw-body signature verification (fail-closed), then the uber_direct-acl translates it into an
    adapted business event (DeliveryAcceptedByPartner / DeliveryRejectedByPartner /
    DeliveryStatusUpdated) staged in journals.yaml#/inbound_events. Redelivery dedupes on the pk and
    ACKs immediately; processed_at is the translation high-water mark, enabling replay/backfill without
    asking Uber to resend.
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (ADR-20260721-025159)
    max_age: '90 days'
    applies_to: >
      Processed rows only (processed_at set), aged from processed_at — the replay/backfill horizon,
      and the PII cap on verbatim partner payloads (courier names/phones). Unprocessed rows are
      never swept.
  columns:
    uber_event_id: { type: text, pk: true }               # idempotent external key = the Uber event id (globally unique on Uber's side)
    event_type:    { type: text, index: true }            # Uber webhook kind, e.g. 'event.delivery_status' / 'event.courier_update'
    payload:       { type: jsonb }                         # raw verified partner event, verbatim
    received_at:   { type: timestamptz, index: true }
    processed_at:  { type: timestamptz, nullable: true, index: true }   # NULL ⇒ not yet translated into inbound_events

external_hubrise_callbacks:
  staging: true
  description: >
    Raw VERIFIED HubRise callback mirror (ADR-20260720-015400). pk is the provider event id when
    present, else a UUIDv5 of the raw body. HubRise callbacks carry no state, so the enrichment leg
    (OAuth pull → ACL → ImportCatalog / stock COMMANDS, journaled with channel WORKER) marks
    processed_at — HubRise yields commands, not inbound_events rows (request/report split).
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (ADR-20260721-025159)
    max_age: '90 days'
    applies_to: >
      Processed rows only (processed_at set), aged from processed_at — the replay/backfill horizon.
      Unprocessed rows (enrichment not yet run) are never swept.
  columns:
    callback_id:   { type: text, pk: true }                   # provider event id, else UUIDv5(raw body)
    resource_type: { type: text, index: true }                # HubRise resource: 'catalog' / 'inventory' / …
    event_type:    { type: text }                             # HubRise event: 'update' / 'create' / …
    location_id:   { type: text, nullable: true, index: true }  # HubRise location — maps to the restaurant/catalog
    payload:       { type: jsonb }                            # raw verified callback body, verbatim
    received_at:   { type: timestamptz, index: true }
    processed_at:  { type: timestamptz, nullable: true, index: true }   # NULL ⇒ enrichment not yet run
