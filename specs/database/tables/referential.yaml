version: 2
description: >
  Reference / configuration tables (ADR-0037) — seeded once by a repo script, NOT projected from
  domain_events. Plain tables (no `View_` prefix — they are authoritative seeded data, not projections),
  each marked `reference: true` so the validator accepts them as query `reads` targets alongside the
  event-fed projection views. The codegen emits their structure (CREATE TABLE + indexes); the seed rows
  are applied by a separate migration/seed script. Column `type` is a scalars.yaml `$ref` or an inline SQL
  primitive, like tables/eventstore.yaml.

PricingPolicy:
  reference: true
  # STO-2 closure (DECISIONS §32, 2026-08-14): replicated — its declared readers span read databases
  # (the Cart read-time breakdown in read_order, the admin query on the order boundary). Migrator-
  # seeded-only: no subgraph role writes it; changes go by migration with effective_from (fee_rate IS
  # the take rate). The SEED SCRIPT is part of each read database's recovery path — a replay-only
  # restore comes back EMPTY here (silent misprice / dead checkout); #509's drill asserts seeded row
  # counts. Recorded tripwire: commands.rs names a FUTURE write-path reader (ADR-0016/0017 pricing
  # plug-in) that replication does NOT reach (captain_write is not replay) — that slice owes its own decision.
  replicated: read-databases
  description: >
    Calibratable Captain service-fee policy (ADR-0016/0017); one active row per currency. Seeded with the
    ADR-0017 indicative values: fee_rate 5.0, buyer_share 60.0, margin_low 55.0, margin_high 70.0.
  columns:
    currency:       { type: { $ref: 'scalars.yaml#/CurrencyCode' }, pk: true }
    fee_rate:       { type: numeric }
    buyer_share:    { type: numeric }
    margin_low:     { type: numeric }
    margin_high:    { type: numeric }
    effective_from: { type: timestamptz }

UberEstimationPolicy:
  reference: true
  # STO-2 closure: replicated — read at FOLD time by the OrderTracking uber_* receipt (read_order)
  # and the Catalog uberPrice derivation (read_catalog), plus the admin query; single-home would make
  # the ADR-0025 receipt degrade SILENTLY (indistinguishable from the legitimate no-cuisine null).
  # Migrator-seeded-only; uber_* values are published comparative-advertising claims — changes by
  # migration with effective_from. Seed script is part of each read database's recovery path (#509).
  replicated: read-databases
  description: >
    Per-cuisine Uber Eats price mark-up coefficient (ADR-0024); one row per CuisineCategory. Seeded:
    FAST_FOOD 1.30, PIZZA 1.35, TRADITIONAL 1.40, BISTRONOMIC 1.45, FOOD_TRUCK 1.35.
  columns:
    cuisine_category:  { type: { $ref: 'scalars.yaml#/CuisineCategory' }, pk: true }
    price_coefficient: { type: numeric }
    effective_from:    { type: timestamptz }

UberSplitPolicy:
  reference: true
  # STO-2 closure: replicated — same readers as UberEstimationPolicy (OrderTracking fold, Cart
  # read-time comparison, admin query). Migrator-seeded-only; changes by migration with
  # effective_from. Seed script is part of each read database's recovery path (#509).
  replicated: read-databases
  description: >
    Calibratable Uber Eats split/fee assumptions for the estimated comparison (ADR-0024/0025); one row per
    currency. Seeded: uber_commission_pct 30.0, rider_base_cents 285, rider_per_km_cents 80,
    avg_delivery_fee_cents 399, platform_fee_pct 10.0.
  columns:
    currency:               { type: { $ref: 'scalars.yaml#/CurrencyCode' }, pk: true }
    uber_commission_pct:    { type: numeric }
    rider_base_cents:       { type: integer }
    rider_per_km_cents:     { type: integer }
    avg_delivery_fee_cents: { type: integer }
    platform_fee_pct:       { type: numeric }
    effective_from:         { type: timestamptz }

# --- Delivery dispatch strategy (#60) ---
# The channel CATALOG (partners + spec-level defaults) plus the runtime USAGE config resolved per city /
# restaurant. Spec declares the catalog + mechanism; these config rows carry the "which/where/for whom"
# the spec cannot anticipate (they are seeded/managed, and later API-writable via partner self-registration
# #61). See docs/proposals/delivery-dispatch-strategy-foundation.md.

City:
  reference: true
  # STO-2 closure: zero runtime readers today (only city_id keys elsewhere); the read-side admin/city
  # surface reads it when it lands. Seed script (V0: Tours) is part of read_common's recovery path (#509).
  database: { $ref: 'database/databases.yaml#/read_common' }
  description: >
    A city Captain operates in (#60). The routing scope: CityDeliveryRanking is keyed by city_id and a
    restaurant's dispatch config names its city. Seeded (V0: Tours).
  columns:
    city_id: { type: { $ref: 'scalars.yaml#/CityId' }, pk: true }
    name:    { type: { $ref: 'scalars.yaml#/CityName' } }
    country: { type: { $ref: 'scalars.yaml#/CountryCode' } }

DeliveryChannelCatalog:
  reference: true
  # STO-2 closure: sole port is DispatchStrategyRepository, consumed ONLY write-side
  # (DeliveryDispatchProcess PM + DeliveryOfferTimeoutWorker, captain_write apps joining PM state) —
  # no read-side port exists, so a read database would hand a write-path app a cross-wall CONNECT.
  # "Later API-writable via partner self-registration" (#61) is a recorded future decision, not solved
  # here. Seed script is part of captain_write's recovery path (#509).
  database: { $ref: 'database/databases.yaml#/captain_write' }
  description: >
    Catalog of known delivery channels/partners with their SPEC-LEVEL defaults (#60). One row per channel.
    Per-scope USAGE (ranking, TTL overrides) is runtime config (CityDeliveryRanking), not here. Every
    PARTNER-kind channel must have a wired services.yaml delivery implementation. Seeded: independent (POOL),
    avelo37 / uber_direct / coopcycle (PARTNER).
  columns:
    channel:                   { type: { $ref: 'scalars.yaml#/DeliveryChannelKey' }, pk: true }
    kind:                      { type: { $ref: 'scalars.yaml#/DeliveryChannelKind' } }
    default_offer_ttl_seconds: { type: integer, note: "Spec-level default offer timeout for this channel; a city row may override it, and the global env max TTL caps it (#60)." }
    enabled:                   { type: boolean, note: "A channel can be globally disabled without removing its catalog row." }
    effective_from:            { type: timestamptz }

CityDeliveryRanking:
  reference: true
  # STO-2 closure: same sole write-side port as DeliveryChannelCatalog (DispatchStrategyRepository).
  # Seed script (Tours ranking) is part of captain_write's recovery path (#509).
  database: { $ref: 'database/databases.yaml#/captain_write' }
  description: >
    Per-city ORDERED channel list Captain walks when it dispatches (#60) — the runtime 'content' the spec
    cannot anticipate. Resolution: the latest effective_from set for a city, ordered by rank; a row with a
    null city_id is the platform default. Tours seed (today): (tours, 1, independent), (tours, 2, uber_direct).
  columns:
    id:                   { type: text, pk: true, note: "Surrogate key (e.g. 'tours-1'); the natural key is (city_id, effective_from, rank)." }
    city_id:              { type: { $ref: 'scalars.yaml#/CityId' }, nullable: true, index: true, note: "The city this ranking applies to; NULL = platform default fallback." }
    rank:                 { type: integer, note: "1-based position in the walk order." }
    channel:              { type: { $ref: 'scalars.yaml#/DeliveryChannelKey' } }
    ttl_override_seconds: { type: integer, nullable: true, note: "Per-city offer TTL for this channel (INDEPENDENT's TTL lives here); null = the catalog default. Capped by the global env max (#60)." }
    effective_from:       { type: timestamptz }

RestaurantDispatchConfig:
  reference: true
  # STO-2 closure: same sole write-side port as DeliveryChannelCatalog (DispatchStrategyRepository).
  # Seeded/managed rows are part of captain_write's recovery path (#509).
  database: { $ref: 'database/databases.yaml#/captain_write' }
  description: >
    Per-restaurant dispatch config (#60): the restaurant's city (routing scope), whether Captain or the
    restaurant dispatches, and — for self-dispatch — the restaurant's own delay threshold driving the
    customer 'late' tracking signal (not an escalation). Seeded/managed per restaurant; default mode CAPTAIN.
  columns:
    restaurant_id:             { type: { $ref: 'scalars.yaml#/RestaurantId' }, pk: true }
    city_id:                   { type: { $ref: 'scalars.yaml#/CityId' }, index: true }
    mode:                      { type: { $ref: 'scalars.yaml#/RestaurantDispatchMode' } }
    self_dispatch_ttl_seconds: { type: integer, nullable: true, note: "The restaurant's promised delivery-time threshold when mode=RESTAURANT; on breach the customer's tracking shows 'late' and feeds the satisfaction check (#62). Not a routing escalation." }
    effective_from:            { type: timestamptz }

# --- Process-wide runtime postures (#318) ---

RuntimePosture:
  reference: true
  # STO-2 closure: seeded/UPDATEd, never folded, so in a replay database a restore would silently
  # REVERT an admin-flipped posture to seed: the documented worst failure for a fleet-consistency
  # table on a money path. Hence captain_write (pitr). The governed set is NOT a second argument for
  # that placement: the only tenant the mechanism ever had (PM_MAILBOX_DELIVERY, retired in #242)
  # happened to be write-side, while the contract below restricts its startup readers to no side.
  # Recorded tripwire: a posture whose governed set includes any non-captain_write app (a projector,
  # a subgraph bin, the gateway, an adapter) puts a FAIL-CLOSED startup read across the wall, into the
  # database the split most wants unreachable — that posture's slice owes its own decision (replicate
  # the row, push the value, or a recorded CONNECT).
  database: { $ref: 'database/databases.yaml#/captain_write' }
  description: >
    Process-wide runtime postures — ONE row per posture, read at startup by EVERY process the
    posture governs (#318, ADR-20260803-104819). A posture is DELIBERATELY not an env key:
    per-process env is per-deploy state, and a drifted value across a fleet is how one process
    behaves differently from its peers on a money path. Flip = UPDATE the row + an ORDERED full
    restart of every process that reads it (ADR-20260803-104819 Decision 3); while the row is
    unreadable a governed money lane fails closed (see the ADR).
    CURRENTLY EMPTY: the mechanism's first and only tenant, PM_MAILBOX_DELIVERY, retired with
    `command_journal` in #242 Runtime D (ADR-20260812-000000) — PM mailbox delivery is now
    unconditional, so there is no arm left to pick. The table and its fail-closed read stay for
    the next posture; a posture with no reader would be a control that does nothing, so the row
    was deleted rather than pinned true.
  columns:
    posture:    { type: text, pk: true, note: "The posture key, uppercase snake (e.g. 'PM_MAILBOX_DELIVERY', retired)." }
    enabled:    { type: boolean, note: "The posture value every process adopts at its next startup." }
    updated_at: { type: timestamptz, note: "When the posture last changed — the operator's evidence trail for 'which processes have restarted into it'." }
