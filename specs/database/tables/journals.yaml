version: 5
description: >
  THE WRITE-PATH JOURNAL (ADR-20260731-122500 "the mailbox is the only door", #242 Runtime D) — a
  fifth table category alongside the event store, the projections, the seeded referential tables
  and the raw integration staging, and since Runtime D it holds exactly ONE journal:
  `inbound_messages`, THE MAILBOX. Every write intent, whatever its channel — a GraphQL command, a
  worker-issued command, an adapted inbound fact, a scheduled reminder — is one addressed actor
  message on that single table; `mailbox_partitions` beside it is the per-lane registry, not a
  second journal. The two predecessors are gone: `inbound_events` (the drained adapters' handoff)
  was backfilled into the mailbox and DROPPED by the 20260731143000 migration, and
  `command_journal` (the pre-mailbox command door, ADR-20260720-015300) by 20260812. The mailbox
  NEVER writes domain_events (aggregates own the log via the write-side Repository) and is never
  replayed as state — the event log stays the single source of truth. It is neither projected nor
  a GraphQL `reads` target: the operationStatus resolver serves it directly (transient Operation
  type, no View_*).

inbound_messages:
  description: >
    THE ACTOR MAILBOX (ADR-20260730-231500, PROP-20260728-152752) — one row per message to one
    actor, unifying the retired command_journal (requests) and the retired inbound_events (adapted
    facts) and adding reminders (kind MESSAGE + scheduled_at): every write intent, whatever the channel, addressed
    by (actor_type, actor_id) with actor_type an actors.yaml actor and actor_id the instance
    (= stream id). `position` (one sequence) is the consumption/checkpoint axis — assigned at
    insert for immediate rows, at PROMOTION for scheduled ones, hence nullable. `partition` =
    stable_hash(actor_id) mod the actor's declared mailbox width, stamped at insert. Consumed by
    per-actor-type workers leasing partition ranges in mailbox_partitions; the domain_events
    append and this row's terminal flip commit in ONE transaction under the partition's
    ownership_version guard. operationStatus reads kind = COMMAND rows by message_id — the
    acceptance contract (ADR-20260720-015500) is unchanged. Events appended by a delivery carry
    message_id as domain_events.cause_id. REALIZATION NOTE: live since #242 Runtime C (workers +
    migrations + the resolver flip), and the ONLY door since Runtime D — inbound_events was
    backfilled and dropped (20260731143000), command_journal dropped with the PM legs' flip
    (20260812).
  retention:   # documentary — the executable policy is functions/sweep_retention.sql (#18 pattern)
    max_age: '90 days'
    applies_to: >
      Terminal rows (SUCCEEDED/REJECTED/FAILED/IGNORED/DUPLICATE/CANCELLED), aged from
      completed_at. RECEIVED rows are pending work and SCHEDULED rows are future work — neither is
      ever age-swept; the stale-RECEIVED sweep marks crashed runs FAILED first.
  columns:
    message_id:     { type: { $ref: 'scalars.yaml#/MessageId' }, pk: true, note: "Idempotency identity: the client's acceptance handle (commands) or UUIDv5(source, external_id) (inbound facts) or UUIDv5(actor_id, purpose) (reminders)." }
    position:       { type: bigint, nullable: true, unique: true, note: "From ONE sequence (inbound_messages_position_seq) — the checkpoint axis. NULL while SCHEDULED; stamped at insert otherwise, at promotion when due." }
    kind:           { type: { $ref: 'scalars.yaml#/InboundMessageKind' }, note: "COMMAND | EVENT | MESSAGE — the request/report split as a column." }
    actor_type:     { type: text, index: true, note: "The addressed actors.yaml actor (aggregate or process manager) — validated against the catalog." }
    actor_id:       { type: uuid, index: true, note: "The addressed instance (= stream id), extracted via the actor's declared `identity` property." }
    partition:      { type: smallint, note: "stable_hash(actor_id) mod the actor's mailbox.partitions — stamped at insert so consumption filters cheaply." }
    message_type:   { type: text, note: "commands.yaml / events.yaml key, or a per-actor message declared ON the addressed actor (ADR-20260731-120825 — no third catalog) — validated: in the addressed actor's receives." }
    payload:        { type: jsonb, note: "The BUSINESS payload only — the envelope is the columns (ADR-0041)." }
    payload_hash:   { type: text, note: "sha256 hex over the canonical payload — the duplicate-vs-conflict discriminator (commands)." }
    channel:        { type: { $ref: 'scalars.yaml#/InboundMessageChannel' }, note: "GRAPHQL | WORKER | EXTERNAL." }
    user_id:        { type: uuid, nullable: true, index: true, note: "Acting user's auth subject (null for anonymous/system) — envelope, ADR-0041." }
    user_type:      { type: { $ref: 'scalars.yaml#/UserType' }, note: "Role of the acting principal; TEXT verbatim (ADR-20260728)." }
    correlation_id: { type: { $ref: 'scalars.yaml#/CorrelationId' }, index: true }
    cause_id:       { type: { $ref: 'scalars.yaml#/CauseId' }, nullable: true, note: "Parent message/event id; null for a root command." }
    session_id:     { type: { $ref: 'scalars.yaml#/SessionId' }, nullable: true, index: true, note: "X-SESSION-ID — anonymous ownership scope for operationStatus (commands)." }
    trace_id:       { type: { $ref: 'scalars.yaml#/TraceId' }, nullable: true }
    source:         { type: text, nullable: true, index: true, note: "Owning adapter for kind EVENT ('stripe', 'sirene', …); null otherwise." }
    external_id:    { type: text, nullable: true, note: "Provider event id for kind EVENT; UNIQUE with source (constraints below)." }
    scheduled_at:   { type: timestamptz, nullable: true, note: "Reminders / scheduled operations: eligible only once due (promotion pass)." }
    status:         { type: { $ref: 'scalars.yaml#/InboundMessageStatus' }, index: true, note: "SCHEDULED -> (CANCELLED | RECEIVED); RECEIVED -> SUCCEEDED | REJECTED | FAILED | IGNORED | DUPLICATE." }
    error:          { type: jsonb, nullable: true, note: "{ code, context } on REJECTED/FAILED — surfaced as Operation.errorCode." }
    attempts:       { type: smallint, note: "Delivery attempts whose completion TRANSACTION failed (infrastructure error — the row itself records nothing then, so this counter is incremented OUTSIDE the failed tx). At MAILBOX_MAX_DELIVERY_ATTEMPTS the row flips to FAILED with the error recorded, unblocking the lane (PROP-20260802-223522 D4). Default 0; handler verdicts never touch it." }
    last_attempt_at: { type: timestamptz, nullable: true, note: "When the last FAILED delivery attempt ran — evidence; the schedule lives in next_attempt_at." }
    next_attempt_at: { type: timestamptz, nullable: true, note: "EXPONENTIAL-BACKOFF schedule (ADR-20260803-002712 Q2): attempt N stamps this base * 2^(N-1) seconds out; the drain gate holds the lane (head-of-line WAIT, never a skip) while it is in the future. NULL = deliverable now. Push-driven retries have no natural cadence — without this a nudge storm would burn the whole cap in seconds. With cap 0 (the rollback lever) the interval keeps doubling up to base * 2^16 while the lane waits head-of-line — the admin requeue (#315) is the escape." }
    received_at:    { type: timestamptz, index: true }
    completed_at:   { type: timestamptz, nullable: true }
  constraints:
    - unique: [source, external_id]    # delivery-level dedupe for adapted facts (partial in DDL: WHERE source IS NOT NULL — slice-3 migration detail)
  indexes:
    - [actor_type, partition, position]   # the drain index (partial WHERE status = RECEIVED in the migration)
    - [actor_type, partition]             # poison supervision count (partial WHERE FAILED + DeliveryInfrastructureError in the migration)
    - [actor_id, position]                # per-instance history + the Reminders-companion load
    - [scheduled_at]                      # the promotion pass (partial WHERE status = SCHEDULED in the migration)

mailbox_partitions:
  description: >
    THE PARTITION REGISTRY (PROP-20260728-152752 §3/§3.1) — one row per (actor_type, partition),
    seeded from each actor's declared mailbox.partitions width. Carries the three per-partition
    facts in one row: the CHECKPOINT (every mailbox position at or below it is terminal — bounds
    the drain scan, never defines truth), the LEASE (claimed_by + lease_until: worker ownership
    with heartbeat renewal and expiry takeover — no coordinator), and the OWNERSHIP_VERSION (the
    fencing counter, incremented on every ownership change and asserted inside every completion
    transaction: a stale owner's commit matches 0 rows and rolls back whole, event append
    included). The doubling of checkpoint table and lease table is deliberate — one row is the
    single authority on a partition. Also the ops surface: the mailbox lane monitor reads it.

    NOT THE ROUTING SOURCE (#596). This table answers "who owns this lane, and how far has it
    got" — lease, ownership_version, checkpoint, and the ops monitor. It never answers "which
    lane does this aggregate belong to": that is `stable_partition(actorId, width)` where width
    is the DECLARED actors.yaml `mailbox.partitions`, read through the one accessor
    `actor_client::declared_lane`. The rows here are a RUNTIME artifact — nothing seeds them but
    a worker starting up, migrations never touch them — so they can legitimately be absent,
    partial or stale, and a routing function that consulted them addressed a keyspace no other
    producer shared. Because the lease and the completion fence are both keyed by LANE, two
    producers disagreeing on the width put one aggregate in two lanes, each with a live lease,
    each passing its own fence: one-writer breaks at the addressing function, upstream of any
    fence. A CHANGE to a declared width is therefore a stored-shape MIGRATION, not a config
    edit — `inbound_messages.partition` is stamped at INSERT — and its cutover requires the
    affected actor's inbound_messages backlog drained (or exactly one worker running) before the
    new width serves. `seed_partitions` refuses to start on a non-empty registry that describes a
    different keyspace; an EMPTY registry is a first boot, not drift.
  columns:
    actor_type:        { type: text, pk: true, note: "actors.yaml actor." }
    partition:         { type: smallint, pk: true, note: "0 .. mailbox.partitions-1." }
    ownership_version: { type: bigint, note: "Fencing counter — an ownership counter, NOT a date (PROP-20260728-152752 §3.1). Default 0." }
    claimed_by:        { type: text, nullable: true, note: "Worker instance id; NULL = unowned. Carries a reachable address once the direct-call door opens (D7)." }
    lease_until:       { type: timestamptz, nullable: true, note: "Past or NULL = claimable; renewed by heartbeat (~10s), ~30s ahead." }
    checkpoint:        { type: bigint, note: "Largest position with everything at or below it terminal, advanced with grace lag; a below-checkpoint audit expects 0 rows. Default 0." }
