version: 1
description: >
  THE DATABASE CATALOG (#494 slice 1) — the eleven databases the storage split creates, as
  DECLARATIONS: name, owning role, the K8s object-name binding, and the recovery posture. Nothing
  else lives here on purpose: grants are #513's emitter (derived from this catalog plus the role
  model, never hand-written), migration chains and the REQUIRED_SCHEMA_VERSION map are #514's,
  restore-drill legs are #509's, and retention/backup schedules/PII class are inventory for their
  own named slices. Decided by PROP-20260811-093000 (register rows STO-1(a)/STO-2(a), DECISIONS §32)
  and ADR-20260812-115930 "Each adapter owns its own, completely isolated database" (ADP-1, both
  legs closed). The resolved placement inventory — which tables land where — is GENERATED into
  specs/generated/databases.generated.{md,json}; that artifact, not the prose maps in the ADR or
  the proposal, is the live source.

  NAMES ARE UNDERSCORED, ALWAYS (`adapter_stripe`, never `adapter-stripe`): a hyphen in a Postgres
  database name is a quoted identifier in every DSN, psql invocation and GRANT forever. The
  Kubernetes object name (the CNPG `Database` CR, which cannot carry an underscore — RFC 1123) is
  the `k8sName` binding declared per entry, so the two spellings can never drift apart silently.

  PLACEMENT GRAMMAR (consumed by the validator in this slice, by #513's emitter next):
    - The four write-side kinds — event store, journals, PM state, reservations — are DERIVED into
      `captain_write` mechanically from the table-kind classifier. STO-1(a) is a correctness fact,
      not a choice: the fenced completion transaction commits the handler's appends, the mailbox
      terminal flip and the fenced checkpoint advance atomically, and separating the log from the
      mailbox deletes the FENCING TOKEN, not merely atomicity. A `database:` key on these kinds is
      an ERROR, so the transactional unit cannot be edited apart one table at a time.
    - Staging and connection tables DECLARE `database:` as a `$ref` into this catalog
      (ADR-20260811-014129 Decision 2: a reference is a `$ref`; a bare string is invisible to the
      refs walker — the #413 defect class). Absence is an ERROR, never `captain_write`-by-omission.
    - `replicated: read-databases` is the REPLICATED placement class (STO-2(a)): the table is
      projected — or, for a seeded referential, SEEDED — into EVERY read database; the resolved set
      is every database declared `recovery: replay`, which is the definition of a read database
      (its whole content is a re-derivable fold of the log), not a naming pun. In the class:
      `ScopeMembership`, and the pricing referentials `PricingPolicy` / `UberEstimationPolicy` /
      `UberSplitPolicy` (STO-2 closure — their declared readers span three read databases);
      `projection_checkpoint` (runtime machinery, not spec-declared) is per-read-database by the
      same rule.
    - Every business read model and referential table DECLARES its placement (`database:` `$ref` or
      `replicated:`): register row STO-2 CLOSED 2026-08-14 (DECISIONS §32 "STO-2 closure" — the
      17-table map with per-table port evidence), so absence is an ERROR for these kinds too, never
      a default. A seeded referential's SEED SCRIPT is part of its database's recovery path — a
      replay-only restore comes back empty otherwise (#509's drill asserts seeded row counts).

  RECOVERY is the one attribute carried beyond identity, because the drill slice (#509) consumes it
  and non-rederivability must be declared where the database is:
    pitr            — irreplaceable; WAL archiving + point-in-time recovery, rehearsed restores.
    replay          — re-derivable from the log; recovery is projector replay from checkpoint 0.
    refetch         — re-derivable from the external partner; recovery is re-ingestion.
    backup-required — NOT re-derivable and not on the PITR path; needs its own backup story.

# ── The write-side transactional unit ────────────────────────────────────────────────────────────

captain_write:
  description: >
    The write side, ONE database (STO-1(a), widened from the directive's `DomainEventLogDb` and
    renamed so the contents are not surprising): `domain_events` + `domain_stream`, the actor
    mailbox (`inbound_messages` + `mailbox_partitions`), the four `*_process_manager` state
    tables and `slug_reservations` — everything the fenced completion transaction touches. Plus
    the two PLATFORM connection tables that are deliberately NOT adapter state:
    `auth_sessions` (ADP-1 leg 2 (b) — encrypted, used by the actor path and the BFF login route,
    not by any adapter) and `sms_send_quota` (a cross-replica money ceiling on the OTP send path).
    And, since the STO-2 closure (DECISIONS §32), the write-side-read configuration: the dispatch
    trio `DeliveryChannelCatalog` / `CityDeliveryRanking` / `RestaurantDispatchConfig` (sole port
    `DispatchStrategyRepository`, consumed only by the dispatch PM and the offer-timeout worker)
    and `RuntimePosture` (startup-read by every governed process; seeded/UPDATEd, never folded, so
    a replay restore would silently revert an admin-flipped posture — it must sit on the pitr path).
  owner: migrator          # PROP-20260811-093000 §6.1 — the CI-only DDL credential owns the business schemas
  k8sName: captain-write
  recovery: pitr

# ── The read databases (recovery: replay IS the class the replicated placement resolves to) ──────

read_order:
  description: >
    `OrderDb` in PROP-20260811-093000 §11 — the ORDER boundary's read models: Cart, OrderTracking,
    OrderConversation and CustomerCreditBalance (DECLARED — STO-2 closure, DECISIONS §32; comms and
    payments scopes serve inside the order boundary per §31/BND-1), plus the replicated
    authorization index, the replicated pricing referentials and its own `projection_checkpoint`.
    Written by its projector role, read by its subgraph role; no other subgraph holds CONNECT — the
    wall the split is bought for.
  owner: migrator
  k8sName: read-order
  recovery: replay

read_catalog:
  description: >
    `CatalogDb` in PROP-20260811-093000 §11 — the catalog boundary's read models (the Catalog
    projection, DECLARED — STO-2 closure, DECISIONS §32), plus the replicated authorization index,
    the replicated pricing referentials (the Catalog uberPrice derivation reads
    UberEstimationPolicy locally) and its own `projection_checkpoint`.
  owner: migrator
  k8sName: read-catalog
  recovery: replay

read_common:
  description: >
    `DomainCommonDb` in PROP-20260811-093000 §11 — the shared read database for the remaining
    scopes' read models: Customer, Restaurant, SlugAlias, ProspectionPipeline and the City
    referential (DECLARED — STO-2 closure, DECISIONS §32; the rider `View_*` read models follow
    their conversion), plus the replicated authorization index, the replicated pricing referentials
    and its own `projection_checkpoint`. One NON-subgraph reader is part of its reader set and is
    recorded here on purpose: the gateway tenant-host-router reads Restaurant + SlugAlias on EVERY
    request's hot path (c4-l3.yaml tenant-host-router). Distinct from the `specs/common` kernel
    scope: this is a shared READ store, not shared doctrine.
  owner: migrator
  k8sName: read-common
  recovery: replay

# ── Behaviour tracking (own cluster when it ships — STO-3 (c)) ───────────────────────────────────

tracking:
  description: >
    `BehaviorEventTrackingDb` (PROP-20260811-093000 §9) — declared now so the catalog is the
    complete set of eleven, holding ZERO tables until the first tracking table lands in the spec.
    Deliberately NO waiver mechanism exists for it: the day its first table is declared, that table
    owes a placement AND the §9.4 retention policy in the same change (unbounded growth arithmetic:
    ~17.5 GB/yr, ~13x the business log). Its projector never reads the business log (§9.2) and it
    moves to its own cluster when it ships (STO-3 (c)) — CNPG base backups are physical, so
    excluding it from the business PITR is only real once it is out.
  owner: migrator
  k8sName: tracking
  recovery: backup-required   # neither irreplaceable nor replayable (§9.1): daily logical dump, honest "a restore loses up to a day"

# ── The six adapter databases (ADP-1, ADR-20260812-115930 — completely isolated, one owning app) ──

adapter_stripe:
  description: >
    Stripe's isolated database: the verified webhook mirror. Owning app: the stripe adapter; its
    one outward grant is INSERT into `inbound_messages` on captain_write (ADP-1 leg 1 (a) — the
    ACL/mailbox front door).
  owner: adapter_stripe
  k8sName: adapter-stripe
  recovery: refetch

adapter_hubrise:
  description: >
    HubRise's isolated database: the callback mirror AND the connection/credential tables. The one
    adapter database that must be inside a backup story: `hubrise_connections.access_token` is a
    NON-expiring OAuth token only a human re-connect can replace (#508 tracks that it is also
    plaintext, so the backup story is simultaneously a leak story) — hence `backup-required` where
    every sibling mirror is `refetch`.
  owner: adapter_hubrise
  k8sName: adapter-hubrise
  recovery: backup-required

adapter_uber_direct:
  description: >
    Uber Direct's isolated database: the verified webhook mirror (one central API, no federation
    dimension).
  owner: adapter_uber_direct
  k8sName: adapter-uber-direct
  recovery: refetch

adapter_coopcycle:
  description: >
    CoopCycle's isolated database: the verified webhook mirror (federated — rows carry their
    originating co-op `instance_id`).
  owner: adapter_coopcycle
  k8sName: adapter-coopcycle
  recovery: refetch

adapter_avelo37:
  description: >
    Avelo37's isolated database: the verified webhook mirror. In the set from day one —
    ADR-20260812-115930 records that its first version claimed avelo37 "owns no table today",
    which was false, and left uncorrected would have kept the one partner mirror (courier names
    and phones in verbatim payloads) inside the write database while every sibling moved out.
  owner: adapter_avelo37
  k8sName: adapter-avelo37
  recovery: refetch

adapter_sirene:
  description: >
    The SIRENE mirror's isolated database (655 MB once, #231). The stated naming asymmetry: no
    `crates/adapters/sirene` crate exists — the mirror's sole reader/writer is the
    `worker-sirene-sync` CronJob (plus the offline `sirene_ingest` loader), and the database is
    named for the partner data, not for a crate invented to justify it. The test it passes is the
    one that matters: exactly one app connects, and it owns the mirror.
  owner: worker_sirene_sync
  k8sName: adapter-sirene
  recovery: refetch
