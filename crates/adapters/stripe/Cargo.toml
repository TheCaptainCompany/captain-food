[package]
name = "stripe-adapter"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
description = "Stripe partner adapter (ADR-20260718-213352): a self-contained vertical slice — the ACL (Stripe-Signature verification + event mapping + idempotent ingestor over the EventStore port) and its HTTP shell (POST /adapters/stripe/webhooks). Exposes `routes()` for the monolith to mount, and a standalone `stripe-webhook` binary so it can deploy as its own web service, isolated from other partners."

[dependencies]
# Inner layers only (dependency rule): the ACL maps Stripe shapes onto domain events via the application
# EventStore port — it does NOT depend on `infrastructure` for its logic.
application = { path = "../../application" }
# The actor-mailbox boundary crate (#290 phase 1, PROP-20260802-130500 D1): this adapter addresses
# actors ONLY through its generated typed clients; phase 2 narrows this to per-actor client crates.
actor_client = { path = "../../actor_client" }
# PROP-20260802-130500 phase 2 (#306): one dependency per actor this crate may address.
# An actor absent from this list is an actor whose client type does not exist here.
client-payment = { path = "../../clients/payment" }

domain = { path = "../../domain" }
# The standalone binary (main.rs) constructs a concrete Postgres EventStore.
infrastructure = { path = "../../infrastructure" }

axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
# Signature verification (same versions as the workspace's other HMAC users).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# The outbound PaymentGateway impl is an async trait; same crate the application port uses.
async-trait = { workspace = true }
# Outbound Stripe API client (create PaymentIntent / request refund). Same crate + features as the
# HubRise outbound client: default-features off + native-tls to match the workspace TLS choice.
# Instrumentation (issue #191): the `payment.intent.create` CLIENT span of the place-order contract.
telemetry = { path = "../../telemetry" }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[dev-dependencies]
# D5 test-fixtures (PROP-20260802-130500): the in-memory mailbox double for this adapter's tests.
actor_client = { path = "../../actor_client", features = ["test-fixtures"] }

# D6 lint floor (PROP-20260802-130500, #302): a BOUNDARY crate restates the workspace baseline
# and additionally denies `unreachable_pub` -- on a boundary, a `pub` item nobody outside uses is
# an open door someone WILL use (the mechanical form of ADR-20260802-170059). Cargo lint
# inheritance is all-or-nothing, hence the restated `unsafe_code`.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
