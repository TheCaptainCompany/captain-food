[package]
name = "application"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
description = "Captain.Food application layer: use cases — ports (traits infrastructure must implement), CQRS command/query handlers, and process managers (sagas). Depends on `domain` ONLY (ADR-0035); must never depend on infrastructure/server/web."

[features]
# Cross-crate TEST access to the requeue-port witness (#510, the PROP-20260802-130500 D5 mechanism
# applied at this crate): `MailboxRequeueAccess::for_tests()`. Enabled ONLY from [dev-dependencies]
# — the codegen guard `test_fixtures_feature_never_reaches_a_release_artifact` fails the build if
# any [dependencies] entry (i.e. a release artifact) turns it on.
test-fixtures = []

[dependencies]
domain = { path = "../domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# The Actor envelope (ADR-0041) carries raw uuid ids; the typed domain ids wrap the same type.
# `v5` on top of the workspace features: DeliveryDispatchProcess derives a DETERMINISTIC delivery-job
# id (UUIDv5 of the order id) so re-reacting to the same OrderMarkedReady is idempotent.
# `v7` (ADR-20260720-015300): server-generated messageId/inbound_event_id are time-ordered UUIDv7.
uuid = { workspace = true, features = ["v5", "v7"] }
# Canonical command payload hash (journal duplicate-vs-conflict discriminator, ADR-20260720-015300).
sha2 = "0.10"
hex = "0.4"
# HMAC-hashing the email address before it becomes a `sms_send_quota` key (round 2 R2-V1, legal
# Art. 5(1)(e) storage limitation): `crates/infrastructure` already depends on the same RustCrypto
# family for AUTH_SESSION_KEY, so this adds no new build weight to the workspace.
hmac = "0.12"
# base64url for behaviour_support's FakeIdentity (#437): the double mints an unsigned but DECODABLE
# JWT whose payload reflects what was stamped, so tests assert the PARKED token's claims by
# behaviour (decode) rather than by call log. A pure encoding utility, same class as `hex`.
base64 = "0.22"
# The `tracing` FACADE ONLY (issue #191) — deliberately NOT `crates/telemetry`, and NOT any
# `opentelemetry*` crate. The line this layer sits on: **it may say things, only boundaries may measure
# them.** So process managers and handlers emit levelled, structured EVENTS (which inherit the ambient
# span opened by the saga runner or the GraphQL dispatch, and so arrive already carrying
# `correlation_id`), but never open a span, record a metric, or know that OpenTelemetry exists.
#
# The alternative was leaving these as `eprintln!`. That would have kept exactly the output issue #191
# exists to end: a saga leg skipping a Stripe refund, printed to stdout with nothing to correlate it to
# the order it belongs to. A dependency test enforces both halves — the facade is allowed here, the SDK
# is not, and `domain` gets neither.
tracing = "0.1"

[dev-dependencies]
# Async runtime for the behaviour tests (tests.yaml Given/When/Then over the command handlers).
tokio = { workspace = true }
# DEV-ONLY cycle, deliberately (PROP-20260802-130500 D1/D5): the generated behaviour tests assert
# the `schedules:` third effect through the mailbox door, which lives in the actor_client boundary
# crate above this one. Cargo permits dev-dependency cycles (the lib graph stays acyclic); the
# `test-fixtures` feature is what exposes the mem double, and only dev-dependencies may enable it.
actor_client = { path = "../actor_client", features = ["test-fixtures"] }

# D6 lint floor (PROP-20260802-130500, #302): inherit the workspace [lints] baseline.
[lints]
workspace = true
