# The PROBE + TELEMETRY floor of every bin (#385, ADR-20260807-183024 — API-tier wiring).
#
# Hand-written, factored OUT of `bin_runtime` so the pure API-tier families (gateway-{role},
# fo-*/bo-* surfaces) can serve the probe contract and initialize telemetry WITHOUT linking
# `infrastructure` (and, transitively, the whole domain facade). `bin_runtime` depends on this
# crate and re-exports its items, so the CQRS-spine mains generated by PR #387 are untouched.
# NOTHING in here may touch the database or any domain type — that is the point of the crate.
[package]
name = "bin_probes"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
description = "Captain.Food bin probe/telemetry floor: build identity, telemetry init, the /health + /ping server and graceful drain shared by every deployable (#385)."

[dependencies]
telemetry = { path = "../telemetry" }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

# D6 lint floor (PROP-20260802-130500, #302): inherit the workspace [lints] baseline.
[lints]
workspace = true
