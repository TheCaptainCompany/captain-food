# Captain.Food — the ACTOR-CLIENT crate: the compiler-enforced door to the actor mailbox
# (PROP-20260802-130500 D1, realized under #290 phase 1).
#
# THE CRATE IS THE PERMISSION: `MailboxEntry` lives here with pub(crate) fields, its constructors
# are crate-internal, and the generated typed actor clients (src/generated/actor_clients.rs) are
# the only code that can assemble a mailbox row. Obtaining a `MailboxEntry` outside this crate
# DOES NOT COMPILE — the textual door guard (`mailbox_entry_is_constructed_only_behind_the_typed_doors`)
# stays as the belt-and-braces tripwire on the boundary itself.
#
# Position in the graph (outer -> inner): infrastructure/server/adapters -> actor_client ->
# application -> domain. This crate owns the mailbox PORT (the trait `infrastructure::PgMailbox`
# implements over SQL) and the frozen partition routing; it holds NO sqlx and NO reqwest — it is a
# door, not an adapter (the D3 capability allowlist proves that stays true).
[package]
name = "actor_client"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
description = "Captain.Food actor-client boundary crate: the Mailbox port, the private MailboxEntry + Envelope, the generated per-actor typed clients (write door) and the generic ActorClient (read door). The ONLY crate that can construct a mailbox row (PROP-20260802-130500 D1/D4)."

[features]
# Cross-crate TEST access (PROP-20260802-130500 D5): the entry fixture constructor/destructurer,
# the in-memory mailbox double and the drift-guard reference implementations. Enabled ONLY from
# [dev-dependencies] — the codegen guard `test_fixtures_feature_never_reaches_a_release_artifact`
# fails the build if any [dependencies] entry (i.e. a release artifact) turns it on.
test-fixtures = []
# The D8-deferred UNTYPED bulk fact door (`enqueue_inbound_facts` + `InboundFact`), #290 review
# BLOCKING-1a: only `infrastructure` may enable this (its SIRENE sweep is the one sanctioned
# producer) — the codegen guard `bulk_door_feature_is_granted_only_to_infrastructure` fails the
# build on any other manifest grant. Facts entering here are receives-validated at the door.
bulk-door = []

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
# The operation-response bus (#303) is a tokio broadcast channel; also the async runtime for the
# in-crate tests (drift guards, watch semantics).
tokio = { workspace = true, features = ["sync"] }

# D6 lint floor (PROP-20260802-130500, #302): a BOUNDARY crate restates the workspace baseline
# and additionally denies `unreachable_pub` -- on a boundary, a `pub` item nobody outside uses is
# an open door someone WILL use (the mechanical form of ADR-20260802-170059). Cargo lint
# inheritance is all-or-nothing, hence the restated `unsafe_code`.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
