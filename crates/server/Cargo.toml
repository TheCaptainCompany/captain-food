[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
description = "Captain.Food Axum BFF: the composition root that injects infrastructure adapters into the application, exposes GraphQL (role-as-path) + the SDUI hydration endpoint, and hosts tenant/auth/tracing middleware. Depends on `application` + `infrastructure` + `shared_types` (ADR-0035). Exposes a lib (wiring) so `desktop` can embed it."

[dependencies]
regex = "1"
application = { path = "../application" }
# The role-gateway runtime's document walker (#385, D8): the subgraph scope slice checks EXACTLY
# the fields the gateway routes on — one walk, two walls, no drift.
gateway_runtime = { path = "../gateway_runtime" }
# Host classification + tenant landings (#385): moved to the surface runtime (the surface bins
# serve the same hosts); `hosts` re-exports them — one implementation, two hosts.
surface_runtime = { path = "../surface_runtime" }
# The actor-mailbox boundary crate (#290 phase 1, PROP-20260802-130500 D1/D4): the generated
# resolvers send through its typed clients and read operation status through its ActorClient.
actor_client = { path = "../actor_client" }
# PROP-20260802-130500 phase 2 (#306): one dependency per actor this crate may address.
# An actor absent from this list is an actor whose client type does not exist here.
client-cart = { path = "../clients/cart" }
client-catalog = { path = "../clients/catalog" }
client-conversation = { path = "../clients/conversation" }
client-customer = { path = "../clients/customer" }
client-delivery-job = { path = "../clients/delivery-job" }
client-delivery-partner-registration = { path = "../clients/delivery-partner-registration" }
client-mailbox-supervision = { path = "../clients/mailbox-supervision" }
client-order = { path = "../clients/order" }
client-place-order-process = { path = "../clients/place-order-process" }
client-prospect = { path = "../clients/prospect" }
client-reclamation = { path = "../clients/reclamation" }
client-refund-process = { path = "../clients/refund-process" }
client-restaurant = { path = "../clients/restaurant" }
client-restaurant-account = { path = "../clients/restaurant-account" }
client-rider = { path = "../clients/rider" }

# The generated GraphQL layer wraps the domain scalars/enums (orphan rule: the async-graphql wrapper
# newtypes + From conversions live here, `domain` stays GraphQL-free — ADR-0035).
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure" }
# The mailbox worker spawn + partition seeding in the composition root (#242 Runtime C3). The
# generated resolvers no longer touch it (#284 slice 2: the typed actor clients own partitioning).
actor_runtime = { path = "../actor_runtime" }
shared_types = { path = "../shared_types" }
# OTel emission + structured logging (issue #191). The composition root installs the subscriber and owns
# the flush guard; the GraphQL gateway and middleware are the boundaries that open spans.
telemetry = { path = "../telemetry" }
tracing = "0.1"
# Partner webhook adapters (ADR-20260718-213352) — self-contained crates the monolith mounts via
# `<crate>::routes(...)`; each also ships a standalone binary for independent deployment.
stripe-adapter = { path = "../adapters/stripe" }
avelo37-adapter = { path = "../adapters/avelo37" }
coopcycle-adapter = { path = "../adapters/coopcycle" }
uber-direct-adapter = { path = "../adapters/uber_direct" }
hubrise-adapter = { path = "../adapters/hubrise" }
# The SDUI web app (split 4/4 of #21): the server-side (ssr) renderer — the host fallback serves the
# generated screen trees as SSR pages; the wasm bundle hydrates them (built in the Docker image).
web = { path = "../web" }
# Static assets: /assets/* serves the wasm-bindgen bundle out of WEB_ASSETS_DIR (Docker: /app/web-assets).
tower-http = { version = "0.6", features = ["fs"] }

# Generated GraphQL type layer: wrapper scalar inners (uuid/chrono) + serde derives.
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# HTTP surface + DB health probe (ADR-0042) + GraphQL BFF (ADR-0006 role-as-path, with the generated
# per-role guard/visible ACL enforced at runtime). The tenant/auth (identity) middleware lands later;
# today the server binds $PORT, serves /health, and exposes the role-filtered GraphQL schema per path.
# `ws` on top of the workspace features: the GraphQL-over-WebSocket upgrade on `/{role}/graphql`
# (subscriptions — async-graphql-axum's GraphQLWebSocket runs over axum's WebSocket).
axum = { workspace = true, features = ["ws"] }
# `sync` (RwLock) added for the JWKS cache in the ADR-0047 auth verifier, on top of the workspace features.
tokio = { workspace = true, features = ["sync"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
# The generated SubscriptionRoot resolvers are hand-shaped `stream! { ... }` state machines over the
# in-process EventBus (subscribe → filter by correlation → re-resolve the read model) — `async-stream`
# keeps that generated code readable instead of hand-rolled `unfold` plumbing.
async-stream = "0.3"
# API auth (ADR-0047): verify Supabase-issued JWTs against the project's PUBLIC keys (JWKS) — the signing
# secret never touches this server. `jsonwebtoken` does the signature/claims verification; `reqwest` fetches
# the JWKS (default-features off + native-tls, matching the workspace sqlx/infra TLS choice).
# `rust_crypto` selects the RustCrypto signature backend explicitly: with no backend feature the crate
# compiles but PANICS at runtime on the first verification ("Could not automatically determine the
# process-level CryptoProvider"), turning every authenticated request into a 502.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# The in-process SSR transport (#92) implements web's object-safe async Transport seam.
async-trait = { workspace = true }

[dev-dependencies]
# The #474 database-test gate: DB-gated suites are REQUIRED by default and skip only under an
# explicit `DB_TESTS_REQUIRED=0`, which leaves a receipt. Dev-only -- the release graph never
# links it (std-only, no build cost).
db-test-gate = { path = "../db_test_gate" }
# In-memory read-repository stand-ins for the subscription tests (no DB needed).
async-trait = { workspace = true }
# The #440 emission proof (tests/checkout_degraded_metric.rs): a real SdkMeterProvider with the
# SDK's own in-memory exporter observes checkout_degraded_render_total actually firing through
# the production render path — the first declared metric in this repo proved emitted, not assumed.
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "testing"] }
# The D5 `test-fixtures` gate (PROP-20260802-130500): the typed-send freeze test destructures the
# EntryFixture mirror exhaustively, and the write-path tests seed mailbox rows through it — a
# release build of the server never sees these doors.
actor_client = { path = "../actor_client", features = ["test-fixtures"] }

# D6 lint floor (PROP-20260802-130500, #302): inherit the workspace [lints] baseline.
[lints]
workspace = true
