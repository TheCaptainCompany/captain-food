[package]
name = "telemetry"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "OpenTelemetry emission + structured logging for Captain.Food (issue #191). A FRAMEWORK-boundary crate: the domain and application layers must never depend on it."

[dependencies]
# The tracing facade + the OTel bridge. `tracing` is the API the instrumented boundaries call; the
# OpenTelemetry layer turns those spans into OTLP. Business code never imports either (ADR-0035, the
# `domain`/`application` layers list neither this crate nor these deps — enforced by a workspace test).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "json",
    "env-filter",
    "registry",
    "ansi",
] }
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }

opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "rt-tokio"] }

# OTLP over HTTP/protobuf. No client feature is enabled on purpose: `reqwest-client` would pull
# reqwest 0.13 with NO default features, i.e. no TLS backend at all, and `reqwest-rustls` would drag in
# `ring` — which this workspace deliberately avoids (see the root Cargo.toml note on native-tls: it maps
# to SChannel on Windows dev boxes and OpenSSL on Render's build image, neither needing a C toolchain for
# ring). Instead we hand the exporter the house reqwest 0.12 client through `HoneycombHttpClient`, which
# also keeps ONE reqwest version in the tree instead of compiling two.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "trace",
    "metrics",
] }
opentelemetry-http = { version = "0.32", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
http = "1"
bytes = "1"
async-trait = { workspace = true }
